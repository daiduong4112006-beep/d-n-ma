    <meta charset="UTF-8" />
    <script>
      // Fix "Cannot set property fetch of #<Window> which has only a getter" in sandboxed iframes/extensions
      (function () {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var customFetch = originalFetch;

          try {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return customFetch;
              },
              set: function (newFetch) {
                customFetch = newFetch;
              },
              configurable: true,
              enumerable: true,
            });
          } catch (err1) {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function () {
                  return customFetch;
                },
                set: function (newFetch) {
                  customFetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            }
          }
        } catch (e) {
          console.warn('[Fetch Shim] Failed to define fetch setter:', e);
        }
      })();
    </script>
