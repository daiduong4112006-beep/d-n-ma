name: Kiểm tra code

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cài thư viện
        run: npm install --no-audit --no-fund
      - name: Kiểm tra TypeScript
        run: npx tsc --noEmit -p .
      - name: Build thử
        run: npm run build
