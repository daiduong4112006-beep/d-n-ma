e Gaussian variable <span class=\"mjx-i\">\\(X \\sim \\mathcal{N}\\left(\\begin{bmatrix}1 \\\\ 2\\end{bmatrix},\\begin{bmatrix}2 &amp; 1 \\\\ 1 &amp; 1\\end{bmatrix}\\right).\\)<\/span> Let <span class=\"mjx-i\">\\(Y\\)<\/span> be variable defined by <span class=\"mjx-i\">\\(y=\\begin{bmatrix}1 &amp; -1 \\\\ 0 &amp; 2\\end{bmatrix}x.\\)<\/span> Find the mean of <span class=\"mjx-i\">\\(Y\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\begin{bmatrix}-1 &amp; 2\\end{bmatrix}^{T}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\begin{bmatrix}-1 &amp; 4\\end{bmatrix}^{T}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\begin{bmatrix}2 &amp; -1\\end{bmatrix}^{T}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\begin{bmatrix}4 &amp; -1\\end{bmatrix}^{T}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q63\"><strong>Câu 6.9<\/strong> <code>[SU24-RE Q30]<\/code>\nConsider the mixture of two Gaussians <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>\n<div class=\"mjx-d\">\\[p\\left(\\begin{pmatrix}x\\\\y\\end{pmatrix}\\right) = 0.2\\mathcal{N}\\left(\\begin{pmatrix}8\\\\1\\end{pmatrix}, \\begin{pmatrix}1 &amp; 0\\\\0 &amp; 1\\end{pmatrix}\\right) + 0.6\\mathcal{N}\\left(\\begin{pmatrix}1\\\\0\\end{pmatrix}, \\begin{pmatrix}3 &amp; 1\\\\1 &amp; 2\\end{pmatrix}\\right).\\]<\/div><\/p>\n<p>The mean of <span class=\"mjx-i\">\\(X - 2Y\\)<\/span> is<\/p>\n<ul>\n<li>(i) 1.6<\/li>\n<li>(ii) 2<\/li>\n<li>(iii) 2.2<\/li>\n<li>(iv) 1.8<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q64\"><strong>Câu 6.10<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nConsider the bivariate Gaussian distribution\n<div class=\"mjx-d\">\\[p(x,y)=\\mathcal{N}\\left(\\begin{bmatrix}1\\\\2\\end{bmatrix},\\begin{bmatrix}2&amp;1\\\\1&amp;1\\end{bmatrix}\\right).\\]<\/div>\nCompute the mean of <span class=\"mjx-i\">\\(3X+4Y\\)<\/span>.<\/p>\n<p class=\"qh\" id=\"MAI391-6-q65\"><strong>Câu 6.11<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nLet <span class=\"mjx-i\">\\(W=[X\\ Y]^T\\)<\/span> be a two-dimensional random variable with normal distribution <span class=\"mjx-i\">\\(W=N(\\mu,\\Sigma)\\)<\/span>, where\n<div class=\"mjx-d\">\\[\\mu=[1\\ \\ -1]^T,\\qquad\\Sigma=\\begin{bmatrix}2&amp;0\\\\0&amp;5\\end{bmatrix}.\\]<\/div>\nFind the probability density function <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of <span class=\"mjx-i\">\\(W\\)<\/span>.<\/p>\n<hr/>\n<\/div><\/details><h1 id=\"MAI391-6-h16\"><span class=\"pn\">Phần 4<\/span>Nhìn đề → nhận ra dạng<\/h1>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Từ khóa trong đề<\/th>\n<th>Dạng<\/th>\n<th>Việc cần làm ngay<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>discrete uniform … integers … through …<\/em><\/td>\n<td>1<\/td>\n<td>Đếm số phần tử thỏa / tổng số phần tử<\/td>\n<\/tr>\n<tr>\n<td><em>continuous uniform over <span class=\"mjx-i\">\\([a,b]\\)<\/span><\/em><\/td>\n<td>1<\/td>\n<td>Độ dài đoạn thỏa / <span class=\"mjx-i\">\\((b-a)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>How many possible values does <span class=\"mjx-i\">\\(Z\\)<\/span> have<\/em><\/td>\n<td>1<\/td>\n<td><span class=\"mjx-i\">\\(|k|=1,2,\\ge3\\)<\/span> cho <span class=\"mjx-i\">\\(5,7,9\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(\\Omega=\\{\\omega_1,\\omega_2\\}\\)<\/span>, <em>independent<\/em><\/td>\n<td>1<\/td>\n<td>Nhân xác suất biên<\/td>\n<\/tr>\n<tr>\n<td><em>cumulative distribution function<\/em><\/td>\n<td>1<\/td>\n<td><span class=\"mjx-i\">\\(P(X\\le a)=F(a)\\)<\/span>; chú ý bước nhảy<\/td>\n<\/tr>\n<tr>\n<td><em>airline … over-booked<\/em><\/td>\n<td>1<\/td>\n<td>Nhị thức, so hai xác suất<\/td>\n<\/tr>\n<tr>\n<td><em>Let <span class=\"mjx-i\">\\(c\\)<\/span> be the number … <span class=\"mjx-i\">\\(c(x+y)\\)<\/span> … marginal<\/em><\/td>\n<td>2<\/td>\n<td>Bước nhảy = số giá trị của biến kia<\/td>\n<\/tr>\n<tr>\n<td><em>joint probability … table<\/em>, <span class=\"mjx-i\">\\(P(\\cdot\\mid\\cdot)\\)<\/span><\/td>\n<td>2<\/td>\n<td>Khoanh hàng/cột điều kiện<\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(E(Y\\mid X=1)\\)<\/span><\/td>\n<td>2<\/td>\n<td>Kỳ vọng trên một hàng, chia tổng hàng<\/td>\n<\/tr>\n<tr>\n<td><em>find the number <span class=\"mjx-i\">\\(c\\)<\/span> … continuous<\/em><\/td>\n<td>3<\/td>\n<td><span class=\"mjx-i\">\\(\\iint=1\\)<\/span>; tách tích<\/td>\n<\/tr>\n<tr>\n<td><em>marginal probability distribution <span class=\"mjx-i\">\\(p(y)\\)<\/span><\/em>, <span class=\"mjx-i\">\\(f_Y(y)\\)<\/span><\/td>\n<td>3<\/td>\n<td>Tích phân theo biến còn lại; kiểm tra <span class=\"mjx-i\">\\(\\ge0\\)<\/span> và <span class=\"mjx-i\">\\(\\int=1\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>variance of <span class=\"mjx-i\">\\(X\\)<\/span> / covariance<\/em><\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(E(X^2)-(EX)^2\\)<\/span>; <span class=\"mjx-i\">\\(E(XY)-EXEY\\)<\/span>; tách được thì <span class=\"mjx-i\">\\(\\mathrm{Cov}=0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>dataset … covariance matrix … <span class=\"mjx-i\">\\(s_{ij}\\)<\/span><\/em><\/td>\n<td>5<\/td>\n<td>Chia <span class=\"mjx-i\">\\(N\\)<\/span>; chỉ dùng tọa độ <span class=\"mjx-i\">\\(i\\)<\/span>, <span class=\"mjx-i\">\\(j\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>normal distribution … formula for the pdf<\/em><\/td>\n<td>6<\/td>\n<td>Kiểm tra tâm và mẫu số <span class=\"mjx-i\">\\(2\\sigma^2\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>distribution of <span class=\"mjx-i\">\\(Y\\)<\/span><\/em>, <em>mean of <span class=\"mjx-i\">\\(Y\\)<\/span><\/em><\/td>\n<td>6<\/td>\n<td>Đọc <span class=\"mjx-i\">\\(\\mu_2\\)<\/span>, <span class=\"mjx-i\">\\(\\Sigma_{22}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(p(x\\mid y=\\cdot)\\)<\/span><\/td>\n<td>6<\/td>\n<td>Công thức điều kiện<\/td>\n<\/tr>\n<tr>\n<td><em>mixture<\/em>, <span class=\"mjx-i\">\\(y=Ax\\)<\/span><\/td>\n<td>6<\/td>\n<td><span class=\"mjx-i\">\\(\\sum\\pi_k\\mu_k\\)<\/span>; <span class=\"mjx-i\">\\(A\\mu\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(P(2&lt;Y&lt;3)\\)<\/span>, <span class=\"mjx-i\">\\(\\Phi(1)\\)<\/span><\/td>\n<td>6<\/td>\n<td>Chuẩn hóa với <span class=\"mjx-i\">\\(\\sigma=\\sqrt{\\Sigma_{yy}}\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-6-h17\"><span class=\"pn\">Phần 5<\/span>Tổng hợp ôn thi<\/h1>\n<h2 id=\"MAI391-6-h18\">1. Công thức phải nhớ<\/h2>\n<p><div class=\"mjx-d\">\\[p(x)=\\sum_yp(x,y)\\ \\Big(\\int p(x,y)dy\\Big),\\qquad p(x\\mid y)=\\frac{p(x,y)}{p(y)}\\]<\/div>\n<div class=\"mjx-d\">\\[E(X)=\\sum xp(x),\\quad V(X)=E(X^2)-(EX)^2,\\quad\\mathrm{Cov}(X,Y)=E(XY)-EXEY\\]<\/div>\n<div class=\"mjx-d\">\\[S=\\frac1N\\sum(x_n-\\bar x)(x_n-\\bar x)^\\top\\]<\/div>\n<div class=\"mjx-d\">\\[\\mathcal{N}(\\mu,\\Sigma):\\ p(x)=\\frac{1}{\\sqrt{(2\\pi)^D\\det\\Sigma}}e^{-\\frac12(x-\\mu)^\\top\\Sigma^{-1}(x-\\mu)}\\]<\/div>\n<div class=\"mjx-d\">\\[\\mu_{x|y}=\\mu_x+\\Sigma_{xy}\\Sigma_{yy}^{-1}(y-\\mu_y),\\qquad\\Sigma_{x|y}=\\Sigma_{xx}-\\Sigma_{xy}\\Sigma_{yy}^{-1}\\Sigma_{yx}\\]<\/div>\n<div class=\"mjx-d\">\\[Y=AX+b:\\ E(Y)=A\\mu+b,\\ V(Y)=A\\Sigma A^\\top\\]<\/div><\/p>\n<h2 id=\"MAI391-6-h19\">2. Mười lỗi mất điểm hay gặp nhất<\/h2>\n<ol>\n<li>Đếm sai số phần tử của phân phối đều (quên số 0, quên số âm).<\/li>\n<li>Nhầm <span class=\"mjx-i\">\\(P(X\\le a)\\)<\/span> và <span class=\"mjx-i\">\\(P(X&lt;a)\\)<\/span> khi cdf có bước nhảy.<\/li>\n<li>Đọc nhầm bảng <span class=\"mjx-i\">\\(X\\backslash Y\\)<\/span> với <span class=\"mjx-i\">\\(Y\\backslash X\\)<\/span>.<\/li>\n<li>Xác suất có điều kiện: chia cho tổng cả bảng thay vì tổng hàng/cột.<\/li>\n<li>Tích phân sai miền (<span class=\"mjx-i\">\\([0,1]\\)<\/span> thay cho <span class=\"mjx-i\">\\([1,3]\\)<\/span>).<\/li>\n<li>Chọn mật độ biên âm trên miền hoặc có tích phân khác 1.<\/li>\n<li>Quên trừ <span class=\"mjx-i\">\\((EX)^2\\)<\/span>; làm tròn sớm khi <span class=\"mjx-i\">\\(\\mathrm{Cov}\\)<\/span> rất nhỏ.<\/li>\n<li>Ma trận hiệp phương sai mẫu chia <span class=\"mjx-i\">\\(N-1\\)<\/span> thay vì <span class=\"mjx-i\">\\(N\\)<\/span>.<\/li>\n<li>Coi số trong <span class=\"mjx-i\">\\(\\Sigma\\)<\/span> là độ lệch chuẩn.<\/li>\n<li>Công thức có điều kiện: quên trừ <span class=\"mjx-i\">\\(\\mu_y\\)<\/span>.<\/li>\n<\/ol>\n", "q": 65}, {"num": "7", "short": "Tối ưu liên tục", "sub": "Mathematics for Machine Learning – mục 7.1, 7.2, 7.3", "toc": [["h1", "PHẦN 1. GHI CHÉP BÀI HỌC", "MAI391-7-h1"], ["h2", "1.1. Tối ưu bằng Gradient Descent — mục 7.1", "MAI391-7-h2"], ["h2", "1.2. Tối ưu có ràng buộc & nhân tử Lagrange — mục 7.2", "MAI391-7-h3"], ["h2", "1.3. Tối ưu lồi — mục 7.3", "MAI391-7-h4"], ["h1", "PHẦN 2. ĐỀ THI THƯỜNG RA GÌ Ở CHƯƠNG 7", "MAI391-7-h5"], ["h1", "PHẦN 3. CÁC DẠNG BÀI", "MAI391-7-h6"], ["h2", "Chuẩn bị: Casio fx-580VN X cho Chương 7", "MAI391-7-h7"], ["h2", "Dạng 1: Gradient descent", "MAI391-7-h8"], ["h2", "Dạng 2: Gradient descent có momentum (quán tính)", "MAI391-7-h9"], ["h2", "Dạng 3: Nhân tử Lagrange với ràng buộc đẳng thức", "MAI391-7-h10"], ["h2", "Dạng 4: Hàm Lagrange & bài toán đối ngẫu (LP, QP)", "MAI391-7-h11"], ["h2", "Dạng 5: Tập lồi, hàm lồi, bài toán lồi", "MAI391-7-h12"], ["h1", "PHẦN 4. NHÌN ĐỀ → NHẬN RA DẠNG", "MAI391-7-h13"], ["h1", "PHẦN 5. TỔNG HỢP ÔN THI", "MAI391-7-h14"], ["h2", "1. Công thức phải nhớ", "MAI391-7-h15"], ["h2", "2. Mười lỗi mất điểm hay gặp nhất", "MAI391-7-h16"]], "html": "<hr/>\n<h1 id=\"MAI391-7-h1\"><span class=\"pn\">Phần 1<\/span>Ghi chép bài học<\/h1>\n<h2 id=\"MAI391-7-h2\">1.1. Tối ưu bằng Gradient Descent — mục 7.1<\/h2>\n<h3>Khái niệm<\/h3>\n<p>Bài toán <span class=\"mjx-i\">\\(\\min_x f(x)\\)<\/span> với <span class=\"mjx-i\">\\(f:\\mathbb{R}^n\\to\\mathbb{R}\\)<\/span> khả vi. <strong>Gradient descent<\/strong> là thuật toán bậc một: mỗi bước đi một đoạn <strong>ngược hướng gradient<\/strong>:\n<div class=\"mjx-d\">\\[\\boxed{x_{i+1}=x_i-\\gamma\\,\\nabla f(x_i)^\\top}\\]<\/div><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\gamma&gt;0\\)<\/span>: <strong>bước nhảy (step-size / learning rate)<\/strong>.<\/li>\n<li>Với <span class=\"mjx-i\">\\(\\gamma\\)<\/span> đủ nhỏ thì <span class=\"mjx-i\">\\(f(x_0)\\ge f(x_1)\\ge\\cdots\\)<\/span> hội tụ về một cực tiểu địa phương.<\/li>\n<\/ul>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> đứng trên sườn đồi trong sương mù, chỉ cảm nhận được độ dốc dưới chân. Cách xuống nhanh nhất là bước một bước nhỏ theo hướng dốc xuống nhất (ngược gradient), rồi đo lại độ dốc và lặp lại.<\/p>\n<\/blockquote>\n<h3>Chọn bước nhảy<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(\\gamma\\)<\/span> quá nhỏ: hội tụ chậm. <span class=\"mjx-i\">\\(\\gamma\\)<\/span> quá lớn: vượt qua cực tiểu, dao động hoặc phân kỳ.<\/li>\n<li>Bước tối ưu (line search): <span class=\"mjx-i\">\\(\\gamma_i^\\star=\\arg\\min_\\gamma f\\big(x_i-\\gamma\\nabla f(x_i)^\\top\\big)\\)<\/span>.<\/li>\n<\/ul>\n<h3>Gradient descent có quán tính (momentum)<\/h3>\n<p><div class=\"mjx-d\">\\[\\boxed{x_{i+1}=x_i-\\gamma\\,\\nabla f(x_i)^\\top+\\alpha\\,\\Delta x_i,\\qquad \\Delta x_i=x_i-x_{i-1}}\\]<\/div><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\alpha\\in[0,1]\\)<\/span>: hệ số quán tính. Ở <strong>bước đầu tiên<\/strong> chưa có <span class=\"mjx-i\">\\(x_{-1}\\)<\/span>, nên lấy <span class=\"mjx-i\">\\(\\Delta x_0=0\\)<\/span> (bước 1 giống gradient descent thường).<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide, đã sửa lỗi số)<\/h3>\n<p><strong>Example:<\/strong> Minimize <span class=\"mjx-i\">\\(f(x,y)=2x^2-2xy+1{,}5y^2\\)<\/span> by gradient descent from <span class=\"mjx-i\">\\((1,2)\\)<\/span> with <span class=\"mjx-i\">\\(\\gamma=0{,}05\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> Cực tiểu hóa <span class=\"mjx-i\">\\(f(x,y)=2x^2-2xy+1{,}5y^2\\)<\/span> bằng gradient descent, xuất phát từ <span class=\"mjx-i\">\\((1,2)\\)<\/span>, <span class=\"mjx-i\">\\(\\gamma=0{,}05\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\nabla f=(4x-2y,\\ -2x+3y)\\)<\/span>, nên công thức lặp: <span class=\"mjx-i\">\\(x_{i+1}=0{,}8x_i+0{,}1y_i\\)<\/span>, <span class=\"mjx-i\">\\(y_{i+1}=0{,}1x_i+0{,}85y_i\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\((x_1,y_1)=(0{,}8+0{,}2,\\ 0{,}1+1{,}7)=(1;\\ 1{,}8)\\)<\/span> <em>(slide in nhầm <span class=\"mjx-i\">\\(y_1=1{,}71\\)<\/span>)<\/em>.<\/li>\n<li><span class=\"mjx-i\">\\((x_2,y_2)=(0{,}8+0{,}18,\\ 0{,}1+1{,}53)=(0{,}98;\\ 1{,}63)\\)<\/span>.<\/li>\n<li>Nghiệm tối ưu là <span class=\"mjx-i\">\\((0,0)\\)<\/span>.<\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Mỗi bước phải tính <strong>lại gradient tại điểm mới<\/strong>.<\/li>\n<li>Hàm bậc hai: viết sẵn công thức lặp tuyến tính như trên thì bấm rất nhanh.<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-7-h3\">1.2. Tối ưu có ràng buộc &amp; nhân tử Lagrange — mục 7.2<\/h2>\n<h3>Bài toán gốc (primal) và hàm Lagrange<\/h3>\n<p><div class=\"mjx-d\">\\[\\min_x f(x)\\quad\\text{subject to}\\quad g_i(x)\\le0,\\ i=1,\\dots,m\\]<\/div>\n<div class=\"mjx-d\">\\[\\boxed{\\mathcal{L}(x,\\lambda)=f(x)+\\sum_{i=1}^m\\lambda_ig_i(x)=f(x)+\\lambda^\\top g(x)},\\qquad\\lambda_i\\ge0\\]<\/div><\/p>\n<blockquote>\n<p>Ràng buộc phải đưa về dạng <strong>\"<span class=\"mjx-i\">\\(\\le0\\)<\/span>\"<\/strong>: <span class=\"mjx-i\">\\(x+y\\le2\\)<\/span> thành <span class=\"mjx-i\">\\(g_1=x+y-2\\le0\\)<\/span>.\n<em>(Slide ghi <span class=\"mjx-i\">\\(\\lambda_i&gt;0\\)<\/span>; đúng ra là <span class=\"mjx-i\">\\(\\lambda_i\\ge0\\)<\/span>.)<\/em><\/p>\n<\/blockquote>\n<h3>Bài toán đối ngẫu (dual)<\/h3>\n<p><div class=\"mjx-d\">\\[\\mathcal{D}(\\lambda)=\\min_x\\mathcal{L}(x,\\lambda),\\qquad\\text{dual: }\\max_{\\lambda\\ge0}\\mathcal{D}(\\lambda)\\]<\/div><\/p>\n<ul>\n<li><strong>Bất đẳng thức minimax:<\/strong> <span class=\"mjx-i\">\\(\\max_y\\min_x\\varphi(x,y)\\le\\min_x\\max_y\\varphi(x,y)\\)<\/span>.<\/li>\n<li><strong>Đối ngẫu yếu:<\/strong> <span class=\"mjx-i\">\\(\\min_x\\max_{\\lambda\\ge0}\\mathcal{L}\\ \\ge\\ \\max_{\\lambda\\ge0}\\min_x\\mathcal{L}\\)<\/span>: giá trị dual luôn <span class=\"mjx-i\">\\(\\le\\)<\/span> giá trị primal.<\/li>\n<\/ul>\n<h3>Ràng buộc đẳng thức (phương pháp nhân tử Lagrange cổ điển)<\/h3>\n<p><span class=\"mjx-i\">\\(\\min f(x)\\)<\/span> s.t. <span class=\"mjx-i\">\\(h(x)=0\\)<\/span>: giải hệ <span class=\"mjx-i\">\\(\\nabla f=\\lambda\\nabla h\\)<\/span>, <span class=\"mjx-i\">\\(h(x)=0\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ<\/h3>\n<p><strong>Example:<\/strong> Minimize <span class=\"mjx-i\">\\(x^2+2y^2\\)<\/span> subject to <span class=\"mjx-i\">\\(x+y=3\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\nabla f=(2x,4y)\\)<\/span>, <span class=\"mjx-i\">\\(\\nabla h=(1,1)\\)<\/span>: <span class=\"mjx-i\">\\(2x=\\lambda\\)<\/span>, <span class=\"mjx-i\">\\(4y=\\lambda\\)<\/span>, nên <span class=\"mjx-i\">\\(x=2y\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(x+y=3\\)<\/span> cho <span class=\"mjx-i\">\\(y=1\\)<\/span>, <span class=\"mjx-i\">\\(x=2\\)<\/span>. Giá trị tối ưu: <span class=\"mjx-i\">\\(4+2=6\\)<\/span>.<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-7-h4\">1.3. Tối ưu lồi — mục 7.3<\/h2>\n<h3>Tập lồi<\/h3>\n<p><span class=\"mjx-i\">\\(C\\)<\/span> <strong>lồi<\/strong> nếu với mọi <span class=\"mjx-i\">\\(x,y\\in C\\)<\/span> và <span class=\"mjx-i\">\\(\\theta\\in[0,1]\\)<\/span>: <span class=\"mjx-i\">\\(\\theta x+(1-\\theta)y\\in C\\)<\/span> (đoạn thẳng nối hai điểm nằm trọn trong <span class=\"mjx-i\">\\(C\\)<\/span>).<\/p>\n<ul>\n<li>Lồi: đoạn <span class=\"mjx-i\">\\([0,8]\\)<\/span>; quả cầu (mở hoặc đóng) <span class=\"mjx-i\">\\(\\{\\lVert x-a\\rVert\\le r\\}\\)<\/span>; nửa mặt phẳng <span class=\"mjx-i\">\\(\\{a^\\top x\\le b\\}\\)<\/span>; đường thẳng/siêu phẳng <span class=\"mjx-i\">\\(\\{a^\\top x=b\\}\\)<\/span>; giao của các tập lồi; <span class=\"mjx-i\">\\(\\{x: g(x)\\le0\\}\\)<\/span> với <span class=\"mjx-i\">\\(g\\)<\/span> lồi.<\/li>\n<li><strong>Không lồi:<\/strong> hình vành khăn <span class=\"mjx-i\">\\(\\{r_1&lt;\\lVert x\\rVert&lt;r_2\\}\\)<\/span>; đường tròn/ellipse <span class=\"mjx-i\">\\(\\{x^2+2y^2=1\\}\\)<\/span>; phần ngoài <span class=\"mjx-i\">\\(\\{x^2+2y^2\\ge1\\}\\)<\/span>; <span class=\"mjx-i\">\\(\\{|x|+|y|\\ge1\\}\\)<\/span>.<\/li>\n<\/ul>\n<h3>Hàm lồi<\/h3>\n<p><span class=\"mjx-i\">\\(f\\)<\/span> (miền lồi) <strong>lồi<\/strong> nếu <span class=\"mjx-i\">\\(f(\\theta x+(1-\\theta)y)\\le\\theta f(x)+(1-\\theta)f(y)\\)<\/span>.<\/p>\n<ul>\n<li>Khả vi: <span class=\"mjx-i\">\\(f\\)<\/span> lồi <span class=\"mjx-i\">\\(\\iff f(y)\\ge f(x)+\\nabla f(x)^\\top(y-x)\\)<\/span>.<\/li>\n<li>Khả vi hai lần: <span class=\"mjx-i\">\\(f\\)<\/span> lồi <span class=\"mjx-i\">\\(\\iff\\)<\/span> <strong>Hessian nửa xác định dương<\/strong> (<span class=\"mjx-i\">\\(\\nabla^2f\\succeq0\\)<\/span>) trên miền.<\/li>\n<li>Ví dụ: <span class=\"mjx-i\">\\(x\\ln x\\)<\/span> lồi trên <span class=\"mjx-i\">\\(x&gt;0\\)<\/span>; <span class=\"mjx-i\">\\(x^2+y^2\\)<\/span> lồi (Hessian <span class=\"mjx-i\">\\(2I\\)<\/span>).<\/li>\n<li><strong>Tổng<\/strong> hai hàm lồi là lồi; <strong>tích<\/strong> hai hàm lồi <strong>không nhất thiết<\/strong> lồi (ví dụ <span class=\"mjx-i\">\\(x\\cdot x^2=x^3\\)<\/span>).<\/li>\n<\/ul>\n<h3>Bài toán tối ưu lồi<\/h3>\n<p><span class=\"mjx-i\">\\(\\min f(x)\\)<\/span> s.t. <span class=\"mjx-i\">\\(g_i(x)\\le0\\)<\/span>, <span class=\"mjx-i\">\\(h_j(x)=0\\)<\/span> là <strong>bài toán lồi<\/strong> nếu <span class=\"mjx-i\">\\(f\\)<\/span>, <span class=\"mjx-i\">\\(g_i\\)<\/span> lồi và tập <span class=\"mjx-i\">\\(\\{h_j=0\\}\\)<\/span> lồi (thực tế: <span class=\"mjx-i\">\\(h_j\\)<\/span> <strong>tuyến tính/affine<\/strong>).<\/p>\n<h3>Quy hoạch tuyến tính (LP) — mục 7.3.1<\/h3>\n<p><div class=\"mjx-d\">\\[\\min_{x\\in\\mathbb{R}^n}c^\\top x\\quad\\text{s.t.}\\quad Ax\\le b\\ \\ (A\\in\\mathbb{R}^{m\\times n})\\]<\/div><\/p>\n<ul>\n<li>Lagrange: <span class=\"mjx-i\">\\(\\mathcal{L}=c^\\top x+\\lambda^\\top(Ax-b)=(c+A^\\top\\lambda)^\\top x-\\lambda^\\top b\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\nabla_x\\mathcal{L}=c+A^\\top\\lambda=0\\)<\/span>, nên <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)=-\\lambda^\\top b\\)<\/span>.<\/li>\n<li><strong>Đối ngẫu:<\/strong> <span class=\"mjx-i\">\\(\\boxed{\\max_{\\lambda\\ge0}\\ -b^\\top\\lambda\\quad\\text{s.t.}\\quad c+A^\\top\\lambda=0}\\)<\/span> (<span class=\"mjx-i\">\\(m\\)<\/span> biến).<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide)<\/h3>\n<p><strong>Example:<\/strong> <span class=\"mjx-i\">\\(\\min(5x_1+x_2-x_3)\\)<\/span> s.t. <span class=\"mjx-i\">\\(\\begin{bmatrix}2&amp;2&amp;1\\\\-3&amp;1&amp;5\\end{bmatrix}x\\le\\begin{bmatrix}-2\\\\3\\end{bmatrix}\\)<\/span>. Dual:\n<div class=\"mjx-d\">\\[\\max(2\\lambda_1-3\\lambda_2)\\ \\text{ s.t. }\\ 2\\lambda_1-3\\lambda_2+5=0,\\ \\ 2\\lambda_1+\\lambda_2+1=0,\\ \\ \\lambda_1+5\\lambda_2-1=0,\\ \\ \\lambda_1,\\lambda_2\\ge0.\\]<\/div><\/p>\n<\/div><h3>Quy hoạch toàn phương (QP) — mục 7.3.2<\/h3>\n<p><div class=\"mjx-d\">\\[\\min_x\\tfrac12x^\\top Qx+c^\\top x\\quad\\text{s.t.}\\quad Ax\\le b\\qquad(Q\\succ0)\\]<\/div><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\mathcal{L}=\\tfrac12x^\\top Qx+(c+A^\\top\\lambda)^\\top x-\\lambda^\\top b\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\nabla_x\\mathcal{L}=Qx+c+A^\\top\\lambda=0\\)<\/span>, nên <span class=\"mjx-i\">\\(x=-Q^{-1}(c+A^\\top\\lambda)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\boxed{\\mathcal{D}(\\lambda)=-\\tfrac12(c+A^\\top\\lambda)^\\top Q^{-1}(c+A^\\top\\lambda)-\\lambda^\\top b}\\)<\/span>; dual: <span class=\"mjx-i\">\\(\\max_{\\lambda\\ge0}\\mathcal{D}(\\lambda)\\)<\/span>.<\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Mục tiêu viết <span class=\"mjx-i\">\\(x^\\top Qx\\)<\/span> (<strong>không có<\/strong> <span class=\"mjx-i\">\\(\\tfrac12\\)<\/span>) thì đạo hàm là <span class=\"mjx-i\">\\(2Qx\\)<\/span> (với <span class=\"mjx-i\">\\(Q\\)<\/span> đối xứng).<\/li>\n<li>Mục tiêu <span class=\"mjx-i\">\\(x_1^2+3x_2^2\\)<\/span> viết lại thành <span class=\"mjx-i\">\\(\\tfrac12x^\\top Qx\\)<\/span> với <span class=\"mjx-i\">\\(Q=\\mathrm{diag}(2,6)\\)<\/span>.<\/li>\n<\/ul>\n<hr/>\n<h1 id=\"MAI391-7-h5\"><span class=\"pn\">Phần 2<\/span>Đề thi thường ra gì ở chương 7<\/h1>\n<p><em>Thống kê từ 10 đề MAI391: FA24-RE, FA24-FE, SU24-RE, SP25-RE, 4 mã đề SP26, và 2 đề MAI391 không ghi kỳ (<strong>Đề A<\/strong>, <strong>Đề B<\/strong>); thêm <strong>Đề C<\/strong> là đề tự luận trong 3 ảnh (câu 1–9 thuộc Chương 6, câu 10–14 thuộc Chương 7, không có lựa chọn A/B/C/D).<\/em><\/p>\n<p><strong>Quy luật:<\/strong> ở các đề FA24, SU24, SP25, Đề A và Đề B, <strong>câu 31 đến câu 37 là Chương 7<\/strong> (xen kẽ vài câu Chương 6). Đề SP26 xáo trộn nhưng vẫn có 5–7 câu. Tức là Chương 7 chiếm khoảng <strong>6/40 câu (15%)<\/strong>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dạng<\/th>\n<th>Số đề có<\/th>\n<th>Kiểu hỏi chủ yếu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Gradient descent<\/strong><\/td>\n<td>5/10<\/td>\n<td>Điểm <span class=\"mjx-i\">\\((x_1,y_1)\\)<\/span> hoặc <span class=\"mjx-i\">\\((x_2,y_2)\\)<\/span> sau 1–2 bước<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Gradient descent có momentum<\/strong><\/td>\n<td>6/10<\/td>\n<td>Một tọa độ sau bước 2; bước tiếp theo khi biết điểm hiện tại và điểm trước<\/td>\n<\/tr>\n<tr>\n<td><strong>3. Nhân tử Lagrange (ràng buộc đẳng thức)<\/strong><\/td>\n<td>2/10<\/td>\n<td>Giá trị tối ưu của <span class=\"mjx-i\">\\(\\min ax^2+by^2\\)<\/span> s.t. <span class=\"mjx-i\">\\(px+qy=c\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>4. Hàm Lagrange &amp; bài toán đối ngẫu<\/strong><\/td>\n<td>9/10<\/td>\n<td><span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial y\\)<\/span>, <span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial\\lambda_1\\)<\/span> tại một điểm; đối ngẫu của LP; <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)\\)<\/span>; <span class=\"mjx-i\">\\(\\nabla_x\\mathcal{L}\\)<\/span> của QP<\/td>\n<\/tr>\n<tr>\n<td><strong>5. Tập lồi, hàm lồi, bài toán lồi<\/strong><\/td>\n<td>9/10<\/td>\n<td>Tập nào lồi; hàm nào lồi; bài toán nào lồi; mệnh đề về tổng/tích hàm lồi<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-7-h6\"><span class=\"pn\">Phần 3<\/span>Các dạng bài<\/h1>\n<p>Mỗi dạng gồm: cách nhận biết → công thức → cách làm → <strong>ví dụ mẫu (giải chi tiết)<\/strong> → lỗi thường gặp → <strong>mẹo nhanh / thử đáp án / cách khác / bấm máy Casio<\/strong> → <strong>câu đề thật<\/strong> (chép nguyên văn như trong đề, để tự luyện).<\/p>\n<p>Ghi chú nguồn: <code>[FA24-RE Q34]<\/code> = đề FA24 thi lại, câu 34. Câu nào xuất hiện ở nhiều đề thì chỉ chép một lần và ghi đủ các nguồn.<\/p>\n<h2 id=\"MAI391-7-h7\">Chuẩn bị: Casio fx-580VN X cho Chương 7<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Việc cần làm<\/th>\n<th>Thao tác<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Một bước gradient descent<\/td>\n<td>Calculate: gõ <code>X-γ×(∂f/∂x theo X,Y)<\/code>, bấm <code>CALC<\/code> nhập <span class=\"mjx-i\">\\(X,Y\\)<\/span> hiện tại → được <span class=\"mjx-i\">\\(x\\)<\/span> mới; làm tương tự cho <span class=\"mjx-i\">\\(y\\)<\/span> (gõ biểu thức thứ hai)<\/td>\n<\/tr>\n<tr>\n<td>Lưu kết quả để dùng bước sau<\/td>\n<td><code>STO<\/code> vào A, B (hoặc ghi ra giấy 3–4 chữ số)<\/td>\n<\/tr>\n<tr>\n<td>Giải hệ <span class=\"mjx-i\">\\(\\nabla f=\\lambda\\nabla h\\)<\/span><\/td>\n<td><code>MENU<\/code> → Equation/Func → Simultaneous Equation → 3 ẩn (<span class=\"mjx-i\">\\(x,y,\\lambda\\)<\/span>)<\/td>\n<\/tr>\n<tr>\n<td>Kiểm tra Hessian xác định dương<\/td>\n<td>Matrix → <code>Det<\/code>; hoặc tính nhẩm <span class=\"mjx-i\">\\(a_{11}&gt;0\\)<\/span>, <span class=\"mjx-i\">\\(\\det&gt;0\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h2 id=\"MAI391-7-h8\">Dạng 1: Gradient descent<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Applying the gradient descent algorithm with the step-size <span class=\"mjx-i\">\\(\\gamma\\)<\/span> and the initial point … what is the point after the 2nd iteration\"<\/em>, <em>\"what is the next iterate\"<\/em>, <em>\"Find <span class=\"mjx-i\">\\(x_2\\)<\/span>\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[x_{i+1}=x_i-\\gamma\\,\\partial_xf(x_i,y_i),\\qquad y_{i+1}=y_i-\\gamma\\,\\partial_yf(x_i,y_i)\\]<\/div>\n(cập nhật <strong>đồng thời<\/strong>: cả hai tọa độ dùng gradient tại điểm <strong>cũ<\/strong>).<\/p>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Tính gradient <span class=\"mjx-i\">\\(\\nabla f=(f_x,f_y)\\)<\/span> dạng tổng quát.<\/li>\n<li>Thay điểm hiện tại, nhân <span class=\"mjx-i\">\\(\\gamma\\)<\/span>, trừ.<\/li>\n<li>Lặp lại với điểm mới (tính lại gradient).<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (hàm bậc hai, 2 bước).<\/strong> Minimize <span class=\"mjx-i\">\\(f(x,y)=x^2+2y^2-2x+4y\\)<\/span> by gradient descent, <span class=\"mjx-i\">\\(\\gamma=0{,}1\\)<\/span>, <span class=\"mjx-i\">\\((x_0,y_0)=(0,0)\\)<\/span>. Find <span class=\"mjx-i\">\\((x_2,y_2)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\nabla f=(2x-2,\\ 4y+4)\\)<\/span>.<\/li>\n<li>Bước 1: <span class=\"mjx-i\">\\(\\nabla f(0,0)=(-2,4)\\)<\/span>, nên <span class=\"mjx-i\">\\((x_1,y_1)=(0+0{,}2,\\ 0-0{,}4)=(0{,}2;\\ -0{,}4)\\)<\/span>.<\/li>\n<li>Bước 2: <span class=\"mjx-i\">\\(\\nabla f(0{,}2;-0{,}4)=(-1{,}6;\\ 2{,}4)\\)<\/span>, nên <span class=\"mjx-i\">\\((x_2,y_2)=(0{,}2+0{,}16;\\ -0{,}4-0{,}24)=(0{,}36;\\ -0{,}64)\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (hàm không bậc hai).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=xy^2+2x\\)<\/span>, <span class=\"mjx-i\">\\(\\gamma=0{,}1\\)<\/span>, <span class=\"mjx-i\">\\((x_0,y_0)=(1,1)\\)<\/span>. Find <span class=\"mjx-i\">\\((x_2,y_2)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\nabla f=(y^2+2,\\ 2xy)\\)<\/span>.<\/li>\n<li>Bước 1: <span class=\"mjx-i\">\\(\\nabla f(1,1)=(3,2)\\)<\/span>, nên <span class=\"mjx-i\">\\((x_1,y_1)=(0{,}7;\\ 0{,}8)\\)<\/span>.<\/li>\n<li>Bước 2: <span class=\"mjx-i\">\\(\\nabla f(0{,}7;0{,}8)=(0{,}64+2;\\ 2\\cdot0{,}7\\cdot0{,}8)=(2{,}64;\\ 1{,}12)\\)<\/span>, nên <span class=\"mjx-i\">\\((x_2,y_2)=(0{,}7-0{,}264;\\ 0{,}8-0{,}112)=(0{,}436;\\ 0{,}688)\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li><strong>Cộng<\/strong> gradient thay vì trừ.<\/li>\n<li>Cập nhật <span class=\"mjx-i\">\\(x\\)<\/span> trước rồi dùng <span class=\"mjx-i\">\\(x\\)<\/span> mới để tính gradient cho <span class=\"mjx-i\">\\(y\\)<\/span> (phải dùng điểm cũ cho cả hai).<\/li>\n<li>Dùng lại gradient của bước 1 cho bước 2.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Hàm bậc hai<\/strong> <span class=\"mjx-i\">\\(f=\\tfrac12x^\\top Qx+c^\\top x\\)<\/span>: viết sẵn công thức lặp tuyến tính <span class=\"mjx-i\">\\(x_{i+1}=(I-\\gamma Q)x_i-\\gamma c\\)<\/span> (như ví dụ slide), rồi chỉ việc thay số.<\/li>\n<li><strong>Loại nhanh bằng bước 1:<\/strong> nhiều đáp án sai là kết quả của việc cộng gradient hoặc chỉ làm 1 bước. Tính bước 1 trước: hướng di chuyển phải <strong>ngược dấu<\/strong> gradient.<\/li>\n<li>Hai câu \"cùng hàm, khác điểm đầu\" (như <span class=\"mjx-i\">\\((-1,1)\\)<\/span> và <span class=\"mjx-i\">\\((1,-1)\\)<\/span>) thường có <strong>cùng bộ đáp án<\/strong>: đừng chọn theo trí nhớ.<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> sau bước 2, giá trị <span class=\"mjx-i\">\\(f\\)<\/span> thường <strong>nhỏ hơn<\/strong> <span class=\"mjx-i\">\\(f(x_0)\\)<\/span> (nếu <span class=\"mjx-i\">\\(\\gamma\\)<\/span> hợp lý). Đáp án làm <span class=\"mjx-i\">\\(f\\)<\/span> tăng mạnh thì đáng ngờ (trừ khi hàm không bị chặn dưới).<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li>Gõ <code>X-0.1(Y²+2)<\/code> → <code>CALC<\/code> → X? <span class=\"mjx-i\">\\(1\\)<\/span>, Y? <span class=\"mjx-i\">\\(1\\)<\/span> → <span class=\"mjx-i\">\\(0{,}7\\)<\/span> (lưu <code>STO A<\/code>).<\/li>\n<li>Gõ <code>Y-0.1(2XY)<\/code> → <code>CALC<\/code> → X? <span class=\"mjx-i\">\\(1\\)<\/span>, Y? <span class=\"mjx-i\">\\(1\\)<\/span> → <span class=\"mjx-i\">\\(0{,}8\\)<\/span> (lưu <code>STO B<\/code>).<\/li>\n<li>Bước 2: <code>CALC<\/code> lại hai biểu thức với X <span class=\"mjx-i\">\\(=0{,}7\\)<\/span>, Y <span class=\"mjx-i\">\\(=0{,}8\\)<\/span>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">5 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-7-q1\"><strong>Câu 1.1<\/strong> <code>[SP26 Q33]<\/code> <code>[SP26 Q35]<\/code>\nWe are using the Gradient Descent algorithm to solve the following problem:\nMin <span class=\"mjx-i\">\\(f(x,y) = 2x^2 + 3y^2 - 4xy + 5x - 3y + 2\\)<\/span> The current iterate is <span class=\"mjx-i\">\\((x_i, y_i) = (1, -1)\\)<\/span> . Using the learning rate (step-size) <span class=\"mjx-i\">\\(\\gamma = 0.1\\)<\/span> for the gradient descent algorithm, what is the next iterate <span class=\"mjx-i\">\\((x_{i+1}, y_{i+1})\\)<\/span> ?<\/p>\n<ul>\n<li>A. (-0.3, 0.3)<\/li>\n<li>B. (-0.3, 1.3)<\/li>\n<li>C. (1.3, -0.3)<\/li>\n<li>D. (-1.3, 1.3)<\/li>\n<li>E. (-0.3, -1.3)<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q2\"><strong>Câu 1.2<\/strong> <code>[Đề A Q34]<\/code>\nConsider the problem of minimizing <span class=\"mjx-i\">\\(f(x,y) = x^2 + 4xy + 5y^2\\)<\/span> using the gradient descent method. Starting from the point <span class=\"mjx-i\">\\((x_0, y_0) = (1, 1)\\)<\/span> and step-size <span class=\"mjx-i\">\\(\\gamma = 0.1\\)<\/span> . Find <span class=\"mjx-i\">\\(x_2\\)<\/span> .<\/p>\n<ul>\n<li>A. 0.12<\/li>\n<li>B. 0.24<\/li>\n<li>C. 0.48<\/li>\n<li>D. 0.6<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q3\"><strong>Câu 1.3<\/strong> <code>[SP25-RE Q31]<\/code>\nLet <span class=\"mjx-i\">\\(f(x,y)=xy^2+3y\\)<\/span> . Applying the gradient descent algorithm with the step-size <span class=\"mjx-i\">\\(\\gamma=0.1\\)<\/span> and the initial point <span class=\"mjx-i\">\\((x_0,y_0)=(-1,1)\\)<\/span> , what is the point <span class=\"mjx-i\">\\((x_2,y_2)\\)<\/span> after the 2nd iteration?<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\((0.779,-1.202)\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\((1.536,-1.844)\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\((-0.704,0.236)\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\((-1.181,0.798)\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q4\"><strong>Câu 1.4<\/strong> <code>[SU24-RE Q31]<\/code>\nLet <span class=\"mjx-i\">\\(f(x,y)=xy^2+3y\\)<\/span> . Applying the gradient descent algorithm with the step-size <span class=\"mjx-i\">\\(\\gamma=0.1\\)<\/span> and the initial point <span class=\"mjx-i\">\\((x_0,y_0)=(1,-1)\\)<\/span> , what is the point <span class=\"mjx-i\">\\((x_2,y_2)\\)<\/span> after the <span class=\"mjx-i\">\\(2^{\\mathrm{nd}}\\)<\/span> iteration?<\/p>\n<ul>\n<li>A. (0.779, -1.202)<\/li>\n<li>B. (-1.181, 0.798)<\/li>\n<li>C. (1.536, -1.844)<\/li>\n<li>D. (-0.704, 0.236)<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q5\"><strong>Câu 1.5<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nConsider the following optimization problem\n<div class=\"mjx-d\">\\[\\min f(x,y),\\qquad f(x,y)=x^2+2y^2-2xy+2x-2y+2.\\]<\/div>\nUse the Gradient Descent Algorithm with learning rate (step-size) <span class=\"mjx-i\">\\(\\gamma=0.01\\)<\/span> and the initial approximation <span class=\"mjx-i\">\\((x_0,y_0)=(1,1)\\)<\/span> to find the first approximation <span class=\"mjx-i\">\\((x_1,y_1)\\)<\/span>.<\/p>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-7-h9\">Dạng 2: Gradient descent có momentum (quán tính)<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p>Đề có <em>\"momentum <span class=\"mjx-i\">\\(\\alpha\\)<\/span>\"<\/em>; hỏi một tọa độ sau bước 2 (từ điểm đầu), hoặc <em>\"current iterate … previous iterate … next iterate\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[x_{i+1}=x_i-\\gamma\\nabla f(x_i)+\\alpha(x_i-x_{i-1})\\]<\/div><\/p>\n<ul>\n<li>Bước 1 (từ <span class=\"mjx-i\">\\(x_0\\)<\/span>): <span class=\"mjx-i\">\\(\\Delta x_0=0\\)<\/span>, nên <span class=\"mjx-i\">\\(x_1=x_0-\\gamma\\nabla f(x_0)\\)<\/span>.<\/li>\n<li>Bước 2: <span class=\"mjx-i\">\\(x_2=x_1-\\gamma\\nabla f(x_1)+\\alpha(x_1-x_0)\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Bước 1 như gradient descent thường.<\/li>\n<li>Bước 2: thêm số hạng quán tính <span class=\"mjx-i\">\\(\\alpha\\times\\)<\/span>(bước vừa đi).<\/li>\n<li>Đề cho sẵn điểm hiện tại và điểm trước: dùng ngay công thức, chỉ cần <strong>một<\/strong> gradient.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (hai bước từ điểm đầu).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=x^2+y^2+xy-2x\\)<\/span>, <span class=\"mjx-i\">\\(\\gamma=0{,}1\\)<\/span>, <span class=\"mjx-i\">\\(\\alpha=0{,}5\\)<\/span>, <span class=\"mjx-i\">\\((x_0,y_0)=(0,0)\\)<\/span>. Find <span class=\"mjx-i\">\\((x_2,y_2)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\nabla f=(2x+y-2,\\ 2y+x)\\)<\/span>.<\/li>\n<li>Bước 1: <span class=\"mjx-i\">\\(\\nabla f(0,0)=(-2,0)\\)<\/span>, nên <span class=\"mjx-i\">\\((x_1,y_1)=(0{,}2;\\ 0)\\)<\/span>; bước vừa đi <span class=\"mjx-i\">\\(\\Delta=(0{,}2;\\ 0)\\)<\/span>.<\/li>\n<li>Bước 2: <span class=\"mjx-i\">\\(\\nabla f(0{,}2;0)=(-1{,}6;\\ 0{,}2)\\)<\/span>.\n<span class=\"mjx-i\">\\(x_2=0{,}2+0{,}16+0{,}5\\cdot0{,}2=0{,}46\\)<\/span>; <span class=\"mjx-i\">\\(y_2=0-0{,}02+0{,}5\\cdot0=-0{,}02\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (cho điểm trước).<\/strong> <span class=\"mjx-i\">\\(f=x^2+y^2\\)<\/span>, current <span class=\"mjx-i\">\\((1,0)\\)<\/span>, previous <span class=\"mjx-i\">\\((0,1)\\)<\/span>, <span class=\"mjx-i\">\\(\\gamma=0{,}1\\)<\/span>, <span class=\"mjx-i\">\\(\\alpha=0{,}2\\)<\/span>. Next iterate?<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\nabla f(1,0)=(2,0)\\)<\/span>; <span class=\"mjx-i\">\\(\\Delta=(1,0)-(0,1)=(1,-1)\\)<\/span>.\n<span class=\"mjx-i\">\\((x,y)_{\\text{mới}}=(1,0)-0{,}1(2,0)+0{,}2(1,-1)=(1-0{,}2+0{,}2;\\ 0-0+(-0{,}2))=(1;\\ -0{,}2)\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Thêm số hạng quán tính ngay ở <strong>bước 1<\/strong>.<\/li>\n<li>Dùng <span class=\"mjx-i\">\\(\\Delta x=x_{i-1}-x_i\\)<\/span> (ngược dấu).<\/li>\n<li>Câu \"previous iterate\": lấy <span class=\"mjx-i\">\\(\\Delta\\)<\/span> theo thứ tự sai, hoặc tính gradient tại điểm trước.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li>Bước 1 của momentum <strong>trùng<\/strong> gradient descent thường, nên câu hỏi \"after the 2nd iteration\" mới cần quán tính.<\/li>\n<li>Tọa độ nào có <span class=\"mjx-i\">\\(\\Delta=0\\)<\/span> ở bước 1 (ví dụ <span class=\"mjx-i\">\\(y_1=y_0\\)<\/span>) thì bước 2 của tọa độ đó <strong>không có<\/strong> số hạng quán tính.<\/li>\n<li>Đề cho đáp án gần nhau (như <span class=\"mjx-i\">\\(-0{,}555\\)<\/span> và <span class=\"mjx-i\">\\(-0{,}54\\)<\/span>): chênh lệch thường đúng bằng số hạng quán tính <span class=\"mjx-i\">\\(\\alpha\\Delta\\)<\/span>. Tính kỹ số hạng này.<\/li>\n<\/ul>\n<p><strong>Bấm máy:<\/strong> như Dạng 1, thêm <code>+α(X-A)<\/code> vào biểu thức (A là tọa độ của điểm trước), ví dụ <code>X-0.1(2X+Y-2)+0.5(X-A)<\/code>.<\/p>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">6 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-7-q6\"><strong>Câu 2.1<\/strong> <code>[FA24-RE Q34]<\/code>\nConsider the problem of minimizing <span class=\"mjx-i\">\\(f(x,y,z)=x^2+y^2+z^2+xy+yz+3x.\\)<\/span> Applying the gradient descent algorithm with the step-size <span class=\"mjx-i\">\\(\\gamma=0.1\\)<\/span> , the momentum <span class=\"mjx-i\">\\(\\alpha=0.05\\)<\/span> and the initial point <span class=\"mjx-i\">\\((x_0,y_0,z_0)=(0,0,0)\\)<\/span> , find the second coordinate <span class=\"mjx-i\">\\(y_2\\)<\/span> of the point <span class=\"mjx-i\">\\((x_2,y_2,z_2)\\)<\/span> after the second iteration?<\/p>\n<ul>\n<li>A. -0.555<\/li>\n<li>B. -0.54<\/li>\n<li>C. -0.03<\/li>\n<li>D. 0.03<\/li>\n<li>E. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q7\"><strong>Câu 2.2<\/strong> <code>[FA24-FE Q35]<\/code>\nConsider the problem of minimizing <span class=\"mjx-i\">\\(f(x,y,z)=x^2+y^2+z^2+xy+yz+3x.\\)<\/span> Applying the gradient descent algorithm with the step-size <span class=\"mjx-i\">\\(\\gamma=0.1\\)<\/span> , the momentum <span class=\"mjx-i\">\\(\\alpha=0.05\\)<\/span> and the initial point <span class=\"mjx-i\">\\((x_0,y_0,z_0)=(0,0,0)\\)<\/span> , find the first coordinate <span class=\"mjx-i\">\\(x_2\\)<\/span> of the point <span class=\"mjx-i\">\\((x_2,y_2,z_2)\\)<\/span> after the second iteration?<\/p>\n<ul>\n<li>A. -0.555<\/li>\n<li>B. -0.54<\/li>\n<li>C. -0.03<\/li>\n<li>D. 0.03<\/li>\n<li>E. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q8\"><strong>Câu 2.3<\/strong> <code>[Đề B Q32]<\/code>\nWe are using the Gradient Descent algorithm with momentum to solve the following problem: <span class=\"mjx-i\">\\(\\operatorname{Min} f(x,y) = 3x^2 + y^2 + 2xy + x - 3y + 1\\)<\/span> The current iterate is <span class=\"mjx-i\">\\((x_i, y_i) = (1, 1)\\)<\/span> and the previous iterate is <span class=\"mjx-i\">\\((x_{i-1}, y_{i-1}) = (2, 2)\\)<\/span> .\nUsing the learning rate (step-size) <span class=\"mjx-i\">\\(\\gamma = 0.2\\)<\/span> for the gradient descent algorithm with momentum <span class=\"mjx-i\">\\(\\alpha = 0.3\\)<\/span> , what is the next iterate <span class=\"mjx-i\">\\((x_{i+1}, y_{i+1})\\)<\/span> ?<\/p>\n<ul>\n<li>A. (-1.1, 0.5)<\/li>\n<li>B. (-1.1, -0.5)<\/li>\n<li>C. (1.1, 0.5)<\/li>\n<li>D. (1.1, -0.5)<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q9\"><strong>Câu 2.4<\/strong> <code>[SU24-RE Q32]<\/code> <code>[SP26 Q8]<\/code>\nLet <span class=\"mjx-i\">\\(f(x,y)=x^2y+3y\\)<\/span> . Applying the gradient descent algorithm with the step-size <span class=\"mjx-i\">\\(\\gamma=0.1\\)<\/span> , the\nmomentum <span class=\"mjx-i\">\\(\\alpha=0.02\\)<\/span> and the initial point <span class=\"mjx-i\">\\((x_0,y_0)=(1,-1)\\)<\/span> , find <span class=\"mjx-i\">\\(x_2\\)<\/span> of the point after 2ⁿᵈ iteration.<\/p>\n<ul>\n<li>A. 1.54<\/li>\n<li>B. -1.852<\/li>\n<li>C. 0.795<\/li>\n<li>D. 0.823<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q10\"><strong>Câu 2.5<\/strong> <code>[SP26 Q7]<\/code>\nLet <span class=\"mjx-i\">\\(f(x,y) = x^2y+3y\\)<\/span> . Applying the gradient descent algorithm with the step-size <span class=\"mjx-i\">\\(\\gamma = 0.1\\)<\/span> , the momentum <span class=\"mjx-i\">\\(\\alpha = 0.02\\)<\/span> and the initial point <span class=\"mjx-i\">\\((x_0,y_0) = (1, -1)\\)<\/span> , find <span class=\"mjx-i\">\\(y_2\\)<\/span> of the point after <span class=\"mjx-i\">\\(2^{\\text{nd}}\\)<\/span> iteration.<\/p>\n<ul>\n<li>A. -1.852<\/li>\n<li>B. 0.795<\/li>\n<li>C. 0.823<\/li>\n<li>D. 1.54<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q11\"><strong>Câu 2.6<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nLet <span class=\"mjx-i\">\\(f(x,y)=x^2+2y^2+2y+3x+2\\)<\/span>. Apply the Gradient Descent Algorithm with learning rate (step-size) <span class=\"mjx-i\">\\(\\gamma=0.01\\)<\/span>, the momentum <span class=\"mjx-i\">\\(\\alpha=0.02\\)<\/span> and the initial approximation <span class=\"mjx-i\">\\((x_0,y_0)=(0,1)\\)<\/span> to find the second approximation <span class=\"mjx-i\">\\((x_2,y_2)\\)<\/span>.<\/p>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-7-h10\">Dạng 3: Nhân tử Lagrange với ràng buộc đẳng thức<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Using the Lagrange Multiplier method to solve … Min … subject to … <span class=\"mjx-i\">\\(=\\)<\/span> …. What is the optimal value?\"<\/em><\/p>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(\\min f(x,y)\\)<\/span> s.t. <span class=\"mjx-i\">\\(h(x,y)=0\\)<\/span>: giải hệ\n<div class=\"mjx-d\">\\[\\nabla f=\\lambda\\nabla h,\\qquad h(x,y)=0.\\]<\/div>\n(Tương đương: đạo hàm của <span class=\"mjx-i\">\\(\\mathcal{L}=f-\\lambda h\\)<\/span> theo <span class=\"mjx-i\">\\(x,y,\\lambda\\)<\/span> bằng 0.)<\/p>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Viết <span class=\"mjx-i\">\\(f_x=\\lambda h_x\\)<\/span>, <span class=\"mjx-i\">\\(f_y=\\lambda h_y\\)<\/span>.<\/li>\n<li>Khử <span class=\"mjx-i\">\\(\\lambda\\)<\/span> để được quan hệ giữa <span class=\"mjx-i\">\\(x,y\\)<\/span>.<\/li>\n<li>Thay vào ràng buộc, tìm <span class=\"mjx-i\">\\(x,y\\)<\/span>, rồi tính <span class=\"mjx-i\">\\(f\\)<\/span>.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> Min <span class=\"mjx-i\">\\(x^2+2y^2\\)<\/span> subject to <span class=\"mjx-i\">\\(x+y=3\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(2x=\\lambda\\)<\/span>, <span class=\"mjx-i\">\\(4y=\\lambda\\)<\/span>, nên <span class=\"mjx-i\">\\(x=2y\\)<\/span>. Thay vào: <span class=\"mjx-i\">\\(3y=3\\)<\/span>, <span class=\"mjx-i\">\\(y=1\\)<\/span>, <span class=\"mjx-i\">\\(x=2\\)<\/span>. Giá trị tối ưu: <span class=\"mjx-i\">\\(4+2=6\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Đề hỏi <strong>giá trị tối ưu<\/strong> (giá trị của <span class=\"mjx-i\">\\(f\\)<\/span>) mà trả lời tọa độ điểm hoặc <span class=\"mjx-i\">\\(\\lambda\\)<\/span>.<\/li>\n<li>Sai số học khi khử <span class=\"mjx-i\">\\(\\lambda\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh (công thức đóng):<\/strong> với <span class=\"mjx-i\">\\(\\min\\ ax^2+by^2\\)<\/span> (<span class=\"mjx-i\">\\(a,b&gt;0\\)<\/span>) s.t. <span class=\"mjx-i\">\\(px+qy=c\\)<\/span>:\n<div class=\"mjx-d\">\\[\\boxed{f_{\\min}=\\frac{c^2}{\\dfrac{p^2}{a}+\\dfrac{q^2}{b}}}\\]<\/div>\nVí dụ trên: <span class=\"mjx-i\">\\(\\dfrac{9}{1/1+1/2}=6\\)<\/span> ✓.<\/p>\n<p><strong>Cách khác (thế):<\/strong> rút <span class=\"mjx-i\">\\(y\\)<\/span> từ ràng buộc, thay vào <span class=\"mjx-i\">\\(f\\)<\/span> được hàm một biến bậc hai, rồi dùng đỉnh parabol <span class=\"mjx-i\">\\(x=-\\tfrac{B}{2A}\\)<\/span>.<\/p>\n<p><strong>Bấm máy:<\/strong> Simultaneous Equation 3 ẩn với hệ <span class=\"mjx-i\">\\(2x-\\lambda=0\\)<\/span>, <span class=\"mjx-i\">\\(4y-\\lambda=0\\)<\/span>, <span class=\"mjx-i\">\\(x+y=3\\)<\/span>; hoặc sau khi thế, dùng Polynomial bậc 2 với mục \"min\" (máy fx-580VN X hiển thị tọa độ đỉnh khi giải bậc 2).<\/p>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">1 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-7-q12\"><strong>Câu 3.1<\/strong> <code>[FA24-RE Q36]<\/code> <code>[SP25-RE Q34]<\/code>\nUsing the Lagrange Multiplier method to solve the following problem\nMin <span class=\"mjx-i\">\\(4x^2 + y^2\\)<\/span> subject to <span class=\"mjx-i\">\\(2x + 2y = 5\\)<\/span> What is the optimal value of the problem?<\/p>\n<ul>\n<li>A. 5.5<\/li>\n<li>B. 4<\/li>\n<li>C. 5<\/li>\n<li>D. 3.5<\/li>\n<li>E. 4.5<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-7-h11\">Dạng 4: Hàm Lagrange &amp; bài toán đối ngẫu (LP, QP)<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Denote by <span class=\"mjx-i\">\\(\\mathcal{L}(x,y,\\lambda_1,\\lambda_2)\\)<\/span> the Lagrangian. Find <span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial y\\)<\/span> at …\"<\/em>, <em>\"Find the dual linear program\"<\/em>, <em>\"Find the dual Lagrangian <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)\\)<\/span>\"<\/em>, <em>\"Find the (transpose of the) derivative of the Lagrangian with respect to <span class=\"mjx-i\">\\(x\\)<\/span>\"<\/em>, <em>\"The associated Lagrangian dual problem\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(\\mathcal{L}=f+\\sum\\lambda_ig_i\\)<\/span>, với <span class=\"mjx-i\">\\(g_i\\)<\/span> là ràng buộc dạng <span class=\"mjx-i\">\\(\\le0\\)<\/span> (<span class=\"mjx-i\">\\(x+y\\le2\\)<\/span> thành <span class=\"mjx-i\">\\(g_1=x+y-2\\)<\/span>).<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial\\mathcal{L}}{\\partial\\lambda_i}=g_i(x)\\)<\/span>; <span class=\"mjx-i\">\\(\\dfrac{\\partial\\mathcal{L}}{\\partial y}=f_y+\\sum\\lambda_i\\,\\partial_yg_i\\)<\/span>.<\/li>\n<li><strong>LP<\/strong> <span class=\"mjx-i\">\\(\\min c^\\top x\\)<\/span> s.t. <span class=\"mjx-i\">\\(Ax\\le b\\)<\/span>: dual <span class=\"mjx-i\">\\(\\max_{\\lambda\\ge0}-b^\\top\\lambda\\)<\/span> s.t. <span class=\"mjx-i\">\\(c+A^\\top\\lambda=0\\)<\/span>; <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)=-b^\\top\\lambda\\)<\/span>.<\/li>\n<li><strong>QP<\/strong> <span class=\"mjx-i\">\\(\\min\\tfrac12x^\\top Qx+c^\\top x\\)<\/span> s.t. <span class=\"mjx-i\">\\(Ax\\le b\\)<\/span>: <span class=\"mjx-i\">\\(\\nabla_x\\mathcal{L}^\\top=Qx+c+A^\\top\\lambda\\)<\/span>; <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)=-\\tfrac12(c+A^\\top\\lambda)^\\top Q^{-1}(c+A^\\top\\lambda)-b^\\top\\lambda\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Đọc đúng <span class=\"mjx-i\">\\(c\\)<\/span>, <span class=\"mjx-i\">\\(A\\)<\/span>, <span class=\"mjx-i\">\\(b\\)<\/span> (hoặc <span class=\"mjx-i\">\\(Q\\)<\/span>) từ đề; nhớ <span class=\"mjx-i\">\\(c\\)<\/span> là hệ số hàm mục tiêu <strong>kể cả dấu<\/strong>.<\/li>\n<li>Câu đạo hàm: viết <span class=\"mjx-i\">\\(\\mathcal{L}\\)<\/span> ra, đạo hàm, thay số.<\/li>\n<li>Câu đối ngẫu LP: mục tiêu <span class=\"mjx-i\">\\(-b^\\top\\lambda\\)<\/span>; ràng buộc <strong>mỗi biến <span class=\"mjx-i\">\\(x_j\\)<\/span> một phương trình<\/strong>: <span class=\"mjx-i\">\\(c_j+(\\text{cột }j\\text{ của }A)\\cdot\\lambda=0\\)<\/span>.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (đạo hàm <span class=\"mjx-i\">\\(\\mathcal{L}\\)<\/span>).<\/strong> LP: <span class=\"mjx-i\">\\(\\min\\ x+3y\\)<\/span> s.t. <span class=\"mjx-i\">\\(2x-y\\le1\\)<\/span>, <span class=\"mjx-i\">\\(x+y\\le4\\)<\/span>. Find <span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial y\\)<\/span> and <span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial\\lambda_1\\)<\/span> at <span class=\"mjx-i\">\\((x,y,\\lambda_1,\\lambda_2)=(1,0,1,2)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\mathcal{L}=x+3y+\\lambda_1(2x-y-1)+\\lambda_2(x+y-4)\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial y=3-\\lambda_1+\\lambda_2=3-1+2=4\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial\\lambda_1=2x-y-1=2-0-1=1\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (đối ngẫu LP).<\/strong> <span class=\"mjx-i\">\\(\\min\\ 3x_1-x_2\\)<\/span> s.t. <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;1\\\\2&amp;-1\\end{bmatrix}x\\le\\begin{bmatrix}4\\\\1\\end{bmatrix}\\)<\/span>. Find the dual.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(c=(3,-1)\\)<\/span>, <span class=\"mjx-i\">\\(b=(4,1)\\)<\/span>, <span class=\"mjx-i\">\\(A^\\top=\\begin{bmatrix}1&amp;2\\\\1&amp;-1\\end{bmatrix}\\)<\/span>.\n<div class=\"mjx-d\">\\[\\max_{\\lambda\\ge0}\\ -4\\lambda_1-\\lambda_2\\quad\\text{s.t.}\\quad 3+\\lambda_1+2\\lambda_2=0,\\ \\ -1+\\lambda_1-\\lambda_2=0.\\]<\/div>\nDual Lagrangian: <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)=-4\\lambda_1-\\lambda_2\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (<span class=\"mjx-i\">\\(\\nabla_x\\mathcal{L}\\)<\/span> của QP).<\/strong> <span class=\"mjx-i\">\\(\\min\\ \\tfrac12x^\\top\\begin{bmatrix}3&amp;1\\\\1&amp;2\\end{bmatrix}x+[1\\ \\ 4]x\\)<\/span> s.t. <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;0\\\\2&amp;1\\\\0&amp;-1\\end{bmatrix}x\\le b\\)<\/span>. Find <span class=\"mjx-i\">\\(\\nabla_x\\mathcal{L}^\\top\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\begin{bmatrix}3&amp;1\\\\1&amp;2\\end{bmatrix}x+\\begin{bmatrix}1\\\\4\\end{bmatrix}+\\begin{bmatrix}1&amp;2&amp;0\\\\0&amp;1&amp;-1\\end{bmatrix}\\lambda\\)<\/span> (ma trận nhân <span class=\"mjx-i\">\\(\\lambda\\)<\/span> là <span class=\"mjx-i\">\\(A^\\top\\)<\/span>, cỡ <span class=\"mjx-i\">\\(2\\times3\\)<\/span>).<\/p>\n<p><strong>Ví dụ 4 (<span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)\\)<\/span> của QP).<\/strong> <span class=\"mjx-i\">\\(\\min\\ x_1^2+x_2^2\\)<\/span> s.t. <span class=\"mjx-i\">\\(x_1+2x_2\\le-2\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(Q=2I\\)<\/span> (vì <span class=\"mjx-i\">\\(x_1^2+x_2^2=\\tfrac12x^\\top(2I)x\\)<\/span>), <span class=\"mjx-i\">\\(c=0\\)<\/span>, <span class=\"mjx-i\">\\(A=[1\\ 2]\\)<\/span>, <span class=\"mjx-i\">\\(b=-2\\)<\/span>. <span class=\"mjx-i\">\\(A^\\top\\lambda=(\\lambda,2\\lambda)\\)<\/span>; <span class=\"mjx-i\">\\((A^\\top\\lambda)^\\top Q^{-1}(A^\\top\\lambda)=\\tfrac{5\\lambda^2}{2}\\)<\/span>.\n<span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)=-\\tfrac12\\cdot\\tfrac{5\\lambda^2}{2}-\\lambda(-2)=-\\tfrac54\\lambda^2+2\\lambda\\)<\/span>.<\/p>\n<p><strong>Ví dụ 5 (đối ngẫu một biến).<\/strong> <span class=\"mjx-i\">\\(\\min x^2\\)<\/span> s.t. <span class=\"mjx-i\">\\(x\\le2\\)<\/span>. Find the dual problem.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\mathcal{L}=x^2+\\lambda(x-2)\\)<\/span>; <span class=\"mjx-i\">\\(\\partial_x\\mathcal{L}=2x+\\lambda=0\\)<\/span> nên <span class=\"mjx-i\">\\(x=-\\tfrac\\lambda2\\)<\/span>. <span class=\"mjx-i\">\\(\\mathcal{D}=\\tfrac{\\lambda^2}{4}-\\tfrac{\\lambda^2}{2}-2\\lambda=-\\tfrac{\\lambda^2}{4}-2\\lambda\\)<\/span>. Dual: <span class=\"mjx-i\">\\(\\max_{\\lambda\\ge0}\\big(-\\tfrac{\\lambda^2}4-2\\lambda\\big)\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Quên chuyển ràng buộc về dạng <span class=\"mjx-i\">\\(\\le0\\)<\/span> (bỏ quên <span class=\"mjx-i\">\\(-b_i\\)<\/span>).<\/li>\n<li>Đối ngẫu LP: dùng <span class=\"mjx-i\">\\(A\\)<\/span> thay cho <span class=\"mjx-i\">\\(A^\\top\\)<\/span>, hoặc viết <span class=\"mjx-i\">\\(-c\\)<\/span> thay cho <span class=\"mjx-i\">\\(c\\)<\/span>; mục tiêu viết <span class=\"mjx-i\">\\(b^\\top\\lambda\\)<\/span> thay cho <span class=\"mjx-i\">\\(-b^\\top\\lambda\\)<\/span>.<\/li>\n<li>QP viết <span class=\"mjx-i\">\\(x^\\top Qx\\)<\/span> (không có <span class=\"mjx-i\">\\(\\tfrac12\\)<\/span>): đạo hàm là <span class=\"mjx-i\">\\(2Qx\\)<\/span>, không phải <span class=\"mjx-i\">\\(Qx\\)<\/span>.<\/li>\n<li>QP: quên số hạng <span class=\"mjx-i\">\\(c\\)<\/span> trong <span class=\"mjx-i\">\\(\\nabla_x\\mathcal{L}\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh (đối ngẫu LP, chọn đáp án)<\/strong><\/p>\n<ol>\n<li><strong>Mục tiêu<\/strong> phải là <span class=\"mjx-i\">\\(-b^\\top\\lambda\\)<\/span>: đổi dấu vế phải. <span class=\"mjx-i\">\\(b=(-2,1)\\)<\/span> thì mục tiêu <span class=\"mjx-i\">\\(2\\lambda_1-\\lambda_2\\)<\/span>. Bước này loại nửa số đáp án.<\/li>\n<li><strong>Ràng buộc<\/strong> phải chứa <span class=\"mjx-i\">\\(+c_j\\)<\/span> (đúng dấu hệ số hàm mục tiêu): <span class=\"mjx-i\">\\(c=(2,3)\\)<\/span> thì phương trình là <span class=\"mjx-i\">\\(2+\\dots=0\\)<\/span>, <span class=\"mjx-i\">\\(3+\\dots=0\\)<\/span>. Bước này chốt đáp án.<\/li>\n<\/ol>\n<p><strong>Mẹo nhanh (khác)<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial\\lambda_i\\)<\/span> chính là <span class=\"mjx-i\">\\(g_i(x)\\)<\/span> tại điểm: <strong>không phụ thuộc <span class=\"mjx-i\">\\(\\lambda\\)<\/span><\/strong>.<\/li>\n<li><span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial x_j\\)<\/span> là <strong>tuyến tính<\/strong> theo <span class=\"mjx-i\">\\(\\lambda\\)<\/span>: <span class=\"mjx-i\">\\(c_j+\\sum_i a_{ij}\\lambda_i\\)<\/span> (với LP), <strong>không phụ thuộc <span class=\"mjx-i\">\\(x\\)<\/span><\/strong>.<\/li>\n<li>Câu <span class=\"mjx-i\">\\(\\nabla_x\\mathcal{L}\\)<\/span> của QP: kiểm tra (1) có <span class=\"mjx-i\">\\(\\tfrac12\\)<\/span> hay không theo dạng mục tiêu; (2) có <span class=\"mjx-i\">\\(c\\)<\/span>; (3) ma trận nhân <span class=\"mjx-i\">\\(\\lambda\\)<\/span> là <span class=\"mjx-i\">\\(A^\\top\\)<\/span> (cỡ <span class=\"mjx-i\">\\(n\\times m\\)<\/span>).<\/li>\n<li><span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)\\)<\/span> của QP: số hạng bậc hai luôn <strong>âm<\/strong> (nửa xác định âm) và phần bậc nhất có <span class=\"mjx-i\">\\(-b^\\top\\lambda\\)<\/span>. Thử <span class=\"mjx-i\">\\(\\lambda=(1,0)\\)<\/span>: <span class=\"mjx-i\">\\(\\mathcal{D}\\)<\/span> phải bằng <span class=\"mjx-i\">\\(-\\tfrac12a_1^\\top Q^{-1}a_1-b_1\\)<\/span> (với <span class=\"mjx-i\">\\(a_1\\)<\/span> là hàng 1 của <span class=\"mjx-i\">\\(A\\)<\/span>, khi <span class=\"mjx-i\">\\(c=0\\)<\/span>).<\/li>\n<\/ul>\n<p><strong>Bấm máy:<\/strong> câu giá trị <span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial y\\)<\/span> thì tính nhẩm. Câu <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)\\)<\/span> phức tạp: thay <span class=\"mjx-i\">\\(\\lambda=(1,0)\\)<\/span> và <span class=\"mjx-i\">\\((0,1)\\)<\/span> vào công thức rồi so với từng đáp án (Matrix mode tính <span class=\"mjx-i\">\\((c+A^\\top\\lambda)^\\top Q^{-1}(c+A^\\top\\lambda)\\)<\/span>).<\/p>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">12 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-7-q13\"><strong>Câu 4.1<\/strong> <code>[FA24-RE Q35]<\/code> <code>[SP26 Q29]<\/code> <code>[SP26 Q36]<\/code>\nConsider the following linear programming<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\n\\min\\quad &amp;-x+4y\\\\\n\\text{subject to}\\quad &amp;x+y\\le 2\\\\\n&amp;2x-3y\\le 3\n\\end{aligned}\\]<\/div><\/p>\n<p>Denote by <span class=\"mjx-i\">\\(\\mathcal{L}(x,y,\\lambda_1,\\lambda_2)\\)<\/span> be the Lagrangian.\nFind <span class=\"mjx-i\">\\(\\frac{\\partial \\mathcal{L}(x,y,\\lambda_1,\\lambda_2)}{\\partial y}\\)<\/span> at <span class=\"mjx-i\">\\((x,y,\\lambda_1,\\lambda_2)=(2,-1,1,2)\\)<\/span> .<\/p>\n<ul>\n<li>A. -4<\/li>\n<li>B. 4<\/li>\n<li>C. -1<\/li>\n<li>D. 1<\/li>\n<li>E. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q14\"><strong>Câu 4.2<\/strong> <code>[Đề B Q33]<\/code>\nConsider the following linear programming<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\n\\min\\quad &amp; -x + 4y \\\\\n\\text{subject to}\\quad &amp; x + y \\le 2 \\\\\n&amp; 2x - 3y \\le 3\n\\end{aligned}\\]<\/div><\/p>\n<p>Denote by <span class=\"mjx-i\">\\(\\mathcal{L}(x, y, \\lambda_1, \\lambda_2)\\)<\/span> be the Lagrangian.\nFind <span class=\"mjx-i\">\\(\\frac{\\partial \\mathcal{L}(x, y, \\lambda_1, \\lambda_2)}{\\partial \\lambda_1}\\)<\/span> at <span class=\"mjx-i\">\\((x, y, \\lambda_1, \\lambda_2) = (2, -1, 1, 2)\\)<\/span> .<\/p>\n<ul>\n<li>A. 4<\/li>\n<li>B. -4<\/li>\n<li>C. 1<\/li>\n<li>D. -1<\/li>\n<li>E. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q15\"><strong>Câu 4.3<\/strong> <code>[SP26 Q8]<\/code> <code>[SP25-RE Q32]<\/code>\nConsider the linear program <span class=\"mjx-i\">\\(\\min_{x \\in \\mathbb{R}^2} (2x_1 + 3x_2)\\)<\/span> <span class=\"mjx-i\">\\(\\text{subject to } \\begin{bmatrix} 1 &amp; 2 \\\\ -1 &amp; 3 \\end{bmatrix} \\begin{bmatrix} x_1 \\\\ x_2 \\end{bmatrix} \\le \\begin{bmatrix} -2 \\\\ 1 \\end{bmatrix}.\\)<\/span>\nFind the dual linear program.<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\max_{\\lambda \\in \\mathbb{R}^2} (-2\\lambda_1 + \\lambda_2)\\)<\/span> <span class=\"mjx-i\">\\(\\text{subject to } \\begin{cases} -2 + \\lambda_1 - \\lambda_2 = 0 \\\\ -3 + 2\\lambda_1 + 3\\lambda_2 = 0 \\\\ \\lambda_1, \\lambda_2 \\ge 0 \\end{cases}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\max_{\\lambda \\in \\mathbb{R}^2} (2\\lambda_1 - \\lambda_2)\\)<\/span> <span class=\"mjx-i\">\\(\\text{subject to } \\begin{cases} -2 + \\lambda_1 - \\lambda_2 = 0 \\\\ -3 + 2\\lambda_1 + 3\\lambda_2 = 0 \\\\ \\lambda_1, \\lambda_2 \\ge 0 \\end{cases}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\max_{\\lambda \\in \\mathbb{R}^2} (-2\\lambda_1 + \\lambda_2)\\)<\/span> <span class=\"mjx-i\">\\(\\text{subject to } \\begin{cases} 2 + \\lambda_1 - \\lambda_2 = 0 \\\\ 3 + 2\\lambda_1 + 3\\lambda_2 = 0 \\\\ \\lambda_1, \\lambda_2 \\ge 0 \\end{cases}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\max_{\\lambda \\in \\mathbb{R}^2} (2\\lambda_1 - \\lambda_2)\\)<\/span> <span class=\"mjx-i\">\\(\\text{subject to } \\begin{cases} 2 + \\lambda_1 - \\lambda_2 = 0 \\\\ 3 + 2\\lambda_1 + 3\\lambda_2 = 0 \\\\ \\lambda_1, \\lambda_2 \\ge 0 \\end{cases}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iii)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (iv)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q16\"><strong>Câu 4.4<\/strong> <code>[SP26 Q9]<\/code>\nFind the dual optimization problem to the following linear programming <span class=\"mjx-i\">\\(\\min \\quad 2x_1 - 3x_2\\)<\/span> subject to<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\nx_1 + x_2 &amp;\\le -1 \\\\\n3x_1 - 4x_2 &amp;\\le -2 \\\\\nx_2 &amp;\\le 1\n\\end{aligned}\\]<\/div><\/p>\n<ul>\n<li>(i)<\/li>\n<\/ul>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\n&amp;\\max \\quad -\\lambda_1 + 2\\lambda_2 + \\lambda_3 \\\\\n&amp;\\text{subject to } \\lambda_1 + 3\\lambda_2 = -2 \\\\\n&amp;\\phantom{\\text{subject to }} \\lambda_1 - 4\\lambda_2 + \\lambda_3 = 3 \\\\\n&amp;\\phantom{\\text{subject to }} \\lambda_1 \\ge 0, \\lambda_2 \\ge 0, \\lambda_3 \\ge 0\n\\end{aligned}\\]<\/div><\/p>\n<ul>\n<li>(ii)<\/li>\n<\/ul>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\n&amp;\\max \\quad -\\lambda_1 + 2\\lambda_2 + \\lambda_3 \\\\\n&amp;\\text{subject to } \\lambda_1 + 3\\lambda_2 = 2 \\\\\n&amp;\\phantom{\\text{subject to }} \\lambda_1 - 4\\lambda_2 + \\lambda_3 = -3 \\\\\n&amp;\\phantom{\\text{subject to }} \\lambda_1 \\ge 0, \\lambda_2 \\ge 0, \\lambda_3 \\ge 0\n\\end{aligned}\\]<\/div><\/p>\n<ul>\n<li>(iii)<\/li>\n<\/ul>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\n&amp;\\max \\quad \\lambda_1 + 2\\lambda_2 - \\lambda_3 \\\\\n&amp;\\text{subject to } \\lambda_1 + 3\\lambda_2 = -2 \\\\\n&amp;\\phantom{\\text{subject to }} \\lambda_1 - 4\\lambda_2 + \\lambda_3 = 3 \\\\\n&amp;\\phantom{\\text{subject to }} \\lambda_1 \\ge 0, \\lambda_2 \\ge 0, \\lambda_3 \\ge 0\n\\end{aligned}\\]<\/div><\/p>\n<ul>\n<li>(iv)<\/li>\n<\/ul>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\n&amp;\\max \\quad \\lambda_1 + 2\\lambda_2 - \\lambda_3 \\\\\n&amp;\\text{subject to } \\lambda_1 + 3\\lambda_2 = 2 \\\\\n&amp;\\phantom{\\text{subject to }} \\lambda_1 - 4\\lambda_2 + \\lambda_3 = -3 \\\\\n&amp;\\phantom{\\text{subject to }} \\lambda_1 \\ge 0, \\lambda_2 \\ge 0, \\lambda_3 \\ge 0\n\\end{aligned}\\]<\/div><\/p>\n<ul>\n<li>A. (iv)<\/li>\n<li>B. (ii)<\/li>\n<li>C. (i)<\/li>\n<li>D. (iii)<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q17\"><strong>Câu 4.5<\/strong> <code>[SU24-RE Q33]<\/code>\nConsider the linear program<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\n\\min_{x\\in\\mathbb{R}^3}\\quad &amp; 2x_1-x_2-x_3\\\\\n\\text{subject to}\\quad &amp; \\\\\n\\begin{bmatrix} \\\\\n1 &amp; 2 &amp; 1\\\\\n-1 &amp; 3 &amp; 5\n\\end{bmatrix}\n\\begin{bmatrix}\nx_1\\\\\nx_2\\\\\nx_3\n\\end{bmatrix}\n\\le\n\\begin{bmatrix}\n2\\\\\n-1\n\\end{bmatrix}.\n\\end{aligned}\\]<\/div><\/p>\n<p>Find the dual Lagrangian <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(2\\lambda_1-\\lambda_2\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(-2\\lambda_1+\\lambda_2\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\lambda_1+2\\lambda_2+\\lambda_3\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\lambda_1-3\\lambda_2-5\\lambda_3\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q18\"><strong>Câu 4.6<\/strong> <code>[Đề A Q35]<\/code> <code>[FA24-FE Q36]<\/code>\nConsider the quadratic program<\/p>\n<p><div class=\"mjx-d\">\\[\\min_{x\\in\\mathbb{R}^2} \\frac{1}{2}\\begin{bmatrix}x_1 &amp; x_2\\end{bmatrix}\\begin{bmatrix}2 &amp; 1\\\\1 &amp; 4\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}5 &amp; 3\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\\]<\/div><\/p>\n<p>subject to<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{bmatrix}2 &amp; 1\\\\1 &amp; 0\\\\0 &amp; 3\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\\leq\\begin{bmatrix}2\\\\1\\\\3\\end{bmatrix}\\]<\/div><\/p>\n<p>Find the transpose of the derivative of the Lagrangian <span class=\"mjx-i\">\\(\\mathcal{L}(x,\\lambda)\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span> .<\/p>\n<ul>\n<li>A. (i) <span class=\"mjx-i\">\\(\\begin{bmatrix}2 &amp; 1\\\\1 &amp; 4\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}2 &amp; 1 &amp; 0\\\\1 &amp; 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}\\lambda_1\\\\ \\lambda_2\\\\ \\lambda_3\\end{bmatrix}\\)<\/span><\/li>\n<li>B. (ii) <span class=\"mjx-i\">\\(\\frac{1}{2}\\begin{bmatrix}2 &amp; 1\\\\1 &amp; 4\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}2 &amp; 1 &amp; 0\\\\1 &amp; 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}\\lambda_1\\\\ \\lambda_2\\\\ \\lambda_3\\end{bmatrix}\\)<\/span><\/li>\n<li>C. (iii) <span class=\"mjx-i\">\\(\\begin{bmatrix}2 &amp; 1\\\\1 &amp; 4\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}5\\\\3\\end{bmatrix}+\\begin{bmatrix}2 &amp; 1 &amp; 0\\\\1 &amp; 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}\\lambda_1\\\\ \\lambda_2\\\\ \\lambda_3\\end{bmatrix}\\)<\/span><\/li>\n<li>D. (iv) <span class=\"mjx-i\">\\(\\frac{1}{2}\\begin{bmatrix}2 &amp; 1\\\\1 &amp; 4\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}5\\\\3\\end{bmatrix}+\\begin{bmatrix}2 &amp; 1 &amp; 0\\\\1 &amp; 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}\\lambda_1\\\\ \\lambda_2\\\\ \\lambda_3\\end{bmatrix}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q19\"><strong>Câu 4.7<\/strong> <code>[Đề B Q40]<\/code>\nConsider the quadratic program\n<div class=\"mjx-d\">\\[\\min_{x\\in\\mathbb{R}^2} [x_1\\ x_2]\n\\begin{bmatrix}1 &amp; 2\\\\2 &amp; 3\\end{bmatrix}\n\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\n[3\\ 5]\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\\]<\/div>\nsubject to<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{bmatrix}2 &amp; 1\\\\-1 &amp; 2\\\\0 &amp; 1\\end{bmatrix}\n\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\n\\leq\n\\begin{bmatrix}-1\\\\2\\\\3\\end{bmatrix}\\]<\/div><\/p>\n<p>Find the derivative of the Lagrangian <span class=\"mjx-i\">\\(\\mathcal{L}(x, \\lambda)\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\begin{bmatrix}1 &amp; 2\\\\2 &amp; 3\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}3\\\\5\\end{bmatrix}+\\begin{bmatrix}2 &amp; -1 &amp; 0\\\\1 &amp; 2 &amp; 1\\end{bmatrix}\\begin{bmatrix}\\lambda_1\\\\ \\lambda_2\\\\ \\lambda_3\\end{bmatrix}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\begin{bmatrix}2 &amp; 4\\\\4 &amp; 6\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}3\\\\5\\end{bmatrix}+\\begin{bmatrix}2 &amp; -1 &amp; 0\\\\1 &amp; 2 &amp; 1\\end{bmatrix}\\begin{bmatrix}\\lambda_1\\\\ \\lambda_2\\\\ \\lambda_3\\end{bmatrix}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\begin{bmatrix}1 &amp; 2\\\\2 &amp; 3\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}2 &amp; -1 &amp; 0\\\\1 &amp; 2 &amp; 1\\end{bmatrix}\\begin{bmatrix}\\lambda_1\\\\ \\lambda_2\\\\ \\lambda_3\\end{bmatrix}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\begin{bmatrix}2 &amp; 4\\\\4 &amp; 6\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}2 &amp; -1 &amp; 0\\\\1 &amp; 2 &amp; 1\\end{bmatrix}\\begin{bmatrix}\\lambda_1\\\\ \\lambda_2\\\\ \\lambda_3\\end{bmatrix}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q20\"><strong>Câu 4.8<\/strong> <code>[Đề B Q34]<\/code>\nFind the dual Lagrangian <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)\\)<\/span> of the following quadratic programming<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{aligned}\n\\min\\quad &amp; x_1^2 + 3x_2^2\\\\\n\\text{subject to}\\quad &amp; x_1 + x_2 \\leq -1\\\\\n&amp; 2x_1 - x_2 \\leq 2\n\\end{aligned}\\]<\/div><\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(-\\frac{1}{3}\\lambda_1^2 - \\frac{5}{6}\\lambda_1\\lambda_2 - \\frac{13}{12}\\lambda_2^2 - \\lambda_1 + 2\\lambda_2\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(-\\frac{1}{3}\\lambda_1^2 - \\frac{5}{6}\\lambda_1\\lambda_2 - \\frac{13}{12}\\lambda_2^2 + \\lambda_1 - 2\\lambda_2\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(-\\frac{1}{3}\\lambda_1^2 + \\frac{5}{6}\\lambda_1\\lambda_2 - \\frac{13}{12}\\lambda_2^2 - \\lambda_1 + 2\\lambda_2\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(-\\frac{1}{3}\\lambda_1^2 - \\frac{5}{6}\\lambda_1\\lambda_2 + \\frac{13}{12}\\lambda_2^2 + \\lambda_1 - 2\\lambda_2\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q21\"><strong>Câu 4.9<\/strong> <code>[SP26 Q32]<\/code> <code>[SP26 Q38]<\/code>\nConsider the optimization problem: <span class=\"mjx-i\">\\(\\min_{x \\in \\mathbb{R}} x^2\\)<\/span> <span class=\"mjx-i\">\\(\\text{subject to } x \\le 1.\\)<\/span>\nThe associated Lagrangian dual problem is given by:<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\max_{\\lambda \\geq 0} \\left( \\frac{-\\lambda^2}{4} - \\frac{\\lambda}{4} \\right)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\max_{\\lambda \\geq 0} \\left( \\frac{-\\lambda^2}{2} - \\lambda \\right)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\max_{\\lambda \\geq 0} \\left( \\frac{-\\lambda^2}{4} - \\lambda \\right)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\max_{\\lambda \\geq 0} \\left( \\frac{-\\lambda^2}{4} - \\frac{\\lambda}{2} \\right)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iv)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (iii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q22\"><strong>Câu 4.10<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nConsider the quadratic program\n<div class=\"mjx-d\">\\[\\min_{x\\in\\mathbb{R}^2}\\ \\frac12\\begin{bmatrix}x_1&amp;x_2\\end{bmatrix}\\begin{bmatrix}2&amp;1\\\\1&amp;3\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}+\\begin{bmatrix}5&amp;2\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\\]<\/div>\nsubject to\n<div class=\"mjx-d\">\\[\\begin{bmatrix}2&amp;1\\\\1&amp;0\\\\0&amp;2\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\\le\\begin{bmatrix}1\\\\2\\\\3\\end{bmatrix}\\]<\/div>\nDetermine the transpose of the derivative of the Lagrangian <span class=\"mjx-i\">\\(\\mathcal{L}(x,\\lambda)\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span>.<\/p>\n<p class=\"qh\" id=\"MAI391-7-q23\"><strong>Câu 4.11<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nConsider the linear program\n<div class=\"mjx-d\">\\[\\min_{x\\in\\mathbb{R}^2}(3x_1+4x_2)\\]<\/div>\nsubject to\n<div class=\"mjx-d\">\\[\\begin{bmatrix}2&amp;-1\\\\-1&amp;1\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\\le\\begin{bmatrix}2\\\\0\\end{bmatrix}\\]<\/div>\nDetermine the dual linear program.<\/p>\n<p class=\"qh\" id=\"MAI391-7-q24\"><strong>Câu 4.12<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nConsider the linear program\n<div class=\"mjx-d\">\\[\\min_{x\\in\\mathbb{R}^2}(x_1+2x_2)\\]<\/div>\nsubject to\n<div class=\"mjx-d\">\\[\\begin{bmatrix}2&amp;1\\\\-1&amp;1\\end{bmatrix}\\begin{bmatrix}x_1\\\\x_2\\end{bmatrix}\\le\\begin{bmatrix}2\\\\0\\end{bmatrix}\\]<\/div>\nDenote by <span class=\"mjx-i\">\\(\\mathcal{L}(x_1,x_2,\\lambda_1,\\lambda_2)\\)<\/span> the Lagrangian. Determine <span class=\"mjx-i\">\\(\\dfrac{\\partial\\mathcal{L}(x_1,x_2,\\lambda_1,\\lambda_2)}{\\partial x_1}\\)<\/span> evaluated at the point <span class=\"mjx-i\">\\((1,0,1,0)\\)<\/span>.<\/p>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-7-h12\">Dạng 5: Tập lồi, hàm lồi, bài toán lồi<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Which of the following sets are convex?\"<\/em>, <em>\"Which of the following functions are convex on <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>?\"<\/em>, <em>\"Which optimization problems are convex?\"<\/em>, mệnh đề về tổng/tích hàm lồi.<\/p>\n<h3>Kiến thức<\/h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Đối tượng<\/th>\n<th>Lồi<\/th>\n<th>Không lồi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tập trong <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>, <span class=\"mjx-i\">\\(\\mathbb{R}^3\\)<\/span><\/td>\n<td>đường thẳng/mặt phẳng <span class=\"mjx-i\">\\(\\{a^\\top x=b\\}\\)<\/span>; nửa không gian <span class=\"mjx-i\">\\(\\{a^\\top x\\le b\\}\\)<\/span>; quả cầu/ellipse <strong>đặc<\/strong> <span class=\"mjx-i\">\\(\\{\\dots\\le r^2\\}\\)<\/span>; hình thoi <span class=\"mjx-i\">\\(\\{|x|+|y|\\le1\\}\\)<\/span>; giao các tập lồi; <span class=\"mjx-i\">\\(\\{g(x)\\le0\\}\\)<\/span> với <span class=\"mjx-i\">\\(g\\)<\/span> lồi<\/td>\n<td>đường tròn/ellipse (chỉ <strong>viền<\/strong>) <span class=\"mjx-i\">\\(\\{\\dots=1\\}\\)<\/span>; phần <strong>ngoài<\/strong> <span class=\"mjx-i\">\\(\\{\\dots\\ge1\\}\\)<\/span>; <span class=\"mjx-i\">\\(\\{|x|+|y|\\ge1\\}\\)<\/span>; vành khăn<\/td>\n<\/tr>\n<tr>\n<td>Hàm khả vi 2 lần<\/td>\n<td>Hessian <strong>nửa xác định dương<\/strong> mọi nơi<\/td>\n<td>Hessian có lúc không nửa xác định dương<\/td>\n<\/tr>\n<tr>\n<td>Phép toán<\/td>\n<td>tổng hai hàm lồi; <span class=\"mjx-i\">\\(c\\cdot f\\)<\/span> với <span class=\"mjx-i\">\\(c\\ge0\\)<\/span>; <span class=\"mjx-i\">\\(\\max\\)<\/span> các hàm lồi<\/td>\n<td><strong>tích<\/strong> hai hàm lồi (nói chung)<\/td>\n<\/tr>\n<tr>\n<td>Bài toán<\/td>\n<td><span class=\"mjx-i\">\\(f\\)<\/span> lồi, <span class=\"mjx-i\">\\(g_i\\le0\\)<\/span> với <span class=\"mjx-i\">\\(g_i\\)<\/span> lồi, ràng buộc đẳng thức <strong>affine<\/strong><\/td>\n<td>có ràng buộc đẳng thức phi tuyến (như <span class=\"mjx-i\">\\(x^2+y^2=1\\)<\/span>)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Hessian <span class=\"mjx-i\">\\(2\\times2\\)<\/span> <span class=\"mjx-i\">\\(\\begin{bmatrix}a&amp;b\\\\b&amp;c\\end{bmatrix}\\)<\/span> nửa xác định dương <span class=\"mjx-i\">\\(\\iff a\\ge0,\\ c\\ge0,\\ ac-b^2\\ge0\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ul>\n<li><strong>Tập:<\/strong> viết dưới dạng <span class=\"mjx-i\">\\(\\{g(x)\\le0\\}\\)<\/span> rồi kiểm tra <span class=\"mjx-i\">\\(g\\)<\/span> lồi; hoặc tìm <strong>hai điểm<\/strong> trong tập mà trung điểm nằm ngoài (phản ví dụ).<\/li>\n<li><strong>Hàm:<\/strong> tính Hessian, kiểm tra nửa xác định dương <strong>với mọi<\/strong> <span class=\"mjx-i\">\\((x,y)\\)<\/span>.<\/li>\n<li><strong>Bài toán:<\/strong> kiểm tra hàm mục tiêu lồi, ràng buộc bất đẳng thức dạng (lồi) <span class=\"mjx-i\">\\(\\le0\\)<\/span>, ràng buộc đẳng thức affine.<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (tập).<\/strong> Which are convex? <span class=\"mjx-i\">\\(U=\\{(x,y): 3x-y\\le2\\}\\)<\/span>, <span class=\"mjx-i\">\\(V=\\{(x,y): x^2+y^2=4\\}\\)<\/span>, <span class=\"mjx-i\">\\(W=\\{(x,y): x^2+4y^2\\le4\\}\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(U\\)<\/span>: nửa mặt phẳng, <strong>lồi<\/strong>.<\/li>\n<li><span class=\"mjx-i\">\\(V\\)<\/span>: đường tròn (chỉ viền). Lấy <span class=\"mjx-i\">\\((2,0)\\)<\/span> và <span class=\"mjx-i\">\\((-2,0)\\)<\/span> thuộc <span class=\"mjx-i\">\\(V\\)<\/span>, trung điểm <span class=\"mjx-i\">\\((0,0)\\notin V\\)<\/span>, nên <strong>không lồi<\/strong>.<\/li>\n<li><span class=\"mjx-i\">\\(W\\)<\/span>: ellipse đặc, <span class=\"mjx-i\">\\(g=x^2+4y^2-4\\)<\/span> lồi, nên <strong>lồi<\/strong>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (hàm).<\/strong> Which are convex on <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>? <span class=\"mjx-i\">\\(f=x^2+4xy+y^2\\)<\/span>, <span class=\"mjx-i\">\\(g=x^2-xy+y^2\\)<\/span>, <span class=\"mjx-i\">\\(h=x^3+y^2\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(H_f=\\begin{bmatrix}2&amp;4\\\\4&amp;2\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(\\det=4-16&lt;0\\)<\/span>, nên <strong>không lồi<\/strong>.<\/li>\n<li><span class=\"mjx-i\">\\(H_g=\\begin{bmatrix}2&amp;-1\\\\-1&amp;2\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(\\det=3&gt;0\\)<\/span>, <span class=\"mjx-i\">\\(2&gt;0\\)<\/span>, nên <strong>lồi<\/strong>.<\/li>\n<li><span class=\"mjx-i\">\\(H_h=\\begin{bmatrix}6x&amp;0\\\\0&amp;2\\end{bmatrix}\\)<\/span>: <span class=\"mjx-i\">\\(6x&lt;0\\)<\/span> khi <span class=\"mjx-i\">\\(x&lt;0\\)<\/span>, nên <strong>không lồi<\/strong> trên <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 3 (bài toán).<\/strong> (i) <span class=\"mjx-i\">\\(\\min(x^2+e^y)\\)<\/span> s.t. <span class=\"mjx-i\">\\(x+y\\le1\\)<\/span>; (ii) <span class=\"mjx-i\">\\(\\min(x+y)\\)<\/span> s.t. <span class=\"mjx-i\">\\(x^2+y^2=1\\)<\/span>. Which are convex problems?<\/p>\n<p><strong>Giải:<\/strong> (i) mục tiêu lồi, ràng buộc tuyến tính, nên <strong>lồi<\/strong>. (ii) ràng buộc đẳng thức phi tuyến (đường tròn), nên <strong>không lồi<\/strong>.<\/p>\n<p><strong>Ví dụ 4 (mệnh đề).<\/strong> (i) The product of two convex functions is convex. (ii) The sum of two convex functions is convex.<\/p>\n<p><strong>Giải:<\/strong> (i) sai: <span class=\"mjx-i\">\\(f=x\\)<\/span> và <span class=\"mjx-i\">\\(g=x^2\\)<\/span> đều lồi nhưng <span class=\"mjx-i\">\\(fg=x^3\\)<\/span> không lồi. (ii) đúng.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Coi đường tròn <span class=\"mjx-i\">\\(x^2+y^2=1\\)<\/span> là lồi (nhầm với hình tròn đặc).<\/li>\n<li>Kết luận hàm lồi chỉ vì các hệ số bình phương dương (như <span class=\"mjx-i\">\\(x^2-6xy+y^2\\)<\/span>: <span class=\"mjx-i\">\\(\\det=4-36&lt;0\\)<\/span>).<\/li>\n<li><span class=\"mjx-i\">\\(\\{x+y^2\\le0\\}\\)<\/span>: nghĩ là không lồi vì \"có <span class=\"mjx-i\">\\(y^2\\)<\/span>\"; thực ra <span class=\"mjx-i\">\\(g=x+y^2\\)<\/span> lồi nên tập <strong>lồi<\/strong>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Dấu \"<span class=\"mjx-i\">\\(=\\)<\/span>\" với biểu thức phi tuyến<\/strong> (đường tròn, ellipse) thì <strong>không lồi<\/strong>. Dấu \"<span class=\"mjx-i\">\\(=\\)<\/span>\" với biểu thức <strong>tuyến tính<\/strong> thì lồi.<\/li>\n<li><strong>\"<span class=\"mjx-i\">\\(\\le\\)<\/span>\" với hàm lồi<\/strong> thì lồi; <strong>\"<span class=\"mjx-i\">\\(\\ge\\)<\/span>\" với hàm lồi<\/strong> (phần ngoài) thì không lồi.<\/li>\n<li>Hàm bậc hai <span class=\"mjx-i\">\\(ax^2+bxy+cy^2\\)<\/span>: lồi <span class=\"mjx-i\">\\(\\iff a\\ge0,\\ c\\ge0,\\ 4ac\\ge b^2\\)<\/span>. Ví dụ <span class=\"mjx-i\">\\(x^2-6xy+y^2\\)<\/span>: <span class=\"mjx-i\">\\(4&lt;36\\)<\/span> nên không lồi.<\/li>\n<li>Hàm có <span class=\"mjx-i\">\\(x^3\\)<\/span> (hoặc bậc lẻ) trên toàn <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>: không lồi.<\/li>\n<li><span class=\"mjx-i\">\\(x^2-y^2\\)<\/span>: Hessian <span class=\"mjx-i\">\\(\\mathrm{diag}(2,-2)\\)<\/span> không nửa xác định dương, nên không lồi.<\/li>\n<\/ul>\n<p><strong>Thử đáp án (phản ví dụ trung điểm):<\/strong> chọn hai điểm đối xứng thuộc tập, kiểm tra trung điểm. Ví dụ <span class=\"mjx-i\">\\(\\{|x|+|y|\\ge1\\}\\)<\/span>: <span class=\"mjx-i\">\\((1,0)\\)<\/span> và <span class=\"mjx-i\">\\((-1,0)\\)<\/span> thuộc tập, trung điểm <span class=\"mjx-i\">\\((0,0)\\)<\/span> thì không, nên không lồi.<\/p>\n<p><strong>Bấm máy:<\/strong> không cần; nếu muốn kiểm tra Hessian <span class=\"mjx-i\">\\(3\\times3\\)<\/span> thì Matrix → <code>Det<\/code>.<\/p>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">9 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-7-q25\"><strong>Câu 5.1<\/strong> <code>[FA24-RE Q37]<\/code>\nWhich of the following sets in <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span> are convex? <span class=\"mjx-i\">\\(U = \\{[x\\ y]^{\\mathsf{T}} \\mid x + 2y = 1}\\)<\/span> <span class=\"mjx-i\">\\(V = \\{[x\\ y]^{\\mathsf{T}} \\mid x + 2y \\leq 1}\\)<\/span><\/p>\n<ul>\n<li>A. Only U<\/li>\n<li>B. Only V<\/li>\n<li>C. Both U and V<\/li>\n<li>D. None of U or V<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q26\"><strong>Câu 5.2<\/strong> <code>[SP26 Q22]<\/code>\nWhich the following sets are convex? <span class=\"mjx-i\">\\(U = \\{(x, y, z) \\in \\mathbb{R}^3 : 2x + y - 3z \\le 5}\\)<\/span> <span class=\"mjx-i\">\\(V = \\{(x, y, z) \\in \\mathbb{R}^3 : x^2 + (y - 1)^2 + (z - 2)^2 \\le 4}\\)<\/span><\/p>\n<ul>\n<li>A. Neither U nor V<\/li>\n<li>B. Both U and V<\/li>\n<li>C. Only U<\/li>\n<li>D. Only V<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q27\"><strong>Câu 5.3<\/strong> <code>[SP26 Q16]<\/code> <code>[SP26 Q37]<\/code>\nWhich the following sets are convex?<\/p>\n<ul>\n<li>(i)<\/li>\n<\/ul>\n<p>S_1 = \\left{\\begin{bmatrix} x \\ y \\end{bmatrix} \\in \\mathbb{R}^2 : x + y^2 \\leq 0\\right}.<\/p>\n<ul>\n<li>(ii)<\/li>\n<\/ul>\n<p>S_2 = \\left{\\begin{bmatrix} x \\ y \\ z \\end{bmatrix} \\in \\mathbb{R}^3 : \\begin{cases} x + y + z \\leq 0 \\ 3x - y - z \\leq 1 \\end{cases}\\right}.<\/p>\n<ul>\n<li>A. None of the other choices is correct<\/li>\n<li>B. Both (i) and (ii)<\/li>\n<li>C. Only (ii)<\/li>\n<li>D. Only (i)<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q28\"><strong>Câu 5.4<\/strong> <code>[Đề A Q36]<\/code> <code>[FA24-FE Q37]<\/code>\nWhich of the following sets in <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span> are convex? <span class=\"mjx-i\">\\(U = \\{[x\\ y]^T \\mid x^2 + 2y^2 = 1}\\)<\/span> <span class=\"mjx-i\">\\(V = \\{[x\\ y]^T \\mid x^2 + 2y^2 \\ge 1}\\)<\/span><\/p>\n<ul>\n<li>A. Only U<\/li>\n<li>B. Only V<\/li>\n<li>C. Both U and V<\/li>\n<li>D. None of U or V<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q29\"><strong>Câu 5.5<\/strong> <code>[SP25-RE Q33]<\/code> <code>[SU24-RE Q35]<\/code>\nWhich of the following sets are convex? <span class=\"mjx-i\">\\(U = \\{(x,y) \\in \\mathbb{R}^2 : |x| + |y| \\le 1}\\)<\/span> <span class=\"mjx-i\">\\(V = \\{(x,y) \\in \\mathbb{R}^2 : |x| + |y| \\ge 1}\\)<\/span> .<\/p>\n<ul>\n<li>A. Only U<\/li>\n<li>B. Only V<\/li>\n<li>C. Neither U nor V<\/li>\n<li>D. Both U and V<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q30\"><strong>Câu 5.6<\/strong> <code>[SP26 Q29]<\/code>\nWhich of the following functions on <span class=\"mjx-i\">\\(\\text{R}^2\\)<\/span> are convex? <span class=\"mjx-i\">\\(f(x,y) = x^2 + y^2\\)<\/span> <span class=\"mjx-i\">\\(g(x,y) = x^2 - y^2\\)<\/span><\/p>\n<ul>\n<li>A. Both f and g<\/li>\n<li>B. None of f or g<\/li>\n<li>C. Only g<\/li>\n<li>D. Only f<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q31\"><strong>Câu 5.7<\/strong> <code>[SU24-RE Q34]<\/code> <code>[FA24-FE Q38]<\/code>\nWhich of the following functions are convex on <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span> ? <span class=\"mjx-i\">\\(f(x,y)=x^2-6xy+y^2\\)<\/span> <span class=\"mjx-i\">\\(g(x,y)=x^3+xy+y^2\\)<\/span><\/p>\n<ul>\n<li>A. Only <span class=\"mjx-i\">\\(f\\)<\/span><\/li>\n<li>B. Only <span class=\"mjx-i\">\\(g\\)<\/span><\/li>\n<li>C. Both <span class=\"mjx-i\">\\(f\\)<\/span> and <span class=\"mjx-i\">\\(g\\)<\/span><\/li>\n<li>D. Neither <span class=\"mjx-i\">\\(f\\)<\/span> nor <span class=\"mjx-i\">\\(g\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q32\"><strong>Câu 5.8<\/stro
