class=\"mjx-i\">\\(\\dim E_\\lambda\\)<\/span>.<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li>MatA <span class=\"mjx-i\">\\(=A\\)<\/span>, MatB <span class=\"mjx-i\">\\(=u\\)<\/span> (ma trận cột <span class=\"mjx-i\">\\(3\\times1\\)<\/span>), gõ <code>MatA×MatB<\/code> và so với <span class=\"mjx-i\">\\(u\\)<\/span>.<\/li>\n<li>Thử vector cho <span class=\"mjx-i\">\\(E_\\lambda\\)<\/span>: MatC <span class=\"mjx-i\">\\(=A-\\lambda I\\)<\/span> (nhập trực tiếp), gõ <code>MatC×MatB<\/code>; ra ma trận 0 là đúng.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">8 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-4-q17\"><strong>Câu 4.1<\/strong> <code>[FA24-RE Q9]<\/code>\nGiven that <span class=\"mjx-i\">\\(\\lambda = 9\\)<\/span> is an eigenvalue for the matrix<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{bmatrix}\n5 &amp; 2 &amp; -2 \\\\\n2 &amp; 5 &amp; -2 \\\\\n-2 &amp; -2 &amp; 5\n\\end{bmatrix}\\]<\/div><\/p>\n<p>Find basic eigenvectors corresponding to <span class=\"mjx-i\">\\(\\lambda = 9\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\([1\\ 1\\ -1]^T\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\([1\\ -1\\ 1]^T\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\([1\\ 1\\ 1]^T\\)<\/span> and <span class=\"mjx-i\">\\([0\\ 1\\ 1]^T\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\([1\\ 1\\ -1]^T\\)<\/span> and <span class=\"mjx-i\">\\([1\\ 0\\ 1]^T\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<li>\n<p>E. None of the other choices is correct<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q18\"><strong>Câu 4.2<\/strong> <code>[SP26 Q18]<\/code> <code>[SP26 Q10]<\/code>\nGiven <span class=\"mjx-i\">\\(A = \\begin{bmatrix} -4 &amp; 3 &amp; 1 \\\\ 3 &amp; 6 &amp; -1 \\\\ 1 &amp; 0 &amp; 2 \\end{bmatrix}, \\quad u = [3 \\quad -1 \\quad 2]^T \\text{ and } v = [-7 \\quad 2 \\quad 1]^T.\\)<\/span> Choose the correct statement.<\/p>\n<ul>\n<li>A. u is an eigenvector of A<\/li>\n<li>B. Both u and v are eigenvectors of A<\/li>\n<li>C. v is an eigenvector of A<\/li>\n<li>D. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q19\"><strong>Câu 4.3<\/strong> <code>[SP25-RE Q11]<\/code>\nGiven <span class=\"mjx-i\">\\(A=\\begin{bmatrix}3&amp;1&amp;1\\\\2&amp;2&amp;1\\\\1&amp;0&amp;4\\end{bmatrix},\\quad u=\\begin{bmatrix}1&amp;-1&amp;2\\end{bmatrix}^{T}\\text{ and }v=\\begin{bmatrix}-3&amp;5&amp;1\\end{bmatrix}^{T}.\\)<\/span> Choose the correct statement.<\/p>\n<ul>\n<li>A. v is an eigenvector of A<\/li>\n<li>B. Both u and v are eigenvectors of A<\/li>\n<li>C. None of the other choices is correct<\/li>\n<li>D. u is an eigenvector of A<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q20\"><strong>Câu 4.4<\/strong> <code>[SP25-RE Q12]<\/code>\nGiven that <span class=\"mjx-i\">\\(\\lambda = 0\\)<\/span> is an eigenvalue of the matrix<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{bmatrix}\n1 &amp; 1 &amp; 0 \\\\\n1 &amp; 1 &amp; 2 \\\\\n1 &amp; 1 &amp; 2\n\\end{bmatrix}\\]<\/div><\/p>\n<p>Find a set of basic eigenvectors corresponding to this eigenvalue 0.<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\([1\\ \\ 1\\ \\ 0]^{T}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\([1\\ \\ -1\\ \\ 0]^{T}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\([1\\ \\ 0\\ \\ -1]^{T}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\([1\\ \\ -1\\ \\ 0]^{T}\\)<\/span> and <span class=\"mjx-i\">\\([1\\ \\ 0\\ \\ -1]^{T}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. None of the other choices is correct<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<li>\n<p>E. (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q21\"><strong>Câu 4.5<\/strong> <code>[Đề B Q10]<\/code>\nGiven<\/p>\n<p><div class=\"mjx-d\">\\[A=\\begin{bmatrix}2 &amp; 4 &amp; 3\\\\4 &amp; 1 &amp; 2\\\\1 &amp; 0 &amp; 4\\end{bmatrix},\\quad u=\\begin{bmatrix}2 &amp; -1 &amp; 2\\end{bmatrix}^{T}\\text{ and }v=\\begin{bmatrix}-1 &amp; -1 &amp; 1\\end{bmatrix}^{T}.\\]<\/div><\/p>\n<p>Choose the correct statement.<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(u\\)<\/span> is an eigenvector of <span class=\"mjx-i\">\\(A\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(v\\)<\/span> is an eigenvector of <span class=\"mjx-i\">\\(A\\)<\/span><\/li>\n<li>C. Both <span class=\"mjx-i\">\\(u\\)<\/span> and <span class=\"mjx-i\">\\(v\\)<\/span> are eigenvectors of <span class=\"mjx-i\">\\(A\\)<\/span><\/li>\n<li>D. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q22\"><strong>Câu 4.6<\/strong> <code>[SU24-RE Q9]<\/code>\nGiven that <span class=\"mjx-i\">\\(\\lambda = 2\\)<\/span> is a eigenvalue of the matrix<\/p>\n<p><div class=\"mjx-d\">\\[A = \\begin{bmatrix}\n2 &amp; 3 &amp; 4 \\\\\n0 &amp; 5 &amp; 1 \\\\\n0 &amp; 6 &amp; 7\n\\end{bmatrix}\\]<\/div><\/p>\n<p>Find an eigenvector corresponding to eigenvalue <span class=\"mjx-i\">\\(\\lambda = 2\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\([1, 0, 0]\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\([0, 1, 0]\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\([0, 0, 1]\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\([1, 1, 1]\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q23\"><strong>Câu 4.7<\/strong> <code>[SP26 Q12]<\/code>\nGiven that <span class=\"mjx-i\">\\(\\lambda=1\\)<\/span> is an eigenvalue of the matrix<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{bmatrix}\n1 &amp; 1 &amp; 1 \\\\\n0 &amp; 1 &amp; 1 \\\\\n0 &amp; 0 &amp; 0\n\\end{bmatrix}.\\]<\/div><\/p>\n<p>Find a set of basic eigenvectors corresponding to this eigenvalue <span class=\"mjx-i\">\\(\\lambda=1\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\{[0,0,1]^T\\}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\{[1,0,0]^T, [0,0,1]^T\\}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\{[1,0,0]^T\\}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\{[0,0,1]^T, [1,1,0]^T\\}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (ii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<li>\n<p>E. None of the others<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q24\"><strong>Câu 4.8<\/strong> <code>[SP26 Q37]<\/code>\nGiven that <span class=\"mjx-i\">\\(\\lambda = 2\\)<\/span> is an eigenvalue of the matrix<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{bmatrix}\n3 &amp; 1 &amp; 1 \\\\\n1 &amp; 3 &amp; 1 \\\\\n1 &amp; 1 &amp; 3\n\\end{bmatrix}.\\]<\/div><\/p>\n<p>Find a basis of the eigenspace <span class=\"mjx-i\">\\(E_2\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\{[1\\ \\ 1\\ \\ 0]^T, [1\\ \\ 0\\ \\ 1]^T\\}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\{[1\\ \\ 1\\ \\ 0]^T\\}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\{[-1\\ \\ 1\\ \\ 0]^T, [-1\\ \\ 0\\ \\ 1]^T\\}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\{[-1\\ \\ 1\\ \\ 0]^T\\}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (iv)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-4-h14\">Dạng 5: Quan hệ trị riêng – trace – định thức &amp; các tính chất<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"It has 3 eigenvalues <span class=\"mjx-i\">\\(s_1,s_2\\)<\/span> and <span class=\"mjx-i\">\\(s_3\\)<\/span>. What is <span class=\"mjx-i\">\\(s_3\\)<\/span>\"<\/em>, <em>\"has 4 distinct eigenvalues … Which statement is correct: <span class=\"mjx-i\">\\(\\det(A)=\\dots\\)<\/span> and <span class=\"mjx-i\">\\(\\mathrm{Trace}(A)=\\dots\\)<\/span>\"<\/em>, các mệnh đề về trị riêng của <span class=\"mjx-i\">\\(A^{-1}\\)<\/span>, <span class=\"mjx-i\">\\(A^2\\)<\/span>, <span class=\"mjx-i\">\\(A^\\top\\)<\/span>, về ma trận đối xứng, ma trận chéo hóa được.<\/p>\n<h3>Công thức &amp; tính chất<\/h3>\n<p><div class=\"mjx-d\">\\[\\boxed{\\mathrm{tr}A=\\lambda_1+\\dots+\\lambda_n,\\qquad \\det A=\\lambda_1\\lambda_2\\cdots\\lambda_n}\\]<\/div><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ma trận<\/th>\n<th>Trị riêng<\/th>\n<th>Ghi chú<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"mjx-i\">\\(A^k\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(\\lambda^k\\)<\/span><\/td>\n<td>cùng vector riêng<\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(A^{-1}\\)<\/span> (<span class=\"mjx-i\">\\(A\\)<\/span> khả nghịch)<\/td>\n<td><span class=\"mjx-i\">\\(1/\\lambda\\)<\/span><\/td>\n<td>cùng vector riêng<\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(A^\\top\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(\\lambda\\)<\/span> (<strong>không đổi<\/strong>)<\/td>\n<td>vector riêng có thể khác<\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\((A^\\top)^{-1}\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(1/\\lambda\\)<\/span><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(A+cI\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(\\lambda+c\\)<\/span><\/td>\n<td><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(cA\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(c\\lambda\\)<\/span><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><span class=\"mjx-i\">\\(A\\)<\/span> khả nghịch <span class=\"mjx-i\">\\(\\iff\\)<\/span> <span class=\"mjx-i\">\\(0\\)<\/span> <strong>không<\/strong> là trị riêng.<\/li>\n<li>Ma trận <strong>đối xứng<\/strong> luôn chéo hóa được (định lý phổ), nhưng <strong>không nhất thiết khả nghịch<\/strong> (ví dụ ma trận 0).<\/li>\n<li><span class=\"mjx-i\">\\(A\\)<\/span> chéo hóa được thì <span class=\"mjx-i\">\\(A^2\\)<\/span>, <span class=\"mjx-i\">\\(A^k\\)<\/span> chéo hóa được; nếu thêm khả nghịch thì <span class=\"mjx-i\">\\(A^{-1}\\)<\/span> cũng chéo hóa được (cùng <span class=\"mjx-i\">\\(P\\)<\/span>).<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> A diagonalizable <span class=\"mjx-i\">\\(3\\times3\\)<\/span> matrix <span class=\"mjx-i\">\\(A\\)<\/span> has <span class=\"mjx-i\">\\(\\mathrm{trace}(A)=10\\)<\/span> and eigenvalues <span class=\"mjx-i\">\\(2\\)<\/span>, <span class=\"mjx-i\">\\(3\\)<\/span> and <span class=\"mjx-i\">\\(s\\)<\/span>. Find <span class=\"mjx-i\">\\(s\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(2+3+s=10\\)<\/span>, nên <span class=\"mjx-i\">\\(s=5\\)<\/span>.<\/p>\n<p><strong>Ví dụ 2.<\/strong> <span class=\"mjx-i\">\\(A\\in\\mathbb{R}^{4\\times4}\\)<\/span> has eigenvalues <span class=\"mjx-i\">\\(-1,\\ 2,\\ 3,\\ 0.5\\)<\/span>. Find <span class=\"mjx-i\">\\(\\det A\\)<\/span> and <span class=\"mjx-i\">\\(\\mathrm{tr}A\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\det A=(-1)(2)(3)(0{,}5)=-3\\)<\/span>; <span class=\"mjx-i\">\\(\\mathrm{tr}A=-1+2+3+0{,}5=4{,}5\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (mệnh đề).<\/strong> Let <span class=\"mjx-i\">\\(s\\)<\/span> be an eigenvalue of an invertible matrix <span class=\"mjx-i\">\\(A\\)<\/span>. Which are <strong>incorrect<\/strong>? (i) <span class=\"mjx-i\">\\(1/s\\)<\/span> is an eigenvalue of <span class=\"mjx-i\">\\(A^{-1}\\)<\/span> (ii) <span class=\"mjx-i\">\\(s^3\\)<\/span> is an eigenvalue of <span class=\"mjx-i\">\\(A^3\\)<\/span> (iii) <span class=\"mjx-i\">\\(1/s\\)<\/span> is an eigenvalue of <span class=\"mjx-i\">\\(A^\\top\\)<\/span> (iv) <span class=\"mjx-i\">\\(s+2\\)<\/span> is an eigenvalue of <span class=\"mjx-i\">\\(A+2I\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> (i), (ii), (iv) đúng theo bảng trên. (iii) <strong>sai<\/strong>: <span class=\"mjx-i\">\\(A^\\top\\)<\/span> có cùng trị riêng <span class=\"mjx-i\">\\(s\\)<\/span>, không phải <span class=\"mjx-i\">\\(1/s\\)<\/span>. Đáp án: chỉ (iii).<\/p>\n<p><strong>Ví dụ 4 (mệnh đề).<\/strong> (i) Every symmetric matrix is diagonalizable. (ii) If <span class=\"mjx-i\">\\(A\\)<\/span> is diagonalizable then <span class=\"mjx-i\">\\(A\\)<\/span> is invertible.<\/p>\n<p><strong>Giải:<\/strong> (i) đúng (định lý phổ). (ii) sai: <span class=\"mjx-i\">\\(A=\\begin{bmatrix}1&amp;0\\\\0&amp;0\\end{bmatrix}\\)<\/span> chéo hóa được nhưng <span class=\"mjx-i\">\\(\\det=0\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Nhầm \"trị riêng của <span class=\"mjx-i\">\\(A^\\top\\)<\/span> là <span class=\"mjx-i\">\\(1/\\lambda\\)<\/span>\".<\/li>\n<li>Nghĩ \"đối xứng thì khả nghịch\", hoặc \"chéo hóa được thì khả nghịch\".<\/li>\n<li>Tính <span class=\"mjx-i\">\\(\\det\\)<\/span> bằng <strong>tổng<\/strong> thay vì <strong>tích<\/strong> các trị riêng.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li>Câu chọn cặp (<span class=\"mjx-i\">\\(\\det\\)<\/span>, trace): thường chỉ cần tính <strong>một<\/strong> đại lượng là loại được nửa số đáp án, tính đại lượng còn lại để chốt.<\/li>\n<li>Mệnh đề \"If … then …\": tìm phản ví dụ bằng các ma trận đơn giản nhất: <span class=\"mjx-i\">\\(0\\)<\/span>, <span class=\"mjx-i\">\\(I\\)<\/span>, <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;0\\\\0&amp;0\\end{bmatrix}\\)<\/span> (chéo hóa được, không khả nghịch), <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;1\\\\0&amp;1\\end{bmatrix}\\)<\/span> (khả nghịch, không chéo hóa được).<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> câu mệnh đề về trị riêng: lấy <span class=\"mjx-i\">\\(A=\\mathrm{diag}(2,3)\\)<\/span> (trị riêng <span class=\"mjx-i\">\\(2,3\\)<\/span>), tính thử <span class=\"mjx-i\">\\(A^{-1}\\)<\/span>, <span class=\"mjx-i\">\\(A^\\top\\)<\/span>, <span class=\"mjx-i\">\\(A^2\\)<\/span> để xem mệnh đề nào sai.<\/p>\n<p><strong>Bấm máy:<\/strong> tích và tổng các số thập phân (như <span class=\"mjx-i\">\\(-1{,}2;\\ 2{,}3;\\ -0{,}7;\\ 0{,}6\\)<\/span>) bấm trực tiếp ở Calculate mode.<\/p>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">6 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-4-q25\"><strong>Câu 5.1<\/strong> <code>[FA24-RE Q11]<\/code> <code>[Đề A Q13]<\/code>\nA diagonalizable matrix <span class=\"mjx-i\">\\(A\\)<\/span> of size <span class=\"mjx-i\">\\(3\\times3\\)<\/span> and <span class=\"mjx-i\">\\(\\operatorname{trace}(A) = 9\\)<\/span> . It has 3 eigenvalues <span class=\"mjx-i\">\\(s_1 = 1\\)<\/span> , <span class=\"mjx-i\">\\(s_2 = 3\\)<\/span> and <span class=\"mjx-i\">\\(s_3\\)<\/span> . What is the value of <span class=\"mjx-i\">\\(s_3\\)<\/span> ?<\/p>\n<ul>\n<li>A. 2<\/li>\n<li>B. 3<\/li>\n<li>C. 4<\/li>\n<li>D. 5<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q26\"><strong>Câu 5.2<\/strong> <code>[SP26 Q21]<\/code> <code>[SP26 Q11]<\/code>\nThe matrix <span class=\"mjx-i\">\\(A \\in \\mathbb{R}^{4\\times4}\\)<\/span> has 4 distinct eigenvalues <span class=\"mjx-i\">\\(-1, 3, -2, 2\\)<\/span> .\nWhich of the following statements is correct: <span class=\"mjx-i\">\\(det(A) = 12 \\text{ and } Trace(A) = 2\\)<\/span> <span class=\"mjx-i\">\\(det(A) = 18 \\text{ and } Trace(A) = 2\\)<\/span> <span class=\"mjx-i\">\\(det(A) = 18 \\text{ and } Trace(A) = 8\\)<\/span> <span class=\"mjx-i\">\\(det(A) = 12 \\text{ and } Trace(A) = 8\\)<\/span><\/p>\n<ul>\n<li>A. 1<\/li>\n<li>B. 2<\/li>\n<li>C. 3<\/li>\n<li>D. 4<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q27\"><strong>Câu 5.3<\/strong> <code>[SP26 Q17]<\/code>\nThe matrix <span class=\"mjx-i\">\\(A \\in \\mathbb{R}^{4\\times4}\\)<\/span> has 4 distinct eigenvalues <span class=\"mjx-i\">\\(-1.2, 2.3, -0.7, 0.6\\)<\/span> .\nWhich of the following statements is correct: <span class=\"mjx-i\">\\(det(A) = 1.16\\)<\/span> and <span class=\"mjx-i\">\\(Trace(A) = 1.0\\)<\/span> <span class=\"mjx-i\">\\(det(A) = 3.26\\)<\/span>\nand <span class=\"mjx-i\">\\(Trace(A) = 4.8\\)<\/span> <span class=\"mjx-i\">\\(det(A) = 2.45\\)<\/span>\nand <span class=\"mjx-i\">\\(Trace(A) = 1.0\\)<\/span> <span class=\"mjx-i\">\\(det(A) = 1.38\\)<\/span>\nand <span class=\"mjx-i\">\\(Trace(A) = 4.8\\)<\/span><\/p>\n<ul>\n<li>A. 4<\/li>\n<li>B. 3<\/li>\n<li>C. 2<\/li>\n<li>D. 1<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q28\"><strong>Câu 5.4<\/strong> <code>[FA24-FE Q11]<\/code>\nLet <span class=\"mjx-i\">\\(s\\)<\/span> be an eigenvalue of the matrix <span class=\"mjx-i\">\\(A\\)<\/span> . Choose the incorrect answer(s):<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(1/s\\)<\/span> is an eigenvalue of the matrix <span class=\"mjx-i\">\\(A^{-1}\\)<\/span> if <span class=\"mjx-i\">\\(A\\)<\/span> is invertible<\/li>\n<li>(ii) <span class=\"mjx-i\">\\(s^2\\)<\/span> is an eigenvalue of the matrix <span class=\"mjx-i\">\\(A^2\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(1/s\\)<\/span> is an eigenvalue of the matrix <span class=\"mjx-i\">\\(A^T\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(1/s\\)<\/span> is an eigenvalue of the matrix <span class=\"mjx-i\">\\((A^T)^{-1}\\)<\/span> if <span class=\"mjx-i\">\\(A\\)<\/span> is invertible<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q29\"><strong>Câu 5.5<\/strong> <code>[Đề B Q13]<\/code> <code>[SP26 Q35]<\/code>\nWhich of the following statements is true?<\/p>\n<ul>\n<li>\n<p>(i) If <span class=\"mjx-i\">\\(A\\)<\/span> is diagonalizable then so is <span class=\"mjx-i\">\\(A^2\\)<\/span> .<\/p>\n<\/li>\n<li>\n<p>(ii) If <span class=\"mjx-i\">\\(A\\)<\/span> is diagonalizable and invertible then so is <span class=\"mjx-i\">\\(A^{-1}\\)<\/span> .<\/p>\n<\/li>\n<li>\n<p>(i) nor (ii)<\/p>\n<\/li>\n<li>\n<p>A. Only (i)<\/p>\n<\/li>\n<li>\n<p>B. Only (ii)<\/p>\n<\/li>\n<li>\n<p>C. Both (i) and (ii)<\/p>\n<\/li>\n<li>\n<p>D. Neither<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q30\"><strong>Câu 5.6<\/strong> <code>[FA24-FE Q12]<\/code>\nWhich of the following statements is true?<\/p>\n<ul>\n<li>\n<p>(i) Every symmetric matrix is invertible.<\/p>\n<\/li>\n<li>\n<p>(ii) Every symmetric matrix is diagonalizable.<\/p>\n<\/li>\n<li>\n<p>(i) nor (ii)<\/p>\n<\/li>\n<li>\n<p>A. Only (i)<\/p>\n<\/li>\n<li>\n<p>B. Only (ii)<\/p>\n<\/li>\n<li>\n<p>C. Both (i) and (ii)<\/p>\n<\/li>\n<li>\n<p>D. Neither<\/p>\n<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-4-h15\">Dạng 6: Chéo hóa &amp; lũy thừa ma trận<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p>Đề cho sẵn <span class=\"mjx-i\">\\(A=PDP^{-1}\\)<\/span> (<em>\"Given the eigendecomposition\"<\/em>) và hỏi phần tử của <span class=\"mjx-i\">\\(A^n\\)<\/span>, <span class=\"mjx-i\">\\(\\det(A^n)\\)<\/span>, <span class=\"mjx-i\">\\(\\mathrm{tr}(A^n)\\)<\/span>, <span class=\"mjx-i\">\\(A^5\\)<\/span>; hoặc cho trị riêng và vector riêng, yêu cầu tìm một phần tử của <span class=\"mjx-i\">\\(A\\)<\/span>; hoặc tìm <span class=\"mjx-i\">\\(x\\)<\/span> để <span class=\"mjx-i\">\\(\\det A\\)<\/span> bằng một số.<\/p>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[A=PDP^{-1}\\ \\Rightarrow\\ \\boxed{A^n=PD^nP^{-1}},\\qquad D^n=\\mathrm{diag}(\\lambda_1^n,\\dots,\\lambda_k^n)\\]<\/div>\n<div class=\"mjx-d\">\\[\\det(A^n)=(\\lambda_1\\cdots\\lambda_k)^n,\\qquad \\mathrm{tr}(A^n)=\\lambda_1^n+\\dots+\\lambda_k^n\\]<\/div><\/p>\n<ul>\n<li><strong>Dựng <span class=\"mjx-i\">\\(A\\)<\/span> từ trị riêng/vector riêng:<\/strong> <span class=\"mjx-i\">\\(P=[v_1\\ v_2\\ \\cdots]\\)<\/span> (vector riêng làm <strong>cột<\/strong>), <span class=\"mjx-i\">\\(D=\\mathrm{diag}(\\lambda_1,\\lambda_2,\\dots)\\)<\/span> đúng thứ tự, rồi <span class=\"mjx-i\">\\(A=PDP^{-1}\\)<\/span>.<\/li>\n<li>Nghịch đảo <span class=\"mjx-i\">\\(2\\times2\\)<\/span>: <span class=\"mjx-i\">\\(\\begin{bmatrix}a&amp;b\\\\c&amp;d\\end{bmatrix}^{-1}=\\dfrac1{ad-bc}\\begin{bmatrix}d&amp;-b\\\\-c&amp;a\\end{bmatrix}\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Kiểm tra ma trận bên phải có đúng là <span class=\"mjx-i\">\\(P^{-1}\\)<\/span> không (nhân thử <span class=\"mjx-i\">\\(P\\cdot Q=I\\)<\/span>). Trong đề thật, nó luôn là <span class=\"mjx-i\">\\(P^{-1}\\)<\/span>, hoặc đề viết thẳng <span class=\"mjx-i\">\\(P^{-1}\\)<\/span>.<\/li>\n<li>Hỏi <span class=\"mjx-i\">\\(\\det(A^n)\\)<\/span> hoặc <span class=\"mjx-i\">\\(\\mathrm{tr}(A^n)\\)<\/span> thì <strong>chỉ dùng <span class=\"mjx-i\">\\(D\\)<\/span><\/strong>, không cần <span class=\"mjx-i\">\\(P\\)<\/span>.<\/li>\n<li>Hỏi phần tử <span class=\"mjx-i\">\\((i,j)\\)<\/span> của <span class=\"mjx-i\">\\(A^n\\)<\/span>: <span class=\"mjx-i\">\\((A^n)_{ij}=\\sum_k p_{ik}\\lambda_k^n(P^{-1})_{kj}\\)<\/span>, tức là (hàng <span class=\"mjx-i\">\\(i\\)<\/span> của <span class=\"mjx-i\">\\(P\\)<\/span>) <span class=\"mjx-i\">\\(\\times D^n\\times\\)<\/span> (cột <span class=\"mjx-i\">\\(j\\)<\/span> của <span class=\"mjx-i\">\\(P^{-1}\\)<\/span>).<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (phần tử của <span class=\"mjx-i\">\\(A^n\\)<\/span>).<\/strong> Given <span class=\"mjx-i\">\\(A=\\begin{bmatrix}1&amp;0\\\\2&amp;1\\end{bmatrix}\\begin{bmatrix}2&amp;0\\\\0&amp;-1\\end{bmatrix}\\begin{bmatrix}1&amp;0\\\\2&amp;1\\end{bmatrix}^{-1}\\)<\/span>. Find the <span class=\"mjx-i\">\\((2,1)\\)<\/span>-entry of <span class=\"mjx-i\">\\(A^3\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(P^{-1}=\\begin{bmatrix}1&amp;0\\\\-2&amp;1\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(D^3=\\mathrm{diag}(8,-1)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\((A^3)_{21}\\)<\/span> = (hàng 2 của <span class=\"mjx-i\">\\(P\\)<\/span>) <span class=\"mjx-i\">\\(\\cdot D^3\\cdot\\)<\/span> (cột 1 của <span class=\"mjx-i\">\\(P^{-1}\\)<\/span>) <span class=\"mjx-i\">\\(=(2,1)\\cdot\\mathrm{diag}(8,-1)\\cdot(1,-2)^\\top=2\\cdot8\\cdot1+1\\cdot(-1)\\cdot(-2)=16+2=18\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (<span class=\"mjx-i\">\\(\\det\\)<\/span>, trace của <span class=\"mjx-i\">\\(A^n\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(A\\)<\/span> has eigendecomposition with <span class=\"mjx-i\">\\(D=\\mathrm{diag}(-1,3)\\)<\/span>. Compute <span class=\"mjx-i\">\\(\\det(A^5)\\)<\/span> and <span class=\"mjx-i\">\\(\\mathrm{tr}(A^5)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\det(A^5)=(-1\\cdot3)^5=-243\\)<\/span>; <span class=\"mjx-i\">\\(\\mathrm{tr}(A^5)=(-1)^5+3^5=242\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (dựng <span class=\"mjx-i\">\\(A\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(A\\)<\/span> is <span class=\"mjx-i\">\\(2\\times2\\)<\/span> with eigenvalues <span class=\"mjx-i\">\\(2,3\\)<\/span> and corresponding eigenvectors <span class=\"mjx-i\">\\([1\\ 1]^T\\)<\/span>, <span class=\"mjx-i\">\\([0\\ 1]^T\\)<\/span>. Find the <span class=\"mjx-i\">\\((2,1)\\)<\/span>-entry of <span class=\"mjx-i\">\\(A\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(P=\\begin{bmatrix}1&amp;0\\\\1&amp;1\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(D=\\mathrm{diag}(2,3)\\)<\/span>, <span class=\"mjx-i\">\\(P^{-1}=\\begin{bmatrix}1&amp;0\\\\-1&amp;1\\end{bmatrix}\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(A=PDP^{-1}=\\begin{bmatrix}2&amp;0\\\\2&amp;3\\end{bmatrix}\\begin{bmatrix}1&amp;0\\\\-1&amp;1\\end{bmatrix}=\\begin{bmatrix}2&amp;0\\\\-1&amp;3\\end{bmatrix}\\)<\/span>, nên <span class=\"mjx-i\">\\((2,1)\\)<\/span>-entry <span class=\"mjx-i\">\\(=-1\\)<\/span>.<\/li>\n<li>Kiểm tra: <span class=\"mjx-i\">\\(A(1,1)^\\top=(2,2)^\\top=2(1,1)^\\top\\)<\/span> ✓; <span class=\"mjx-i\">\\(A(0,1)^\\top=(0,3)^\\top\\)<\/span> ✓.<\/li>\n<\/ul>\n<p><strong>Ví dụ 4 (tìm <span class=\"mjx-i\">\\(x\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(A=P\\begin{bmatrix}x&amp;0\\\\0&amp;x+1\\end{bmatrix}P^{-1}\\)<\/span>. Find <span class=\"mjx-i\">\\(x\\)<\/span> such that <span class=\"mjx-i\">\\(\\det A=6\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\det A=\\det D=x(x+1)=6\\iff x^2+x-6=0\\iff x=2\\)<\/span> hoặc <span class=\"mjx-i\">\\(x=-3\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Đặt vector riêng thành <strong>hàng<\/strong> của <span class=\"mjx-i\">\\(P\\)<\/span> thay vì <strong>cột<\/strong>.<\/li>\n<li>Tính <span class=\"mjx-i\">\\(A^n=P^nD^n(P^{-1})^n\\)<\/span> (sai).<\/li>\n<li>Hỏi <span class=\"mjx-i\">\\((1,2)\\)<\/span>-entry mà tính <span class=\"mjx-i\">\\((2,1)\\)<\/span>-entry.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Tam giác:<\/strong> nếu <span class=\"mjx-i\">\\(P\\)<\/span> là ma trận <strong>tam giác dưới<\/strong> (như <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;0\\\\1&amp;1\\end{bmatrix}\\)<\/span>) thì <span class=\"mjx-i\">\\(P^{-1}\\)<\/span> cũng tam giác dưới, nên <span class=\"mjx-i\">\\(A\\)<\/span> và mọi <span class=\"mjx-i\">\\(A^n\\)<\/span> đều tam giác dưới. Khi đó <strong>phần tử <span class=\"mjx-i\">\\((1,2)\\)<\/span> bằng 0<\/strong> ngay, và các phần tử đường chéo của <span class=\"mjx-i\">\\(A^n\\)<\/span> chính là <span class=\"mjx-i\">\\(\\lambda_i^n\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\det(A^n)\\)<\/span>, <span class=\"mjx-i\">\\(\\mathrm{tr}(A^n)\\)<\/span>: chỉ nhìn ma trận giữa <span class=\"mjx-i\">\\(D\\)<\/span>.<\/li>\n<li>Hai ma trận ngoài cùng là <span class=\"mjx-i\">\\(P\\)<\/span> và <span class=\"mjx-i\">\\(P^{-1}\\)<\/span> thì <span class=\"mjx-i\">\\(\\det A=\\det D\\)<\/span>, nên câu tìm <span class=\"mjx-i\">\\(x\\)<\/span> chỉ cần <span class=\"mjx-i\">\\(\\det D\\)<\/span>.<\/li>\n<li>Kiểm tra với <span class=\"mjx-i\">\\(n=1\\)<\/span>: thay <span class=\"mjx-i\">\\(n=1\\)<\/span> vào biểu thức đáp án, kết quả phải bằng phần tử tương ứng của <span class=\"mjx-i\">\\(A\\)<\/span> (dễ tính).<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> đáp án chứa <span class=\"mjx-i\">\\(2^{2023}\\)<\/span>, <span class=\"mjx-i\">\\(3^{2023}\\)<\/span>: thay <span class=\"mjx-i\">\\(2023\\)<\/span> bằng <span class=\"mjx-i\">\\(n=1\\)<\/span> (hoặc <span class=\"mjx-i\">\\(n=2\\)<\/span>), tính <span class=\"mjx-i\">\\(A\\)<\/span> (hoặc <span class=\"mjx-i\">\\(A^2\\)<\/span>) bằng máy, rồi so với đáp án tại <span class=\"mjx-i\">\\(n=1\\)<\/span>.<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li>MatA <span class=\"mjx-i\">\\(=P\\)<\/span>, MatB <span class=\"mjx-i\">\\(=D^n\\)<\/span> (tự tính <span class=\"mjx-i\">\\(\\lambda^n\\)<\/span> rồi nhập, ví dụ <span class=\"mjx-i\">\\(\\mathrm{diag}(32,1)\\)<\/span>), gõ <code>MatA×MatB×MatA⁻¹<\/code> để ra cả ma trận <span class=\"mjx-i\">\\(A^n\\)<\/span>.<\/li>\n<li>Hoặc tính <span class=\"mjx-i\">\\(A\\)<\/span> trước (MatC <span class=\"mjx-i\">\\(=\\)<\/span> <code>MatA×MatD×MatA⁻¹<\/code>), rồi dùng <code>MatC³<\/code>, <code>(MatC²)²<\/code>… để có lũy thừa nhỏ.<\/li>\n<li>Dạng <span class=\"mjx-i\">\\(A=P^{-1}DP\\)<\/span> (như Câu đề có <span class=\"mjx-i\">\\((\\cdot)^{-1}\\)<\/span> đứng trước): gõ <code>MatA⁻¹×MatB×MatA<\/code>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">9 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-4-q31\"><strong>Câu 6.1<\/strong> <code>[FA24-RE Q12]<\/code>\nGiven <span class=\"mjx-i\">\\(A = \\begin{bmatrix}1 &amp; 0 \\\\ 2 &amp; 1\\end{bmatrix}\\begin{bmatrix}2 &amp; 0 \\\\ 0 &amp; 3\\end{bmatrix}\\begin{bmatrix}1 &amp; 0 \\\\ 2 &amp; 1\\end{bmatrix}^{-1}\\)<\/span> .\nThe <span class=\"mjx-i\">\\((2,1)\\)<\/span> -entry of <span class=\"mjx-i\">\\(A^4\\)<\/span> is<\/p>\n<ul>\n<li>(i) 81<\/li>\n<li>(ii) 130<\/li>\n<li>(iii) <span class=\"mjx-i\">\\(-130\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(-81\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q32\"><strong>Câu 6.2<\/strong> <code>[SP26 Q6]<\/code> <code>[SU24-RE Q10]<\/code> <code>[SP26 Q12]<\/code>\nGiven the eigendecomposition: <span class=\"mjx-i\">\\(A = \\begin{bmatrix} 1 &amp; 0 \\\\ 1 &amp; 1 \\end{bmatrix} \\begin{bmatrix} 2 &amp; 0 \\\\ 0 &amp; 3 \\end{bmatrix} \\begin{bmatrix} 1 &amp; 0 \\\\ -1 &amp; 1 \\end{bmatrix}.\\)<\/span> Compute the <span class=\"mjx-i\">\\((1, 2)\\)<\/span> -entry of the matrix <span class=\"mjx-i\">\\(A^{2023}\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(2^{2023} - 3^{2023}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(2^{2023}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(3^{2023}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(2^{2023} + 3^{2023}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(v) <span class=\"mjx-i\">\\(0\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (v)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (iii)<\/p>\n<\/li>\n<li>\n<p>E. (iv)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q33\"><strong>Câu 6.3<\/strong> <code>[Đề B Q12]<\/code>\nGiven the eigendecomposition:<\/p>\n<p><div class=\"mjx-d\">\\[A = \\begin{bmatrix}1 &amp; 0\\\\1 &amp; 1\\end{bmatrix}\\begin{bmatrix}2 &amp; 0\\\\0 &amp; 3\\end{bmatrix}\\begin{bmatrix}1 &amp; 0\\\\-1 &amp; 1\\end{bmatrix}\\]<\/div><\/p>\n<p>Compute the <span class=\"mjx-i\">\\((2, 1)\\)<\/span> -entry of the matrix <span class=\"mjx-i\">\\(A^{2023}\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(2^{2023} - 3^{2023}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(2^{2023}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(3^{2023}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(2^{2023} + 3^{2023}\\)<\/span><\/li>\n<li>(v) <span class=\"mjx-i\">\\(0\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q34\"><strong>Câu 6.4<\/strong> <code>[SP26 Q34]<\/code> <code>[SP26 Q13]<\/code>\nLet <span class=\"mjx-i\">\\(A = \\begin{pmatrix} 1 &amp; 1 \\\\ 1 &amp; 2 \\end{pmatrix}^{-1} \\begin{pmatrix} -1 &amp; 0 \\\\ 0 &amp; 2 \\end{pmatrix} \\begin{pmatrix} 1 &amp; 1 \\\\ 1 &amp; 2 \\end{pmatrix}\\)<\/span> . Compute <span class=\"mjx-i\">\\(A^5\\)<\/span> :<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\begin{pmatrix} 34 &amp; -66 \\\\ 33 &amp; -65 \\end{pmatrix}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\begin{pmatrix} 34 &amp; 66 \\\\ -33 &amp; -65 \\end{pmatrix}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\begin{pmatrix} -34 &amp; 66 \\\\ -33 &amp; 65 \\end{pmatrix}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\begin{pmatrix} -34 &amp; -66 \\\\ 33 &amp; 65 \\end{pmatrix}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q35\"><strong>Câu 6.5<\/strong> <code>[Đề A Q12]<\/code> <code>[SP26 Q14]<\/code>\nGiven the eigendecomposition: <span class=\"mjx-i\">\\(A = \\begin{bmatrix}1 &amp; 0 \\\\ 1 &amp; 1\\end{bmatrix}\\begin{bmatrix}-1 &amp; 0 \\\\ 0 &amp; 1\\end{bmatrix}\\begin{bmatrix}1 &amp; 0 \\\\ -1 &amp; 1\\end{bmatrix}.\\)<\/span> Compute the trace of the matrix <span class=\"mjx-i\">\\(A^{2023}\\)<\/span> .<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. -2<\/li>\n<li>C. 2<\/li>\n<li>D. 1<\/li>\n<li>E. 2023<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q36\"><strong>Câu 6.6<\/strong> <code>[SP25-RE Q13]<\/code> <code>[SP26 Q4]<\/code>\nLet <span class=\"mjx-i\">\\(A\\)<\/span> be a matrix with the eigendecomposition:<\/p>\n<p><div class=\"mjx-d\">\\[A = \\begin{bmatrix}-1 &amp; 0 \\\\ -1 &amp; -1\\end{bmatrix}\\begin{bmatrix}-1 &amp; 0 \\\\ 0 &amp; 2\\end{bmatrix}\\begin{bmatrix}-1 &amp; 0 \\\\ 1 &amp; -1\\end{bmatrix}.\\]<\/div><\/p>\n<p>Compute the determinant of the matrix <span class=\"mjx-i\">\\(A^{2023}\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(-2^{2023}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(2^{2023}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(-2\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(2\\)<\/span><\/li>\n<li>(v) <span class=\"mjx-i\">\\(0\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q37\"><strong>Câu 6.7<\/strong> <code>[SP25-RE Q35]<\/code>\nGiven the eigendecomposition: <span class=\"mjx-i\">\\(A = \\begin{bmatrix}1 &amp; 0 \\\\ -1 &amp; 1\\end{bmatrix}\\begin{bmatrix}x &amp; 0 \\\\ 0 &amp; x - 2\\end{bmatrix}\\begin{bmatrix}1 &amp; 0 \\\\ 1 &amp; 1\\end{bmatrix},\\)<\/span> where x is a real number. Find the value of x if the determinant of A is -1.<\/p>\n<ul>\n<li>A. -1<\/li>\n<li>B. 2<\/li>\n<li>C. 1<\/li>\n<li>D. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q38\"><strong>Câu 6.8<\/strong> <code>[FA24-FE Q13]<\/code>\nLet <span class=\"mjx-i\">\\(A\\)<\/span> be a <span class=\"mjx-i\">\\(2 \\times 2\\)<\/span> matrix. Given that <span class=\"mjx-i\">\\(1\\)<\/span> and <span class=\"mjx-i\">\\(2\\)<\/span> are eigenvalues of <span class=\"mjx-i\">\\(A\\)<\/span> with corresponding eigenvectors <span class=\"mjx-i\">\\(\\begin{bmatrix}1 \\\\ 3\\end{bmatrix}^{T}\\)<\/span> and <span class=\"mjx-i\">\\(\\begin{bmatrix}0 \\\\ 1\\end{bmatrix}^{T}\\)<\/span> .\nFind the <span class=\"mjx-i\">\\((1,2)\\)<\/span> -entry of the matrix <span class=\"mjx-i\">\\(A\\)<\/span> .<\/p>\n<ul>\n<li>A. none of the other choices is true<\/li>\n<li>B. 1<\/li>\n<li>C. 2<\/li>\n<li>D. 0<\/li>\n<li>E. -3<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q39\"><strong>Câu 6.9<\/strong> <code>[SP26 Q15]<\/code>\nGiven <span class=\"mjx-i\">\\(A = \\begin{bmatrix} 1 &amp; 1 \\\\ 1 &amp; 2 \\end{bmatrix} \\begin{bmatrix} 2 &amp; 0 \\\\ 0 &amp; 1 \\end{bmatrix} \\begin{bmatrix} 1 &amp; 1 \\\\ 1 &amp; 2 \\end{bmatrix}^{-1}\\)<\/span> .\nThe <span class=\"mjx-i\">\\((2, 1)\\)<\/span> -entry of <span class=\"mjx-i\">\\(A^5\\)<\/span> is<\/p>\n<ul>\n<li>\n<p>(i) 64<\/p>\n<\/li>\n<li>\n<p>(ii) 62<\/p>\n<\/li>\n<li>\n<p>(iii) 60<\/p>\n<\/li>\n<li>\n<p>(iv) 58<\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (ii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-4-h16\">Dạng 7: Giá trị suy biến (singular values)<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"singular value(s)\"<\/em>, <em>\"How many nonzero singular values\"<\/em>, <em>\"rank … in terms of its singular values\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(\\sigma_i=\\sqrt{\\lambda_i(A^\\top A)}\\)<\/span> (hoặc <span class=\"mjx-i\">\\(\\sqrt{\\lambda_i(AA^\\top)}\\)<\/span>; chọn ma trận <strong>nhỏ hơn<\/strong>). Luôn có <span class=\"mjx-i\">\\(\\sigma_i\\ge0\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(A=U\\Sigma V^\\top\\)<\/span>: các giá trị suy biến là các phần tử <strong>đường chéo của <span class=\"mjx-i\">\\(\\Sigma\\)<\/span><\/strong> (dù <span class=\"mjx-i\">\\(U,V\\)<\/span> có dấu âm).<\/li>\n<li><strong>Số giá trị suy biến khác 0 = <span class=\"mjx-i\">\\(\\mathrm{rank}A\\)<\/span>.<\/strong><\/li>\n<li>Vector hàng/cột <span class=\"mjx-i\">\\(a\\)<\/span>: giá trị suy biến khác 0 duy nhất là <span class=\"mjx-i\">\\(\\lVert a\\rVert_2\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(A\\)<\/span> vuông khả nghịch: <span class=\"mjx-i\">\\(\\sigma(A^{-1})=1/\\sigma(A)\\)<\/span>; <span class=\"mjx-i\">\\(\\sigma(A^\\top)=\\sigma(A)\\)<\/span>; <span class=\"mjx-i\">\\(|\\det A|=\\sigma_1\\sigma_2\\cdots\\sigma_n\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\sum\\sigma_i^2=\\lVert A\\rVert_F^2\\)<\/span> (tổng bình phương mọi phần tử).<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Tính <span class=\"mjx-i\">\\(A^\\top A\\)<\/span> (hoặc <span class=\"mjx-i\">\\(AA^\\top\\)<\/span>), cỡ nhỏ nhất có thể.<\/li>\n<li>Giải <span class=\"mjx-i\">\\(\\lambda^2-\\mathrm{tr}\\,\\lambda+\\det=0\\)<\/span>.<\/li>\n<li>Lấy căn các nghiệm dương.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> Find the singular values of <span class=\"mjx-i\">\\(A=\\begin{bmatrix}3&amp;0\\\\4&amp;5\\end{bmatrix}\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(A^\\top A=\\begin{bmatrix}25&amp;20\\\\20&amp;25\\end{bmatrix}\\)<\/span>; <span class=\"mjx-i\">\\(\\lambda^2-50\\lambda+(625-400)=0\\iff\\lambda^2-50\\lambda+225=0\\)<\/span>, nên <span class=\"mjx-i\">\\(\\lambda=45\\)<\/span> hoặc <span class=\"mjx-i\">\\(5\\)<\/span>. Vậy <span class=\"mjx-i\">\\(\\sigma_1=3\\sqrt5\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma_2=\\sqrt5\\)<\/span>. (Kiểm tra: <span class=\"mjx-i\">\\(\\sigma_1\\sigma_2=15=|\\det A|\\)<\/span> ✓.)<\/p>\n<p><strong>Ví dụ 2 (số giá trị suy biến khác 0).<\/strong> How many nonzero singular values does <span class=\"mjx-i\">\\(A=\\begin{bmatrix}1&amp;2\\\\2&amp;4\\\\3&amp;6\\end{bmatrix}\\)<\/span> have?<\/p>\n<p><strong>Giải:<\/strong> Cột 2 <span class=\"mjx-i\">\\(=2\\times\\)<\/span> cột 1, nên <span class=\"mjx-i\">\\(\\mathrm{rank}A=1\\)<\/span>, và có <strong>1<\/strong> giá trị suy biến khác 0.<\/p>\n<p><strong>Ví dụ 3 (vector).<\/strong> Find all nonzero singular values of <span class=\"mjx-i\">\\(A=[1\\ 2\\ 3]\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(AA^\\top=[14]\\)<\/span> nên <span class=\"mjx-i\">\\(\\sigma=\\sqrt{14}\\)<\/span> (đúng bằng độ dài vector).<\/p>\n<p><strong>Ví dụ 4 (liên hệ với định thức).<\/strong> <span class=\"mjx-i\">\\(A\\in\\mathbb{R}^{3\\times3}\\)<\/span>, <span class=\"mjx-i\">\\(\\det A=-12\\)<\/span>, two singular values are <span class=\"mjx-i\">\\(1\\)<\/span> and <span class=\"mjx-i\">\\(2\\)<\/span>. Find the third.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\sigma_1\\sigma_2\\sigma_3=|\\det A|=12\\)<\/span>, nên <span class=\"mjx-i\">\\(\\sigma_3=6\\)<\/span>.<\/p>\n<p><strong>Ví dụ 5 (<span class=\"mjx-i\">\\(A^{-1}\\)<\/span>, <span class=\"mjx-i\">\\(A^\\top\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(A\\)<\/span> is <span class=\"mjx-i\">\\(2\\times2\\)<\/span> invertible with singular values <span class=\"mjx-i\">\\(2\\)<\/span> and <span class=\"mjx-i\">\\(5\\)<\/span>. Then <span class=\"mjx-i\">\\(A^{-1}\\)<\/span> has singular values <span class=\"mjx-i\">\\(\\tfrac12,\\tfrac15\\)<\/span>, and <span class=\"mjx-i\">\\(A^\\top\\)<\/span> has <span class=\"mjx-i\">\\(2,5\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Chọn đáp án có <strong>giá trị âm<\/strong> (ví dụ \"<span class=\"mjx-i\">\\(-1\\)<\/span> and <span class=\"mjx-i\">\\(\\sqrt3\\)<\/span>\"): giá trị suy biến luôn <span class=\"mjx-i\">\\(\\ge0\\)<\/span>.<\/li>\n<li>Đọc <span class=\"mjx-i\">\\(\\sigma\\)<\/span> từ <span class=\"mjx-i\">\\(U\\)<\/span> hoặc <span class=\"mjx-i\">\\(V\\)<\/span> thay vì <span class=\"mjx-i\">\\(\\Sigma\\)<\/span>.<\/li>\n<li>Quên lấy căn: trị riêng của <span class=\"mjx-i\">\\(A^\\top A\\)<\/span> là <span class=\"mjx-i\">\\(\\sigma^2\\)<\/span>, không phải <span class=\"mjx-i\">\\(\\sigma\\)<\/span>.<\/li>\n<li>Nhầm \"rank = số giá trị suy biến\" (phải là số giá trị suy biến <strong>khác 0<\/strong>).<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Các cột đôi một vuông góc<\/strong> thì <span class=\"mjx-i\">\\(\\sigma\\)<\/span> = độ dài các cột. Ví dụ <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;0\\\\-1&amp;0\\end{bmatrix}\\)<\/span>: cột <span class=\"mjx-i\">\\((1,-1)\\)<\/span> và <span class=\"mjx-i\">\\((0,0)\\)<\/span>, nên <span class=\"mjx-i\">\\(\\sigma=\\sqrt2,0\\)<\/span>. Ma trận <span class=\"mjx-i\">\\(\\begin{bmatrix}0&amp;1\\\\-1&amp;0\\end{bmatrix}\\)<\/span>: hai cột vuông góc, độ dài 1, nên <span class=\"mjx-i\">\\(\\sigma=1,1\\)<\/span>.<\/li>\n<li><strong>Hạng 1<\/strong> (mọi hàng tỉ lệ) thì <span class=\"mjx-i\">\\(\\sigma_1=\\lVert A\\rVert_F=\\sqrt{\\sum a_{ij}^2}\\)<\/span>.<\/li>\n<li>Kiểm tra đáp án bằng hai đẳng thức: <span class=\"mjx-i\">\\(\\sigma_1^2+\\sigma_2^2=\\lVert A\\rVert_F^2\\)<\/span> và (nếu vuông) <span class=\"mjx-i\">\\(\\sigma_1\\sigma_2=|\\det A|\\)<\/span>.<\/li>\n<li>Ma trận <span class=\"mjx-i\">\\(3\\times2\\)<\/span> có hai cột không tỉ lệ thì <strong>2<\/strong> giá trị suy biến khác 0; ma trận vuông có <span class=\"mjx-i\">\\(\\det\\ne0\\)<\/span> thì đủ <span class=\"mjx-i\">\\(n\\)<\/span> giá trị khác 0.<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> với từng cặp <span class=\"mjx-i\">\\((\\sigma_1,\\sigma_2)\\)<\/span> trong đáp án, kiểm tra <span class=\"mjx-i\">\\(\\sigma_1^2+\\sigma_2^2=\\lVert A\\rVert_F^2\\)<\/span>. Câu SP25 (<span class=\"mjx-i\">\\(A=\\begin{bmatrix}1&amp;-1\\\\0&amp;1\\\\1&amp;0\\end{bmatrix}\\)<\/span>): <span class=\"mjx-i\">\\(\\lVert A\\rVert_F^2=4\\)<\/span>, chỉ một cặp không âm thỏa mãn.<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li>MatA <span class=\"mjx-i\">\\(=A\\)<\/span>, gõ <code>Trn(MatA)×MatA<\/code> để được ma trận <span class=\"mjx-i\">\\(2\\times2\\)<\/span> <span class=\"mjx-i\">\\(\\begin{bmatrix}p&amp;q\\\\q&amp;r\\end{bmatrix}\\)<\/span>.<\/li>\n<li><code>MENU<\/code> → Equation/Func → Polynomial → bậc 2 → nhập <span class=\"mjx-i\">\\(1,\\ -(p+r),\\ pr-q^2\\)<\/span> → được <span class=\"mjx-i\">\\(\\lambda_1,\\lambda_2\\)<\/span> → lấy căn.<\/li>\n<li>Đếm số giá trị suy biến khác 0 của ma trận vuông: <code>Det(MatA)<\/code>; khác 0 thì đủ <span class=\"mjx-i\">\\(n\\)<\/span> giá trị.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">12 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-4-q40\"><strong>Câu 7.1<\/strong> <code>[FA24-RE Q13]<\/code>\nFind the nonzero singular value of the matrix <span class=\"mjx-i\">\\(A = \\begin{bmatrix}3 &amp; 1\\end{bmatrix}\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(1\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\sqrt{10}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(2\\sqrt{10}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\sqrt{6}\\)<\/span><\/li>\n<li>(v) <span class=\"mjx-i\">\\(2\\sqrt{6}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q41\"><strong>Câu 7.2<\/strong> <code>[FA24-RE Q14]<\/code> <code>[Đề B Q35]<\/code>\nLet <span class=\"mjx-i\">\\(A\\)<\/span> be an invertible square matrix of size <span class=\"mjx-i\">\\(2 \\times 2\\)<\/span> . Let 1 and 2 be the two singular values of <span class=\"mjx-i\">\\(A\\)<\/span> . Choose the correct answer:<\/p>\n<ul>\n<li>\n<p>(i) 1 and <span class=\"mjx-i\">\\(1/2\\)<\/span> are two singular values of matrix <span class=\"mjx-i\">\\(A^{-1}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) 1 and <span class=\"mjx-i\">\\(1/2\\)<\/span> are two singular values of matrix <span class=\"mjx-i\">\\(A^T\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) -1 and -2 are two singular values of matrix <span class=\"mjx-i\">\\(A^{-1}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) 1 and <span class=\"mjx-i\">\\(\\sqrt{2}\\)<\/span> are two singular values of matrix <span class=\"mjx-i\">\\(A^T\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q42\"><strong>Câu 7.3<\/strong> <code>[SP26 Q13]<\/code> <code>[SP25-RE Q14]<\/code> <code>[SP26 Q14]<\/code>\nAssume that the SVD of A is given by <span class=\"mjx-i\">\\(A = \\begin{bmatrix} -1 &amp; 0 \\\\ 0 &amp; -1 \\end{bmatrix}\\begin{bmatrix} 4 &amp; 0 \\\\ 0 &amp; 1 \\end{bmatrix}\\begin{bmatrix} 1 &amp; 0 \\\\ 0 &amp; 1 \\end{bmatrix}.\\)<\/span> All singular values of A are ________<\/p>\n<ul>\n<li>A. 1 and 0<\/li>\n<li>B. 2 and 1<\/li>\n<li>C. 4 and 2<\/li>\n<li>D. 4 and 1<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q43\"><strong>Câu 7.4<\/strong> <code>[SP26 Q14]<\/code> <code>[SP26 Q15]<\/code>\nFind the largest singular value of <span class=\"mjx-i\">\\(A = \\begin{bmatrix} 1 &amp; 0 \\\\ -1 &amp; 0 \\end{bmatrix}.\\)<\/span><\/p>\n<ul>\n<li>\n<p>(i) 1<\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\sqrt{2}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) 2<\/p>\n<\/li>\n<li>\n<p>(iv) 0<\/p>\n<\/li>\n<li>\n<p>A. (iv)<\/p>\n<\/li>\n<li>\n<p>B. (i)<\/p>\n<\/li>\n<li>\n<p>C. (ii)<\/p>\n<\/li>\n<li>\n<p>D. (iii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q44\"><strong>Câu 7.5<\/strong> <code>[Đề A Q14]<\/code>\nFind all nonzero singular values of <span class=\"mjx-i\">\\(A = \\begin{bmatrix} 2 \\\\ -2 \\\\ 2 \\\\ -2 \\end{bmatrix}\\)<\/span> .<\/p>\n<ul>\n<li>A. 4<\/li>\n<li>B. 16<\/li>\n<li>C. 2<\/li>\n<li>D. 8<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q45\"><strong>Câu 7.6<\/strong> <code>[Đề A Q38]<\/code> <code>[SU24-RE Q12]<\/code> <code>[SP26 Q40]<\/code>\nWhat is the rank of a matrix <span class=\"mjx-i\">\\(A\\)<\/span> in terms of its singular values?<\/p>\n<ul>\n<li>(i) The rank is the number of nonzero singular values.<\/li>\n<li>(ii) The rank is the number of singular values.<\/li>\n<li>(iii) The rank is the sum of all singular values.<\/li>\n<li>(iv) The rank is the largest singular value.<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q46\"><strong>Câu 7.7<\/strong> <code>[SP25-RE Q15]<\/code>\nThe singular values of <span class=\"mjx-i\">\\(A = \\begin{pmatrix} 1 &amp; -1 \\\\ 0 &amp; 1 \\\\ 1 &amp; 0 \\end{pmatrix}\\)<\/span> are:<\/p>\n<ul>\n<li>A. 1 and 3<\/li>\n<li>B. 1 and sqrt(3)<\/li>\n<li>C. -1 and sqrt(3)<\/li>\n<li>D. -1 and 3<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q47\"><strong>Câu 7.8<\/strong> <code>[Đề B Q14]<\/code>\nHow many nonzero singular values does <span class=\"mjx-i\">\\(A = \\begin{bmatrix} 1 &amp; 2 &amp; -1 \\\\ -1 &amp; -1 &amp; 1 \\\\ 0 &amp; 1 &amp; 1 \\end{bmatrix}\\)<\/span> have?<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 1<\/li>\n<li>C. 2<\/li>\n<li>D. 3<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q48\"><strong>Câu 7.9<\/strong> <code>[SU24-RE Q11]<\/code> <code>[FA24-FE Q14]<\/code> <code>[SP26 Q26]<\/code>\nHow many nonzero singular values does <span class=\"mjx-i\">\\(A = \\begin{bmatrix} 1 &amp; -1 \\\\ 2 &amp; 3 \\\\ 4 &amp; 1 \\end{bmatrix}\\)<\/span> have?<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 1<\/li>\n<li>C. 2<\/li>\n<li>D. 3<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q49\"><strong>Câu 7.10<\/strong> <code>[FA24-FE Q39]<\/code>\nFind all nonzero singular values of <span class=\"mjx-i\">\\(A = [1\\ -1]\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\sqrt{5}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(1\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\sqrt{2}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q50\"><strong>Câu 7.11<\/strong> <code>[SP26 Q6]<\/code>\nLet <span class=\"mjx-i\">\\(A = \\begin{pmatrix} 0 &amp; 1 \\\\ -1 &amp; 0 \\end{pmatrix}\\)<\/span> . What is the sum of the two singular values of A?<\/p>\n<ul>\n<li>A. 2<\/li>\n<li>B. 1<\/li>\n<li>C. 4<\/li>\n<li>D. Sqrt(2)<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q51\"><strong>Câu 7.12<\/strong> <code>[SP26 Q23]<\/code>\nMAI391_SP26_FE | Multiple Choice Question 23\n(Choose 1 answer)\nLet <span class=\"mjx-i\">\\(A\\)<\/span> be a matrix of size <span class=\"mjx-i\">\\(4 \\times 4\\)<\/span> with <span class=\"mjx-i\">\\(\\det(A) = 24\\)<\/span> . Assume <span class=\"mjx-i\">\\(A\\)<\/span> has four singular values in which three of them are 1, 2 and 3. Find the remaining singular value of <span class=\"mjx-i\">\\(A\\)<\/span> .<\/p>\n<ul>\n<li>A. 4<\/li>\n<li>B. 9<\/li>\n<li>C. 16<\/li>\n<li>D. 8<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-4-h17\">Dạng 8: Chuẩn phổ &amp; xấp xỉ hạng thấp (Eckart–Young)<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"spectral norm\"<\/em>, <span class=\"mjx-i\">\\(\\lVert A\\rVert_2\\)<\/span>, <em>\"rank-1 approximation <span class=\"mjx-i\">\\(\\hat A^{(1)}\\)<\/span>\"<\/em>, <em>\"<span class=\"mjx-i\">\\(\\lVert A-\\hat A(1)\\rVert_2\\)<\/span>\"<\/em>, <em>\"entry of the rank-1 approximation\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(\\lVert A\\rVert_2=\\sigma_1\\)<\/span> (giá trị suy biến <strong>lớn nhất<\/strong>).<\/li>\n<li><span class=\"mjx-i\">\\(A=U\\Sigma V^\\top=\\sum_i\\sigma_iu_iv_i^\\top\\)<\/span>, trong đó <span class=\"mjx-i\">\\(u_i\\)<\/span> = <strong>cột<\/strong> <span class=\"mjx-i\">\\(i\\)<\/span> của <span class=\"mjx-i\">\\(U\\)<\/span>, <span class=\"mjx-i\">\\(v_i^\\top\\)<\/span> = <strong>hàng<\/strong> <span class=\"mjx-i\">\\(i\\)<\/span> của <span class=\"mjx-i\">\\(V^\\top\\)<\/span>.<\/li>\n<li>Xấp xỉ hạng <span class=\"mjx-i\">\\(k\\)<\/span>: <span class=\"mjx-i\">\\(\\hat A^{(k)}=\\sum_{i=1}^k\\sigma_iu_iv_i^\\top\\)<\/span>.<\/li>\n<li><strong>Eckart–Young:<\/strong> <span class=\"mjx-i\">\\(\\boxed{\\lVert A-\\hat A^{(k)}\\rVert_2=\\sigma_{k+1}}\\)<\/span>; riêng <span class=\"mjx-i\">\\(k=1\\)<\/span>: <span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2=\\sigma_2\\)<\/span>.<\/li>\n<li>Phần tử: <span class=\"mjx-i\">\\(\\big(\\hat A^{(1)}\\big)_{ij}=\\sigma_1\\,(u_1)_i\\,(v_1)_j\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Đề cho SVD: đọc <span class=\"mjx-i\">\\(\\sigma\\)<\/span> trên đường chéo <span class=\"mjx-i\">\\(\\Sigma\\)<\/span>. Câu hỏi <span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2\\)<\/span> thì trả lời <span class=\"mjx-i\">\\(\\sigma_2\\)<\/span>, <strong>không cần tính gì thêm<\/strong>.<\/li>\n<li>Đề cho <span class=\"mjx-i\">\\(A\\)<\/span>: tìm <span class=\"mjx-i\">\\(\\sigma\\)<\/span> như Dạng 7, rồi áp dụng công thức.<\/li>\n<li>Hỏi phần tử <span class=\"mjx-i\">\\((i,j)\\)<\/span> của <span class=\"mjx-i\">\\(\\hat A^{(1)}\\)<\/span>: lấy <span class=\"mjx-i\">\\(\\sigma_1\\times\\)<\/span> (phần tử thứ <span class=\"mjx-i\">\\(i\\)<\/span> của <strong>cột 1 của <span class=\"mjx-i\">\\(U\\)<\/span><\/strong>) <span class=\"mjx-i\">\\(\\times\\)<\/span> (phần tử thứ <span class=\"mjx-i\">\\(j\\)<\/span> của <strong>hàng 1 của <span class=\"mjx-i\">\\(V^\\top\\)<\/span><\/strong>).<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (đề cho SVD).<\/strong> <span class=\"mjx-i\">\\(A=\\begin{bmatrix}0&amp;1\\\\1&amp;0\\end{bmatrix}\\begin{bmatrix}5&amp;0&amp;0\\\\0&amp;2&amp;0\\end{bmatrix}\\begin{bmatrix}\\frac1{\\sqrt2}&amp;\\frac1{\\sqrt2}&amp;0\\\\0&amp;0&amp;1\\\\\\frac1{\\sqrt2}&amp;-\\frac1{\\sqrt2}&amp;0\\end{bmatrix}\\)<\/span>. Find <span class=\"mjx-i\">\\(\\lVert A\\rVert_2\\)<\/span>, <span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2\\)<\/span> and the <span class=\"mjx-i\">\\((2,1)\\)<\/span>-entry of <span class=\"mjx-i\">\\(\\hat A^{(1)}\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\sigma_1=5\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma_2=2\\)<\/span>, nên <span class=\"mjx-i\">\\(\\lVert A\\rVert_2=5\\)<\/span> và <span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2=2\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(u_1=(0,1)^\\top\\)<\/span> (cột 1 của <span class=\"mjx-i\">\\(U\\)<\/span>), <span class=\"mjx-i\">\\(v_1^\\top=(\\tfrac1{\\sqrt2},\\tfrac1{\\sqrt2},0)\\)<\/span> (hàng 1 của <span class=\"mjx-i\">\\(V^\\top\\)<\/span>).<\/li>\n<li><span class=\"mjx-i\">\\((\\hat A^{(1)})_{21}=5\\cdot(u_1)_2\\cdot(v_1)_1=5\\cdot1\\cdot\\tfrac1{\\sqrt2}=\\tfrac{5}{\\sqrt2}\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (đề cho <span class=\"mjx-i\">\\(A\\)<\/span>, cột vuông góc).<\/strong> <span class=\"mjx-i\">\\(A=\\begin{bmatrix}3&amp;0\\\\0&amp;-4\\\\0&amp;0\\end{bmatrix}\\)<\/span>. Find <span class=\"mjx-i\">\\(\\lVert A\\rVert_2\\)<\/span> and <span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> Hai cột vuông góc, độ dài <span class=\"mjx-i\">\\(3\\)<\/span> và <span class=\"mjx-i\">\\(4\\)<\/span>, nên <span class=\"mjx-i\">\\(\\sigma_1=4\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma_2=3\\)<\/span>. Vậy <span class=\"mjx-i\">\\(\\lVert A\\rVert_2=4\\)<\/span> và <span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2=3\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (hạng 1).<\/strong> <span class=\"mjx-i\">\\(A=\\begin{bmatrix}1&amp;1\\\\2&amp;2\\end{bmatrix}\\)<\/span>. Find <span class=\"mjx-i\">\\(\\lVert A\\rVert_2\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> Hạng 1, nên <span class=\"mjx-i\">\\(\\sigma_1=\\lVert A\\rVert_F=\\sqrt{1+1+4+4}=\\sqrt{10}\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Trả lời <span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2=\\sigma_1\\)<\/span> (phải là <span class=\"mjx-i\">\\(\\sigma_2\\)<\/span>).<\/li>\n<li>Lấy <span class=\"mjx-i\">\\(v_1\\)<\/span> là <strong>cột<\/strong> 1 của <span class=\"mjx-i\">\\(V^\\top\\)<\/span> (phải là <strong>hàng<\/strong> 1).<\/li>\n<li>Coi <span class=\"mjx-i\">\\(\\lVert A\\rVert_2\\)<\/span> là phần tử lớn nhất của <span class=\"mjx-i\">\\(A\\)<\/span>, hoặc lấy giá trị âm.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li>Đề cho sẵn SVD: <span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2\\)<\/span> chính là <strong>số thứ hai trên đường chéo của <span class=\"mjx-i\">\\(\\Sigma\\)<\/span><\/strong>, trả lời trong 3 giây.<\/li>\n<li><span class=\"mjx-i\">\\(\\lVert A\\rVert_2\\)<\/span> khi các cột vuông góc: lấy <strong>độ dài cột lớn nhất<\/strong>. <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;0\\\\0&amp;1\\\\0&amp;0\\end{bmatrix}\\)<\/span>: các cột có độ dài 1, nên <span class=\"mjx-i\">\\(\\lVert A\\rVert_2=1\\)<\/span>.<\/li>\n<li>Ma trận dạng <span class=\"mjx-i\">\\(\\begin{bmatrix}a&amp;-b\\\\b&amp;a\\end{bmatrix}\\)<\/span> (phép quay có co giãn): <span class=\"mjx-i\">\\(\\sigma_1=\\sigma_2=\\sqrt{a^2+b^2}\\)<\/span>. Ví dụ <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;1\\\\-1&amp;1\\end{bmatrix}\\)<\/span> cho <span class=\"mjx-i\">\\(\\sqrt2\\)<\/span>.<\/li>\n<li>Chặn kiểm tra: <span class=\"mjx-i\">\\(\\max|a_{ij}|\\le\\lVert A\\rVert_2\\le\\lVert A\\rVert_F\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> dùng chặn <span class=\"mjx-i\">\\(\\max|a_{ij}|\\le\\lVert A\\rVert_2\\le\\lVert A\\rVert_F\\)<\/span> để loại các đáp án nằm ngoài khoảng.<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\lVert A\\rVert_2\\)<\/span>: như Dạng 7 (<code>Trn(MatA)×MatA<\/code>, rồi giải bậc 2, lấy căn nghiệm lớn).<\/li>\n<li>Phần tử của <span class=\"mjx-i\">\\(\\hat A^{(1)}\\)<\/span>: Calculate mode, bấm <span class=\"mjx-i\">\\(\\sigma_1\\times(u_1)_i\\times(v_1)_j\\)<\/span> (máy hiểu <code>√6×(-2÷√6)<\/code>).<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">6 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-4-q52\"><strong>Câu 8.1<\/strong> <code>[FA24-RE Q15]<\/code>\nGiven the singular value decomposition of <span class=\"mjx-i\">\\(A\\)<\/span> :<\/p>\n<p><div class=\"mjx-d\">\\[A = \\begin{bmatrix} \\frac{\\sqrt{2}}{2} &amp; -\\frac{\\sqrt{2}}{2} \\\\ \\frac{\\sqrt{2}}{2} &amp; \\frac{\\sqrt{2}}{2} \\end{bmatrix}\n\\begin{bmatrix} 3 &amp; 0 &amp; 0 \\\\ 0 &amp; \\sqrt{3} &amp; 0 \\end{bmatrix}\n\\begin{bmatrix} \\frac{\\sqrt{2}}{2} &amp; \\frac{\\sqrt{2}}{2} &amp; 0 \\\\ \\frac{\\sqrt{6}}{6} &amp; -\\frac{\\sqrt{6}}{6} &amp; \\frac{\\sqrt{6}}{3} \\\\ -\\frac{\\sqrt{3}}{3} &amp; \\frac{\\sqrt{3}}{3} &amp; \\frac{\\sqrt{3}}{3} \\end{bmatrix}\\]<\/div><\/p>\n<p>Denote by <span class=\"mjx-i\">\\(\\widehat{A}^{(1)}\\)<\/span> the 1-rank approximation of <span class=\"mjx-i\">\\(A\\)<\/span> .\nThe spectral norm of <span class=\"mjx-i\">\\(A - \\widehat{A}^{(1)}\\)<\/span> is:<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(1\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\sqrt{2}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\sqrt{3}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\sqrt{6}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q53\"><strong>Câu 8.2<\/strong> <code>[SP26 Q7]<\/code> <code>[SP26 Q16]<\/code>\nLet <span class=\"mjx-i\">\\(A = \\begin{bmatrix} 2 &amp; 0 \\\\ 0 &amp; 1 \\\\ 0 &amp; 0 \\end{bmatrix}\\)<\/span> and denote by <span class=\"mjx-i\">\\(\\hat{A}(1)\\)<\/span> the rank-1 approximation of A. Determine the spectral norm of A - <span class=\"mjx-i\">\\(\\hat{A}(1)\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) 2<\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\sqrt{2}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) 4<\/p>\n<\/li>\n<li>\n<p>(iv) 1<\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q54\"><strong>Câu 8.3<\/strong> <code>[Đề A Q15]<\/code>\nGiven the SVD of <span class=\"mjx-i\">\\(A\\)<\/span> as followings<\/p>\n<p><div class=\"mjx-d\">\\[A=\\begin{bmatrix}0&amp;1\\\\1&amp;0\\end{bmatrix}\n\\begin{bmatrix}\\sqrt{6}&amp;0&amp;0\\\\0&amp;\\sqrt{2}&amp;0\\end{bmatrix}\n\\begin{bmatrix}\n-\\frac{1}{\\sqrt{6}}&amp;-\\frac{2}{\\sqrt{6}}&amp;\\frac{1}{\\sqrt{6}}\\\\\n\\frac{1}{\\sqrt{2}}&amp;\\frac{1}{\\sqrt{2}}&amp;\\frac{1}{\\sqrt{2}}\\\\\n-\\frac{1}{\\sqrt{3}}&amp;\\frac{1}{\\sqrt{3}}&amp;\\frac{1}{\\sqrt{3}}\n\\end{bmatrix}\\]<\/div><\/p>\n<p>Find the (2,2)-entry of the rank-1 approximation of <span class=\"mjx-i\">\\(A\\)<\/span> .<\/p>\n<ul>\n<li>A. -6<\/li>\n<li>B. -3<\/li>\n<li>C. -2<\/li>\n<li>D. -1<\/li>\n<li>E. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q55\"><strong>Câu 8.4<\/strong> <code>[SP25-RE Q16]<\/code> <code>[SP26 Q15]<\/code>\nGiven the SVD of <span class=\"mjx-i\">\\(A\\)<\/span> as following<\/p>\n<p><div class=\"mjx-d\">\\[A = \\begin{bmatrix}0 &amp; 1\\\\1 &amp; 0\\end{bmatrix}\n\\begin{bmatrix}\\sqrt{6} &amp; 0 &amp; 0\\\\0 &amp; \\sqrt{2} &amp; 0\\end{bmatrix}\n\\begin{bmatrix}\n-\\frac{1}{\\sqrt{6}} &amp; -\\frac{2}{\\sqrt{6}} &amp; \\frac{1}{\\sqrt{6}}\\\\\n\\frac{1}{\\sqrt{2}} &amp; 0 &amp; \\frac{1}{\\sqrt{2}}\\\\\n-\\frac{1}{\\sqrt{3}} &amp; \\frac{1}{\\sqrt{3}} &amp; \\frac{1}{\\sqrt{3}}\n\\end{bmatrix}.\\]<\/div><\/p>\n<p>Find <span class=\"mjx-i\">\\(\\left\\|A - \\hat{A}(1)\\right\\|_2\\)<\/span> where <span class=\"mjx-i\">\\(\\hat{A}(1)\\)<\/span> is the rank-1 approximation of <span class=\"mjx-i\">\\(A\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(6\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\sqrt{6}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\sqrt{2}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(v) <span class=\"mjx-i\">\\(0\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iii)<\/p>\n<\/li>\n<li>\n<p>B. (v)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<li>\n<p>E. (iv)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q56\"><strong>Câu 8.5<\/strong> <code>[Đề B Q15]<\/code> <code>[SU24-RE Q13]<\/code> <code>[SP26 Q37]<\/code>\nThe spectral norm of <span class=\"mjx-i\">\\(A=\\begin{bmatrix}1 &amp; 1\\\\-1 &amp; 1\\end{bmatrix}^{T}\\)<\/span> is:<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\sqrt{2}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\sqrt{3}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(2\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\sqrt{5}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-4-q57\"><strong>Câu 8.6<\/strong> <code>[FA24-FE Q15]<\/code>\nCompute the spectral norm of the following matrix <span class=\"mjx-i\">\\(A=\\begin{bmatrix}1 &amp; 0\\\\0 &amp; 1\\\\0 &amp; 0\\end{bmatrix}.\\)<\/span><\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(2\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(1\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\sqrt{2}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\sqrt{5}\\)<\/span><\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h1 id=\"MAI391-4-h18\"><span class=\"pn\">Phần 4<\/span>Nhìn đề → nhận ra dạng<\/h1>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Từ khóa trong đề<\/th>\n<th>Dạng<\/th>\n<th>Việc cần làm ngay<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>determinant<\/em>, <span class=\"mjx-i\">\\(\\begin{vmatrix}\\cdots\\end{vmatrix}\\)<\/span><\/td>\n<td>1<\/td>\n<td>Tìm hàng/cột nhiều số 0; ma trận chữ thì trừ hàng tìm hàng tỉ lệ<\/td>\n<\/tr>\n<tr>\n<td><em>find all values of <span class=\"mjx-i\">\\(x\\)<\/span> … determinant equal to<\/em><\/td>\n<td>1<\/td>\n<td>Khai triển ra đa thức, hoặc thử đáp án bằng máy<\/td>\n<\/tr>\n<tr>\n<td><em>trace of the matrix<\/em> <span class=\"mjx-i\">\\(PBP^{-1}+C\\)<\/span><\/td>\n<td>2<\/td>\n<td><span class=\"mjx-i\">\\(\\mathrm{tr}B+\\mathrm{tr}C\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>Trace(AB) = Trace(A)Trace(B)…<\/em><\/td>\n<td>2<\/td>\n<td>Chỉ <span class=\"mjx-i\">\\(\\mathrm{tr}(A+B)\\)<\/span>, <span class=\"mjx-i\">\\(\\mathrm{tr}(CAC^{-1})\\)<\/span>, <span class=\"mjx-i\">\\(\\mathrm{tr}(AB)=\\mathrm{tr}(BA)\\)<\/span> là đúng<\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(f(x)=\\mathrm{trace}(xA)\\)<\/span>, <span class=\"mjx-i\">\\(f'\\)<\/span><\/td>\n<td>2<\/td>\n<td><span class=\"mjx-i\">\\(f'=\\mathrm{tr}A\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>characteristic polynomial<\/em><\/td>\n<td>3<\/td>\n<td><span class=\"mjx-i\">\\(-\\lambda^3+\\mathrm{tr}\\lambda^2-\\sum M_{ii}\\lambda+\\det\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>… is an eigenvalue of A<\/em><\/td>\n<td>3<\/td>\n<td><span class=\"mjx-i\">\\(\\det(A-\\lambda I)=0\\)<\/span>? Thử cả hai số<\/td>\n<\/tr>\n<tr>\n<td><em>Find the eigenvalues<\/em><\/td>\n<td>3<\/td>\n<td>Tách khối / tam giác; kiểm tra tổng = trace<\/td>\n<\/tr>\n<tr>\n<td><em>eigenvector<\/em>, <em>basic eigenvectors<\/em>, <em>eigenspace<\/em><\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(\\mathrm{rank}(A-\\lambda I)\\)<\/span> để biết số vector; thử <span class=\"mjx-i\">\\((A-\\lambda I)v=0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>eigenvalues <span class=\"mjx-i\">\\(s_1,s_2,s_3\\)<\/span>, trace<\/em><\/td>\n<td>5<\/td>\n<td><span class=\"mjx-i\">\\(\\sum\\lambda=\\mathrm{tr}\\)<\/span>, <span class=\"mjx-i\">\\(\\prod\\lambda=\\det\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(1/s\\)<\/span>, <span class=\"mjx-i\">\\(s^2\\)<\/span>, <span class=\"mjx-i\">\\(A^{-1}\\)<\/span>, <span class=\"mjx-i\">\\(A^T\\)<\/span>, <em>symmetric<\/em>, <em>diagonalizable<\/em><\/td>\n<td>5<\/td>\n<td>Bảng trị riêng; phản ví dụ ma trận đơn giản<\/td>\n<\/tr>\n<tr>\n<td><em>eigendecomposition<\/em>, <span class=\"mjx-i\">\\(A^{2023}\\)<\/span>, <span class=\"mjx-i\">\\(A^5\\)<\/span><\/td>\n<td>6<\/td>\n<td><span class=\"mjx-i\">\\(A^n=PD^nP^{-1}\\)<\/span>; <span class=\"mjx-i\">\\(\\det\\)<\/span>, trace chỉ cần <span class=\"mjx-i\">\\(D\\)<\/span>; <span class=\"mjx-i\">\\(P\\)<\/span> tam giác dưới thì <span class=\"mjx-i\">\\((1,2)=0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>eigenvalues … with corresponding eigenvectors … entry of A<\/em><\/td>\n<td>6<\/td>\n<td><span class=\"mjx-i\">\\(A=PDP^{-1}\\)<\/span>, vector riêng làm cột<\/td>\n<\/tr>\n<tr>\n<td><em>singular value(s)<\/em><\/td>\n<td>7<\/td>\n<td><span class=\"mjx-i\">\\(\\sqrt{\\lambda(A^\\top A)}\\)<\/span>; cột vuông góc thì lấy độ dài cột<\/td>\n<\/tr>\n<tr>\n<td><em>how many nonzero singular values<\/em>, <em>rank<\/em><\/td>\n<td>7<\/td>\n<td>= hạng của <span class=\"mjx-i\">\\(A\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>spectral norm<\/em><\/td>\n<td>8<\/td>\n<td><span class=\"mjx-i\">\\(\\sigma_1\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2\\)<\/span><\/td>\n<td>8<\/td>\n<td><span class=\"mjx-i\">\\(\\sigma_2\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>entry of the rank-1 approximation<\/em><\/td>\n<td>8<\/td>\n<td><span class=\"mjx-i\">\\(\\sigma_1(u_1)_i(v_1)_j\\)<\/span>, <span class=\"mjx-i\">\\(v_1\\)<\/span> là <strong>hàng<\/strong> 1 của <span class=\"mjx-i\">\\(V^\\top\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-4-h19\"><span class=\"pn\">Phần 5<\/span>Tổng hợp ôn thi<\/h1>\n<h2 id=\"MAI391-4-h20\">1. Công thức phải nhớ<\/h2>\n<p><div class=\"mjx-d\">\\[\\det(AB)=\\det A\\det B,\\quad \\det(A^\\top)=\\det A,\\quad \\det(kA)=k^n\\det A\\]<\/div>\n<div class=\"mjx-d\">\\[\\mathrm{tr}(PBP^{-1})=\\mathrm{tr}B,\\quad \\mathrm{tr}(AB)=\\mathrm{tr}(BA)\\]<\/div>\n<div class=\"mjx-d\">\\[p_A(\\lambda)=\\lambda^2-\\mathrm{tr}\\,\\lambda+\\det\\ (2\\times2),\\qquad p_A(\\lambda)=-\\lambda^3+\\mathrm{tr}\\,\\lambda^2-\\textstyle\\sum M_{ii}\\,\\lambda+\\det\\ (3\\times3)\\]<\/div>\n<div class=\"mjx-d\">\\[\\textstyle\\sum\\lambda_i=\\mathrm{tr}A,\\qquad\\prod\\lambda_i=\\det A\\]<\/div>\n<div class=\"mjx-d\">\\[A^n=PD^nP^{-1},\\quad \\det(A^n)=(\\det D)^n,\\quad \\mathrm{tr}(A^n)=\\textstyle\\sum\\lambda_i^n\\]<\/div>\n<div class=\"mjx-d\">\\[\\sigma_i=\\sqrt{\\lambda_i(A^\\top A)},\\quad \\#\\{\\sigma_i\\ne0\\}=\\mathrm{rank}A,\\quad \\textstyle\\prod\\sigma_i=|\\det A|,\\quad\\sum\\sigma_i^2=\\lVert A\\rVert_F^2\\]<\/div>\n<div class=\"mjx-d\">\\[\\lVert A\\rVert_2=\\sigma_1,\\qquad \\lVert A-\\hat A^{(k)}\\rVert_2=\\sigma_{k+1},\\qquad (\\hat A^{(1)})_{ij}=\\sigma_1(u_1)_i(v_1)_j\\]<\/div><\/p>\n<h2 id=\"MAI391-4-h21\">2. Mười lỗi mất điểm hay gặp nhất<\/h2>\n<ol>\n<li>Quên dấu <span class=\"mjx-i\">\\((-1)^{i+j}\\)<\/span> khi khai triển định thức.<\/li>\n<li>Ma trận chứa chữ: tính ra biểu thức dài, trong khi đáp án là <span class=\"mjx-i\">\\(0\\)<\/span>.<\/li>\n<li>Nhân cả <span class=\"mjx-i\">\\(PBP^{-1}\\)<\/span> để tính trace.<\/li>\n<li>Tin rằng <span class=\"mjx-i\">\\(\\mathrm{tr}(AB)=\\mathrm{tr}A\\,\\mathrm{tr}B\\)<\/span> hoặc <span class=\"mjx-i\">\\(\\mathrm{tr}(A^{-1})=1/\\mathrm{tr}A\\)<\/span>.<\/li>\n<li>Nhầm dấu hệ số <span class=\"mjx-i\">\\(\\lambda^2\\)<\/span> khi đọc trace từ đa thức đặc trưng.<\/li>\n<li>Chọn sai <strong>số lượng<\/strong> vector riêng trong cơ sở <span class=\"mjx-i\">\\(E_\\lambda\\)<\/span>.<\/li>\n<li>Cho rằng trị riêng của <span class=\"mjx-i\">\\(A^\\top\\)<\/span> là <span class=\"mjx-i\">\\(1/\\lambda\\)<\/span>.<\/li>\n<li>Đặt vector riêng thành hàng của <span class=\"mjx-i\">\\(P\\)<\/span>.<\/li>\n<li>Chọn giá trị suy biến âm, hoặc quên lấy căn trị riêng của <span class=\"mjx-i\">\\(A^\\top A\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\lVert A-\\hat A^{(1)}\\rVert_2\\)<\/span> trả lời <span class=\"mjx-i\">\\(\\sigma_1\\)<\/span> thay vì <span class=\"mjx-i\">\\(\\sigma_2\\)<\/span>.<\/li>\n<\/ol>\n", "q": 57}, {"num": "5", "short": "Giải tích vector", "sub": "", "toc": [["h1", "Chương 5 — Giải tích vectơ (Vector Calculus)", "MAI391-5-h1"], ["h1", "PHẦN 1 — GHI CHÉP BÀI HỌC", "MAI391-5-h2"], ["h2", "5.1 Đạo hàm hàm một biến và khai triển Taylor", "MAI391-5-h3"], ["h2", "5.2 Đạo hàm riêng và gradient", "MAI391-5-h4"], ["h2", "5.3 Gradient của hàm vectơ và ma trận Jacobian", "MAI391-5-h5"], ["h2", "5.6 Lan truyền ngược (Backpropagation) và vi phân tự động", "MAI391-5-h6"], ["h2", "5.7 Đạo hàm cấp cao và ma trận Hessian", "MAI391-5-h7"], ["h2", "5.8 Tuyến tính hóa và chuỗi Taylor nhiều biến", "MAI391-5-h8"], ["h2", "Ghi chú các lỗi chính tả của slide (để khỏi nhầm)", "MAI391-5-h9"], ["h1", "PHẦN 2. ĐỀ THI THƯỜNG RA GÌ Ở CHƯƠNG 5", "MAI391-5-h10"], ["h1", "PHẦN 3. CÁC DẠNG BÀI", "MAI391-5-h11"], ["h2", "Chuẩn bị: Casio fx-580VN X cho Chương 5", "MAI391-5-h12"], ["h2", "Dạng 1: Đa thức Taylor một biến", "MAI391-5-h13"], ["h2", "Dạng 2: Đạo hàm riêng & gradient", "MAI391-5-h14"], ["h2", "Dạng 3: Quy tắc chuỗi (chain rule)", "MAI391-5-h15"], ["h2", "Dạng 4: Ma trận Jacobian", "MAI391-5-h16"], ["h2", "Dạng 5: Đồ thị tính toán (computation graph) & lan truyền ngược", "MAI391-5-h17"], ["h2", "Dạng 6: Ma trận Hessian", "MAI391-5-h18"], ["h2", "Dạng 7: Đa thức Taylor nhiều biến", "MAI391-5-h19"], ["h1", "PHẦN 4. NHÌN ĐỀ → NHẬN RA DẠNG", "MAI391-5-h20"], ["h1", "PHẦN 5. TỔNG HỢP ÔN THI", "MAI391-5-h21"], ["h2", "1. Công thức phải nhớ", "MAI391-5-h22"], ["h2", "2. Mười lỗi mất điểm hay gặp nhất", "MAI391-5-h23"]], "html": "<h1 id=\"MAI391-5-h1\">Chương 5 — Giải tích vectơ (Vector Calculus)<\/h1>\n<blockquote>\n<p><strong>Quy ước ký hiệu:<\/strong> gradient của <span class=\"mjx-i\">\\(f:\\mathbb R^n\\to\\mathbb R\\)<\/span> là <strong>vectơ hàng<\/strong> <span class=\"mjx-i\">\\(\\nabla_xf=\\begin{bmatrix}\\frac{\\partial f}{\\partial x_1}&amp;\\cdots&amp;\\frac{\\partial f}{\\partial x_n}\\end{bmatrix}\\in\\mathbb R^{1\\times n}\\)<\/span> (theo sách MML của slide); Jacobian của <span class=\"mjx-i\">\\(f:\\mathbb R^n\\to\\mathbb R^m\\)<\/span> là ma trận <span class=\"mjx-i\">\\(m\\times n\\)<\/span>.<\/p>\n<\/blockquote>\n<hr/>\n<h1 id=\"MAI391-5-h2\">PHẦN 1 — GHI CHÉP BÀI HỌC<\/h1>\n<h2 id=\"MAI391-5-h3\">5.1 Đạo hàm hàm một biến và khai triển Taylor<\/h2>\n<h3>Định nghĩa<\/h3>\n<p>Cho <span class=\"mjx-i\">\\(f:D\\to\\mathbb R\\)<\/span> với <span class=\"mjx-i\">\\(D\\subset\\mathbb R\\)<\/span>.<\/p>\n<ul>\n<li><strong>Đa thức Taylor bậc <span class=\"mjx-i\">\\(n\\)<\/span><\/strong> của <span class=\"mjx-i\">\\(f\\)<\/span> tại <span class=\"mjx-i\">\\(x_0\\)<\/span>:\n<div class=\"mjx-d\">\\[T_n(x)=\\sum_{k=0}^{n}\\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k=f(x_0)+f'(x_0)(x-x_0)+\\frac{f''(x_0)}{2!}(x-x_0)^2+\\cdots+\\frac{f^{(n)}(x_0)}{n!}(x-x_0)^n\\]<\/div><\/li>\n<li><strong>Chuỗi Taylor<\/strong> (khi <span class=\"mjx-i\">\\(f\\)<\/span> khả vi vô hạn lần): <span class=\"mjx-i\">\\(T_\\infty(x)=\\sum_{k=0}^{\\infty}\\frac{f^{(k)}(x_0)}{k!}(x-x_0)^k\\)<\/span>.<\/li>\n<li>Khi <span class=\"mjx-i\">\\(x_0=0\\)<\/span> ta gọi là <strong>chuỗi Maclaurin<\/strong>.<\/li>\n<li><span class=\"mjx-i\">\\(f\\)<\/span> gọi là <strong>giải tích (analytic)<\/strong> nếu <span class=\"mjx-i\">\\(T_\\infty(x)=f(x)\\)<\/span>.<\/li>\n<\/ul>\n<h3>Ghi nhớ<\/h3>\n<ol>\n<li><span class=\"mjx-i\">\\(T_n\\)<\/span> là <strong>xấp xỉ<\/strong> của <span class=\"mjx-i\">\\(f\\)<\/span> gần <span class=\"mjx-i\">\\(x_0\\)<\/span>. Với <span class=\"mjx-i\">\\(n=1\\)<\/span> ta được <strong>xấp xỉ tuyến tính<\/strong> <span class=\"mjx-i\">\\(T_1(x)=f(x_0)+f'(x_0)(x-x_0)\\)<\/span> (tiếp tuyến).<\/li>\n<li><span class=\"mjx-i\">\\(T_n\\)<\/span> chỉ giống <span class=\"mjx-i\">\\(f\\)<\/span> <strong>trong lân cận<\/strong> của <span class=\"mjx-i\">\\(x_0\\)<\/span>.<\/li>\n<li>Nếu <span class=\"mjx-i\">\\(f\\)<\/span> là <strong>đa thức bậc <span class=\"mjx-i\">\\(k\\le n\\)<\/span><\/strong> thì <span class=\"mjx-i\">\\(T_n\\)<\/span> biểu diễn <span class=\"mjx-i\">\\(f\\)<\/span> <strong>chính xác<\/strong> (ví dụ dưới đây).<\/li>\n<\/ol>\n<h3>Cách làm chuẩn (3 bước)<\/h3>\n<ol>\n<li>Tính các đạo hàm <span class=\"mjx-i\">\\(f',f'',\\dots,f^{(n)}\\)<\/span>.<\/li>\n<li>Thay <span class=\"mjx-i\">\\(x=x_0\\)<\/span> vào từng đạo hàm để được các số <span class=\"mjx-i\">\\(f^{(k)}(x_0)\\)<\/span>.<\/li>\n<li>Thay vào công thức, nhớ <strong>chia cho <span class=\"mjx-i\">\\(k!\\)<\/span><\/strong> và nhân <span class=\"mjx-i\">\\((x-x_0)^k\\)<\/span>.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide) — giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> Find the Taylor polynomial <span class=\"mjx-i\">\\(T_4\\)<\/span> of <span class=\"mjx-i\">\\(f(x)=x^3+x-3\\)<\/span> at <span class=\"mjx-i\">\\(x_0=1\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> Tìm đa thức Taylor <span class=\"mjx-i\">\\(T_4\\)<\/span> của <span class=\"mjx-i\">\\(f(x)=x^3+x-3\\)<\/span> tại <span class=\"mjx-i\">\\(x_0=1\\)<\/span>.<\/p>\n<p><strong>Bước 1 — đạo hàm:<\/strong> <span class=\"mjx-i\">\\(f'(x)=3x^2+1\\)<\/span>, <span class=\"mjx-i\">\\(f''(x)=6x\\)<\/span>, <span class=\"mjx-i\">\\(f'''(x)=6\\)<\/span>, <span class=\"mjx-i\">\\(f^{(4)}(x)=0\\)<\/span>.<\/p>\n<p><strong>Bước 2 — thay <span class=\"mjx-i\">\\(x_0=1\\)<\/span>:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(f(1)=1+1-3=-1\\)<\/span><\/li>\n<li><span class=\"mjx-i\">\\(f'(1)=3+1=4\\)<\/span><\/li>\n<li><span class=\"mjx-i\">\\(f''(1)=6\\)<\/span><\/li>\n<li><span class=\"mjx-i\">\\(f'''(1)=6\\)<\/span><\/li>\n<li><span class=\"mjx-i\">\\(f^{(4)}(1)=0\\)<\/span><\/li>\n<\/ul>\n<p><strong>Bước 3 — ghép với các hệ số <span class=\"mjx-i\">\\(\\frac1{k!}\\)<\/span>:<\/strong>\n<div class=\"mjx-d\">\\[T_4(x)=-1+4(x-1)+\\frac{6}{2!}(x-1)^2+\\frac{6}{3!}(x-1)^3+\\frac{0}{4!}(x-1)^4=-1+4(x-1)+3(x-1)^2+(x-1)^3\\]<\/div><\/p>\n<p><strong>Kiểm tra<\/strong> <span class=\"mjx-i\">\\(T_4=f\\)<\/span> (vì <span class=\"mjx-i\">\\(f\\)<\/span> bậc 3): đặt <span class=\"mjx-i\">\\(u=x-1\\)<\/span>, khai triển <span class=\"mjx-i\">\\(-1+4u+3u^2+u^3\\)<\/span>. Mặt khác <span class=\"mjx-i\">\\(f(x)=(u+1)^3+(u+1)-3=u^3+3u^2+3u+1+u+1-3=u^3+3u^2+4u-1\\)<\/span> ✓ giống hệt.<\/p>\n<\/div><h3>Chuỗi Maclaurin cơ bản (cần thuộc)<\/h3>\n<p><div class=\"mjx-d\">\\[e^x=\\sum_{k=0}^\\infty\\frac{x^k}{k!}=1+x+\\frac{x^2}{2!}+\\frac{x^3}{3!}+\\cdots\\]<\/div>\n<div class=\"mjx-d\">\\[\\sin x=\\sum_{k=0}^\\infty(-1)^k\\frac{x^{2k+1}}{(2k+1)!}=x-\\frac{x^3}{3!}+\\frac{x^5}{5!}-\\cdots\\]<\/div>\n<div class=\"mjx-d\">\\[\\cos x=\\sum_{k=0}^\\infty(-1)^k\\frac{x^{2k}}{(2k)!}=1-\\frac{x^2}{2!}+\\frac{x^4}{4!}-\\cdots\\]<\/div>\n<div class=\"mjx-d\">\\[\\frac1{1-x}=\\sum_{k=0}^\\infty x^k=1+x+x^2+\\cdots\\quad(|x|&lt;1)\\]<\/div><\/p>\n<blockquote>\n<p>⚡ <strong>Mẹo lấy Maclaurin nhanh:<\/strong> với hàm \"ghép\" như <span class=\"mjx-i\">\\(e^{-x}\\)<\/span>, <span class=\"mjx-i\">\\(\\cos(3x)\\)<\/span>, <span class=\"mjx-i\">\\(e^{2x}\\)<\/span>: <strong>thay biến<\/strong> vào chuỗi cơ bản (<span class=\"mjx-i\">\\(x\\to-x\\)<\/span>, <span class=\"mjx-i\">\\(x\\to3x\\)<\/span>, <span class=\"mjx-i\">\\(x\\to2x\\)<\/span>). Với tổng <span class=\"mjx-i\">\\(f+g\\)<\/span>: cộng chuỗi từng số hạng.<\/p>\n<p>⚡ <strong>Mẹo Taylor tại <span class=\"mjx-i\">\\(x_0\\ne0\\)<\/span>:<\/strong> đặt <span class=\"mjx-i\">\\(t=x-x_0\\)<\/span> rồi khai triển theo <span class=\"mjx-i\">\\(t\\)<\/span>, sau đó đổi <span class=\"mjx-i\">\\(t\\)<\/span> ngược lại thành <span class=\"mjx-i\">\\(x-x_0\\)<\/span>. Ví dụ <span class=\"mjx-i\">\\(\\sin(2\\pi x)\\)<\/span> tại <span class=\"mjx-i\">\\(x_0=1\\)<\/span>: <span class=\"mjx-i\">\\(\\sin(2\\pi x)=\\sin(2\\pi t+2\\pi)=\\sin(2\\pi t)\\)<\/span>.<\/p>\n<\/blockquote>\n<hr/>\n<h2 id=\"MAI391-5-h4\">5.2 Đạo hàm riêng và gradient<\/h2>\n<h3>Định nghĩa<\/h3>\n<p>Với <span class=\"mjx-i\">\\(f:\\mathbb R^n\\to\\mathbb R\\)<\/span>, đạo hàm riêng theo <span class=\"mjx-i\">\\(x_i\\)<\/span>:\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial x_i}=\\lim_{h\\to0}\\frac{f(x_1,\\dots,x_i+h,\\dots,x_n)-f(x_1,\\dots,x_n)}{h}\\]<\/div><\/p>\n<blockquote>\n<p><strong>Quy tắc vàng:<\/strong> khi tính <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_i}\\)<\/span>, coi <strong>mọi biến khác là hằng số<\/strong>, chỉ <span class=\"mjx-i\">\\(x_i\\)<\/span> thay đổi.<\/p>\n<\/blockquote>\n<p><strong>Gradient<\/strong> (vectơ hàng):\n<div class=\"mjx-d\">\\[\\nabla_xf=\\frac{df}{dx}=\\begin{bmatrix}\\dfrac{\\partial f}{\\partial x_1}&amp;\\cdots&amp;\\dfrac{\\partial f}{\\partial x_n}\\end{bmatrix}\\in\\mathbb R^{1\\times n}\\]<\/div><\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 1 (từ slide) — giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> Find the partial derivatives of <span class=\"mjx-i\">\\(f(x,y)=\\dfrac1{1+x^2+3y^4}\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> Tìm các đạo hàm riêng của <span class=\"mjx-i\">\\(f(x,y)=\\dfrac1{1+x^2+3y^4}\\)<\/span>.<\/p>\n<blockquote>\n<p>⚠️ <strong>Ghi chú về slide:<\/strong> đề trên slide in là <span class=\"mjx-i\">\\(2y^4\\)<\/span> nhưng lời giải trên slide dùng <span class=\"mjx-i\">\\(3y^4\\)<\/span> (số <span class=\"mjx-i\">\\(12y^3=3\\cdot4y^3\\)<\/span>). Ở đây ta giải theo <span class=\"mjx-i\">\\(3y^4\\)<\/span> cho khớp lời giải; nếu đề đúng là <span class=\"mjx-i\">\\(2y^4\\)<\/span> thì <span class=\"mjx-i\">\\(\\partial_y f=-\\dfrac{8y^3}{(1+x^2+2y^4)^2}\\)<\/span> (cùng phương pháp).<\/p>\n<\/blockquote>\n<p>Viết <span class=\"mjx-i\">\\(f=(1+x^2+3y^4)^{-1}\\)<\/span>, dùng quy tắc hàm hợp <span class=\"mjx-i\">\\(\\dfrac{d}{dw}w^{-1}=-w^{-2}\\)<\/span> với <span class=\"mjx-i\">\\(w=1+x^2+3y^4\\)<\/span>:<\/p>\n<ul>\n<li><strong>Theo <span class=\"mjx-i\">\\(x\\)<\/span><\/strong> (<span class=\"mjx-i\">\\(y\\)<\/span> là hằng): <span class=\"mjx-i\">\\(\\dfrac{\\partial w}{\\partial x}=2x\\)<\/span>, nên\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial x}=-\\frac1{w^2}\\cdot2x=-\\frac{2x}{(1+x^2+3y^4)^2}\\]<\/div><\/li>\n<li><strong>Theo <span class=\"mjx-i\">\\(y\\)<\/span><\/strong> (<span class=\"mjx-i\">\\(x\\)<\/span> là hằng): <span class=\"mjx-i\">\\(\\dfrac{\\partial w}{\\partial y}=12y^3\\)<\/span>, nên\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial y}=-\\frac1{w^2}\\cdot12y^3=-\\frac{12y^3}{(1+x^2+3y^4)^2}\\]<\/div><\/li>\n<\/ul>\n<\/div><div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 2 (từ slide) — gradient, giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> Find the gradient of <span class=\"mjx-i\">\\(f(x_1,x_2,x_3)=x_1^2x_2^3-4x_2^2x_3\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> Tìm gradient của <span class=\"mjx-i\">\\(f(x_1,x_2,x_3)=x_1^2x_2^3-4x_2^2x_3\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_1}\\)<\/span> (giữ <span class=\"mjx-i\">\\(x_2,x_3\\)<\/span> hằng): số hạng 1 cho <span class=\"mjx-i\">\\(2x_1x_2^3\\)<\/span>; số hạng 2 không có <span class=\"mjx-i\">\\(x_1\\)<\/span> nên cho <span class=\"mjx-i\">\\(0\\)<\/span>. Kết quả <span class=\"mjx-i\">\\(2x_1x_2^3\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_2}\\)<\/span>: số hạng 1 cho <span class=\"mjx-i\">\\(x_1^2\\cdot3x_2^2=3x_1^2x_2^2\\)<\/span>; số hạng 2 cho <span class=\"mjx-i\">\\(-4\\cdot2x_2\\cdot x_3=-8x_2x_3\\)<\/span>. Kết quả <span class=\"mjx-i\">\\(3x_1^2x_2^2-8x_2x_3\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_3}\\)<\/span>: số hạng 1 không có <span class=\"mjx-i\">\\(x_3\\)<\/span> nên <span class=\"mjx-i\">\\(0\\)<\/span>; số hạng 2 cho <span class=\"mjx-i\">\\(-4x_2^2\\)<\/span>.<\/li>\n<\/ul>\n<p><div class=\"mjx-d\">\\[\\nabla_xf=\\begin{bmatrix}2x_1x_2^3&amp;\\ 3x_1^2x_2^2-8x_2x_3&amp;\\ -4x_2^2\\end{bmatrix}\\in\\mathbb R^{1\\times3}\\]<\/div><\/p>\n<\/div><h3>Các quy tắc đạo hàm riêng<\/h3>\n<ul>\n<li><strong>Quy tắc tổng:<\/strong> <span class=\"mjx-i\">\\(\\nabla_x[f+g]=\\nabla_xf+\\nabla_xg\\)<\/span>.<\/li>\n<li><strong>Quy tắc tích:<\/strong> <span class=\"mjx-i\">\\(\\nabla_x[fg]=g\\,\\nabla_xf+f\\,\\nabla_xg\\)<\/span>.<\/li>\n<li><strong>Quy tắc chuỗi (một tham số):<\/strong> nếu <span class=\"mjx-i\">\\(f(x_1,\\dots,x_n)\\)<\/span> và mỗi <span class=\"mjx-i\">\\(x_i=x_i(t)\\)<\/span> thì\n<div class=\"mjx-d\">\\[\\frac{df}{dt}=\\frac{\\partial f}{\\partial x_1}\\frac{dx_1}{dt}+\\cdots+\\frac{\\partial f}{\\partial x_n}\\frac{dx_n}{dt}=\\sum_{i=1}^n\\frac{\\partial f}{\\partial x_i}\\frac{dx_i}{dt}\\]<\/div><\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 3 (từ slide) — chuỗi một tham số, giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> <span class=\"mjx-i\">\\(f(x_1,x_2)=x_1^2+x_1x_2\\)<\/span> with <span class=\"mjx-i\">\\(x_1=\\sin t\\)<\/span>, <span class=\"mjx-i\">\\(x_2=\\cos t\\)<\/span>. Find <span class=\"mjx-i\">\\(\\dfrac{df}{dt}\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> <span class=\"mjx-i\">\\(f(x_1,x_2)=x_1^2+x_1x_2\\)<\/span> với <span class=\"mjx-i\">\\(x_1=\\sin t\\)<\/span>, <span class=\"mjx-i\">\\(x_2=\\cos t\\)<\/span>. Tìm <span class=\"mjx-i\">\\(\\dfrac
