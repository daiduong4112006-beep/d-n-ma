ng> <code>[Đề A Q37]<\/code>\nWhich statements are true?<\/p>\n<ul>\n<li>\n<p>(i) The product of any two convex functions is convex<\/p>\n<\/li>\n<li>\n<p>(ii) The sum of any two convex functions is convex<\/p>\n<\/li>\n<li>\n<p>(i) and (ii)<\/p>\n<\/li>\n<li>\n<p>A. Only (i)<\/p>\n<\/li>\n<li>\n<p>B. Only (ii)<\/p>\n<\/li>\n<li>\n<p>C. Both (i) and (ii)<\/p>\n<\/li>\n<li>\n<p>D. Neither<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-7-q33\"><strong>Câu 5.9<\/strong> <code>[SP26 Q25]<\/code>\nWhich the following optimization problems are convex?<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\min_{x,y\\in\\mathbb{R}} (e^x + y) \\quad \\text{subject to } x^2 + y^2 \\le 1\\)<\/span> .<\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\min_{x,y\\in\\mathbb{R}} (x + y) \\quad \\text{subject to } x^2 + y^2 = 1\\)<\/span> .<\/p>\n<\/li>\n<li>\n<p>A. Only (i)<\/p>\n<\/li>\n<li>\n<p>B. Both (i) and (ii)<\/p>\n<\/li>\n<li>\n<p>C. None of the other choices is correct<\/p>\n<\/li>\n<li>\n<p>D. Only (ii)<\/p>\n<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h1 id=\"MAI391-7-h13\"><span class=\"pn\">Phần 4<\/span>Nhìn đề → nhận ra dạng<\/h1>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Từ khóa trong đề<\/th>\n<th>Dạng<\/th>\n<th>Việc cần làm ngay<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>gradient descent … step-size … initial point<\/em><\/td>\n<td>1<\/td>\n<td><span class=\"mjx-i\">\\(x_{i+1}=x_i-\\gamma\\nabla f(x_i)\\)<\/span>, tính lại gradient mỗi bước<\/td>\n<\/tr>\n<tr>\n<td><em>next iterate<\/em> (không có momentum)<\/td>\n<td>1<\/td>\n<td>Một bước<\/td>\n<\/tr>\n<tr>\n<td><em>momentum <span class=\"mjx-i\">\\(\\alpha\\)<\/span><\/em><\/td>\n<td>2<\/td>\n<td>Bước 1 không có quán tính; bước 2 thêm <span class=\"mjx-i\">\\(\\alpha(x_1-x_0)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>current iterate … previous iterate<\/em><\/td>\n<td>2<\/td>\n<td><span class=\"mjx-i\">\\(x-\\gamma\\nabla f(x)+\\alpha(x-x_{\\text{prev}})\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>Lagrange Multiplier … subject to … <span class=\"mjx-i\">\\(=\\)<\/span> … optimal value<\/em><\/td>\n<td>3<\/td>\n<td><span class=\"mjx-i\">\\(\\nabla f=\\lambda\\nabla h\\)<\/span>; hoặc <span class=\"mjx-i\">\\(c^2/(p^2/a+q^2/b)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>Lagrangian … <span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial y\\)<\/span> at<\/em><\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(c_y+\\sum\\lambda_i a_{iy}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(\\partial\\mathcal{L}/\\partial\\lambda_1\\)<\/span><\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(g_1(x)\\)<\/span> tại điểm<\/td>\n<\/tr>\n<tr>\n<td><em>dual linear program<\/em>, <em>dual Lagrangian <span class=\"mjx-i\">\\(\\mathcal{D}(\\lambda)\\)<\/span><\/em> (LP)<\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(\\max-b^\\top\\lambda\\)<\/span> s.t. <span class=\"mjx-i\">\\(c+A^\\top\\lambda=0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>quadratic program … derivative of the Lagrangian<\/em><\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(Qx+c+A^\\top\\lambda\\)<\/span> (nhân 2 nếu không có <span class=\"mjx-i\">\\(\\tfrac12\\)<\/span>)<\/td>\n<\/tr>\n<tr>\n<td><em>dual Lagrangian of QP<\/em><\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(-\\tfrac12(c+A^\\top\\lambda)^\\top Q^{-1}(c+A^\\top\\lambda)-b^\\top\\lambda\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(\\min x^2\\)<\/span> s.t. <span class=\"mjx-i\">\\(x\\le1\\)<\/span>, <em>dual problem<\/em><\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(x=-\\lambda/2\\)<\/span>, thay vào <span class=\"mjx-i\">\\(\\mathcal{L}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>sets … convex<\/em><\/td>\n<td>5<\/td>\n<td>\"<span class=\"mjx-i\">\\(=\\)<\/span>\" phi tuyến hoặc \"<span class=\"mjx-i\">\\(\\ge\\)<\/span>\" thì không lồi<\/td>\n<\/tr>\n<tr>\n<td><em>functions … convex<\/em><\/td>\n<td>5<\/td>\n<td>Hessian nửa xác định dương<\/td>\n<\/tr>\n<tr>\n<td><em>optimization problems … convex<\/em><\/td>\n<td>5<\/td>\n<td>Ràng buộc đẳng thức phải affine<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-7-h14\"><span class=\"pn\">Phần 5<\/span>Tổng hợp ôn thi<\/h1>\n<h2 id=\"MAI391-7-h15\">1. Công thức phải nhớ<\/h2>\n<p><div class=\"mjx-d\">\\[x_{i+1}=x_i-\\gamma\\nabla f(x_i)^\\top\\qquad\\text{(momentum: }+\\alpha(x_i-x_{i-1})\\text{, bước 1 không có)}\\]<\/div>\n<div class=\"mjx-d\">\\[\\mathcal{L}(x,\\lambda)=f(x)+\\lambda^\\top g(x),\\quad g(x)\\le0,\\ \\lambda\\ge0;\\qquad\\mathcal{D}(\\lambda)=\\min_x\\mathcal{L}\\]<\/div>\n<div class=\"mjx-d\">\\[\\text{LP: }\\min c^\\top x,\\ Ax\\le b\\ \\Longrightarrow\\ \\max_{\\lambda\\ge0}-b^\\top\\lambda\\ \\text{ s.t. }c+A^\\top\\lambda=0\\]<\/div>\n<div class=\"mjx-d\">\\[\\text{QP: }\\nabla_x\\mathcal{L}^\\top=Qx+c+A^\\top\\lambda,\\quad\\mathcal{D}(\\lambda)=-\\tfrac12(c+A^\\top\\lambda)^\\top Q^{-1}(c+A^\\top\\lambda)-b^\\top\\lambda\\]<\/div>\n<div class=\"mjx-d\">\\[\\min ax^2+by^2\\ \\text{s.t.}\\ px+qy=c:\\quad f_{\\min}=\\frac{c^2}{p^2/a+q^2/b}\\]<\/div>\n<div class=\"mjx-d\">\\[f\\text{ lồi}\\iff\\nabla^2f\\succeq0;\\qquad ax^2+bxy+cy^2\\text{ lồi}\\iff a,c\\ge0,\\ 4ac\\ge b^2\\]<\/div><\/p>\n<h2 id=\"MAI391-7-h16\">2. Mười lỗi mất điểm hay gặp nhất<\/h2>\n<ol>\n<li>Cộng gradient thay vì trừ.<\/li>\n<li>Dùng gradient của bước 1 cho bước 2.<\/li>\n<li>Thêm quán tính ngay ở bước 1 của momentum.<\/li>\n<li><span class=\"mjx-i\">\\(\\Delta x\\)<\/span> ngược dấu (<span class=\"mjx-i\">\\(x_{i-1}-x_i\\)<\/span>).<\/li>\n<li>Câu Lagrange đẳng thức: trả lời tọa độ thay vì giá trị tối ưu.<\/li>\n<li>Quên chuyển ràng buộc về dạng <span class=\"mjx-i\">\\(\\le0\\)<\/span> (bỏ quên <span class=\"mjx-i\">\\(-b_i\\)<\/span>).<\/li>\n<li>Đối ngẫu LP: dùng <span class=\"mjx-i\">\\(b^\\top\\lambda\\)<\/span> thay cho <span class=\"mjx-i\">\\(-b^\\top\\lambda\\)<\/span>, hoặc <span class=\"mjx-i\">\\(-c\\)<\/span> thay cho <span class=\"mjx-i\">\\(c\\)<\/span>.<\/li>\n<li>QP không có <span class=\"mjx-i\">\\(\\tfrac12\\)<\/span> mà vẫn viết đạo hàm là <span class=\"mjx-i\">\\(Qx\\)<\/span>.<\/li>\n<li>Coi đường tròn/ellipse (viền) là tập lồi.<\/li>\n<li>Kết luận hàm bậc hai lồi chỉ dựa vào dấu các hệ số bình phương.<\/li>\n<\/ol>\n", "q": 33}, {"num": "9", "short": "Hồi quy tuyến tính", "sub": "Mathematics for Machine Learning – mục 9.1, 9.2, 9.3", "toc": [["h1", "PHẦN 1. GHI CHÉP BÀI HỌC", "MAI391-9-h1"], ["h2", "1.1. Đặt bài toán — mục 9.1", "MAI391-9-h2"], ["h2", "1.2. Ước lượng hợp lý cực đại (MLE) — mục 9.2.1", "MAI391-9-h3"], ["h2", "1.3. Ước lượng hậu nghiệm cực đại (MAP) — mục 9.2.3", "MAI391-9-h4"], ["h1", "PHẦN 2. CÁC DẠNG BÀI CÓ THỂ RA", "MAI391-9-h5"], ["h2", "Chuẩn bị: Casio fx-580VN X cho Chương 9", "MAI391-9-h6"], ["h1", "PHẦN 3. CÁC DẠNG BÀI", "MAI391-9-h7"], ["h2", "Dạng 1: Ma trận thiết kế, hàm mất mát, gradient", "MAI391-9-h8"], ["h2", "Dạng 2: Ước lượng MLE (bình phương tối thiểu)", "MAI391-9-h9"], ["h2", "Dạng 3: Hồi quy với đặc trưng đa thức", "MAI391-9-h10"], ["h2", "Dạng 4: Ước lượng phương sai nhiễu", "MAI391-9-h11"], ["h2", "Dạng 5: MAP / ridge", "MAI391-9-h12"], ["h1", "PHẦN 4. TỔNG HỢP", "MAI391-9-h13"]], "html": "<blockquote>\n<p>⚠️ <strong>Lưu ý quan trọng:<\/strong> trong 10 đề MAI391 đã có (FA24, SU24, SP25, SP26, Đề A, Đề B) <strong>không có câu nào<\/strong> thuộc Chương 9. Vì vậy phần cuối mỗi dạng là <strong>câu luyện tập tự soạn<\/strong> theo văn phong đề MAI391 (không phải đề thật), có đáp án ở cuối file. Nên ưu tiên ôn Chương 3–7 trước.<\/p>\n<\/blockquote>\n<hr/>\n<h1 id=\"MAI391-9-h1\"><span class=\"pn\">Phần 1<\/span>Ghi chép bài học<\/h1>\n<h2 id=\"MAI391-9-h2\">1.1. Đặt bài toán — mục 9.1<\/h2>\n<ul>\n<li>Dữ liệu: <span class=\"mjx-i\">\\(\\mathcal{D}=\\{(x_1,y_1),\\dots,(x_N,y_N)\\}\\)<\/span>, <span class=\"mjx-i\">\\(x_n\\in\\mathbb{R}^D\\)<\/span> (đầu vào), <span class=\"mjx-i\">\\(y_n\\in\\mathbb{R}\\)<\/span> (nhãn có nhiễu).<\/li>\n<li>Mô hình: <span class=\"mjx-i\">\\(y=f(x)+\\varepsilon\\)<\/span>, <span class=\"mjx-i\">\\(\\varepsilon\\sim\\mathcal{N}(0,\\sigma^2)\\)<\/span>.<\/li>\n<li><strong>Hồi quy tuyến tính<\/strong> (tuyến tính theo <strong>tham số<\/strong> <span class=\"mjx-i\">\\(\\theta\\)<\/span>):\n<div class=\"mjx-d\">\\[p(y\\mid x,\\theta)=\\mathcal{N}(y\\mid x^\\top\\theta,\\ \\sigma^2)\\iff y=x^\\top\\theta+\\varepsilon.\\]<\/div><\/li>\n<li>Với <span class=\"mjx-i\">\\(x,\\theta\\in\\mathbb{R}\\)<\/span>: mô hình là đường thẳng qua gốc, <span class=\"mjx-i\">\\(\\theta\\)<\/span> là hệ số góc. Muốn có hệ số tự do, thêm tọa độ <span class=\"mjx-i\">\\(1\\)<\/span> vào <span class=\"mjx-i\">\\(x\\)<\/span>: <span class=\"mjx-i\">\\(x=(1,x)\\)<\/span>, <span class=\"mjx-i\">\\(\\theta=(\\theta_0,\\theta_1)\\)<\/span>.<\/li>\n<\/ul>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> ta có một đám điểm, muốn tìm \"đường thẳng (hoặc đường cong) đi gần mọi điểm nhất\". Nhiễu <span class=\"mjx-i\">\\(\\varepsilon\\)<\/span> giải thích vì sao điểm không nằm đúng trên đường.<\/p>\n<\/blockquote>\n<hr/>\n<h2 id=\"MAI391-9-h3\">1.2. Ước lượng hợp lý cực đại (MLE) — mục 9.2.1<\/h2>\n<ul>\n<li>Hàm hợp lý: <span class=\"mjx-i\">\\(p(\\mathcal{Y}\\mid\\mathcal{X},\\theta)=\\prod_{n=1}^N\\mathcal{N}(y_n\\mid x_n^\\top\\theta,\\sigma^2)\\)<\/span>.<\/li>\n<li>Lấy <span class=\"mjx-i\">\\(-\\log\\)<\/span>, bỏ hằng số:\n<div class=\"mjx-d\">\\[\\boxed{\\mathcal{L}(\\theta)=\\frac1{2\\sigma^2}\\sum_{n=1}^N(y_n-x_n^\\top\\theta)^2=\\frac1{2\\sigma^2}\\lVert y-X\\theta\\rVert^2}\\]<\/div>\nvới <strong>ma trận thiết kế<\/strong> <span class=\"mjx-i\">\\(X=[x_1\\ \\cdots\\ x_N]^\\top\\in\\mathbb{R}^{N\\times D}\\)<\/span> (mỗi <strong>hàng<\/strong> là một điểm dữ liệu), <span class=\"mjx-i\">\\(y=(y_1,\\dots,y_N)^\\top\\)<\/span>.<\/li>\n<li>Gradient: <span class=\"mjx-i\">\\(\\dfrac{d\\mathcal{L}}{d\\theta}=\\dfrac1{\\sigma^2}\\big(\\theta^\\top X^\\top X-y^\\top X\\big)\\in\\mathbb{R}^{1\\times D}\\)<\/span>.<\/li>\n<li>Cho gradient bằng 0 (<strong>phương trình chuẩn<\/strong> <span class=\"mjx-i\">\\(X^\\top X\\theta=X^\\top y\\)<\/span>):\n<div class=\"mjx-d\">\\[\\boxed{\\theta_{ML}=(X^\\top X)^{-1}X^\\top y}\\]<\/div><\/li>\n<\/ul>\n<blockquote>\n<p><em>(Slide in thiếu bình phương ở dòng <span class=\"mjx-i\">\\(\\log p(y_n\\mid x_n,\\theta)=-\\tfrac{1}{2\\sigma^2}(y_n-x_n^\\top\\theta)+\\text{const}\\)<\/span>; đúng là <span class=\"mjx-i\">\\((y_n-x_n^\\top\\theta)^2\\)<\/span>.)<\/em><\/p>\n<\/blockquote>\n<h3>Hồi quy với đặc trưng (features)<\/h3>\n<ul>\n<li>Biến đổi phi tuyến <span class=\"mjx-i\">\\(\\phi:\\mathbb{R}^D\\to\\mathbb{R}^K\\)<\/span>, mô hình <span class=\"mjx-i\">\\(y=\\phi(x)^\\top\\theta+\\varepsilon\\)<\/span> (vẫn <strong>tuyến tính theo <span class=\"mjx-i\">\\(\\theta\\)<\/span><\/strong>).<\/li>\n<li>Ví dụ đa thức: <span class=\"mjx-i\">\\(\\phi(x)=(1,x,x^2,\\dots,x^{K-1})\\)<\/span>.<\/li>\n<li><strong>Ma trận đặc trưng<\/strong> <span class=\"mjx-i\">\\(\\Phi=\\begin{bmatrix}\\phi(x_1)^\\top\\\\\\vdots\\\\\\phi(x_N)^\\top\\end{bmatrix}\\in\\mathbb{R}^{N\\times K}\\)<\/span>, và <span class=\"mjx-i\">\\(\\theta_{ML}=(\\Phi^\\top\\Phi)^{-1}\\Phi^\\top y\\)<\/span>.<\/li>\n<\/ul>\n<h3>Ước lượng phương sai nhiễu<\/h3>\n<p><div class=\"mjx-d\">\\[\\boxed{\\sigma^2_{ML}=\\frac1N\\sum_{n=1}^N\\big(y_n-\\phi(x_n)^\\top\\theta\\big)^2}\\quad(\\text{trung bình bình phương phần dư})\\]<\/div><\/p>\n<hr/>\n<h2 id=\"MAI391-9-h4\">1.3. Ước lượng hậu nghiệm cực đại (MAP) — mục 9.2.3<\/h2>\n<ul>\n<li>Thêm tiên nghiệm <span class=\"mjx-i\">\\(p(\\theta)=\\mathcal{N}(0,b^2I)\\)<\/span>. Cực đại <span class=\"mjx-i\">\\(p(\\theta\\mid\\mathcal{X},\\mathcal{Y})\\propto p(\\mathcal{Y}\\mid\\mathcal{X},\\theta)p(\\theta)\\)<\/span>, tức cực tiểu\n<div class=\"mjx-d\">\\[\\frac1{2\\sigma^2}\\lVert y-\\Phi\\theta\\rVert^2+\\frac1{2b^2}\\lVert\\theta\\rVert^2.\\]<\/div><\/li>\n<li>Nghiệm:\n<div class=\"mjx-d\">\\[\\boxed{\\theta_{MAP}=\\Big(\\Phi^\\top\\Phi+\\frac{\\sigma^2}{b^2}I\\Big)^{-1}\\Phi^\\top y}\\]<\/div><\/li>\n<li>Đây chính là <strong>hồi quy ridge<\/strong> với hệ số phạt <span class=\"mjx-i\">\\(\\lambda=\\sigma^2/b^2\\)<\/span>. Tiên nghiệm càng hẹp (<span class=\"mjx-i\">\\(b\\)<\/span> nhỏ) thì <span class=\"mjx-i\">\\(\\theta\\)<\/span> càng bị kéo về 0.<\/li>\n<\/ul>\n<blockquote>\n<p><em>(Slide gõ nhầm \"MAD\"; đúng là MAP – maximum a posteriori.)<\/em><\/p>\n<\/blockquote>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(X\\)<\/span> (hoặc <span class=\"mjx-i\">\\(\\Phi\\)<\/span>) có <strong>mỗi hàng một điểm<\/strong>; có hệ số tự do thì thêm <strong>cột 1<\/strong>.<\/li>\n<li>MLE = bình phương tối thiểu; MAP = bình phương tối thiểu + phạt <span class=\"mjx-i\">\\(\\tfrac{\\sigma^2}{b^2}\\lVert\\theta\\rVert^2\\)<\/span>.<\/li>\n<\/ul>\n<hr/>\n<h1 id=\"MAI391-9-h5\"><span class=\"pn\">Phần 2<\/span>Các dạng bài có thể ra<\/h1>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dạng<\/th>\n<th>Nội dung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Ma trận thiết kế, hàm mất mát, gradient<\/strong><\/td>\n<td>Lập <span class=\"mjx-i\">\\(X\\)<\/span>/<span class=\"mjx-i\">\\(\\Phi\\)<\/span>; tính <span class=\"mjx-i\">\\(\\mathcal{L}(\\theta)\\)<\/span> hoặc <span class=\"mjx-i\">\\(d\\mathcal{L}/d\\theta\\)<\/span> tại một <span class=\"mjx-i\">\\(\\theta\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>2. Ước lượng MLE (bình phương tối thiểu)<\/strong><\/td>\n<td>Tìm <span class=\"mjx-i\">\\(\\theta_{ML}\\)<\/span>; dự đoán <span class=\"mjx-i\">\\(y\\)<\/span> tại <span class=\"mjx-i\">\\(x\\)<\/span> mới<\/td>\n<\/tr>\n<tr>\n<td><strong>3. Hồi quy với đặc trưng đa thức<\/strong><\/td>\n<td>Lập <span class=\"mjx-i\">\\(\\Phi\\)<\/span>; tìm hệ số đường cong<\/td>\n<\/tr>\n<tr>\n<td><strong>4. Ước lượng phương sai nhiễu<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(\\sigma^2_{ML}\\)<\/span> từ phần dư<\/td>\n<\/tr>\n<tr>\n<td><strong>5. MAP / ridge<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(\\theta_{MAP}\\)<\/span>; so sánh với <span class=\"mjx-i\">\\(\\theta_{ML}\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"MAI391-9-h6\">Chuẩn bị: Casio fx-580VN X cho Chương 9<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Việc cần làm<\/th>\n<th>Thao tác<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hồi quy <span class=\"mjx-i\">\\(y=a+bx\\)<\/span> (có hệ số tự do)<\/td>\n<td><code>MENU<\/code> → Statistics → <span class=\"mjx-i\">\\(y=a+bx\\)<\/span> → nhập cột X, Y → <code>OPTN<\/code> → Regression Results: đọc <span class=\"mjx-i\">\\(a\\)<\/span> (= <span class=\"mjx-i\">\\(\\theta_0\\)<\/span>), <span class=\"mjx-i\">\\(b\\)<\/span> (= <span class=\"mjx-i\">\\(\\theta_1\\)<\/span>)<\/td>\n<\/tr>\n<tr>\n<td>Hồi quy bậc hai <span class=\"mjx-i\">\\(y=a+bx+cx^2\\)<\/span><\/td>\n<td>Statistics → <span class=\"mjx-i\">\\(y=a+bx+cx^2\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(\\theta=(X^\\top X)^{-1}X^\\top y\\)<\/span> tổng quát<\/td>\n<td>Matrix: MatA <span class=\"mjx-i\">\\(=X\\)<\/span> (<span class=\"mjx-i\">\\(N\\times K\\)<\/span>, <span class=\"mjx-i\">\\(N\\le4\\)<\/span>), MatB <span class=\"mjx-i\">\\(=y\\)<\/span>; gõ <code>(Trn(MatA)MatA)⁻¹Trn(MatA)MatB<\/code><\/td>\n<\/tr>\n<tr>\n<td>Phần dư, <span class=\"mjx-i\">\\(\\sigma^2_{ML}\\)<\/span><\/td>\n<td>Statistics: sau khi hồi quy, máy cho <span class=\"mjx-i\">\\(\\hat y\\)<\/span>; hoặc Calculate với <code>CALC<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p>⚡ <strong>Mẹo lớn nhất của chương:<\/strong> bài hồi quy đường thẳng có hệ số tự do <strong>chính là<\/strong> chế độ hồi quy <span class=\"mjx-i\">\\(y=a+bx\\)<\/span> của máy Casio, ra kết quả trong 20 giây.<\/p>\n<\/blockquote>\n<hr/>\n<h1 id=\"MAI391-9-h7\"><span class=\"pn\">Phần 3<\/span>Các dạng bài<\/h1>\n<h2 id=\"MAI391-9-h8\">Dạng 1: Ma trận thiết kế, hàm mất mát, gradient<\/h2>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[X=\\begin{bmatrix}1&amp;x_1\\\\\\vdots&amp;\\vdots\\\\1&amp;x_N\\end{bmatrix}\\ (\\text{có hệ số tự do}),\\qquad\\mathcal{L}(\\theta)=\\frac1{2\\sigma^2}\\sum(y_n-x_n^\\top\\theta)^2,\\qquad\\frac{d\\mathcal{L}}{d\\theta}=\\frac1{\\sigma^2}(\\theta^\\top X^\\top X-y^\\top X)\\]<\/div><\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> Data <span class=\"mjx-i\">\\((x,y)\\)<\/span>: <span class=\"mjx-i\">\\((0,1),(1,3),(2,4),(3,6)\\)<\/span>, model <span class=\"mjx-i\">\\(y=\\theta_0+\\theta_1x\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma^2=1\\)<\/span>. Compute <span class=\"mjx-i\">\\(\\mathcal{L}(\\theta)\\)<\/span> and <span class=\"mjx-i\">\\(d\\mathcal{L}/d\\theta\\)<\/span> at <span class=\"mjx-i\">\\(\\theta=(1,2)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Dự đoán <span class=\"mjx-i\">\\(1+2x\\)<\/span>: <span class=\"mjx-i\">\\(1,3,5,7\\)<\/span>; phần dư <span class=\"mjx-i\">\\(y-\\hat y\\)<\/span>: <span class=\"mjx-i\">\\(0,0,-1,-1\\)<\/span>. <span class=\"mjx-i\">\\(\\mathcal{L}=\\tfrac12(0+0+1+1)=1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(X^\\top X=\\begin{bmatrix}4&amp;6\\\\6&amp;14\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(X^\\top y=\\begin{bmatrix}14\\\\29\\end{bmatrix}\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\theta^\\top X^\\top X=(1,2)\\begin{bmatrix}4&amp;6\\\\6&amp;14\\end{bmatrix}=(16,34)\\)<\/span>, nên <span class=\"mjx-i\">\\(\\dfrac{d\\mathcal{L}}{d\\theta}=(16-14,\\ 34-29)=(2,5)\\)<\/span>.<\/li>\n<li>Kiểm tra: <span class=\"mjx-i\">\\(\\dfrac{d\\mathcal{L}}{d\\theta}=-\\sum(y_n-\\hat y_n)x_n^\\top=-[(−1)(1,2)+(−1)(1,3)]=(2,5)\\)<\/span> ✓.<\/li>\n<\/ul>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Quên cột 1 khi mô hình có hệ số tự do.<\/li>\n<li>Gradient sai dấu: <span class=\"mjx-i\">\\(\\tfrac{d\\mathcal{L}}{d\\theta}=-\\tfrac1{\\sigma^2}\\sum(y_n-\\hat y_n)x_n^\\top\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Cách khác · Bấm máy<\/h3>\n<ul>\n<li><strong>Cách khác cho gradient:<\/strong> <span class=\"mjx-i\">\\(-\\tfrac1{\\sigma^2}\\sum_n(\\text{phần dư}_n)\\cdot x_n\\)<\/span>. Điểm nào có phần dư 0 thì bỏ qua, nhanh hơn nhân ma trận.<\/li>\n<li><strong>Bấm máy:<\/strong> Matrix: MatA <span class=\"mjx-i\">\\(=X\\)<\/span>, MatB <span class=\"mjx-i\">\\(=y\\)<\/span>, MatC <span class=\"mjx-i\">\\(=\\theta\\)<\/span>; gõ <code>Trn(MatC)Trn(MatA)MatA-Trn(MatB)MatA<\/code>.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 1.1<\/strong> Consider the linear regression model <span class=\"mjx-i\">\\(y=\\theta_0+\\theta_1x+\\varepsilon\\)<\/span> with training data <span class=\"mjx-i\">\\((1,2),(2,3),(4,7)\\)<\/span>. Which of the following is the design matrix <span class=\"mjx-i\">\\(X\\)<\/span>?<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;2&amp;4\\end{bmatrix}^T\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;1\\\\1&amp;2\\\\1&amp;4\\end{bmatrix}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;1&amp;1\\\\1&amp;2&amp;4\\end{bmatrix}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;2\\\\2&amp;3\\\\4&amp;7\\end{bmatrix}\\)<\/span><\/li>\n<\/ul>\n<p><strong>Câu 1.2<\/strong> With the data of Câu 1.1 and <span class=\"mjx-i\">\\(\\sigma^2=1\\)<\/span>, compute the negative log-likelihood (ignoring constants) <span class=\"mjx-i\">\\(\\mathcal{L}(\\theta)=\\frac{1}{2\\sigma^2}\\sum_n(y_n-\\theta_0-\\theta_1x_n)^2\\)<\/span> at <span class=\"mjx-i\">\\(\\theta=(0,2)\\)<\/span>.<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 0.5<\/li>\n<li>C. 1<\/li>\n<li>D. 2<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-9-h9\">Dạng 2: Ước lượng MLE (bình phương tối thiểu)<\/h2>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[\\theta_{ML}=(X^\\top X)^{-1}X^\\top y.\\]<\/div>\nTrường hợp <span class=\"mjx-i\">\\(y=\\theta_0+\\theta_1x\\)<\/span>: <span class=\"mjx-i\">\\(\\theta_1=\\dfrac{\\sum(x_n-\\bar x)(y_n-\\bar y)}{\\sum(x_n-\\bar x)^2}\\)<\/span>, <span class=\"mjx-i\">\\(\\theta_0=\\bar y-\\theta_1\\bar x\\)<\/span>.\nTrường hợp <span class=\"mjx-i\">\\(y=\\theta x\\)<\/span> (không hệ số tự do): <span class=\"mjx-i\">\\(\\theta=\\dfrac{\\sum x_ny_n}{\\sum x_n^2}\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> Data <span class=\"mjx-i\">\\((0,1),(1,3),(2,4),(3,6)\\)<\/span>. Find <span class=\"mjx-i\">\\(\\theta_{ML}\\)<\/span> for <span class=\"mjx-i\">\\(y=\\theta_0+\\theta_1x\\)<\/span> and predict <span class=\"mjx-i\">\\(y\\)<\/span> at <span class=\"mjx-i\">\\(x=5\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\bar x=1{,}5\\)<\/span>, <span class=\"mjx-i\">\\(\\bar y=3{,}5\\)<\/span>. Độ lệch <span class=\"mjx-i\">\\(x\\)<\/span>: <span class=\"mjx-i\">\\(-1{,}5;-0{,}5;0{,}5;1{,}5\\)<\/span>; độ lệch <span class=\"mjx-i\">\\(y\\)<\/span>: <span class=\"mjx-i\">\\(-2{,}5;-0{,}5;0{,}5;2{,}5\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\sum(x-\\bar x)(y-\\bar y)=3{,}75+0{,}25+0{,}25+3{,}75=8\\)<\/span>; <span class=\"mjx-i\">\\(\\sum(x-\\bar x)^2=5\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\theta_1=1{,}6\\)<\/span>, <span class=\"mjx-i\">\\(\\theta_0=3{,}5-1{,}6\\cdot1{,}5=1{,}1\\)<\/span>. Dự đoán tại <span class=\"mjx-i\">\\(x=5\\)<\/span>: <span class=\"mjx-i\">\\(1{,}1+8=9{,}1\\)<\/span>.<\/li>\n<li>Kiểm tra bằng phương trình chuẩn: <span class=\"mjx-i\">\\(\\begin{bmatrix}4&amp;6\\\\6&amp;14\\end{bmatrix}\\theta=\\begin{bmatrix}14\\\\29\\end{bmatrix}\\)<\/span> cho <span class=\"mjx-i\">\\(\\theta=(1{,}1;\\ 1{,}6)\\)<\/span> ✓.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (không hệ số tự do).<\/strong> Same data, model <span class=\"mjx-i\">\\(y=\\theta x\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\theta=\\dfrac{0+3+8+18}{0+1+4+9}=\\dfrac{29}{14}\\approx2{,}07\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Dùng công thức có hệ số tự do cho mô hình qua gốc (và ngược lại).<\/li>\n<li>Nhân sai thứ tự: <span class=\"mjx-i\">\\((X^\\top X)^{-1}X^\\top y\\)<\/span>, không phải <span class=\"mjx-i\">\\(X^\\top(XX^\\top)^{-1}y\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Bấm máy<\/h3>\n<ul>\n<li><strong>Bấm máy:<\/strong> Statistics → <span class=\"mjx-i\">\\(y=a+bx\\)<\/span> → nhập dữ liệu → Regression Results: <span class=\"mjx-i\">\\(a=1{,}1\\)<\/span>, <span class=\"mjx-i\">\\(b=1{,}6\\)<\/span>. Dự đoán: gõ <code>5ŷ<\/code> (máy có hàm <span class=\"mjx-i\">\\(\\hat y\\)<\/span> trong <code>OPTN<\/code> → Regression).<\/li>\n<li><strong>Thử đáp án:<\/strong> đường hồi quy (có hệ số tự do) luôn đi qua điểm trung bình <span class=\"mjx-i\">\\((\\bar x,\\bar y)\\)<\/span>: kiểm tra <span class=\"mjx-i\">\\(\\theta_0+\\theta_1\\bar x=\\bar y\\)<\/span> để loại đáp án.<\/li>\n<li>Tổng phần dư của hồi quy có hệ số tự do luôn bằng 0.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 2.1<\/strong> Given the training data <span class=\"mjx-i\">\\((1,2),(2,3),(4,7)\\)<\/span>, find the maximum likelihood estimate <span class=\"mjx-i\">\\(\\theta_{ML}=[\\theta_0\\ \\theta_1]^T\\)<\/span> for the model <span class=\"mjx-i\">\\(y=\\theta_0+\\theta_1x+\\varepsilon\\)<\/span>.<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\([0\\ \\ 1.5]^T\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\([0.5\\ \\ 1.5]^T\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\([0\\ \\ \\frac{12}{7}]^T\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\([-\\frac{1}{7}\\ \\ \\frac{12}{7}]^T\\)<\/span><\/li>\n<\/ul>\n<p><strong>Câu 2.2<\/strong> For the model <span class=\"mjx-i\">\\(y=\\theta x+\\varepsilon\\)<\/span> (no intercept) and data <span class=\"mjx-i\">\\((1,1),(2,3),(3,5)\\)<\/span>, the value of <span class=\"mjx-i\">\\(\\theta_{ML}\\)<\/span> is<\/p>\n<ul>\n<li>A. 1.5<\/li>\n<li>B. 11/7<\/li>\n<li>C. 5/3<\/li>\n<li>D. 2<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-9-h10\">Dạng 3: Hồi quy với đặc trưng đa thức<\/h2>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(\\phi(x)=(1,x,x^2,\\dots)\\)<\/span>, <span class=\"mjx-i\">\\(\\Phi\\)<\/span> có hàng <span class=\"mjx-i\">\\(n\\)<\/span> là <span class=\"mjx-i\">\\(\\phi(x_n)^\\top\\)<\/span>, <span class=\"mjx-i\">\\(\\theta_{ML}=(\\Phi^\\top\\Phi)^{-1}\\Phi^\\top y\\)<\/span>. Khi <span class=\"mjx-i\">\\(N=K\\)<\/span> và <span class=\"mjx-i\">\\(\\Phi\\)<\/span> khả nghịch: <span class=\"mjx-i\">\\(\\theta=\\Phi^{-1}y\\)<\/span> (đường cong đi <strong>qua đúng<\/strong> các điểm).<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> Fit <span class=\"mjx-i\">\\(y=\\theta_0+\\theta_1x+\\theta_2x^2\\)<\/span> to <span class=\"mjx-i\">\\((-1,2),(0,1),(1,2)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\Phi=\\begin{bmatrix}1&amp;-1&amp;1\\\\1&amp;0&amp;0\\\\1&amp;1&amp;1\\end{bmatrix}\\)<\/span>, giải <span class=\"mjx-i\">\\(\\Phi\\theta=y\\)<\/span>: từ hàng 2, <span class=\"mjx-i\">\\(\\theta_0=1\\)<\/span>; hàng 1 và 3: <span class=\"mjx-i\">\\(1-\\theta_1+\\theta_2=2\\)<\/span>, <span class=\"mjx-i\">\\(1+\\theta_1+\\theta_2=2\\)<\/span>, nên <span class=\"mjx-i\">\\(\\theta_1=0\\)<\/span>, <span class=\"mjx-i\">\\(\\theta_2=1\\)<\/span>. Vậy <span class=\"mjx-i\">\\(y=1+x^2\\)<\/span>.<\/p>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Bấm máy<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(N=K\\)<\/span> điểm, đa thức bậc <span class=\"mjx-i\">\\(K-1\\)<\/span>: chỉ cần giải hệ (Equation mode, hệ 3 ẩn).<\/li>\n<li>Dữ liệu đối xứng quanh 0 với <span class=\"mjx-i\">\\(y\\)<\/span> chẵn thì hệ số bậc lẻ bằng 0.<\/li>\n<li>Statistics → <span class=\"mjx-i\">\\(y=a+bx+cx^2\\)<\/span> cho hồi quy bậc 2 trực tiếp.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 3.1<\/strong> Using the feature map <span class=\"mjx-i\">\\(\\phi(x)=[1\\ \\ x\\ \\ x^2]^T\\)<\/span>, the feature matrix <span class=\"mjx-i\">\\(\\Phi\\)<\/span> for the inputs <span class=\"mjx-i\">\\(x_1=2,\\ x_2=-1\\)<\/span> is<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;2&amp;4\\\\1&amp;-1&amp;1\\end{bmatrix}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;1\\\\2&amp;-1\\\\4&amp;1\\end{bmatrix}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\begin{bmatrix}2&amp;4\\\\-1&amp;1\\end{bmatrix}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;2&amp;2\\\\1&amp;-1&amp;-1\\end{bmatrix}\\)<\/span><\/li>\n<\/ul>\n<p><strong>Câu 3.2<\/strong> Fit <span class=\"mjx-i\">\\(y=\\theta_0+\\theta_1x+\\theta_2x^2\\)<\/span> to the points <span class=\"mjx-i\">\\((0,1),(1,0),(2,3)\\)<\/span>. Find <span class=\"mjx-i\">\\(\\theta_2\\)<\/span>.<\/p>\n<ul>\n<li>A. 1<\/li>\n<li>B. 2<\/li>\n<li>C. -3<\/li>\n<li>D. 0<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-9-h11\">Dạng 4: Ước lượng phương sai nhiễu<\/h2>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(\\sigma^2_{ML}=\\dfrac1N\\sum(y_n-\\hat y_n)^2\\)<\/span> (chia <span class=\"mjx-i\">\\(N\\)<\/span>, theo slide).<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> With <span class=\"mjx-i\">\\(\\theta_{ML}=(1{,}1;\\ 1{,}6)\\)<\/span> from Dạng 2, find <span class=\"mjx-i\">\\(\\sigma^2_{ML}\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> Dự đoán: <span class=\"mjx-i\">\\(1{,}1;\\ 2{,}7;\\ 4{,}3;\\ 5{,}9\\)<\/span>. Phần dư: <span class=\"mjx-i\">\\(-0{,}1;\\ 0{,}3;\\ -0{,}3;\\ 0{,}1\\)<\/span>. Tổng bình phương <span class=\"mjx-i\">\\(0{,}2\\)<\/span>, nên <span class=\"mjx-i\">\\(\\sigma^2_{ML}=0{,}2/4=0{,}05\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Chia <span class=\"mjx-i\">\\(N-K\\)<\/span> hoặc <span class=\"mjx-i\">\\(N-1\\)<\/span> (đáp án nhiễu).<\/li>\n<li>Dùng <span class=\"mjx-i\">\\(\\theta\\)<\/span> chưa tối ưu để tính phần dư.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 4.1<\/strong> A linear model fitted to 4 data points gives residuals <span class=\"mjx-i\">\\(0.5,\\ -1,\\ 1,\\ -0.5\\)<\/span>. The maximum likelihood estimate of the noise variance <span class=\"mjx-i\">\\(\\sigma^2\\)<\/span> is<\/p>\n<ul>\n<li>A. 0.625<\/li>\n<li>B. 2.5<\/li>\n<li>C. 0.833<\/li>\n<li>D. 0.79<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-9-h12\">Dạng 5: MAP / ridge<\/h2>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(\\theta_{MAP}=\\big(\\Phi^\\top\\Phi+\\tfrac{\\sigma^2}{b^2}I\\big)^{-1}\\Phi^\\top y\\)<\/span>. Một chiều, không hệ số tự do: <span class=\"mjx-i\">\\(\\theta_{MAP}=\\dfrac{\\sum x_ny_n}{\\sum x_n^2+\\sigma^2/b^2}\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> Data <span class=\"mjx-i\">\\((0,1),(1,3),(2,4),(3,6)\\)<\/span>, model <span class=\"mjx-i\">\\(y=\\theta x\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma^2=1\\)<\/span>, prior <span class=\"mjx-i\">\\(\\theta\\sim\\mathcal{N}(0,0{,}5)\\)<\/span>. Find <span class=\"mjx-i\">\\(\\theta_{MAP}\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\sigma^2/b^2=1/0{,}5=2\\)<\/span>. <span class=\"mjx-i\">\\(\\theta_{MAP}=\\dfrac{29}{14+2}=\\dfrac{29}{16}\\approx1{,}81\\)<\/span> (nhỏ hơn <span class=\"mjx-i\">\\(\\theta_{ML}=\\tfrac{29}{14}\\)<\/span>, đúng như dự đoán: bị kéo về 0).<\/p>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(|\\theta_{MAP}|&lt;|\\theta_{ML}|\\)<\/span> (theo từng chiều trong trường hợp 1 chiều): loại ngay đáp án lớn hơn MLE.<\/li>\n<li><span class=\"mjx-i\">\\(b\\to\\infty\\)<\/span> (tiên nghiệm phẳng) thì <span class=\"mjx-i\">\\(\\theta_{MAP}\\to\\theta_{ML}\\)<\/span>.<\/li>\n<li>Nhớ <span class=\"mjx-i\">\\(b^2\\)<\/span> là <strong>phương sai<\/strong> của tiên nghiệm: <span class=\"mjx-i\">\\(\\mathcal{N}(0,0{,}5)\\)<\/span> có <span class=\"mjx-i\">\\(b^2=0{,}5\\)<\/span>.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 5.1<\/strong> Consider <span class=\"mjx-i\">\\(y=\\theta x+\\varepsilon\\)<\/span>, <span class=\"mjx-i\">\\(\\varepsilon\\sim\\mathcal{N}(0,1)\\)<\/span>, prior <span class=\"mjx-i\">\\(\\theta\\sim\\mathcal{N}(0,1)\\)<\/span>, and data <span class=\"mjx-i\">\\((1,2),(2,3)\\)<\/span>. Find <span class=\"mjx-i\">\\(\\theta_{MAP}\\)<\/span>.<\/p>\n<ul>\n<li>A. 8/5<\/li>\n<li>B. 4/3<\/li>\n<li>C. 3/2<\/li>\n<li>D. 2<\/li>\n<\/ul>\n<p><strong>Câu 5.2<\/strong> Which statement about <span class=\"mjx-i\">\\(\\theta_{MAP}\\)<\/span> with prior <span class=\"mjx-i\">\\(p(\\theta)=\\mathcal{N}(0,b^2I)\\)<\/span> is true?<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\theta_{MAP}=(\\Phi^T\\Phi+\\frac{\\sigma^2}{b^2}I)^{-1}\\Phi^Ty\\)<\/span><\/li>\n<li>(ii) As <span class=\"mjx-i\">\\(b\\to\\infty\\)<\/span>, <span class=\"mjx-i\">\\(\\theta_{MAP}\\)<\/span> approaches <span class=\"mjx-i\">\\(\\theta_{ML}\\)<\/span>.<\/li>\n<li>A. Only (i)<\/li>\n<li>B. Only (ii)<\/li>\n<li>C. Both (i) and (ii)<\/li>\n<li>D. Neither (i) nor (ii)<\/li>\n<\/ul>\n<hr/>\n<h1 id=\"MAI391-9-h13\"><span class=\"pn\">Phần 4<\/span>Tổng hợp<\/h1>\n<p><div class=\"mjx-d\">\\[\\theta_{ML}=(X^\\top X)^{-1}X^\\top y,\\qquad\\sigma^2_{ML}=\\tfrac1N\\textstyle\\sum(y_n-\\hat y_n)^2,\\qquad\\theta_{MAP}=\\big(\\Phi^\\top\\Phi+\\tfrac{\\sigma^2}{b^2}I\\big)^{-1}\\Phi^\\top y\\]<\/div>\n<div class=\"mjx-d\">\\[\\mathcal{L}(\\theta)=\\tfrac{1}{2\\sigma^2}\\lVert y-X\\theta\\rVert^2,\\qquad\\tfrac{d\\mathcal{L}}{d\\theta}=\\tfrac1{\\sigma^2}(\\theta^\\top X^\\top X-y^\\top X)\\]<\/div><\/p>\n<p><strong>Lỗi hay gặp:<\/strong> quên cột 1; nhầm mô hình có/không có hệ số tự do; <span class=\"mjx-i\">\\(\\sigma^2_{ML}\\)<\/span> chia sai mẫu; nhầm <span class=\"mjx-i\">\\(b\\)<\/span> với <span class=\"mjx-i\">\\(b^2\\)<\/span> trong MAP.<\/p>\n<hr/>\n<details>\n<summary><b>Đáp án câu luyện tập (bấm để mở)<\/b><\/summary>\n<ul>\n<li>1.1: (ii). 1.2: phần dư <span class=\"mjx-i\">\\(0,-1,-1\\)<\/span>, nên <span class=\"mjx-i\">\\(\\mathcal{L}=\\tfrac12\\cdot2=1\\)<\/span> → C.<\/li>\n<li>2.1: <span class=\"mjx-i\">\\(X^\\top X=\\begin{bmatrix}3&amp;7\\\\7&amp;21\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(X^\\top y=\\begin{bmatrix}12\\\\36\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(\\det=14\\)<\/span>; <span class=\"mjx-i\">\\(\\theta=\\tfrac1{14}\\begin{bmatrix}21&amp;-7\\\\-7&amp;3\\end{bmatrix}\\begin{bmatrix}12\\\\36\\end{bmatrix}=\\big(0,\\ \\tfrac{12}{7}\\big)\\)<\/span> → C. (Kiểm tra: đi qua <span class=\"mjx-i\">\\((\\bar x,\\bar y)=(\\tfrac73,4)\\)<\/span> ✓.)<\/li>\n<li>2.2: <span class=\"mjx-i\">\\(\\tfrac{1+6+15}{1+4+9}=\\tfrac{22}{14}=\\tfrac{11}{7}\\)<\/span> → B.<\/li>\n<li>3.1: (i). 3.2: hệ <span class=\"mjx-i\">\\(\\theta_0=1\\)<\/span>; <span class=\"mjx-i\">\\(1+\\theta_1+\\theta_2=0\\)<\/span>; <span class=\"mjx-i\">\\(1+2\\theta_1+4\\theta_2=3\\)<\/span> → <span class=\"mjx-i\">\\(\\theta_2=2\\)<\/span> → B.<\/li>\n<li>4.1: <span class=\"mjx-i\">\\((0{,}25+1+1+0{,}25)/4=0{,}625\\)<\/span> → A.<\/li>\n<li>5.1: <span class=\"mjx-i\">\\(\\sigma^2/b^2=1\\)<\/span>; <span class=\"mjx-i\">\\(\\theta_{MAP}=\\tfrac{2+6}{1+4+1}=\\tfrac86=\\tfrac43\\)<\/span> → B.<\/li>\n<li>5.2: C.<\/li>\n<\/ul>\n<\/details>\n", "q": 0}, {"num": "10", "short": "Giảm chiều với PCA", "sub": "Mathematics for Machine Learning – mục 10.1 – 10.6", "toc": [["h1", "PHẦN 1. GHI CHÉP BÀI HỌC", "MAI391-10-h1"], ["h2", "1.1. Đặt bài toán — mục 10.1", "MAI391-10-h2"], ["h2", "1.2. Góc nhìn phương sai cực đại — mục 10.2", "MAI391-10-h3"], ["h2", "1.3. Góc nhìn phép chiếu (sai số tái tạo nhỏ nhất) — mục 10.3", "MAI391-10-h4"], ["h2", "1.4. Tính vector riêng & xấp xỉ hạng thấp — mục 10.4", "MAI391-10-h5"], ["h2", "1.5. PCA khi số chiều lớn ( \\(N\\ll D\\) ) — mục 10.5", "MAI391-10-h6"], ["h2", "1.6. Các bước PCA thực tế — mục 10.6", "MAI391-10-h7"], ["h1", "PHẦN 2. CÁC DẠNG BÀI CÓ THỂ RA", "MAI391-10-h8"], ["h2", "Chuẩn bị: Casio fx-580VN X cho Chương 10", "MAI391-10-h9"], ["h1", "PHẦN 3. CÁC DẠNG BÀI", "MAI391-10-h10"], ["h2", "Dạng 1: Trừ trung bình & ma trận hiệp phương sai", "MAI391-10-h11"], ["h2", "Dạng 2: Thành phần chính & phương sai giữ lại", "MAI391-10-h12"], ["h2", "Dạng 3: Chiếu, tái tạo, sai số tái tạo", "MAI391-10-h13"], ["h2", "Dạng 4: Liên hệ SVD & power iteration", "MAI391-10-h14"], ["h2", "Dạng 5: PCA khi \\(N\\ll D\\)", "MAI391-10-h15"], ["h1", "PHẦN 4. TỔNG HỢP", "MAI391-10-h16"]], "html": "<blockquote>\n<p>⚠️ <strong>Lưu ý quan trọng:<\/strong> trong 10 đề MAI391 đã có <strong>không có câu nào<\/strong> thuộc Chương 10. Phần cuối mỗi dạng là <strong>câu luyện tập tự soạn<\/strong> theo văn phong đề MAI391 (không phải đề thật), có đáp án ở cuối file. Chương này dùng lại nhiều kiến thức của Chương 4 (trị riêng, SVD) và Chương 6 (ma trận hiệp phương sai).<\/p>\n<\/blockquote>\n<hr/>\n<h1 id=\"MAI391-10-h1\"><span class=\"pn\">Phần 1<\/span>Ghi chép bài học<\/h1>\n<h2 id=\"MAI391-10-h2\">1.1. Đặt bài toán — mục 10.1<\/h2>\n<ul>\n<li>Dữ liệu <span class=\"mjx-i\">\\(\\mathcal{X}=\\{x_1,\\dots,x_N\\}\\subset\\mathbb{R}^D\\)<\/span>, <strong>đã trừ trung bình<\/strong> (mean 0).<\/li>\n<li>Ma trận hiệp phương sai dữ liệu:\n<div class=\"mjx-d\">\\[S=\\frac1N\\sum_{n=1}^Nx_nx_n^\\top=\\frac1NXX^\\top\\quad(X=[x_1\\ \\cdots\\ x_N]\\in\\mathbb{R}^{D\\times N}).\\]<\/div><\/li>\n<li>Tìm <strong>ma trận chiếu trực chuẩn<\/strong> <span class=\"mjx-i\">\\(B=[b_1\\ \\cdots\\ b_M]\\in\\mathbb{R}^{D\\times M}\\)<\/span> (<span class=\"mjx-i\">\\(M&lt;D\\)<\/span>, <span class=\"mjx-i\">\\(B^\\top B=I\\)<\/span>):\n<ul>\n<li><strong>mã (code)<\/strong>: <span class=\"mjx-i\">\\(z_n=B^\\top x_n\\in\\mathbb{R}^M\\)<\/span>;<\/li>\n<li><strong>tái tạo<\/strong>: <span class=\"mjx-i\">\\(\\tilde x_n=Bz_n=BB^\\top x_n\\in\\mathbb{R}^D\\)<\/span>.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> chụp ảnh một vật 3D thành ảnh 2D. PCA chọn <strong>góc chụp<\/strong> sao cho ảnh giữ được nhiều \"độ trải\" (phương sai) của vật nhất, tức là mất ít thông tin nhất.<\/p>\n<\/blockquote>\n<hr/>\n<h2 id=\"MAI391-10-h3\">1.2. Góc nhìn phương sai cực đại — mục 10.2<\/h2>\n<ul>\n<li>Phương sai của dữ liệu chiếu lên hướng đơn vị <span class=\"mjx-i\">\\(b_1\\)<\/span>: <span class=\"mjx-i\">\\(V_1=b_1^\\top Sb_1\\)<\/span>.<\/li>\n<li>Bài toán <span class=\"mjx-i\">\\(\\max b_1^\\top Sb_1\\)<\/span> s.t. <span class=\"mjx-i\">\\(\\lVert b_1\\rVert=1\\)<\/span> (Lagrange) cho <span class=\"mjx-i\">\\(Sb_1=\\lambda_1b_1\\)<\/span>, và <span class=\"mjx-i\">\\(V_1=\\lambda_1\\)<\/span>.<\/li>\n<li>Kết luận: <strong>thành phần chính thứ nhất<\/strong> <span class=\"mjx-i\">\\(b_1\\)<\/span> là <strong>vector riêng<\/strong> của <span class=\"mjx-i\">\\(S\\)<\/span> ứng với <strong>trị riêng lớn nhất<\/strong> <span class=\"mjx-i\">\\(\\lambda_1\\)<\/span>; phương sai giữ lại bằng <span class=\"mjx-i\">\\(\\lambda_1\\)<\/span>.<\/li>\n<li>Tổng quát: <span class=\"mjx-i\">\\(M\\)<\/span> thành phần chính là <span class=\"mjx-i\">\\(M\\)<\/span> vector riêng ứng với <span class=\"mjx-i\">\\(M\\)<\/span> trị riêng lớn nhất:\n<div class=\"mjx-d\">\\[V_M=\\sum_{m=1}^M\\lambda_m,\\qquad J_M=\\sum_{j=M+1}^D\\lambda_j\\ (\\text{phương sai bị mất}).\\]<\/div><\/li>\n<\/ul>\n<blockquote>\n<p><em>(Slide gọi <span class=\"mjx-i\">\\(\\lambda_1\\)<\/span> là \"first principal component\"; chính xác hơn, <span class=\"mjx-i\">\\(b_1\\)<\/span> là thành phần chính, còn <span class=\"mjx-i\">\\(\\lambda_1\\)<\/span> là phương sai theo hướng đó.)<\/em><\/p>\n<\/blockquote>\n<hr/>\n<h2 id=\"MAI391-10-h4\">1.3. Góc nhìn phép chiếu (sai số tái tạo nhỏ nhất) — mục 10.3<\/h2>\n<ul>\n<li>Sai số tái tạo trung bình: <span class=\"mjx-i\">\\(J_M=\\dfrac1N\\sum_n\\lVert x_n-\\tilde x_n\\rVert^2\\)<\/span>.<\/li>\n<li>Tọa độ tối ưu: <span class=\"mjx-i\">\\(z_{in}=b_i^\\top x_n\\)<\/span> (chiếu trực giao).<\/li>\n<li>Kết quả: <span class=\"mjx-i\">\\(J_M=\\sum_{j=M+1}^D\\lambda_j\\)<\/span>. <strong>Cực tiểu sai số tái tạo <span class=\"mjx-i\">\\(\\iff\\)<\/span> cực đại phương sai giữ lại<\/strong>: hai góc nhìn cho cùng nghiệm.<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-10-h5\">1.4. Tính vector riêng &amp; xấp xỉ hạng thấp — mục 10.4<\/h2>\n<ul>\n<li>SVD của dữ liệu <span class=\"mjx-i\">\\(X=U\\Sigma V^\\top\\)<\/span> (<span class=\"mjx-i\">\\(D\\times N\\)<\/span>): <span class=\"mjx-i\">\\(S=\\tfrac1NU\\Sigma\\Sigma^\\top U^\\top\\)<\/span>, nên các cột của <span class=\"mjx-i\">\\(U\\)<\/span> là vector riêng của <span class=\"mjx-i\">\\(S\\)<\/span> và\n<div class=\"mjx-d\">\\[\\boxed{\\lambda_d=\\frac{\\sigma_d^2}{N}}.\\]<\/div><\/li>\n<li>Eckart–Young: xấp xỉ hạng <span class=\"mjx-i\">\\(M\\)<\/span> tốt nhất của <span class=\"mjx-i\">\\(X\\)<\/span> là <span class=\"mjx-i\">\\(\\tilde X_M=U_M\\Sigma_MV_M^\\top\\)<\/span>.<\/li>\n<li><strong>Power iteration<\/strong> (chỉ cần vector riêng lớn nhất): <span class=\"mjx-i\">\\(x_{k+1}=\\dfrac{Sx_k}{\\lVert Sx_k\\rVert}\\)<\/span> hội tụ về <span class=\"mjx-i\">\\(b_1\\)<\/span>.<\/li>\n<\/ul>\n<h2 id=\"MAI391-10-h6\">1.5. PCA khi số chiều lớn (<span class=\"mjx-i\">\\(N\\ll D\\)<\/span>) — mục 10.5<\/h2>\n<ul>\n<li>Thay vì <span class=\"mjx-i\">\\(S=\\tfrac1NXX^\\top\\)<\/span> (<span class=\"mjx-i\">\\(D\\times D\\)<\/span>), dùng <span class=\"mjx-i\">\\(\\tfrac1NX^\\top X\\)<\/span> (<span class=\"mjx-i\">\\(N\\times N\\)<\/span>), cùng các trị riêng khác 0.<\/li>\n<li>Nếu <span class=\"mjx-i\">\\(\\tfrac1NX^\\top Xc_m=\\lambda_mc_m\\)<\/span> thì <span class=\"mjx-i\">\\(b_m\\propto Xc_m\\)<\/span> là vector riêng của <span class=\"mjx-i\">\\(S\\)<\/span> (rồi chuẩn hóa).<\/li>\n<\/ul>\n<h2 id=\"MAI391-10-h7\">1.6. Các bước PCA thực tế — mục 10.6<\/h2>\n<ol>\n<li><strong>Trừ trung bình<\/strong> từng chiều.<\/li>\n<li><strong>Chuẩn hóa<\/strong> (chia độ lệch chuẩn từng chiều) nếu các chiều khác đơn vị đo.<\/li>\n<li><strong>Phân tích trị riêng<\/strong> của ma trận hiệp phương sai; chọn <span class=\"mjx-i\">\\(M\\)<\/span> vector riêng lớn nhất.<\/li>\n<li><strong>Chiếu<\/strong>: <span class=\"mjx-i\">\\(z=B^\\top x\\)<\/span> (với <span class=\"mjx-i\">\\(x\\)<\/span> đã trừ trung bình, chuẩn hóa); tái tạo về không gian gốc thì nhân ngược lại độ lệch chuẩn và cộng trung bình.<\/li>\n<\/ol>\n<hr/>\n<h1 id=\"MAI391-10-h8\"><span class=\"pn\">Phần 2<\/span>Các dạng bài có thể ra<\/h1>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dạng<\/th>\n<th>Nội dung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Trừ trung bình &amp; ma trận hiệp phương sai<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(\\bar x\\)<\/span>, <span class=\"mjx-i\">\\(S\\)<\/span> (chia <span class=\"mjx-i\">\\(N\\)<\/span>)<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Thành phần chính &amp; phương sai giữ lại<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(b_1\\)<\/span>, <span class=\"mjx-i\">\\(\\lambda_1\\)<\/span>, tỉ lệ <span class=\"mjx-i\">\\(\\tfrac{\\sum_{m\\le M}\\lambda_m}{\\sum\\lambda}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>3. Chiếu, tái tạo, sai số tái tạo<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(z=B^\\top x\\)<\/span>, <span class=\"mjx-i\">\\(\\tilde x=BB^\\top x\\)<\/span>, <span class=\"mjx-i\">\\(J_M\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>4. Liên hệ SVD &amp; power iteration<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(\\lambda=\\sigma^2/N\\)<\/span>; một bước power iteration<\/td>\n<\/tr>\n<tr>\n<td><strong>5. PCA khi <span class=\"mjx-i\">\\(N\\ll D\\)<\/span><\/strong><\/td>\n<td>Dùng <span class=\"mjx-i\">\\(\\tfrac1NX^\\top X\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"MAI391-10-h9\">Chuẩn bị: Casio fx-580VN X cho Chương 10<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Việc cần làm<\/th>\n<th>Thao tác<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Trung bình, phương sai từng chiều<\/td>\n<td>Statistics → 1-Variable (hoặc <span class=\"mjx-i\">\\(y=a+bx\\)<\/span> cho 2 chiều): <span class=\"mjx-i\">\\(\\bar x\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma_x^2\\)<\/span> (chia <span class=\"mjx-i\">\\(N\\)<\/span>)<\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(S=\\tfrac1NXX^\\top\\)<\/span><\/td>\n<td>Matrix: MatA <span class=\"mjx-i\">\\(=X\\)<\/span> (<span class=\"mjx-i\">\\(D\\times N\\)<\/span>, đã trừ trung bình), gõ <code>MatA×Trn(MatA)÷N<\/code><\/td>\n<\/tr>\n<tr>\n<td>Trị riêng <span class=\"mjx-i\">\\(S\\)<\/span> (<span class=\"mjx-i\">\\(2\\times2\\)<\/span>)<\/td>\n<td>Equation → Polynomial bậc 2: <span class=\"mjx-i\">\\(\\lambda^2-\\mathrm{tr}S\\,\\lambda+\\det S\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>Power iteration<\/td>\n<td>Matrix: <code>MatA×MatB<\/code> rồi chia cho độ dài (<code>Abs<\/code> trong Vector mode)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-10-h10\"><span class=\"pn\">Phần 3<\/span>Các dạng bài<\/h1>\n<h2 id=\"MAI391-10-h11\">Dạng 1: Trừ trung bình &amp; ma trận hiệp phương sai<\/h2>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(\\bar x=\\tfrac1N\\sum x_n\\)<\/span>; <span class=\"mjx-i\">\\(S=\\tfrac1N\\sum(x_n-\\bar x)(x_n-\\bar x)^\\top\\)<\/span>; <span class=\"mjx-i\">\\(s_{ij}\\)<\/span> = hiệp phương sai của chiều <span class=\"mjx-i\">\\(i\\)<\/span> và <span class=\"mjx-i\">\\(j\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> Data <span class=\"mjx-i\">\\((1,2),(3,4),(5,0)\\)<\/span>. Find <span class=\"mjx-i\">\\(\\bar x\\)<\/span> and <span class=\"mjx-i\">\\(S\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\bar x=(3,2)\\)<\/span>. Dữ liệu sau khi trừ: <span class=\"mjx-i\">\\((-2,0),(0,2),(2,-2)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(s_{11}=\\tfrac{4+0+4}{3}=\\tfrac83\\)<\/span>; <span class=\"mjx-i\">\\(s_{22}=\\tfrac{0+4+4}{3}=\\tfrac83\\)<\/span>; <span class=\"mjx-i\">\\(s_{12}=\\tfrac{0+0-4}{3}=-\\tfrac43\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(S=\\begin{bmatrix}8/3&amp;-4/3\\\\-4/3&amp;8/3\\end{bmatrix}\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li>Đường chéo của <span class=\"mjx-i\">\\(S\\)<\/span> phải <strong>dương<\/strong> và <span class=\"mjx-i\">\\(S\\)<\/span> đối xứng: loại nhanh đáp án.<\/li>\n<li>Slide chia <span class=\"mjx-i\">\\(N\\)<\/span> (không phải <span class=\"mjx-i\">\\(N-1\\)<\/span>).<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 1.1<\/strong> Consider the dataset <span class=\"mjx-i\">\\(x_1=[2\\ 1]^T,\\ x_2=[0\\ 3]^T,\\ x_3=[4\\ 2]^T\\)<\/span>. After mean subtraction, the second data point becomes<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\([-2\\ \\ 1]^T\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\([-2\\ \\ 3]^T\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\([0\\ \\ 1]^T\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\([2\\ \\ 0]^T\\)<\/span><\/li>\n<\/ul>\n<p><strong>Câu 1.2<\/strong> For the dataset of Câu 1.1, the <span class=\"mjx-i\">\\((1,1)\\)<\/span>-entry of the data covariance matrix <span class=\"mjx-i\">\\(S=\\frac1N\\sum_n(x_n-\\bar x)(x_n-\\bar x)^T\\)<\/span> is<\/p>\n<ul>\n<li>A. 4<\/li>\n<li>B. 8/3<\/li>\n<li>C. 2<\/li>\n<li>D. 8<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-10-h12\">Dạng 2: Thành phần chính &amp; phương sai giữ lại<\/h2>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(b_1\\)<\/span> = vector riêng <strong>đơn vị<\/strong> ứng với <span class=\"mjx-i\">\\(\\lambda_{\\max}(S)\\)<\/span>; phương sai giữ lại khi giữ <span class=\"mjx-i\">\\(M\\)<\/span> thành phần: <span class=\"mjx-i\">\\(\\sum_{m\\le M}\\lambda_m\\)<\/span>; tỉ lệ <span class=\"mjx-i\">\\(\\dfrac{\\sum_{m\\le M}\\lambda_m}{\\mathrm{tr}S}\\)<\/span> (vì <span class=\"mjx-i\">\\(\\sum\\lambda=\\mathrm{tr}S\\)<\/span>).<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> Centered data <span class=\"mjx-i\">\\((2,2),(-2,-2),(1,-1),(-1,1)\\)<\/span>. Find the first principal component and the fraction of variance it explains.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(S=\\tfrac14\\begin{bmatrix}10&amp;6\\\\6&amp;10\\end{bmatrix}=\\begin{bmatrix}2{,}5&amp;1{,}5\\\\1{,}5&amp;2{,}5\\end{bmatrix}\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\lambda^2-5\\lambda+(6{,}25-2{,}25)=0\\iff\\lambda^2-5\\lambda+4=0\\)<\/span>, nên <span class=\"mjx-i\">\\(\\lambda_1=4\\)<\/span>, <span class=\"mjx-i\">\\(\\lambda_2=1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\((S-4I)v=0\\)<\/span>: <span class=\"mjx-i\">\\(-1{,}5v_1+1{,}5v_2=0\\)<\/span>, nên <span class=\"mjx-i\">\\(b_1=\\tfrac1{\\sqrt2}(1,1)\\)<\/span>.<\/li>\n<li>Tỉ lệ phương sai giữ lại: <span class=\"mjx-i\">\\(\\tfrac4{4+1}=80\\%\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Chọn vector riêng ứng với trị riêng <strong>nhỏ nhất<\/strong>.<\/li>\n<li>Quên chuẩn hóa <span class=\"mjx-i\">\\(b_1\\)<\/span> về độ dài 1.<\/li>\n<li>Tính trên dữ liệu <strong>chưa trừ trung bình<\/strong>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(S=\\begin{bmatrix}a&amp;c\\\\c&amp;a\\end{bmatrix}\\)<\/span> (đường chéo bằng nhau): trị riêng <span class=\"mjx-i\">\\(a\\pm c\\)<\/span>, vector riêng <span class=\"mjx-i\">\\((1,1)\\)<\/span> và <span class=\"mjx-i\">\\((1,-1)\\)<\/span>. Nếu <span class=\"mjx-i\">\\(c&gt;0\\)<\/span> thì <span class=\"mjx-i\">\\(b_1\\propto(1,1)\\)<\/span>, nếu <span class=\"mjx-i\">\\(c&lt;0\\)<\/span> thì <span class=\"mjx-i\">\\(b_1\\propto(1,-1)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(S\\)<\/span> chéo: thành phần chính là trục có phương sai lớn nhất.<\/li>\n<li>Tổng trị riêng = <span class=\"mjx-i\">\\(\\mathrm{tr}S\\)<\/span>, nên chỉ cần tính <span class=\"mjx-i\">\\(\\lambda_1\\)<\/span> là có tỉ lệ.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 2.1<\/strong> The covariance matrix of a centered dataset is <span class=\"mjx-i\">\\(S=\\begin{bmatrix}3&amp;1\\\\1&amp;3\\end{bmatrix}\\)<\/span>. Which vector is the first principal component?<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\frac{1}{\\sqrt2}[1\\ \\ 1]^T\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\frac{1}{\\sqrt2}[1\\ \\ -1]^T\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\([1\\ \\ 0]^T\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\([0\\ \\ 1]^T\\)<\/span><\/li>\n<\/ul>\n<p><strong>Câu 2.2<\/strong> The eigenvalues of the data covariance matrix of a 3-dimensional dataset are <span class=\"mjx-i\">\\(6,\\ 3,\\ 1\\)<\/span>. What fraction of the variance is retained by projecting onto the first two principal components?<\/p>\n<ul>\n<li>A. 0.6<\/li>\n<li>B. 0.9<\/li>\n<li>C. 0.1<\/li>\n<li>D. 0.3<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-10-h13\">Dạng 3: Chiếu, tái tạo, sai số tái tạo<\/h2>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(z=B^\\top x\\)<\/span>, <span class=\"mjx-i\">\\(\\tilde x=BB^\\top x\\)<\/span>, <span class=\"mjx-i\">\\(\\lVert x-\\tilde x\\rVert^2\\)<\/span>; sai số tái tạo trung bình <span class=\"mjx-i\">\\(J_M=\\sum_{j&gt;M}\\lambda_j\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> With the data and <span class=\"mjx-i\">\\(b_1=\\tfrac1{\\sqrt2}(1,1)\\)<\/span> from Dạng 2 (<span class=\"mjx-i\">\\(M=1\\)<\/span>), compute the code and reconstruction of <span class=\"mjx-i\">\\(x=(1,-1)\\)<\/span> and of <span class=\"mjx-i\">\\(x=(2,2)\\)<\/span>, and the average reconstruction error.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(x=(2,2)\\)<\/span>: <span class=\"mjx-i\">\\(z=\\tfrac{4}{\\sqrt2}=2\\sqrt2\\)<\/span>; <span class=\"mjx-i\">\\(\\tilde x=zb_1=(2,2)\\)<\/span>; sai số 0.<\/li>\n<li><span class=\"mjx-i\">\\(x=(1,-1)\\)<\/span>: <span class=\"mjx-i\">\\(z=0\\)<\/span>; <span class=\"mjx-i\">\\(\\tilde x=(0,0)\\)<\/span>; sai số <span class=\"mjx-i\">\\(\\lVert(1,-1)\\rVert^2=2\\)<\/span>.<\/li>\n<li>Bốn điểm có sai số <span class=\"mjx-i\">\\(0,0,2,2\\)<\/span>, trung bình <span class=\"mjx-i\">\\(1=\\lambda_2\\)<\/span> ✓.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(J_M\\)<\/span> = tổng các trị riêng <strong>bị bỏ<\/strong>: không cần tái tạo từng điểm.<\/li>\n<li>Tái tạo luôn nằm trên đường thẳng/mặt phẳng sinh bởi <span class=\"mjx-i\">\\(b_1,\\dots,b_M\\)<\/span>.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 3.1<\/strong> Let <span class=\"mjx-i\">\\(b_1=\\frac{1}{\\sqrt2}[1\\ \\ 1]^T\\)<\/span> be the principal subspace basis (<span class=\"mjx-i\">\\(M=1\\)<\/span>). The reconstruction <span class=\"mjx-i\">\\(\\tilde x\\)<\/span> of the (centered) point <span class=\"mjx-i\">\\(x=[3\\ \\ 1]^T\\)<\/span> is<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\([2\\ \\ 2]^T\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\([2\\sqrt2\\ \\ 2\\sqrt2]^T\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\([3\\ \\ 1]^T\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\([1\\ \\ 1]^T\\)<\/span><\/li>\n<\/ul>\n<p><strong>Câu 3.2<\/strong> The eigenvalues of the data covariance matrix are <span class=\"mjx-i\">\\(5,\\ 2,\\ 0.5,\\ 0.5\\)<\/span>. The average squared reconstruction error when PCA projects onto a 2-dimensional principal subspace is<\/p>\n<ul>\n<li>A. 7<\/li>\n<li>B. 1<\/li>\n<li>C. 0.5<\/li>\n<li>D. 8<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-10-h14\">Dạng 4: Liên hệ SVD &amp; power iteration<\/h2>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(\\lambda_d=\\sigma_d^2/N\\)<\/span> (với <span class=\"mjx-i\">\\(X\\in\\mathbb{R}^{D\\times N}\\)<\/span> đã trừ trung bình); <span class=\"mjx-i\">\\(x_{k+1}=Sx_k/\\lVert Sx_k\\rVert\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> The centered data matrix <span class=\"mjx-i\">\\(X\\in\\mathbb{R}^{2\\times4}\\)<\/span> has singular values <span class=\"mjx-i\">\\(4\\)<\/span> and <span class=\"mjx-i\">\\(2\\)<\/span>. Find the eigenvalues of <span class=\"mjx-i\">\\(S\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\lambda_1=\\tfrac{16}{4}=4\\)<\/span>, <span class=\"mjx-i\">\\(\\lambda_2=\\tfrac44=1\\)<\/span>. (Đúng là dữ liệu của Dạng 2.)<\/p>\n<p><strong>Ví dụ 2.<\/strong> Power iteration with <span class=\"mjx-i\">\\(S=\\begin{bmatrix}2{,}5&amp;1{,}5\\\\1{,}5&amp;2{,}5\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(x_0=(1,0)\\)<\/span>. Find <span class=\"mjx-i\">\\(x_1\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(Sx_0=(2{,}5;\\ 1{,}5)\\)<\/span>, độ dài <span class=\"mjx-i\">\\(\\sqrt{8{,}5}\\approx2{,}915\\)<\/span>, nên <span class=\"mjx-i\">\\(x_1\\approx(0{,}857;\\ 0{,}514)\\)<\/span>. Các bước tiếp: <span class=\"mjx-i\">\\((0{,}750;0{,}662)\\)<\/span>, <span class=\"mjx-i\">\\((0{,}718;0{,}696)\\)<\/span>, tiến dần về <span class=\"mjx-i\">\\((0{,}707;0{,}707)=b_1\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Quên chia <span class=\"mjx-i\">\\(N\\)<\/span>: <span class=\"mjx-i\">\\(\\lambda=\\sigma^2\\)<\/span> là sai.<\/li>\n<li>Power iteration quên chuẩn hóa.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 4.1<\/strong> A centered data matrix <span class=\"mjx-i\">\\(X\\in\\mathbb{R}^{3\\times 5}\\)<\/span> has singular values <span class=\"mjx-i\">\\(5,\\ \\sqrt5,\\ 0\\)<\/span>. The largest eigenvalue of the data covariance matrix <span class=\"mjx-i\">\\(S=\\frac15XX^T\\)<\/span> is<\/p>\n<ul>\n<li>A. 25<\/li>\n<li>B. 5<\/li>\n<li>C. 1<\/li>\n<li>D. <span class=\"mjx-i\">\\(\\sqrt5\\)<\/span><\/li>\n<\/ul>\n<p><strong>Câu 4.2<\/strong> Apply one step of power iteration <span class=\"mjx-i\">\\(x_1=\\frac{Sx_0}{\\|Sx_0\\|}\\)<\/span> with <span class=\"mjx-i\">\\(S=\\begin{bmatrix}2&amp;0\\\\0&amp;1\\end{bmatrix}\\)<\/span> and <span class=\"mjx-i\">\\(x_0=\\frac{1}{\\sqrt2}[1\\ \\ 1]^T\\)<\/span>. Then <span class=\"mjx-i\">\\(x_1\\)<\/span> equals<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(\\frac{1}{\\sqrt5}[2\\ \\ 1]^T\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(\\frac{1}{\\sqrt2}[1\\ \\ 1]^T\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\([1\\ \\ 0]^T\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(\\frac{1}{\\sqrt5}[1\\ \\ 2]^T\\)<\/span><\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-10-h15\">Dạng 5: PCA khi <span class=\"mjx-i\">\\(N\\ll D\\)<\/span><\/h2>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(\\tfrac1NX^\\top X\\in\\mathbb{R}^{N\\times N}\\)<\/span> có cùng trị riêng khác 0 với <span class=\"mjx-i\">\\(S=\\tfrac1NXX^\\top\\)<\/span>; <span class=\"mjx-i\">\\(b_m\\propto Xc_m\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> <span class=\"mjx-i\">\\(D=3\\)<\/span>, <span class=\"mjx-i\">\\(N=2\\)<\/span> centered points <span class=\"mjx-i\">\\(x_1=(1,2,2)\\)<\/span>, <span class=\"mjx-i\">\\(x_2=(-1,-2,-2)\\)<\/span>. Find the nonzero eigenvalue of <span class=\"mjx-i\">\\(S\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\tfrac12X^\\top X=\\tfrac12\\begin{bmatrix}9&amp;-9\\\\-9&amp;9\\end{bmatrix}\\)<\/span>, trị riêng <span class=\"mjx-i\">\\(9\\)<\/span> và <span class=\"mjx-i\">\\(0\\)<\/span>. Vậy <span class=\"mjx-i\">\\(S\\)<\/span> có trị riêng khác 0 duy nhất là <span class=\"mjx-i\">\\(9\\)<\/span>, với <span class=\"mjx-i\">\\(b_1\\propto X c_1\\propto x_1-x_2=(2,4,4)\\)<\/span>, chuẩn hóa thành <span class=\"mjx-i\">\\(\\tfrac13(1,2,2)\\)<\/span>.<\/p>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 5.1<\/strong> A centered dataset has <span class=\"mjx-i\">\\(N=4\\)<\/span> points in <span class=\"mjx-i\">\\(\\mathbb{R}^{100}\\)<\/span>. At most how many eigenvalues of the <span class=\"mjx-i\">\\(100\\times100\\)<\/span> data covariance matrix can be nonzero?<\/p>\n<ul>\n<li>A. 100<\/li>\n<li>B. 4<\/li>\n<li>C. 3<\/li>\n<li>D. 96<\/li>\n<\/ul>\n<hr/>\n<h1 id=\"MAI391-10-h16\"><span class=\"pn\">Phần 4<\/span>Tổng hợp<\/h1>\n<p><div class=\"mjx-d\">\\[S=\\tfrac1NXX^\\top,\\quad Sb=\\lambda b,\\quad V_M=\\textstyle\\sum_{m\\le M}\\lambda_m,\\quad J_M=\\sum_{j&gt;M}\\lambda_j,\\quad z=B^\\top x,\\quad\\tilde x=BB^\\top x,\\quad\\lambda=\\sigma^2/N\\]<\/div><\/p>\n<p><strong>Lỗi hay gặp:<\/strong> quên trừ trung bình; chọn trị riêng nhỏ nhất; quên chuẩn hóa vector riêng; chia <span class=\"mjx-i\">\\(N-1\\)<\/span>; <span class=\"mjx-i\">\\(\\lambda=\\sigma^2\\)<\/span> (quên chia <span class=\"mjx-i\">\\(N\\)<\/span>).<\/p>\n<hr/>\n<details>\n<summary><b>Đáp án câu luyện tập (bấm để mở)<\/b><\/summary>\n<ul>\n<li>1.1: <span class=\"mjx-i\">\\(\\bar x=(2,2)\\)<\/span>, <span class=\"mjx-i\">\\(x_2-\\bar x=(-2,1)\\)<\/span> → A. 1.2: chiều 1 sau khi trừ: <span class=\"mjx-i\">\\(0,-2,2\\)<\/span>, nên <span class=\"mjx-i\">\\(s_{11}=\\tfrac83\\)<\/span> → B.<\/li>\n<li>2.1: trị riêng <span class=\"mjx-i\">\\(4\\)<\/span> (vector <span class=\"mjx-i\">\\((1,1)\\)<\/span>) và <span class=\"mjx-i\">\\(2\\)<\/span> → (i). 2.2: <span class=\"mjx-i\">\\(\\tfrac{9}{10}=0{,}9\\)<\/span> → B.<\/li>\n<li>3.1: <span class=\"mjx-i\">\\(z=\\tfrac{4}{\\sqrt2}\\)<\/span>, <span class=\"mjx-i\">\\(\\tilde x=\\tfrac{4}{\\sqrt2}\\cdot\\tfrac1{\\sqrt2}(1,1)=(2,2)\\)<\/span> → A. 3.2: <span class=\"mjx-i\">\\(0{,}5+0{,}5=1\\)<\/span> → B.<\/li>\n<li>4.1: <span class=\"mjx-i\">\\(\\tfrac{25}{5}=5\\)<\/span> → B. 4.2: <span class=\"mjx-i\">\\(Sx_0\\propto(2,1)\\)<\/span> → A.<\/li>\n<li>5.1: dữ liệu đã trừ trung bình có hạng tối đa <span class=\"mjx-i\">\\(N-1=3\\)<\/span> → C.<\/li>\n<\/ul>\n<\/details>\n", "q": 0}, {"num": "12", "short": "Phân lớp với SVM", "sub": "Mathematics for Machine Learning – mục 12.1 – 12.5", "toc": [["h1", "PHẦN 1. GHI CHÉP BÀI HỌC", "MAI391-12-h1"], ["h2", "1.1. Siêu phẳng phân tách — mục 12.1", "MAI391-12-h2"], ["h2", "1.2. SVM gốc (primal) — mục 12.2", "MAI391-12-h3"], ["h2", "1.3. SVM đối ngẫu (dual) — mục 12.3", "MAI391-12-h4"], ["h2", "1.4. Kernel — mục 12.4", "MAI391-12-h5"], ["h2", "1.5. Giải số — mục 12.5", "MAI391-12-h6"], ["h1", "PHẦN 2. CÁC DẠNG BÀI CÓ THỂ RA", "MAI391-12-h7"], ["h2", "Chuẩn bị: Casio fx-580VN X cho Chương 12", "MAI391-12-h8"], ["h1", "PHẦN 3. CÁC DẠNG BÀI", "MAI391-12-h9"], ["h2", "Dạng 1: Siêu phẳng, phân loại, khoảng cách", "MAI391-12-h10"], ["h2", "Dạng 2: Lề & hard margin", "MAI391-12-h11"], ["h2", "Dạng 3: Soft margin & hinge loss", "MAI391-12-h12"], ["h2", "Dạng 4: Đối ngẫu & kernel", "MAI391-12-h13"], ["h2", "Dạng 5: Subgradient", "MAI391-12-h14"], ["h1", "PHẦN 4. TỔNG HỢP", "MAI391-12-h15"]], "html": "<blockquote>\n<p>⚠️ <strong>Lưu ý quan trọng:<\/strong> trong 10 đề MAI391 đã có <strong>không có câu nào<\/strong> thuộc Chương 12. Phần cuối mỗi dạng là <strong>câu luyện tập tự soạn<\/strong> theo văn phong đề MAI391 (không phải đề thật), có đáp án ở cuối file. Chương này dùng lại kiến thức Chương 3 (tích trong, khoảng cách) và Chương 7 (Lagrange, đối ngẫu, subgradient).<\/p>\n<\/blockquote>\n<hr/>\n<h1 id=\"MAI391-12-h1\"><span class=\"pn\">Phần 1<\/span>Ghi chép bài học<\/h1>\n<h2 id=\"MAI391-12-h2\">1.1. Siêu phẳng phân tách — mục 12.1<\/h2>\n<ul>\n<li>Dữ liệu <span class=\"mjx-i\">\\((x_n,y_n)\\)<\/span>, <span class=\"mjx-i\">\\(x_n\\in\\mathbb{R}^D\\)<\/span>, nhãn <span class=\"mjx-i\">\\(y_n\\in\\{+1,-1\\}\\)<\/span>.<\/li>\n<li><strong>Siêu phẳng:<\/strong> <span class=\"mjx-i\">\\(\\{x:\\langle w,x\\rangle+b=0\\}\\)<\/span>; <span class=\"mjx-i\">\\(w\\)<\/span> là vector pháp tuyến, <span class=\"mjx-i\">\\(b\\)<\/span> là độ lệch.<\/li>\n<li><strong>Bộ phân loại:<\/strong> <span class=\"mjx-i\">\\(f(x)=\\langle w,x\\rangle+b\\)<\/span>; dự đoán <span class=\"mjx-i\">\\(\\hat y=\\mathrm{sign}(f(x))\\)<\/span>.<\/li>\n<li>Phân loại đúng <span class=\"mjx-i\">\\(\\iff y_n(\\langle w,x_n\\rangle+b)\\ge0\\)<\/span>.<\/li>\n<li><strong>Khoảng cách<\/strong> từ <span class=\"mjx-i\">\\(x\\)<\/span> đến siêu phẳng: <span class=\"mjx-i\">\\(\\dfrac{|\\langle w,x\\rangle+b|}{\\lVert w\\rVert}\\)<\/span>.<\/li>\n<\/ul>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> có hai nhóm điểm, muốn kẻ một \"con đường\" thẳng ngăn cách chúng. SVM chọn con đường <strong>rộng nhất<\/strong>; hai mép đường chạm vào vài điểm gần nhất, đó là các <strong>vector hỗ trợ<\/strong>.<\/p>\n<\/blockquote>\n<hr/>\n<h2 id=\"MAI391-12-h3\">1.2. SVM gốc (primal) — mục 12.2<\/h2>\n<ul>\n<li><strong>Lề (margin)<\/strong>: khoảng cách từ siêu phẳng đến điểm gần nhất.<\/li>\n<li>Chuẩn hóa sao cho điểm gần nhất thỏa <span class=\"mjx-i\">\\(y_n(\\langle w,x_n\\rangle+b)=1\\)<\/span>; khi đó lề là <span class=\"mjx-i\">\\(r=\\dfrac1{\\lVert w\\rVert}\\)<\/span> (độ rộng cả \"con đường\" là <span class=\"mjx-i\">\\(\\tfrac2{\\lVert w\\rVert}\\)<\/span>).<\/li>\n<li><strong>Hard margin SVM:<\/strong>\n<div class=\"mjx-d\">\\[\\min_{w,b}\\ \\tfrac12\\lVert w\\rVert^2\\quad\\text{s.t.}\\quad y_n(\\langle w,x_n\\rangle+b)\\ge1\\ \\ \\forall n.\\]<\/div><\/li>\n<\/ul>\n<blockquote>\n<p><em>(Slide viết thiếu ngoặc \"<span class=\"mjx-i\">\\(y_n\\langle w,x_n\\rangle+b\\ge1\\)<\/span>\"; đúng là <span class=\"mjx-i\">\\(y_n(\\langle w,x_n\\rangle+b)\\ge1\\)<\/span>.)<\/em><\/p>\n<\/blockquote>\n<ul>\n<li><strong>Soft margin SVM<\/strong> (dữ liệu không tách được), biến lỏng <span class=\"mjx-i\">\\(\\xi_n\\ge0\\)<\/span>:\n<div class=\"mjx-d\">\\[\\min_{w,b,\\xi}\\ \\tfrac12\\lVert w\\rVert^2+C\\sum_n\\xi_n\\quad\\text{s.t.}\\quad y_n(\\langle w,x_n\\rangle+b)\\ge1-\\xi_n,\\ \\ \\xi_n\\ge0.\\]<\/div>\n<span class=\"mjx-i\">\\(C&gt;0\\)<\/span> lớn thì phạt lỗi nặng (lề hẹp); <span class=\"mjx-i\">\\(C\\)<\/span> nhỏ thì cho phép nhiều lỗi (lề rộng).<\/li>\n<li><strong>Góc nhìn hàm mất mát (hinge loss):<\/strong> với <span class=\"mjx-i\">\\(t=y\\,f(x)\\)<\/span>,\n<div class=\"mjx-d\">\\[\\ell(t)=\\max\\{0,\\ 1-t\\},\\qquad\\min_{w,b}\\ \\tfrac12\\lVert w\\rVert^2+C\\sum_n\\max\\{0,\\ 1-y_n(\\langle w,x_n\\rangle+b)\\}.\\]<\/div>\nỞ nghiệm tối ưu, <span class=\"mjx-i\">\\(\\xi_n=\\max\\{0,1-t_n\\}\\)<\/span>.<\/li>\n<\/ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Giá trị <span class=\"mjx-i\">\\(t_n=y_nf(x_n)\\)<\/span><\/th>\n<th>Vị trí điểm<\/th>\n<th><span class=\"mjx-i\">\\(\\xi_n\\)<\/span> = hinge loss<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"mjx-i\">\\(t_n&gt;1\\)<\/span><\/td>\n<td>đúng phía, ngoài lề<\/td>\n<td><span class=\"mjx-i\">\\(0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(t_n=1\\)<\/span><\/td>\n<td>nằm đúng trên mép lề (vector hỗ trợ)<\/td>\n<td><span class=\"mjx-i\">\\(0\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(0&lt;t_n&lt;1\\)<\/span><\/td>\n<td>đúng phía nhưng <strong>trong lề<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(1-t_n\\in(0,1)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(t_n&lt;0\\)<\/span><\/td>\n<td><strong>sai phía<\/strong> (phân loại sai)<\/td>\n<td><span class=\"mjx-i\">\\(&gt;1\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h2 id=\"MAI391-12-h4\">1.3. SVM đối ngẫu (dual) — mục 12.3<\/h2>\n<ul>\n<li>Lagrange với <span class=\"mjx-i\">\\(\\alpha_n\\ge0\\)<\/span> (cho ràng buộc lề) và <span class=\"mjx-i\">\\(\\gamma_n\\ge0\\)<\/span> (cho <span class=\"mjx-i\">\\(\\xi_n\\ge0\\)<\/span>). Đạo hàm bằng 0 cho:\n<div class=\"mjx-d\">\\[\\boxed{w=\\sum_n\\alpha_ny_nx_n,\\qquad\\sum_n\\alpha_ny_n=0,\\qquad0\\le\\alpha_n\\le C}\\]<\/div><\/li>\n<li><strong>Dual SVM:<\/strong>\n<div class=\"mjx-d\">\\[\\min_\\alpha\\ \\tfrac12\\sum_i\\sum_j y_iy_j\\alpha_i\\alpha_j\\langle x_i,x_j\\rangle-\\sum_i\\alpha_i\\quad\\text{s.t.}\\quad\\sum_iy_i\\alpha_i=0,\\ 0\\le\\alpha_i\\le C.\\]<\/div><\/li>\n<li>Điểm có <span class=\"mjx-i\">\\(\\alpha_n&gt;0\\)<\/span> là <strong>vector hỗ trợ<\/strong>; chỉ chúng quyết định <span class=\"mjx-i\">\\(w\\)<\/span>.<\/li>\n<li>Tính <span class=\"mjx-i\">\\(b\\)<\/span>: lấy vector hỗ trợ <span class=\"mjx-i\">\\(x_s\\)<\/span> với <span class=\"mjx-i\">\\(0&lt;\\alpha_s&lt;C\\)<\/span>: <span class=\"mjx-i\">\\(y_s(\\langle w,x_s\\rangle+b)=1\\)<\/span>, nên <span class=\"mjx-i\">\\(b=y_s-\\langle w,x_s\\rangle\\)<\/span>.<\/li>\n<li><strong>Góc nhìn bao lồi:<\/strong> <span class=\"mjx-i\">\\(w=c-d\\)<\/span>, với <span class=\"mjx-i\">\\(c\\)<\/span>, <span class=\"mjx-i\">\\(d\\)<\/span> là hai điểm gần nhau nhất của bao lồi hai lớp.<\/li>\n<\/ul>\n<h2 id=\"MAI391-12-h5\">1.4. Kernel — mục 12.4<\/h2>\n<ul>\n<li>Dual chỉ dùng tích trong <span class=\"mjx-i\">\\(\\langle x_i,x_j\\rangle\\)<\/span>. Thay bằng <strong>kernel<\/strong> <span class=\"mjx-i\">\\(k(x_i,x_j)=\\langle\\phi(x_i),\\phi(x_j)\\rangle\\)<\/span> để có ranh giới phi tuyến mà không cần tính <span class=\"mjx-i\">\\(\\phi\\)<\/span>.<\/li>\n<li><strong>Ma trận Gram<\/strong> <span class=\"mjx-i\">\\(K=[k(x_i,x_j)]\\)<\/span> đối xứng, nửa xác định dương.<\/li>\n<li>Kernel hay gặp: tuyến tính <span class=\"mjx-i\">\\(x^\\top y\\)<\/span>; đa thức <span class=\"mjx-i\">\\((1+x^\\top y)^p\\)<\/span>; Gauss (RBF) <span class=\"mjx-i\">\\(\\exp\\big(-\\tfrac{\\lVert x-y\\rVert^2}{2\\sigma^2}\\big)\\)<\/span>.<\/li>\n<\/ul>\n<h2 id=\"MAI391-12-h6\">1.5. Giải số — mục 12.5<\/h2>\n<ul>\n<li>Hinge loss không khả vi tại <span class=\"mjx-i\">\\(t=1\\)<\/span>; dùng <strong>subgradient<\/strong>:\n<div class=\"mjx-d\">\\[g(t)=\\begin{cases}-1&amp;t&lt;1\\\\[-1,0]&amp;t=1\\\\0&amp;t&gt;1\\end{cases}\\]<\/div><\/li>\n<li>Theo <span class=\"mjx-i\">\\(w\\)<\/span>: số hạng <span class=\"mjx-i\">\\(C\\max\\{0,1-y(w^\\top x+b)\\}\\)<\/span> có subgradient <span class=\"mjx-i\">\\(-Cyx\\)<\/span> nếu <span class=\"mjx-i\">\\(t&lt;1\\)<\/span>, và <span class=\"mjx-i\">\\(0\\)<\/span> nếu <span class=\"mjx-i\">\\(t&gt;1\\)<\/span>.<\/li>\n<li>SVM primal và dual đều viết được dưới dạng <strong>quy hoạch toàn phương<\/strong> (Chương 7).<\/li>\n<\/ul>\n<blockquote>\n<p><em>(Slide in \"<span class=\"mjx-i\">\\(\\xi_n\\le0\\)<\/span>\" trong dạng chuẩn; đúng là <span class=\"mjx-i\">\\(-\\xi_n\\le0\\)<\/span>.)<\/em><\/p>\n<\/blockquote>\n<hr/>\n<h1 id=\"MAI391-12-h7\"><span class=\"pn\">Phần 2<\/span>Các dạng bài có thể ra<\/h1>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dạng<\/th>\n<th>Nội dung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Siêu phẳng, phân loại, khoảng cách<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(\\mathrm{sign}(f(x))\\)<\/span>; khoảng cách điểm đến siêu phẳng<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Lề &amp; hard margin<\/strong><\/td>\n<td>Độ lớn lề <span class=\"mjx-i\">\\(1/\\lVert w\\rVert\\)<\/span>; kiểm tra ràng buộc; nhận diện vector hỗ trợ<\/td>\n<\/tr>\n<tr>\n<td><strong>3. Soft margin &amp; hinge loss<\/strong><\/td>\n<td>Tính <span class=\"mjx-i\">\\(\\xi_n\\)<\/span>, hinge loss, giá trị hàm mục tiêu<\/td>\n<\/tr>\n<tr>\n<td><strong>4. Đối ngẫu &amp; kernel<\/strong><\/td>\n<td><span class=\"mjx-i\">\\(w=\\sum\\alpha_ny_nx_n\\)<\/span>; <span class=\"mjx-i\">\\(\\sum\\alpha_ny_n=0\\)<\/span>; tính <span class=\"mjx-i\">\\(b\\)<\/span>; ma trận Gram<\/td>\n<\/tr>\n<tr>\n<td><strong>5. Subgradient<\/strong><\/td>\n<td>Subgradient của hinge loss; một bước subgradient descent<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h2 id=\"MAI391-12-h8\">Chuẩn bị: Casio fx-580VN X cho Chương 12<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Việc cần làm<\/th>\n<th>Thao tác<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"mjx-i\">\\(\\langle w,x\\rangle+b\\)<\/span> cho nhiều điểm<\/td>\n<td>Calculate: gõ <code>w₁X+w₂Y+b<\/code>, dùng <code>CALC<\/code> cho từng điểm<\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(\\lVert w\\rVert\\)<\/span>, tích vô hướng<\/td>\n<td>Vector mode: <code>Abs(VctA)<\/code>, <code>VctA•VctB<\/code><\/td>\n<\/tr>\n<tr>\n<td>Ma trận Gram <span class=\"mjx-i\">\\(XX^\\top\\)<\/span><\/td>\n<td>Matrix: <code>MatA×Trn(MatA)<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-12-h9\"><span class=\"pn\">Phần 3<\/span>Các dạng bài<\/h1>\n<h2 id=\"MAI391-12-h10\">Dạng 1: Siêu phẳng, phân loại, khoảng cách<\/h2>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> Hyperplane <span class=\"mjx-i\">\\(\\langle w,x\\rangle+b=0\\)<\/span> with <span class=\"mjx-i\">\\(w=(2,-1)\\)<\/span>, <span class=\"mjx-i\">\\(b=-1\\)<\/span>. Classify <span class=\"mjx-i\">\\(x=(2,1)\\)<\/span> and find its distance to the hyperplane.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f(x)=4-1-1=2&gt;0\\)<\/span>, nên <span class=\"mjx-i\">\\(\\hat y=+1\\)<\/span>. Khoảng cách <span class=\"mjx-i\">\\(=\\tfrac{|2|}{\\sqrt5}=\\tfrac{2}{\\sqrt5}\\approx0{,}894\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Quên chia <span class=\"mjx-i\">\\(\\lVert w\\rVert\\)<\/span>; quên trị tuyệt đối.<\/li>\n<li>Quên cộng <span class=\"mjx-i\">\\(b\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li>Dấu của <span class=\"mjx-i\">\\(f(x)\\)<\/span> cho lớp; độ lớn chia <span class=\"mjx-i\">\\(\\lVert w\\rVert\\)<\/span> cho khoảng cách.<\/li>\n<li>Nhân <span class=\"mjx-i\">\\(w,b\\)<\/span> với cùng một số dương <strong>không đổi<\/strong> siêu phẳng và khoảng cách.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 1.1<\/strong> Consider the hyperplane <span class=\"mjx-i\">\\(\\{x\\in\\mathbb{R}^2: \\langle w,x\\rangle+b=0\\}\\)<\/span> with <span class=\"mjx-i\">\\(w=[1\\ -2]^T\\)<\/span>, <span class=\"mjx-i\">\\(b=1\\)<\/span>. Which points are classified as <span class=\"mjx-i\">\\(+1\\)<\/span>? <span class=\"mjx-i\">\\(P=[3\\ 1]^T\\)<\/span>, <span class=\"mjx-i\">\\(Q=[0\\ 2]^T\\)<\/span>.<\/p>\n<ul>\n<li>A. Only P<\/li>\n<li>B. Only Q<\/li>\n<li>C. Both P and Q<\/li>\n<li>D. Neither P nor Q<\/li>\n<\/ul>\n<p><strong>Câu 1.2<\/strong> With the hyperplane of Câu 1.1, the distance from <span class=\"mjx-i\">\\(Q=[0\\ 2]^T\\)<\/span> to the hyperplane is<\/p>\n<ul>\n<li>A. 3<\/li>\n<li>B. <span class=\"mjx-i\">\\(3/\\sqrt5\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(\\sqrt5\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(1/\\sqrt5\\)<\/span><\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-12-h11\">Dạng 2: Lề &amp; hard margin<\/h2>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> A hard-margin SVM gives <span class=\"mjx-i\">\\(w=(1,-2)\\)<\/span> and <span class=\"mjx-i\">\\(b=1\\)<\/span> (canonical form). Find the margin <span class=\"mjx-i\">\\(r\\)<\/span> and the width of the margin band.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(r=\\tfrac1{\\lVert w\\rVert}=\\tfrac1{\\sqrt5}\\)<\/span>; độ rộng cả dải (hai phía) <span class=\"mjx-i\">\\(=\\tfrac2{\\sqrt5}\\)<\/span>.<\/p>\n<p><strong>Ví dụ 2 (vector hỗ trợ).<\/strong> With the same <span class=\"mjx-i\">\\(w,b\\)<\/span>, which training examples are support vectors: <span class=\"mjx-i\">\\(((0,1),-1)\\)<\/span>, <span class=\"mjx-i\">\\(((3,0),+1)\\)<\/span>, <span class=\"mjx-i\">\\(((1,0),+1)\\)<\/span>?<\/p>\n<p><strong>Giải:<\/strong> Tính <span class=\"mjx-i\">\\(t=y\\,f(x)\\)<\/span> với <span class=\"mjx-i\">\\(f=x_1-2x_2+1\\)<\/span>:<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(((0,1),-1)\\)<\/span>: <span class=\"mjx-i\">\\(f=-1\\)<\/span>, <span class=\"mjx-i\">\\(t=1\\)<\/span>, nên <strong>là<\/strong> vector hỗ trợ.<\/li>\n<li><span class=\"mjx-i\">\\(((3,0),+1)\\)<\/span>: <span class=\"mjx-i\">\\(f=4\\)<\/span>, <span class=\"mjx-i\">\\(t=4&gt;1\\)<\/span>, nằm ngoài lề.<\/li>\n<li><span class=\"mjx-i\">\\(((1,0),+1)\\)<\/span>: <span class=\"mjx-i\">\\(f=2\\)<\/span>, <span class=\"mjx-i\">\\(t=2&gt;1\\)<\/span>, nằm ngoài lề.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li>Vector hỗ trợ <span class=\"mjx-i\">\\(\\iff y_nf(x_n)=1\\)<\/span> (hard margin).<\/li>\n<li><span class=\"mjx-i\">\\(\\min\\tfrac12\\lVert w\\rVert^2\\)<\/span> tương đương <span class=\"mjx-i\">\\(\\max\\)<\/span> lề <span class=\"mjx-i\">\\(\\tfrac1{\\lVert w\\rVert}\\)<\/span>.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 2.1<\/strong> A hard margin SVM has the solution <span class=\"mjx-i\">\\(w=[3\\ \\ 4]^T\\)<\/span> (canonical form). The margin (distance from the hyperplane to the closest example) is<\/p>\n<ul>\n<li>A. 0.2<\/li>\n<li>B. 0.4<\/li>\n<li>C. 5<\/li>\n<li>D. 0.1<\/li>\n<\/ul>\n<p><strong>Câu 2.2<\/strong> Which problem is the hard margin SVM?<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\min_{w,b}\\frac12\\|w\\|^2\\)<\/span> subject to <span class=\"mjx-i\">\\(y_n(\\langle w,x_n\\rangle+b)\\ge1\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\max_{w,b}\\frac12\\|w\\|^2\\)<\/span> subject to <span class=\"mjx-i\">\\(y_n(\\langle w,x_n\\rangle+b)\\ge1\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\min_{w,b}\\frac12\\|w\\|^2\\)<\/span> subject to <span class=\"mjx-i\">\\(y_n(\\langle w,x_n\\rangle+b)\\le1\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\min_{w,b}\\|w\\|\\)<\/span> subject to <span class=\"mjx-i\">\\(\\langle w,x_n\\rangle+b\\ge1\\)<\/span><\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-12-h12\">Dạng 3: Soft margin &amp; hinge loss<\/h2>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> <span class=\"mjx-i\">\\(w=(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(b=-3\\)<\/span>, <span class=\"mjx-i\">\\(C=2\\)<\/span>. Data: <span class=\"mjx-i\">\\(((2,2),+1)\\)<\/span>, <span class=\"mjx-i\">\\(((1,1),-1)\\)<\/span>, <span class=\"mjx-i\">\\(((2,1),+1)\\)<\/span>, <span class=\"mjx-i\">\\(((0,1),-1)\\)<\/span>. Compute each <span class=\"mjx-i\">\\(\\xi_n\\)<\/span> and the soft margin objective.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(t_n=y_n(x_{n1}+x_{n2}-3)\\)<\/span>: <span class=\"mjx-i\">\\(1;\\ 1;\\ 0;\\ 2\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\xi_n=\\max(0,1-t_n)\\)<\/span>: <span class=\"mjx-i\">\\(0;\\ 0;\\ 1;\\ 0\\)<\/span>. (Điểm <span class=\"mjx-i\">\\((2,1)\\)<\/span> nằm đúng trên siêu phẳng.)<\/li>\n<li>Mục tiêu: <span class=\"mjx-i\">\\(\\tfrac12\\lVert w\\rVert^2+C\\sum\\xi_n=\\tfrac12\\cdot2+2\\cdot1=3\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li>Tính <span class=\"mjx-i\">\\(t_n\\)<\/span> cho từng điểm trước; điểm có <span class=\"mjx-i\">\\(t_n\\ge1\\)<\/span> thì loss bằng 0, bỏ qua.<\/li>\n<li>Phân loại sai (<span class=\"mjx-i\">\\(t_n&lt;0\\)<\/span>) luôn cho loss <span class=\"mjx-i\">\\(&gt;1\\)<\/span>.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 3.1<\/strong> The values <span class=\"mjx-i\">\\(t_n=y_n(\\langle w,x_n\\rangle+b)\\)<\/span> of four training examples are <span class=\"mjx-i\">\\(2,\\ 1,\\ 0.5,\\ -0.3\\)<\/span>. The total hinge loss <span class=\"mjx-i\">\\(\\sum_n\\max\\{0,1-t_n\\}\\)<\/span> is<\/p>\n<ul>\n<li>A. 1.8<\/li>\n<li>B. 0.5<\/li>\n<li>C. 3.2<\/li>\n<li>D. 1.3<\/li>\n<\/ul>\n<p><strong>Câu 3.2<\/strong> In the soft margin SVM, an example with slack variable <span class=\"mjx-i\">\\(\\xi_n=0.4\\)<\/span> is<\/p>\n<ul>\n<li>A. correctly classified and outside the margin<\/li>\n<li>B. correctly classified but inside the margin<\/li>\n<li>C. misclassified<\/li>\n<li>D. a point exactly on the hyperplane<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-12-h13\">Dạng 4: Đối ngẫu &amp; kernel<\/h2>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> Two points <span class=\"mjx-i\">\\(x_1=(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(y_1=+1\\)<\/span>; <span class=\"mjx-i\">\\(x_2=(-1,-1)\\)<\/span>, <span class=\"mjx-i\">\\(y_2=-1\\)<\/span>. The dual solution is <span class=\"mjx-i\">\\(\\alpha_1=\\alpha_2=\\tfrac14\\)<\/span>. Find <span class=\"mjx-i\">\\(w\\)<\/span>, <span class=\"mjx-i\">\\(b\\)<\/span> and the margin.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Kiểm tra <span class=\"mjx-i\">\\(\\sum\\alpha_ny_n=\\tfrac14-\\tfrac14=0\\)<\/span> ✓.<\/li>\n<li><span class=\"mjx-i\">\\(w=\\tfrac14(1,1)-\\tfrac14(-1,-1)=(\\tfrac12,\\tfrac12)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(b=y_1-\\langle w,x_1\\rangle=1-1=0\\)<\/span>.<\/li>\n<li>Lề <span class=\"mjx-i\">\\(=\\tfrac1{\\lVert w\\rVert}=\\sqrt2\\)<\/span> (đúng bằng nửa khoảng cách giữa hai điểm, <span class=\"mjx-i\">\\(\\tfrac{2\\sqrt2}{2}\\)<\/span>).<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (ma trận Gram).<\/strong> <span class=\"mjx-i\">\\(x_1=(1,0)\\)<\/span>, <span class=\"mjx-i\">\\(x_2=(0,1)\\)<\/span>, <span class=\"mjx-i\">\\(x_3=(1,1)\\)<\/span>. Linear kernel: <span class=\"mjx-i\">\\(K=\\begin{bmatrix}1&amp;0&amp;1\\\\0&amp;1&amp;1\\\\1&amp;1&amp;2\\end{bmatrix}\\)<\/span>. Polynomial kernel <span class=\"mjx-i\">\\((1+x^\\top y)^2\\)<\/span>: <span class=\"mjx-i\">\\(K=\\begin{bmatrix}4&amp;1&amp;4\\\\1&amp;4&amp;4\\\\4&amp;4&amp;9\\end{bmatrix}\\)<\/span>.<\/p>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li>Đáp án <span class=\"mjx-i\">\\(\\alpha\\)<\/span> phải thỏa <span class=\"mjx-i\">\\(\\sum\\alpha_ny_n=0\\)<\/span> và <span class=\"mjx-i\">\\(0\\le\\alpha_n\\le C\\)<\/span>: loại nhanh.<\/li>\n<li>Ma trận Gram phải đối xứng, đường chéo không âm.<\/li>\n<\/ul>\n<\/div><h3>Câu luyện tập (tự soạn)<\/h3>\n<p><strong>Câu 4.1<\/strong> In the dual SVM with training data <span class=\"mjx-i\">\\(x_1=[2\\ \\ 0]^T\\)<\/span> (<span class=\"mjx-i\">\\(y_1=+1\\)<\/span>), <span class=\"mjx-i\">\\(x_2=[0\\ \\ 0]^T\\)<\/span> (<span class=\"mjx-i\">\\(y_2=-1\\)<\/span>), the optimal multipliers are <span class=\"mjx-i\">\\(\\alpha_1=\\alpha_2=\\frac12\\)<\/span>. The weight vector <span class=\"mjx-i\">\\(w\\)<\/span> is<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\([1\\ \\ 0]^T\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\([2\\ \\ 0]^T\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\([\\frac12\\ \\ 0]^T\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\([0\\ \\ 1]^T\\)<\/span><\/li>\n<\/ul>\n<p><strong>Câu 4.2<\/strong> Which of the following constraints appear in the dual soft margin SVM?<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\sum_n\\alpha_ny_n=0\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(0\\le\\alpha_n\\le C\\)<\/span><\/li>\n<li>A. Only (i)<\/li>\n<li>B. Only (ii)<\/li>\n<li>C. Both (i) and (ii)<\/li>\n<li>D. Neither (i) nor (ii)<\/li>\n<\/ul>\n<p><strong>Câu 4.3<\/strong> For <span class=\"mjx-i\">\\(x_1=[1\\ \\ 2]^T\\)<\/span>, <span class=\"mjx-i\">\\(x_2=[0\\ \\ 1]^T\\)<\/span>, the value of the polynomial kernel <span class=\"mjx-i\">\\(k(x_1,x_2)=(1+x_1^Tx_2)^2\\)<\/span> is<\/p>\n<ul>\n<li>A. 4<\/li>\n<li>B. 9<\/li>\n<li>C. 3<\/li>\n<li>D. 2<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-12-h14\">Dạng 5: Subgradient<\/h2>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> Objective for one example: <span class=\"mjx-i\">\\(J(w)=\\tfrac12\\lVert w\\rVert^2+C\\max\\{0,1-y\\,w^\\top x\\}\\)<\/span> (no bias), <span class=\"mjx-i\">\\(C=1\\)<\/span>, <span class=\"mjx-i\">\\(x=(1,2)\\)<\/span>, <span class=\"mjx-i\">\\(y=+1\\)<\/span>, current <span class=\"mjx-i\">\\(w=(0,0)\\)<\/span>, step <span class=\"mjx-i\">\\(\\gamma=0{,}1\\)<\/span>. Do one subgradient step.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(t=y\\,w^\\top x=0&lt;1\\)<\/span>, nên subgradient của số hạng hinge là <span class=\"mjx-i\">\\(-Cyx=(-1,-2)\\)<\/span>; của <span class=\"mjx-i\">\\(\\tfrac12\\lVert w\\rVert^2\\)<\/span> là <span class=\"mjx-i\">\\(w=(0,0)\\)<\/span>. Tổng <span class=\"mjx-i\">\\(g=(-1,-2)\\)<\/span>. <span class=\"mjx-i\">\\(w_{\\text{mới}}=w-\\gamma g=(0{,}1;\\ 0{,}2)\\)<\/span>.<\/p>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh<\/h3>\n<ul>\n<li><span class=\"
