<title>Sổ ôn MAI391</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: phiếu tô trắc nghiệm + giấy kẻ ô. Thanh trên gọn; cột trái là "phiếu" chương với bong bóng tiến độ; cột đọc là tờ giấy kẻ ô; câu đề thật xếp trong ngăn gập, đáp án A–E hiện như ô tô. */
:root{
  --bg:#eef0f5; --paper:#fbfbfd; --sunk:#e4e7ef; --ink:#151a2b; --muted:#5b627a; --rule:#d2d6e2; --grid:rgba(43,59,191,.055);
  --pen:#2b3bbf; --pen-soft:#e5e8fb; --red:#c2332b; --red-soft:#fbe9e7; --hl:#ffe14d; --hl-soft:#fff6c4; --ok:#1f7a4a; --ok-soft:#e1f2e8;
  --shadow:0 1px 0 rgba(21,26,43,.04),0 8px 24px -12px rgba(21,26,43,.18);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --st-ok:#14a06a; --st-bad:#e5334f; --st-rev:#f2b51d; --st-rev-ink:#a87300;
  --hdr:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f121b; --paper:#161a26; --sunk:#1e2333; --ink:#e7e9f2; --muted:#9aa1b8; --rule:#2a3045; --grid:rgba(150,165,255,.05);
  --pen:#9eaaff; --pen-soft:#232a4a; --red:#ff8d84; --red-soft:#3b2022; --hl:#f0cf3a; --hl-soft:#33301a; --ok:#79d6a2; --ok-soft:#163021;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); --st-ok:#1fb87a; --st-bad:#f0425e; --st-rev:#f5c033; --st-rev-ink:#f5c033; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121b; --paper:#161a26; --sunk:#1e2333; --ink:#e7e9f2; --muted:#9aa1b8; --rule:#2a3045; --grid:rgba(150,165,255,.05);
  --pen:#9eaaff; --pen-soft:#232a4a; --red:#ff8d84; --red-soft:#3b2022; --hl:#f0cf3a; --hl-soft:#33301a; --ok:#79d6a2; --ok-soft:#163021;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6); --st-ok:#1fb87a; --st-bad:#f0425e; --st-rev:#f5c033; --st-rev-ink:#f5c033; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--hdr) + 20px)}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
a{color:var(--pen)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:6px}

/* ───── thanh trên ───── */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hdr-in{max-width:1360px;margin:0 auto;min-height:var(--hdr);display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap;padding-block:9px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.brand .mk{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:800 .8rem var(--f-display);position:relative}
.brand .mk::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--pen);opacity:.9}
.brand b{font:800 1.15rem/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font:500 .7rem/1.2 var(--f-body);color:var(--muted);letter-spacing:.04em;margin-top:3px}
.seg{display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .82rem var(--f-mono);letter-spacing:.02em;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--pen);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.search{flex:1 1 240px;position:relative;min-width:0;max-width:460px;margin-left:auto}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:.9rem;padding:8px 44px 8px 34px;border-radius:10px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.search input:focus{border-color:var(--pen);outline:none;box-shadow:0 0 0 3px var(--pen-soft)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:500 .7rem var(--f-mono);color:var(--muted);border:1px solid var(--rule);border-radius:5px;padding:1px 6px;background:var(--paper)}
.results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--paper);border:1px solid var(--rule);border-radius:12px;
  box-shadow:var(--shadow);max-height:min(70vh,560px);overflow:auto;padding:6px}
.results button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:.87rem;line-height:1.45}
.results button:hover,.results button:focus-visible{background:var(--pen-soft)}
.results .meta{font:500 .7rem var(--f-mono);color:var(--pen);letter-spacing:.03em;margin-bottom:2px}
.results .none{padding:12px;color:var(--muted);font-size:.88rem}
.navbtn,.iconbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font:600 .84rem var(--f-body);padding:6px 11px;border-radius:9px;cursor:pointer}
.navbtn{display:none}
.iconbtn svg,.navbtn svg{width:16px;height:16px}
.iconbtn:hover,.navbtn:hover{border-color:var(--pen);color:var(--pen)}
.readbar{position:absolute;left:0;bottom:-1px;height:2px;background:var(--pen);width:0;transition:width .1s linear}

/* ───── khung ───── */
.wrap{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:280px minmax(0,1fr) 220px;gap:36px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 96px}
.rail,.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 20px);align-self:start;max-height:calc(100vh - var(--hdr) - 44px);overflow:auto;scrollbar-width:thin}
.lbl{font:600 .68rem var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 10px}

/* phiếu chương: bong bóng tô */
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 10px 10px}
.sheet .lbl{padding:0 8px}
.chlist{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.chlist button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;text-align:left;border:0;background:transparent;color:var(--ink);
  padding:7px 8px;border-radius:9px;cursor:pointer;font:inherit;font-size:.88rem;line-height:1.3}
.chlist button:hover{background:var(--sunk)}
.chlist button[aria-current="true"]{background:var(--pen-soft)}
.chlist button[aria-current="true"] .t{font-weight:600}
.bub{--p:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:conic-gradient(var(--pen) calc(var(--p)*1%),var(--rule) 0)}
.bub::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--paper)}
.chlist button:hover .bub::before{background:var(--sunk)}
.chlist button[aria-current="true"] .bub::before{background:var(--pen-soft)}
.bub i{position:relative;font:700 .82rem var(--f-display);font-style:normal;font-variant-numeric:tabular-nums}
.bub.full{background:var(--ok)}
.bub.full::before{background:var(--ok)!important}
.bub.full i{color:var(--paper)}
.chlist .t{display:block;min-width:0}
.chlist .pg{display:block;font:500 .7rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.chlist .pg.full{color:var(--ok)}
.chlist li.sep{border-top:1px dashed var(--rule);margin:6px 8px}
.bub.warn{background:var(--red)}
.bub.warn i{color:var(--red)}
.total{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 8px 2px;padding-top:10px;border-top:1px solid var(--rule);font-size:.78rem;color:var(--muted)}
.total b{font:700 .95rem var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.reset{border:0;background:none;color:var(--muted);font:500 .74rem var(--f-body);text-decoration:underline;cursor:pointer;padding:0}
.reset.arm{color:var(--red)}

/* mục lục bên phải */
.toc{list-style:none;margin:0;padding:0;border-left:2px solid var(--rule)}
.toc a{display:block;text-decoration:none;color:var(--muted);font-size:.8rem;padding:4px 0 4px 12px;line-height:1.35;margin-left:-2px;border-left:2px solid transparent}
.toc a:hover{color:var(--ink)}
.toc a.on{color:var(--pen);border-left-color:var(--pen)}
.toc .l1{color:var(--ink);font-weight:600;margin-top:10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.side .toc{margin-bottom:18px}
.rail .toc-m{display:none}

/* ───── tờ giấy ───── */
.doc{min-width:0}
.page{background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);
  padding:clamp(20px,4vw,52px) clamp(18px,4.5vw,60px) 40px;max-width:900px;overflow-x:clip}
.chead+hr{display:none}
.doc p:has(mjx-container),.doc li:has(> mjx-container,> .mjx-i){overflow-x:auto;overflow-y:hidden;padding-block:2px}
mjx-assistive-mml{max-width:100%!important;overflow:hidden!important}
.chead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 22px;align-items:end;padding-bottom:22px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.chead .num{grid-row:2;grid-column:1;align-self:end;font:800 clamp(4rem,11vw,7rem)/.8 var(--f-display);letter-spacing:-.05em;color:var(--pen);font-variant-numeric:tabular-nums;
  -webkit-text-stroke:0;position:relative}
.chead .k{grid-column:1/-1;grid-row:1;margin-bottom:6px;font:600 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.chead h1{grid-row:2;grid-column:2;align-self:end;font:800 clamp(1.7rem,4.2vw,2.6rem)/1.08 var(--f-display);margin:2px 0 0;text-wrap:balance;letter-spacing:-.025em}
.chead .sub{grid-column:1/-1;margin:14px 0 0;color:var(--muted);font-size:.92rem;max-width:68ch}
.cstats{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .78rem var(--f-body);color:var(--muted);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px 11px}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.chip.prog{border-color:transparent;background:var(--pen-soft);color:var(--pen)}
.chip.prog b{color:var(--pen)}
.meter{grid-column:1/-1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:12px}
.meter span{display:block;height:100%;background:var(--pen);border-radius:99px;transition:width .3s}

.doc h1{font:800 clamp(1.45rem,3vw,1.85rem)/1.15 var(--f-display);letter-spacing:-.02em;margin:56px 0 16px;text-wrap:balance;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chead h1{display:block}
.doc h1 .pn{font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--paper);background:var(--ink);padding:5px 9px;border-radius:6px}
.doc h2{font:700 clamp(1.2rem,2.4vw,1.4rem)/1.25 var(--f-display);letter-spacing:-.01em;margin:44px 0 12px;padding-top:18px;border-top:1px solid var(--rule);text-wrap:balance}
.doc h3{font-size:1.02rem;margin:24px 0 6px;font-weight:700}
.doc h4{font-size:.95rem;margin:16px 0 4px}
.doc p,.doc li{max-width:70ch}
.doc ul,.doc ol{padding-left:1.35em}
.doc li+li{margin-top:3px}
.doc li::marker{color:var(--muted)}
.doc strong{font-weight:700}
.doc hr{border:0;border-top:1px dashed var(--rule);margin:26px 0}
.doc blockquote{margin:16px 0;padding:12px 16px;background:var(--pen-soft);border-radius:10px}
.doc blockquote p{margin:4px 0}
.doc code{font-family:var(--f-mono);font-size:.8em;background:var(--sunk);padding:1px 6px;border-radius:5px}
.doc pre{background:var(--sunk);padding:12px 14px;border-radius:10px;overflow-x:auto;font-size:.82rem;line-height:1.5}
.doc pre code{background:none;padding:0}
.tbl{overflow-x:auto;margin:14px 0;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.doc table{border-collapse:collapse;font-size:.87rem;width:100%;min-width:min(100%,460px)}
.doc th,.doc td{border-bottom:1px solid var(--rule);padding:8px 12px;text-align:left;vertical-align:top}
.doc tr:last-child td{border-bottom:0}
.doc td+td,.doc th+th{border-left:1px solid var(--rule)}
.doc th{background:var(--sunk);font-weight:600;font-size:.8rem}
.doc tbody tr:hover{background:color-mix(in srgb,var(--pen-soft) 50%,transparent)}
.mjx-d{overflow-x:auto;overflow-y:hidden;margin:12px 0;padding:4px 0}
mjx-container[display="true"]{margin:6px 0!important}
.doc mjx-container svg{max-width:none}
.doc img{max-width:100%;height:auto;display:block;margin:12px 0;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:6px}

/* hộp chú thích */
.co{margin:20px 0;padding:14px 18px 12px;border-radius:12px;position:relative}
.co h3{margin:0 0 6px;font:600 .7rem var(--f-mono);text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:8px}
.co>:last-child{margin-bottom:0}
.co-ex{background:var(--paper);border:1px solid var(--rule)}
.co-ex h3{color:var(--pen)}
.co-ex h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pen)}
.co-err{background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 22%,transparent)}
.co-err h3{color:var(--red)}
.co-err h3::before{content:"✕";font-size:.85rem}
.co-tip{background:var(--hl-soft);border:1px solid color-mix(in srgb,var(--hl) 55%,transparent)}
.co-tip h3{color:var(--ink)}
.co-tip h3 span.hlx,.co-tip h3{background-image:none}
.co-tip h3::before{content:"";width:22px;height:9px;border-radius:2px;background:var(--hl);transform:skewX(-14deg)}

/* ngăn câu đề thật */
details.bank{margin:22px 0 10px;border:1.5px solid var(--ink);border-radius:14px;background:var(--paper);overflow:hidden}
details.bank>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 18px;font:700 1rem var(--f-display)}
details.bank>summary::-webkit-details-marker{display:none}
details.bank>summary::before{content:"";width:9px;height:9px;border-right:2px solid var(--pen);border-bottom:2px solid var(--pen);transform:rotate(-45deg);transition:transform .15s;flex:none}
details.bank[open]>summary::before{transform:rotate(45deg)}
details.bank>summary:hover{background:var(--sunk)}
details.bank>summary span:first-of-type{flex:1}
details.bank .cnt{font:600 .74rem var(--f-mono);color:var(--paper);background:var(--pen);padding:3px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
details.bank .bdone{font:500 .74rem var(--f-mono);color:var(--muted)}
.bank-body{padding:6px 18px 18px;border-top:1.5px solid var(--ink);background-color:var(--paper)}
.bank-body>hr{border-top:1px solid var(--rule);margin:22px -18px}
p.qh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:20px 0 8px;scroll-margin-top:calc(var(--hdr) + 30px)}
p.qh strong{font:700 1rem var(--f-display)}
p.qh code{font:500 .7rem var(--f-mono);color:var(--pen);background:var(--pen-soft);padding:2px 8px;border-radius:6px}
.qst{margin-left:auto;display:inline-flex;gap:4px;flex-wrap:wrap}
.qst button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--rule);background:var(--paper);color:var(--muted);font:500 .72rem var(--f-body);padding:3px 10px 3px 7px;border-radius:999px;cursor:pointer}
.qst button::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.qst button:hover{border-color:var(--c);color:var(--ink)}
.qst button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.qst button[aria-pressed="true"]::before{background:#fff}
.qst .s-ok{--c:var(--st-ok)} .qst .s-bad{--c:var(--st-bad)} .qst .s-rev{--c:var(--st-rev)}
.qst .s-rev[aria-pressed="true"]{color:#1d1600}.qst .s-rev[aria-pressed="true"]::before{background:#1d1600}
/* bảng câu */
.qboard{margin-top:16px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:14px 12px 12px}
.qboard .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 2px 10px}
.qboard .hd .lbl{margin:0}
.qboard .hd span{font:600 .74rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.qgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px;scrollbar-width:thin}
.qgrid button{aspect-ratio:1;max-width:100%;border:0;border-radius:9px;background:var(--sunk);color:var(--muted);font:600 .78rem var(--f-mono);font-variant-numeric:tabular-nums;cursor:pointer;padding:0}
.qgrid button:hover{outline:2px solid var(--pen);outline-offset:-2px;color:var(--ink)}
.qgrid button.st-done{background:var(--pen-soft);color:var(--pen)}
.qgrid button.st-ok{background:var(--st-ok);color:#fff}
.qgrid button.st-bad{background:var(--st-bad);color:#fff}
.qgrid button.st-rev{background:var(--st-rev);color:#1d1600}
.qgrid button.here{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--pen)}
.qsum{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule)}
.qsum div{text-align:center;font-size:.68rem;color:var(--muted);line-height:1.25}
.qsum b{display:block;font:700 1.05rem var(--f-display);font-variant-numeric:tabular-nums;color:var(--ink)}
.qsum .k-ok b{color:var(--st-ok)} .qsum .k-bad b{color:var(--st-bad)} .qsum .k-rev b{color:var(--st-rev-ink)}
.qbar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-top:10px}
.qbar i{display:block;height:100%}
.qlegend{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:.72rem;color:var(--muted)}
.qlegend span{display:inline-flex;align-items:center;gap:5px}
.qlegend span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.qempty{font-size:.82rem;color:var(--muted);margin:0;padding:0 2px}
.done-btn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--paper);color:var(--muted);font:500 .74rem var(--f-body);padding:3px 11px 3px 5px;border-radius:999px;cursor:pointer}
.done-btn::before{content:"";width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
.done-btn:hover{border-color:var(--ok);color:var(--ok)}
.done-btn[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.done-btn[aria-pressed="true"]::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 2.5px var(--ok-soft)}
/* đáp án A–E như ô tô trên phiếu */
.bank-body li.opt{list-style:none;display:flex;gap:10px;align-items:baseline;margin-left:-1.35em;padding:3px 0}
.opt .ob{flex:none;min-width:24px;padding:0 4px;width:auto;height:24px;border-radius:12px;border:1.5px solid var(--muted);display:inline-grid;place-items:center;font:600 .72rem var(--f-mono);color:var(--muted);transform:translateY(2px);cursor:pointer;background:var(--paper)}
.opt .ob:hover{border-color:var(--pen);color:var(--pen)}
.opt .ob[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--paper)}
.opt .ot{min-width:0}
.opt .ob.right{background:var(--st-ok);border-color:var(--st-ok);color:#fff}
.opt .ob.wrong{background:var(--st-bad);border-color:var(--st-bad);color:#fff}
.opt .ob.dim{opacity:.55}
.bank-body ul.locked .ob{cursor:default}
.bank-body ul.locked .ob:hover{border-color:var(--muted);color:var(--muted)}
.bank-body ul.locked .ob.right:hover,.bank-body ul.locked .ob.wrong:hover{color:#fff}
.ansx{margin:10px 0 4px;padding:10px 14px;border-radius:10px;font-size:.9rem;border:1px solid var(--rule);background:var(--sunk);display:grid;gap:4px}
.ansx.ok{background:color-mix(in srgb,var(--st-ok) 12%,var(--paper));border-color:color-mix(in srgb,var(--st-ok) 40%,transparent)}
.ansx.bad{background:color-mix(in srgb,var(--st-bad) 10%,var(--paper));border-color:color-mix(in srgb,var(--st-bad) 40%,transparent)}
.ansx .v{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ansx.ok .v{color:var(--st-ok)} .ansx.bad .v{color:var(--st-bad)}
.ansx .unsure{font:500 .7rem var(--f-mono);color:var(--st-rev-ink);border:1px solid currentColor;border-radius:99px;padding:0 7px}
.ansx .why{color:var(--ink)}
.ansx .redo{justify-self:start;border:0;background:none;color:var(--pen);font:500 .78rem var(--f-body);text-decoration:underline;cursor:pointer;padding:0}
.qhint{font-size:.74rem;color:var(--muted);margin:0 0 4px}
.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%{background:var(--hl-soft)}100%{background:transparent}}
details.plain{margin:14px 0;padding:10px 14px;border:1px dashed var(--rule);border-radius:10px}

/* chuyển chương */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:48px;max-width:900px}
.pager button{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 16px;cursor:pointer;min-width:0}
.pager button:hover{border-color:var(--pen)}
.pager button.nx{text-align:right;grid-column:2}
.pager small{font:500 .7rem var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pager span{font:700 .98rem var(--f-display)}
.totop{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:15;width:42px;height:42px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;display:grid;place-items:center}
.totop svg{width:18px;height:18px}
.totop:hover{color:var(--pen);border-color:var(--pen)}

/* trang kiểm tra */
.notes h2{border-top:0;margin-top:28px}
.notes .pill{display:inline-block;font:600 .7rem var(--f-mono);padding:2px 8px;border-radius:999px;margin-right:6px;vertical-align:1px}
.pill.miss{background:var(--red-soft);color:var(--red)}
.pill.part{background:var(--hl-soft);color:var(--ink)}
.pill.okk{background:var(--ok-soft);color:var(--ok)}

<script type="application/json" id="content">{"data": {"MAI391": [{"num": "3", "short": "Norm, tích trong, trực giao", "sub": "Mathematics for Machine Learning – mục 3.1, 3.2, 3.3, 3.4, 3.5, 3.6, 3.8", "toc": [["h1", "PHẦN 1. GHI CHÉP BÀI HỌC", "MAI391-3-h1"], ["h2", "1.1. Norm (Chuẩn) — mục 3.1", "MAI391-3-h2"], ["h2", "1.2. Inner Product (Tích trong) — mục 3.2", "MAI391-3-h3"], ["h2", "1.3. Lengths and Distances (Độ dài & Khoảng cách) — mục 3.3", "MAI391-3-h4"], ["h2", "1.4. Angles and Orthogonality (Góc & Trực giao) — mục 3.4", "MAI391-3-h5"], ["h2", "1.5. Orthonormal Basis (Cơ sở trực chuẩn) — mục 3.5", "MAI391-3-h6"], ["h2", "1.6. Orthogonal Complement (Phần bù trực giao) — mục 3.6", "MAI391-3-h7"], ["h2", "1.7. Orthogonal Projections (Hình chiếu trực giao) — mục 3.8", "MAI391-3-h8"], ["h1", "PHẦN 2. ĐỀ THI THƯỜNG RA GÌ Ở CHƯƠNG 3", "MAI391-3-h9"], ["h1", "PHẦN 3. CÁC DẠNG BÀI", "MAI391-3-h10"], ["h2", "Chuẩn bị: các chế độ Casio fx-580VN X dùng cho Chương 3", "MAI391-3-h11"], ["h2", "Dạng 1: Norm của vector (và norm mở rộng)", "MAI391-3-h12"], ["h2", "Dạng 2: Nhận diện inner product / ma trận đối xứng xác định dương", "MAI391-3-h13"], ["h2", "Dạng 3: Độ dài & khoảng cách theo inner product cho trước", "MAI391-3-h14"], ["h2", "Dạng 4: Góc & trực giao", "MAI391-3-h15"], ["h2", "Dạng 5: Gram–Schmidt (hỏi một tọa độ)", "MAI391-3-h16"], ["h2", "Dạng 6: Phần bù trực giao \\(U^\\perp\\)", "MAI391-3-h17"], ["h2", "Dạng 7: Hình chiếu trực giao & ma trận chiếu", "MAI391-3-h18"], ["h2", "Dạng 8: Ma trận trực giao", "MAI391-3-h19"], ["h1", "PHẦN 4. NHÌN ĐỀ → NHẬN RA DẠNG", "MAI391-3-h20"], ["h1", "PHẦN 5. TỔNG HỢP ÔN THI", "MAI391-3-h21"], ["h2", "1. Công thức phải nhớ", "MAI391-3-h22"], ["h2", "2. Mười lỗi mất điểm hay gặp nhất", "MAI391-3-h23"]], "html": "<hr/>\n<h1 id=\"MAI391-3-h1\"><span class=\"pn\">Phần 1<\/span>Ghi chép bài học<\/h1>\n<h2 id=\"MAI391-3-h2\">1.1. Norm (Chuẩn) — mục 3.1<\/h2>\n<h3>Khái niệm<\/h3>\n<ul>\n<li><strong>Định nghĩa:<\/strong> Norm là một hàm số đo \"độ lớn\" (length) của một vector.<\/li>\n<li><strong>Ký hiệu:<\/strong> <span class=\"mjx-i\">\\(\\lVert x \\rVert\\)<\/span>, với <span class=\"mjx-i\">\\(x \\in V\\)<\/span> (V là không gian vector).<\/li>\n<li><strong>Ý nghĩa:<\/strong> Norm là hàm <span class=\"mjx-i\">\\(\\lVert \\cdot \\rVert : V \\to \\mathbb{R}\\)<\/span> gán cho mỗi vector một số thực không âm, thỏa 3 tiên đề bên dưới. Nó tổng quát hóa khái niệm \"độ dài\" mà ta quen thuộc trong hình học.<\/li>\n<\/ul>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> Coi norm giống như \"đo quãng đường\" từ gốc tọa độ đến điểm <span class=\"mjx-i\">\\(x\\)<\/span>. Chỉ khác là có nhiều <strong>kiểu đo<\/strong> khác nhau — giống như đi bộ chéo qua công viên (Euclid, <span class=\"mjx-i\">\\(\\ell_2\\)<\/span>) khác với đi vòng theo từng ô phố bàn cờ (Manhattan, <span class=\"mjx-i\">\\(\\ell_1\\)<\/span>). Cùng một điểm đến, nhưng \"quãng đường\" đo được sẽ khác nhau tùy kiểu đo.<\/p>\n<\/blockquote>\n<h3>Tính chất (3 tiên đề của norm)<\/h3>\n<p>Một hàm <span class=\"mjx-i\">\\(\\lVert \\cdot \\rVert\\)<\/span> là norm nếu với mọi <span class=\"mjx-i\">\\(\\lambda \\in \\mathbb{R}\\)<\/span>, <span class=\"mjx-i\">\\(x, y \\in V\\)<\/span>:<\/p>\n<ol>\n<li><strong>Xác định dương (positive definite):<\/strong>\n<div class=\"mjx-d\">\\[\\lVert x \\rVert \\ge 0 \\quad \\text{và} \\quad \\lVert x \\rVert = 0 \\iff x = 0\\]<\/div><\/li>\n<li><strong>Thuần nhất tuyệt đối (absolutely homogeneous):<\/strong>\n<div class=\"mjx-d\">\\[\\lVert \\lambda x \\rVert = |\\lambda| \\, \\lVert x \\rVert\\]<\/div><\/li>\n<li><strong>Bất đẳng thức tam giác (triangle inequality):<\/strong>\n<div class=\"mjx-d\">\\[\\lVert x + y \\rVert \\le \\lVert x \\rVert + \\lVert y \\rVert\\]<\/div><\/li>\n<\/ol>\n<h3>Các loại norm thường gặp trên <span class=\"mjx-i\">\\(\\mathbb{R}^n\\)<\/span><\/h3>\n<ul>\n<li><strong>Manhattan norm (<span class=\"mjx-i\">\\(\\ell_1\\)<\/span>):<\/strong>\n<div class=\"mjx-d\">\\[\\lVert x \\rVert_1 = \\sum_{i=1}^n |x_i|\\]<\/div><\/li>\n<li><strong>Euclidean norm (<span class=\"mjx-i\">\\(\\ell_2\\)<\/span>):<\/strong>\n<div class=\"mjx-d\">\\[\\lVert x \\rVert_2 = \\sqrt{\\sum_{i=1}^n x_i^2} = \\sqrt{x^\\top x}\\]<\/div><\/li>\n<\/ul>\n<blockquote>\n<p>Khi đề không ghi rõ, \"norm\" mặc định là Euclidean norm <span class=\"mjx-i\">\\(\\lVert \\cdot \\rVert_2\\)<\/span>.<\/p>\n<\/blockquote>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ<\/h3>\n<p><strong>Example:<\/strong> Let <span class=\"mjx-i\">\\(x = (1, -2, 3)\\)<\/span>. Compute <span class=\"mjx-i\">\\(\\lVert x \\rVert_1\\)<\/span> and <span class=\"mjx-i\">\\(\\lVert x \\rVert_2\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Ví dụ:<\/strong> Cho <span class=\"mjx-i\">\\(x = (1, -2, 3)\\)<\/span>. Tính <span class=\"mjx-i\">\\(\\lVert x \\rVert_1\\)<\/span> và <span class=\"mjx-i\">\\(\\lVert x \\rVert_2\\)<\/span>.<\/p>\n<ul>\n<li>Bước 1: <span class=\"mjx-i\">\\(\\lVert x \\rVert_1 = |1| + |-2| + |3| = 6\\)<\/span><\/li>\n<li>Bước 2: <span class=\"mjx-i\">\\(\\lVert x \\rVert_2 = \\sqrt{1^2 + (-2)^2 + 3^2} = \\sqrt{14}\\)<\/span><\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Norm không phải lúc nào cũng là Euclidean — có nhiều loại norm khác nhau, mỗi loại tạo ra \"hình dạng đường tròn đơn vị\" khác nhau.<\/li>\n<li>3 tiên đề (không âm, thuần nhất, tam giác) là điều kiện <strong>bắt buộc<\/strong> để một hàm được gọi là norm.<\/li>\n<li>Norm <strong>không nhất thiết sinh ra từ inner product<\/strong> (ví dụ <span class=\"mjx-i\">\\(\\ell_1\\)<\/span>-norm không sinh từ inner product nào).<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-3-h3\">1.2. Inner Product (Tích trong) — mục 3.2<\/h2>\n<h3>Khái niệm<\/h3>\n<ul>\n<li><strong>Định nghĩa:<\/strong> Inner product là phép \"nhân\" hai vector cho ra một số thực, giúp ta định nghĩa được độ dài, khoảng cách, góc một cách tổng quát (không chỉ trong <span class=\"mjx-i\">\\(\\mathbb{R}^n\\)<\/span> mà cả trong không gian vector trừu tượng như đa thức, hàm số...).<\/li>\n<li><strong>Ký hiệu:<\/strong> <span class=\"mjx-i\">\\(\\langle x, y \\rangle\\)<\/span>.<\/li>\n<li><strong>Ý nghĩa:<\/strong> Đây là công cụ tổng quát hóa của \"dot product\" quen thuộc.<\/li>\n<\/ul>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> Dot product bình thường coi mọi trục tọa độ \"quan trọng như nhau\". Inner product tổng quát giống như một chiếc cân có thể \"cân\" các trục khác nhau — trục này có thể được \"coi trọng\" gấp đôi trục kia (thông qua ma trận <span class=\"mjx-i\">\\(A\\)<\/span>). Vì vậy độ dài, góc, khoảng cách đo theo inner product tổng quát có thể khác hẳn so với cách đo thông thường.<\/p>\n<\/blockquote>\n<h3>Dot product (tích vô hướng chuẩn)<\/h3>\n<p><div class=\"mjx-d\">\\[x \\cdot y = \\sum_{i=1}^n x_i y_i = x^\\top y\\]<\/div><\/p>\n<p>Đây là <strong>một trường hợp đặc biệt<\/strong> của inner product, gọi là <em>inner product chuẩn tắc<\/em>.<\/p>\n<h3>Song tuyến tính dạng (Bilinear Form)<\/h3>\n<p>Cho <span class=\"mjx-i\">\\(V\\)<\/span> là không gian vector. Hàm <span class=\"mjx-i\">\\(\\Omega: V \\times V \\to \\mathbb{R}\\)<\/span> là <strong>song tuyến tính (bilinear)<\/strong> nếu tuyến tính theo từng biến:<\/p>\n<p><div class=\"mjx-d\">\\[\\Omega(\\lambda x + \\psi y,\\, z) = \\lambda\\,\\Omega(x,z) + \\psi\\,\\Omega(y,z)\\]<\/div>\n<div class=\"mjx-d\">\\[\\Omega(x,\\, \\lambda y + \\psi z) = \\lambda\\,\\Omega(x,y) + \\psi\\,\\Omega(x,z)\\]<\/div><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\Omega\\)<\/span> gọi là <strong>đối xứng (symmetric)<\/strong> nếu <span class=\"mjx-i\">\\(\\Omega(x,y) = \\Omega(y,x)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\Omega\\)<\/span> gọi là <strong>xác định dương (positive definite)<\/strong> nếu <span class=\"mjx-i\">\\(\\Omega(x,x) &gt; 0 \\ \\forall x \\ne 0\\)<\/span>.<\/li>\n<\/ul>\n<h4>Khai triển: vì sao \"đối xứng\" tương đương với \"<span class=\"mjx-i\">\\(A=A^\\top\\)<\/span>\"? (giúp hiểu bản chất, không chỉ học thuộc)<\/h4>\n<p>Trong <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>, mọi <span class=\"mjx-i\">\\(\\Omega(x,y)\\)<\/span> song tuyến tính đều viết được dưới dạng:<\/p>\n<p><div class=\"mjx-d\">\\[\\Omega(x,y) = p\\,x_1y_1 + q\\,x_1y_2 + r\\,x_2y_1 + s\\,x_2y_2 = x^\\top A y, \\qquad A=\\begin{bmatrix}p&amp;q\\\\r&amp;s\\end{bmatrix}\\]<\/div><\/p>\n<p>Muốn kiểm tra đối xứng, ta tính <span class=\"mjx-i\">\\(\\Omega(y,x)\\)<\/span> bằng cách <strong>đổi vai trò<\/strong> <span class=\"mjx-i\">\\(x\\leftrightarrow y\\)<\/span> ngay trong công thức:<\/p>\n<p><div class=\"mjx-d\">\\[\\Omega(y,x) = p\\,y_1x_1+q\\,y_1x_2+r\\,y_2x_1+s\\,y_2x_2 = p\\,x_1y_1+q\\,x_2y_1+r\\,x_1y_2+s\\,x_2y_2\\]<\/div><\/p>\n<p>So sánh với <span class=\"mjx-i\">\\(\\Omega(x,y)\\)<\/span> ban đầu, chỉ có hệ số của <span class=\"mjx-i\">\\(x_1y_2\\)<\/span> và <span class=\"mjx-i\">\\(x_2y_1\\)<\/span> bị <strong>hoán đổi vị trí<\/strong> (<span class=\"mjx-i\">\\(q\\leftrightarrow r\\)<\/span>). Vậy hai biểu thức chỉ bằng nhau với mọi <span class=\"mjx-i\">\\(x,y\\)<\/span> khi <span class=\"mjx-i\">\\(q=r\\)<\/span> — mà <span class=\"mjx-i\">\\(q=r\\)<\/span> chính là điều kiện <span class=\"mjx-i\">\\(A=A^\\top\\)<\/span>. Nói ngắn gọn:<\/p>\n<p><div class=\"mjx-d\">\\[\\boxed{\\Omega \\text{ đối xứng} \\iff A=A^\\top \\iff \\text{hệ số } x_1y_2 = \\text{hệ số } x_2y_1}\\]<\/div><\/p>\n<p>→ Đây là mẹo rất hữu ích: khi gặp một biểu thức song tuyến tính, chỉ cần <strong>so hai hệ số \"chéo\"<\/strong> này, không cần viết cả ma trận rồi tính <span class=\"mjx-i\">\\(A^\\top\\)<\/span>.<\/p>\n<h3>Định nghĩa Inner Product tổng quát<\/h3>\n<p>Một dạng song tuyến tính đối xứng và xác định dương <span class=\"mjx-i\">\\(\\Omega\\)<\/span> được gọi là <strong>inner product<\/strong>, ký hiệu <span class=\"mjx-i\">\\(\\langle x, y \\rangle := \\Omega(x,y)\\)<\/span>.<\/p>\n<p>Cặp <span class=\"mjx-i\">\\((V, \\langle \\cdot, \\cdot \\rangle)\\)<\/span> được gọi là <strong>không gian inner product<\/strong> (inner product space).<\/p>\n<h3>Inner product tổng quát trên <span class=\"mjx-i\">\\(\\mathbb{R}^n\\)<\/span><\/h3>\n<p>Với ma trận đối xứng, xác định dương <span class=\"mjx-i\">\\(A\\)<\/span> (ký hiệu <span class=\"mjx-i\">\\(A \\succ 0\\)<\/span>):<\/p>\n<p><div class=\"mjx-d\">\\[\\langle x, y \\rangle = x^\\top A y\\]<\/div><\/p>\n<p>là một inner product hợp lệ trên <span class=\"mjx-i\">\\(\\mathbb{R}^n\\)<\/span> (dot product là trường hợp riêng khi <span class=\"mjx-i\">\\(A = I\\)<\/span>).<\/p>\n<blockquote>\n<p><span class=\"mjx-i\">\\(A\\)<\/span> <strong>xác định dương<\/strong> nghĩa là: <span class=\"mjx-i\">\\(x^\\top A x &gt; 0\\)<\/span> với mọi <span class=\"mjx-i\">\\(x \\ne 0\\)<\/span>.<\/p>\n<\/blockquote>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ<\/h3>\n<p><strong>Example:<\/strong> Let <span class=\"mjx-i\">\\(A = \\begin{pmatrix} 2 &amp; 0 \\\\ 0 &amp; 1 \\end{pmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(x=(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(y=(2,3)\\)<\/span>. Compute <span class=\"mjx-i\">\\(\\langle x, y\\rangle = x^\\top A y\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Ví dụ:<\/strong> Cho <span class=\"mjx-i\">\\(A = \\begin{pmatrix} 2 &amp; 0 \\\\ 0 &amp; 1 \\end{pmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(x=(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(y=(2,3)\\)<\/span>. Tính <span class=\"mjx-i\">\\(\\langle x, y\\rangle = x^\\top A y\\)<\/span>.<\/p>\n<ul>\n<li>Bước 1: <span class=\"mjx-i\">\\(Ay = \\begin{pmatrix}2 &amp; 0\\\\0&amp;1\\end{pmatrix}\\begin{pmatrix}2\\\\3\\end{pmatrix} = \\begin{pmatrix}4\\\\3\\end{pmatrix}\\)<\/span><\/li>\n<li>Bước 2: <span class=\"mjx-i\">\\(x^\\top (Ay) = (1)(4) + (1)(3) = 7\\)<\/span><\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Inner product <strong>không chỉ là dot product<\/strong> — nó là một họ các hàm số thỏa (song tuyến tính + đối xứng + xác định dương).<\/li>\n<li>Muốn kiểm tra \"<span class=\"mjx-i\">\\(\\langle x,y\\rangle = x^\\top A y\\)<\/span> có phải inner product không\" → chỉ cần kiểm tra <span class=\"mjx-i\">\\(A\\)<\/span> có đối xứng và xác định dương hay không.<\/li>\n<li>Mọi inner product đều <strong>sinh ra một norm<\/strong>: <span class=\"mjx-i\">\\(\\lVert x \\rVert = \\sqrt{\\langle x, x \\rangle}\\)<\/span> — nhưng chiều ngược lại <strong>không đúng<\/strong>.<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-3-h4\">1.3. Lengths and Distances (Độ dài &amp; Khoảng cách) — mục 3.3<\/h2>\n<h3>Khái niệm &amp; công thức<\/h3>\n<ul>\n<li><strong>Độ dài (length)<\/strong> của vector sinh ra từ inner product:\n<div class=\"mjx-d\">\\[\\lVert x \\rVert = \\sqrt{\\langle x, x \\rangle}\\]<\/div><\/li>\n<li><strong>Bất đẳng thức Cauchy–Schwarz:<\/strong>\n<div class=\"mjx-d\">\\[|\\langle x, y \\rangle| \\le \\lVert x \\rVert \\, \\lVert y \\rVert\\]<\/div><\/li>\n<li><strong>Khoảng cách (distance)<\/strong> giữa hai vector:\n<div class=\"mjx-d\">\\[d(x,y) = \\lVert x - y \\rVert = \\sqrt{\\langle x-y,\\ x-y\\rangle}\\]<\/div><\/li>\n<\/ul>\n<blockquote>\n<p>Nếu inner product dùng là dot product thì <span class=\"mjx-i\">\\(d(x,y)\\)<\/span> chính là khoảng cách Euclidean thông thường. Nếu dùng inner product tổng quát (<span class=\"mjx-i\">\\(x^\\top A y\\)<\/span>) thì khoảng cách sẽ khác đi.<\/p>\n<\/blockquote>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> Đây chỉ là bước \"áp dụng cụ thể\" của ý tưởng ở mục 1.2 — nếu chiếc cân <span class=\"mjx-i\">\\(A\\)<\/span> coi trọng trục nào hơn, thì \"khoảng cách\" đo theo trục đó cũng bị phóng đại theo. Cùng hai điểm, \"cân\" khác nhau sẽ cho ra \"khoảng cách\" khác nhau.<\/p>\n<\/blockquote>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ<\/h3>\n<p><strong>Example:<\/strong> With the standard inner product, <span class=\"mjx-i\">\\(x=(0,0)\\)<\/span>, <span class=\"mjx-i\">\\(y=(3,4)\\)<\/span>. Compute <span class=\"mjx-i\">\\(d(x,y)\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Ví dụ:<\/strong> Với inner product chuẩn, <span class=\"mjx-i\">\\(x=(0,0)\\)<\/span>, <span class=\"mjx-i\">\\(y=(3,4)\\)<\/span>. Tính <span class=\"mjx-i\">\\(d(x,y)\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(d(x,y) = \\lVert (−3,−4)\\rVert = \\sqrt{9+16}=5\\)<\/span><\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Độ dài/khoảng cách <strong>phụ thuộc vào inner product đang dùng<\/strong> — đổi inner product thì \"hình học\" của không gian cũng đổi theo.<\/li>\n<li>Đừng mặc định luôn là khoảng cách Euclidean nếu đề bài cho một ma trận <span class=\"mjx-i\">\\(A\\)<\/span> khác <span class=\"mjx-i\">\\(I\\)<\/span>.<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-3-h5\">1.4. Angles and Orthogonality (Góc &amp; Trực giao) — mục 3.4<\/h2>\n<h3>Khái niệm &amp; công thức<\/h3>\n<ul>\n<li><strong>Góc <span class=\"mjx-i\">\\(\\theta\\)<\/span> giữa 2 vector<\/strong> (suy ra từ Cauchy–Schwarz):\n<div class=\"mjx-d\">\\[\\cos\\theta = \\frac{\\langle x, y \\rangle}{\\lVert x \\rVert \\, \\lVert y \\rVert}\\]<\/div><\/li>\n<li><strong>Trực giao (Orthogonal):<\/strong> <span class=\"mjx-i\">\\(x\\)<\/span> và <span class=\"mjx-i\">\\(y\\)<\/span> trực giao, ký hiệu <span class=\"mjx-i\">\\(x \\perp y\\)<\/span>, nếu:\n<div class=\"mjx-d\">\\[\\langle x, y \\rangle = 0\\]<\/div><\/li>\n<li><strong>Trực chuẩn (Orthonormal):<\/strong> <span class=\"mjx-i\">\\(x \\perp y\\)<\/span> <strong>và<\/strong> <span class=\"mjx-i\">\\(\\lVert x \\rVert = \\lVert y \\rVert = 1\\)<\/span>.<\/li>\n<\/ul>\n<blockquote>\n<p><strong>Lưu ý quan trọng:<\/strong> trực giao được định nghĩa dựa trên inner product đang dùng — hai vector có thể trực giao theo inner product này nhưng <strong>không<\/strong> trực giao theo inner product khác (kể cả khi dùng dot product chúng \"trông\" không vuông góc theo nghĩa hình học thông thường).<\/p>\n<\/blockquote>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> Trực giao giống như hai hướng đi \"không liên quan gì đến nhau\" — đi theo hướng này không hề tiến lại gần hay ra xa theo hướng kia. Góc <span class=\"mjx-i\">\\(\\theta\\)<\/span> giống như \"kim la bàn\" đo độ lệch giữa hai hướng: <span class=\"mjx-i\">\\(0^\\circ\\)<\/span> là cùng hướng, <span class=\"mjx-i\">\\(90^\\circ\\)<\/span> là hoàn toàn độc lập (trực giao), <span class=\"mjx-i\">\\(180^\\circ\\)<\/span> là ngược hướng.<\/p>\n<\/blockquote>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ<\/h3>\n<p><strong>Example:<\/strong> <span class=\"mjx-i\">\\(x=(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(y=(1,-1)\\)<\/span>, using the dot product. Check orthogonality and compute the angle.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Ví dụ:<\/strong> <span class=\"mjx-i\">\\(x=(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(y=(1,-1)\\)<\/span>, dùng dot product. Kiểm tra trực giao và tính góc.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\langle x,y\\rangle = 1\\cdot1 + 1\\cdot(-1) = 0\\)<\/span> → trực giao (<span class=\"mjx-i\">\\(\\theta = 90^\\circ\\)<\/span>).<\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Muốn tính góc/kiểm tra trực giao, <strong>luôn dùng đúng inner product mà đề cho<\/strong>, không mặc định dot product nếu đề đã cho ma trận <span class=\"mjx-i\">\\(A\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\langle x,y\\rangle = 0\\)<\/span> là điều kiện <strong>duy nhất và đủ<\/strong> để kết luận trực giao.<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-3-h6\">1.5. Orthonormal Basis (Cơ sở trực chuẩn) — mục 3.5<\/h2>\n<h3>Khái niệm<\/h3>\n<p>Cho không gian <span class=\"mjx-i\">\\(V\\)<\/span> chiều <span class=\"mjx-i\">\\(n\\)<\/span> với cơ sở <span class=\"mjx-i\">\\(\\{b_1,\\dots,b_n\\}\\)<\/span>. Đây là cơ sở <strong>trực chuẩn (ONB – orthonormal basis)<\/strong> nếu:<\/p>\n<p><div class=\"mjx-d\">\\[\\langle b_i, b_j \\rangle = 0 \\ (i\\ne j), \\qquad \\langle b_i, b_i \\rangle = 1 \\ \\forall i\\]<\/div><\/p>\n<p>Nói cách khác: các vector cơ sở <strong>đôi một vuông góc<\/strong> và <strong>đều có độ dài 1<\/strong>.<\/p>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> Đây chính là bộ trục <span class=\"mjx-i\">\\(Ox, Oy, Oz\\)<\/span> \"chuẩn\" mà ta hay vẽ — các trục vuông góc nhau và có cùng một đơn vị đo. Gram-Schmidt là \"quy trình sửa\" một bộ trục lệch xẹo, chưa vuông góc, chưa cùng đơn vị, thành một bộ trục \"chuẩn\" như vậy — làm mọi phép tính sau này (đặc biệt là chiếu) trở nên đơn giản hơn hẳn.<\/p>\n<\/blockquote>\n<h3>Cách tìm cơ sở trực chuẩn: Gram–Schmidt<\/h3>\n<p>Cho cơ sở <span class=\"mjx-i\">\\(\\{b_1,\\dots,b_n\\}\\)<\/span> bất kỳ, xây dựng cơ sở trực giao <span class=\"mjx-i\">\\(\\{u_1,\\dots,u_n\\}\\)<\/span> rồi chuẩn hóa:<\/p>\n<p><div class=\"mjx-d\">\\[u_1 = b_1\\]<\/div>\n<div class=\"mjx-d\">\\[u_k = b_k - \\sum_{i=1}^{k-1} \\frac{\\langle b_k, u_i\\rangle}{\\langle u_i, u_i\\rangle}\\, u_i \\quad (k = 2,\\dots,n)\\]<\/div><\/p>\n<p>Sau đó chuẩn hóa: <span class=\"mjx-i\">\\(\\hat u_i = \\dfrac{u_i}{\\lVert u_i \\rVert}\\)<\/span> để được cơ sở trực chuẩn.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ<\/h3>\n<p><strong>Example:<\/strong> Orthonormalize <span class=\"mjx-i\">\\(b_1=(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(b_2=(0,1)\\)<\/span> (dot product).<\/p>\n<p><em>Dịch đề:<\/em> <strong>Ví dụ:<\/strong> Trực chuẩn hóa <span class=\"mjx-i\">\\(b_1=(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(b_2=(0,1)\\)<\/span> (dot product).<\/p>\n<ul>\n<li>Bước 1: <span class=\"mjx-i\">\\(u_1 = b_1 = (1,1)\\)<\/span><\/li>\n<li>Bước 2: <span class=\"mjx-i\">\\(u_2 = b_2 - \\dfrac{\\langle b_2,u_1\\rangle}{\\langle u_1,u_1\\rangle}u_1 = (0,1) - \\dfrac{1}{2}(1,1) = (-\\tfrac12, \\tfrac12)\\)<\/span><\/li>\n<li>Bước 3: Chuẩn hóa: <span class=\"mjx-i\">\\(\\hat u_1 = \\dfrac{1}{\\sqrt2}(1,1)\\)<\/span>, <span class=\"mjx-i\">\\(\\hat u_2 = \\dfrac{1}{\\sqrt2}(-1,1)\\)<\/span><\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Gram–Schmidt làm theo <strong>thứ tự<\/strong>: mỗi vector mới bị trừ đi hình chiếu của nó lên <strong>tất cả<\/strong> các vector trực giao đã có trước đó.<\/li>\n<li>Đừng quên bước <strong>chuẩn hóa cuối cùng<\/strong> (chia cho norm) — nếu chỉ trực giao mà chưa chia norm thì đó mới là cơ sở <strong>trực giao (orthogonal)<\/strong>, chưa phải <strong>trực chuẩn (orthonormal)<\/strong>.<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-3-h7\">1.6. Orthogonal Complement (Phần bù trực giao) — mục 3.6<\/h2>\n<h3>Khái niệm<\/h3>\n<p>Cho <span class=\"mjx-i\">\\(U\\)<\/span> là không gian con của <span class=\"mjx-i\">\\(V\\)<\/span> (chiều <span class=\"mjx-i\">\\(m\\)<\/span>, <span class=\"mjx-i\">\\(\\dim V = n\\)<\/span>). <strong>Phần bù trực giao<\/strong> <span class=\"mjx-i\">\\(U^\\perp\\)<\/span> là tập hợp mọi vector của <span class=\"mjx-i\">\\(V\\)<\/span> trực giao với <strong>mọi<\/strong> vector của <span class=\"mjx-i\">\\(U\\)<\/span>:<\/p>\n<p><div class=\"mjx-d\">\\[U^\\perp = \\{\\, v \\in V : \\langle v, u\\rangle = 0 \\ \\ \\forall u \\in U \\,\\}\\]<\/div><\/p>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> Nếu <span class=\"mjx-i\">\\(U\\)<\/span> là một <strong>mặt bàn<\/strong> đặt trong không gian 3 chiều, thì <span class=\"mjx-i\">\\(U^\\perp\\)<\/span> chính là <strong>đường thẳng đứng<\/strong> xuyên thẳng qua mặt bàn đó (cây cột chống bàn, kéo dài vô hạn theo cả hai chiều). Mọi vector nằm trên cây cột này đều vuông góc với mọi vector nằm trên mặt bàn.<\/p>\n<\/blockquote>\n<h3>Tính chất<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(U^\\perp\\)<\/span> cũng là một không gian con của <span class=\"mjx-i\">\\(V\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dim U + \\dim U^\\perp = \\dim V\\)<\/span> (chiều bù nhau).<\/li>\n<li><span class=\"mjx-i\">\\(U \\cap U^\\perp = \\{0\\}\\)<\/span> và <span class=\"mjx-i\">\\(V = U \\oplus U^\\perp\\)<\/span> (mọi <span class=\"mjx-i\">\\(v\\in V\\)<\/span> viết được duy nhất thành <span class=\"mjx-i\">\\(v = u + w\\)<\/span>, <span class=\"mjx-i\">\\(u\\in U, w\\in U^\\perp\\)<\/span>).<\/li>\n<li>Trong <span class=\"mjx-i\">\\(\\mathbb{R}^3\\)<\/span>: nếu <span class=\"mjx-i\">\\(U\\)<\/span> là mặt phẳng qua gốc tọa độ (chiều 2) thì <span class=\"mjx-i\">\\(U^\\perp\\)<\/span> là đường thẳng pháp tuyến (chiều 1).<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ<\/h3>\n<p><strong>Example:<\/strong> <span class=\"mjx-i\">\\(U = \\text{span}\\{(1,0,0),(0,1,0)\\}\\)<\/span> (the <span class=\"mjx-i\">\\(xy\\)<\/span>-plane) in <span class=\"mjx-i\">\\(\\mathbb{R}^3\\)<\/span> with the dot product. Find <span class=\"mjx-i\">\\(U^\\perp\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Ví dụ:<\/strong> <span class=\"mjx-i\">\\(U = \\text{span}\\{(1,0,0),(0,1,0)\\}\\)<\/span> (mặt phẳng <span class=\"mjx-i\">\\(xy\\)<\/span>) trong <span class=\"mjx-i\">\\(\\mathbb{R}^3\\)<\/span> với dot product. Tìm <span class=\"mjx-i\">\\(U^\\perp\\)<\/span>.<\/p>\n<ul>\n<li>Vector <span class=\"mjx-i\">\\(v=(a,b,c)\\)<\/span> trực giao với cả <span class=\"mjx-i\">\\((1,0,0)\\)<\/span> và <span class=\"mjx-i\">\\((0,1,0)\\)<\/span> <span class=\"mjx-i\">\\(\\Rightarrow a=0, b=0\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(U^\\perp = \\text{span}\\{(0,0,1)\\}\\)<\/span> — đúng là trục <span class=\"mjx-i\">\\(z\\)<\/span>.<\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(U^\\perp\\)<\/span> luôn được tính <strong>theo một inner product cụ thể<\/strong>.<\/li>\n<li>Cách tìm: giải hệ phương trình <span class=\"mjx-i\">\\(\\langle v, u_i\\rangle = 0\\)<\/span> với <span class=\"mjx-i\">\\(u_i\\)<\/span> là các vector cơ sở của <span class=\"mjx-i\">\\(U\\)<\/span>.<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-3-h8\">1.7. Orthogonal Projections (Hình chiếu trực giao) — mục 3.8<\/h2>\n<h3>Khái niệm<\/h3>\n<p><strong>Hình chiếu trực giao<\/strong> của <span class=\"mjx-i\">\\(x\\)<\/span> lên không gian con <span class=\"mjx-i\">\\(U\\)<\/span> là vector <span class=\"mjx-i\">\\(\\pi_U(x) \\in U\\)<\/span> <strong>gần <span class=\"mjx-i\">\\(x\\)<\/span> nhất<\/strong>, sao cho <span class=\"mjx-i\">\\(x - \\pi_U(x) \\perp U\\)<\/span>.<\/p>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> Giống như bật một ngọn đèn <strong>thẳng đứng<\/strong> phía trên một vật <span class=\"mjx-i\">\\(x\\)<\/span>, rọi xuống mặt bàn <span class=\"mjx-i\">\\(U\\)<\/span> — cái bóng đổ xuống mặt bàn chính là <span class=\"mjx-i\">\\(\\pi_U(x)\\)<\/span>. Đây luôn là điểm <strong>gần <span class=\"mjx-i\">\\(x\\)<\/span> nhất<\/strong> trên mặt bàn, và đoạn nối từ <span class=\"mjx-i\">\\(x\\)<\/span> xuống cái bóng luôn <strong>vuông góc<\/strong> với mặt bàn.<\/p>\n<\/blockquote>\n<h3>Trường hợp 1: Chiếu lên đường thẳng (1 chiều), <span class=\"mjx-i\">\\(U = \\text{span}\\{b\\}\\)<\/span><\/h3>\n<p><div class=\"mjx-d\">\\[\\pi_U(x) = \\frac{\\langle x, b\\rangle}{\\langle b, b\\rangle}\\, b = \\frac{b\\, b^\\top}{b^\\top b}\\, x \\quad \\text{(với dot product)}\\]<\/div><\/p>\n<p>Ma trận chiếu (projection matrix): <span class=\"mjx-i\">\\(P_\\pi = \\dfrac{b\\,b^\\top}{b^\\top b}\\)<\/span>, thỏa <span class=\"mjx-i\">\\(\\pi_U(x) = P_\\pi x\\)<\/span>.<\/p>\n<h3>Trường hợp 2: Chiếu lên không gian con nhiều chiều, <span class=\"mjx-i\">\\(U = \\text{span}\\{b_1,\\dots,b_k\\}\\)<\/span>, <span class=\"mjx-i\">\\(B=[b_1,\\dots,b_k]\\)<\/span><\/h3>\n<p><div class=\"mjx-d\">\\[\\pi_U(x) = B(B^\\top B)^{-1} B^\\top x\\]<\/div><\/p>\n<p>Ma trận chiếu: <span class=\"mjx-i\">\\(P_\\pi = B(B^\\top B)^{-1}B^\\top\\)<\/span>.<\/p>\n<blockquote>\n<p><strong>Trường hợp đặc biệt:<\/strong> Nếu <span class=\"mjx-i\">\\(\\{b_1,\\dots,b_k\\}\\)<\/span> là cơ sở <strong>trực chuẩn<\/strong> thì <span class=\"mjx-i\">\\(B^\\top B = I\\)<\/span>, công thức rút gọn thành <span class=\"mjx-i\">\\(P_\\pi = BB^\\top\\)<\/span>.<\/p>\n<\/blockquote>\n<h3>Tính chất của ma trận chiếu <span class=\"mjx-i\">\\(P_\\pi\\)<\/span><\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(P_\\pi^\\top = P_\\pi\\)<\/span> (đối xứng)<\/li>\n<li><span class=\"mjx-i\">\\(P_\\pi^2 = P_\\pi\\)<\/span> (idempotent — chiếu 2 lần vẫn ra kết quả như chiếu 1 lần)<\/li>\n<\/ul>\n<h3>Khoảng cách từ điểm đến không gian con<\/h3>\n<p><div class=\"mjx-d\">\\[d(x, U) = \\lVert x - \\pi_U(x)\\rVert\\]<\/div><\/p>\n<p>đây chính là khoảng cách ngắn nhất từ <span class=\"mjx-i\">\\(x\\)<\/span> đến bất kỳ điểm nào trong <span class=\"mjx-i\">\\(U\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ<\/h3>\n<p><strong>Example:<\/strong> Project <span class=\"mjx-i\">\\(x=(2,3)\\)<\/span> onto the line <span class=\"mjx-i\">\\(U=\\text{span}\\{(1,0)\\}\\)<\/span> (dot product).<\/p>\n<p><em>Dịch đề:<\/em> <strong>Ví dụ:<\/strong> Chiếu <span class=\"mjx-i\">\\(x=(2,3)\\)<\/span> lên đường thẳng <span class=\"mjx-i\">\\(U=\\text{span}\\{(1,0)\\}\\)<\/span> (dot product).<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\pi_U(x) = \\dfrac{\\langle x,b\\rangle}{\\langle b,b\\rangle} b = \\dfrac{2}{1}(1,0) = (2,0)\\)<\/span><\/li>\n<li>Khoảng cách: <span class=\"mjx-i\">\\(d(x,U) = \\lVert (2,3)-(2,0)\\rVert = 3\\)<\/span><\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Công thức 1 chiều là <strong>trường hợp riêng<\/strong> của công thức nhiều chiều (khi <span class=\"mjx-i\">\\(k=1\\)<\/span>, <span class=\"mjx-i\">\\(B=b\\)<\/span>).<\/li>\n<li>Nếu cơ sở đã trực chuẩn thì <strong>không cần nghịch đảo ma trận<\/strong> <span class=\"mjx-i\">\\((B^\\top B)^{-1}\\)<\/span> — tiết kiệm rất nhiều bước tính.<\/li>\n<li><span class=\"mjx-i\">\\(x - \\pi_U(x)\\)<\/span> luôn nằm trong <span class=\"mjx-i\">\\(U^\\perp\\)<\/span> — đây là cách kiểm tra kết quả chiếu có đúng không.<\/li>\n<\/ul>\n<\/div><hr/>\n<h1 id=\"MAI391-3-h9\"><span class=\"pn\">Phần 2<\/span>Đề thi thường ra gì ở chương 3<\/h1>\n<p><em>Thống kê từ 10 đề MAI391: FA24-RE, FA24-FE, SU24-RE, SP25-RE, 4 mã đề SP26, và 2 đề MAI391 không ghi kỳ (bên dưới gọi là <strong>Đề A<\/strong> và <strong>Đề B<\/strong>).<\/em><\/p>\n<p><strong>Quy luật:<\/strong> các đề FA24, SU24, SP25, Đề A và Đề B đều xếp <strong>câu 1 đến câu 7 là Chương 3<\/strong>, theo thứ tự cố định: norm → inner product → độ dài/khoảng cách → góc → Gram–Schmidt → phần bù trực giao → hình chiếu. Các đề SP26 xáo trộn vị trí nhưng vẫn có 6–7 câu Chương 3, tức khoảng <strong>7/40 câu<\/strong>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dạng<\/th>\n<th>Câu thường gặp<\/th>\n<th>Số đề có<\/th>\n<th>Kiểu hỏi chủ yếu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Norm<\/strong><\/td>\n<td>Câu 1<\/td>\n<td>10/10<\/td>\n<td>Chuẩn Euclid/Manhattan của <span class=\"mjx-i\">\\(2x+y\\)<\/span>; tìm <span class=\"mjx-i\">\\(c\\)<\/span> để vector là unit vector; Frobenius; norm của hàm<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Nhận diện inner product<\/strong><\/td>\n<td>Câu 2<\/td>\n<td>9/10<\/td>\n<td>(i)/(ii) cái nào là inner product; ma trận đối xứng xác định dương; tìm <span class=\"mjx-i\">\\(\\alpha+\\beta\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>3. Độ dài &amp; khoảng cách<\/strong><\/td>\n<td>Câu 3<\/td>\n<td>10/10<\/td>\n<td>Độ dài/khoảng cách theo <span class=\"mjx-i\">\\(x^\\top Ay\\)<\/span> hoặc theo biểu thức khai triển<\/td>\n<\/tr>\n<tr>\n<td><strong>4. Góc &amp; trực giao<\/strong><\/td>\n<td>Câu 4<\/td>\n<td>9/10<\/td>\n<td><span class=\"mjx-i\">\\(\\cos\\theta\\)<\/span>, góc <span class=\"mjx-i\">\\(\\theta\\)<\/span>, tìm <span class=\"mjx-i\">\\(a\\)<\/span> để hai vector trực giao<\/td>\n<\/tr>\n<tr>\n<td><strong>5. Gram–Schmidt<\/strong><\/td>\n<td>Câu 5<\/td>\n<td>10/10<\/td>\n<td>Hỏi <strong>một tọa độ<\/strong> của <span class=\"mjx-i\">\\(E_2\\)<\/span> hoặc <span class=\"mjx-i\">\\(E_3\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>6. Phần bù trực giao<\/strong><\/td>\n<td>Câu 6<\/td>\n<td>9/10<\/td>\n<td>Mệnh đề đúng/sai; <span class=\"mjx-i\">\\(\\dim U^\\perp\\)<\/span>; tìm <span class=\"mjx-i\">\\(U^\\perp\\)<\/span>; vector nào thuộc <span class=\"mjx-i\">\\(U^\\perp\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>7. Hình chiếu trực giao<\/strong><\/td>\n<td>Câu 7<\/td>\n<td>10/10<\/td>\n<td>Một tọa độ của hình chiếu; phần tử <span class=\"mjx-i\">\\(a_{ij}\\)<\/span> của ma trận chiếu; tính chất <span class=\"mjx-i\">\\(P\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>8. Ma trận trực giao<\/strong><\/td>\n<td>rải rác<\/td>\n<td>1/10<\/td>\n<td>Tìm tham số để <span class=\"mjx-i\">\\(A\\)<\/span> là ma trận trực giao<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-3-h10\"><span class=\"pn\">Phần 3<\/span>Các dạng bài<\/h1>\n<p>Mỗi dạng gồm: cách nhận biết → công thức → cách làm → <strong>ví dụ mẫu (giải chi tiết)<\/strong> → lỗi thường gặp → <strong>mẹo nhanh / thử đáp án / cách khác / bấm máy Casio<\/strong> → <strong>câu đề thật<\/strong> (chép nguyên văn như trong đề, để tự luyện).<\/p>\n<p>Ghi chú nguồn: <code>[FA24-RE Q1]<\/code> = đề FA24 thi lại, câu 1. Câu nào xuất hiện ở nhiều đề thì chỉ chép một lần và ghi đủ các nguồn (thứ tự A/B/C/D có thể khác giữa các đề).<\/p>\n<h2 id=\"MAI391-3-h11\">Chuẩn bị: các chế độ Casio fx-580VN X dùng cho Chương 3<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Việc cần làm<\/th>\n<th>Chế độ<\/th>\n<th>Thao tác<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Nhập vector (2 hoặc 3 chiều)<\/td>\n<td><code>MENU<\/code> → Vector<\/td>\n<td><code>OPTN<\/code> → Define Vector → chọn VctA…VctD → số chiều → nhập<\/td>\n<\/tr>\n<tr>\n<td>Tích vô hướng, độ dài, góc, tích có hướng<\/td>\n<td>Vector<\/td>\n<td><code>VctA•VctB<\/code> (<code>OPTN<\/code> → Dot Product); <code>Abs(VctA)<\/code> (<code>SHIFT<\/code> <code>hyp<\/code>); <code>Angle(VctA,VctB)<\/code>; <code>VctA×VctB<\/code><\/td>\n<\/tr>\n<tr>\n<td>Nhập ma trận (tối đa <span class=\"mjx-i\">\\(4\\times4\\)<\/span>)<\/td>\n<td><code>MENU<\/code> → Matrix<\/td>\n<td><code>OPTN<\/code> → Define Matrix → MatA…MatD → số hàng, cột → nhập<\/td>\n<\/tr>\n<tr>\n<td>Chuyển vị, định thức, nghịch đảo<\/td>\n<td>Matrix<\/td>\n<td><code>OPTN<\/code> → Transposition (Trn), Determinant (Det); nghịch đảo bằng phím <code>x⁻¹<\/code><\/td>\n<\/tr>\n<tr>\n<td>Thay số vào biểu thức<\/td>\n<td>Calculate<\/td>\n<td>Gõ biểu thức có biến X, Y (<code>ALPHA<\/code> + phím có chữ X, Y), bấm <code>CALC<\/code>, nhập giá trị<\/td>\n<\/tr>\n<tr>\n<td>Giải phương trình 1 ẩn<\/td>\n<td>Calculate<\/td>\n<td>Gõ phương trình (dấu <code>=<\/code> là <code>ALPHA<\/code> <code>CALC<\/code>), bấm <code>SHIFT<\/code> <code>CALC<\/code> (SOLVE)<\/td>\n<\/tr>\n<tr>\n<td>Giải hệ 2–3 ẩn<\/td>\n<td><code>MENU<\/code> → Equation/Func<\/td>\n<td>Simultaneous Equation → số ẩn → nhập hệ số<\/td>\n<\/tr>\n<tr>\n<td>Tích phân xác định<\/td>\n<td>Calculate<\/td>\n<td>Phím <code>∫<\/code><\/td>\n<\/tr>\n<tr>\n<td>Đổi thập phân ↔ phân số/căn<\/td>\n<td>mọi chế độ<\/td>\n<td>Phím <code>S⇔D<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Lưu ý:<\/strong> Vector mode chỉ có 2–3 chiều; vector trong <span class=\"mjx-i\">\\(\\mathbb{R}^4\\)<\/span> thì gõ trực tiếp ở Calculate, hoặc nhập thành ma trận cột <span class=\"mjx-i\">\\(4\\times1\\)<\/span> trong Matrix mode. Thứ tự mục trong <code>OPTN<\/code>/<code>MENU<\/code> có thể hơi khác theo phiên bản máy, nên hãy tìm theo <strong>tên mục<\/strong>. Mẹo nhận dạng căn: kết quả <span class=\"mjx-i\">\\(1{,}4142\\)<\/span> thì bấm <code>Ans²<\/code> ra <span class=\"mjx-i\">\\(2\\)<\/span>, tức là <span class=\"mjx-i\">\\(\\sqrt2\\)<\/span>.<\/p>\n<\/blockquote>\n<hr/>\n<hr/>\n<h2 id=\"MAI391-3-h12\">Dạng 1: Norm của vector (và norm mở rộng)<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p>Đề có chữ <em>Euclidean norm<\/em>, <em>Manhattan norm<\/em>, <em><span class=\"mjx-i\">\\(\\ell_1\\)<\/span>/<span class=\"mjx-i\">\\(\\ell_2\\)<\/span>-norm<\/em>, <em>unit vector<\/em>, <em>Frobenius norm<\/em>, hoặc norm định nghĩa bằng tích phân.<\/p>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[\\lVert x\\rVert_1=\\sum|x_i| \\qquad \\lVert x\\rVert_2=\\sqrt{\\textstyle\\sum x_i^2} \\qquad \\lVert A\\rVert_F=\\sqrt{\\textstyle\\sum_{i,j}a_{ij}^2} \\qquad \\lVert f\\rVert=\\sqrt{\\textstyle\\int_a^b f(x)^2\\,dx}\\]<\/div>\n<em>Unit vector<\/em> nghĩa là <span class=\"mjx-i\">\\(\\lVert x\\rVert=1\\)<\/span>.<\/p>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Nếu đề cho tổ hợp (<span class=\"mjx-i\">\\(2x+y\\)<\/span>, <span class=\"mjx-i\">\\(x-2y\\)<\/span>…), <strong>tính vector tổ hợp trước<\/strong>, rồi mới lấy norm.<\/li>\n<li>Nếu tìm tham số: bình phương hai vế, giải, rồi <strong>lọc theo dấu<\/strong> mà đề cho (<span class=\"mjx-i\">\\(c&lt;0\\)<\/span> hay <span class=\"mjx-i\">\\(c&gt;0\\)<\/span>).<\/li>\n<li>Frobenius: coi ma trận như một vector dài, rồi lấy chuẩn Euclid.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> Let <span class=\"mjx-i\">\\(x=[1\\ -2\\ 0]^T\\)<\/span> and <span class=\"mjx-i\">\\(y=[3\\ 1\\ -1]^T\\)<\/span>. Find the Manhattan norm and the Euclidean norm of <span class=\"mjx-i\">\\(x-2y\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Bước 1, tính tổ hợp: <span class=\"mjx-i\">\\(2y=(6,2,-2)\\)<\/span>, nên <span class=\"mjx-i\">\\(x-2y=(1-6,\\ -2-2,\\ 0+2)=(-5,-4,2)\\)<\/span>.<\/li>\n<li>Bước 2, Manhattan: <span class=\"mjx-i\">\\(|-5|+|-4|+|2|=11\\)<\/span>.<\/li>\n<li>Bước 3, Euclid: <span class=\"mjx-i\">\\(\\sqrt{25+16+4}=\\sqrt{45}=3\\sqrt5\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (tìm tham số).<\/strong> Let <span class=\"mjx-i\">\\(x=[2\\ -1\\ 2\\ c]^T\\)<\/span>, where <span class=\"mjx-i\">\\(c\\)<\/span> is a negative real number. Find <span class=\"mjx-i\">\\(c\\)<\/span> such that the Euclidean norm of <span class=\"mjx-i\">\\(x\\)<\/span> is 5.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(4+1+4+c^2=25\\)<\/span>, nên <span class=\"mjx-i\">\\(c^2=16\\)<\/span> và <span class=\"mjx-i\">\\(c=\\pm4\\)<\/span>. Vì <span class=\"mjx-i\">\\(c&lt;0\\)<\/span>, chọn <span class=\"mjx-i\">\\(c=-4\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (norm của hàm).<\/strong> On <span class=\"mjx-i\">\\(C[0,1]\\)<\/span> with <span class=\"mjx-i\">\\(\\lVert f\\rVert=\\sqrt{\\int_0^1 f(x)^2dx}\\)<\/span>, compute <span class=\"mjx-i\">\\(\\lVert f\\rVert\\)<\/span> for <span class=\"mjx-i\">\\(f(x)=x\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\int_0^1x^2dx=\\tfrac13\\)<\/span>, nên <span class=\"mjx-i\">\\(\\lVert f\\rVert=\\tfrac{1}{\\sqrt3}=\\tfrac{\\sqrt3}{3}\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Manhattan quên trị tuyệt đối; Euclid quên lấy căn (đề hay đặt cả <span class=\"mjx-i\">\\(25\\)<\/span> và <span class=\"mjx-i\">\\(5\\)<\/span>, <span class=\"mjx-i\">\\(86\\)<\/span> và <span class=\"mjx-i\">\\(\\sqrt{86}\\)<\/span> làm đáp án nhiễu).<\/li>\n<li>Câu hỏi cả <span class=\"mjx-i\">\\(L_1\\)<\/span> và <span class=\"mjx-i\">\\(L_2\\)<\/span> thì đáp án nhiễu hay <strong>đảo vị trí<\/strong> hai giá trị. Luôn có <span class=\"mjx-i\">\\(L_2\\le L_1\\)<\/span>.<\/li>\n<li>Tìm <span class=\"mjx-i\">\\(c\\)<\/span> ra <span class=\"mjx-i\">\\(\\pm\\)<\/span> nhưng không chọn đúng dấu.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li>Câu tìm <span class=\"mjx-i\">\\(c\\)<\/span> để <span class=\"mjx-i\">\\(\\lVert x\\rVert=k\\)<\/span>: dùng ngay <span class=\"mjx-i\">\\(c^2=k^2-(\\text{tổng bình phương các tọa độ đã biết})\\)<\/span>. Ví dụ Câu 1.4: <span class=\"mjx-i\">\\(c^2=1-\\tfrac34=\\tfrac14\\)<\/span>.<\/li>\n<li>Câu hỏi cả <span class=\"mjx-i\">\\(L_1\\)<\/span> và <span class=\"mjx-i\">\\(L_2\\)<\/span>: luôn có <span class=\"mjx-i\">\\(L_2\\le L_1\\le\\sqrt n\\,L_2\\)<\/span>, nên loại ngay đáp án có <span class=\"mjx-i\">\\(L_1&lt;L_2\\)<\/span>.<\/li>\n<li>Đáp án dạng căn: tính tổng bình phương rồi so trực tiếp với số trong căn, không cần lấy căn.<\/li>\n<\/ul>\n<p><strong>Thử đáp án<\/strong><\/p>\n<ul>\n<li>Thay từng giá trị <span class=\"mjx-i\">\\(c\\)<\/span> vào và kiểm tra tổng bình phương có bằng <span class=\"mjx-i\">\\(k^2\\)<\/span> không, đồng thời đúng dấu đề cho.<\/li>\n<li>Câu 1.7: tính <span class=\"mjx-i\">\\(\\lVert f\\rVert\\approx0{,}5774\\)<\/span>, rồi thử <span class=\"mjx-i\">\\(\\sqrt3/b\\)<\/span> với từng <span class=\"mjx-i\">\\(b\\)<\/span>; chỉ <span class=\"mjx-i\">\\(b=3\\)<\/span> cho <span class=\"mjx-i\">\\(0{,}5774\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><em>Euclid trong <span class=\"mjx-i\">\\(\\mathbb{R}^2,\\mathbb{R}^3\\)<\/span> (Vector mode):<\/em> nhập VctA <span class=\"mjx-i\">\\(=x\\)<\/span>, VctB <span class=\"mjx-i\">\\(=y\\)<\/span>, AC, rồi gõ <code>Abs(2VctA+VctB)<\/code> (Abs: <code>SHIFT<\/code> <code>hyp<\/code>) và bấm <code>=<\/code>.<\/li>\n<li><em>Trong <span class=\"mjx-i\">\\(\\mathbb{R}^4\\)<\/span> hoặc Manhattan (Calculate mode):<\/em> gõ thẳng <code>√(1²+(-2)²+4²+5²)<\/code>; Manhattan thì gõ <code>Abs(-5)+Abs(5)+Abs(6)<\/code> hoặc tính nhẩm.<\/li>\n<li><em>Tìm <span class=\"mjx-i\">\\(c\\)<\/span>:<\/em> gõ <code>1/4+1/4+1/4+X²=1<\/code> (dấu <code>=<\/code> là <code>ALPHA<\/code> <code>CALC<\/code>), bấm <code>SHIFT<\/code> <code>CALC<\/code> (SOLVE), nhập giá trị đầu <strong>âm<\/strong> (ví dụ <span class=\"mjx-i\">\\(-1\\)<\/span>) để máy ra nghiệm âm <span class=\"mjx-i\">\\(-0{,}5\\)<\/span>.<\/li>\n<li><em>Norm của hàm:<\/em> gõ <code>∫(1-X)²<\/code> cận <span class=\"mjx-i\">\\(0\\)<\/span> đến <span class=\"mjx-i\">\\(1\\)<\/span>, ra <span class=\"mjx-i\">\\(0{,}3333\\)<\/span>. Bấm <code>√(Ans)<\/code> ra <span class=\"mjx-i\">\\(0{,}5774\\)<\/span>, rồi <code>√3÷Ans<\/code> ra <span class=\"mjx-i\">\\(3\\)<\/span>, chính là <span class=\"mjx-i\">\\(b\\)<\/span>.<\/li>\n<li><em>Frobenius:<\/em> gõ <code>√(4²+1²+2²+2²)<\/code> (bỏ qua các số 0).<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">7 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-3-q1\"><strong>Câu 1.1<\/strong> <code>[Đề A Q1] [SU24-RE Q1] [SP26 Q17]<\/code>\nLet <span class=\"mjx-i\">\\(x = [1\\ 1\\ 1]^T\\)<\/span> and <span class=\"mjx-i\">\\(y = [-2\\ 1\\ 2]^T\\)<\/span> be vectors in <span class=\"mjx-i\">\\(\\mathbb{R}^3\\)<\/span>. Find the Euclidean norm of <span class=\"mjx-i\">\\(2x + y\\)<\/span>.<\/p>\n<ul>\n<li>A. 5<\/li>\n<li>B. 7<\/li>\n<li>C. 4<\/li>\n<li>D. 25<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-3-q2\"><strong>Câu 1.2<\/strong> <code>[FA24-FE Q1]<\/code>\nLet <span class=\"mjx-i\">\\(\\mathbf{x} = [-2\\ 1\\ 2]^T\\)<\/span> and <span class=\"mjx-i\">\\(\\mathbf{y} = [-1\\ 3\\ 2]^T\\)<\/span> be vectors in <span class=\"mjx-i\">\\(\\mathbb{R}^3\\)<\/span>. Find the Manhattan norm of <span class=\"mjx-i\">\\(2\\mathbf{x} + \\mathbf{y}\\)<\/span>.<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(16\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(86\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(4\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\sqrt{86}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-3-q3\"><strong>Câu 1.3<\/strong> <code>[SP26 Q20]<\/code> <code>[SP26 gốc Q1]<\/code>\nLet <span class=\"mjx-i\">\\(\\mathbf{x} = [1\\ \\ -2\\ \\ 4\\ \\ 5]^T\\)<\/span> in <span class=\"mjx-i\">\\(\\mathbb{R}^4\\)<\/span>. Let <span class=\"mjx-i\">\\(L_1\\)<\/span> be the <span class=\"mjx-i\">\\(l_1\\)<\/span>-norm and <span class=\"mjx-i\">\\(L_2\\)<\/span> the <span class=\"mjx-i\">\\(l_2\\)<\/span>-norm of <span class=\"mjx-i\">\\(\\mathbf{x}\\)<\/span>. Find <span class=\"mjx-i\">\\(L_1\\)<\/span> and <span class=\"mjx-i\">\\(L_2\\)<\/span>.<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(L_1 = 8,\\ L_2 = \\sqrt{46}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(L_1 = \\sqrt{46},\\ L_2 = 8\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(L_1 = 12,\\ L_2 = \\sqrt{46}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(L_1 = \\sqrt{46},\\ L_2 = 12\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iii)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-3-q4\"><strong>Câu 1.4<\/strong> <code>[FA24-RE Q1]<\/code>\nLet <span class=\"mjx-i\">\\(x = \\begin{bmatrix} \\frac{1}{2} &amp; \\frac{1}{2} &amp; \\frac{1}{2} &amp; c \\end{bmatrix}^{T}\\)<\/span> be a vector in <span class=\"mjx-i\">\\(\\mathbb{R}^4\\)<\/span>, where <span class=\"mjx-i\">\\(c\\)<\/span> is a negative real number. Find <span class=\"mjx-i\">\\(c\\)<\/span> such that <span class=\"mjx-i\">\\(x\\)<\/span> is a unit vector with respect to the Euclidean norm.<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(-1/2\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(-1/4\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(-1\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(-3/4\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-3-q5\"><strong>Câu 1.5<\/strong> <code>[SP26 Q1]<\/code>\nLet <span class=\"mjx-i\">\\(x = [1\\ 2\\ 2\\ c]^T\\)<\/span> be a vector in <span class=\"mjx-i\">\\(\\mathbb{R}^4\\)<\/span>, where <span class=\"mjx-i\">\\(c\\)<\/span> is a positive real number. Find <span class=\"mjx-i\">\\(c\\)<\/span> if the Euclidean norm of <span class=\"mjx-i\">\\(x\\)<\/span> is 5.<\/p>\n<ul>\n<li>A. 4<\/li>\n<li>B. 1<\/li>\n<li>C. 20<\/li>\n<li>D. 5<\/li>\n<li>E. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-3-q6\"><strong>Câu 1.6<\/strong> <code>[Đề B Q1]<\/code>\nThe Frobenius norm of a matrix <span class=\"mjx-i\">\\(A=[a_{ij}]\\in\\mathbb{R}^{m\\times n}\\)<\/span> is defined by <span class=\"mjx-i\">\\(\\|A\\|_F=\\sqrt{\\sum_{i=1}^{m}\\sum_{j=1}^{n}a_{ij}^{2}}\\)<\/span>. Compute <span class=\"mjx-i\">\\(\\|M\\|_F\\)<\/span>, where <span class=\"mjx-i\">\\(M=\\begin{bmatrix}4&amp;0&amp;-1\\\\0&amp;-2&amp;2\\end{bmatrix}\\)<\/span>.<\/p>\n<ul>\n<li>A. 5<\/li>\n<li>B. 3<\/li>\n<li>C. 25<\/li>\n<li>D. 9<\/li>\n<li>E. None of the others<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-3-q7\"><strong>Câu 1.7<\/strong> <code>[SP25-RE Q2]<\/code>\nOn the vector space of all continuous functions on <span class=\"mjx-i\">\\([0, 1]\\)<\/span>, define the norm <span class=\"mjx-i\">\\(\\|\\cdot\\|\\)<\/span> by <span class=\"mjx-i\">\\(\\|f\\| = \\sqrt{\\int_0^1 [f(x)]^2\\,dx}\\)<\/span>. If <span class=\"mjx-i\">\\(f:[0,1]\\to\\mathbb{R}\\)<\/span>, <span class=\"mjx-i\">\\(f(x)=1-x\\)<\/span>, and <span class=\"mjx-i\">\\(\\|f\\|=\\frac{\\sqrt{3}}{b}\\)<\/span>, find the value of <span class=\"mjx-i\">\\(b\\)<\/span>.<\/p>\n<ul>\n<li>A. 6<\/li>\n<li>B. None of the others<\/li>\n<li>C. 2<\/li>\n<li>D. 3<\/li>\n<li>E. 1<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-3-h13\">Dạng 2: Nhận diện inner product / ma trận đối xứng xác định dương<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Which of the following is an inner product…\"<\/em>, <em>\"symmetric, positive definite matrix\"<\/em>, <em>\"positive definite bilinear mapping\"<\/em>, <em>\"The value of <span class=\"mjx-i\">\\(\\alpha+\\beta\\)<\/span> is\"<\/em>, <em>\"Find a symmetric matrix <span class=\"mjx-i\">\\(A\\)<\/span> such that <span class=\"mjx-i\">\\(\\langle x,y\\rangle=x^TAy\\)<\/span>\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li>Viết <span class=\"mjx-i\">\\(\\Omega(x,y)=\\sum a_{ij}x_iy_j\\)<\/span> thành ma trận: <strong>hệ số của <span class=\"mjx-i\">\\(x_iy_j\\)<\/span> nằm ở hàng <span class=\"mjx-i\">\\(i\\)<\/span>, cột <span class=\"mjx-i\">\\(j\\)<\/span><\/strong>.<\/li>\n<li><strong>Inner product<\/strong> <span class=\"mjx-i\">\\(\\iff\\)<\/span> <span class=\"mjx-i\">\\(A\\)<\/span> <strong>đối xứng<\/strong> (<span class=\"mjx-i\">\\(a_{ij}=a_{ji}\\)<\/span>) <strong>và xác định dương<\/strong>.<\/li>\n<li>Xác định dương (ma trận đối xứng): mọi định thức con chính góc trên trái đều <span class=\"mjx-i\">\\(&gt;0\\)<\/span>. Với <span class=\"mjx-i\">\\(2\\times2\\)<\/span>: <span class=\"mjx-i\">\\(a_{11}&gt;0\\)<\/span> và <span class=\"mjx-i\">\\(\\det A&gt;0\\)<\/span>.<\/li>\n<li><strong>\"Positive definite bilinear mapping\"<\/strong> chỉ yêu cầu <span class=\"mjx-i\">\\(\\Omega(x,x)&gt;0\\)<\/span> với mọi <span class=\"mjx-i\">\\(x\\ne0\\)<\/span>, <strong>không cần đối xứng<\/strong>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li><strong>So hệ số chéo<\/strong> (<span class=\"mjx-i\">\\(x_1y_2\\)<\/span> với <span class=\"mjx-i\">\\(x_2y_1\\)<\/span>…). Lệch nhau thì không phải inner product.<\/li>\n<li>Đối xứng rồi thì kiểm tra <span class=\"mjx-i\">\\(a_{11}&gt;0\\)<\/span> và <span class=\"mjx-i\">\\(\\det&gt;0\\)<\/span> (ma trận <span class=\"mjx-i\">\\(3\\times3\\)<\/span> thì thêm định thức con <span class=\"mjx-i\">\\(2\\times2\\)<\/span> và <span class=\"mjx-i\">\\(\\det A\\)<\/span>).<\/li>\n<li>Câu tìm <span class=\"mjx-i\">\\(\\alpha,\\beta\\)<\/span>: ghép cặp hệ số đối xứng là ra.<\/li>\n<li>Câu \"positive definite bilinear\": tính <span class=\"mjx-i\">\\(\\Omega(x,x)\\)<\/span> (hai hệ số chéo <strong>cộng lại<\/strong> thành hệ số <span class=\"mjx-i\">\\(x_1x_2\\)<\/span>), rồi xét dấu, ví dụ bằng cách đưa về tổng bình phương.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> Let <span class=\"mjx-i\">\\(\\mathbf{x} = [x_1\\ x_2]^T\\)<\/span>, <span class=\"mjx-i\">\\(\\mathbf{y} = [y_1\\ y_2]^T\\)<\/span>. Which of the following is an inner product in <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>?<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\Omega(\\mathbf{x},\\mathbf{y}) = 2x_1y_1 + x_1y_2 + x_2y_1 + x_2y_2\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\Omega(\\mathbf{x},\\mathbf{y}) = x_1y_1 + 2x_1y_2 + 2x_2y_1 + x_2y_2\\)<\/span><\/li>\n<\/ul>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>(i): <span class=\"mjx-i\">\\(A=\\begin{bmatrix}2&amp;1\\\\1&amp;1\\end{bmatrix}\\)<\/span> đối xứng. <span class=\"mjx-i\">\\(a_{11}=2&gt;0\\)<\/span>, <span class=\"mjx-i\">\\(\\det=2-1=1&gt;0\\)<\/span>, nên là inner product.<\/li>\n<li>(ii): <span class=\"mjx-i\">\\(A=\\begin{bmatrix}1&amp;2\\\\2&amp;1\\end{bmatrix}\\)<\/span> đối xứng nhưng <span class=\"mjx-i\">\\(\\det=1-4=-3&lt;0\\)<\/span>, nên không xác định dương.<\/li>\n<li>Kết luận: <strong>chỉ (i)<\/strong>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (tìm <span class=\"mjx-i\">\\(\\alpha+\\beta\\)<\/span>).<\/strong> Suppose <span class=\"mjx-i\">\\(\\langle x,y\\rangle = 3x_1y_1+\\alpha x_1y_2+2x_2y_1+4x_2y_2+\\beta x_2y_3-x_3y_2+2x_3y_3\\)<\/span> is an inner product on <span class=\"mjx-i\">\\(\\mathbb{R}^3\\)<\/span>. Find <span class=\"mjx-i\">\\(\\alpha+\\beta\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Hệ số <span class=\"mjx-i\">\\(x_1y_2\\)<\/span> phải bằng hệ số <span class=\"mjx-i\">\\(x_2y_1\\)<\/span>, nên <span class=\"mjx-i\">\\(\\alpha=2\\)<\/span>.<\/li>\n<li>Hệ số <span class=\"mjx-i\">\\(x_2y_3\\)<\/span> phải bằng hệ số <span class=\"mjx-i\">\\(x_3y_2\\)<\/span>, nên <span class=\"mjx-i\">\\(\\beta=-1\\)<\/span>.<\/li>\n<li>Vậy <span class=\"mjx-i\">\\(\\alpha+\\beta=1\\)<\/span>. (Kiểm tra: <span class=\"mjx-i\">\\(A=\\begin{bmatrix}3&amp;2&amp;0\\\\2&amp;4&amp;-1\\\\0&amp;-1&amp;2\\end{bmatrix}\\)<\/span> có các định thức con <span class=\"mjx-i\">\\(3,\\ 8,\\ 13\\)<\/span> đều dương.)<\/li>\n<\/ul>\n<p><strong>Ví dụ 3 (positive definite bilinear).<\/strong> Is <span class=\"mjx-i\">\\(\\Omega(x,y)=x_1y_1+3x_1y_2-x_2y_1+2x_2y_2\\)<\/span> a positive definite bilinear mapping? Is it an inner product?<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\Omega(x,x)=x_1^2+(3-1)x_1x_2+2x_2^2=x_1^2+2x_1x_2+2x_2^2=(x_1+x_2)^2+x_2^2&gt;0\\)<\/span> với mọi <span class=\"mjx-i\">\\(x\\ne0\\)<\/span>, nên <strong>xác định dương<\/strong>.<\/li>\n<li>Nhưng hệ số <span class=\"mjx-i\">\\(x_1y_2\\)<\/span> là <span class=\"mjx-i\">\\(3\\)<\/span>, khác hệ số <span class=\"mjx-i\">\\(x_2y_1\\)<\/span> là <span class=\"mjx-i\">\\(-1\\)<\/span>, nên không đối xứng và <strong>không phải inner product<\/strong>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Ma trận đối xứng có <strong>phần tử chéo âm<\/strong> (như <span class=\"mjx-i\">\\(\\mathrm{diag}(-1,2)\\)<\/span>) thì <strong>không<\/strong> xác định dương.<\/li>\n<li>Mọi phần tử dương <strong>không<\/strong> có nghĩa là xác định dương (ví dụ <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;3\\\\3&amp;5\\end{bmatrix}\\)<\/span> có <span class=\"mjx-i\">\\(\\det&lt;0\\)<\/span>).<\/li>\n<li>Nhầm \"positive definite bilinear\" với \"inner product\".<\/li>\n<li>Đọc nhầm thứ tự số hạng: <span class=\"mjx-i\">\\(4x_2y_2+x_1y_1\\)<\/span> ứng với <span class=\"mjx-i\">\\(\\mathrm{diag}(1,4)\\)<\/span>, không phải <span class=\"mjx-i\">\\(\\mathrm{diag}(4,1)\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh: loại theo thứ tự 3 bước, dừng ngay khi bị loại<\/strong><\/p>\n<ol>\n<li>Hệ số chéo lệch nhau (<span class=\"mjx-i\">\\(a_{12}\\ne a_{21}\\)<\/span>) thì <strong>không phải inner product<\/strong>.<\/li>\n<li>Có phần tử đường chéo <span class=\"mjx-i\">\\(\\le0\\)<\/span> thì <strong>không xác định dương<\/strong>.<\/li>\n<li>Ma trận <span class=\"mjx-i\">\\(2\\times2\\)<\/span> đối xứng, đường chéo dương: chỉ cần kiểm tra <span class=\"mjx-i\">\\(a_{11}a_{22}&gt;a_{12}^2\\)<\/span>.<\/li>\n<\/ol>\n<p><strong>Mẹo cho \"positive definite bilinear\" (không đối xứng):<\/strong> <span class=\"mjx-i\">\\(\\Omega\\)<\/span> xác định dương <span class=\"mjx-i\">\\(\\iff\\)<\/span> <strong>phần đối xứng<\/strong> <span class=\"mjx-i\">\\(A_s=\\tfrac{A+A^\\top}{2}\\)<\/span> xác định dương. Tức là thay hai hệ số chéo bằng <strong>trung bình cộng<\/strong> của chúng, rồi kiểm tra như bình thường.\nVí dụ Câu 2.3 (i): chéo <span class=\"mjx-i\">\\(-1,-2\\)<\/span>, trung bình <span class=\"mjx-i\">\\(-1{,}5\\)<\/span>; <span class=\"mjx-i\">\\(A_s=\\begin{bmatrix}3&amp;-1{,}5\\\\-1{,}5&amp;1\\end{bmatrix}\\)<\/span> có <span class=\"mjx-i\">\\(3\\cdot1=3&gt;2{,}25\\)<\/span>, nên xác định dương.<\/p>\n<p><strong>Thử đáp án bằng phản ví dụ<\/strong>\nThử <span class=\"mjx-i\">\\(x=(1,-1)\\)<\/span> và <span class=\"mjx-i\">\\(x=(1,1)\\)<\/span> vào <span class=\"mjx-i\">\\(\\Omega(x,x)\\)<\/span>. Chỉ cần một giá trị <span class=\"mjx-i\">\\(\\le0\\)<\/span> là loại ngay.\nVí dụ <span class=\"mjx-i\">\\(\\begin{bmatrix}1&amp;3\\\\3&amp;5\\end{bmatrix}\\)<\/span> với <span class=\"mjx-i\">\\(x=(1,-1)\\)<\/span>: <span class=\"mjx-i\">\\(1-6+5=0\\)<\/span>, nên <strong>không<\/strong> xác định dương. (Ra dương hết thì chưa chắc đúng, vẫn phải kiểm tra định thức.)<\/p>\n<p><strong>Cách khác:<\/strong> thay vì định thức, đưa <span class=\"mjx-i\">\\(\\Omega(x,x)\\)<\/span> về tổng bình phương (như Ví dụ 3).<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><em>Định thức (Matrix mode):<\/em> <code>OPTN<\/code> → Define Matrix → MatA, nhập ma trận. Sau đó AC, <code>OPTN<\/code> → Determinant → <code>Det(MatA)<\/code>.<\/li>\n<li><em>Ma trận <span class=\"mjx-i\">\\(3\\times3\\)<\/span>:<\/em> tính <code>Det(MatA)<\/code>; định thức con <span class=\"mjx-i\">\\(2\\times2\\)<\/span> góc trái trên thì tính nhẩm <span class=\"mjx-i\">\\(a_{11}a_{22}-a_{12}^2\\)<\/span>.<\/li>\n<li><em>Tìm phản ví dụ nhanh (Calculate mode):<\/em> gõ <span class=\"mjx-i\">\\(\\Omega(x,x)\\)<\/span>, ví dụ <code>3X²-3XY+Y²<\/code>, rồi bấm <code>CALC<\/code> và thử vài cặp <span class=\"mjx-i\">\\((X,Y)\\)<\/span>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">7 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-3-q8\"><strong>Câu 2.1<\/strong> <code>[FA24-RE Q2]<\/code>\nLet <span class=\"mjx-i\">\\(\\mathbf{x} = [x_1\\ x_2]^T\\)<\/span>, <span class=\"mjx-i\">\\(\\mathbf{y} = [y_1\\ y_2]^T\\)<\/span>. Which of the following is an inner product in <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>?<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\Omega(\\mathbf{x},\\mathbf{y}) = x_1y_1 - x_1y_2 + 3x_2y_2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\Omega(\\mathbf{x},\\mathbf{y}) = x_1y_1 - x_1y_2 - x_2y_1 + 3x_2y_2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i) only<\/p>\n<\/li>\n<li>\n<p>B. (ii) only<\/p>\n<\/li>\n<li>\n<p>C. Both (i) and (ii)<\/p>\n<\/li>\n<li>\n<p>D. None of (i) and (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-3-q9\"><strong>Câu 2.2<\/strong> <code>[SP26 Q36]<\/code> <code>[SP26 gốc Q2]<\/code>\nLet <span class=\"mjx-i\">\\(\\mathbf{x}, \\mathbf{y}\\)<\/span> in <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>. Which of the following is an inner product in <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>?<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\Omega(\\mathbf{x}, \\mathbf{y}) = \\mathbf{x}^T \\begin{bmatrix} 1 &amp; 2 \\\\ 1 &amp; 3 \\end{bmatrix} \\mathbf{y}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\Omega(\\mathbf{x}, \\mathbf{y}) = \\mathbf{x}^T \\begin{bmatrix} 2 &amp; -1 \\\\ -1 &amp; 1 \\end{bmatrix} \\mathbf{y}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. Only (i)<\/p>\n<\/li>\n<li>\n<p>B. Neither (i) nor (ii)<\/p>\n<\/li>\n<li>\n<p>C. Both (i) and (ii)<\/p>\n<\/li>\n<li>\n<p>D. Only (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-3-q10\"><strong>Câu 2.3<\/strong> <code>[FA24-FE Q2]<\/code>\nLet <span class=\"mjx-i\">\\(x = \\begin{bmatrix} x_1 &amp; x_2 \\end{bmatrix}^{T}\\)<\/span>, <span class=\"mjx-i\">\\(y = \\begin{bmatrix} y_1 &amp; y_2 \\end{bmatrix}^{T}\\)<\/span> in <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>. Which of the following is a positive definite bilinear mapping in <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>?<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\Omega(x,y) = 3x_1y_1 - x_1y_2 - 2x_2y_1 + x_2y_2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\Omega(x,y) = x_1y_1 + x_1y_2 - x_2y_1 + x_2y_2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. Only (i)<\/p>\n<\/li>\n<li>\n<p>B. Only (ii)<\/p
