/span>. Nút cộng <span class=\"mjx-i\">\\(f=b+c\\)<\/span>: <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial b}=\\dfrac{\\partial f}{\\partial c}=1\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Viết từng nút trung gian theo nút trước nó (đọc từ trái sang phải).<\/li>\n<li>Câu công thức <span class=\"mjx-i\">\\(f\\)<\/span>: thế ngược từ <span class=\"mjx-i\">\\(f\\)<\/span> về <span class=\"mjx-i\">\\(x\\)<\/span>.<\/li>\n<li>Câu <span class=\"mjx-i\">\\(\\partial f/\\partial x\\)<\/span>: liệt kê <strong>mọi đường đi<\/strong> từ <span class=\"mjx-i\">\\(x\\)<\/span> đến <span class=\"mjx-i\">\\(f\\)<\/span>; mỗi đường là một tích; cộng lại.<\/li>\n<li>Câu giá trị: tính <strong>xuôi<\/strong> các nút tại điểm đã cho (forward pass), rồi tính các đạo hàm cục bộ và nhân/cộng (backward pass).<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (công thức <span class=\"mjx-i\">\\(f\\)<\/span> và <span class=\"mjx-i\">\\(\\partial f/\\partial x\\)<\/span>).<\/strong> Graph: <span class=\"mjx-i\">\\(x\\xrightarrow{(\\cdot)^2}a\\)<\/span>; <span class=\"mjx-i\">\\(a\\xrightarrow{\\sin}b\\)<\/span>; <span class=\"mjx-i\">\\(a\\xrightarrow{\\exp}c\\)<\/span>; <span class=\"mjx-i\">\\(b,c\\xrightarrow{\\times}f\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(a=x^2\\)<\/span>, <span class=\"mjx-i\">\\(b=\\sin a\\)<\/span>, <span class=\"mjx-i\">\\(c=e^a\\)<\/span>, <span class=\"mjx-i\">\\(f=bc\\)<\/span>, nên <span class=\"mjx-i\">\\(f=\\sin(x^2)\\,e^{x^2}\\)<\/span>.<\/li>\n<li>Có hai đường đi <span class=\"mjx-i\">\\(x\\to a\\to b\\to f\\)<\/span> và <span class=\"mjx-i\">\\(x\\to a\\to c\\to f\\)<\/span>:\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial x}=\\frac{\\partial f}{\\partial b}\\frac{\\partial b}{\\partial a}\\frac{\\partial a}{\\partial x}+\\frac{\\partial f}{\\partial c}\\frac{\\partial c}{\\partial a}\\frac{\\partial a}{\\partial x}=c\\cos a\\cdot2x+b\\,e^a\\cdot2x.\\]<\/div><\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (giá trị tại một điểm).<\/strong> Graph: <span class=\"mjx-i\">\\(x_1\\xrightarrow{(\\cdot)^2}a\\)<\/span>; <span class=\"mjx-i\">\\(x_2\\xrightarrow{\\times2}b\\)<\/span>; <span class=\"mjx-i\">\\(a,b\\xrightarrow{+}c\\)<\/span>; <span class=\"mjx-i\">\\(a\\xrightarrow{\\sin}d\\)<\/span>; <span class=\"mjx-i\">\\(c,d\\xrightarrow{\\times}f\\)<\/span>. Find <span class=\"mjx-i\">\\(\\partial f/\\partial x_1\\)<\/span> and <span class=\"mjx-i\">\\(\\partial f/\\partial x_2\\)<\/span> at <span class=\"mjx-i\">\\((x_1,x_2)=(1,1)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><strong>Xuôi:<\/strong> <span class=\"mjx-i\">\\(a=1\\)<\/span>, <span class=\"mjx-i\">\\(b=2\\)<\/span>, <span class=\"mjx-i\">\\(c=3\\)<\/span>, <span class=\"mjx-i\">\\(d=\\sin1\\)<\/span>, <span class=\"mjx-i\">\\(f=3\\sin1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\partial f/\\partial x_2\\)<\/span>: chỉ một đường <span class=\"mjx-i\">\\(x_2\\to b\\to c\\to f\\)<\/span>: <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial c}\\dfrac{\\partial c}{\\partial b}\\dfrac{\\partial b}{\\partial x_2}=d\\cdot1\\cdot2=2\\sin1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\partial f/\\partial x_1\\)<\/span>: hai đường qua <span class=\"mjx-i\">\\(c\\)<\/span> và qua <span class=\"mjx-i\">\\(d\\)<\/span>: <span class=\"mjx-i\">\\(\\big(\\tfrac{\\partial f}{\\partial c}\\tfrac{\\partial c}{\\partial a}+\\tfrac{\\partial f}{\\partial d}\\tfrac{\\partial d}{\\partial a}\\big)\\tfrac{\\partial a}{\\partial x_1}=(d\\cdot1+c\\cos a)\\cdot2x_1=2\\sin1+6\\cos1\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 3 (đồ thị với vector).<\/strong> <span class=\"mjx-i\">\\(x\\in\\mathbb{R}^2\\xrightarrow{y=Ax}y\\xrightarrow{z=\\lVert y\\rVert^2}z\\xrightarrow{t=z^2}t\\)<\/span>, <span class=\"mjx-i\">\\(A=\\begin{bmatrix}1&amp;0\\\\1&amp;1\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(x=(1,1)^\\top\\)<\/span>. Find <span class=\"mjx-i\">\\(\\partial t/\\partial x\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Xuôi: <span class=\"mjx-i\">\\(y=(1,2)\\)<\/span>, <span class=\"mjx-i\">\\(z=5\\)<\/span>, <span class=\"mjx-i\">\\(t=25\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial t}{\\partial z}=2z=10\\)<\/span>; <span class=\"mjx-i\">\\(\\dfrac{\\partial z}{\\partial y}=2y^\\top=(2,4)\\)<\/span>; <span class=\"mjx-i\">\\(\\dfrac{\\partial y}{\\partial x}=A\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial t}{\\partial x}=10\\cdot(2,4)\\begin{bmatrix}1&amp;0\\\\1&amp;1\\end{bmatrix}=10\\cdot(6,4)=(60,40)\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Bỏ sót một đường đi khi nút tách nhánh (chọn đáp án chỉ có một tích).<\/li>\n<li>Viết nhầm nút cộng thành nút nhân khi đọc hình.<\/li>\n<li>Câu đồ thị có <span class=\"mjx-i\">\\(A x\\)<\/span>: nhân <span class=\"mjx-i\">\\(A\\)<\/span> ở <strong>bên phải<\/strong> gradient hàng.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Đếm số đường đi<\/strong> từ biến đầu vào đến <span class=\"mjx-i\">\\(f\\)<\/span>: bằng số <strong>tích<\/strong> trong đáp án đúng. Câu chọn công thức thường loại được ngay 2 đáp án.<\/li>\n<li>Nút cuối là phép <strong>nhân<\/strong> <span class=\"mjx-i\">\\(f=d\\cdot e\\)<\/span> thì <span class=\"mjx-i\">\\(\\partial f/\\partial d=e\\)<\/span>; nếu đáp án ghi <span class=\"mjx-i\">\\(\\tfrac{\\partial f}{\\partial d}\\)<\/span> hay <span class=\"mjx-i\">\\(e\\)<\/span> thì đều đúng nghĩa. Đáp án dạng \"<span class=\"mjx-i\">\\(e\\frac{\\partial d}{\\partial c}\\cdots+d\\frac{\\partial e}{\\partial c}\\cdots\\)<\/span>\" chính là đã thay sẵn.<\/li>\n<li><strong>Cách khác:<\/strong> viết hẳn <span class=\"mjx-i\">\\(f\\)<\/span> thành biểu thức của <span class=\"mjx-i\">\\(x\\)<\/span> (thế ngược), rồi đạo hàm bình thường.<\/li>\n<\/ul>\n<p><strong>Thử đáp án (câu công thức <span class=\"mjx-i\">\\(f\\)<\/span>):<\/strong> chọn <span class=\"mjx-i\">\\(x=0\\)<\/span> hoặc <span class=\"mjx-i\">\\(x=1\\)<\/span>, tính <span class=\"mjx-i\">\\(f\\)<\/span> theo đồ thị (xuôi từng nút) và tính từng đáp án; đáp án nào ra cùng số là đúng.<\/p>\n<p><strong>Bấm máy (câu giá trị):<\/strong> viết <span class=\"mjx-i\">\\(f\\)<\/span> thành một biểu thức theo X (và Y), rồi dùng d/dx tại điểm (biến còn lại thay số). Ví dụ 2: <span class=\"mjx-i\">\\(f=(x_1^2+2x_2)\\sin(x_1^2)\\)<\/span>, gõ <code>d/dx((X²+2×1)sin(X²))|x=1<\/code> ra <span class=\"mjx-i\">\\(2\\sin1+6\\cos1\\approx4{,}924\\)<\/span>.<\/p>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">15 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-5-q35\"><strong>Câu 5.1<\/strong> <code>[SP26 Q1]<\/code> <code>[SP26 gốc Q22]<\/code>\nGiven the computation graph. Find the partial derivative <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial x_2}\\)<\/span> at <span class=\"mjx-i\">\\(x_1 = 1, x_2 = 2\\)<\/span> .\n[Computation graph diagram:\nInput <span class=\"mjx-i\">\\(x_1\\)<\/span> goes to <span class=\"mjx-i\">\\((\\cdot)^2\\)<\/span> to produce <span class=\"mjx-i\">\\(a\\)<\/span> .\nInput <span class=\"mjx-i\">\\(x_2\\)<\/span> goes to <span class=\"mjx-i\">\\((\\cdot) \\times 3\\)<\/span> to produce <span class=\"mjx-i\">\\(b\\)<\/span> . <span class=\"mjx-i\">\\(a\\)<\/span> goes to <span class=\"mjx-i\">\\(\\cos(\\cdot)\\)<\/span> to produce <span class=\"mjx-i\">\\(d\\)<\/span> . <span class=\"mjx-i\">\\(a\\)<\/span> and <span class=\"mjx-i\">\\(b\\)<\/span> go to <span class=\"mjx-i\">\\(+\\)<\/span> to produce <span class=\"mjx-i\">\\(c\\)<\/span> . <span class=\"mjx-i\">\\(d\\)<\/span> and <span class=\"mjx-i\">\\(c\\)<\/span> go to <span class=\"mjx-i\">\\(\\times\\)<\/span> to produce <span class=\"mjx-i\">\\(f\\)<\/span> .]<\/p>\n<ul>\n<li>A. -3cos(1)<\/li>\n<li>B. 3cos(1)<\/li>\n<li>C. -14sin(1)+2cos(1)<\/li>\n<li>D. 14sin(1)-2cos(1)<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q36\"><strong>Câu 5.2<\/strong> <code>[SP26 Q5]<\/code>\nConsider a computation graph with inputs <span class=\"mjx-i\">\\(x_1, x_2, x_3\\)<\/span> , function value <span class=\"mjx-i\">\\(f\\)<\/span> and intermediate variables <span class=\"mjx-i\">\\(a, b, c, d\\)<\/span> . Find the formula of <span class=\"mjx-i\">\\(f\\)<\/span> .\n[Diagram of a computation graph: <span class=\"mjx-i\">\\(x_1\\)<\/span> and <span class=\"mjx-i\">\\(x_2\\)<\/span> are multiplied ( <span class=\"mjx-i\">\\(\\times\\)<\/span> ) to get <span class=\"mjx-i\">\\(a\\)<\/span> , then exponentiated ( <span class=\"mjx-i\">\\(\\exp(\\cdot)\\)<\/span> ) to get <span class=\"mjx-i\">\\(b\\)<\/span> . <span class=\"mjx-i\">\\(x_2\\)<\/span> and <span class=\"mjx-i\">\\(x_3\\)<\/span> are added ( <span class=\"mjx-i\">\\(+\\)<\/span> ) to get <span class=\"mjx-i\">\\(c\\)<\/span> , then sine-transformed ( <span class=\"mjx-i\">\\(\\sin(\\cdot)\\)<\/span> ) to get <span class=\"mjx-i\">\\(d\\)<\/span> . <span class=\"mjx-i\">\\(b\\)<\/span> and <span class=\"mjx-i\">\\(d\\)<\/span> are added ( <span class=\"mjx-i\">\\(+\\)<\/span> ) to get <span class=\"mjx-i\">\\(f\\)<\/span> .]<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\sin(x_2 + x_3) \\exp(x_1 x_2)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\sin(x_2 x_3) + \\exp(x_1 + x_2)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\sin(x_2 + x_3) + \\exp(x_1 x_2)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\sin(x_2 x_3) \\exp(x_1 + x_2)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (i)<\/p>\n<\/li>\n<li>\n<p>C. (iv)<\/p>\n<\/li>\n<li>\n<p>D. (iii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q37\"><strong>Câu 5.3<\/strong> <code>[SP26 Q32]<\/code>\nConsider a computation graph with inputs <span class=\"mjx-i\">\\(x_1\\)<\/span> , <span class=\"mjx-i\">\\(x_2\\)<\/span> , function value <span class=\"mjx-i\">\\(f\\)<\/span> and intermediate variables <span class=\"mjx-i\">\\(a\\)<\/span> , <span class=\"mjx-i\">\\(b\\)<\/span> , <span class=\"mjx-i\">\\(c\\)<\/span> , <span class=\"mjx-i\">\\(d\\)<\/span> . Find the formula of <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial x_2}\\)<\/span> .\n[Computation graph diagram with inputs <span class=\"mjx-i\">\\(x_1, x_2\\)<\/span> , operations <span class=\"mjx-i\">\\((\\cdot)^2\\)<\/span> , <span class=\"mjx-i\">\\(\\cos(\\cdot)\\)<\/span> , <span class=\"mjx-i\">\\((\\cdot) \\times 3\\)<\/span> , <span class=\"mjx-i\">\\(+\\)<\/span> , <span class=\"mjx-i\">\\(\\times\\)<\/span> , intermediate variables <span class=\"mjx-i\">\\(a, b, c, d\\)<\/span> , and output <span class=\"mjx-i\">\\(f\\)<\/span> .]<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial c} \\frac{\\partial c}{\\partial b} \\frac{\\partial b}{\\partial x_2}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(a \\frac{\\partial b}{\\partial a} \\frac{\\partial b}{\\partial x_2}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial d} \\frac{\\partial d}{\\partial b} \\frac{\\partial b}{\\partial x_2}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(d \\frac{\\partial c}{\\partial b} \\frac{\\partial b}{\\partial x_2}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (iv)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q38\"><strong>Câu 5.4<\/strong> <code>[SP26 Q27]<\/code> <code>[Đề A Q22]<\/code>\nConsider a computation graph with inputs <span class=\"mjx-i\">\\(x\\)<\/span> , function value <span class=\"mjx-i\">\\(f\\)<\/span> and intermediate variables <span class=\"mjx-i\">\\(a, b, c\\)<\/span> . Find the formula of <span class=\"mjx-i\">\\(f\\)<\/span> .\n[Computation graph diagram showing input <span class=\"mjx-i\">\\(x \\to [(\\cdot)^2 + 1] \\to a\\)<\/span> . From <span class=\"mjx-i\">\\(a\\)<\/span> , one path goes to <span class=\"mjx-i\">\\([\\sqrt{(\\cdot)}] \\to b\\)<\/span> , and another path goes to <span class=\"mjx-i\">\\([\\exp(\\cdot)] \\to c\\)<\/span> . Both <span class=\"mjx-i\">\\(b\\)<\/span> and <span class=\"mjx-i\">\\(c\\)<\/span> connect to a multiplication block <span class=\"mjx-i\">\\([\\times] \\to f\\)<\/span> .]<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\((x^2 + 1) \\exp(x^2 + 1)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\((x^2 + 1) \\exp(\\sqrt{x^2 + 1})\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\sqrt{x^2 + 1} \\exp(x^2 + 1)\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\sqrt{x^2 + 1} \\exp(\\sqrt{x^2 + 1})\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iv)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q39\"><strong>Câu 5.5<\/strong> <code>[SP25-RE Q21]<\/code>\nConsider a computation graph with inputs <span class=\"mjx-i\">\\(x_1\\)<\/span> , <span class=\"mjx-i\">\\(x_2\\)<\/span> , function value <span class=\"mjx-i\">\\(f\\)<\/span> and intermediate variables <span class=\"mjx-i\">\\(a\\)<\/span> , <span class=\"mjx-i\">\\(b\\)<\/span> , <span class=\"mjx-i\">\\(c\\)<\/span> . Find the formula of <span class=\"mjx-i\">\\(f\\)<\/span> .\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x_1\\to(\\cdot)^2\\to a\\)<\/span>; <span class=\"mjx-i\">\\(x_2\\to(\\cdot)^2\\to b\\)<\/span>; <span class=\"mjx-i\">\\(a,b\\to[+]\\to c\\)<\/span>; <span class=\"mjx-i\">\\(c\\to[\\exp(\\cdot)]\\)<\/span> và <span class=\"mjx-i\">\\(c\\to[\\sqrt{(\\cdot)}]\\)<\/span>; hai nhánh <span class=\"mjx-i\">\\(\\to[+]\\to f\\)<\/span>.<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(e^{x_1+x_2} + \\sqrt{x_1^2+x_2^2}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(e^{x_1^2+x_2^2} + \\sqrt{x_1+x_2}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(e^{x_1^2+x_2^2} + \\sqrt{x_1^2+x_2^2}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(e^{x_1^2+x_2^2+\\sqrt{x_1^2+x_2^2}}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q40\"><strong>Câu 5.6<\/strong> <code>[FA24-RE Q23]<\/code> <code>[Đề B Q37]<\/code>\nConsider a computation graph with inputs <span class=\"mjx-i\">\\(x\\)<\/span> , function value <span class=\"mjx-i\">\\(f\\)<\/span> and intermediate variables <span class=\"mjx-i\">\\(a\\)<\/span> , <span class=\"mjx-i\">\\(b\\)<\/span> , <span class=\"mjx-i\">\\(c\\)<\/span> . Compute <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial x}\\)<\/span> .\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x\\to[(\\cdot)^2+1]\\to a\\to[\\sqrt{(\\cdot)}]\\to b\\)<\/span>; <span class=\"mjx-i\">\\(b\\to[\\exp(\\cdot)]\\to c\\)<\/span>; <span class=\"mjx-i\">\\(b,c\\to[\\times]\\to f\\)<\/span>.<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial b}\\frac{\\partial b}{\\partial a}\\frac{\\partial a}{\\partial x}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial c}\\frac{\\partial c}{\\partial b}\\frac{\\partial b}{\\partial a}\\frac{\\partial a}{\\partial x}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial b}\\frac{\\partial b}{\\partial a}\\frac{\\partial a}{\\partial x}+\\frac{\\partial f}{\\partial c}\\frac{\\partial c}{\\partial b}\\frac{\\partial b}{\\partial a}\\frac{\\partial a}{\\partial x}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(c\\frac{\\partial f}{\\partial b}\\frac{\\partial b}{\\partial a}\\frac{\\partial a}{\\partial x}+b\\frac{\\partial f}{\\partial c}\\frac{\\partial c}{\\partial b}\\frac{\\partial b}{\\partial a}\\frac{\\partial a}{\\partial x}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q41\"><strong>Câu 5.7<\/strong> <code>[SP26 Q25]<\/code> <code>[SP26 gốc Q23]<\/code>\nConsider a computation graph with inputs <span class=\"mjx-i\">\\(x_1, x_2\\)<\/span> , function value <span class=\"mjx-i\">\\(f\\)<\/span> and intermediate variables <span class=\"mjx-i\">\\(a, b, c, d, e\\)<\/span> . Compute <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial x_1}\\)<\/span> .\n[Computation graph:\nInput <span class=\"mjx-i\">\\(x_1\\)<\/span> goes through operation <span class=\"mjx-i\">\\((\\cdot)^2\\)<\/span> to produce <span class=\"mjx-i\">\\(a\\)<\/span> .\nInput <span class=\"mjx-i\">\\(x_2\\)<\/span> goes through operation <span class=\"mjx-i\">\\((\\cdot)^2\\)<\/span> to produce <span class=\"mjx-i\">\\(b\\)<\/span> . <span class=\"mjx-i\">\\(a\\)<\/span> and <span class=\"mjx-i\">\\(b\\)<\/span> are added ( <span class=\"mjx-i\">\\(+\\)<\/span> ) to produce <span class=\"mjx-i\">\\(c\\)<\/span> . <span class=\"mjx-i\">\\(c\\)<\/span> goes through <span class=\"mjx-i\">\\(\\exp(\\cdot)\\)<\/span> to produce <span class=\"mjx-i\">\\(d\\)<\/span> , and through <span class=\"mjx-i\">\\(\\sqrt{(\\cdot)}\\)<\/span> to produce <span class=\"mjx-i\">\\(e\\)<\/span> . <span class=\"mjx-i\">\\(d\\)<\/span> and <span class=\"mjx-i\">\\(e\\)<\/span> are multiplied ( <span class=\"mjx-i\">\\(\\times\\)<\/span> ) to produce <span class=\"mjx-i\">\\(f\\)<\/span> .]<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial d} \\frac{\\partial d}{\\partial c} \\frac{\\partial c}{\\partial a} \\frac{\\partial a}{\\partial x_1}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial e} \\frac{\\partial e}{\\partial c} \\frac{\\partial c}{\\partial a} \\frac{\\partial a}{\\partial x_1}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial d} \\frac{\\partial d}{\\partial c} \\frac{\\partial c}{\\partial a} \\frac{\\partial a}{\\partial x_1} + \\frac{\\partial f}{\\partial e} \\frac{\\partial e}{\\partial c} \\frac{\\partial c}{\\partial a} \\frac{\\partial a}{\\partial x_1}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(e \\frac{\\partial d}{\\partial c} \\frac{\\partial c}{\\partial a} \\frac{\\partial a}{\\partial x_1} + d \\frac{\\partial e}{\\partial c} \\frac{\\partial c}{\\partial a} \\frac{\\partial a}{\\partial x_1}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q42\"><strong>Câu 5.8<\/strong> <code>[FA24-RE Q22]<\/code>\nA computational graph is given as bellow.\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x\\xrightarrow{\\;2x+3\\;}y\\xrightarrow{\\;y^3-3y\\;}z\\xrightarrow{\\;e^z\\;}t\\)<\/span>.\nFind all values of <span class=\"mjx-i\">\\(x\\)<\/span> such that the derivative of <span class=\"mjx-i\">\\(t\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span> is <em>(đề gốc bị mất chữ cuối; hình và đáp án giống hệt câu SP25-RE Q22, nên đây là \"is zero\")<\/em><\/p>\n<ul>\n<li>A. 2 and -3<\/li>\n<li>B. 2 and 3<\/li>\n<li>C. -2 and 3<\/li>\n<li>D. -1 and -2<\/li>\n<li>E. -2 and -3<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q43\"><strong>Câu 5.9<\/strong> <code>[SP25-RE Q22]<\/code>\nA computational graph is given as bellow.\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x\\xrightarrow{\\;2x+3\\;}y\\xrightarrow{\\;y^3-3y\\;}z\\xrightarrow{\\;e^z\\;}t\\)<\/span>.\nFind all values of <span class=\"mjx-i\">\\(x\\)<\/span> such that the derivative of <span class=\"mjx-i\">\\(t\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span> is zero.<\/p>\n<ul>\n<li>A. -2 and 3<\/li>\n<li>B. -1 and -2<\/li>\n<li>C. -2 and -3<\/li>\n<li>D. 2 and 3<\/li>\n<li>E. 2 and -3<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q44\"><strong>Câu 5.10<\/strong> <code>[Đề A Q23]<\/code>\nGiven the computation graph. Find the partial derivative <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial x_3}\\)<\/span> at <span class=\"mjx-i\">\\(x_1 = 1, x_2 = 0, x_3 = -1\\)<\/span> .\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x_1,x_2\\to[\\times]\\to a\\to[\\exp(\\cdot)]\\to b\\)<\/span>; <span class=\"mjx-i\">\\(x_2,x_3\\to[+]\\to c\\to[\\sin(\\cdot)]\\to d\\)<\/span>; <span class=\"mjx-i\">\\(b,d\\to[+]\\to f\\)<\/span>.<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 1+cos(1)<\/li>\n<li>C. cos(1)<\/li>\n<li>D. 1-cos(1)<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q45\"><strong>Câu 5.11<\/strong> <code>[Đề B Q21]<\/code> <code>[SU24-RE Q19]<\/code>\nGiven the computation graph. Find the partial derivative <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial x_1}\\)<\/span> at <span class=\"mjx-i\">\\(x_1 = 2, x_2 = -1\\)<\/span> .\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x_1\\to(\\cdot)^2\\to a\\)<\/span>; <span class=\"mjx-i\">\\(x_2\\to(\\cdot)^2\\to b\\)<\/span>; <span class=\"mjx-i\">\\(a,b\\to[+]\\to c\\)<\/span>; <span class=\"mjx-i\">\\(c\\to[\\exp(\\cdot)]\\to d\\)<\/span>; <span class=\"mjx-i\">\\(c\\to[\\sqrt{(\\cdot)}]\\to e\\)<\/span>; <span class=\"mjx-i\">\\(d,e\\to[\\times]\\to f\\)<\/span>.<\/p>\n<ul>\n<li>A. 1460.19<\/li>\n<li>B. -730.10<\/li>\n<li>C. 835.40<\/li>\n<li>D. -417.70<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q46\"><strong>Câu 5.12<\/strong> <code>[SU24-RE Q18]<\/code>\nA computational graph is given as bellow. Compute the derivative of <span class=\"mjx-i\">\\(t\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span> at <span class=\"mjx-i\">\\(x=-2\\)<\/span> .\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x\\xrightarrow{\\;f(x)=2x+3\\;}y\\xrightarrow{\\;g(y)=y^3\\;}z\\xrightarrow{\\;h(z)=e^z\\;}t\\)<\/span>.<\/p>\n<ul>\n<li>A. 2.207<\/li>\n<li>B. 3.524<\/li>\n<li>C. 2.521<\/li>\n<li>D. 3.107<\/li>\n<li>E. 3.231<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q47\"><strong>Câu 5.13<\/strong> <code>[FA24-FE Q21]<\/code>\nA computational graph is given by\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x\\xrightarrow{\\;2x+1\\;}y\\xrightarrow{\\;\\sqrt y\\;}u\\xrightarrow{\\;\\sin u\\;}p\\)<\/span>; <span class=\"mjx-i\">\\(x\\xrightarrow{\\;x+3\\;}z\\xrightarrow{\\;\\sqrt z\\;}v\\xrightarrow{\\;\\cos v\\;}q\\)<\/span>; <span class=\"mjx-i\">\\(p,q\\to[+]\\to t\\)<\/span>.\nCompute the derivative of <span class=\"mjx-i\">\\(t\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span> at <span class=\"mjx-i\">\\(x = 2\\)<\/span> .\n(Remarks: the functions sin, cos takes input values in radian).<\/p>\n<ul>\n<li>A. -0.452<\/li>\n<li>B. -0.708<\/li>\n<li>C. -1.201<\/li>\n<li>D. -2.203<\/li>\n<li>E. -1.324<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q48\"><strong>Câu 5.14<\/strong> <code>[FA24-FE Q22]<\/code>\nGiven the computation graph. Find the partial derivative <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial x_2}\\)<\/span> at <span class=\"mjx-i\">\\(x_1 = 1, x_2 = 0\\)<\/span> .\n<em>Sơ đồ đồ thị (chép từ hình trong đề):<\/em> <span class=\"mjx-i\">\\(x_1\\to(\\cdot)^2\\to a\\)<\/span>; <span class=\"mjx-i\">\\(x_2\\to(\\cdot)^2\\to b\\)<\/span>; <span class=\"mjx-i\">\\(a,b\\to[+]\\to c\\)<\/span>; <span class=\"mjx-i\">\\(c\\to[\\exp(\\cdot)]\\to d\\)<\/span>; <span class=\"mjx-i\">\\(c\\to[\\sqrt{(\\cdot)}]\\to e\\)<\/span>; <span class=\"mjx-i\">\\(d,e\\to[+]\\to f\\)<\/span>.<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(2e+1\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(0\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(2e-1\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(1\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q49\"><strong>Câu 5.15<\/strong> <code>[SP26 Q1]<\/code>\nA computational graph is given by\n[Computational graph with nodes <span class=\"mjx-i\">\\(x, y, z, t\\)<\/span> connected sequentially by arrows labeled <span class=\"mjx-i\">\\(f(x) = Ax\\)<\/span> , <span class=\"mjx-i\">\\(g(y) = \\|y\\|_2^2\\)<\/span> , and <span class=\"mjx-i\">\\(h(z) = 2z^2 - 3z\\)<\/span> respectively.]\nin which <span class=\"mjx-i\">\\(A = \\begin{pmatrix} 3 &amp; 1 \\\\ 2 &amp; -1 \\end{pmatrix}\\)<\/span> . Compute <span class=\"mjx-i\">\\(\\|\\frac{\\partial t}{\\partial x}\\|_2^2\\)<\/span> at <span class=\"mjx-i\">\\(x = (1, -1)^T\\)<\/span> .<\/p>\n<ul>\n<li>A. 1180.076<\/li>\n<li>B. 1280.076<\/li>\n<li>C. 1380.076<\/li>\n<li>D. 1580.076<\/li>\n<li>E. 1480.076<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-5-h18\">Dạng 6: Ma trận Hessian<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"<span class=\"mjx-i\">\\((i,j)\\)<\/span>-entry of the Hessian\"<\/em>, <em>\"Find the Hessian matrix … at …\"<\/em>, <em>\"determinant of the Hessian\"<\/em>, <em>\"sum of all entries on the second row / diagonal of the Hessian\"<\/em>, <span class=\"mjx-i\">\\(\\dfrac{\\partial^2f}{\\partial x\\partial y}\\)<\/span>.<\/p>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[H=\\nabla^2f=\\begin{bmatrix}f_{xx}&amp;f_{xy}&amp;f_{xz}\\\\f_{yx}&amp;f_{yy}&amp;f_{yz}\\\\f_{zx}&amp;f_{zy}&amp;f_{zz}\\end{bmatrix},\\qquad f_{xy}=f_{yx}\\ (\\text{đối xứng})\\]<\/div>\nPhần tử <span class=\"mjx-i\">\\((i,j)=\\dfrac{\\partial^2f}{\\partial x_i\\partial x_j}\\)<\/span>; thứ tự biến <span class=\"mjx-i\">\\(x,y,z\\)<\/span> là <span class=\"mjx-i\">\\(1,2,3\\)<\/span>.<\/p>\n<ul>\n<li><strong>Hàm bậc hai<\/strong> <span class=\"mjx-i\">\\(f=\\sum a_{ii}x_i^2+\\sum_{i&lt;j}a_{ij}x_ix_j+\\dots\\)<\/span>: <span class=\"mjx-i\">\\(H\\)<\/span> là hằng số, <span class=\"mjx-i\">\\(H_{ii}=2a_{ii}\\)<\/span>, <span class=\"mjx-i\">\\(H_{ij}=a_{ij}\\)<\/span> (hệ số của <span class=\"mjx-i\">\\(x_ix_j\\)<\/span>).<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Câu hỏi một phần tử <span class=\"mjx-i\">\\((i,j)\\)<\/span>: đạo hàm theo <span class=\"mjx-i\">\\(x_i\\)<\/span> rồi theo <span class=\"mjx-i\">\\(x_j\\)<\/span> (hoặc ngược lại, kết quả như nhau).<\/li>\n<li>Câu hỏi cả ma trận: tính 3 số <span class=\"mjx-i\">\\(f_{xx},f_{xy},f_{yy}\\)<\/span> (với 2 biến).<\/li>\n<li>Thay điểm <strong>sau khi<\/strong> đạo hàm xong.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (một phần tử, 3 biến).<\/strong> <span class=\"mjx-i\">\\(f(x,y,z)=x^2y+y^3-2xz+z^2\\)<\/span>. Find the <span class=\"mjx-i\">\\((1,3)\\)<\/span> and <span class=\"mjx-i\">\\((2,2)\\)<\/span> entries of the Hessian at <span class=\"mjx-i\">\\((1,2,0)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f_x=2xy-2z\\)<\/span>, nên <span class=\"mjx-i\">\\(f_{xz}=-2\\)<\/span> (phần tử <span class=\"mjx-i\">\\((1,3)\\)<\/span>). <span class=\"mjx-i\">\\(f_y=x^2+3y^2\\)<\/span>, nên <span class=\"mjx-i\">\\(f_{yy}=6y=12\\)<\/span> tại <span class=\"mjx-i\">\\(y=2\\)<\/span> (phần tử <span class=\"mjx-i\">\\((2,2)\\)<\/span>).<\/p>\n<p><strong>Ví dụ 2 (cả ma trận).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=e^{2x}(y-1)\\)<\/span>. Find <span class=\"mjx-i\">\\(H(0,2)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f_x=2e^{2x}(y-1)\\)<\/span>; <span class=\"mjx-i\">\\(f_{xx}=4e^{2x}(y-1)=4\\)<\/span>; <span class=\"mjx-i\">\\(f_{xy}=2e^{2x}=2\\)<\/span>; <span class=\"mjx-i\">\\(f_{yy}=0\\)<\/span>. Vậy <span class=\"mjx-i\">\\(H=\\begin{bmatrix}4&amp;2\\\\2&amp;0\\end{bmatrix}\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (<span class=\"mjx-i\">\\(\\det H\\)<\/span> của hàm bậc hai).<\/strong> <span class=\"mjx-i\">\\(f=x^2+3y^2+z^2+xy-2yz+5x\\)<\/span>. Find <span class=\"mjx-i\">\\(\\det H\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> Đọc ngay từ hệ số: <span class=\"mjx-i\">\\(H=\\begin{bmatrix}2&amp;1&amp;0\\\\1&amp;6&amp;-2\\\\0&amp;-2&amp;2\\end{bmatrix}\\)<\/span>, <span class=\"mjx-i\">\\(\\det H=2(12-4)-1(2-0)+0=14\\)<\/span>. (Các số hạng bậc nhất <span class=\"mjx-i\">\\(5x\\)<\/span> và hằng số không ảnh hưởng.)<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Hàm bậc hai: quên nhân 2 cho đường chéo (<span class=\"mjx-i\">\\(x^2\\to2\\)<\/span>), hoặc lại nhân 2 cho số hạng chéo (<span class=\"mjx-i\">\\(xy\\to1\\)<\/span>, <strong>không<\/strong> phải 2).<\/li>\n<li>Nhầm thứ tự biến: <span class=\"mjx-i\">\\((2,3)\\)<\/span> là <span class=\"mjx-i\">\\(f_{yz}\\)<\/span>.<\/li>\n<li>Hàm dạng <span class=\"mjx-i\">\\((x^2-xy)\\sin y\\)<\/span> tại <span class=\"mjx-i\">\\(y=0\\)<\/span>: nhiều số hạng chứa <span class=\"mjx-i\">\\(\\sin0=0\\)<\/span>; cẩn thận các số hạng chứa <span class=\"mjx-i\">\\(\\cos0=1\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Hàm bậc hai: đọc Hessian bằng mắt<\/strong>, không cần đạo hàm (Ví dụ 3).<\/li>\n<li>Chỉ cần <strong>một<\/strong> phần tử thì đạo hàm theo biến \"dễ\" trước. Ví dụ <span class=\"mjx-i\">\\(f=3xyz-x^2+3y^2-5yz\\)<\/span>, phần tử <span class=\"mjx-i\">\\((2,3)\\)<\/span>: <span class=\"mjx-i\">\\(f_z=3xy-5y\\)<\/span>, rồi <span class=\"mjx-i\">\\(f_{zy}=3x-5\\)<\/span>, nhanh hơn đạo hàm theo <span class=\"mjx-i\">\\(y\\)<\/span> trước.<\/li>\n<li>Câu chọn cả ma trận: tính <span class=\"mjx-i\">\\(f_{xx}\\)<\/span> trước (thường loại 2 đáp án), rồi đến dấu của <span class=\"mjx-i\">\\(f_{xy}\\)<\/span>.<\/li>\n<li>Hessian đã cho sẵn (dạng \"<span class=\"mjx-i\">\\(2f_{xz}+f_{yy}\\)<\/span>\"): chỉ cần đọc đúng vị trí trong ma trận.<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> câu chọn ma trận: tính một phần tử dễ nhất (thường <span class=\"mjx-i\">\\(f_{yy}\\)<\/span> hoặc <span class=\"mjx-i\">\\(f_{xx}\\)<\/span>), loại các đáp án sai phần tử đó.<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(f_{xx}(a,b)\\)<\/span>: <code>CALC<\/code> biểu thức <code>(f(X+h,Y)-2f(X,Y)+f(X-h,Y))÷h²<\/code> với <span class=\"mjx-i\">\\(h=0{,}001\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(f_{xy}(a,b)\\)<\/span>: dùng công thức hỗn hợp ở bảng đầu chương. Hoặc tính <span class=\"mjx-i\">\\(f_x\\)<\/span> bằng tay (cấp 1 dễ), rồi dùng d/dx của <span class=\"mjx-i\">\\(f_x\\)<\/span> theo <span class=\"mjx-i\">\\(y\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\det H\\)<\/span>: nhập các số vào Matrix → <code>Det<\/code>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">12 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-5-q50\"><strong>Câu 6.1<\/strong> <code>[FA24-RE Q24]<\/code> <code>[SP26 Q3]<\/code> <code>[SP26 Q25]<\/code>\nThe <span class=\"mjx-i\">\\((2, 3)\\)<\/span> -entry of the Hessian matrix of <span class=\"mjx-i\">\\(f(x,y,z)=3xyz-x^2+3y^2-5yz\\)<\/span> at <span class=\"mjx-i\">\\((1,-1,2)\\)<\/span> is<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(-2\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(-8\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(-5\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(-3\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q51\"><strong>Câu 6.2<\/strong> <code>[FA24-RE Q25]<\/code> <code>[Đề B Q22]<\/code> <code>[SP26 Q21]<\/code>\nThe <span class=\"mjx-i\">\\((2,2)\\)<\/span> -entry of the Hessian matrix of <span class=\"mjx-i\">\\(f(x,y)=(x^2-xy)\\sin y\\)<\/span> at <span class=\"mjx-i\">\\((x,y)=(1,0)\\)<\/span> is __________<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(2\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(-2\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(4\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(-4\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q52\"><strong>Câu 6.3<\/strong> <code>[SU24-RE Q21]<\/code> <code>[SP26 Q11]<\/code>\nThe <span class=\"mjx-i\">\\((2,1)\\)<\/span> -entry of the Hessian matrix of <span class=\"mjx-i\">\\(f(x,y) = (x^2 - xy)\\sin y\\)<\/span> at <span class=\"mjx-i\">\\((x,y) = (1,0)\\)<\/span> is __________<\/p>\n<ul>\n<li>A. 2<\/li>\n<li>B. -2<\/li>\n<li>C. 4<\/li>\n<li>D. -4<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q53\"><strong>Câu 6.4<\/strong> <code>[SP26 Q10]<\/code> <code>[SP26 Q24]<\/code>\nFind the determinant of the Hessian of <span class=\"mjx-i\">\\(f(x,y,z) = x^2 + 2y^2 - z^2 + 2xy + xz - 3yz + x + 2y + 3z + 5\\)<\/span><\/p>\n<ul>\n<li>A. -42<\/li>\n<li>B. -52<\/li>\n<li>C. -50<\/li>\n<li>D. -48<\/li>\n<li>E. -45<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q54\"><strong>Câu 6.5<\/strong> <code>[Đề A Q24]<\/code>\nThe sum of all entries on the second row of the Hessian matrix of <span class=\"mjx-i\">\\(f(x,y)=\\frac{8x}{x+y}\\)<\/span> at <span class=\"mjx-i\">\\((1,1)\\)<\/span> is<\/p>\n<ul>\n<li>(i) -2<\/li>\n<li>(ii) 0<\/li>\n<li>(iii) 2<\/li>\n<li>(iv) 4<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q55\"><strong>Câu 6.6<\/strong> <code>[SP25-RE Q23]<\/code>\nThe sum of all entries on the diagonal of the Hessian matrix of <span class=\"mjx-i\">\\(f(x,y)=\\frac{8x}{x+y}\\)<\/span> at <span class=\"mjx-i\">\\((1,1)\\)<\/span> is<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(-2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(0\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(4\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iv)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q56\"><strong>Câu 6.7<\/strong> <code>[Đề A Q39]<\/code> <code>[SP25-RE Q24]<\/code> <code>[SP26 Q30]<\/code>\nConsider the function <span class=\"mjx-i\">\\(f(x,y) = (1 + e^{xy})^{-1}\\)<\/span> .\nCompute <span class=\"mjx-i\">\\(\\frac{\\partial^2 f}{\\partial x\\partial y}(0,0).\\)<\/span><\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(-0.5\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(0.5\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(-0.25\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(0.25\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q57\"><strong>Câu 6.8<\/strong> <code>[Đề B Q23]<\/code>\nConsider the function <span class=\"mjx-i\">\\(f(x,y)=x^3+y^3-3x^2y\\)<\/span> . Find the Hessian matrix of <span class=\"mjx-i\">\\(f\\)<\/span> at <span class=\"mjx-i\">\\((x,y)=(-1,1)\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\begin{bmatrix}-12 &amp; 6 \\\\ 6 &amp; 6\\end{bmatrix}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\begin{bmatrix}-12 &amp; 6 \\\\ 6 &amp; -6\\end{bmatrix}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\begin{bmatrix}-12 &amp; -6 \\\\ -6 &amp; -6\\end{bmatrix}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\begin{bmatrix}-12 &amp; -6 \\\\ -6 &amp; 6\\end{bmatrix}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q58\"><strong>Câu 6.9<\/strong> <code>[SU24-RE Q20]<\/code>\nSuppose that the Hessian matrix of <span class=\"mjx-i\">\\(f(x,y,z)\\)<\/span> at <span class=\"mjx-i\">\\((0,1,1)\\)<\/span> is<\/p>\n<p><div class=\"mjx-d\">\\[\\begin{bmatrix}\n2 &amp; -1 &amp; 4 \\\\\n-1 &amp; 3 &amp; 5 \\\\\n4 &amp; 5 &amp; -1\n\\end{bmatrix}.\\]<\/div><\/p>\n<p>The value of <span class=\"mjx-i\">\\(2\\frac{\\partial^2 f}{\\partial x\\partial z}+\\frac{\\partial^2 f}{\\partial y^2}\\)<\/span> at <span class=\"mjx-i\">\\((0,1,1)\\)<\/span> is<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(1\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(13\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(0\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(11\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q59\"><strong>Câu 6.10<\/strong> <code>[FA24-FE Q23]<\/code>\nConsider the function <span class=\"mjx-i\">\\(f(x,y)=e^{-2x}(y+1)\\)<\/span> . What is the Hessian matrix <span class=\"mjx-i\">\\(H(0,1)\\)<\/span> of <span class=\"mjx-i\">\\(f\\)<\/span> at the point <span class=\"mjx-i\">\\((0,1)\\)<\/span> ?<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\begin{bmatrix} 8 &amp; 2 \\\\ 2 &amp; 0 \\end{bmatrix}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\begin{bmatrix} 8 &amp; -2 \\\\ -2 &amp; 0 \\end{bmatrix}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\begin{bmatrix} -8 &amp; 2 \\\\ 2 &amp; 0 \\end{bmatrix}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\begin{bmatrix} -8 &amp; -2 \\\\ -2 &amp; 0 \\end{bmatrix}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q60\"><strong>Câu 6.11<\/strong> <code>[FA24-FE Q24]<\/code>\nConsider the function <span class=\"mjx-i\">\\(f(x,y,z) = (2xy - y^2z)^2\\)<\/span> .\nThe value of <span class=\"mjx-i\">\\(\\dfrac{\\partial^2 f}{\\partial x \\partial z}\\)<\/span> evaluated at <span class=\"mjx-i\">\\((x,y,z) = (1,1,-1)\\)<\/span> is ______<\/p>\n<ul>\n<li>A. 28<\/li>\n<li>B. -20<\/li>\n<li>C. -4<\/li>\n<li>D. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q61\"><strong>Câu 6.12<\/strong> <code>[SP26 Q35]<\/code>\nConsider the function <span class=\"mjx-i\">\\(f(x, y) = x^3y + y^2 - 3x^2y\\)<\/span> . Find the Hessian matrix of <span class=\"mjx-i\">\\(f\\)<\/span> at <span class=\"mjx-i\">\\((x, y) = (1, -1)\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\begin{bmatrix} 0 &amp; -3 \\\\ -3 &amp; -2 \\end{bmatrix}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\begin{bmatrix} 0 &amp; -3 \\\\ -3 &amp; 2 \\end{bmatrix}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\begin{bmatrix} 0 &amp; 3 \\\\ 3 &amp; -2 \\end{bmatrix}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\begin{bmatrix} 0 &amp; 3 \\\\ 3 &amp; 2 \\end{bmatrix}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iv)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-5-h19\">Dạng 7: Đa thức Taylor nhiều biến<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"first-order / second-order Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y)\\)<\/span> about <span class=\"mjx-i\">\\((a,b)\\)<\/span>\"<\/em>, hỏi một hệ số, tổ hợp hệ số (<span class=\"mjx-i\">\\(a-b\\)<\/span>, <span class=\"mjx-i\">\\(a+b+c\\)<\/span>), <em>\"coefficient of <span class=\"mjx-i\">\\((y-1)^2\\)<\/span>\"<\/em>, hoặc <em>\"approximated value … using the first order Taylor polynomial\"<\/em>.<\/p>\n<h3>Công thức (2 biến, tại <span class=\"mjx-i\">\\((a,b)\\)<\/span>; đặt <span class=\"mjx-i\">\\(u=x-a\\)<\/span>, <span class=\"mjx-i\">\\(v=y-b\\)<\/span>)<\/h3>\n<p><div class=\"mjx-d\">\\[T_1=f+f_x\\,u+f_y\\,v\\]<\/div>\n<div class=\"mjx-d\">\\[T_2=T_1+\\tfrac12f_{xx}\\,u^2+f_{xy}\\,uv+\\tfrac12f_{yy}\\,v^2\\]<\/div>\n(mọi đạo hàm tính tại <span class=\"mjx-i\">\\((a,b)\\)<\/span>). Nghĩa là: <strong>hệ số của <span class=\"mjx-i\">\\(u^2\\)<\/span> là <span class=\"mjx-i\">\\(f_{xx}/2\\)<\/span><\/strong>, của <span class=\"mjx-i\">\\(uv\\)<\/span> là <span class=\"mjx-i\">\\(f_{xy}\\)<\/span> (<strong>không chia 2<\/strong>), của <span class=\"mjx-i\">\\(v^2\\)<\/span> là <span class=\"mjx-i\">\\(f_{yy}/2\\)<\/span>.<\/p>\n<ul>\n<li><strong>Đề viết <span class=\"mjx-i\">\\(T_1\\)<\/span> dạng <span class=\"mjx-i\">\\(ax+by+c\\)<\/span><\/strong> (đã khai triển) tại <span class=\"mjx-i\">\\((x_0,y_0)\\)<\/span>: <span class=\"mjx-i\">\\(a=f_x\\)<\/span>, <span class=\"mjx-i\">\\(b=f_y\\)<\/span>, <span class=\"mjx-i\">\\(c=f(x_0,y_0)-f_x\\,x_0-f_y\\,y_0\\)<\/span>.<\/li>\n<li><strong>Đề viết <span class=\"mjx-i\">\\(T_2\\)<\/span> dạng <span class=\"mjx-i\">\\(a_1x^2+a_2xy+\\dots\\)<\/span><\/strong> (đã khai triển): hệ số của <span class=\"mjx-i\">\\(x^2\\)<\/span> vẫn là <span class=\"mjx-i\">\\(f_{xx}/2\\)<\/span> (vì chỉ <span class=\"mjx-i\">\\((x-a)^2\\)<\/span> sinh ra <span class=\"mjx-i\">\\(x^2\\)<\/span>).<\/li>\n<li>Xấp xỉ: <span class=\"mjx-i\">\\(f(a+\\Delta x,b+\\Delta y)\\approx f+f_x\\Delta x+f_y\\Delta y\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Tính <span class=\"mjx-i\">\\(f\\)<\/span>, các đạo hàm cấp 1 (và cấp 2 nếu cần) tại điểm.<\/li>\n<li>Ghép theo công thức, đọc đúng hệ số được hỏi.<\/li>\n<li>Nếu đề viết dạng đã khai triển (<span class=\"mjx-i\">\\(ax+by+c\\)<\/span>), khai triển <span class=\"mjx-i\">\\(T_1\\)<\/span> trước khi đọc.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (<span class=\"mjx-i\">\\(T_1\\)<\/span> dạng <span class=\"mjx-i\">\\(a+b(x-1)+c(y-2)\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(f=x^2y-2xy+y^2\\)<\/span> about <span class=\"mjx-i\">\\((1,2)\\)<\/span>. Find <span class=\"mjx-i\">\\(a+b+c\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f(1,2)=2-4+4=2\\)<\/span>; <span class=\"mjx-i\">\\(f_x=2xy-2y=0\\)<\/span>; <span class=\"mjx-i\">\\(f_y=x^2-2x+2y=3\\)<\/span>. Vậy <span class=\"mjx-i\">\\(a=2,b=0,c=3\\)<\/span> và <span class=\"mjx-i\">\\(a+b+c=5\\)<\/span>.<\/p>\n<p><strong>Ví dụ 2 (<span class=\"mjx-i\">\\(T_1\\)<\/span> dạng <span class=\"mjx-i\">\\(ax+by+c\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(f=(x+y^2)^2\\)<\/span> about <span class=\"mjx-i\">\\((1,1)\\)<\/span>. Find <span class=\"mjx-i\">\\(a,b,c\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f=4\\)<\/span>; <span class=\"mjx-i\">\\(f_x=2(x+y^2)=4\\)<\/span>; <span class=\"mjx-i\">\\(f_y=2(x+y^2)\\cdot2y=8\\)<\/span>. <span class=\"mjx-i\">\\(T_1=4+4(x-1)+8(y-1)=4x+8y-8\\)<\/span>, nên <span class=\"mjx-i\">\\(a=4\\)<\/span>, <span class=\"mjx-i\">\\(b=8\\)<\/span>, <span class=\"mjx-i\">\\(c=-8\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (hệ số bậc 2).<\/strong> <span class=\"mjx-i\">\\(f=x^3y\\)<\/span> about <span class=\"mjx-i\">\\((1,1)\\)<\/span>, <span class=\"mjx-i\">\\(T_2=\\dots+c_3(x-1)^2+c_4(x-1)(y-1)+c_5(y-1)^2\\)<\/span>. Find <span class=\"mjx-i\">\\(c_3,c_4,c_5\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f_{xx}=6xy=6\\)<\/span> nên <span class=\"mjx-i\">\\(c_3=3\\)<\/span>; <span class=\"mjx-i\">\\(f_{xy}=3x^2=3\\)<\/span> nên <span class=\"mjx-i\">\\(c_4=3\\)<\/span>; <span class=\"mjx-i\">\\(f_{yy}=0\\)<\/span> nên <span class=\"mjx-i\">\\(c_5=0\\)<\/span>.<\/p>\n<p><strong>Ví dụ 4 (giá trị xấp xỉ).<\/strong> Approximate <span class=\"mjx-i\">\\(f(x,y)=\\sqrt{x^2+y}\\)<\/span> at <span class=\"mjx-i\">\\((1{,}1;\\ 3{,}2)\\)<\/span> using <span class=\"mjx-i\">\\(T_1\\)<\/span> at <span class=\"mjx-i\">\\((1,3)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f(1,3)=2\\)<\/span>; <span class=\"mjx-i\">\\(f_x=\\tfrac{x}{f}=\\tfrac12\\)<\/span>; <span class=\"mjx-i\">\\(f_y=\\tfrac{1}{2f}=\\tfrac14\\)<\/span>. <span class=\"mjx-i\">\\(f\\approx2+\\tfrac12(0{,}1)+\\tfrac14(0{,}2)=2{,}1\\)<\/span>.<\/p>\n<p><strong>Ví dụ 5 (hệ số <span class=\"mjx-i\">\\(x^2\\)<\/span> ở dạng khai triển).<\/strong> <span class=\"mjx-i\">\\(T_2\\)<\/span> of <span class=\"mjx-i\">\\(f=(x^2+y)^2\\)<\/span> about <span class=\"mjx-i\">\\((1,0)\\)<\/span> is <span class=\"mjx-i\">\\(a_1x^2+a_2xy+\\dots\\)<\/span> Find <span class=\"mjx-i\">\\(a_1\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f_{xx}=12x^2+4y=12\\)<\/span> tại <span class=\"mjx-i\">\\((1,0)\\)<\/span>, nên <span class=\"mjx-i\">\\(a_1=\\tfrac{12}{2}=6\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Quên chia 2 ở <span class=\"mjx-i\">\\(f_{xx},f_{yy}\\)<\/span>; hoặc <strong>chia 2 nhầm<\/strong> ở <span class=\"mjx-i\">\\(f_{xy}\\)<\/span>.<\/li>\n<li>Đề viết dạng <span class=\"mjx-i\">\\(ax+by+c\\)<\/span> nhưng lại đọc <span class=\"mjx-i\">\\(c=f(a,b)\\)<\/span> (phải khai triển).<\/li>\n<li>Câu xấp xỉ: dùng <span class=\"mjx-i\">\\(\\Delta x=x\\)<\/span> thay vì <span class=\"mjx-i\">\\(\\Delta x=x-a\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(T_1\\)<\/span> dạng <span class=\"mjx-i\">\\(ax+by+c\\)<\/span>: <span class=\"mjx-i\">\\(a\\)<\/span> và <span class=\"mjx-i\">\\(b\\)<\/span> chính là <span class=\"mjx-i\">\\(f_x,f_y\\)<\/span>, <strong>không cần khai triển<\/strong>; chỉ <span class=\"mjx-i\">\\(c\\)<\/span> mới phải tính <span class=\"mjx-i\">\\(c=f-f_x x_0-f_y y_0\\)<\/span>. Câu hỏi <span class=\"mjx-i\">\\(a-b\\)<\/span> chỉ cần <span class=\"mjx-i\">\\(f_x-f_y\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(T_1\\)<\/span> dạng <span class=\"mjx-i\">\\(a+b(x-x_0)+c(y-y_0)\\)<\/span>: <span class=\"mjx-i\">\\(a+b+c=f+f_x+f_y\\)<\/span> tại điểm.<\/li>\n<li><strong>Kiểm tra <span class=\"mjx-i\">\\(T_1\\)<\/span> (3 biến):<\/strong> hằng số <span class=\"mjx-i\">\\(=f(\\text{điểm})\\)<\/span>, và hệ số của biến nào có đạo hàm 0 thì biến đó vắng mặt. Loại nhanh đáp án.<\/li>\n<li>Hàm dạng <span class=\"mjx-i\">\\(u(x)\\cdot v(y)\\)<\/span>: <span class=\"mjx-i\">\\(f_{xy}=u'v'\\)<\/span>, <span class=\"mjx-i\">\\(f_{yy}=u\\,v''\\)<\/span>, tính rất nhanh.<\/li>\n<\/ul>\n<p><strong>Thử đáp án (câu xấp xỉ có 4 đáp án sát nhau như 2,575/2,577/…):<\/strong> <strong>không<\/strong> tính <span class=\"mjx-i\">\\(f\\)<\/span> thật tại điểm mới (vì giá trị thật khác giá trị xấp xỉ); phải tính đúng <span class=\"mjx-i\">\\(T_1\\)<\/span>.<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(f_x,f_y\\)<\/span> tại điểm bằng d/dx (biến còn lại thay số), lưu vào A, B (<code>STO<\/code>).<\/li>\n<li>Giá trị xấp xỉ: gõ <code>f(a,b)+A×Δx+B×Δy<\/code>.<\/li>\n<li>Hệ số bậc 2: dùng công thức sai phân ở bảng đầu chương rồi chia 2 nếu cần.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">14 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-5-q62\"><strong>Câu 7.1<\/strong> <code>[FA24-RE Q26]<\/code>\nThe first-order Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y)=(x^2+2xy+1)^2\\)<\/span> about <span class=\"mjx-i\">\\((1,-1)\\)<\/span> is <span class=\"mjx-i\">\\(ax+by+c\\)<\/span> .\nThe value of <span class=\"mjx-i\">\\(a-b\\)<\/span> is<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(0\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(32\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(64\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(128\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q63\"><strong>Câu 7.2<\/strong> <code>[Đề B Q25]<\/code>\nThe first-order Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y) = (x^2 + 2xy^2 + 1)^2\\)<\/span> about <span class=\"mjx-i\">\\((1,-1)\\)<\/span> is <span class=\"mjx-i\">\\(ax + by + c\\)<\/span> .\nThe value of <span class=\"mjx-i\">\\(a-b\\)<\/span> is<\/p>\n<ul>\n<li>(i) 0<\/li>\n<li>(ii) 32<\/li>\n<li>(iii) 64<\/li>\n<li>(iv) 128<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q64\"><strong>Câu 7.3<\/strong> <code>[SP26 Q36]<\/code>\nThe first-order Taylor polynomial of <span class=\"mjx-i\">\\(f(x, y) = (x^2 + 2xy^2 + 1)^2\\)<\/span> about <span class=\"mjx-i\">\\((1, -1)\\)<\/span> is <span class=\"mjx-i\">\\(ax + by + c\\)<\/span> .\nThe value of <span class=\"mjx-i\">\\(c\\)<\/span> is<\/p>\n<ul>\n<li>\n<p>(i) 0<\/p>\n<\/li>\n<li>\n<p>(ii) -16<\/p>\n<\/li>\n<li>\n<p>(iii) -32<\/p>\n<\/li>\n<li>\n<p>(iv) -48<\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (iii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q65\"><strong>Câu 7.4<\/strong> <code>[SP26 Q2]<\/code> <code>[FA24-FE Q26]<\/code> <code>[SP26 Q26]<\/code>\nThe first order Taylor polynomial of <span class=\"mjx-i\">\\(f(x, y) = x^2y - 3xy + 2y^2 - 6\\)<\/span> about <span class=\"mjx-i\">\\((x, y) = (-1, 2)\\)<\/span> is <span class=\"mjx-i\">\\(a + b(x + 1) + c(y - 2).\\)<\/span> The value of <span class=\"mjx-i\">\\(a + b + c\\)<\/span> is ________<\/p>\n<ul>\n<li>A. -12<\/li>\n<li>B. -2<\/li>\n<li>C. 2<\/li>\n<li>D. 12<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q66\"><strong>Câu 7.5<\/strong> <code>[Đề A Q26]<\/code> <code>[SP26 Q10]<\/code>\nThe first order Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y)=x^2y-3xy+2y^2-6\\)<\/span> about <span class=\"mjx-i\">\\((x,y)=(-1,2)\\)<\/span> is <span class=\"mjx-i\">\\(a+b(x+1)+c(y-2)\\)<\/span> .\nThe value of <span class=\"mjx-i\">\\(b+c\\)<\/span> is __________<\/p>\n<ul>\n<li>A. 12<\/li>\n<li>B. 2<\/li>\n<li>C. -12<\/li>\n<li>D. -2<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q67\"><strong>Câu 7.6<\/strong> <code>[FA24-RE Q39]<\/code> <code>[Đề A Q25]<\/code>\nConsider the bivariate function <span class=\"mjx-i\">\\(f(x,y)=(x^2y-xy^2)^2\\)<\/span> .\nThe second-order Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y)\\)<\/span> about <span class=\"mjx-i\">\\((x,y)=(-1,2)\\)<\/span> is: <span class=\"mjx-i\">\\(T_2(x,y)=c_0+c_1(x+1)+c_2(y-2)+c_3(x+1)^2+c_4(x+1)(y-2)+c_5(y-2)^2.\\)<\/span> The value of <span class=\"mjx-i\">\\(c_3\\)<\/span> is ________.<\/p>\n<ul>\n<li>A. 37<\/li>\n<li>B. 74<\/li>\n<li>C. 160<\/li>\n<li>D. 80<\/li>\n<li>E. 88<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q68\"><strong>Câu 7.7<\/strong> <code>[SU24-RE Q22]<\/code>\nConsider the bivariate function <span class=\"mjx-i\">\\(f(x,y)=(x^2y-xy^2)^2\\)<\/span> .\nThe second-order Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y)\\)<\/span> about <span class=\"mjx-i\">\\((x,y)=(-1,2)\\)<\/span> is: <span class=\"mjx-i\">\\(T_2(x,y)=c_0+c_1(x+1)+c_2(y-2)+c_3(x+1)^2+c_4(x+1)(y-2)+c_5(y-2)^2.\\)<\/span> The value of <span class=\"mjx-i\">\\(c_5\\)<\/span> is ________.<\/p>\n<ul>\n<li>A. 37<\/li>\n<li>B. 74<\/li>\n<li>C. 160<\/li>\n<li>D. 80<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q69\"><strong>Câu 7.8<\/strong> <code>[SP26 Q9]<\/code> <code>[SP26 Q27]<\/code>\nThe second order Taylor polynomial of <span class=\"mjx-i\">\\(f(x, y) = (x^2 + 2y^2)^5 \\text{ about } (1, 0) \\text{ is}\\)<\/span> <span class=\"mjx-i\">\\(a_1 x^2 + a_2 xy + a_3 y^2 + a_4 x + a_5 y + a_6.\\)<\/span>\nThe value of <span class=\"mjx-i\">\\(a_1\\)<\/span> is<\/p>\n<ul>\n<li>\n<p>(i) 10<\/p>\n<\/li>\n<li>\n<p>(ii) 80<\/p>\n<\/li>\n<li>\n<p>(iii) 45<\/p>\n<\/li>\n<li>\n<p>(iv) 90<\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q70\"><strong>Câu 7.9<\/strong> <code>[SP25-RE Q25]<\/code> <code>[SU24-RE Q39]<\/code>\nFind the first order Taylor expansion of the function <span class=\"mjx-i\">\\(f(x,y,z)=x^3y+2xz^2-yz+z^2\\)<\/span> at the point <span class=\"mjx-i\">\\((x,y,z)=(1,2,0)\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(2+(x-1)-2(y-2)+6z\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(2+6(x-1)-2(y-2)+z\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(2+(x-1)+6(y-2)-2z\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(2+6(x-1)+(y-2)-2z\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q71\"><strong>Câu 7.10<\/strong> <code>[SP25-RE Q38]<\/code>\nThe coefficient of <span class=\"mjx-i\">\\((y - 1)^2\\)<\/span> in the second order Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y) = \\sin x \\cos^2 y + \\cos(xy)\\)<\/span> about <span class=\"mjx-i\">\\((0.5\\pi, 1)\\)<\/span> is:<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\cos 2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(-\\cos 2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(2\\cos 2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(-2\\cos 2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (iv)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q72\"><strong>Câu 7.11<\/strong> <code>[Đề B Q24]<\/code>\nWhat is the coefficient of <span class=\"mjx-i\">\\((y-1)^2\\)<\/span> in the second Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y)=\\frac{x+1}{y^2}\\)<\/span> about <span class=\"mjx-i\">\\((x,y)=(1,1)\\)<\/span> ?<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 3<\/li>\n<li>C. 6<\/li>\n<li>D. 12<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q73\"><strong>Câu 7.12<\/strong> <code>[FA24-FE Q25]<\/code>\nThe coefficient of <span class=\"mjx-i\">\\((y - 2)^2\\)<\/span> in the second order Taylor polynomial of <span class=\"mjx-i\">\\(f(x, y) = (xy + 1)(y + 2)^2\\)<\/span> about <span class=\"mjx-i\">\\((1, 2)\\)<\/span> is:<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(-11\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(-22\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(11\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(22\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q74\"><strong>Câu 7.13<\/strong> <code>[SP26 Q2]<\/code>\nThe first order Taylor polynomial of <span class=\"mjx-i\">\\(f(x, y) = (x^2 + 2xy)^{-2}\\)<\/span> at <span class=\"mjx-i\">\\((1, 1)\\)<\/span> is of the form <span class=\"mjx-i\">\\(a + b(x - 1) + c(y - 1)\\)<\/span> .\nThe value of <span class=\"mjx-i\">\\(b + c\\)<\/span> is:<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(4/9\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(-4/9\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(2/9\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(-2/9\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q75\"><strong>Câu 7.14<\/strong> <code>[SP26 Q19]<\/code>\nThe approximated value of the function <span class=\"mjx-i\">\\(f(x, y) = \\sqrt{x^2y + 3y^2}\\)<\/span> at <span class=\"mjx-i\">\\((x, y) = (-1.1, 1.3)\\)<\/span> by using\nthe first order Taylor polynomial of <span class=\"mjx-i\">\\(f\\)<\/span> at <span class=\"mjx-i\">\\((-1, 1)\\)<\/span> is:<\/p>\n<ul>\n<li>\n<p>(i) 2.575<\/p>\n<\/li>\n<li>\n<p>(ii) 2.577<\/p>\n<\/li>\n<li>\n<p>(iii) 2.579<\/p>\n<\/li>\n<li>\n<p>(iv) 2.581<\/p>\n<\/li>\n<li>\n<p>A. (iv)<\/p>\n<\/li>\n<li>\n<p>B. (i)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h1 id=\"MAI391-5-h20\"><span class=\"pn\">Phần 4<\/span>Nhìn đề → nhận ra dạng<\/h1>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Từ khóa trong đề<\/th>\n<th>Dạng<\/th>\n<th>Việc cần làm ngay<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><em>Taylor polynomial <span class=\"mjx-i\">\\(T_2\\)<\/span>, <span class=\"mjx-i\">\\(T_3\\)<\/span> of <span class=\"mjx-i\">\\(f(x)\\)<\/span><\/em>, <em>Taylor series at <span class=\"mjx-i\">\\(a\\)<\/span><\/em><\/td>\n<td>1<\/td>\n<td>Kiểm tra hằng số <span class=\"mjx-i\">\\(=f(a)\\)<\/span>; tính <span class=\"mjx-i\">\\(f^{(k)}(a)/k!\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>value <span class=\"mjx-i\">\\(a_0+a_1+a_2\\)<\/span><\/em><\/td>\n<td>1<\/td>\n<td><span class=\"mjx-i\">\\(f(0)+f'(0)+f''(0)/2\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>coefficient of <span class=\"mjx-i\">\\((x-1)^3\\)<\/span><\/em><\/td>\n<td>1<\/td>\n<td>Phép thế <span class=\"mjx-i\">\\(t=x-1\\)<\/span> vào chuỗi cơ bản<\/td>\n<\/tr>\n<tr>\n<td><em>approximated value … <span class=\"mjx-i\">\\(P(x)\\)<\/span><\/em><\/td>\n<td>1<\/td>\n<td>Thay vào <span class=\"mjx-i\">\\(P\\)<\/span>, không thay vào <span class=\"mjx-i\">\\(f\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(\\frac{\\partial z}{\\partial x}(a,b)\\)<\/span>, <em>gradient at<\/em><\/td>\n<td>2<\/td>\n<td>Đạo hàm riêng; Rad; kiểm tra dấu<\/td>\n<\/tr>\n<tr>\n<td><em>Chain Rule<\/em>, <span class=\"mjx-i\">\\(\\partial z/\\partial\\theta\\)<\/span>, <span class=\"mjx-i\">\\(df/dt\\)<\/span><\/td>\n<td>3<\/td>\n<td>Đổi <span class=\"mjx-i\">\\((r,\\theta)\\to(x,y)\\)<\/span> trước; hoặc thế trực tiếp rồi d/dx<\/td>\n<\/tr>\n<tr>\n<td><em><span class=\"mjx-i\">\\(df/dt\\)<\/span> in matrix form<\/em><\/td>\n<td>3<\/td>\n<td>Gradient <strong>hàng<\/strong> × cột <strong>đạo hàm<\/strong> biến trong<\/td>\n<\/tr>\n<tr>\n<td><em>Jacobian determinant<\/em>, <em><span class=\"mjx-i\">\\((i,j)\\)<\/span>-entry of the Jacobian<\/em><\/td>\n<td>4<\/td>\n<td>Hàng = hàm, cột = biến<\/td>\n<\/tr>\n<tr>\n<td><em>Euclidean norm of <span class=\"mjx-i\">\\(J\\)<\/span><\/em> (<span class=\"mjx-i\">\\(f:\\mathbb{R}\\to\\mathbb{R}^m\\)<\/span>)<\/td>\n<td>4<\/td>\n<td><span class=\"mjx-i\">\\(\\sqrt{\\sum(f_i')^2}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>computation graph<\/em>, <em>formula of <span class=\"mjx-i\">\\(f\\)<\/span><\/em><\/td>\n<td>5<\/td>\n<td>Thế ngược; thử <span class=\"mjx-i\">\\(x=0,1\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>computation graph<\/em>, <span class=\"mjx-i\">\\(\\partial f/\\partial x\\)<\/span><\/td>\n<td>5<\/td>\n<td>Đếm đường đi; mỗi đường một tích; cộng lại<\/td>\n<\/tr>\n<tr>\n<td><em>Hessian<\/em>, <em><span class=\"mjx-i\">\\((i,j)\\)<\/span>-entry<\/em>, <span class=\"mjx-i\">\\(\\partial^2f/\\partial x\\partial y\\)<\/span><\/td>\n<td>6<\/td>\n<td>Đạo hàm 2 lần; hàm bậc hai đọc bằng mắt<\/td>\n<\/tr>\n<tr>\n<td><em>determinant of the Hessian<\/em><\/td>\n<td>6<\/td>\n<td>Hàm bậc hai: <span class=\"mjx-i\">\\(H_{ii}=2a_{ii}\\)<\/span>, <span class=\"mjx-i\">\\(H_{ij}=a_{ij}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>first-order Taylor … <span class=\"mjx-i\">\\(ax+by+c\\)<\/span><\/em><\/td>\n<td>7<\/td>\n<td><span class=\"mjx-i\">\\(a=f_x\\)<\/span>, <span class=\"mjx-i\">\\(b=f_y\\)<\/span>; <span class=\"mjx-i\">\\(c\\)<\/span> phải khai triển<\/td>\n<\/tr>\n<tr>\n<td><em>second-order Taylor … coefficient of <span class=\"mjx-i\">\\((y-1)^2\\)<\/span><\/em><\/td>\n<td>7<\/td>\n<td><span class=\"mjx-i\">\\(f_{yy}/2\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><em>approximated value … first order Taylor<\/em><\/td>\n<td>7<\/td>\n<td><span class=\"mjx-i\">\\(f+f_x\\Delta x+f_y\\Delta y\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-5-h21\"><span class=\"pn\">Phần 5<\/span>Tổng hợp ôn thi<\/h1>\n<h2 id=\"MAI391-5-h22\">1. Công thức phải nhớ<\/h2>\n<p><div class=\"mjx-d\">\\[T_n(x)=\\sum_{k=0}^n\\frac{f^{(k)}(a)}{k!}(x-a)^k\\]<\/div>\n<div class=\"mjx-d\">\\[e^u=1+u+\\tfrac{u^2}2+\\tfrac{u^3}6+\\dots,\\quad \\sin u=u-\\tfrac{u^3}{6}+\\dots,\\quad\\cos u=1-\\tfrac{u^2}2+\\dots\\]<\/div>\n<div class=\"mjx-d\">\\[\\frac{dz}{dt}=f_x\\frac{dx}{dt}+f_y\\frac{dy}{dt},\\qquad \\frac{df}{dt}=\\nabla f\\cdot\\frac{dx}{dt}\\ (\\text{hàng}\\times\\text{cột})\\]<\/div>\n<div class=\"mjx-d\">\\[J_{ij}=\\frac{\\partial f_i}{\\partial x_j},\\qquad H_{ij}=\\frac{\\partial^2f}{\\partial x_i\\partial x_j}\\]<\/div>\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial x}=\\sum_{\\text{đường đi}}\\prod\\frac{\\partial(\\text{nút sau})}{\\partial(\\text{nút trước})}\\]<\/div>\n<div class=\"mjx-d\">\\[T_2(x,y)=f+f_xu+f_yv+\\tfrac12f_{xx}u^2+f_{xy}uv+\\tfrac12f_{yy}v^2\\quad(u=x-a,\\ v=y-b)\\]<\/div><\/p>\n<h2 id=\"MAI391-5-h23\">2. Mười lỗi mất điểm hay gặp nhất<\/h2>\n<ol>\n<li>Quên chia <span class=\"mjx-i\">\\(k!\\)<\/span> trong Taylor (nhất là <span class=\"mjx-i\">\\(3!=6\\)<\/span>).<\/li>\n<li>Quên đạo hàm hàm trong (hệ số <span class=\"mjx-i\">\\(6^k\\)<\/span> của <span class=\"mjx-i\">\\(\\cos6x\\)<\/span>, hệ số <span class=\"mjx-i\">\\(\\ln2\\)<\/span> của <span class=\"mjx-i\">\\(2^x\\)<\/span>).<\/li>\n<li>Tính lượng giác bằng độ thay vì radian.<\/li>\n<li>Chain rule: thay <span class=\"mjx-i\">\\((r,\\theta)\\)<\/span> vào <span class=\"mjx-i\">\\(f_x,f_y\\)<\/span> thay vì <span class=\"mjx-i\">\\((x,y)\\)<\/span>.<\/li>\n<li>Dạng ma trận: gradient đặt thành cột.<\/li>\n<li>Jacobian: đảo hàng và cột.<\/li>\n<li>Đồ thị tính toán: bỏ sót một đường đi khi nút tách nhánh.<\/li>\n<li>Hessian của hàm bậc hai: quên nhân 2 đường chéo, hoặc nhân 2 nhầm phần tử chéo.<\/li>\n<li>Taylor 2 biến: chia 2 nhầm ở hệ số <span class=\"mjx-i\">\\(f_{xy}\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(T_1\\)<\/span> dạng <span class=\"mjx-i\">\\(ax+by+c\\)<\/span>: lấy <span class=\"mjx-i\">\\(c=f(a,b)\\)<\/span> mà không khai triển.<\/li>\n<\/ol>\n", "q": 75}, {"num": "6", "short": "Xác suất và phân phối", "sub": "Mathematics for Machine Learning – mục 6.1, 6.2, 6.3, 6.4, 6.5", "toc": [["h1", "PHẦN 1. GHI CHÉP BÀI HỌC", "MAI391-6-h1"], ["h2", "1.1. Không gian xác suất & biến ngẫu nhiên — mục 6.1", "MAI391-6-h2"], ["h2", "1.2. Xác suất rời rạc & liên tục — mục 6.2", "MAI391-6-h3"], ["h2", "1.3. Quy tắc tổng, quy tắc tích, định lý Bayes — mục 6.3", "MAI391-6-h4"], ["h2", "1.4. Thống kê tóm tắt & độc lập — mục 6.4", "MAI391-6-h5"], ["h2", "1.5. Phân phối Gauss (chuẩn) — mục 6.5", "MAI391-6-h6"], ["h1", "PHẦN 2. ĐỀ THI THƯỜNG RA GÌ Ở CHƯƠNG 6", "MAI391-6-h7"], ["h1", "PHẦN 3. CÁC DẠNG BÀI", "MAI391-6-h8"], ["h2", "Chuẩn bị: Casio fx-580VN X cho Chương 6", "MAI391-6-h9"], ["h2", "Dạng 1: Xác suất cơ bản & biến ngẫu nhiên một chiều", "MAI391-6-h10"], ["h2", "Dạng 2: Phân phối đồng thời rời rạc", "MAI391-6-h11"], ["h2", "Dạng 3: Phân phối đồng thời liên tục", "MAI391-6-h12"], ["h2", "Dạng 4: Kỳ vọng, phương sai, hiệp phương sai", "MAI391-6-h13"], ["h2", "Dạng 5: Ma trận hiệp phương sai mẫu (empirical covariance)", "MAI391-6-h14"], ["h2", "Dạng 6: Phân phối Gauss", "MAI391-6-h15"], ["h1", "PHẦN 4. NHÌN ĐỀ → NHẬN RA DẠNG", "MAI391-6-h16"], ["h1", "PHẦN 5. TỔNG HỢP ÔN THI", "MAI391-6-h17"], ["h2", "1. Công thức phải nhớ", "MAI391-6-h18"], ["h2", "2. Mười lỗi mất điểm hay gặp nhất", "MAI391-6-h19"]], "html": "<hr/>\n<h1 id=\"MAI391-6-h1\"><span class=\"pn\">Phần 1<\/span>Ghi chép bài học<\/h1>\n<h2 id=\"MAI391-6-h2\">1.1. Không gian xác suất &amp; biến ngẫu nhiên — mục 6.1<\/h2>\n<h3>Khái niệm<\/h3>\n<ul>\n<li><strong>Không gian mẫu<\/strong> <span class=\"mjx-i\">\\(\\Omega\\)<\/span>: tập mọi kết quả có thể của phép thử.<\/li>\n<li><strong>Không gian sự kiện<\/strong> <span class=\"mjx-i\">\\(\\mathcal{A}\\)<\/span>: tập các tập con <span class=\"mjx-i\">\\(A\\subseteq\\Omega\\)<\/span> mà ta quan sát được.<\/li>\n<li><strong>Xác suất<\/strong> <span class=\"mjx-i\">\\(P(A)\\)<\/span>: số đo mức độ xảy ra của sự kiện <span class=\"mjx-i\">\\(A\\)<\/span>, với <span class=\"mjx-i\">\\(0\\le P(A)\\le1\\)<\/span> và <span class=\"mjx-i\">\\(P(\\Omega)=1\\)<\/span>.<\/li>\n<li><strong>Biến ngẫu nhiên<\/strong> <span class=\"mjx-i\">\\(X:\\Omega\\to\\mathcal{T}\\)<\/span>: hàm gán cho mỗi kết quả <span class=\"mjx-i\">\\(\\omega\\)<\/span> một giá trị <span class=\"mjx-i\">\\(x\\)<\/span> trong <strong>không gian đích<\/strong> <span class=\"mjx-i\">\\(\\mathcal{T}\\)<\/span>. Nếu <span class=\"mjx-i\">\\(\\mathcal{T}\\)<\/span> hữu hạn hoặc đếm được thì <span class=\"mjx-i\">\\(X\\)<\/span> là <strong>rời rạc<\/strong>; nếu <span class=\"mjx-i\">\\(\\mathcal{T}=\\mathbb{R}\\)<\/span> hoặc <span class=\"mjx-i\">\\(\\mathbb{R}^D\\)<\/span> thì <span class=\"mjx-i\">\\(X\\)<\/span> là <strong>liên tục<\/strong>.<\/li>\n<li><span class=\"mjx-i\">\\(P(X\\in S)=P(\\{\\omega\\in\\Omega: X(\\omega)\\in S\\})\\)<\/span>.<\/li>\n<\/ul>\n<blockquote>\n<p>💡 <strong>Hình dung dễ hiểu:<\/strong> <span class=\"mjx-i\">\\(\\Omega\\)<\/span> là \"tất cả những gì có thể xảy ra\" (ví dụ RR, RB, BR, BB khi rút 2 bi). Biến ngẫu nhiên là \"con số ta quan tâm\" về kết quả đó (ví dụ số bi đỏ: 2, 1, 1, 0). Nó không ngẫu nhiên và cũng không phải biến; nó là một <strong>hàm<\/strong> đếm/đo trên kết quả.<\/p>\n<\/blockquote>\n<h3>Hàm khối xác suất &amp; hàm phân phối tích lũy<\/h3>\n<ul>\n<li><strong>pmf<\/strong> (rời rạc): <span class=\"mjx-i\">\\(p(x)=P(X=x)\\)<\/span>, với <span class=\"mjx-i\">\\(p(x)\\ge0\\)<\/span> và <span class=\"mjx-i\">\\(\\sum_xp(x)=1\\)<\/span>.<\/li>\n<li><strong>cdf<\/strong>: <span class=\"mjx-i\">\\(F_X(x)=P(X\\le x)\\)<\/span>. Tính chất: không giảm, liên tục phải, <span class=\"mjx-i\">\\(F(-\\infty)=0\\)<\/span>, <span class=\"mjx-i\">\\(F(+\\infty)=1\\)<\/span>, và <span class=\"mjx-i\">\\(P(a&lt;X\\le b)=F(b)-F(a)\\)<\/span>.<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide, đã sửa lỗi)<\/h3>\n<p><strong>Example:<\/strong> Draw two balls with replacement; each draw is red with probability <span class=\"mjx-i\">\\(0{,}3\\)<\/span>. Let <span class=\"mjx-i\">\\(X\\)<\/span> = number of red balls. Find the pmf of <span class=\"mjx-i\">\\(X\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> Rút 2 bi có hoàn lại; mỗi lần ra bi đỏ với xác suất <span class=\"mjx-i\">\\(0{,}3\\)<\/span>. <span class=\"mjx-i\">\\(X\\)<\/span> là số bi đỏ. Tìm pmf của <span class=\"mjx-i\">\\(X\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(P(X=2)=0{,}3\\cdot0{,}3=0{,}09\\)<\/span> <em>(slide in nhầm là <span class=\"mjx-i\">\\(0{,}9\\)<\/span>)<\/em>.<\/li>\n<li><span class=\"mjx-i\">\\(P(X=1)=0{,}3\\cdot0{,}7+0{,}7\\cdot0{,}3=0{,}42\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(P(X=0)=0{,}7\\cdot0{,}7=0{,}49\\)<\/span>.<\/li>\n<li>Kiểm tra: <span class=\"mjx-i\">\\(0{,}09+0{,}42+0{,}49=1\\)<\/span> ✓.<\/li>\n<\/ul>\n<\/div><h3>Hai phân phối hay gặp trong đề<\/h3>\n<ul>\n<li><strong>Đều rời rạc<\/strong> trên <span class=\"mjx-i\">\\(n\\)<\/span> số nguyên <span class=\"mjx-i\">\\(\\{a,\\dots,b\\}\\)<\/span> (<span class=\"mjx-i\">\\(n=b-a+1\\)<\/span>): <span class=\"mjx-i\">\\(P(X=k)=\\tfrac1n\\)<\/span>, nên <span class=\"mjx-i\">\\(P(X\\in S)=\\dfrac{\\#S}{n}\\)<\/span>.<\/li>\n<li><strong>Đều liên tục<\/strong> trên <span class=\"mjx-i\">\\([a,b]\\)<\/span>: <span class=\"mjx-i\">\\(p(x)=\\tfrac1{b-a}\\)<\/span>, nên <span class=\"mjx-i\">\\(P(c&lt;X&lt;d)=\\dfrac{d-c}{b-a}\\)<\/span> (phần giao với <span class=\"mjx-i\">\\([a,b]\\)<\/span>).<\/li>\n<li><strong>Nhị thức<\/strong> <span class=\"mjx-i\">\\(B(n,p)\\)<\/span> (số lần thành công trong <span class=\"mjx-i\">\\(n\\)<\/span> phép thử độc lập): <span class=\"mjx-i\">\\(P(X=k)=\\binom nk p^k(1-p)^{n-k}\\)<\/span>.<\/li>\n<\/ul>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>\"integers 0 through 99\" có <strong>100<\/strong> số; \"<span class=\"mjx-i\">\\(-7\\)<\/span> through <span class=\"mjx-i\">\\(7\\)<\/span>\" có <strong>15<\/strong> số.<\/li>\n<li>Biến đổi điều kiện về <span class=\"mjx-i\">\\(X\\)<\/span> trước: <span class=\"mjx-i\">\\(2^X\\le50\\iff X\\le\\log_250\\approx5{,}64\\)<\/span>.<\/li>\n<\/ul>\n<hr/>\n<h2 id=\"MAI391-6-h3\">1.2. Xác suất rời rạc &amp; liên tục — mục 6.2<\/h2>\n<h3>Phân phối đồng thời, biên, có điều kiện (rời rạc)<\/h3>\n<ul>\n<li><strong>Đồng thời (joint):<\/strong> <span class=\"mjx-i\">\\(p(x,y)=P(X=x,Y=y)\\)<\/span>.<\/li>\n<li><strong>Biên (marginal):<\/strong> <span class=\"mjx-i\">\\(p(x)=\\sum_yp(x,y)\\)<\/span> (cộng theo <strong>hàng<\/strong> của bảng), <span class=\"mjx-i\">\\(p(y)=\\sum_xp(x,y)\\)<\/span> (cộng theo <strong>cột<\/strong>).<\/li>\n<li><strong>Có điều kiện:<\/strong> <span class=\"mjx-i\">\\(p(y\\mid x)=\\dfrac{p(x,y)}{p(x)}\\)<\/span>.<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide)<\/h3>\n<p><strong>Example:<\/strong> 3 red, 5 blue, 2 pink balls; draw 2 without replacement. <span class=\"mjx-i\">\\(X\\)<\/span> = number of red, <span class=\"mjx-i\">\\(Y\\)<\/span> = number of blue. Find <span class=\"mjx-i\">\\(p(x,y)\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> 3 bi đỏ, 5 xanh, 2 hồng; rút 2 bi không hoàn lại. <span class=\"mjx-i\">\\(X\\)<\/span> = số bi đỏ, <span class=\"mjx-i\">\\(Y\\)<\/span> = số bi xanh. Tìm <span class=\"mjx-i\">\\(p(x,y)\\)<\/span>.<\/p>\n<p>Có <span class=\"mjx-i\">\\(\\binom{10}{2}=45\\)<\/span> cách rút. <span class=\"mjx-i\">\\(p(0,0)=\\tfrac{\\binom22}{45}=\\tfrac1{45}\\)<\/span>; <span class=\"mjx-i\">\\(p(0,1)=\\tfrac{5\\cdot2}{45}=\\tfrac{10}{45}\\)<\/span>; <span class=\"mjx-i\">\\(p(0,2)=\\tfrac{\\binom52}{45}=\\tfrac{10}{45}\\)<\/span>; <span class=\"mjx-i\">\\(p(1,0)=\\tfrac{3\\cdot2}{45}=\\tfrac6{45}\\)<\/span>; <span class=\"mjx-i\">\\(p(1,1)=\\tfrac{3\\cdot5}{45}=\\tfrac{15}{45}\\)<\/span>; <span class=\"mjx-i\">\\(p(2,0)=\\tfrac{\\binom32}{45}=\\tfrac3{45}\\)<\/span>. Tổng <span class=\"mjx-i\">\\(=\\tfrac{45}{45}\\)<\/span> ✓.<\/p>\n<\/div><h3>Hàm mật độ (liên tục)<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(f:\\mathbb{R}^D\\to\\mathbb{R}\\)<\/span> là <strong>pdf<\/strong> nếu <span class=\"mjx-i\">\\(f(x)\\ge0\\)<\/span> và <span class=\"mjx-i\">\\(\\int_{\\mathbb{R}^D}f(x)\\,dx=1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(P\\big((X,Y)\\in R\\big)=\\iint_Rp(x,y)\\,dx\\,dy\\)<\/span>.<\/li>\n<li>Biên: <span class=\"mjx-i\">\\(p(x)=\\int p(x,y)\\,dy\\)<\/span>; có điều kiện: <span class=\"mjx-i\">\\(p(x\\mid y)=\\dfrac{p(x,y)}{p(y)}\\)<\/span>.<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide)<\/h3>\n<p><strong>Example:<\/strong> <span class=\"mjx-i\">\\(f(x_1,x_2)=x_1+x_2\\)<\/span> on <span class=\"mjx-i\">\\(0&lt;x_1,x_2&lt;1\\)<\/span>. Compute <span class=\"mjx-i\">\\(P(X_1&lt;0{,}5,\\ X_2&lt;0{,}2)\\)<\/span>.<\/p>\n<p><div class=\"mjx-d\">\\[\\int_0^{0{,}5}\\!\\!\\int_0^{0{,}2}(x_1+x_2)\\,dx_2\\,dx_1=\\int_0^{0{,}5}(0{,}2x_1+0{,}02)\\,dx_1=0{,}025+0{,}01=0{,}035.\\]<\/div><\/p>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Hằng số chuẩn hóa <span class=\"mjx-i\">\\(c\\)<\/span>: cho tổng (hoặc tích phân) toàn miền bằng 1.<\/li>\n<li>Mật độ biên luôn kèm <strong>miền<\/strong> (ví dụ <span class=\"mjx-i\">\\(0\\le y\\le1\\)<\/span>).<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-6-h4\">1.3. Quy tắc tổng, quy tắc tích, định lý Bayes — mục 6.3<\/h2>\n<p><div class=\"mjx-d\">\\[\\text{Tổng: }p(x)=\\sum_yp(x,y)\\ \\text{ hoặc }\\int p(x,y)\\,dy\\qquad\\text{Tích: }p(x,y)=p(y\\mid x)\\,p(x)\\]<\/div>\n<div class=\"mjx-d\">\\[\\text{Bayes: }p(x\\mid y)=\\frac{p(y\\mid x)\\,p(x)}{p(y)}\\]<\/div><\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide)<\/h3>\n<p><strong>Example:<\/strong> Table: <span class=\"mjx-i\">\\(X\\in\\{-1,1\\}\\)<\/span>, <span class=\"mjx-i\">\\(Y\\in\\{1,2,4\\}\\)<\/span>; row <span class=\"mjx-i\">\\(X=-1\\)<\/span>: <span class=\"mjx-i\">\\(0{,}2;\\ 0{,}3;\\ 0{,}1\\)<\/span>; row <span class=\"mjx-i\">\\(X=1\\)<\/span>: <span class=\"mjx-i\">\\(0{,}1;\\ 0{,}05;\\ 0{,}25\\)<\/span>. Find <span class=\"mjx-i\">\\(P(X=1)\\)<\/span> and <span class=\"mjx-i\">\\(P(X=-1\\mid Y=2)\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(P(X=1)=0{,}1+0{,}05+0{,}25=0{,}4\\)<\/span> <em>(slide in nhầm <span class=\"mjx-i\">\\(0{,}6\\)<\/span>; <span class=\"mjx-i\">\\(0{,}6\\)<\/span> là <span class=\"mjx-i\">\\(P(X=-1)\\)<\/span>)<\/em>.<\/li>\n<li><span class=\"mjx-i\">\\(P(X=-1\\mid Y=2)=\\dfrac{0{,}3}{0{,}3+0{,}05}=\\dfrac{0{,}3}{0{,}35}=\\dfrac67\\)<\/span>.<\/li>\n<\/ul>\n<\/div><hr/>\n<h2 id=\"MAI391-6-h5\">1.4. Thống kê tóm tắt &amp; độc lập — mục 6.4<\/h2>\n<h3>Kỳ vọng<\/h3>\n<p><div class=\"mjx-d\">\\[E(X)=\\sum_xx\\,p(x)\\ \\text{ hoặc }\\int x\\,p(x)\\,dx,\\qquad E(g(X))=\\sum g(x)p(x)\\ \\text{ hoặc }\\int g(x)p(x)\\,dx\\]<\/div>\nVới vector <span class=\"mjx-i\">\\(X=(X_1,\\dots,X_d)\\)<\/span>: <span class=\"mjx-i\">\\(E(X)=(E X_1,\\dots,EX_d)^\\top\\)<\/span>.\n<strong>Kỳ vọng có điều kiện:<\/strong> <span class=\"mjx-i\">\\(E(Y\\mid X=x)=\\sum_y y\\,p(y\\mid x)\\)<\/span>.<\/p>\n<h3>Phương sai, hiệp phương sai, tương quan<\/h3>\n<p><div class=\"mjx-d\">\\[\\mathrm{Cov}(X,Y)=E(XY)-E(X)E(Y),\\qquad V(X)=\\mathrm{Cov}(X,X)=E(X^2)-(EX)^2\\]<\/div>\n<div class=\"mjx-d\">\\[\\mathrm{Corr}(X,Y)=\\frac{\\mathrm{Cov}(X,Y)}{\\sqrt{V(X)V(Y)}}\\in[-1,1]\\]<\/div>\nMa trận hiệp phương sai của vector <span class=\"mjx-i\">\\(X\\)<\/span>: <span class=\"mjx-i\">\\(V(X)=E(XX^\\top)-E(X)E(X)^\\top\\)<\/span>, phần tử <span class=\"mjx-i\">\\((i,j)=\\mathrm{Cov}(X_i,X_j)\\)<\/span>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide)<\/h3>\n<p><strong>Example:<\/strong> <span class=\"mjx-i\">\\(p(x,y)=x+y\\)<\/span> on <span class=\"mjx-i\">\\(0&lt;x,y&lt;1\\)<\/span>. Compute <span class=\"mjx-i\">\\(\\mathrm{Cov}(X,Y)\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(p(x)=x+\\tfrac12\\)<\/span>, <span class=\"mjx-i\">\\(p(y)=y+\\tfrac12\\)<\/span>; <span class=\"mjx-i\">\\(E(X)=E(Y)=\\int_0^1x(x+\\tfrac12)dx=\\tfrac13+\\tfrac14=\\tfrac7{12}\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(E(XY)=\\int_0^1\\!\\int_0^1xy(x+y)\\,dy\\,dx=\\tfrac13\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\mathrm{Cov}=\\tfrac13-\\tfrac{49}{144}=-\\tfrac1{144}\\approx-0{,}00694\\)<\/span>.<\/li>\n<\/ul>\n<\/div><h3>Trung bình &amp; hiệp phương sai mẫu (empirical) — mục 6.4.2<\/h3>\n<p>Với dữ liệu <span class=\"mjx-i\">\\(x_1,\\dots,x_N\\in\\mathbb{R}^d\\)<\/span>:\n<div class=\"mjx-d\">\\[\\bar x=\\frac1N\\sum_{n=1}^Nx_n,\\qquad \\Sigma=\\frac1N\\sum_{n=1}^N(x_n-\\bar x)(x_n-\\bar x)^\\top\\]<\/div><\/p>\n<blockquote>\n<p>Slide dùng <strong><span class=\"mjx-i\">\\(\\tfrac1N\\)<\/span><\/strong> (không phải <span class=\"mjx-i\">\\(\\tfrac1{N-1}\\)<\/span>). Đề thi theo slide, và đáp án nhiễu thường là kết quả chia <span class=\"mjx-i\">\\(N-1\\)<\/span>.<\/p>\n<\/blockquote>\n<h3>Tổng &amp; biến đổi tuyến tính — mục 6.4.4<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(E(X\\pm Y)=EX\\pm EY\\)<\/span>; <span class=\"mjx-i\">\\(V(X\\pm Y)=V(X)+V(Y)\\pm2\\mathrm{Cov}(X,Y)\\)<\/span> (với biến một chiều).<\/li>\n<li><span class=\"mjx-i\">\\(Y=AX+b\\)<\/span>: <span class=\"mjx-i\">\\(E(Y)=A\\mu+b\\)<\/span>, <span class=\"mjx-i\">\\(V(Y)=A\\Sigma A^\\top\\)<\/span>.<\/li>\n<li>Một chiều: <span class=\"mjx-i\">\\(E(aX+b)=aE(X)+b\\)<\/span>, <span class=\"mjx-i\">\\(V(aX+b)=a^2V(X)\\)<\/span>.<\/li>\n<\/ul>\n<h3>Độc lập — mục 6.4.5<\/h3>\n<p><span class=\"mjx-i\">\\(X,Y\\)<\/span> độc lập <span class=\"mjx-i\">\\(\\iff p(x,y)=p(x)p(y)\\iff p(y\\mid x)=p(y)\\)<\/span>. Khi đó <span class=\"mjx-i\">\\(E(XY)=EX\\,EY\\)<\/span> và <span class=\"mjx-i\">\\(\\mathrm{Cov}(X,Y)=0\\)<\/span> (chiều ngược lại <strong>không<\/strong> đúng).<\/p>\n<blockquote>\n<p>⚡ Nếu <span class=\"mjx-i\">\\(p(x,y)=g(x)h(y)\\)<\/span> trên <strong>miền chữ nhật<\/strong> (tích Descartes) thì <span class=\"mjx-i\">\\(X,Y\\)<\/span> độc lập, nên <span class=\"mjx-i\">\\(\\mathrm{Cov}=0\\)<\/span> ngay.<\/p>\n<\/blockquote>\n<h3>Tích trong của biến ngẫu nhiên — mục 6.4.6<\/h3>\n<p><span class=\"mjx-i\">\\(\\langle X,Y\\rangle=\\mathrm{Cov}(X,Y)\\)<\/span>, <span class=\"mjx-i\">\\(\\lVert X\\rVert^2=V(X)\\)<\/span>, <span class=\"mjx-i\">\\(\\cos\\theta=\\mathrm{Corr}(X,Y)\\)<\/span>. <span class=\"mjx-i\">\\(X\\perp Y\\iff\\mathrm{Cov}=0\\)<\/span> (không tương quan).<\/p>\n<hr/>\n<h2 id=\"MAI391-6-h6\">1.5. Phân phối Gauss (chuẩn) — mục 6.5<\/h2>\n<h3>Mật độ<\/h3>\n<ul>\n<li>Một chiều: <span class=\"mjx-i\">\\(p(x\\mid\\mu,\\sigma^2)=\\dfrac1{\\sqrt{2\\pi}\\,\\sigma}\\exp\\Big(-\\dfrac{(x-\\mu)^2}{2\\sigma^2}\\Big)\\)<\/span>.<\/li>\n<li>Nhiều chiều (<span class=\"mjx-i\">\\(x\\in\\mathbb{R}^D\\)<\/span>): <span class=\"mjx-i\">\\(p(x\\mid\\mu,\\Sigma)=\\dfrac{1}{\\sqrt{(2\\pi)^D\\det\\Sigma}}\\exp\\Big(-\\tfrac12(x-\\mu)^\\top\\Sigma^{-1}(x-\\mu)\\Big)\\)<\/span>, ký hiệu <span class=\"mjx-i\">\\(\\mathcal{N}(\\mu,\\Sigma)\\)<\/span>.<\/li>\n<li><strong>Trường hợp <span class=\"mjx-i\">\\(\\Sigma\\)<\/span> chéo<\/strong> <span class=\"mjx-i\">\\(\\mathrm{diag}(\\sigma_1^2,\\sigma_2^2)\\)<\/span> (hay ra trong đề):\n<div class=\"mjx-d\">\\[p(x,y)=\\frac{1}{2\\pi\\sigma_1\\sigma_2}\\exp\\Big(-\\frac{(x-\\mu_1)^2}{2\\sigma_1^2}-\\frac{(y-\\mu_2)^2}{2\\sigma_2^2}\\Big)\\]<\/div>\ntức là tích của hai mật độ Gauss một chiều độc lập.<\/li>\n<\/ul>\n<h3>Biên &amp; có điều kiện<\/h3>\n<p>Với <span class=\"mjx-i\">\\(p(x,y)=\\mathcal{N}\\Big(\\begin{bmatrix}\\mu_x\\\\\\mu_y\\end{bmatrix},\\begin{bmatrix}\\Sigma_{xx}&amp;\\Sigma_{xy}\\\\\\Sigma_{yx}&amp;\\Sigma_{yy}\\end{bmatrix}\\Big)\\)<\/span>:\n<div class=\"mjx-d\">\\[p(x)=\\mathcal{N}(\\mu_x,\\Sigma_{xx}),\\qquad p(x\\mid y)=\\mathcal{N}\\big(\\mu_x+\\Sigma_{xy}\\Sigma_{yy}^{-1}(y-\\mu_y),\\ \\ \\Sigma_{xx}-\\Sigma_{xy}\\Sigma_{yy}^{-1}\\Sigma_{yx}\\big)\\]<\/div><\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide)<\/h3>\n<p><strong>Example:<\/strong> <span class=\"mjx-i\">\\(p(x_1,x_2)=\\mathcal{N}\\Big(\\begin{bmatrix}-1\\\\2\\end{bmatrix},\\begin{bmatrix}0{,}2&amp;-0{,}5\\\\-0{,}5&amp;5\\end{bmatrix}\\Big)\\)<\/span>. Find <span class=\"mjx-i\">\\(p(x_1)\\)<\/span> and <span class=\"mjx-i\">\\(p(x_1\\mid x_2=1)\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(p(x_1)=\\mathcal{N}(-1,\\ 0{,}2)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\mu_{1|2}=-1+\\tfrac{-0{,}5}{5}(1-2)=-0{,}9\\)<\/span>; <span class=\"mjx-i\">\\(\\sigma^2_{1|2}=0{,}2-\\tfrac{(-0{,}5)^2}{5}=0{,}15\\)<\/span>. Vậy <span class=\"mjx-i\">\\(p(x_1\\mid x_2=1)=\\mathcal{N}(-0{,}9,\\ 0{,}15)\\)<\/span>.<\/li>\n<\/ul>\n<\/div><h3>Tổng &amp; biến đổi tuyến tính<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(X,Y\\)<\/span> Gauss <strong>độc lập<\/strong>: <span class=\"mjx-i\">\\(aX+bY\\sim\\mathcal{N}(a\\mu_x+b\\mu_y,\\ a^2\\Sigma_x+b^2\\Sigma_y)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(X\\sim\\mathcal{N}(\\mu,\\Sigma)\\)<\/span>, <span class=\"mjx-i\">\\(Y=AX\\)<\/span>: <span class=\"mjx-i\">\\(Y\\sim\\mathcal{N}(A\\mu,\\ A\\Sigma A^\\top)\\)<\/span>.<\/li>\n<li>Ví dụ slide: <span class=\"mjx-i\">\\(X\\sim\\mathcal N(2,5)\\)<\/span>, <span class=\"mjx-i\">\\(Y\\sim\\mathcal N(1,3)\\)<\/span> độc lập, nên <span class=\"mjx-i\">\\(V(2X+3Y)=4\\cdot5+9\\cdot3=47\\)<\/span>.<\/li>\n<\/ul>\n<h3>Hỗn hợp Gauss (mixture)<\/h3>\n<p><span class=\"mjx-i\">\\(p(x)=\\sum_k\\pi_k\\,\\mathcal{N}(\\mu_k,\\Sigma_k)\\)<\/span> có kỳ vọng <span class=\"mjx-i\">\\(E(X)=\\sum_k\\pi_k\\mu_k\\)<\/span>.<\/p>\n<h3>Chuẩn hóa để tính xác suất<\/h3>\n<p><span class=\"mjx-i\">\\(X\\sim\\mathcal{N}(\\mu,\\sigma^2)\\)<\/span>: <span class=\"mjx-i\">\\(P(a&lt;X&lt;b)=\\Phi\\big(\\tfrac{b-\\mu}{\\sigma}\\big)-\\Phi\\big(\\tfrac{a-\\mu}{\\sigma}\\big)\\)<\/span>, với <span class=\"mjx-i\">\\(\\Phi(0)=0{,}5\\)<\/span>, <span class=\"mjx-i\">\\(\\Phi(-z)=1-\\Phi(z)\\)<\/span>. Nhớ: <span class=\"mjx-i\">\\(\\sigma=\\sqrt{\\text{phương sai}}\\)<\/span>.<\/p>\n<p>→ Cần nhớ:<\/p>\n<ul>\n<li>Trong <span class=\"mjx-i\">\\(\\mathcal{N}(\\mu,\\Sigma)\\)<\/span>, số thứ hai là <strong>phương sai<\/strong>, không phải độ lệch chuẩn.<\/li>\n<li>Mật độ có <span class=\"mjx-i\">\\(\\Sigma\\)<\/span> chéo: số dưới mẫu trong mũ là <span class=\"mjx-i\">\\(2\\sigma_i^2\\)<\/span> (gấp đôi phương sai).<\/li>\n<\/ul>\n<hr/>\n<h1 id=\"MAI391-6-h7\"><span class=\"pn\">Phần 2<\/span>Đề thi thường ra gì ở chương 6<\/h1>\n<p><em>Thống kê từ 10 đề MAI391: FA24-RE, FA24-FE, SU24-RE, SP25-RE, 4 mã đề SP26, và 2 đề MAI391 không ghi kỳ (<strong>Đề A<\/strong>, <strong>Đề B<\/strong>); thêm <strong>Đề C<\/strong> là đề tự luận trong 3 ảnh (câu 1–9 thuộc Chương 6, câu 10–14 thuộc Chương 7, không có lựa chọn A/B/C/D).<\/em><\/p>\n<p><strong>Quy luật:<\/strong> ở các đề FA24, SU24, SP25, Đề A và Đề B, <strong>câu 27 đến câu 33 là Chương 6<\/strong> (đôi khi kéo sang câu 39–40). Đề SP26 xáo trộn nhưng vẫn có 7–9 câu. Tức là Chương 6 chiếm khoảng <strong>8/40 câu (20%)<\/strong>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dạng<\/th>\n<th>Số đề có<\/th>\n<th>Kiểu hỏi chủ yếu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Xác suất cơ bản &amp; biến ngẫu nhiên một chiều<\/strong><\/td>\n<td>10/10<\/td>\n<td>Phân phối đều (<span class=\"mjx-i\">\\(X^2\\le18\\)<\/span>, <span class=\"mjx-i\">\\(2^X\\le50\\)<\/span>); số giá trị của <span class=\"mjx-i\">\\(Z=X+kY\\)<\/span>; <span class=\"mjx-i\">\\(\\Omega\\)<\/span> hữu hạn; cdf; nhị thức<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Phân phối đồng thời rời rạc<\/strong><\/td>\n<td>10/10<\/td>\n<td>Hằng số <span class=\"mjx-i\">\\(c\\)<\/span>, <span class=\"mjx-i\">\\(k\\)<\/span>; phân phối biên dạng bảng; <span class=\"mjx-i\">\\(P(\\cdot\\mid\\cdot)\\)<\/span>; <span class=\"mjx-i\">\\(E(Y\\mid X=1)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>3. Phân phối đồng thời liên tục<\/strong><\/td>\n<td>9/10<\/td>\n<td>Hằng số <span class=\"mjx-i\">\\(c\\)<\/span>; mật độ biên <span class=\"mjx-i\">\\(p(x)\\)<\/span>, <span class=\"mjx-i\">\\(p(y)\\)<\/span>; xác suất trên hình chữ nhật<\/td>\n<\/tr>\n<tr>\n<td><strong>4. Kỳ vọng, phương sai, hiệp phương sai<\/strong><\/td>\n<td>5/10<\/td>\n<td><span class=\"mjx-i\">\\(V(X)\\)<\/span>, <span class=\"mjx-i\">\\(V(Y)\\)<\/span> từ bảng
