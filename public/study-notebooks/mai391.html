{df}{dt}\\)<\/span>.<\/p>\n<p><strong>Bước 1 — đạo hàm riêng của <span class=\"mjx-i\">\\(f\\)<\/span>:<\/strong> <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_1}=2x_1+x_2\\)<\/span>, <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_2}=x_1\\)<\/span>.\n<strong>Bước 2 — đạo hàm của biến trung gian:<\/strong> <span class=\"mjx-i\">\\(\\dfrac{dx_1}{dt}=\\cos t\\)<\/span>, <span class=\"mjx-i\">\\(\\dfrac{dx_2}{dt}=-\\sin t\\)<\/span>.\n<strong>Bước 3 — ghép:<\/strong>\n<div class=\"mjx-d\">\\[\\frac{df}{dt}=(2x_1+x_2)\\cos t+x_1(-\\sin t)=(2\\sin t+\\cos t)\\cos t-\\sin t\\sin t\\]<\/div>\n<div class=\"mjx-d\">\\[=2\\sin t\\cos t+\\cos^2t-\\sin^2t=\\sin(2t)+\\cos(2t)\\]<\/div>\n<strong>Kiểm tra bằng thế trực tiếp:<\/strong> <span class=\"mjx-i\">\\(f=\\sin^2t+\\sin t\\cos t=\\dfrac{1-\\cos2t}{2}+\\dfrac{\\sin2t}{2}\\)<\/span>, đạo hàm: <span class=\"mjx-i\">\\(\\sin2t+\\cos2t\\)<\/span> ✓.<\/p>\n<\/div><hr/>\n<h2 id=\"MAI391-5-h5\">5.3 Gradient của hàm vectơ và ma trận Jacobian<\/h2>\n<h3>Định nghĩa<\/h3>\n<p>Hàm vectơ <span class=\"mjx-i\">\\(f:\\mathbb R^n\\to\\mathbb R^m\\)<\/span>, <span class=\"mjx-i\">\\(f(x)=\\begin{bmatrix}f_1(x)\\\\\\vdots\\\\f_m(x)\\end{bmatrix}\\)<\/span> với mỗi <span class=\"mjx-i\">\\(f_i:\\mathbb R^n\\to\\mathbb R\\)<\/span>.<\/p>\n<ul>\n<li>Đạo hàm riêng theo <span class=\"mjx-i\">\\(x_j\\)<\/span> là <strong>vectơ cột<\/strong> <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_j}=\\begin{bmatrix}\\partial f_1/\\partial x_j\\\\\\vdots\\\\\\partial f_m/\\partial x_j\\end{bmatrix}\\in\\mathbb R^m\\)<\/span>.<\/li>\n<li><strong>Ma trận Jacobian<\/strong> <span class=\"mjx-i\">\\(J=\\nabla_xf=\\dfrac{df}{dx}\\in\\mathbb R^{m\\times n}\\)<\/span>:\n<div class=\"mjx-d\">\\[J=\\begin{bmatrix}\\dfrac{\\partial f}{\\partial x_1}&amp;\\cdots&amp;\\dfrac{\\partial f}{\\partial x_n}\\end{bmatrix}=\\begin{bmatrix}\\dfrac{\\partial f_1}{\\partial x_1}&amp;\\cdots&amp;\\dfrac{\\partial f_1}{\\partial x_n}\\\\\\vdots&amp;&amp;\\vdots\\\\\\dfrac{\\partial f_m}{\\partial x_1}&amp;\\cdots&amp;\\dfrac{\\partial f_m}{\\partial x_n}\\end{bmatrix}\\]<\/div><\/li>\n<\/ul>\n<blockquote>\n<p>⚡ <strong>Cách nhớ cỡ và vị trí:<\/strong> <strong>hàng <span class=\"mjx-i\">\\(i\\)<\/span> = gradient của hàm thành phần <span class=\"mjx-i\">\\(f_i\\)<\/span><\/strong>; <strong>cột <span class=\"mjx-i\">\\(j\\)<\/span> = đạo hàm theo biến <span class=\"mjx-i\">\\(x_j\\)<\/span><\/strong>. Số hàng <span class=\"mjx-i\">\\(=m\\)<\/span> (số hàm), số cột <span class=\"mjx-i\">\\(=n\\)<\/span> (số biến).<\/p>\n<\/blockquote>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 1 (từ slide) — hàm tuyến tính<\/h3>\n<p>Nếu <span class=\"mjx-i\">\\(f(x)=Ax\\)<\/span> với <span class=\"mjx-i\">\\(A\\in\\mathbb R^{m\\times n}\\)<\/span> thì <span class=\"mjx-i\">\\(f_i=\\sum_ja_{ij}x_j\\)<\/span>, nên <span class=\"mjx-i\">\\(\\dfrac{\\partial f_i}{\\partial x_j}=a_{ij}\\)<\/span>. Vậy <strong>Jacobian <span class=\"mjx-i\">\\(=A\\)<\/span><\/strong>, và <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_j}\\)<\/span> là cột thứ <span class=\"mjx-i\">\\(j\\)<\/span> của <span class=\"mjx-i\">\\(A\\)<\/span>.<\/p>\n<\/div><div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 2 (từ slide) — giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> <span class=\"mjx-i\">\\(f(x,y)=\\begin{bmatrix}xy^2&amp;y^3&amp;x^2-y^2\\end{bmatrix}^\\top\\)<\/span>. Find the partial derivatives.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> <span class=\"mjx-i\">\\(f(x,y)=\\begin{bmatrix}xy^2&amp;y^3&amp;x^2-y^2\\end{bmatrix}^\\top\\)<\/span>. Tìm các đạo hàm riêng.<\/p>\n<ul>\n<li>Theo <span class=\"mjx-i\">\\(x\\)<\/span> (<span class=\"mjx-i\">\\(y\\)<\/span> hằng): <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x}=\\begin{bmatrix}y^2\\\\0\\\\2x\\end{bmatrix}\\)<\/span> (thành phần <span class=\"mjx-i\">\\(y^3\\)<\/span> không chứa <span class=\"mjx-i\">\\(x\\)<\/span> nên cho <span class=\"mjx-i\">\\(0\\)<\/span>).<\/li>\n<li>Theo <span class=\"mjx-i\">\\(y\\)<\/span> (<span class=\"mjx-i\">\\(x\\)<\/span> hằng): <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial y}=\\begin{bmatrix}2xy\\\\3y^2\\\\-2y\\end{bmatrix}\\)<\/span>.<\/li>\n<\/ul>\n<p>Jacobian <span class=\"mjx-i\">\\(3\\times2\\)<\/span>: <span class=\"mjx-i\">\\(J=\\begin{bmatrix}y^2&amp;2xy\\\\0&amp;3y^2\\\\2x&amp;-2y\\end{bmatrix}\\)<\/span>.<\/p>\n<\/div><div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 3 (từ slide) — Jacobian đầy đủ, giải chi tiết<\/h3>\n<p><strong>Đề:<\/strong> <span class=\"mjx-i\">\\(f:\\mathbb R^2\\to\\mathbb R^3\\)<\/span>, <span class=\"mjx-i\">\\(f(x_1,x_2)=\\begin{bmatrix}e^{-x_1+x_2}\\\\x_1x_2^2\\\\\\sin x_1\\end{bmatrix}\\)<\/span>.<\/p>\n<p>Lập bảng đạo hàm từng thành phần theo từng biến:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Hàm<\/th>\n<th><span class=\"mjx-i\">\\(\\partial/\\partial x_1\\)<\/span><\/th>\n<th><span class=\"mjx-i\">\\(\\partial/\\partial x_2\\)<\/span><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"mjx-i\">\\(f_1=e^{-x_1+x_2}\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(-e^{-x_1+x_2}\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(e^{-x_1+x_2}\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(f_2=x_1x_2^2\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(x_2^2\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(2x_1x_2\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(f_3=\\sin x_1\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(\\cos x_1\\)<\/span><\/td>\n<td><span class=\"mjx-i\">\\(0\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><div class=\"mjx-d\">\\[J=\\begin{bmatrix}-e^{-x_1+x_2}&amp;e^{-x_1+x_2}\\\\x_2^2&amp;2x_1x_2\\\\\\cos x_1&amp;0\\end{bmatrix}\\in\\mathbb R^{3\\times2}\\]<\/div><\/p>\n<\/div><h3>Quy tắc chuỗi dạng ma trận<\/h3>\n<p>Nếu <span class=\"mjx-i\">\\(f:\\mathbb R^n\\to\\mathbb R^m\\)<\/span> và <span class=\"mjx-i\">\\(x=x(t)\\)<\/span> với <span class=\"mjx-i\">\\(t\\in\\mathbb R^l\\)<\/span> (<span class=\"mjx-i\">\\(x:\\mathbb R^l\\to\\mathbb R^n\\)<\/span>), thì\n<div class=\"mjx-d\">\\[\\frac{\\partial f_j}{\\partial t_k}=\\sum_{i=1}^n\\frac{\\partial f_j}{\\partial x_i}\\frac{\\partial x_i}{\\partial t_k},\\qquad\\boxed{\\nabla_tf=\\nabla_xf\\cdot\\nabla_tx}\\]<\/div>\n(Jacobian của hàm hợp <span class=\"mjx-i\">\\(=\\)<\/span> tích hai Jacobian, <strong>đúng thứ tự<\/strong>: <span class=\"mjx-i\">\\(m\\times n\\)<\/span> nhân <span class=\"mjx-i\">\\(n\\times l\\)<\/span> cho <span class=\"mjx-i\">\\(m\\times l\\)<\/span>.)<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 4 (từ slide) — giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> <span class=\"mjx-i\">\\(f(x_1,x_2)=x_1^2+2x_1x_2\\)<\/span>, <span class=\"mjx-i\">\\(x_1=s\\cos t\\)<\/span>, <span class=\"mjx-i\">\\(x_2=s\\sin t\\)<\/span>. Find <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial s},\\dfrac{\\partial f}{\\partial t}\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> <span class=\"mjx-i\">\\(f(x_1,x_2)=x_1^2+2x_1x_2\\)<\/span>, <span class=\"mjx-i\">\\(x_1=s\\cos t\\)<\/span>, <span class=\"mjx-i\">\\(x_2=s\\sin t\\)<\/span>. Tìm <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial s},\\dfrac{\\partial f}{\\partial t}\\)<\/span>.<\/p>\n<p><strong>Các đạo hàm cần dùng:<\/strong> <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_1}=2x_1+2x_2\\)<\/span>, <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x_2}=2x_1\\)<\/span>; <span class=\"mjx-i\">\\(\\dfrac{\\partial x_1}{\\partial s}=\\cos t\\)<\/span>, <span class=\"mjx-i\">\\(\\dfrac{\\partial x_2}{\\partial s}=\\sin t\\)<\/span>, <span class=\"mjx-i\">\\(\\dfrac{\\partial x_1}{\\partial t}=-s\\sin t\\)<\/span>, <span class=\"mjx-i\">\\(\\dfrac{\\partial x_2}{\\partial t}=s\\cos t\\)<\/span>.<\/p>\n<p><strong>Theo <span class=\"mjx-i\">\\(s\\)<\/span>:<\/strong>\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial s}=(2x_1+2x_2)\\cos t+2x_1\\sin t=(2s\\cos t+2s\\sin t)\\cos t+2s\\cos t\\sin t\\]<\/div>\n<div class=\"mjx-d\">\\[=2s\\cos^2t+2s\\sin t\\cos t+2s\\sin t\\cos t=2s\\cos^2t+4s\\sin t\\cos t=2s\\cos^2t+2s\\sin2t\\]<\/div><\/p>\n<p><strong>Theo <span class=\"mjx-i\">\\(t\\)<\/span>:<\/strong>\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial t}=(2x_1+2x_2)(-s\\sin t)+2x_1(s\\cos t)=-2s^2\\sin t\\cos t-2s^2\\sin^2t+2s^2\\cos^2t\\]<\/div>\n<div class=\"mjx-d\">\\[=-s^2\\sin2t+2s^2\\cos2t\\]<\/div>\n(dùng <span class=\"mjx-i\">\\(2\\sin t\\cos t=\\sin2t\\)<\/span> và <span class=\"mjx-i\">\\(\\cos^2t-\\sin^2t=\\cos2t\\)<\/span>.)<\/p>\n<p><strong>Kiểm tra bằng dạng ma trận:<\/strong> <span class=\"mjx-i\">\\(\\nabla_xf=[\\,2x_1+2x_2\\ \\ 2x_1\\,]\\)<\/span> (<span class=\"mjx-i\">\\(1\\times2\\)<\/span>), <span class=\"mjx-i\">\\(\\nabla_tx=\\begin{bmatrix}\\cos t&amp;-s\\sin t\\\\\\sin t&amp;s\\cos t\\end{bmatrix}\\)<\/span> (<span class=\"mjx-i\">\\(2\\times2\\)<\/span>), tích <span class=\"mjx-i\">\\(=[\\,\\partial_sf\\ \\ \\partial_tf\\,]\\)<\/span> đúng như trên.<\/p>\n<\/div><hr/>\n<h2 id=\"MAI391-5-h6\">5.6 Lan truyền ngược (Backpropagation) và vi phân tự động<\/h2>\n<h3>5.6.1 Gradient trong mạng sâu<\/h3>\n<p>Mạng nơ-ron là hàm hợp nhiều tầng:\n<div class=\"mjx-d\">\\[y=(f_K\\circ f_{K-1}\\circ\\cdots\\circ f_1)(x)=f_K(f_{K-1}(\\cdots f_1(x)\\cdots))\\]<\/div>\nTầng thứ <span class=\"mjx-i\">\\(i\\)<\/span>: <span class=\"mjx-i\">\\(f_i(x_{i-1})=\\sigma(A_{i-1}x_{i-1}+b_{i-1})\\)<\/span>, trong đó <span class=\"mjx-i\">\\(\\sigma\\)<\/span> là hàm kích hoạt (sigmoid, ReLU, tanh, …). Cần tìm các tham số <span class=\"mjx-i\">\\(\\theta_j=\\{A_j,b_j\\}\\)<\/span> làm nhỏ nhất hàm mất mát <span class=\"mjx-i\">\\(L(\\theta)=\\lVert y-f_K(\\theta,x)\\rVert^2\\)<\/span>.<\/p>\n<p>Theo quy tắc chuỗi:\n<div class=\"mjx-d\">\\[\\frac{\\partial L}{\\partial\\theta_{K-1}}=\\frac{\\partial L}{\\partial f_K}\\frac{\\partial f_K}{\\partial\\theta_{K-1}},\\quad\\frac{\\partial L}{\\partial\\theta_{K-2}}=\\frac{\\partial L}{\\partial f_K}\\frac{\\partial f_K}{\\partial f_{K-1}}\\frac{\\partial f_{K-1}}{\\partial\\theta_{K-2}},\\ \\cdots\\]<\/div>\n<div class=\"mjx-d\">\\[\\frac{\\partial L}{\\partial\\theta_i}=\\frac{\\partial L}{\\partial f_K}\\frac{\\partial f_K}{\\partial f_{K-1}}\\cdots\\frac{\\partial f_{i+2}}{\\partial f_{i+1}}\\frac{\\partial f_{i+1}}{\\partial\\theta_i}\\]<\/div>\nPhần lớn phép tính của <span class=\"mjx-i\">\\(\\dfrac{\\partial L}{\\partial\\theta_{i+1}}\\)<\/span> được <strong>tái sử dụng<\/strong> cho <span class=\"mjx-i\">\\(\\dfrac{\\partial L}{\\partial\\theta_i}\\)<\/span>: gradient được truyền <strong>ngược<\/strong> qua mạng.<\/p>\n<h3>5.6.2 Vi phân tự động<\/h3>\n<p><strong>Vi phân tự động (automatic differentiation)<\/strong> là tập kỹ thuật tính <strong>chính xác<\/strong> (bằng số) gradient bằng cách dùng biến trung gian và quy tắc chuỗi. Với đồ thị dữ liệu <span class=\"mjx-i\">\\(x\\to a\\to b\\to y\\)<\/span>:<\/p>\n<ul>\n<li><strong>Chế độ thuận (forward mode):<\/strong> nhân từ đầu vào ra: <span class=\"mjx-i\">\\(\\dfrac{dy}{dx}=\\dfrac{dy}{db}\\left(\\dfrac{db}{da}\\dfrac{da}{dx}\\right)\\)<\/span>.<\/li>\n<li><strong>Chế độ ngược (reverse mode):<\/strong> nhân từ đầu ra về: <span class=\"mjx-i\">\\(\\dfrac{dy}{dx}=\\left(\\dfrac{dy}{db}\\dfrac{db}{da}\\right)\\dfrac{da}{dx}\\)<\/span>. Chế độ ngược <strong>chính là backpropagation<\/strong>.<\/li>\n<\/ul>\n<p><strong>Công thức tổng quát:<\/strong> đặt <span class=\"mjx-i\">\\(x_1,\\dots,x_d\\)<\/span> là biến vào, <span class=\"mjx-i\">\\(x_{d+1},\\dots,x_{D-1}\\)<\/span> là biến trung gian, <span class=\"mjx-i\">\\(x_D=f\\)<\/span> là biến ra, <span class=\"mjx-i\">\\(x_i=g_i(x_{\\text{Pa}(x_i)})\\)<\/span>. Khi đó\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial x_i}=\\sum_{x_j:\\,x_i\\in\\text{Pa}(x_j)}\\frac{\\partial f}{\\partial x_j}\\frac{\\partial x_j}{\\partial x_i}\\]<\/div>\nTức: đạo hàm theo một nút <span class=\"mjx-i\">\\(=\\)<\/span> <strong>cộng<\/strong> (qua mọi nút con) của [đạo hàm theo nút con] <span class=\"mjx-i\">\\(\\times\\)<\/span> [đạo hàm cục bộ nút con theo nút đó].<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide) — giải chi tiết, kèm số<\/h3>\n<p><strong>Problem:<\/strong> <span class=\"mjx-i\">\\(f(x)=\\sqrt{x^2+\\exp(x^2)}+\\cos\\big(x^2+\\exp(x^2)\\big)\\)<\/span>. Find <span class=\"mjx-i\">\\(\\dfrac{df}{dx}\\)<\/span> using backpropagation.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> <span class=\"mjx-i\">\\(f(x)=\\sqrt{x^2+\\exp(x^2)}+\\cos\\big(x^2+\\exp(x^2)\\big)\\)<\/span>. Tìm <span class=\"mjx-i\">\\(\\dfrac{df}{dx}\\)<\/span> bằng backpropagation.<\/p>\n<p><strong>Bước 1 — đặt biến trung gian:<\/strong> <span class=\"mjx-i\">\\(a=x^2\\)<\/span>, <span class=\"mjx-i\">\\(b=\\exp(a)\\)<\/span>, <span class=\"mjx-i\">\\(c=a+b\\)<\/span>, <span class=\"mjx-i\">\\(d=\\sqrt c\\)<\/span>, <span class=\"mjx-i\">\\(e=\\cos c\\)<\/span>, <span class=\"mjx-i\">\\(f=d+e\\)<\/span>.<\/p>\n<p><strong>Bước 2 — đạo hàm cục bộ (từng cạnh của đồ thị):<\/strong>\n<div class=\"mjx-d\">\\[\\frac{\\partial a}{\\partial x}=2x,\\ \\frac{\\partial b}{\\partial a}=\\exp(a),\\ \\frac{\\partial c}{\\partial a}=\\frac{\\partial c}{\\partial b}=1,\\ \\frac{\\partial d}{\\partial c}=\\frac1{2\\sqrt c},\\ \\frac{\\partial e}{\\partial c}=-\\sin c,\\ \\frac{\\partial f}{\\partial d}=\\frac{\\partial f}{\\partial e}=1\\]<\/div><\/p>\n<p><strong>Bước 3 — lan truyền ngược<\/strong> (từ <span class=\"mjx-i\">\\(f\\)<\/span> về <span class=\"mjx-i\">\\(x\\)<\/span>). <span class=\"mjx-i\">\\(c\\)<\/span> có <strong>hai nút con<\/strong> là <span class=\"mjx-i\">\\(d\\)<\/span> và <span class=\"mjx-i\">\\(e\\)<\/span> nên phải cộng:\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial c}=\\frac{\\partial f}{\\partial d}\\frac{\\partial d}{\\partial c}+\\frac{\\partial f}{\\partial e}\\frac{\\partial e}{\\partial c}=\\frac1{2\\sqrt c}-\\sin c\\]<\/div>\n<span class=\"mjx-i\">\\(b\\)<\/span> chỉ có nút con <span class=\"mjx-i\">\\(c\\)<\/span>: <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial b}=\\dfrac{\\partial f}{\\partial c}\\cdot1\\)<\/span>.\n<span class=\"mjx-i\">\\(a\\)<\/span> có <strong>hai nút con<\/strong> là <span class=\"mjx-i\">\\(b\\)<\/span> và <span class=\"mjx-i\">\\(c\\)<\/span> nên cộng:\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial a}=\\frac{\\partial f}{\\partial b}\\frac{\\partial b}{\\partial a}+\\frac{\\partial f}{\\partial c}\\frac{\\partial c}{\\partial a}=\\frac{\\partial f}{\\partial c}\\exp(a)+\\frac{\\partial f}{\\partial c}=\\frac{\\partial f}{\\partial c}\\,(\\exp(a)+1)\\]<\/div>\n<div class=\"mjx-d\">\\[\\frac{\\partial f}{\\partial x}=\\frac{\\partial f}{\\partial a}\\cdot2x=2x\\,\\big(e^{x^2}+1\\big)\\left(\\frac1{2\\sqrt c}-\\sin c\\right),\\qquad c=x^2+e^{x^2}\\]<\/div><\/p>\n<blockquote>\n<p>⚠️ Slide viết thiếu chữ ở dòng <span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial a}\\)<\/span> (in ra \"<span class=\"mjx-i\">\\(\\frac{\\partial f}{\\partial b}\\exp(a)+\\frac{\\partial f}{\\partial c}\\)<\/span>\" rồi bỏ nhân <span class=\"mjx-i\">\\(\\frac{\\partial c}{\\partial a}=1\\)<\/span>); công thức trên là bản đầy đủ.<\/p>\n<\/blockquote>\n<p><strong>Kiểm tra bằng số tại <span class=\"mjx-i\">\\(x=1\\)<\/span> (làm tròn):<\/strong> <span class=\"mjx-i\">\\(a=1\\)<\/span>, <span class=\"mjx-i\">\\(b=e\\approx2.7183\\)<\/span>, <span class=\"mjx-i\">\\(c\\approx3.7183\\)<\/span>, <span class=\"mjx-i\">\\(d\\approx1.9283\\)<\/span>, <span class=\"mjx-i\">\\(\\partial_cf=\\dfrac1{2\\cdot1.9283}-\\sin(3.7183)\\approx0.2593+0.5452=0.8045\\)<\/span>; <span class=\"mjx-i\">\\(\\partial_af\\approx0.8045\\times(2.7183+1)=2.9915\\)<\/span>; <span class=\"mjx-i\">\\(\\partial_xf\\approx2.9915\\times2\\approx5.983\\)<\/span>. Đạo hàm bằng công thức trên và bằng tính trực tiếp đều cho <span class=\"mjx-i\">\\(\\approx5.983\\)<\/span> ✓.<\/p>\n<\/div><hr/>\n<h2 id=\"MAI391-5-h7\">5.7 Đạo hàm cấp cao và ma trận Hessian<\/h2>\n<p>Với <span class=\"mjx-i\">\\(f:\\mathbb R^2\\to\\mathbb R\\)<\/span> khả vi hai lần liên tục:\n<div class=\"mjx-d\">\\[\\frac{\\partial^2f}{\\partial x^2}=\\frac{\\partial}{\\partial x}\\left(\\frac{\\partial f}{\\partial x}\\right),\\quad\\frac{\\partial^2f}{\\partial x\\partial y}=\\frac{\\partial}{\\partial x}\\left(\\frac{\\partial f}{\\partial y}\\right),\\quad\\frac{\\partial^2f}{\\partial y\\partial x}=\\frac{\\partial}{\\partial y}\\left(\\frac{\\partial f}{\\partial x}\\right)\\]<\/div>\n<strong>Định lý đối xứng (Schwarz):<\/strong> nếu <span class=\"mjx-i\">\\(f\\)<\/span> khả vi hai lần liên tục thì <span class=\"mjx-i\">\\(\\dfrac{\\partial^2f}{\\partial x\\partial y}=\\dfrac{\\partial^2f}{\\partial y\\partial x}\\)<\/span>.<\/p>\n<p><strong>Ma trận Hessian<\/strong> (đối xứng):\n<div class=\"mjx-d\">\\[H=\\nabla^2_{x,y}f=\\begin{bmatrix}\\dfrac{\\partial^2f}{\\partial x^2}&amp;\\dfrac{\\partial^2f}{\\partial x\\partial y}\\\\[6pt]\\dfrac{\\partial^2f}{\\partial y\\partial x}&amp;\\dfrac{\\partial^2f}{\\partial y^2}\\end{bmatrix}\\]<\/div>\nVới <span class=\"mjx-i\">\\(f:\\mathbb R^n\\to\\mathbb R\\)<\/span>: <span class=\"mjx-i\">\\(H_{ij}=\\dfrac{\\partial^2f}{\\partial x_i\\partial x_j}\\in\\mathbb R^{n\\times n}\\)<\/span>. Hessian chính là <strong>Jacobian của gradient<\/strong>.<\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ (từ slide) — giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> <span class=\"mjx-i\">\\(f(x,y)=e^{-x^2+2y}\\)<\/span>. Find the Hessian at <span class=\"mjx-i\">\\((0,0)\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> <span class=\"mjx-i\">\\(f(x,y)=e^{-x^2+2y}\\)<\/span>. Tìm Hessian tại <span class=\"mjx-i\">\\((0,0)\\)<\/span>.<\/p>\n<p><strong>Bước 1 — đạo hàm cấp 1<\/strong> (đặt <span class=\"mjx-i\">\\(E=e^{-x^2+2y}\\)<\/span>): <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x}=-2xE\\)<\/span>, <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial y}=2E\\)<\/span>.<\/p>\n<p><strong>Bước 2 — đạo hàm cấp 2:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial^2f}{\\partial x^2}=\\dfrac{\\partial}{\\partial x}(-2xE)=-2E+(-2x)(-2xE)=(-2+4x^2)E\\)<\/span> (quy tắc tích).<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial^2f}{\\partial y^2}=\\dfrac{\\partial}{\\partial y}(2E)=2\\cdot2E=4E\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial^2f}{\\partial x\\partial y}=\\dfrac{\\partial}{\\partial x}(2E)=2\\cdot(-2xE)=-4xE\\)<\/span>, và <span class=\"mjx-i\">\\(\\dfrac{\\partial^2f}{\\partial y\\partial x}=\\dfrac{\\partial}{\\partial y}(-2xE)=-2x\\cdot2E=-4xE\\)<\/span> ✓ bằng nhau.<\/li>\n<\/ul>\n<blockquote>\n<p>⚠️ Slide in <span class=\"mjx-i\">\\(-4xe^{-x^2+y^2}\\)<\/span> ở ô hỗn hợp; đúng phải là <span class=\"mjx-i\">\\(-4xe^{-x^2+2y}\\)<\/span> (không ảnh hưởng kết quả tại <span class=\"mjx-i\">\\((0,0)\\)<\/span> vì có thừa số <span class=\"mjx-i\">\\(x\\)<\/span>).<\/p>\n<\/blockquote>\n<p><strong>Bước 3 — thay <span class=\"mjx-i\">\\((0,0)\\)<\/span><\/strong> (<span class=\"mjx-i\">\\(E=e^0=1\\)<\/span>): <span class=\"mjx-i\">\\(f_{xx}=-2\\)<\/span>, <span class=\"mjx-i\">\\(f_{yy}=4\\)<\/span>, <span class=\"mjx-i\">\\(f_{xy}=0\\)<\/span>.\n<div class=\"mjx-d\">\\[\\nabla^2f(0,0)=\\begin{bmatrix}-2&amp;0\\\\0&amp;4\\end{bmatrix}\\]<\/div><\/p>\n<\/div><hr/>\n<h2 id=\"MAI391-5-h8\">5.8 Tuyến tính hóa và chuỗi Taylor nhiều biến<\/h2>\n<p><strong>Định lý (bậc 1):<\/strong> nếu <span class=\"mjx-i\">\\(f:\\mathbb R^n\\to\\mathbb R\\)<\/span> có đạo hàm riêng liên tục đến cấp 2 thì <span class=\"mjx-i\">\\(f(x)=f(a)+\\nabla_xf(a)\\cdot(x-a)+R_1(x,a)\\)<\/span>, sai số <span class=\"mjx-i\">\\(R_1=O(\\lVert x-a\\rVert^2)\\)<\/span>, tức là tiến về 0 nhanh hơn <span class=\"mjx-i\">\\(\\lVert x-a\\rVert\\)<\/span> khi <span class=\"mjx-i\">\\(x\\to a\\)<\/span>.<\/p>\n<p><strong>Đa thức Taylor bậc 1 (tuyến tính hóa) tại <span class=\"mjx-i\">\\(a\\)<\/span>:<\/strong>\n<div class=\"mjx-d\">\\[T_1(x)=f(a)+\\nabla_xf(a)\\cdot(x-a)=f(a)+\\sum_{i=1}^n\\frac{\\partial f}{\\partial x_i}(a)(x_i-a_i)\\]<\/div><\/p>\n<p><strong>Đa thức Taylor bậc 2 tại <span class=\"mjx-i\">\\(a\\)<\/span><\/strong> (cần <span class=\"mjx-i\">\\(f\\)<\/span> có đạo hàm riêng liên tục đến cấp 3; sai số <span class=\"mjx-i\">\\(R_2=O(\\lVert x-a\\rVert^3)\\)<\/span>):\n<div class=\"mjx-d\">\\[T_2(x)=f(a)+\\nabla_xf(a)\\,(x-a)+\\frac12(x-a)^\\top\\nabla_x^2f(a)\\,(x-a)\\]<\/div>\n<div class=\"mjx-d\">\\[=f(a)+\\sum_i\\frac{\\partial f}{\\partial x_i}(a)(x_i-a_i)+\\frac12\\sum_{i,j}\\frac{\\partial^2f}{\\partial x_i\\partial x_j}(a)(x_i-a_i)(x_j-a_j)\\]<\/div><\/p>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 1 (từ slide) — bậc 1, giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> Find the degree-1 Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y)=x^2+2xy^3\\)<\/span> at <span class=\"mjx-i\">\\((1,2)\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> Tìm đa thức Taylor bậc 1 của <span class=\"mjx-i\">\\(f(x,y)=x^2+2xy^3\\)<\/span> tại <span class=\"mjx-i\">\\((1,2)\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(f(1,2)=1+2\\cdot1\\cdot8=17\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x}=2x+2y^3\\Rightarrow\\dfrac{\\partial f}{\\partial x}(1,2)=2+16=18\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial y}=6xy^2\\Rightarrow\\dfrac{\\partial f}{\\partial y}(1,2)=6\\cdot1\\cdot4=24\\)<\/span>.<\/li>\n<\/ul>\n<p><div class=\"mjx-d\">\\[T_1(x,y)=17+18(x-1)+24(y-2)\\]<\/div><\/p>\n<\/div><div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ 2 (từ slide) — bậc 2, giải chi tiết<\/h3>\n<p><strong>Problem:<\/strong> Find the degree-2 Taylor polynomial of <span class=\"mjx-i\">\\(f(x,y)=e^{x+y^2}\\)<\/span> around <span class=\"mjx-i\">\\((0,0)\\)<\/span>.<\/p>\n<p><em>Dịch đề:<\/em> <strong>Đề:<\/strong> Tìm đa thức Taylor bậc 2 của <span class=\"mjx-i\">\\(f(x,y)=e^{x+y^2}\\)<\/span> quanh <span class=\"mjx-i\">\\((0,0)\\)<\/span>.<\/p>\n<p><strong>Đạo hàm<\/strong> (đặt <span class=\"mjx-i\">\\(E=e^{x+y^2}\\)<\/span>): <span class=\"mjx-i\">\\(f_x=E\\)<\/span>, <span class=\"mjx-i\">\\(f_y=2yE\\)<\/span>, <span class=\"mjx-i\">\\(f_{xx}=E\\)<\/span>, <span class=\"mjx-i\">\\(f_{xy}=f_{yx}=2yE\\)<\/span>, <span class=\"mjx-i\">\\(f_{yy}=2E+2y\\cdot2yE=(2+4y^2)E\\)<\/span>.<\/p>\n<p><strong>Tại <span class=\"mjx-i\">\\((0,0)\\)<\/span><\/strong> (<span class=\"mjx-i\">\\(E=1\\)<\/span>): <span class=\"mjx-i\">\\(f=1\\)<\/span>; <span class=\"mjx-i\">\\(\\nabla f=\\begin{bmatrix}1&amp;0\\end{bmatrix}\\)<\/span>; <span class=\"mjx-i\">\\(\\nabla^2f=\\begin{bmatrix}1&amp;0\\\\0&amp;2\\end{bmatrix}\\)<\/span>.<\/p>\n<p><strong>Ghép:<\/strong>\n<div class=\"mjx-d\">\\[T_2=1+\\begin{bmatrix}1&amp;0\\end{bmatrix}\\begin{bmatrix}x\\\\y\\end{bmatrix}+\\frac12\\begin{bmatrix}x&amp;y\\end{bmatrix}\\begin{bmatrix}1&amp;0\\\\0&amp;2\\end{bmatrix}\\begin{bmatrix}x\\\\y\\end{bmatrix}=1+x+\\frac12\\big(x^2+2y^2\\big)=1+x+\\frac12x^2+y^2\\]<\/div>\n<strong>Kiểm tra bằng khai triển Maclaurin:<\/strong> <span class=\"mjx-i\">\\(e^{x+y^2}=1+(x+y^2)+\\frac{(x+y^2)^2}{2}+\\cdots=1+x+y^2+\\frac{x^2}2+(\\text{bậc}\\ge3)\\)<\/span> ✓.<\/p>\n<\/div><hr/>\n<h2 id=\"MAI391-5-h9\">Ghi chú các lỗi chính tả của slide (để khỏi nhầm)<\/h2>\n<ol>\n<li>Ví dụ đạo hàm riêng: đề ghi <span class=\"mjx-i\">\\(2y^4\\)<\/span>, lời giải dùng <span class=\"mjx-i\">\\(3y^4\\)<\/span>.<\/li>\n<li>Ví dụ Hessian: ô hỗn hợp in <span class=\"mjx-i\">\\(-4xe^{-x^2+y^2}\\)<\/span>, đúng là <span class=\"mjx-i\">\\(-4xe^{-x^2+2y}\\)<\/span>.<\/li>\n<li>Ví dụ backprop: dòng <span class=\"mjx-i\">\\(\\partial f/\\partial a\\)<\/span> bị bỏ thừa số <span class=\"mjx-i\">\\(\\partial c/\\partial a=1\\)<\/span>.<\/li>\n<\/ol>\n<hr/>\n<h1 id=\"MAI391-5-h10\"><span class=\"pn\">Phần 2<\/span>Đề thi thường ra gì ở chương 5<\/h1>\n<p><em>Thống kê từ 10 đề MAI391: FA24-RE, FA24-FE, SU24-RE, SP25-RE, 4 mã đề SP26, và 2 đề MAI391 không ghi kỳ (<strong>Đề A<\/strong>, <strong>Đề B<\/strong>).<\/em><\/p>\n<p><strong>Quy luật:<\/strong> ở các đề FA24, SU24, SP25, Đề A và Đề B, <strong>câu 16 đến câu 26 là Chương 5<\/strong>, theo thứ tự gần như cố định: Taylor 1 biến → đạo hàm riêng → quy tắc chuỗi → Jacobian → đồ thị tính toán → Hessian → Taylor nhiều biến. Đề SP26 xáo trộn nhưng vẫn có 9–12 câu. Tức là Chương 5 chiếm khoảng <strong>10/40 câu (25%)<\/strong>, <strong>nhiều câu nhất<\/strong> cả đề.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Dạng<\/th>\n<th>Số đề có<\/th>\n<th>Kiểu hỏi chủ yếu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Taylor một biến<\/strong><\/td>\n<td>10/10<\/td>\n<td><span class=\"mjx-i\">\\(T_2\\)<\/span>, <span class=\"mjx-i\">\\(T_3\\)<\/span> tại <span class=\"mjx-i\">\\(a\\)<\/span>; tổng <span class=\"mjx-i\">\\(a_0+a_1+a_2\\)<\/span>; giá trị xấp xỉ; hệ số của <span class=\"mjx-i\">\\((x-1)^3\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>2. Đạo hàm riêng &amp; gradient<\/strong><\/td>\n<td>8/10<\/td>\n<td><span class=\"mjx-i\">\\(\\partial z/\\partial x\\)<\/span> tại một điểm; gradient tại một điểm<\/td>\n<\/tr>\n<tr>\n<td><strong>3. Quy tắc chuỗi<\/strong><\/td>\n<td>7/10<\/td>\n<td><span class=\"mjx-i\">\\(\\partial z/\\partial\\theta\\)<\/span>, <span class=\"mjx-i\">\\(\\partial z/\\partial s\\)<\/span>, <span class=\"mjx-i\">\\(df/dt\\)<\/span>; dạng ma trận; tìm <span class=\"mjx-i\">\\(dy/dt\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>4. Ma trận Jacobian<\/strong><\/td>\n<td>10/10<\/td>\n<td><span class=\"mjx-i\">\\(\\det J\\)<\/span>; một phần tử <span class=\"mjx-i\">\\((i,j)\\)<\/span> của <span class=\"mjx-i\">\\(J\\)<\/span>; chuẩn Euclid của <span class=\"mjx-i\">\\(J\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>5. Đồ thị tính toán (backprop)<\/strong><\/td>\n<td>9/10<\/td>\n<td>Viết công thức <span class=\"mjx-i\">\\(f\\)<\/span>; công thức <span class=\"mjx-i\">\\(\\partial f/\\partial x\\)<\/span>; tính giá trị đạo hàm<\/td>\n<\/tr>\n<tr>\n<td><strong>6. Ma trận Hessian<\/strong><\/td>\n<td>10/10<\/td>\n<td>Một phần tử <span class=\"mjx-i\">\\((i,j)\\)<\/span>; cả ma trận; <span class=\"mjx-i\">\\(\\det H\\)<\/span>; tổng một hàng/đường chéo<\/td>\n<\/tr>\n<tr>\n<td><strong>7. Taylor nhiều biến<\/strong><\/td>\n<td>10/10<\/td>\n<td>Hệ số trong <span class=\"mjx-i\">\\(T_1\\)<\/span>, <span class=\"mjx-i\">\\(T_2\\)<\/span>; <span class=\"mjx-i\">\\(a-b\\)<\/span>, <span class=\"mjx-i\">\\(a+b+c\\)<\/span>; giá trị xấp xỉ<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-5-h11\"><span class=\"pn\">Phần 3<\/span>Các dạng bài<\/h1>\n<p>Mỗi dạng gồm: cách nhận biết → công thức → cách làm → <strong>ví dụ mẫu (giải chi tiết)<\/strong> → lỗi thường gặp → <strong>mẹo nhanh / thử đáp án / cách khác / bấm máy Casio<\/strong> → <strong>câu đề thật<\/strong> (chép nguyên văn như trong đề, để tự luyện).<\/p>\n<p>Ghi chú nguồn: <code>[FA24-RE Q16]<\/code> = đề FA24 thi lại, câu 16. Câu nào xuất hiện ở nhiều đề thì chỉ chép một lần và ghi đủ các nguồn. Các câu đồ thị tính toán có hình trong đề gốc đã được chép lại thành sơ đồ dạng chữ (ký hiệu <span class=\"mjx-i\">\\([\\,\\cdot\\,]\\)<\/span> là một phép toán).<\/p>\n<h2 id=\"MAI391-5-h12\">Chuẩn bị: Casio fx-580VN X cho Chương 5<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Việc cần làm<\/th>\n<th>Thao tác (Calculate mode)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Đạo hàm tại một điểm <span class=\"mjx-i\">\\(f'(a)\\)<\/span><\/td>\n<td><code>SHIFT<\/code> <code>∫<\/code> (d/dx) → nhập <span class=\"mjx-i\">\\(f(X)\\)<\/span>, điểm <span class=\"mjx-i\">\\(a\\)<\/span> → <code>=<\/code><\/td>\n<\/tr>\n<tr>\n<td>Đạo hàm riêng <span class=\"mjx-i\">\\(\\partial f/\\partial x\\)<\/span> tại <span class=\"mjx-i\">\\((a,b)\\)<\/span><\/td>\n<td>d/dx của <span class=\"mjx-i\">\\(f(X,b)\\)<\/span> (thay <span class=\"mjx-i\">\\(y\\)<\/span> bằng số <span class=\"mjx-i\">\\(b\\)<\/span>) tại <span class=\"mjx-i\">\\(X=a\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>Thay số vào biểu thức nhiều biến<\/td>\n<td>Gõ biểu thức theo X, Y, A, B…, bấm <code>CALC<\/code>, nhập giá trị<\/td>\n<\/tr>\n<tr>\n<td>Đạo hàm cấp 2 <span class=\"mjx-i\">\\(f''(a)\\)<\/span> (gần đúng)<\/td>\n<td>Gõ <code>(f(A+0.001)-2f(A)+f(A-0.001))÷0.001²<\/code>, <code>CALC<\/code><\/td>\n<\/tr>\n<tr>\n<td>Đạo hàm hỗn hợp <span class=\"mjx-i\">\\(f_{xy}(a,b)\\)<\/span> (gần đúng)<\/td>\n<td><code>(f(a+h,b+h)-f(a+h,b-h)-f(a-h,b+h)+f(a-h,b-h))÷(4h²)<\/code>, <span class=\"mjx-i\">\\(h=0{,}001\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>Định thức Jacobian/Hessian<\/td>\n<td><code>MENU<\/code> → Matrix → nhập các số đã tính → <code>Det<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Lưu ý:<\/strong> dùng <strong>Rad<\/strong> (<code>SHIFT<\/code> <code>MENU<\/code> → Angle Unit → Radian) cho mọi câu có sin, cos. Kết quả gần đúng như <span class=\"mjx-i\">\\(12{,}0000003\\)<\/span> thì làm tròn thành <span class=\"mjx-i\">\\(12\\)<\/span>.<\/p>\n<\/blockquote>\n<hr/>\n<h2 id=\"MAI391-5-h13\">Dạng 1: Đa thức Taylor một biến<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Taylor polynomial <span class=\"mjx-i\">\\(T_2\\)<\/span> / <span class=\"mjx-i\">\\(T_3\\)<\/span>\"<\/em>, <em>\"Taylor expansion … centered at 0\"<\/em>, <em>\"the value <span class=\"mjx-i\">\\(a_0+a_1+a_2\\)<\/span>\"<\/em>, <em>\"approximated value … using <span class=\"mjx-i\">\\(P(x)\\)<\/span>\"<\/em>, <em>\"coefficient of <span class=\"mjx-i\">\\((x-1)^3\\)<\/span>\"<\/em>, <em>\"Taylor series of … at <span class=\"mjx-i\">\\(a=1\\)<\/span>\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[T_n(x)=\\sum_{k=0}^n\\frac{f^{(k)}(a)}{k!}(x-a)^k,\\qquad\\text{hệ số của }(x-a)^k\\text{ là }\\frac{f^{(k)}(a)}{k!}\\]<\/div>\nChuỗi cơ bản (xem Phần 1): <span class=\"mjx-i\">\\(e^u\\)<\/span>, <span class=\"mjx-i\">\\(\\sin u\\)<\/span>, <span class=\"mjx-i\">\\(\\cos u\\)<\/span>, <span class=\"mjx-i\">\\(\\ln(1+u)=u-\\tfrac{u^2}{2}+\\tfrac{u^3}{3}-\\cdots\\)<\/span>, <span class=\"mjx-i\">\\((1+u)^\\alpha=1+\\alpha u+\\tfrac{\\alpha(\\alpha-1)}{2}u^2+\\cdots\\)<\/span>.<\/p>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Tính <span class=\"mjx-i\">\\(f(a), f'(a), f''(a), \\dots\\)<\/span> đến bậc cần.<\/li>\n<li>Chia cho <span class=\"mjx-i\">\\(k!\\)<\/span> để ra hệ số.<\/li>\n<li>Câu \"<span class=\"mjx-i\">\\(a_0+a_1+a_2\\)<\/span>\" (khai triển tại 0) thì <span class=\"mjx-i\">\\(=f(0)+f'(0)+\\tfrac{f''(0)}{2}\\)<\/span>.<\/li>\n<li>Câu \"giá trị xấp xỉ tại <span class=\"mjx-i\">\\(x_1\\)<\/span>\": thay <span class=\"mjx-i\">\\(x_1\\)<\/span> vào <span class=\"mjx-i\">\\(T_n\\)<\/span>, <strong>không<\/strong> thay vào <span class=\"mjx-i\">\\(f\\)<\/span>.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (tổng hệ số).<\/strong> The Taylor expansion of <span class=\"mjx-i\">\\(f(x)=3^x\\)<\/span> centered at 0 is <span class=\"mjx-i\">\\(a_0+a_1x+a_2x^2+\\dots\\)<\/span> What is <span class=\"mjx-i\">\\(a_0+a_1+a_2\\)<\/span>?<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f(0)=1\\)<\/span>; <span class=\"mjx-i\">\\(f'(x)=3^x\\ln3\\)<\/span> nên <span class=\"mjx-i\">\\(f'(0)=\\ln3\\)<\/span>; <span class=\"mjx-i\">\\(f''(0)=(\\ln3)^2\\)<\/span>. Vậy <span class=\"mjx-i\">\\(a_0+a_1+a_2=1+\\ln3+\\tfrac{(\\ln3)^2}{2}\\approx1+1{,}0986+0{,}6035=2{,}7021\\)<\/span>.<\/p>\n<p><strong>Ví dụ 2 (<span class=\"mjx-i\">\\(T_2\\)<\/span> tại <span class=\"mjx-i\">\\(a\\ne0\\)<\/span>).<\/strong> Find <span class=\"mjx-i\">\\(T_2\\)<\/span> of <span class=\"mjx-i\">\\(f(x)=\\sqrt{x+5}\\)<\/span> at <span class=\"mjx-i\">\\(x=4\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f(4)=3\\)<\/span>; <span class=\"mjx-i\">\\(f'(x)=\\tfrac{1}{2\\sqrt{x+5}}\\)<\/span> nên <span class=\"mjx-i\">\\(f'(4)=\\tfrac16\\)<\/span>; <span class=\"mjx-i\">\\(f''(x)=-\\tfrac{1}{4(x+5)^{3/2}}\\)<\/span> nên <span class=\"mjx-i\">\\(f''(4)=-\\tfrac1{108}\\)<\/span>.\n<div class=\"mjx-d\">\\[T_2=3+\\tfrac16(x-4)-\\tfrac{1}{216}(x-4)^2\\quad(\\text{vì }\\tfrac{-1/108}{2}=-\\tfrac1{216}).\\]<\/div><\/p>\n<p><strong>Ví dụ 3 (hàm hợp).<\/strong> Find <span class=\"mjx-i\">\\(T_2\\)<\/span> centered at <span class=\"mjx-i\">\\(0\\)<\/span> of <span class=\"mjx-i\">\\(f(x)=e^{\\sin x}\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f(0)=1\\)<\/span>; <span class=\"mjx-i\">\\(f'=\\cos x\\,e^{\\sin x}\\)<\/span> nên <span class=\"mjx-i\">\\(f'(0)=1\\)<\/span>; <span class=\"mjx-i\">\\(f''=(\\cos^2x-\\sin x)e^{\\sin x}\\)<\/span> nên <span class=\"mjx-i\">\\(f''(0)=1\\)<\/span>. Vậy <span class=\"mjx-i\">\\(T_2=1+x+\\tfrac12x^2\\)<\/span>.<\/p>\n<p><strong>Ví dụ 4 (hệ số bậc cao bằng phép thế).<\/strong> Find the coefficient of <span class=\"mjx-i\">\\((x-2)^3\\)<\/span> in the Taylor series of <span class=\"mjx-i\">\\(f(x)=e^{x^2-4}\\)<\/span> about <span class=\"mjx-i\">\\(x=2\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> Đặt <span class=\"mjx-i\">\\(t=x-2\\)<\/span>, thì <span class=\"mjx-i\">\\(x^2-4=4t+t^2\\)<\/span>. Khai triển <span class=\"mjx-i\">\\(e^{u}=1+u+\\tfrac{u^2}2+\\tfrac{u^3}6+\\dots\\)<\/span> với <span class=\"mjx-i\">\\(u=4t+t^2\\)<\/span>, chỉ giữ số hạng <span class=\"mjx-i\">\\(t^3\\)<\/span>:<\/p>\n<ul>\n<li>Từ <span class=\"mjx-i\">\\(\\tfrac{u^2}{2}=\\tfrac{(4t+t^2)^2}{2}\\)<\/span>: số hạng <span class=\"mjx-i\">\\(t^3\\)<\/span> là <span class=\"mjx-i\">\\(\\tfrac{2\\cdot4\\cdot1}{2}t^3=4t^3\\)<\/span>.<\/li>\n<li>Từ <span class=\"mjx-i\">\\(\\tfrac{u^3}{6}\\)<\/span>: số hạng <span class=\"mjx-i\">\\(t^3\\)<\/span> là <span class=\"mjx-i\">\\(\\tfrac{64}{6}t^3=\\tfrac{32}{3}t^3\\)<\/span>.<\/li>\n<li>Tổng: <span class=\"mjx-i\">\\(4+\\tfrac{32}3=\\tfrac{44}{3}\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 5 (giá trị xấp xỉ).<\/strong> <span class=\"mjx-i\">\\(f(x)=2\\cos x+e^x\\)<\/span> is approximated by <span class=\"mjx-i\">\\(P(x)=a+bx+cx^2\\)<\/span> (Taylor at 0). Compute <span class=\"mjx-i\">\\(P(0{,}5)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f(0)=3\\)<\/span>, <span class=\"mjx-i\">\\(f'(0)=-2\\sin0+e^0=1\\)<\/span>, <span class=\"mjx-i\">\\(f''(0)=-2\\cos0+e^0=-1\\)<\/span>. <span class=\"mjx-i\">\\(P(x)=3+x-\\tfrac12x^2\\)<\/span>, nên <span class=\"mjx-i\">\\(P(0{,}5)=3+0{,}5-0{,}125=3{,}375\\)<\/span>.<\/p>\n<p><strong>Ví dụ 6 (đa thức tại <span class=\"mjx-i\">\\(a\\)<\/span>).<\/strong> Find the Taylor series of <span class=\"mjx-i\">\\(f(x)=x^3-2x\\)<\/span> at <span class=\"mjx-i\">\\(a=2\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(f(2)=4\\)<\/span>; <span class=\"mjx-i\">\\(f'(2)=3\\cdot4-2=10\\)<\/span>; <span class=\"mjx-i\">\\(\\tfrac{f''(2)}{2}=\\tfrac{12}{2}=6\\)<\/span>; <span class=\"mjx-i\">\\(\\tfrac{f'''(2)}{6}=1\\)<\/span>. Vậy <span class=\"mjx-i\">\\(f=4+10(x-2)+6(x-2)^2+(x-2)^3\\)<\/span> (chính xác, vì <span class=\"mjx-i\">\\(f\\)<\/span> là đa thức bậc 3).<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Quên chia <span class=\"mjx-i\">\\(k!\\)<\/span> (đặc biệt <span class=\"mjx-i\">\\(3!=6\\)<\/span>).<\/li>\n<li>Quên đạo hàm hàm hợp: <span class=\"mjx-i\">\\(\\tfrac{d}{dx}\\cos(6x)=-6\\sin(6x)\\)<\/span>, nên đạo hàm bậc <span class=\"mjx-i\">\\(k\\)<\/span> có thêm <span class=\"mjx-i\">\\(6^k\\)<\/span>.<\/li>\n<li>Thay <span class=\"mjx-i\">\\(x\\)<\/span> vào <span class=\"mjx-i\">\\(f\\)<\/span> thay vì vào <span class=\"mjx-i\">\\(P(x)\\)<\/span> khi đề hỏi giá trị <strong>xấp xỉ<\/strong>.<\/li>\n<li><span class=\"mjx-i\">\\(2^{x+1}\\)<\/span>: đạo hàm là <span class=\"mjx-i\">\\(2^{x+1}\\ln2\\)<\/span>, không phải <span class=\"mjx-i\">\\((x+1)2^x\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Kiểm tra <span class=\"mjx-i\">\\(T(a)=f(a)\\)<\/span>:<\/strong> số hạng hằng của mọi đáp án phải bằng <span class=\"mjx-i\">\\(f(a)\\)<\/span>. Thường loại ngay 1–2 đáp án (ví dụ <span class=\"mjx-i\">\\(f=\\sin(e^x)\\)<\/span> thì hằng số phải là <span class=\"mjx-i\">\\(\\sin1\\)<\/span>).<\/li>\n<li><strong>Dấu của hệ số bậc 1<\/strong> = dấu của <span class=\"mjx-i\">\\(f'(a)\\)<\/span>: hàm tăng tại <span class=\"mjx-i\">\\(a\\)<\/span> thì hệ số dương.<\/li>\n<li><strong>Phép thế<\/strong>: hàm <span class=\"mjx-i\">\\(e^{g(x)}\\)<\/span>, <span class=\"mjx-i\">\\(\\sin(g(x))\\)<\/span>, <span class=\"mjx-i\">\\(\\ln(g(x))\\)<\/span> tại <span class=\"mjx-i\">\\(a\\)<\/span>: đặt <span class=\"mjx-i\">\\(t=x-a\\)<\/span>, khai triển <span class=\"mjx-i\">\\(g\\)<\/span> theo <span class=\"mjx-i\">\\(t\\)<\/span> rồi thế vào chuỗi cơ bản (Ví dụ 4). Nhanh hơn đạo hàm 3 lần.<\/li>\n<li><strong>Tích với đa thức<\/strong>: <span class=\"mjx-i\">\\((x-1)\\sin x=(x-1)(x-\\tfrac{x^3}{6}+\\dots)=-x+x^2+\\tfrac{x^3}{6}-\\dots\\)<\/span> (nhân trực tiếp chuỗi).<\/li>\n<li><strong><span class=\"mjx-i\">\\(f\\)<\/span> là đa thức<\/strong>: khai triển tại <span class=\"mjx-i\">\\(a\\)<\/span> là <strong>viết lại<\/strong> <span class=\"mjx-i\">\\(f\\)<\/span> theo <span class=\"mjx-i\">\\((x-a)\\)<\/span>, nên tổng các hệ số tại <span class=\"mjx-i\">\\(a=1\\)<\/span> bằng <span class=\"mjx-i\">\\(f(2)\\)<\/span> (thay <span class=\"mjx-i\">\\(x-1=1\\)<\/span>).<\/li>\n<\/ul>\n<p><strong>Thử đáp án<\/strong><\/p>\n<ul>\n<li>Chọn <span class=\"mjx-i\">\\(x\\)<\/span> gần <span class=\"mjx-i\">\\(a\\)<\/span> (ví dụ <span class=\"mjx-i\">\\(a+0{,}1\\)<\/span>), tính <span class=\"mjx-i\">\\(f(a+0{,}1)\\)<\/span> bằng máy và tính từng đáp án tại <span class=\"mjx-i\">\\(x=a+0{,}1\\)<\/span>. Đáp án gần <span class=\"mjx-i\">\\(f\\)<\/span> nhất là đúng (sai số cỡ <span class=\"mjx-i\">\\(0{,}1^{n+1}\\)<\/span>).<\/li>\n<li>Câu \"<span class=\"mjx-i\">\\(a_0+a_1+a_2\\)<\/span>\" với đáp án thập phân: tính trực tiếp <span class=\"mjx-i\">\\(f(0)+f'(0)+f''(0)/2\\)<\/span> bằng máy.<\/li>\n<\/ul>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(f'(a)\\)<\/span>: <code>SHIFT<\/code> <code>∫<\/code> (d/dx) → <code>d/dx(2^(X+1))|x=0<\/code> → <span class=\"mjx-i\">\\(1{,}3863\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(f''(a)\\)<\/span> gần đúng: <code>CALC<\/code> biểu thức <code>(f(A+0.001)-2f(A)+f(A-0.001))÷0.001²<\/code> với <span class=\"mjx-i\">\\(A=a\\)<\/span>.<\/li>\n<li>Ví dụ <span class=\"mjx-i\">\\(f=2^{x+1}\\)<\/span> tại 0: <span class=\"mjx-i\">\\(f(0)=2\\)<\/span>, <span class=\"mjx-i\">\\(f'(0)\\approx1{,}3863\\)<\/span>, <span class=\"mjx-i\">\\(f''(0)\\approx0{,}9609\\)<\/span>, nên <span class=\"mjx-i\">\\(a_0+a_1+a_2\\approx2+1{,}3863+0{,}4805\\)<\/span>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">11 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-5-q1\"><strong>Câu 1.1<\/strong> <code>[FA24-RE Q16]<\/code> <code>[SU24-RE Q14]<\/code> <code>[Đề B Q17]<\/code>\nThe Taylor expansion of function <span class=\"mjx-i\">\\(f(x)=2^{x+1}\\)<\/span> centered at 0 is a polynomial of the form <span class=\"mjx-i\">\\(a_0+a_1x+\\ldots+a_nx^n+\\ldots\\)<\/span> What is the value <span class=\"mjx-i\">\\(a_0+a_1+a_2\\)<\/span> ?<\/p>\n<ul>\n<li>A. 3.93<\/li>\n<li>B. 3.78<\/li>\n<li>C. 3.51<\/li>\n<li>D. 3.73<\/li>\n<li>E. 3.87<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q2\"><strong>Câu 1.2<\/strong> <code>[FA24-RE Q17]<\/code> <code>[Đề A Q16]<\/code>\nThe function <span class=\"mjx-i\">\\(f(x) = 3\\sin(x) + e^x\\)<\/span> is approximated by a second degree polynomial <span class=\"mjx-i\">\\(P(x) = a + bx + cx^2\\)<\/span> , using Taylor expansion centered at 0.\nCompute the approximated value of <span class=\"mjx-i\">\\(f(x)\\)<\/span> at <span class=\"mjx-i\">\\(x = 1\\)<\/span> using the polynomial <span class=\"mjx-i\">\\(P(x)\\)<\/span> .<\/p>\n<ul>\n<li>A. 5.5<\/li>\n<li>B. 3.2<\/li>\n<li>C. 5.9<\/li>\n<li>D. 4.5<\/li>\n<li>E. 3.5<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q3\"><strong>Câu 1.3<\/strong> <code>[SP26 Q26]<\/code> <code>[SP26 Q17]<\/code>\nFind the Taylor polynomial <span class=\"mjx-i\">\\(T_2\\)<\/span> centered at <span class=\"mjx-i\">\\(a = 0\\)<\/span> for the function <span class=\"mjx-i\">\\(f(x) = e^{\\cos x}\\)<\/span><\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(e + ex + \\frac{e}{2}x^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(e + \\frac{e}{2}x^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(e - ex + \\frac{e}{2}x^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(e - \\frac{e}{2}x^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iii)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q4\"><strong>Câu 1.4<\/strong> <code>[SP26 Q27]<\/code> <code>[Đề A Q17]<\/code> <code>[SP26 Q18]<\/code>\nSeek the Taylor polynomial <span class=\"mjx-i\">\\(T_2\\)<\/span> of <span class=\"mjx-i\">\\(f(x) = \\sqrt{x+2}\\)<\/span> at <span class=\"mjx-i\">\\(x = 2\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(2 + \\frac{1}{4}(x - 2) - \\frac{1}{32}(x - 2)^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(2 - \\frac{1}{4}(x - 2) + \\frac{1}{32}(x - 2)^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(2 + \\frac{1}{4}(x - 2) - \\frac{1}{64}(x - 2)^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(2 - \\frac{1}{4}(x - 2) + \\frac{1}{64}(x - 2)^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q5\"><strong>Câu 1.5<\/strong> <code>[SP25-RE Q17]<\/code>\nFind the Taylor polynomial <span class=\"mjx-i\">\\(T_3(x)\\)<\/span> of the function <span class=\"mjx-i\">\\(f(x)=\\cos(6x)\\)<\/span> at <span class=\"mjx-i\">\\(a=1\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\cos(6)+6\\sin(6)(x-1)+18\\cos(6)(x-1)^2+36\\sin(6)(x-1)^3\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\cos(6)-6\\sin(6)(x-1)-18\\cos(6)(x-1)^2+36\\sin(6)(x-1)^3\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\cos(6)-6\\sin(6)(x-1)-36\\cos(6)(x-1)^2-216\\sin(6)(x-1)^3\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iii)<\/p>\n<\/li>\n<li>\n<p>B. (i)<\/p>\n<\/li>\n<li>\n<p>C. (ii)<\/p>\n<\/li>\n<li>\n<p>D. None of the other choices is correct<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q6\"><strong>Câu 1.6<\/strong> <code>[SP25-RE Q36]<\/code> <code>[SP26 Q34]<\/code>\nThe Taylor expansion of function <span class=\"mjx-i\">\\(f(x) = (x-1)\\sin(x)\\)<\/span> centered at 0 is a polynomial of the form <span class=\"mjx-i\">\\(a_0 + a_1x + \\ldots + a_n x^n + \\ldots\\)<\/span> What is the value of <span class=\"mjx-i\">\\(a_0 + a_1 + a_2 + a_3\\)<\/span> ?<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(-3/4\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(1/12\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(-1/6\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(3/12\\)<\/span><\/li>\n<li>E. <span class=\"mjx-i\">\\(1/6\\)<\/span><\/li>\n<li>F. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q7\"><strong>Câu 1.7<\/strong> <code>[Đề B Q16]<\/code>\nFind the Taylor polynomial <span class=\"mjx-i\">\\(T_2\\)<\/span> centered at <span class=\"mjx-i\">\\(a = 0\\)<\/span> for the function <span class=\"mjx-i\">\\(f(x) = \\cos(e^x)\\)<\/span><\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\sin(1) - \\cos(1)x - \\frac{\\sin(1) + \\cos(1)}{2}x^2\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\cos(1) - \\sin(1)x - \\frac{\\cos(1) + \\sin(1)}{2}x^2\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\cos(1) + \\sin(1)x + \\frac{\\cos(1) + \\sin(1)}{2}x^2\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\cos(1) + \\sin(1)x - \\frac{\\cos(1) + \\sin(1)}{2}x^2\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q8\"><strong>Câu 1.8<\/strong> <code>[SP26 Q18]<\/code>\nFind the Taylor polynomial <span class=\"mjx-i\">\\(T_2\\)<\/span> centered at <span class=\"mjx-i\">\\(a = 0\\)<\/span> for the function <span class=\"mjx-i\">\\(f(x) = \\sin(e^x)\\)<\/span><\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\sin(1) + \\cos(1)x + \\frac{\\cos(1) - \\sin(1)}{2}x^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(\\sin(1) + \\cos(1)x + \\frac{\\sin(1) - \\cos(1)}{2}x^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(\\cos(1) + \\sin(1)x + \\frac{\\cos(1) + \\sin(1)}{2}x^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(\\cos(1) + \\sin(1)x - \\frac{\\cos(1) + \\sin(1)}{2}x^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iv)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (ii)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q9\"><strong>Câu 1.9<\/strong> <code>[FA24-FE Q16]<\/code> <code>[SP26 Q22]<\/code>\nFind the coefficient of <span class=\"mjx-i\">\\((x-1)^3\\)<\/span> in the Taylor series of <span class=\"mjx-i\">\\(f(x)=e^{x^2-1}\\)<\/span> about <span class=\"mjx-i\">\\(x=1\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(5/6\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(10/3\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(10\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(30\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q10\"><strong>Câu 1.10<\/strong> <code>[FA24-FE Q17]<\/code>\nFind the Taylor series of the fuction <span class=\"mjx-i\">\\(f(x)=1+x+x^2\\)<\/span> at <span class=\"mjx-i\">\\(a=1\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(3-3(x-1)-(x-1)^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(3-3(x-1)+(x-1)^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(3+3(x-1)-(x-1)^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(3+3(x-1)+(x-1)^2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<li>\n<p>E. None of the other choices is correct<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q11\"><strong>Câu 1.11<\/strong> <code>[SP26 Q18]<\/code>\nFind the Taylor series of the fuction <span class=\"mjx-i\">\\(f(x) = 1 + x + x^2 + x^3\\)<\/span> at <span class=\"mjx-i\">\\(a = 1\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(4 + 6(x - 1) + 4(x - 1)^2 + (x - 1)^3\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(4 - 6(x - 1) + 4(x - 1)^2 - (x - 1)^3\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(4 + 6(x - 1) - 4(x - 1)^2 - (x - 1)^3\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(4 + 6(x - 1) + 8(x - 1)^2 + 6(x - 1)^3\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. None of the other choices is correct<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<li>\n<p>E. (iii)<\/p>\n<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-5-h14\">Dạng 2: Đạo hàm riêng &amp; gradient<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Find <span class=\"mjx-i\">\\(\\frac{\\partial z}{\\partial x}(a,b)\\)<\/span>\"<\/em>, <em>\"derivative of <span class=\"mjx-i\">\\(f\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span> at …\"<\/em>, <em>\"value of the gradient of <span class=\"mjx-i\">\\(f\\)<\/span> at …\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x}\\)<\/span>: coi mọi biến khác là <strong>hằng số<\/strong>, đạo hàm theo <span class=\"mjx-i\">\\(x\\)<\/span>.<\/li>\n<li>Gradient (quy ước sách MML): <span class=\"mjx-i\">\\(\\nabla f=\\Big[\\dfrac{\\partial f}{\\partial x}\\ \\ \\dfrac{\\partial f}{\\partial y}\\Big]\\)<\/span> (vector hàng).<\/li>\n<li>Hàm hợp thường gặp: <span class=\"mjx-i\">\\(\\dfrac{\\partial}{\\partial x}(u)^n=nu^{n-1}u_x\\)<\/span>; <span class=\"mjx-i\">\\(\\dfrac{\\partial}{\\partial x}\\sqrt u=\\dfrac{u_x}{2\\sqrt u}\\)<\/span>; <span class=\"mjx-i\">\\(\\dfrac{\\partial}{\\partial x}\\sin u=u_x\\cos u\\)<\/span>; <span class=\"mjx-i\">\\(\\dfrac{\\partial}{\\partial x}\\cos u=-u_x\\sin u\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Đạo hàm theo đúng biến được hỏi.<\/li>\n<li>Thay điểm vào; với lượng giác thì dùng radian.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> Find <span class=\"mjx-i\">\\(\\frac{\\partial z}{\\partial x}(1,1)\\)<\/span> for <span class=\"mjx-i\">\\(z=(3x-2y)^3\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(z_x=3(3x-2y)^2\\cdot3=9(3x-2y)^2\\)<\/span>. Tại <span class=\"mjx-i\">\\((1,1)\\)<\/span>: <span class=\"mjx-i\">\\(9\\cdot1^2=9\\)<\/span>.<\/p>\n<p><strong>Ví dụ 2.<\/strong> Find <span class=\"mjx-i\">\\(\\frac{\\partial z}{\\partial x}(3,-4)\\)<\/span> for <span class=\"mjx-i\">\\(z=\\sqrt{x^2+y^2}\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(z_x=\\dfrac{x}{\\sqrt{x^2+y^2}}=\\dfrac{3}{5}\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (gradient).<\/strong> Let <span class=\"mjx-i\">\\(f(x,y)=\\sin(x+2y)+\\cos(x-y)\\)<\/span>. Find the gradient at <span class=\"mjx-i\">\\((\\pi/2,0)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(f_x=\\cos(x+2y)-\\sin(x-y)\\)<\/span>, tại điểm: <span class=\"mjx-i\">\\(\\cos\\tfrac\\pi2-\\sin\\tfrac\\pi2=-1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(f_y=2\\cos(x+2y)+\\sin(x-y)\\)<\/span> (vì <span class=\"mjx-i\">\\(\\tfrac{\\partial}{\\partial y}\\cos(x-y)=-\\sin(x-y)\\cdot(-1)\\)<\/span>), tại điểm: <span class=\"mjx-i\">\\(0+1=1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\nabla f=[-1\\ \\ 1]\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Quên nhân đạo hàm của biểu thức bên trong (hệ số 3 trong <span class=\"mjx-i\">\\((3x-2y)^3\\)<\/span>; hệ số <span class=\"mjx-i\">\\(-1\\)<\/span> khi đạo hàm <span class=\"mjx-i\">\\(\\cos(x-y)\\)<\/span> theo <span class=\"mjx-i\">\\(y\\)<\/span>).<\/li>\n<li>Tính bằng độ (Deg) thay vì radian.<\/li>\n<li>Đổi thứ tự hai thành phần của gradient.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\sqrt{x^2+y^2}\\)<\/span>: <span class=\"mjx-i\">\\(z_x=x/z\\)<\/span>, <span class=\"mjx-i\">\\(z_y=y/z\\)<\/span> (dấu theo dấu của biến). Câu <span class=\"mjx-i\">\\(\\partial z/\\partial y\\)<\/span> tại <span class=\"mjx-i\">\\((2,-3)\\)<\/span> chắc chắn <strong>âm<\/strong>, nên loại ngay đáp án dương.<\/li>\n<li>Gradient: đáp án phải đúng <strong>dấu từng thành phần<\/strong>; tính một thành phần trước là loại được nửa số đáp án.<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> tính bằng máy rồi đổi đáp án dạng căn ra số thập phân để so (<span class=\"mjx-i\">\\(\\tfrac{3\\sqrt{13}}{13}\\approx0{,}832\\)<\/span>).<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\partial z/\\partial x\\)<\/span> tại <span class=\"mjx-i\">\\((4,-4)\\)<\/span> của <span class=\"mjx-i\">\\((4x+6y)^2\\)<\/span>: <code>d/dx((4X+6×(-4))²)|x=4<\/code>.<\/li>\n<li><span class=\"mjx-i\">\\(\\partial z/\\partial y\\)<\/span>: đổi vai trò, gõ biểu thức theo X với <span class=\"mjx-i\">\\(x\\)<\/span> đã thay số: <code>d/dx(√(2²+X²))|x=-3<\/code>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">5 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-5-q12\"><strong>Câu 2.1<\/strong> <code>[FA24-RE Q18]<\/code> <code>[Đề A Q19]<\/code> <code>[SP26 Q13]<\/code>\nFind <span class=\"mjx-i\">\\(\\frac{\\partial z}{\\partial x}(4,-4)\\)<\/span> for <span class=\"mjx-i\">\\(z=(4x+6y)^2\\)<\/span> .<\/p>\n<ul>\n<li>A. -32<\/li>\n<li>B. -64<\/li>\n<li>C. 20<\/li>\n<li>D. 74<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q13\"><strong>Câu 2.2<\/strong> <code>[SP26 Q28]<\/code> <code>[SP25-RE Q18]<\/code> <code>[SU24-RE Q15]<\/code> <code>[SP26 Q19]<\/code>\nFind <span class=\"mjx-i\">\\(\\frac{\\partial z}{\\partial y}(2, -3)\\)<\/span> for <span class=\"mjx-i\">\\(z = \\sqrt{x^2 + y^2}\\)<\/span><\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(\\sqrt{13}/13\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(-3\\sqrt{13}/13\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(-\\sqrt{13}/13\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(3\\sqrt{13}/13\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iii)<\/p>\n<\/li>\n<li>\n<p>B. (ii)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q14\"><strong>Câu 2.3<\/strong> <code>[SP25-RE Q19]<\/code>\nLet <span class=\"mjx-i\">\\(f(x,y)=2x^2y+3xy^2\\)<\/span> . Find the derivative of <span class=\"mjx-i\">\\(f\\)<\/span> with respect to <span class=\"mjx-i\">\\(x\\)<\/span> at <span class=\"mjx-i\">\\((x,y)=(1,1)\\)<\/span> .<\/p>\n<ul>\n<li>A. 6<\/li>\n<li>B. 8<\/li>\n<li>C. 7<\/li>\n<li>D. 5<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q15\"><strong>Câu 2.4<\/strong> <code>[SP26 Q16]<\/code>\nLet <span class=\"mjx-i\">\\(f(x, y) = 2x^2y + 3xy^2\\)<\/span> . Find the derivative of <span class=\"mjx-i\">\\(f\\)<\/span> with respect to <span class=\"mjx-i\">\\(y\\)<\/span> at <span class=\"mjx-i\">\\((x, y) = (1, 1)\\)<\/span> .<\/p>\n<ul>\n<li>A. 6<\/li>\n<li>B. 5<\/li>\n<li>C. 7<\/li>\n<li>D. 8<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q16\"><strong>Câu 2.5<\/strong> <code>[SP26 Q40]<\/code> <code>[Đề B Q36]<\/code> <code>[FA24-FE Q40]<\/code>\nLet <span class=\"mjx-i\">\\(f(x,y) = \\sin(3x +2y) + \\cos(2x- 3y)\\)<\/span> . What is the value of the gradient of <span class=\"mjx-i\">\\(f(x,y)\\)<\/span> at <span class=\"mjx-i\">\\((\\pi/4, -\\pi/4)\\)<\/span> ?<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\([-1/\\sqrt{2}, 2\\sqrt{2}]\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\([5/\\sqrt{2}, -1/\\sqrt{2}]\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\([1/\\sqrt{2}, 2\\sqrt{2}]\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\([-5/\\sqrt{2}, 1/\\sqrt{2}]\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (i)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (ii)<\/p>\n<\/li>\n<li>\n<p>D. (iv)<\/p>\n<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-5-h15\">Dạng 3: Quy tắc chuỗi (chain rule)<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Use the Chain Rule to find <span class=\"mjx-i\">\\(\\partial z/\\partial\\theta\\)<\/span> / <span class=\"mjx-i\">\\(\\partial z/\\partial s\\)<\/span> / <span class=\"mjx-i\">\\(\\partial R/\\partial y\\)<\/span>\"<\/em>, <em>\"Calculate <span class=\"mjx-i\">\\(df/dt\\)<\/span>\"<\/em>, <em>\"in matrix form\"<\/em>, cho sẵn các đạo hàm và hỏi đạo hàm còn thiếu.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(z=f(x,y)\\)<\/span>, <span class=\"mjx-i\">\\(x=x(t)\\)<\/span>, <span class=\"mjx-i\">\\(y=y(t)\\)<\/span>: <span class=\"mjx-i\">\\(\\boxed{\\dfrac{dz}{dt}=\\dfrac{\\partial f}{\\partial x}\\dfrac{dx}{dt}+\\dfrac{\\partial f}{\\partial y}\\dfrac{dy}{dt}}\\)<\/span><\/li>\n<li><span class=\"mjx-i\">\\(x=x(s,t)\\)<\/span>, <span class=\"mjx-i\">\\(y=y(s,t)\\)<\/span>: <span class=\"mjx-i\">\\(\\dfrac{\\partial z}{\\partial s}=\\dfrac{\\partial f}{\\partial x}\\dfrac{\\partial x}{\\partial s}+\\dfrac{\\partial f}{\\partial y}\\dfrac{\\partial y}{\\partial s}\\)<\/span>.<\/li>\n<li><strong>Dạng ma trận (MML):<\/strong> <span class=\"mjx-i\">\\(\\dfrac{df}{dt}=\\underbrace{\\Big[\\tfrac{\\partial f}{\\partial x_1}\\ \\ \\tfrac{\\partial f}{\\partial x_2}\\Big]}_{\\text{hàng}}\\underbrace{\\begin{bmatrix}dx_1/dt\\\\dx_2/dt\\end{bmatrix}}_{\\text{cột}}\\)<\/span>: gradient là <strong>vector hàng<\/strong>, nhân với <strong>vector cột<\/strong> đạo hàm của biến trong.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Tính <strong>giá trị<\/strong> của <span class=\"mjx-i\">\\(x,y\\)<\/span> tại điểm đã cho (ví dụ <span class=\"mjx-i\">\\((r,\\theta)=(1,\\pi/2)\\)<\/span> cho <span class=\"mjx-i\">\\(x=0,y=1\\)<\/span>).<\/li>\n<li>Tính các đạo hàm riêng ngoài tại <span class=\"mjx-i\">\\((x,y)\\)<\/span> đó và các đạo hàm trong tại <span class=\"mjx-i\">\\((r,\\theta)\\)<\/span>.<\/li>\n<li>Nhân, cộng.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1.<\/strong> Let <span class=\"mjx-i\">\\(z=x^2y\\)<\/span>, <span class=\"mjx-i\">\\(x=r\\cos\\theta\\)<\/span>, <span class=\"mjx-i\">\\(y=r\\sin\\theta\\)<\/span>. Find <span class=\"mjx-i\">\\(\\partial z/\\partial\\theta\\)<\/span> at <span class=\"mjx-i\">\\((r,\\theta)=(2,0)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Tại <span class=\"mjx-i\">\\((2,0)\\)<\/span>: <span class=\"mjx-i\">\\(x=2\\)<\/span>, <span class=\"mjx-i\">\\(y=0\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(z_x=2xy=0\\)<\/span>, <span class=\"mjx-i\">\\(z_y=x^2=4\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(x_\\theta=-r\\sin\\theta=0\\)<\/span>, <span class=\"mjx-i\">\\(y_\\theta=r\\cos\\theta=2\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{\\partial z}{\\partial\\theta}=0\\cdot0+4\\cdot2=8\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (dạng ma trận).<\/strong> <span class=\"mjx-i\">\\(f(x_1,x_2)=x_1^2x_2\\)<\/span>, <span class=\"mjx-i\">\\(x_1=t^2\\)<\/span>, <span class=\"mjx-i\">\\(x_2=3t\\)<\/span>. Write <span class=\"mjx-i\">\\(df/dt\\)<\/span> in matrix form.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\dfrac{df}{dt}=\\begin{bmatrix}2x_1x_2 &amp; x_1^2\\end{bmatrix}\\begin{bmatrix}2t\\\\3\\end{bmatrix}\\)<\/span> (hàng nhân cột; cột là <strong>đạo hàm<\/strong> <span class=\"mjx-i\">\\((2t,3)\\)<\/span>, không phải <span class=\"mjx-i\">\\((t^2,3t)\\)<\/span>).<\/p>\n<p><strong>Ví dụ 3 (tìm đạo hàm còn thiếu).<\/strong> At <span class=\"mjx-i\">\\(t=t_0\\)<\/span>: <span class=\"mjx-i\">\\(\\partial f/\\partial x=3\\)<\/span>, <span class=\"mjx-i\">\\(\\partial f/\\partial y=-1\\)<\/span>, <span class=\"mjx-i\">\\(dx/dt=2\\)<\/span>, <span class=\"mjx-i\">\\(df/dt=10\\)<\/span>. Find <span class=\"mjx-i\">\\(dy/dt\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(10=3\\cdot2+(-1)\\cdot y'\\)<\/span>, nên <span class=\"mjx-i\">\\(y'=6-10=-4\\)<\/span>.<\/p>\n<p><strong>Ví dụ 4 (biến trong phức tạp).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=x^2+xy\\)<\/span>, <span class=\"mjx-i\">\\(x=1+\\sin t\\cos t\\)<\/span>, <span class=\"mjx-i\">\\(y=e^t\\)<\/span>. Find <span class=\"mjx-i\">\\(df/dt\\)<\/span> at <span class=\"mjx-i\">\\(t=0\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Tại <span class=\"mjx-i\">\\(t=0\\)<\/span>: <span class=\"mjx-i\">\\(x=1\\)<\/span>, <span class=\"mjx-i\">\\(y=1\\)<\/span>; <span class=\"mjx-i\">\\(x'(t)=\\cos2t\\)<\/span> nên <span class=\"mjx-i\">\\(x'(0)=1\\)<\/span>; <span class=\"mjx-i\">\\(y'(0)=1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(f_x=2x+y=3\\)<\/span>, <span class=\"mjx-i\">\\(f_y=x=1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(\\dfrac{df}{dt}=3\\cdot1+1\\cdot1=4\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Thay <span class=\"mjx-i\">\\((r,\\theta)\\)<\/span> vào <span class=\"mjx-i\">\\(f_x,f_y\\)<\/span> thay vì thay <span class=\"mjx-i\">\\((x,y)\\)<\/span> tương ứng.<\/li>\n<li>Dạng ma trận: đặt gradient thành <strong>cột<\/strong> hoặc đặt <span class=\"mjx-i\">\\((x_1,x_2)\\)<\/span> thay cho <span class=\"mjx-i\">\\((x_1',x_2')\\)<\/span>.<\/li>\n<li>Quên đạo hàm của <span class=\"mjx-i\">\\(\\sin t\\cos t=\\tfrac12\\sin2t\\)<\/span> là <span class=\"mjx-i\">\\(\\cos2t\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh / cách khác:<\/strong> <strong>thế trực tiếp<\/strong> rồi đạo hàm một biến. Ví dụ 1: <span class=\"mjx-i\">\\(z=r^3\\cos^2\\theta\\sin\\theta\\)<\/span>, nên <span class=\"mjx-i\">\\(\\partial z/\\partial\\theta\\)<\/span> tại <span class=\"mjx-i\">\\(r=2,\\theta=0\\)<\/span> là <span class=\"mjx-i\">\\(8(\\cos^3\\theta-2\\cos\\theta\\sin^2\\theta)=8\\)<\/span>. Với câu có giá trị số, cách này <strong>bấm máy được ngay<\/strong>.<\/p>\n<p><strong>Thử đáp án:<\/strong> câu dạng ma trận: đáp án đúng có (1) gradient là <strong>hàng<\/strong> (dạng <span class=\"mjx-i\">\\([\\ \\cdot\\ \\ \\cdot\\ ]\\)<\/span>), (2) cột chứa <strong>đạo hàm<\/strong> của các biến trong. Hai điều kiện này chỉ để lại một đáp án.<\/p>\n<p><strong>Bấm máy (thế trực tiếp)<\/strong><\/p>\n<ul>\n<li>Câu <span class=\"mjx-i\">\\(\\partial z/\\partial\\theta\\)<\/span> tại <span class=\"mjx-i\">\\((1,\\pi/2)\\)<\/span> với <span class=\"mjx-i\">\\(z=x^2+xy^2\\)<\/span>: gõ <code>d/dx((1cos(X))²+1cos(X)(1sin(X))²)|x=π÷2<\/code> (máy ở Rad).<\/li>\n<li>Câu <span class=\"mjx-i\">\\(df/dt\\)<\/span> tại <span class=\"mjx-i\">\\(t=0\\)<\/span> với <span class=\"mjx-i\">\\(x(t),y(t)\\)<\/span> phức tạp: gõ <code>d/dx(f(x(X),y(X)))|x=0<\/code>, máy tự đạo hàm, không cần chain rule bằng tay.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">7 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-5-q17\"><strong>Câu 3.1<\/strong> <code>[FA24-RE Q19]<\/code>\nLet <span class=\"mjx-i\">\\(z = x^2 + xy^2,\\quad x = r\\cos\\theta;\\quad y = r\\sin\\theta.\\)<\/span> Use the Chain Rule to find <span class=\"mjx-i\">\\(\\dfrac{\\partial z}{\\partial \\theta}\\)<\/span> at <span class=\"mjx-i\">\\((r,\\theta)=\\left(1,\\dfrac{\\pi}{2}\\right)\\)<\/span> .<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 1<\/li>\n<li>C. -1<\/li>\n<li>D. 2<\/li>\n<li>E. -2<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q18\"><strong>Câu 3.2<\/strong> <code>[SU24-RE Q16]<\/code>\nLet <span class=\"mjx-i\">\\(z = x^2 + xy^2,\\quad x = r\\cos\\theta;\\quad y = r\\sin\\theta.\\)<\/span> Use the Chain Rule to find <span class=\"mjx-i\">\\(\\dfrac{\\partial z}{\\partial r}\\)<\/span> at <span class=\"mjx-i\">\\((r,\\theta)=\\left(1,\\dfrac{\\pi}{2}\\right)\\)<\/span> .<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 1<\/li>\n<li>C. -1<\/li>\n<li>D. 2<\/li>\n<li>E. -2<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q19\"><strong>Câu 3.3<\/strong> <code>[Đề B Q18]<\/code>\nLet <span class=\"mjx-i\">\\(z = \\ln(x^2 + y^2); \\quad x = 2s + t; \\quad y = s - 2t.\\)<\/span> Use the Chain Rule to find <span class=\"mjx-i\">\\(\\dfrac{\\partial z}{\\partial s}\\)<\/span> at <span class=\"mjx-i\">\\((s,t) = (1,1)\\)<\/span> .<\/p>\n<ul>\n<li>A. 1<\/li>\n<li>B. -1<\/li>\n<li>C. 2<\/li>\n<li>D. -2<\/li>\n<li>E. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q20\"><strong>Câu 3.4<\/strong> <code>[FA24-FE Q18]<\/code>\nGiven <span class=\"mjx-i\">\\(R(u,v)=2vu^3+uv^3,\\quad u=x-2y,\\quad v=2x+y.\\)<\/span> Use the Chain Rule to find <span class=\"mjx-i\">\\(\\frac{\\partial R}{\\partial y}\\)<\/span> when <span class=\"mjx-i\">\\(x=y=1\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(-36\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(36\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(-119\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(-63\\)<\/span><\/li>\n<li>E. <span class=\"mjx-i\">\\(119\\)<\/span><\/li>\n<li>F. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q21\"><strong>Câu 3.5<\/strong> <code>[Đề A Q18]<\/code> <code>[SP26 Q11]<\/code>\nGiven <span class=\"mjx-i\">\\(f(x,y) = 3x^2y + 2x^3y^2\\)<\/span> where <span class=\"mjx-i\">\\(x = x(t) = 1 + \\sin(t)\\cos(t) + \\sin(2t)\\cos(2t)\\)<\/span> <span class=\"mjx-i\">\\(y = y(t) = (t+1)e^t\\)<\/span> .\nCalculate the gradient <span class=\"mjx-i\">\\(df/dt\\)<\/span> at <span class=\"mjx-i\">\\(t = 0\\)<\/span> .<\/p>\n<ul>\n<li>A. 48<\/li>\n<li>B. 50<\/li>\n<li>C. 16<\/li>\n<li>D. 36<\/li>\n<li>E. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q22\"><strong>Câu 3.6<\/strong> <code>[Đề A Q20]<\/code> <code>[SP26 Q38]<\/code>\nFor the following functions, calculate <span class=\"mjx-i\">\\(\\frac{df}{dt}\\)<\/span> in matrix form: <span class=\"mjx-i\">\\(f(x)=f(x_1,x_2)=x_1^4\\sin(x_2)\\)<\/span> <span class=\"mjx-i\">\\(x_1=2t\\)<\/span> <span class=\"mjx-i\">\\(x_2=1+t^2\\)<\/span><\/p>\n<ul>\n<li>A. (i) <span class=\"mjx-i\">\\(\\begin{bmatrix}4x_1^3\\sin(x_2)\\\\x_1^4\\cos(x_2)\\end{bmatrix}\\begin{bmatrix}2 &amp; 2t\\end{bmatrix}\\)<\/span><\/li>\n<li>B. (ii) <span class=\"mjx-i\">\\(\\begin{bmatrix}4x_1^3\\sin(x_2) &amp; x_1^4\\cos(x_2)\\end{bmatrix}\\begin{bmatrix}2\\\\2t\\end{bmatrix}\\)<\/span><\/li>\n<li>C. (iii) <span class=\"mjx-i\">\\(\\begin{bmatrix}4x_1^3\\sin(x_2)\\\\x_1^4\\cos(x_2)\\end{bmatrix}\\begin{bmatrix}2t &amp; 1+t^2\\end{bmatrix}\\)<\/span><\/li>\n<li>D. (iv) <span class=\"mjx-i\">\\(\\begin{bmatrix}4x_1^3\\sin(x_2) &amp; x_1^4\\cos(x_2)\\end{bmatrix}\\begin{bmatrix}2t\\\\1+t^2\\end{bmatrix}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q23\"><strong>Câu 3.7<\/strong> <code>[SP26 Q3]<\/code>\nAssume <span class=\"mjx-i\">\\(f = f(x,y)\\)<\/span> , <span class=\"mjx-i\">\\(x = x(t)\\)<\/span> , <span class=\"mjx-i\">\\(y = y(t)\\)<\/span> .\nWe know that at some point <span class=\"mjx-i\">\\(t = t_0\\)<\/span> , the partial derivatives are as follows: <span class=\"mjx-i\">\\(dx/dt = 14\\)<\/span> , <span class=\"mjx-i\">\\(\\partial f/ \\partial x = 2\\)<\/span> , <span class=\"mjx-i\">\\(\\partial f/ \\partial y = 2\\)<\/span> , <span class=\"mjx-i\">\\(df/dt = 34\\)<\/span> .\nCompute <span class=\"mjx-i\">\\(dy/dt\\)<\/span> .<\/p>\n<ul>\n<li>A. None of the other choices is correct<\/li>\n<li>B. 4.0<\/li>\n<li>C. 3.0<\/li>\n<li>D. 4.5<\/li>\n<li>E. 3.5<\/li>\n<li>F. 2.0<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-5-h16\">Dạng 4: Ma trận Jacobian<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Jacobian determinant of <span class=\"mjx-i\">\\(f\\)<\/span> at …\"<\/em>, <em>\"the <span class=\"mjx-i\">\\((i,j)\\)<\/span>-entry of the Jacobian\"<\/em>, <em>\"Let <span class=\"mjx-i\">\\(J\\)<\/span> be the Jacobian … Compute the Euclidean norm of <span class=\"mjx-i\">\\(J\\)<\/span> / <span class=\"mjx-i\">\\(\\det(J)\\)<\/span>\"<\/em>.<\/p>\n<h3>Công thức<\/h3>\n<p><span class=\"mjx-i\">\\(f:\\mathbb{R}^n\\to\\mathbb{R}^m\\)<\/span>, <span class=\"mjx-i\">\\(f=(f_1,\\dots,f_m)\\)<\/span>:\n<div class=\"mjx-d\">\\[J=\\begin{bmatrix}\\frac{\\partial f_1}{\\partial x_1}&amp;\\cdots&amp;\\frac{\\partial f_1}{\\partial x_n}\\\\\\vdots&amp;&amp;\\vdots\\\\\\frac{\\partial f_m}{\\partial x_1}&amp;\\cdots&amp;\\frac{\\partial f_m}{\\partial x_n}\\end{bmatrix}\\in\\mathbb{R}^{m\\times n}\\]<\/div>\n<strong>Hàng <span class=\"mjx-i\">\\(i\\)<\/span> = hàm <span class=\"mjx-i\">\\(f_i\\)<\/span>; cột <span class=\"mjx-i\">\\(j\\)<\/span> = biến <span class=\"mjx-i\">\\(x_j\\)<\/span>.<\/strong> Phần tử <span class=\"mjx-i\">\\((i,j)=\\dfrac{\\partial f_i}{\\partial x_j}\\)<\/span>.<\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(f:\\mathbb{R}\\to\\mathbb{R}^m\\)<\/span>: <span class=\"mjx-i\">\\(J\\)<\/span> là vector cột <span class=\"mjx-i\">\\((f_1',\\dots,f_m')^\\top\\)<\/span>; chuẩn Euclid <span class=\"mjx-i\">\\(=\\sqrt{\\sum (f_i')^2}\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Xác định đúng hàng (hàm nào) và cột (biến nào).<\/li>\n<li>Đạo hàm, thay điểm.<\/li>\n<li>Câu <span class=\"mjx-i\">\\(\\det J\\)<\/span>: lập ma trận số rồi tính định thức.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (<span class=\"mjx-i\">\\(\\det J\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=\\begin{bmatrix}x^2y\\\\x+y^3\\end{bmatrix}\\)<\/span>. Compute <span class=\"mjx-i\">\\(\\det J\\)<\/span> at <span class=\"mjx-i\">\\((1,1)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(J=\\begin{bmatrix}2xy&amp;x^2\\\\1&amp;3y^2\\end{bmatrix}\\)<\/span>, tại <span class=\"mjx-i\">\\((1,1)\\)<\/span>: <span class=\"mjx-i\">\\(\\begin{bmatrix}2&amp;1\\\\1&amp;3\\end{bmatrix}\\)<\/span>, nên <span class=\"mjx-i\">\\(\\det J=6-1=5\\)<\/span>.<\/p>\n<p><strong>Ví dụ 2 (chuẩn của <span class=\"mjx-i\">\\(J\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(f:\\mathbb{R}\\to\\mathbb{R}^3\\)<\/span>, <span class=\"mjx-i\">\\(f(x)=(x^2,\\ e^x,\\ \\sin x)^\\top\\)<\/span>. Compute <span class=\"mjx-i\">\\(\\lVert J\\rVert_2\\)<\/span> at <span class=\"mjx-i\">\\(x=0\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(J=(2x,\\ e^x,\\ \\cos x)^\\top\\)<\/span>, tại <span class=\"mjx-i\">\\(0\\)<\/span>: <span class=\"mjx-i\">\\((0,1,1)^\\top\\)<\/span>, nên <span class=\"mjx-i\">\\(\\lVert J\\rVert=\\sqrt2\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (một phần tử).<\/strong> <span class=\"mjx-i\">\\(f(x,y,z)=\\begin{bmatrix}xy+z\\\\xz^2+y\\end{bmatrix}\\)<\/span>. Find the <span class=\"mjx-i\">\\((2,3)\\)<\/span>-entry of <span class=\"mjx-i\">\\(J\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> Hàng 2 là <span class=\"mjx-i\">\\(f_2=xz^2+y\\)<\/span>, cột 3 là biến <span class=\"mjx-i\">\\(z\\)<\/span>: <span class=\"mjx-i\">\\(\\dfrac{\\partial f_2}{\\partial z}=2xz\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Đảo hàng/cột: <span class=\"mjx-i\">\\((2,3)\\)<\/span> là <span class=\"mjx-i\">\\(\\partial f_2/\\partial x_3\\)<\/span>, không phải <span class=\"mjx-i\">\\(\\partial f_3/\\partial x_2\\)<\/span>.<\/li>\n<li>Câu \"<span class=\"mjx-i\">\\((2,2)\\)<\/span>-entry\" không cho điểm thì đáp án là <strong>biểu thức<\/strong> (như <span class=\"mjx-i\">\\(x\\)<\/span>), không phải số.<\/li>\n<li>Ghi nhớ: hàm <span class=\"mjx-i\">\\(\\log_2u\\)<\/span> có đạo hàm <span class=\"mjx-i\">\\(\\dfrac{u'}{u\\ln2}\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li>Câu hỏi một phần tử: <strong>chỉ đạo hàm đúng một hàm theo một biến<\/strong>, không lập cả ma trận.<\/li>\n<li>Câu <span class=\"mjx-i\">\\(\\det J\\)<\/span> tại điểm có nhiều số 0 (như <span class=\"mjx-i\">\\((0,0)\\)<\/span>, <span class=\"mjx-i\">\\((0,-2)\\)<\/span>): nhiều phần tử của <span class=\"mjx-i\">\\(J\\)<\/span> bằng 0, nên tính rất nhanh.<\/li>\n<li>Câu <span class=\"mjx-i\">\\(3\\times3\\)<\/span> đối xứng vòng như <span class=\"mjx-i\">\\(f=[2z+y^2,\\ 2x+z^2,\\ 2y+x^2]\\)<\/span>: viết <span class=\"mjx-i\">\\(J\\)<\/span> theo đúng thứ tự cột <span class=\"mjx-i\">\\(x,y,z\\)<\/span>, cẩn thận số 0 ở đường chéo.<\/li>\n<\/ul>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li>Mỗi phần tử: d/dx với các biến khác thay số. Ví dụ <span class=\"mjx-i\">\\(\\partial f_2/\\partial z\\)<\/span> tại <span class=\"mjx-i\">\\((1,2,1)\\)<\/span> của <span class=\"mjx-i\">\\(xyz^2\\)<\/span>: <code>d/dx(1×2×X²)|x=1<\/code>.<\/li>\n<li><span class=\"mjx-i\">\\(\\det J\\)<\/span>: nhập các số vào MatA → <code>Det(MatA)<\/code>.<\/li>\n<li>Chuẩn của <span class=\"mjx-i\">\\(J\\)<\/span> (vector cột): <code>√(J₁²+J₂²+J₃²)<\/code> ở Calculate, mỗi <span class=\"mjx-i\">\\(J_i\\)<\/span> tính bằng d/dx.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">11 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-5-q24\"><strong>Câu 4.1<\/strong> <code>[FA24-RE Q20]<\/code> <code>[SP25-RE Q37]<\/code> <code>[SP26 Q40]<\/code>\nIf <span class=\"mjx-i\">\\(f(x,y,z)=\\begin{bmatrix}2z+y^2 &amp; 2x+z^2 &amp; 2y+x^2\\end{bmatrix}^{T}\\)<\/span> then the Jacobian determinant of <span class=\"mjx-i\">\\(f\\)<\/span> at <span class=\"mjx-i\">\\((x,y,z)=(1,1,1)\\)<\/span> is:<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(16\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(8\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(-8\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(-16\\)<\/span><\/li>\n<li>(v) <span class=\"mjx-i\">\\(0\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q25\"><strong>Câu 4.2<\/strong> <code>[FA24-RE Q21]<\/code> <code>[Đề B Q19]<\/code> <code>[SP26 Q7]<\/code>\nGiven a function <span class=\"mjx-i\">\\(f : \\mathbb{R} \\to \\mathbb{R}^3\\)<\/span>\n<div class=\"mjx-d\">\\[f(x) = \\begin{pmatrix}\n-2x^2 + 3x + 2 \\\\\n\\sqrt{x^4 + 2x^2 + 3} \\\\\ne^{2x+1}\n\\end{pmatrix}\\]<\/div><\/p>\n<p>Let <span class=\"mjx-i\">\\(J\\)<\/span> be the Jacobian of <span class=\"mjx-i\">\\(f(x)\\)<\/span> at <span class=\"mjx-i\">\\(-1\\)<\/span> . Compute the Euclidean norm of <span class=\"mjx-i\">\\(J\\)<\/span> .<\/p>\n<ul>\n<li>A. 8.2125<\/li>\n<li>B. 8.1628<\/li>\n<li>C. 7.5581<\/li>\n<li>D. 7.3591<\/li>\n<li>E. 7.2255<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q26\"><strong>Câu 4.3<\/strong> <code>[Đề A Q21]<\/code>\nGiven a function <span class=\"mjx-i\">\\(f(x)=\\begin{pmatrix}\\log_2(-2x+5)\\\\e^{-2x+1}\\end{pmatrix}\\)<\/span> Let <span class=\"mjx-i\">\\(J\\)<\/span> be the Jacobian of <span class=\"mjx-i\">\\(f(x)\\)<\/span> at <span class=\"mjx-i\">\\(x=1\\)<\/span> . Compute the Euclidean norm of <span class=\"mjx-i\">\\(J\\)<\/span> .<\/p>\n<ul>\n<li>A. 1.521<\/li>\n<li>B. 1.211<\/li>\n<li>C. 1.012<\/li>\n<li>D. 1.311<\/li>\n<li>E. 1.424<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q27\"><strong>Câu 4.4<\/strong> <code>[SP26 Q17]<\/code> <code>[SP26 Q20]<\/code>\nLet <span class=\"mjx-i\">\\(f: \\text{R}^3 \\to \\text{R}^3\\)<\/span> the function defined by <span class=\"mjx-i\">\\(f(x, y, z) = \\begin{bmatrix} e^{x+2y + z} - y^2 + z^2 \\\\ xyz^2 + e^x + 2y \\\\ xyz - 2x + e^{z-1} \\end{bmatrix}.\\)<\/span> Determine the <span class=\"mjx-i\">\\((3, 3)\\)<\/span> -entry of the Jacobian of f at <span class=\"mjx-i\">\\((1, 2, 1)\\)<\/span> .<\/p>\n<ul>\n<li>A. -1<\/li>\n<li>B. -2<\/li>\n<li>C. 1<\/li>\n<li>D. e<\/li>\n<li>E. 3<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q28\"><strong>Câu 4.5<\/strong> <code>[SP26 Q39]<\/code> <code>[SU24-RE Q38]<\/code> <code>[SP26 Q21]<\/code>\nLet <span class=\"mjx-i\">\\(f: \\mathbb{R}^2 \\rightarrow \\mathbb{R}^3\\)<\/span> be given by <span class=\"mjx-i\">\\(f(x,y) = \\begin{bmatrix} x^2 + y \\\\ xy \\\\ 2x + 3y \\end{bmatrix}\\)<\/span> Find the <span class=\"mjx-i\">\\((2, 2)\\)<\/span> -entry of the Jacobian of <span class=\"mjx-i\">\\(f\\)<\/span> .<\/p>\n<ul>\n<li>A. y<\/li>\n<li>B. 1<\/li>\n<li>C. x<\/li>\n<li>D. 2x<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q29\"><strong>Câu 4.6<\/strong> <code>[SP26 Q2]<\/code>\nLet f: <span class=\"mjx-i\">\\(\\text{R}^3 \\rightarrow \\text{R}^2\\)<\/span> be a function defined by <span class=\"mjx-i\">\\(f(x,y,z) = \\begin{bmatrix} e^{xy} + x^2y + xyz \\\\ yze^{\\sin(x)} + \\cos(xyz) \\end{bmatrix}.\\)<\/span> Determine the (1, 1)-entry of the Jacobian of f at (0, 0, 0).<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. sin(1)<\/li>\n<li>C. 1<\/li>\n<li>D. -1<\/li>\n<li>E. 2<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q30\"><strong>Câu 4.7<\/strong> <code>[SP25-RE Q20]<\/code>\nGiven a function <span class=\"mjx-i\">\\(f: \\mathbb{R}^2 \\to \\mathbb{R}^2\\)<\/span>\n<div class=\"mjx-d\">\\[f(\\mathbf{x}) = \\begin{pmatrix}\nx_1^2 - 3x_1x_2 + 2x_2^2 \\\\\nx_1^3 - 2x_1^2x_2 + 3x_2^3\n\\end{pmatrix}\\]<\/div><\/p>\n<p>Let <span class=\"mjx-i\">\\(J\\)<\/span> be the Jacobian of <span class=\"mjx-i\">\\(f(\\mathbf{x})\\)<\/span> at <span class=\"mjx-i\">\\((-1,1)\\)<\/span> . Compute <span class=\"mjx-i\">\\(\\det(J)\\)<\/span> .<\/p>\n<ul>\n<li>A. -86<\/li>\n<li>B. -85<\/li>\n<li>C. -87<\/li>\n<li>D. -84<\/li>\n<li>E. -88<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q31\"><strong>Câu 4.8<\/strong> <code>[Đề B Q20]<\/code>\nGiven a function <span class=\"mjx-i\">\\(f: \\mathbb{R}^2 \\to \\mathbb{R}^2\\)<\/span>\n<div class=\"mjx-d\">\\[f(\\mathbf{x}) = \\begin{pmatrix}\n4x_1^2 + 2x_1x_2 + x_2^2 \\\\\nx_1^2 + x_1x_2 + 2x_2^2\n\\end{pmatrix}\\]<\/div><\/p>\n<p>Let <span class=\"mjx-i\">\\(J\\)<\/span> be the Jacobian of <span class=\"mjx-i\">\\(f(\\mathbf{x})\\)<\/span> at <span class=\"mjx-i\">\\((1,2)\\)<\/span> . Compute <span class=\"mjx-i\">\\(\\det(J)\\)<\/span> .<\/p>\n<ul>\n<li>A. 27<\/li>\n<li>B. 28<\/li>\n<li>C. 29<\/li>\n<li>D. 30<\/li>\n<li>E. 31<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q32\"><strong>Câu 4.9<\/strong> <code>[SU24-RE Q17]<\/code>\nConsider the function <span class=\"mjx-i\">\\(f:\\mathbb{R}^2 \\to \\mathbb{R}^2\\)<\/span> :<\/p>\n<p><div class=\"mjx-d\">\\[f(x,y)=\\begin{bmatrix}\n\\sqrt{x^4+y^2}\\\\\nx^3+3xy\n\\end{bmatrix}.\\]<\/div><\/p>\n<p>The Jacobian determinant of <span class=\"mjx-i\">\\(f\\)<\/span> at <span class=\"mjx-i\">\\((x,y)=(0,-2)\\)<\/span> is:<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(-6\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(6\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(-3\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(3\\)<\/span><\/li>\n<li>(v) <span class=\"mjx-i\">\\(0\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q33\"><strong>Câu 4.10<\/strong> <code>[FA24-FE Q19]<\/code>\nConsider the vector-valued function <span class=\"mjx-i\">\\(f: \\mathbb{R}^3 \\to \\mathbb{R}^3\\)<\/span> :<\/p>\n<p><div class=\"mjx-d\">\\[f(x,y,z)=\n\\begin{bmatrix}\n\\sqrt{x^2+2y^2+z^2}\\\\\ne^{-x^2-2y^2-3z^2}\\\\\n\\ln(1+x^2+3y^2+2z^2)\n\\end{bmatrix}.\\]<\/div><\/p>\n<p>The <span class=\"mjx-i\">\\((3,2)\\)<\/span> -entry of the Jacobian of <span class=\"mjx-i\">\\(f\\)<\/span> at <span class=\"mjx-i\">\\((x,y,z)=(1,1,0)\\)<\/span> is:<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(1.2\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(0\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(0.4\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(1/\\sqrt{3}\\)<\/span><\/li>\n<li>(v) <span class=\"mjx-i\">\\(2/\\sqrt{3}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-5-q34\"><strong>Câu 4.11<\/strong> <code>[FA24-FE Q20]<\/code>\nLet <span class=\"mjx-i\">\\(f: \\mathbb{R}^2 \\to \\mathbb{R}^2\\)<\/span> be the function defined by<\/p>\n<p><div class=\"mjx-d\">\\[f(x,y) = \\begin{bmatrix} e^{xy} + x^2y + 1 \\\\ e^{\\sin(x)} + \\cos(xy) \\end{bmatrix}\\]<\/div><\/p>\n<p>Compute the determinant of the Jacobian of <span class=\"mjx-i\">\\(f\\)<\/span> at <span class=\"mjx-i\">\\((0,0)\\)<\/span> .<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 1<\/li>\n<li>C. -1<\/li>\n<li>D. 2<\/li>\n<li>E. e<\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-5-h17\">Dạng 5: Đồ thị tính toán (computation graph) &amp; lan truyền ngược<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p>Đề có hình/mô tả <em>\"computation graph with inputs <span class=\"mjx-i\">\\(x_1,x_2\\)<\/span>, function value <span class=\"mjx-i\">\\(f\\)<\/span> and intermediate variables <span class=\"mjx-i\">\\(a,b,c\\)<\/span>\"<\/em>; hỏi <em>\"Find the formula of <span class=\"mjx-i\">\\(f\\)<\/span>\"<\/em>, <em>\"Compute / Find the formula of <span class=\"mjx-i\">\\(\\partial f/\\partial x\\)<\/span>\"<\/em>, hoặc giá trị đạo hàm tại một điểm.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li><strong>Quy tắc chuỗi trên đồ thị:<\/strong> <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial x}=\\sum_{\\text{mọi đường đi }x\\to f}\\ \\prod_{\\text{các cạnh trên đường đi}}\\dfrac{\\partial(\\text{nút sau})}{\\partial(\\text{nút trước})}\\)<\/span>.<\/li>\n<li>Một nút <strong>tách ra hai nhánh<\/strong> (ví dụ <span class=\"mjx-i\">\\(a\\)<\/span> đi tới cả <span class=\"mjx-i\">\\(b\\)<\/span> và <span class=\"mjx-i\">\\(c\\)<\/span>) thì có <strong>hai đường đi<\/strong>, nên công thức có <strong>dấu cộng<\/strong>.<\/li>\n<li>Nút nhân <span class=\"mjx-i\">\\(f=b\\cdot c\\)<\/span>: <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial b}=c\\)<\/span>, <span class=\"mjx-i\">\\(\\dfrac{\\partial f}{\\partial c}=b\\)<\
