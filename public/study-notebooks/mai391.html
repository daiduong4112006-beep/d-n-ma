; <span class=\"mjx-i\">\\(\\mathrm{Cov}(X,Y)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><strong>5. Ma trận hiệp phương sai mẫu<\/strong><\/td>\n<td>8/10<\/td>\n<td>Một phần tử <span class=\"mjx-i\">\\(s_{ij}\\)<\/span> của ma trận hiệp phương sai của 3 vector<\/td>\n<\/tr>\n<tr>\n<td><strong>6. Phân phối Gauss<\/strong><\/td>\n<td>9/10<\/td>\n<td>Công thức mật độ; phân phối biên/có điều kiện; <span class=\"mjx-i\">\\(E(AX)\\)<\/span>; hỗn hợp; <span class=\"mjx-i\">\\(P(a&lt;Y&lt;b)\\)<\/span><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<hr/>\n<h1 id=\"MAI391-6-h8\"><span class=\"pn\">Phần 3<\/span>Các dạng bài<\/h1>\n<p>Mỗi dạng gồm: cách nhận biết → công thức → cách làm → <strong>ví dụ mẫu (giải chi tiết)<\/strong> → lỗi thường gặp → <strong>mẹo nhanh / thử đáp án / cách khác / bấm máy Casio<\/strong> → <strong>câu đề thật<\/strong> (chép nguyên văn như trong đề, để tự luyện).<\/p>\n<p>Ghi chú nguồn: <code>[FA24-RE Q27]<\/code> = đề FA24 thi lại, câu 27. Câu nào xuất hiện ở nhiều đề thì chỉ chép một lần và ghi đủ các nguồn. Các bảng phân phối được trình bày lại dạng bảng cho dễ đọc, số liệu giữ nguyên.<\/p>\n<h2 id=\"MAI391-6-h9\">Chuẩn bị: Casio fx-580VN X cho Chương 6<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Việc cần làm<\/th>\n<th>Chế độ<\/th>\n<th>Thao tác<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tích phân xác định (1 lớp)<\/td>\n<td>Calculate<\/td>\n<td>Phím <code>∫<\/code>, nhập hàm theo X và cận<\/td>\n<\/tr>\n<tr>\n<td>Tích phân kép trên hình chữ nhật<\/td>\n<td>Calculate<\/td>\n<td>Tách <span class=\"mjx-i\">\\(\\iint g(x)h(y)=\\int g\\cdot\\int h\\)<\/span>; hoặc tích phân từng lớp (xem Dạng 3)<\/td>\n<\/tr>\n<tr>\n<td>Kỳ vọng, phương sai từ bảng 1 biến<\/td>\n<td><code>MENU<\/code> → Statistics → 1-Variable<\/td>\n<td>Bật cột Freq (<code>SHIFT<\/code> <code>MENU<\/code> → Statistics → Frequency On), nhập <span class=\"mjx-i\">\\(x\\)<\/span> và <span class=\"mjx-i\">\\(p\\)<\/span> làm tần số → <code>OPTN<\/code> → 1-Variable Results: <span class=\"mjx-i\">\\(\\bar x=E(X)\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma_x^2=V(X)\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>Hiệp phương sai mẫu của 2 tọa độ<\/td>\n<td><code>MENU<\/code> → Statistics → <span class=\"mjx-i\">\\(y=a+bx\\)<\/span><\/td>\n<td>Nhập cặp <span class=\"mjx-i\">\\((x_i,y_i)\\)<\/span> → kết quả có <span class=\"mjx-i\">\\(\\bar x,\\bar y,\\sigma_x,\\sigma_y\\)<\/span>, <span class=\"mjx-i\">\\(\\sum xy\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td><span class=\"mjx-i\">\\(\\Phi(z)\\)<\/span><\/td>\n<td><code>MENU<\/code> → Distribution<\/td>\n<td>Normal CD, nhập cận dưới, cận trên, <span class=\"mjx-i\">\\(\\sigma\\)<\/span>, <span class=\"mjx-i\">\\(\\mu\\)<\/span><\/td>\n<\/tr>\n<tr>\n<td>Tổ hợp <span class=\"mjx-i\">\\(\\binom nk\\)<\/span><\/td>\n<td>Calculate<\/td>\n<td><code>SHIFT<\/code> <code>÷<\/code> (nCr)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<blockquote>\n<p><strong>Lưu ý:<\/strong> ở chế độ thống kê, <span class=\"mjx-i\">\\(\\sigma_x\\)<\/span> của máy là độ lệch chuẩn <strong>chia <span class=\"mjx-i\">\\(N\\)<\/span><\/strong> (khớp với slide), còn <span class=\"mjx-i\">\\(s_x\\)<\/span> là <strong>chia <span class=\"mjx-i\">\\(N-1\\)<\/span><\/strong>. Dùng <span class=\"mjx-i\">\\(\\sigma_x\\)<\/span>.<\/p>\n<\/blockquote>\n<hr/>\n<h2 id=\"MAI391-6-h10\">Dạng 1: Xác suất cơ bản &amp; biến ngẫu nhiên một chiều<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"discrete uniform distribution on the integers … through …\"<\/em>, <em>\"continuous uniform distribution over <span class=\"mjx-i\">\\([a,b]\\)<\/span>\"<\/em>, <em>\"How many possible values does <span class=\"mjx-i\">\\(Z\\)<\/span> have\"<\/em>, <em>\"<span class=\"mjx-i\">\\(\\Omega=\\{\\omega_1,\\omega_2\\}\\)<\/span>\"<\/em>, <em>\"cumulative distribution function\"<\/em>, bài toán đặt vé máy bay (nhị thức).<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li>Đều rời rạc trên <span class=\"mjx-i\">\\(n\\)<\/span> số nguyên: <span class=\"mjx-i\">\\(P(X\\in S)=\\#S/n\\)<\/span>.<\/li>\n<li>Đều liên tục trên <span class=\"mjx-i\">\\([a,b]\\)<\/span>: <span class=\"mjx-i\">\\(P(c&lt;X&lt;d)=\\dfrac{\\text{độ dài phần giao}}{b-a}\\)<\/span>.<\/li>\n<li>cdf: <span class=\"mjx-i\">\\(P(X\\le x)=F(x)\\)<\/span>; <span class=\"mjx-i\">\\(P(X&lt;x)=F(x^-)\\)<\/span> (giới hạn trái); <span class=\"mjx-i\">\\(P(X=x)=F(x)-F(x^-)\\)<\/span> (bước nhảy).<\/li>\n<li><span class=\"mjx-i\">\\(X,Y\\)<\/span> độc lập: <span class=\"mjx-i\">\\(P(X=x,Y=y)=P(X=x)P(Y=y)\\)<\/span>.<\/li>\n<li>Nhị thức: <span class=\"mjx-i\">\\(P(X=k)=\\binom nkp^k(1-p)^{n-k}\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Đổi điều kiện về dạng <span class=\"mjx-i\">\\(X\\in S\\)<\/span> (giải bất phương trình theo <span class=\"mjx-i\">\\(X\\)<\/span>).<\/li>\n<li>Đếm số phần tử thỏa mãn (rời rạc) hoặc độ dài đoạn (liên tục).<\/li>\n<li>Chia cho tổng số phần tử hoặc độ dài miền.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (đều rời rạc).<\/strong> <span class=\"mjx-i\">\\(X\\)<\/span> has a discrete uniform distribution on the integers <span class=\"mjx-i\">\\(-5\\)<\/span> through <span class=\"mjx-i\">\\(5\\)<\/span>. Find <span class=\"mjx-i\">\\(P(X^2\\le10)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> Có <span class=\"mjx-i\">\\(11\\)<\/span> số nguyên. <span class=\"mjx-i\">\\(X^2\\le10\\iff|X|\\le3{,}16\\iff X\\in\\{-3,\\dots,3\\}\\)<\/span> (7 số). Vậy <span class=\"mjx-i\">\\(P=\\tfrac7{11}\\)<\/span>.<\/p>\n<p><strong>Ví dụ 2 (đều rời rạc với lũy thừa).<\/strong> <span class=\"mjx-i\">\\(X\\)<\/span> uniform on the integers <span class=\"mjx-i\">\\(0\\)<\/span> through <span class=\"mjx-i\">\\(49\\)<\/span>. Find <span class=\"mjx-i\">\\(P(3^X\\le100)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(3^4=81\\le100&lt;243=3^5\\)<\/span>, nên <span class=\"mjx-i\">\\(X\\in\\{0,1,2,3,4\\}\\)<\/span> (5 số). <span class=\"mjx-i\">\\(P=\\tfrac5{50}=0{,}1\\)<\/span>. (Nhớ đếm cả <span class=\"mjx-i\">\\(X=0\\)<\/span>.)<\/p>\n<p><strong>Ví dụ 3 (đều liên tục).<\/strong> <span class=\"mjx-i\">\\(X\\)<\/span> is uniform over <span class=\"mjx-i\">\\([1,5]\\)<\/span>. Find <span class=\"mjx-i\">\\(P(2^X&lt;8)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(2^X&lt;8\\iff X&lt;3\\)<\/span>. <span class=\"mjx-i\">\\(P=\\tfrac{3-1}{5-1}=0{,}5\\)<\/span>.<\/p>\n<p><strong>Ví dụ 4 (số giá trị của <span class=\"mjx-i\">\\(Z\\)<\/span>).<\/strong> <span class=\"mjx-i\">\\(X,Y\\)<\/span> independent, each taking <span class=\"mjx-i\">\\(-1,0,1\\)<\/span>. How many values does <span class=\"mjx-i\">\\(Z=X+3Y\\)<\/span> have?<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(3Y\\in\\{-3,0,3\\}\\)<\/span>, cộng <span class=\"mjx-i\">\\(X\\in\\{-1,0,1\\}\\)<\/span> cho <span class=\"mjx-i\">\\(9\\)<\/span> giá trị <strong>khác nhau<\/strong>: <span class=\"mjx-i\">\\(-4,-3,\\dots,3,4\\)<\/span>. Quy tắc: <span class=\"mjx-i\">\\(Z=X+kY\\)<\/span> có <span class=\"mjx-i\">\\(5\\)<\/span> giá trị nếu <span class=\"mjx-i\">\\(|k|=1\\)<\/span>; <span class=\"mjx-i\">\\(7\\)<\/span> giá trị nếu <span class=\"mjx-i\">\\(|k|=2\\)<\/span>; <span class=\"mjx-i\">\\(9\\)<\/span> giá trị nếu <span class=\"mjx-i\">\\(|k|\\ge3\\)<\/span>.<\/p>\n<p><strong>Ví dụ 5 (<span class=\"mjx-i\">\\(\\Omega\\)<\/span> hữu hạn, độc lập).<\/strong> <span class=\"mjx-i\">\\(P(\\omega_1)=0{,}6\\)<\/span>, <span class=\"mjx-i\">\\(P(\\omega_2)=0{,}4\\)<\/span>; <span class=\"mjx-i\">\\(X(\\omega_1)=1, X(\\omega_2)=3\\)<\/span>; <span class=\"mjx-i\">\\(Y(\\omega_1)=2, Y(\\omega_2)=0\\)<\/span>; <span class=\"mjx-i\">\\(X,Y\\)<\/span> independent. Find <span class=\"mjx-i\">\\(P(X+Y=3)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(P(X=1)=0{,}6\\)<\/span>, <span class=\"mjx-i\">\\(P(X=3)=0{,}4\\)<\/span>, <span class=\"mjx-i\">\\(P(Y=2)=0{,}6\\)<\/span>, <span class=\"mjx-i\">\\(P(Y=0)=0{,}4\\)<\/span>. <span class=\"mjx-i\">\\(X+Y=3\\)<\/span> khi <span class=\"mjx-i\">\\((1,2)\\)<\/span> hoặc <span class=\"mjx-i\">\\((3,0)\\)<\/span>: <span class=\"mjx-i\">\\(0{,}6\\cdot0{,}6+0{,}4\\cdot0{,}4=0{,}52\\)<\/span>.<\/p>\n<p><strong>Ví dụ 6 (cdf có bước nhảy).<\/strong> <span class=\"mjx-i\">\\(F(x)=0\\)<\/span> for <span class=\"mjx-i\">\\(x&lt;0\\)<\/span>; <span class=\"mjx-i\">\\(F(x)=0{,}3\\)<\/span> for <span class=\"mjx-i\">\\(0\\le x&lt;1\\)<\/span>; <span class=\"mjx-i\">\\(F(x)=0{,}3+0{,}35(x-1)\\)<\/span> for <span class=\"mjx-i\">\\(1\\le x\\le3\\)<\/span>; <span class=\"mjx-i\">\\(F(x)=1\\)<\/span> for <span class=\"mjx-i\">\\(x&gt;3\\)<\/span>. Find <span class=\"mjx-i\">\\(P(X\\le0)\\)<\/span> and <span class=\"mjx-i\">\\(P(X&lt;0)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(P(X\\le0)=F(0)=0{,}3\\)<\/span>; <span class=\"mjx-i\">\\(P(X&lt;0)=F(0^-)=0\\)<\/span>.<\/p>\n<p><strong>Ví dụ 7 (nhị thức).<\/strong> Each passenger fails to show up with probability <span class=\"mjx-i\">\\(0{,}1\\)<\/span>. An airline sells 5 tickets for 4 seats. Probability of overbooking?<\/p>\n<p><strong>Giải:<\/strong> Quá tải khi cả 5 người đều đến: <span class=\"mjx-i\">\\(0{,}9^5\\approx0{,}59\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Đếm sai số phần tử (\"0 through 99\" là 100 số).<\/li>\n<li>Quên số âm khi giải <span class=\"mjx-i\">\\(X^2\\le c\\)<\/span>.<\/li>\n<li>Câu \"<span class=\"mjx-i\">\\(\\Omega\\)<\/span>, <span class=\"mjx-i\">\\(X,Y\\)<\/span> independent\": nhân xác suất <strong>biên<\/strong> của <span class=\"mjx-i\">\\(X\\)<\/span> và <span class=\"mjx-i\">\\(Y\\)<\/span>, không lấy <span class=\"mjx-i\">\\(P(\\omega)\\)<\/span> chung.<\/li>\n<li>cdf: nhầm <span class=\"mjx-i\">\\(P(X\\le0)\\)<\/span> với <span class=\"mjx-i\">\\(P(X&lt;0)\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(X^2\\le c\\)<\/span>: số nguyên thỏa là <span class=\"mjx-i\">\\(-\\lfloor\\sqrt c\\rfloor,\\dots,\\lfloor\\sqrt c\\rfloor\\)<\/span>, tức <span class=\"mjx-i\">\\(2\\lfloor\\sqrt c\\rfloor+1\\)<\/span> số.<\/li>\n<li><span class=\"mjx-i\">\\(2^X\\le c\\)<\/span> với <span class=\"mjx-i\">\\(X\\ge0\\)<\/span>: số giá trị là <span class=\"mjx-i\">\\(\\lfloor\\log_2c\\rfloor+1\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(Z=X+kY\\)<\/span> (<span class=\"mjx-i\">\\(X,Y\\in\\{-1,0,1\\}\\)<\/span>): <span class=\"mjx-i\">\\(5,7,9\\)<\/span> giá trị khi <span class=\"mjx-i\">\\(|k|=1,2,\\ge3\\)<\/span>.<\/li>\n<li>Câu đặt vé (so sánh hai hãng): quá tải khi <strong>số người đến &gt; số ghế<\/strong>. Với hãng bán dư 1 vé: <span class=\"mjx-i\">\\(P=(1-q)^n\\)<\/span>; với hãng bán dư 2 vé phải cộng thêm trường hợp chỉ 1 người vắng. Tính cả hai rồi so.<\/li>\n<\/ul>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\log_2c\\)<\/span>: gõ <code>log(2,c)<\/code> (phím log có cơ số).<\/li>\n<li>Nhị thức: <code>MENU<\/code> → Distribution → Binomial PD/CD; hoặc gõ <code>16C1×0.125×0.875^15<\/code> (nCr là <code>SHIFT<\/code> <code>÷<\/code>).<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">12 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-6-q1\"><strong>Câu 1.1<\/strong> <code>[SP26 Q24]<\/code> <code>[SP25-RE Q26]<\/code> <code>[SP26 Q28]<\/code>\nSuppose that <span class=\"mjx-i\">\\(X\\)<\/span> has a discrete uniform distribution on the integers <span class=\"mjx-i\">\\(-7\\)<\/span> through <span class=\"mjx-i\">\\(7\\)<\/span> .\nThe probability such that <span class=\"mjx-i\">\\(X^2 \\le 18\\)<\/span> is<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(0.2\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(0.4\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(0.6\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(0.8\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (iii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q2\"><strong>Câu 1.2<\/strong> <code>[Đề A Q27]<\/code> <code>[SU24-RE Q23]<\/code> <code>[SP26 Q30]<\/code>\nSuppose that <span class=\"mjx-i\">\\(X\\)<\/span> has a discrete uniform distribution on the integers 0 through 99.\nThe probability such that <span class=\"mjx-i\">\\(2^X \\leq 50\\)<\/span> is<\/p>\n<ul>\n<li>A. (i) 0.05<\/li>\n<li>B. (ii) 0.06<\/li>\n<li>C. (iii) 0.07<\/li>\n<li>D. (iv) 0.08<\/li>\n<li>E. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q3\"><strong>Câu 1.3<\/strong> <code>[FA24-FE Q27]<\/code>\nSuppose that <span class=\"mjx-i\">\\(X\\)<\/span> has a continuous uniform distribution over <span class=\"mjx-i\">\\([2, 10]\\)<\/span> . Approximate the probability such that <span class=\"mjx-i\">\\(2^X &lt; 10\\)<\/span> .<\/p>\n<ul>\n<li>A. (i) 0.105<\/li>\n<li>B. (ii) 0.218<\/li>\n<li>C. (iii) 0.255<\/li>\n<li>D. (iv) 0.165<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q4\"><strong>Câu 1.4<\/strong> <code>[FA24-RE Q27]<\/code>\nLet <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> be independent random variables, each taking the values <span class=\"mjx-i\">\\(-1\\)<\/span> , <span class=\"mjx-i\">\\(0\\)<\/span> or <span class=\"mjx-i\">\\(1\\)<\/span> . Let <span class=\"mjx-i\">\\(Z = X + 2Y\\)<\/span> . How many possible values does <span class=\"mjx-i\">\\(Z\\)<\/span> have?<\/p>\n<ul>\n<li>(i) 9<\/li>\n<li>(ii) 8<\/li>\n<li>(iii) 7<\/li>\n<li>(iv) 6<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q5\"><strong>Câu 1.5<\/strong> <code>[Đề B Q26]<\/code> <code>[SP26 Q28]<\/code>\nLet <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> be independent random variables, each taking the values <span class=\"mjx-i\">\\(-1\\)<\/span> , <span class=\"mjx-i\">\\(0\\)<\/span> or <span class=\"mjx-i\">\\(1\\)<\/span> . Let <span class=\"mjx-i\">\\(Z = X - 5Y\\)<\/span> . How many possible values does <span class=\"mjx-i\">\\(Z\\)<\/span> have?<\/p>\n<ul>\n<li>(i) 9<\/li>\n<li>(ii) 8<\/li>\n<li>(iii) 7<\/li>\n<li>(iv) 6<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q6\"><strong>Câu 1.6<\/strong> <code>[FA24-FE Q30]<\/code>\nLet <span class=\"mjx-i\">\\(\\Omega = {\\omega_1, \\omega_2}\\)<\/span> with <span class=\"mjx-i\">\\(P(\\omega_1) = 0.7, \\quad P(\\omega_2) = 0.3.\\)<\/span> Let <span class=\"mjx-i\">\\(X, Y\\)<\/span> be independent random variables such that <span class=\"mjx-i\">\\(X(\\omega_1) = 1 \\quad X(\\omega_2) = 2\\)<\/span> <span class=\"mjx-i\">\\(Y(\\omega_1) = 2 \\quad Y(\\omega_2) = 3.\\)<\/span>\nFind the probability <span class=\"mjx-i\">\\(P(X + Y = 4)\\)<\/span> .<\/p>\n<ul>\n<li>A. 0.18<\/li>\n<li>B. 0.98<\/li>\n<li>C. 0.42<\/li>\n<li>D. 0.49<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q7\"><strong>Câu 1.7<\/strong> <code>[SP26 Q34]<\/code>\nGiven the probability distributions of two independent discrete random variables <span class=\"mjx-i\">\\(X, Y\\)<\/span>:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><span class=\"mjx-i\">\\(X\\)<\/span><\/th>\n<th>0<\/th>\n<th>1<\/th>\n<th>2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"mjx-i\">\\(P\\)<\/span><\/td>\n<td>0.3<\/td>\n<td>0.25<\/td>\n<td>0.45<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><span class=\"mjx-i\">\\(Y\\)<\/span><\/th>\n<th>1<\/th>\n<th>2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"mjx-i\">\\(P\\)<\/span><\/td>\n<td>0.4<\/td>\n<td>0.6<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The probability such that <span class=\"mjx-i\">\\(X + Y\\)<\/span> is odd is<\/p>\n<ul>\n<li>\n<p>(i) 0.45<\/p>\n<\/li>\n<li>\n<p>(ii) 0.55<\/p>\n<\/li>\n<li>\n<p>(iii) 0.35<\/p>\n<\/li>\n<li>\n<p>(iv) 0.65<\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (iv)<\/p>\n<\/li>\n<li>\n<p>C. (iii)<\/p>\n<\/li>\n<li>\n<p>D. (i)<\/p>\n<\/li>\n<li>\n<p>E. None of the other choices is correct<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q8\"><strong>Câu 1.8<\/strong> <code>[SP26 Q11]<\/code> <code>[SP26 Q29]<\/code>\nLet <span class=\"mjx-i\">\\(X\\)<\/span> be a random variable with the cumulative distribution function given by <span class=\"mjx-i\">\\(F(x) = \\begin{cases} 0 &amp; \\text{if } x &lt; -1 \\\\ 1 - p &amp; \\text{if } -1 \\le x &lt; 0 \\\\ 1 - p + \\frac{xp}{2} &amp; \\text{if } 0 \\le x \\le 2 \\\\ 1 &amp; \\text{if } x &gt; 2 \\end{cases}\\)<\/span> Find <span class=\"mjx-i\">\\(P(X \\le 0)\\)<\/span> .<\/p>\n<ul>\n<li>A. 1-p<\/li>\n<li>B. 1-p/2<\/li>\n<li>C. 1<\/li>\n<li>D. 0<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q9\"><strong>Câu 1.9<\/strong> <code>[Đề B Q27]<\/code>\nSuppose that the random variable <span class=\"mjx-i\">\\(X\\)<\/span> has the cumulative distribution function<\/p>\n<p><div class=\"mjx-d\">\\[F(x)=\n\\begin{cases}\n0 &amp; \\text{if } x&lt;0\\\\\n\\frac{x}{2} &amp; \\text{if } 0\\le x\\le 2\\\\\n1 &amp; \\text{if } x&gt;2\n\\end{cases}\\]<\/div><\/p>\n<p>Let <span class=\"mjx-i\">\\(Y=X^2\\)<\/span> . Find the probability <span class=\"mjx-i\">\\(P(Y\\le X)\\)<\/span> .<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. 0.25<\/li>\n<li>C. 0.5<\/li>\n<li>D. 1<\/li>\n<li>E. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q10\"><strong>Câu 1.10<\/strong> <code>[SP26 Q31]<\/code>\nAirlines find that each passenger who reserves a seat fails to turn up with probability 0.125 independently of the other passengers. So Thai airways always sell 8 tickets for their 7 seats aeroplane while Qatar airways sell 16 tickets for their 14 seats aeroplane. Which is more often over-booked?<\/p>\n<ul>\n<li>A. None of them<\/li>\n<li>B. Qatar airways<\/li>\n<li>C. Thai airways<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q11\"><strong>Câu 1.11<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nSuppose that <span class=\"mjx-i\">\\(X\\)<\/span> has a discrete uniform distribution on the integers 0 through 1000. Find the probability such that <span class=\"mjx-i\">\\(4^X&lt;120\\)<\/span>.<\/p>\n<p class=\"qh\" id=\"MAI391-6-q12\"><strong>Câu 1.12<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nLet <span class=\"mjx-i\">\\(\\Omega=\\{\\omega_1,\\omega_2\\}\\)<\/span> with <span class=\"mjx-i\">\\(P(\\omega_1)=0.25\\)<\/span> and <span class=\"mjx-i\">\\(P(\\omega_2)=0.75\\)<\/span>. Let <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> be independent random variables such that\n<div class=\"mjx-d\">\\[X(\\omega_1)=1,\\quad X(\\omega_2)=2,\\quad Y(\\omega_1)=2,\\quad Y(\\omega_2)=3.\\]<\/div>\nFind the probability <span class=\"mjx-i\">\\(P(X+Y=4)\\)<\/span>.<\/p>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-6-h11\">Dạng 2: Phân phối đồng thời rời rạc<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p>Đề cho bảng <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> hoặc công thức <span class=\"mjx-i\">\\(p(x,y)=c(\\dots)\\)<\/span> trên tập hữu hạn; hỏi hằng số <span class=\"mjx-i\">\\(c\\)<\/span>/<span class=\"mjx-i\">\\(k\\)<\/span>, phân phối biên (dạng bảng), <span class=\"mjx-i\">\\(P(A\\mid B)\\)<\/span>, <span class=\"mjx-i\">\\(E(Y\\mid X=x)\\)<\/span>, <span class=\"mjx-i\">\\(E(X)\\)<\/span>.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(\\sum_x\\sum_yp(x,y)=1\\)<\/span> (để tìm <span class=\"mjx-i\">\\(c\\)<\/span>).<\/li>\n<li>Biên: <span class=\"mjx-i\">\\(P(X=x)=\\sum_yp(x,y)\\)<\/span> (tổng <strong>hàng<\/strong>); <span class=\"mjx-i\">\\(P(Y=y)=\\sum_xp(x,y)\\)<\/span> (tổng <strong>cột<\/strong>).<\/li>\n<li>Có điều kiện: <span class=\"mjx-i\">\\(P(X\\in A\\mid Y=y)=\\dfrac{\\sum_{x\\in A}p(x,y)}{P(Y=y)}\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(E(Y\\mid X=x)=\\dfrac{\\sum_y y\\,p(x,y)}{P(X=x)}\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Câu tìm <span class=\"mjx-i\">\\(c\\)<\/span>: cộng <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> trên mọi cặp. Với <span class=\"mjx-i\">\\(p=c\\,g(x)h(y)\\)<\/span>: tổng <span class=\"mjx-i\">\\(=c\\big(\\sum g(x)\\big)\\big(\\sum h(y)\\big)\\)<\/span>.<\/li>\n<li>Câu biên của <span class=\"mjx-i\">\\(p=c(x+y)\\)<\/span>: <span class=\"mjx-i\">\\(P(X=x)=c\\sum_y(x+y)=c(m\\,x+\\sum y)\\)<\/span> với <span class=\"mjx-i\">\\(m\\)<\/span> là số giá trị của <span class=\"mjx-i\">\\(y\\)<\/span>.<\/li>\n<li>Câu có điều kiện: <strong>khoanh đúng một hàng hoặc một cột<\/strong> (theo điều kiện), lấy phần thỏa mãn chia cho tổng hàng/cột đó.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (hằng số &amp; biên).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=c(x+2y)\\)<\/span>, <span class=\"mjx-i\">\\(x\\in\\{1,2\\}\\)<\/span>, <span class=\"mjx-i\">\\(y\\in\\{0,1\\}\\)<\/span>. Find <span class=\"mjx-i\">\\(c\\)<\/span> and the marginal distributions.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Bảng giá trị <span class=\"mjx-i\">\\(x+2y\\)<\/span>: <span class=\"mjx-i\">\\((1,0)\\to1\\)<\/span>, <span class=\"mjx-i\">\\((1,1)\\to3\\)<\/span>, <span class=\"mjx-i\">\\((2,0)\\to2\\)<\/span>, <span class=\"mjx-i\">\\((2,1)\\to4\\)<\/span>; tổng <span class=\"mjx-i\">\\(10\\)<\/span>, nên <span class=\"mjx-i\">\\(c=\\tfrac1{10}\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(P(X=1)=(1+3)c=4c\\)<\/span>, <span class=\"mjx-i\">\\(P(X=2)=(2+4)c=6c\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(P(Y=0)=(1+2)c=3c\\)<\/span>, <span class=\"mjx-i\">\\(P(Y=1)=(3+4)c=7c\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (bảng, có điều kiện, kỳ vọng có điều kiện).<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><span class=\"mjx-i\">\\(X\\backslash Y\\)<\/span><\/th>\n<th>0<\/th>\n<th>1<\/th>\n<th>2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>0,1<\/td>\n<td>0,2<\/td>\n<td>0,1<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>0,3<\/td>\n<td>0,1<\/td>\n<td>0,2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Find <span class=\"mjx-i\">\\(P(X=2\\mid Y=2)\\)<\/span> and <span class=\"mjx-i\">\\(E(Y\\mid X=1)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Cột <span class=\"mjx-i\">\\(Y=2\\)<\/span>: <span class=\"mjx-i\">\\(0{,}1+0{,}2=0{,}3\\)<\/span>, nên <span class=\"mjx-i\">\\(P(X=2\\mid Y=2)=\\tfrac{0{,}2}{0{,}3}=\\tfrac23\\)<\/span>.<\/li>\n<li>Hàng <span class=\"mjx-i\">\\(X=1\\)<\/span>: tổng <span class=\"mjx-i\">\\(0{,}4\\)<\/span>; <span class=\"mjx-i\">\\(E(Y\\mid X=1)=\\tfrac{0\\cdot0{,}1+1\\cdot0{,}2+2\\cdot0{,}1}{0{,}4}=\\tfrac{0{,}4}{0{,}4}=1\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 3 (hằng số dạng tích).<\/strong> <span class=\"mjx-i\">\\(p(x,y)=kx^2y\\)<\/span>, <span class=\"mjx-i\">\\(X\\in\\{0,1,2\\}\\)<\/span>, <span class=\"mjx-i\">\\(Y\\in\\{1,2\\}\\)<\/span>. Find <span class=\"mjx-i\">\\(k\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\sum x^2=0+1+4=5\\)<\/span>, <span class=\"mjx-i\">\\(\\sum y=3\\)<\/span>, nên <span class=\"mjx-i\">\\(k\\cdot15=1\\)<\/span> và <span class=\"mjx-i\">\\(k=\\tfrac1{15}\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Đọc nhầm bảng: đề có bảng <span class=\"mjx-i\">\\(X\\backslash Y\\)<\/span> và cả bảng <span class=\"mjx-i\">\\(Y\\backslash X\\)<\/span>. Luôn xem tiêu đề hàng/cột.<\/li>\n<li>Chia cho tổng <strong>cả bảng<\/strong> thay vì tổng hàng/cột của điều kiện.<\/li>\n<li>Câu biên dạng bảng: quên số giá trị của <span class=\"mjx-i\">\\(y\\)<\/span> (ví dụ <span class=\"mjx-i\">\\(y=0,1,2\\)<\/span> có 3 giá trị nhưng <span class=\"mjx-i\">\\(y=0,1,2,3\\)<\/span> có 4).<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Biên của <span class=\"mjx-i\">\\(c(x+y)\\)<\/span>:<\/strong> <span class=\"mjx-i\">\\(P(X=x)=c(m\\,x+S_y)\\)<\/span>, với <span class=\"mjx-i\">\\(m\\)<\/span> = số giá trị của <span class=\"mjx-i\">\\(y\\)<\/span>, <span class=\"mjx-i\">\\(S_y\\)<\/span> = tổng các giá trị <span class=\"mjx-i\">\\(y\\)<\/span>. Các số trong bảng đáp án phải <strong>tăng đều một khoảng <span class=\"mjx-i\">\\(m\\)<\/span><\/strong>: <span class=\"mjx-i\">\\(y=0,1,2\\)<\/span> thì bước nhảy là <span class=\"mjx-i\">\\(3\\)<\/span>; <span class=\"mjx-i\">\\(y=1,2,3\\)<\/span> cũng là <span class=\"mjx-i\">\\(3\\)<\/span>; <span class=\"mjx-i\">\\(y=0,\\dots,3\\)<\/span> thì bước nhảy là <span class=\"mjx-i\">\\(4\\)<\/span>. Nhìn bước nhảy là loại được đáp án.<\/li>\n<li>Tương tự, biên của <span class=\"mjx-i\">\\(Y\\)<\/span>: bước nhảy bằng số giá trị của <span class=\"mjx-i\">\\(x\\)<\/span>.<\/li>\n<li>Kiểm tra bảng biên: tổng các số phải bằng <span class=\"mjx-i\">\\(1/c\\)<\/span> (tổng toàn bộ).<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> câu có điều kiện với đáp án phân số: tính tử và mẫu riêng (mẫu là tổng một hàng/cột), so tỉ số.<\/p>\n<p><strong>Bấm máy:<\/strong> <span class=\"mjx-i\">\\(E(Y\\mid X=1)\\)<\/span>: Statistics 1-Variable, nhập cột <span class=\"mjx-i\">\\(y\\)<\/span> là các giá trị <span class=\"mjx-i\">\\(Y\\)<\/span>, Freq là các xác suất ở hàng <span class=\"mjx-i\">\\(X=1\\)<\/span> (máy tự chia cho tổng tần số), đọc <span class=\"mjx-i\">\\(\\bar x\\)<\/span>.<\/p>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">16 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-6-q13\"><strong>Câu 2.1<\/strong> <code>[FA24-RE Q28]<\/code> <code>[SP25-RE Q1]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y) = (1/15)(xy + 1)\\)<\/span> be the joint probability function of two discrete random variables <span class=\"mjx-i\">\\(X \\in {1, 2}\\)<\/span> and <span class=\"mjx-i\">\\(Y \\in {0, 1, 2}\\)<\/span> . Find the value <span class=\"mjx-i\">\\(P(X = 1 \\mid Y = 2)\\)<\/span> .<\/p>\n<ul>\n<li>A. 13/15<\/li>\n<li>B. 1/2<\/li>\n<li>C. 3/8<\/li>\n<li>D. 8/15<\/li>\n<li>E. 2/15<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q14\"><strong>Câu 2.2<\/strong> <code>[FA24-RE Q29]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y) = (1/15)(xy + 1)\\)<\/span> be the joint probability function of two discrete random variables <span class=\"mjx-i\">\\(X \\in {1,2}\\)<\/span> and <span class=\"mjx-i\">\\(Y \\in {0,1,2}\\)<\/span> . Find the value <span class=\"mjx-i\">\\(P(Y \\geq 1)\\)<\/span> .<\/p>\n<ul>\n<li>A. 13/15<\/li>\n<li>B. 1/2<\/li>\n<li>C. 3/8<\/li>\n<li>D. 8/15<\/li>\n<li>E. 2/5<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q15\"><strong>Câu 2.3<\/strong> <code>[SP26 Q24]<\/code>\nDetermine the constant <span class=\"mjx-i\">\\(k\\)<\/span> such that the function <span class=\"mjx-i\">\\(p(x, y) = k x^3 y\\)<\/span> defines a valid joint probability mass function of two discrete random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> ,\nwhere <span class=\"mjx-i\">\\(X = {0, 1, 2}, \\quad Y = {1, 2, 3}.\\)<\/span><\/p>\n<ul>\n<li>A. 1/45<\/li>\n<li>B. 1/52<\/li>\n<li>C. 1/54<\/li>\n<li>D. None of the other choices is correct<\/li>\n<li>E. 1/108<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q16\"><strong>Câu 2.4<\/strong> <code>[FA24-RE Q40]<\/code> <code>[SP26 Q39]<\/code>\nLet <span class=\"mjx-i\">\\(c\\)<\/span> be the number such that <span class=\"mjx-i\">\\(f(x,y)=c(x+y)\\)<\/span> is the joint probability distribution of two discrete random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>, where <span class=\"mjx-i\">\\(x=1,2,3,4\\)<\/span> and <span class=\"mjx-i\">\\(y=1,2,3\\)<\/span>. Describe the marginal probability distribution of <span class=\"mjx-i\">\\(X\\)<\/span>.<\/p>\n<ul>\n<li>\n<p>(i)<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><span class=\"mjx-i\">\\(X\\)<\/span><\/th>\n<th>1<\/th>\n<th>2<\/th>\n<th>3<\/th>\n<th>4<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"mjx-i\">\\(P(X=k)\\)<\/span><\ ass=\"mjx-i\">\\(X\\backslash Y\\)<\/span><\/th>\n<th>1<\/th>\n<th>2<\/th>\n<th>3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><span class=\"mjx-i\">\\(-1\\)<\/span><\/td>\n<td>0.1<\/td>\n<td>0.2<\/td>\n<td>0.3<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>0.1<\/td>\n<td>0.1<\/td>\n<td>0.2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Compute <span class=\"mjx-i\">\\(E(X)\\)<\/span>.<\/p>\n<ul>\n<li>A. -0.4<\/li>\n<li>B. 0.4<\/li>\n<li>C. 0.2<\/li>\n<li>D. -0.2<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q27\"><strong>Câu 2.15<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y)=cxy\\)<\/span>, where <span class=\"mjx-i\">\\(c\\)<\/span> is a real number.<\/p>\n<p>a) Find <span class=\"mjx-i\">\\(c\\)<\/span> such that <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> satisfies the conditions to be the joint probability function of some discrete random variables <span class=\"mjx-i\">\\(X\\in\\{0,1,2\\}\\)<\/span> and <span class=\"mjx-i\">\\(Y\\in\\{1,2,3\\}\\)<\/span>.<\/p>\n<p>b) Determine <span class=\"mjx-i\">\\(P(X=1)\\)<\/span>, <span class=\"mjx-i\">\\(P(X&gt;0)\\)<\/span>, <span class=\"mjx-i\">\\(P(X=2\\mid Y=1)\\)<\/span>, the mean of <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>, the covariance between <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>.<\/p>\n<p class=\"qh\" id=\"MAI391-6-q28\"><strong>Câu 2.16<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y)=(xy+2)/36\\)<\/span> be the joint probability function of some discrete random variables <span class=\"mjx-i\">\\(X=\\{1,2,3\\}\\)<\/span> and <span class=\"mjx-i\">\\(Y=\\{0,1,2\\}\\)<\/span>. Compute <span class=\"mjx-i\">\\(E(X\\mid Y=1)\\)<\/span>.<\/p>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-6-h12\">Dạng 3: Phân phối đồng thời liên tục<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><span class=\"mjx-i\">\\(p(x,y)\\)<\/span> là hàm trên miền chữ nhật (<span class=\"mjx-i\">\\(0\\le x\\le1\\)<\/span>, <span class=\"mjx-i\">\\(1\\le y\\le3\\)<\/span>…); hỏi hằng số <span class=\"mjx-i\">\\(c\\)<\/span>, mật độ biên <span class=\"mjx-i\">\\(p(x)\\)<\/span>/<span class=\"mjx-i\">\\(p(y)\\)<\/span>/<span class=\"mjx-i\">\\(f_Y(y)\\)<\/span>, <span class=\"mjx-i\">\\(P(X\\le\\cdot,\\ Y&gt;\\cdot)\\)<\/span>.<\/p>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[\\iint p(x,y)\\,dx\\,dy=1,\\qquad p(x)=\\int p(x,y)\\,dy,\\qquad P(a&lt;X&lt;b,\\ c&lt;Y&lt;d)=\\int_a^b\\!\\!\\int_c^dp(x,y)\\,dy\\,dx\\]<\/div><\/p>\n<ul>\n<li>Miền chữ nhật và <span class=\"mjx-i\">\\(p=g(x)h(y)\\)<\/span>: <span class=\"mjx-i\">\\(\\iint=\\Big(\\int g\\Big)\\Big(\\int h\\Big)\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Xác định đúng <strong>miền<\/strong> của <span class=\"mjx-i\">\\(x\\)<\/span> và <span class=\"mjx-i\">\\(y\\)<\/span>.<\/li>\n<li>Biên theo <span class=\"mjx-i\">\\(x\\)<\/span>: tích phân theo <span class=\"mjx-i\">\\(y\\)<\/span> trên <strong>toàn miền của <span class=\"mjx-i\">\\(y\\)<\/span><\/strong> (giữ <span class=\"mjx-i\">\\(x\\)<\/span>).<\/li>\n<li>Xác suất: lấy <strong>giao<\/strong> của vùng đề hỏi với miền xác định.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (hằng số).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=cx^2y\\)<\/span>, <span class=\"mjx-i\">\\(0\\le x\\le1\\)<\/span>, <span class=\"mjx-i\">\\(0\\le y\\le2\\)<\/span>. Find <span class=\"mjx-i\">\\(c\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\int_0^1x^2dx=\\tfrac13\\)<\/span>, <span class=\"mjx-i\">\\(\\int_0^2y\\,dy=2\\)<\/span>, nên <span class=\"mjx-i\">\\(c\\cdot\\tfrac23=1\\)<\/span> và <span class=\"mjx-i\">\\(c=\\tfrac32\\)<\/span>.<\/p>\n<p><strong>Ví dụ 2 (mật độ biên).<\/strong> With the same <span class=\"mjx-i\">\\(f\\)<\/span>, find <span class=\"mjx-i\">\\(p(y)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(p(y)=\\int_0^1\\tfrac32x^2y\\,dx=\\tfrac32y\\cdot\\tfrac13=\\tfrac y2\\)<\/span>, với <span class=\"mjx-i\">\\(0\\le y\\le2\\)<\/span>. (Kiểm tra <span class=\"mjx-i\">\\(\\int_0^2\\tfrac y2dy=1\\)<\/span> ✓.)<\/p>\n<p><strong>Ví dụ 3 (xác suất).<\/strong> With the same <span class=\"mjx-i\">\\(f\\)<\/span>, find <span class=\"mjx-i\">\\(P(X\\le0{,}5,\\ Y\\le1)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\tfrac32\\int_0^{0{,}5}x^2dx\\int_0^1y\\,dy=\\tfrac32\\cdot\\tfrac{0{,}125}{3}\\cdot\\tfrac12=\\tfrac1{32}=0{,}03125\\)<\/span>.<\/p>\n<p><strong>Ví dụ 4 (hàm tổng).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=x+y\\)<\/span> on <span class=\"mjx-i\">\\([0,1]^2\\)<\/span>. Find <span class=\"mjx-i\">\\(P(0&lt;Y&lt;0{,}5)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(p(y)=\\int_0^1(x+y)dx=y+\\tfrac12\\)<\/span>. <span class=\"mjx-i\">\\(P=\\int_0^{0{,}5}(y+\\tfrac12)dy=0{,}125+0{,}25=0{,}375\\)<\/span>.<\/p>\n<p><strong>Ví dụ 5 (miền vô hạn).<\/strong> <span class=\"mjx-i\">\\(f(x,y)=Ce^{-|x|-|y|}\\)<\/span> on <span class=\"mjx-i\">\\(\\mathbb{R}^2\\)<\/span>. Find <span class=\"mjx-i\">\\(C\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\int_{-\\infty}^{\\infty}e^{-|t|}dt=2\\)<\/span>, nên <span class=\"mjx-i\">\\(C\\cdot2\\cdot2=1\\)<\/span> và <span class=\"mjx-i\">\\(C=\\tfrac14\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Lấy tích phân trên <span class=\"mjx-i\">\\([0,1]\\)<\/span> khi miền của <span class=\"mjx-i\">\\(y\\)<\/span> là <span class=\"mjx-i\">\\([1,3]\\)<\/span>.<\/li>\n<li>Mật độ biên: lấy tích phân theo <strong>sai biến<\/strong> (tìm <span class=\"mjx-i\">\\(p(y)\\)<\/span> phải tích phân theo <span class=\"mjx-i\">\\(x\\)<\/span>).<\/li>\n<li>Xác suất: dùng cận ngoài miền xác định (ví dụ <span class=\"mjx-i\">\\(Y&gt;1\\)<\/span> trên miền <span class=\"mjx-i\">\\(0\\le y\\le2\\)<\/span> là <span class=\"mjx-i\">\\(1&lt;y\\le2\\)<\/span>).<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><strong>Kiểm tra mật độ biên:<\/strong> đáp án đúng phải (1) <strong>không âm<\/strong> trên miền, (2) có <strong>tích phân bằng 1<\/strong>. Hai điều kiện này thường loại hết đáp án sai (ví dụ <span class=\"mjx-i\">\\(6y^2-1\\)<\/span> âm khi <span class=\"mjx-i\">\\(y\\)<\/span> nhỏ; <span class=\"mjx-i\">\\(3y^2+2y-1\\)<\/span> có tích phân <span class=\"mjx-i\">\\(1\\)<\/span> nhưng âm tại <span class=\"mjx-i\">\\(y=0\\)<\/span>).<\/li>\n<li><span class=\"mjx-i\">\\(p=c\\,g(x)h(y)\\)<\/span>: mật độ biên của <span class=\"mjx-i\">\\(x\\)<\/span> <strong>tỉ lệ với <span class=\"mjx-i\">\\(g(x)\\)<\/span><\/strong>, nên chỉ cần chuẩn hóa <span class=\"mjx-i\">\\(g\\)<\/span>. Ví dụ <span class=\"mjx-i\">\\(p\\propto xy^2\\)<\/span> trên <span class=\"mjx-i\">\\(0\\le x\\le1\\)<\/span> thì <span class=\"mjx-i\">\\(p(x)=2x\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(p=a\\,x+b\\,y\\)<\/span> trên <span class=\"mjx-i\">\\([0,1]^2\\)<\/span>: <span class=\"mjx-i\">\\(p(x)=a\\,x+\\tfrac b2\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Thử đáp án:<\/strong> với đáp án mật độ, bấm <code>∫<\/code> từng đáp án trên miền; cái nào bằng 1 và không âm thì giữ.<\/p>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li>Tích phân kép dạng tích: tính từng tích phân 1 lớp rồi nhân.<\/li>\n<li>Tích phân kép không tách được: tính biên <span class=\"mjx-i\">\\(p(x)\\)<\/span> bằng tay (tích phân theo <span class=\"mjx-i\">\\(y\\)<\/span>, dễ), rồi bấm <code>∫<\/code> theo <span class=\"mjx-i\">\\(x\\)<\/span>. Ví dụ <span class=\"mjx-i\">\\(\\int_0^2\\!\\int_0^1(\\tfrac{x^2}{36}+\\tfrac y{12})dy\\,dx=\\int_0^2(\\tfrac{x^2}{36}+\\tfrac1{24})dx\\)<\/span>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">15 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-6-q29\"><strong>Câu 3.1<\/strong> <code>[Đề A Q28]<\/code>\nFind the number <span class=\"mjx-i\">\\(c\\)<\/span> such that the function <span class=\"mjx-i\">\\(f(x,y)=cxy^2\\)<\/span> with <span class=\"mjx-i\">\\(0 \\le x \\le 1\\)<\/span> , <span class=\"mjx-i\">\\(1 \\le y \\le 3\\)<\/span> satisfies conditions to be the joint probability function of some continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(3/13\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(3/4\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(13/3\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(4/3\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q30\"><strong>Câu 3.2<\/strong> <code>[SP25-RE Q27]<\/code>\nFind the number <span class=\"mjx-i\">\\(c\\)<\/span> such that the function <span class=\"mjx-i\">\\(f(x,y)=cxy^2\\)<\/span> with <span class=\"mjx-i\">\\(1 \\le x \\le 3\\)<\/span> , <span class=\"mjx-i\">\\(0 \\le y \\le 1\\)<\/span> satisfies conditions to be the joint probability function of some continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(13/3\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(3/13\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(3/4\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(4/3\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q31\"><strong>Câu 3.3<\/strong> <code>[FA24-FE Q31]<\/code>\nThe bivariate distribution <span class=\"mjx-i\">\\(f(x,y)\\)<\/span> of two discrete random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> given by <span class=\"mjx-i\">\\(f(x,y)=\\frac{C}{(1+x^2)(1+y^2)}.\\)<\/span> What is the value <span class=\"mjx-i\">\\(C\\)<\/span> provided that <span class=\"mjx-i\">\\(\\int_{-\\infty}^{\\infty}\\frac{dt}{1+t^2}=\\pi.\\)<\/span><\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\pi\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(1/\\pi\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\pi^2\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(1/\\pi^2\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q32\"><strong>Câu 3.4<\/strong> <code>[FA24-RE Q30]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y) = \\frac{3}{4}xy^2\\)<\/span> with <span class=\"mjx-i\">\\(1 \\le x \\le 3\\)<\/span>, <span class=\"mjx-i\">\\(0 \\le y \\le 1\\)<\/span> be the joint probability function of some continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>. Find the marginal probability distribution <span class=\"mjx-i\">\\(p(y)\\)<\/span> of <span class=\"mjx-i\">\\(Y\\)<\/span>.<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(p(y) = 3y^2 + 2y - 1\\)<\/span>, <span class=\"mjx-i\">\\(0 \\le y \\le 1\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(p(y) = 3y^2\\)<\/span>, <span class=\"mjx-i\">\\(0 \\le y \\le 1\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(p(y) = 6y^2 - 2y\\)<\/span>, <span class=\"mjx-i\">\\(0 \\le y \\le 1\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(p(y) = 6y^2 - 1\\)<\/span>, <span class=\"mjx-i\">\\(0 \\le y \\le 1\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q33\"><strong>Câu 3.5<\/strong> <code>[SU24-RE Q25]<\/code> <code>[SP26 Q10]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y) = (3/13)xy^2\\)<\/span> with <span class=\"mjx-i\">\\(0 \\le x \\le 1\\)<\/span> , <span class=\"mjx-i\">\\(1 \\le y \\le 3\\)<\/span> be the joint probability function of some continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> . Find the marginal probability distribution <span class=\"mjx-i\">\\(p(y)\\)<\/span> of <span class=\"mjx-i\">\\(Y\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(p(y) = (1/4)y\\)<\/span> , <span class=\"mjx-i\">\\(1 \\le y \\le 3\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(p(y) = (3/13)y^2 - (1/2)\\)<\/span> , <span class=\"mjx-i\">\\(1 \\le y \\le 3\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(p(y) = (3/26)y^2\\)<\/span> , <span class=\"mjx-i\">\\(1 \\le y \\le 3\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(p(y) = (1/2)y - (1/2)\\)<\/span> , <span class=\"mjx-i\">\\(1 \\le y \\le 3\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q34\"><strong>Câu 3.6<\/strong> <code>[SP26 Q20]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y) = (3/13)xy^2\\)<\/span> with <span class=\"mjx-i\">\\(0 \\leq x \\leq 1\\)<\/span> , <span class=\"mjx-i\">\\(1 \\leq y \\leq 3\\)<\/span> be the joint probability function of some continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> . Find the marginal probability distribution <span class=\"mjx-i\">\\(p(x)\\)<\/span> of <span class=\"mjx-i\">\\(X\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(p(x) = 2x, \\quad 0 \\leq x \\leq 1\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(p(x) = x + 0.5, \\quad 0 \\leq x \\leq 1\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(p(x) = 1.5x - 0.5, \\quad 0 \\leq x \\leq 1\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(p(x) = 4x - 1, \\quad 0 \\leq x \\leq 1\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (ii)<\/p>\n<\/li>\n<li>\n<p>B. (i)<\/p>\n<\/li>\n<li>\n<p>C. (iv)<\/p>\n<\/li>\n<li>\n<p>D. (iii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q35\"><strong>Câu 3.7<\/strong> <code>[SP25-RE Q39]<\/code>\nConsider the following bivariate distribution <span class=\"mjx-i\">\\(f(x,y)\\)<\/span> of two random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>\n<div class=\"mjx-d\">\\[f(x,y)=\n\\begin{cases}\n1.5x+0.5y &amp; \\text{if } 0\\le x,y\\le 1\\\\\n0 &amp; \\text{otherwise}\n\\end{cases}\\]<\/div><\/p>\n<p>Find the probability density function <span class=\"mjx-i\">\\(f(x)\\)<\/span> of <span class=\"mjx-i\">\\(X\\)<\/span> .<\/p>\n<ul>\n<li>\n<p>(i) <span class=\"mjx-i\">\\(f(x)=\\begin{cases}2x &amp; \\text{if } 0\\le x\\le 1\\\\0 &amp; \\text{otherwise}\\end{cases}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(ii) <span class=\"mjx-i\">\\(f(x)=\\begin{cases}0.5x+0.75 &amp; \\text{if } 0\\le x\\le 1\\\\0 &amp; \\text{otherwise}\\end{cases}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iii) <span class=\"mjx-i\">\\(f(x)=\\begin{cases}x+0.5 &amp; \\text{if } 0\\le x\\le 1\\\\0 &amp; \\text{otherwise}\\end{cases}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>(iv) <span class=\"mjx-i\">\\(f(x)=\\begin{cases}1.5x+0.25 &amp; \\text{if } 0\\le x\\le 1\\\\0 &amp; \\text{otherwise}\\end{cases}\\)<\/span><\/p>\n<\/li>\n<li>\n<p>A. (iv)<\/p>\n<\/li>\n<li>\n<p>B. (iii)<\/p>\n<\/li>\n<li>\n<p>C. (i)<\/p>\n<\/li>\n<li>\n<p>D. (ii)<\/p>\n<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q36\"><strong>Câu 3.8<\/strong> <code>[SP26 Q5]<\/code> <code>[SP26 Q6]<\/code>\nConsider the following bivariate distribution <span class=\"mjx-i\">\\(p(x, y)\\)<\/span> of two random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> <span class=\"mjx-i\">\\(p(x, y) = \\begin{cases} 1.5x + 0.5y &amp; \\text{if } 0 \\le x, y \\le 1 \\\\ 0 &amp; \\text{otherwise} \\end{cases}\\)<\/span>\nFind the probability <span class=\"mjx-i\">\\(P(0 &lt; Y &lt; 0.5)\\)<\/span> .<\/p>\n<ul>\n<li>A. 0.8125<\/li>\n<li>B. 0.6125<\/li>\n<li>C. 0.65<\/li>\n<li>D. 0.4375<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q37\"><strong>Câu 3.9<\/strong> <code>[Đề A Q29]<\/code> <code>[SU24-RE Q40]<\/code>\nConsider the following bivariate distribution <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of two random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>\n<div class=\"mjx-d\">\\[p(x,y)=\n\\begin{cases}\nxy, &amp; \\text{if } 0\\le x\\le 2,\\ 0\\le y\\le 1\\\\\n0, &amp; \\text{otherwise}\n\\end{cases}\\]<\/div><\/p>\n<p>The probability <span class=\"mjx-i\">\\(P(0&lt;X\\le 1,\\ 0\\le Y\\le 0.5)\\)<\/span> is<\/p>\n<ul>\n<li>(i) 0.05<\/li>\n<li>(ii) 0.0625<\/li>\n<li>(iii) 0.075<\/li>\n<li>(iv) 0.0825<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q38\"><strong>Câu 3.10<\/strong> <code>[Đề A Q30]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y) = (1/5)(xy + 1)\\)<\/span> with <span class=\"mjx-i\">\\(1 \\le x \\le 2\\)<\/span> , <span class=\"mjx-i\">\\(0 \\le y \\le 2\\)<\/span> be the joint probability function of two continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> . Find the value <span class=\"mjx-i\">\\(P(X \\le 1.5)\\)<\/span> .<\/p>\n<ul>\n<li>A. 23/80<\/li>\n<li>B. 13/20<\/li>\n<li>C. 9/20<\/li>\n<li>D. 7/20<\/li>\n<li>E. 17/80<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q39\"><strong>Câu 3.11<\/strong> <code>[Đề B Q38]<\/code>\nLet <span class=\"mjx-i\">\\(p(x, y) = (1/5)(xy + 1)\\)<\/span> with <span class=\"mjx-i\">\\(1 \\le x \\le 2\\)<\/span> , <span class=\"mjx-i\">\\(0 \\le y \\le 2\\)<\/span> be the joint probability function of two continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> . Find the value <span class=\"mjx-i\">\\(P(X \\le 1.5, Y &gt; 1)\\)<\/span> .<\/p>\n<ul>\n<li>A. 23/80<\/li>\n<li>B. 13/20<\/li>\n<li>C. 9/20<\/li>\n<li>D. 7/20<\/li>\n<li>E. 17/80<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q40\"><strong>Câu 3.12<\/strong> <code>[FA24-FE Q28]<\/code>\nConsider the following bivariate distribution <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of two random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>\n<div class=\"mjx-d\">\\[p(x,y)=\n\\begin{cases}\n\\dfrac{x^2}{36}+\\dfrac{y}{12}, &amp; \\text{if } 0\\le x\\le 3,\\ 0\\le y\\le 2\\\\\n0, &amp; \\text{otherwise}\n\\end{cases}\\]<\/div><\/p>\n<p>The probability <span class=\"mjx-i\">\\(P(0&lt;X&lt;2, 0\\le y\\le 1)\\)<\/span> is<\/p>\n<ul>\n<li>(i) 0.1574<\/li>\n<li>(ii) 0.1038<\/li>\n<li>(iii) 0.293<\/li>\n<li>(iv) 0.226<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q41\"><strong>Câu 3.13<\/strong> <code>[Đề A Q31]<\/code>\nThe bivariate distribution <span class=\"mjx-i\">\\(f(x,y)\\)<\/span> of two discrete random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> given by<\/p>\n<p><div class=\"mjx-d\">\\[f(x,y)=\n\\begin{cases}\n0.5\\sin(x+y), &amp; \\text{if } 0\\le x,y\\le 0.5\\pi\\\\\n0, &amp; \\text{otherwise.}\n\\end{cases}\\]<\/div><\/p>\n<p>Find the probability density function <span class=\"mjx-i\">\\(f_Y(y)\\)<\/span> of <span class=\"mjx-i\">\\(Y\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(f_Y(y)=\\begin{cases} 0.5\\cos(0.5\\pi+y)-0.5\\cos y, &amp; \\text{if } 0\\le y\\le 0.5\\pi\\\\ 0, &amp; \\text{otherwise} \\end{cases}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(f_Y(y)=\\begin{cases} 0.5\\cos y-0.5\\cos(y+0.5\\pi), &amp; \\text{if } 0\\le y\\le 0.5\\pi\\\\ 0, &amp; \\text{otherwise} \\end{cases}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(f_Y(y)=\\begin{cases} \\cos(0.5\\pi+y)-\\cos y, &amp; \\text{if } 0\\le y\\le 0.5\\pi\\\\ 0, &amp; \\text{otherwise} \\end{cases}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(f_Y(y)=\\begin{cases} \\cos y-\\cos(y+0.5\\pi), &amp; \\text{if } 0\\le y\\le 0.5\\pi\\\\ 0, &amp; \\text{otherwise} \\end{cases}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q42\"><strong>Câu 3.14<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y)=cxy\\)<\/span>, where <span class=\"mjx-i\">\\(c\\in\\mathbb{R}\\)<\/span>.<\/p>\n<p>a) Find the number <span class=\"mjx-i\">\\(c\\)<\/span> such that <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> with <span class=\"mjx-i\">\\(0\\le x\\le2\\)<\/span> and <span class=\"mjx-i\">\\(0\\le y\\le2\\)<\/span> satisfies the conditions to be the joint probability function of some continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>.<\/p>\n<p>b) Find the marginal probability distribution <span class=\"mjx-i\">\\(p(x)\\)<\/span> of <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(p(y)\\)<\/span> of <span class=\"mjx-i\">\\(Y\\)<\/span>.<\/p>\n<p>c) Determine the mean of <span class=\"mjx-i\">\\(Y\\)<\/span>. d) Find <span class=\"mjx-i\">\\(P(X&gt;1.0,\\ Y&lt;1.0)\\)<\/span>.<\/p>\n<p class=\"qh\" id=\"MAI391-6-q43\"><strong>Câu 3.15<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nConsider the following bivariate distribution <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of two random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>\n<div class=\"mjx-d\">\\[p(x,y)=\\begin{cases}1.5x+0.5y &amp; \\text{if } 0\\le x,y\\le1\\\\ 0 &amp; \\text{otherwise}\\end{cases}\\]<\/div>\nFind the probability <span class=\"mjx-i\">\\(P(0&lt;x&lt;1/4)\\)<\/span>.<\/p>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-6-h13\">Dạng 4: Kỳ vọng, phương sai, hiệp phương sai<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Find the variance of <span class=\"mjx-i\">\\(X\\)<\/span> / <span class=\"mjx-i\">\\(Y\\)<\/span>\"<\/em>, <em>\"Find the covariance of <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>\"<\/em> (từ bảng, từ công thức rời rạc, hoặc từ mật độ liên tục).<\/p>\n<h3>Công thức<\/h3>\n<p><div class=\"mjx-d\">\\[V(X)=E(X^2)-(EX)^2,\\qquad \\mathrm{Cov}(X,Y)=E(XY)-E(X)E(Y)\\]<\/div><\/p>\n<ul>\n<li>Rời rạc: <span class=\"mjx-i\">\\(E(XY)=\\sum_x\\sum_y xy\\,p(x,y)\\)<\/span>. Liên tục: <span class=\"mjx-i\">\\(E(XY)=\\iint xy\\,p(x,y)\\,dx\\,dy\\)<\/span>.<\/li>\n<li>Độc lập (đặc biệt <span class=\"mjx-i\">\\(p=g(x)h(y)\\)<\/span> trên miền chữ nhật) thì <span class=\"mjx-i\">\\(\\mathrm{Cov}=0\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Lập phân phối biên của <span class=\"mjx-i\">\\(X\\)<\/span> (và <span class=\"mjx-i\">\\(Y\\)<\/span>).<\/li>\n<li>Tính <span class=\"mjx-i\">\\(E(X)\\)<\/span>, <span class=\"mjx-i\">\\(E(X^2)\\)<\/span> (hoặc <span class=\"mjx-i\">\\(E(Y)\\)<\/span>, <span class=\"mjx-i\">\\(E(XY)\\)<\/span>).<\/li>\n<li>Thay vào công thức.<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (bảng).<\/strong><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><span class=\"mjx-i\">\\(X\\backslash Y\\)<\/span><\/th>\n<th>1<\/th>\n<th>2<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>0<\/td>\n<td>0,2<\/td>\n<td>0,1<\/td>\n<\/tr>\n<tr>\n<td>1<\/td>\n<td>0,3<\/td>\n<td>0,4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Find <span class=\"mjx-i\">\\(V(X)\\)<\/span>, <span class=\"mjx-i\">\\(V(Y)\\)<\/span> and <span class=\"mjx-i\">\\(\\mathrm{Cov}(X,Y)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Biên: <span class=\"mjx-i\">\\(P(X=0)=0{,}3\\)<\/span>, <span class=\"mjx-i\">\\(P(X=1)=0{,}7\\)<\/span>; <span class=\"mjx-i\">\\(P(Y=1)=0{,}5\\)<\/span>, <span class=\"mjx-i\">\\(P(Y=2)=0{,}5\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(E(X)=0{,}7\\)<\/span>, <span class=\"mjx-i\">\\(E(X^2)=0{,}7\\)<\/span>, nên <span class=\"mjx-i\">\\(V(X)=0{,}7-0{,}49=0{,}21\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(E(Y)=1{,}5\\)<\/span>, <span class=\"mjx-i\">\\(E(Y^2)=0{,}5+2=2{,}5\\)<\/span>, nên <span class=\"mjx-i\">\\(V(Y)=2{,}5-2{,}25=0{,}25\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(E(XY)=1\\cdot1\\cdot0{,}3+1\\cdot2\\cdot0{,}4=1{,}1\\)<\/span> (hàng <span class=\"mjx-i\">\\(X=0\\)<\/span> đóng góp 0), nên <span class=\"mjx-i\">\\(\\mathrm{Cov}=1{,}1-0{,}7\\cdot1{,}5=0{,}05\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Ví dụ 2 (liên tục).<\/strong> <span class=\"mjx-i\">\\(p(x,y)=x+y\\)<\/span> on <span class=\"mjx-i\">\\([0,1]^2\\)<\/span>. Find <span class=\"mjx-i\">\\(\\mathrm{Cov}(X,Y)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> (xem mục 1.4) <span class=\"mjx-i\">\\(E(X)=E(Y)=\\tfrac7{12}\\)<\/span>, <span class=\"mjx-i\">\\(E(XY)=\\tfrac13\\)<\/span>, nên <span class=\"mjx-i\">\\(\\mathrm{Cov}=\\tfrac13-\\tfrac{49}{144}=-\\tfrac1{144}\\approx-0{,}00694\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (độc lập).<\/strong> <span class=\"mjx-i\">\\(p(x,y)=\\tfrac{xy}{9}\\)<\/span>, <span class=\"mjx-i\">\\(X\\in\\{1,2\\}\\)<\/span>, <span class=\"mjx-i\">\\(Y\\in\\{1,2\\}\\)<\/span>. Find <span class=\"mjx-i\">\\(\\mathrm{Cov}(X,Y)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(p(x,y)=\\tfrac x3\\cdot\\tfrac y3\\)<\/span> (tích của hai biên) trên tập tích, nên <span class=\"mjx-i\">\\(X,Y\\)<\/span> độc lập và <span class=\"mjx-i\">\\(\\mathrm{Cov}=0\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Quên trừ <span class=\"mjx-i\">\\((EX)^2\\)<\/span> khi tính phương sai.<\/li>\n<li>Tính <span class=\"mjx-i\">\\(E(XY)\\)<\/span> bằng <span class=\"mjx-i\">\\(E(X)E(Y)\\)<\/span> khi chưa chắc độc lập.<\/li>\n<li>Kết quả hiệp phương sai rất nhỏ (như <span class=\"mjx-i\">\\(0{,}0017\\)<\/span>): làm tròn sớm sẽ ra sai dấu. Giữ <strong>phân số<\/strong> đến cuối.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(p(x,y)\\)<\/span> <strong>tách được<\/strong> thành <span class=\"mjx-i\">\\(g(x)h(y)\\)<\/span> trên miền chữ nhật/tập tích thì <span class=\"mjx-i\">\\(\\mathrm{Cov}=0\\)<\/span>, không cần tính.<\/li>\n<li><span class=\"mjx-i\">\\(X\\)<\/span> chỉ nhận 2 giá trị <span class=\"mjx-i\">\\(a,b\\)<\/span> với xác suất <span class=\"mjx-i\">\\(q,1-q\\)<\/span>: <span class=\"mjx-i\">\\(V(X)=(b-a)^2q(1-q)\\)<\/span>. Ví dụ 1: <span class=\"mjx-i\">\\(1\\cdot0{,}3\\cdot0{,}7=0{,}21\\)<\/span> ✓.<\/li>\n<\/ul>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(V(X)\\)<\/span> từ bảng: Statistics → 1-Variable, bật Freq; nhập các giá trị <span class=\"mjx-i\">\\(x\\)<\/span> và xác suất biên làm Freq; đọc <span class=\"mjx-i\">\\(\\sigma_x\\)<\/span> rồi bình phương (<code>Ans²<\/code>).<\/li>\n<li><span class=\"mjx-i\">\\(\\mathrm{Cov}\\)<\/span> liên tục: bấm từng tích phân <span class=\"mjx-i\">\\(E(X)=\\int x\\,p(x)dx\\)<\/span>, <span class=\"mjx-i\">\\(E(Y)\\)<\/span>, <span class=\"mjx-i\">\\(E(XY)\\)<\/span> (tách thành tổng các tích phân 1 lớp), lưu vào A, B, C (<code>STO<\/code>), rồi gõ <code>C-AB<\/code>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">4 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-6-q44\"><strong>Câu 4.1<\/strong> <code>[FA24-RE Q32]<\/code>\nConsider the following bivariate distribution <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of two discrete random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span>.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><span class=\"mjx-i\">\\(X\\backslash Y\\)<\/span><\/th>\n<th>1<\/th>\n<th>2<\/th>\n<th>3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>0.17<\/td>\n<td>0.13<\/td>\n<td>0.25<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>0.1<\/td>\n<td>0.3<\/td>\n<td>0.05<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Find the variance of <span class=\"mjx-i\">\\(Y\\)<\/span>.<\/p>\n<ul>\n<li>A. 0.27<\/li>\n<li>B. 0.37<\/li>\n<li>C. 0.47<\/li>\n<li>D. 0.57<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q45\"><strong>Câu 4.2<\/strong> <code>[SU24-RE Q27]<\/code> <code>[SP26 Q38]<\/code>\nConsider the following bivariate distribution <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of two discrete random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span><\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th><span class=\"mjx-i\">\\(X\\backslash Y\\)<\/span><\/th>\n<th>1<\/th>\n<th>2<\/th>\n<th>3<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>0.17<\/td>\n<td>0.13<\/td>\n<td>0.25<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>0.1<\/td>\n<td>0.3<\/td>\n<td>0.05<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Find the variance of <span class=\"mjx-i\">\\(X\\)<\/span>.<\/p>\n<ul>\n<li>A. 0.1<\/li>\n<li>B. 0.1125<\/li>\n<li>C. 0.2<\/li>\n<li>D. 0.2475<\/li>\n<li>E. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q46\"><strong>Câu 4.3<\/strong> <code>[FA24-RE Q31]<\/code> <code>[Đề A Q40]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y) = (1/2)(y-x)\\)<\/span> with <span class=\"mjx-i\">\\(0 \\le x \\le 1\\)<\/span> , <span class=\"mjx-i\">\\(2 \\le y \\le 3\\)<\/span> be the joint probability function of some continuous random variables <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> . Given the following marginal probability functions of <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> . <span class=\"mjx-i\">\\(p(x) = (5/4)-(1/2)x,\\quad 0 \\le x \\le 1\\)<\/span> <span class=\"mjx-i\">\\(p(y) = (1/2)y-(1/4),\\quad 2 \\le y \\le 3\\)<\/span>\nFind the covariance of <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> .<\/p>\n<ul>\n<li>A. 0.0017<\/li>\n<li>B. -0.0017<\/li>\n<li>C. 0.00694<\/li>\n<li>D. -0.00694<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q47\"><strong>Câu 4.4<\/strong> <code>[Đề B Q30]<\/code>\nLet <span class=\"mjx-i\">\\(p(x,y)=\\frac{1}{30}x^2y\\)<\/span> be the joint probability function of some discrete random variables <span class=\"mjx-i\">\\(X={0, 1, 2}\\)<\/span> and <span class=\"mjx-i\">\\(Y={1, 2, 3}\\)<\/span> . Find the covariance of <span class=\"mjx-i\">\\(X\\)<\/span> and <span class=\"mjx-i\">\\(Y\\)<\/span> .<\/p>\n<ul>\n<li>A. 0<\/li>\n<li>B. <span class=\"mjx-i\">\\(\\frac{1}{15}\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(\\frac{1}{5}\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(\\frac{1}{3}\\)<\/span><\/li>\n<\/ul>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-6-h14\">Dạng 5: Ma trận hiệp phương sai mẫu (empirical covariance)<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><em>\"Given a dataset consisting of the following vectors <span class=\"mjx-i\">\\(x_1,x_2,x_3\\)<\/span>. Let <span class=\"mjx-i\">\\(S=[s_{ij}]\\)<\/span> be the covariance matrix of this dataset. Find <span class=\"mjx-i\">\\(s_{ij}\\)<\/span>.\"<\/em><\/p>\n<h3>Công thức (theo slide, chia <span class=\"mjx-i\">\\(N\\)<\/span>)<\/h3>\n<p><div class=\"mjx-d\">\\[\\bar x=\\frac1N\\sum x_n,\\qquad S=\\frac1N\\sum_{n=1}^N(x_n-\\bar x)(x_n-\\bar x)^\\top,\\qquad \\boxed{s_{ij}=\\frac1N\\sum_n(x_{n,i}-\\bar x_i)(x_{n,j}-\\bar x_j)}\\]<\/div><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(s_{ii}\\)<\/span>: phương sai của <strong>tọa độ thứ <span class=\"mjx-i\">\\(i\\)<\/span><\/strong>; <span class=\"mjx-i\">\\(s_{ij}=s_{ji}\\)<\/span>.<\/li>\n<\/ul>\n<h3>Cách làm<\/h3>\n<ol>\n<li>Lấy riêng <strong>tọa độ <span class=\"mjx-i\">\\(i\\)<\/span><\/strong> của 3 vector (và tọa độ <span class=\"mjx-i\">\\(j\\)<\/span> nếu cần).<\/li>\n<li>Tính trung bình, trừ để được độ lệch.<\/li>\n<li><span class=\"mjx-i\">\\(s_{ij}=\\tfrac13\\sum\\)<\/span>(độ lệch <span class=\"mjx-i\">\\(i\\)<\/span>)<span class=\"mjx-i\">\\(\\times\\)<\/span>(độ lệch <span class=\"mjx-i\">\\(j\\)<\/span>).<\/li>\n<\/ol>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ.<\/strong> <span class=\"mjx-i\">\\(x_1=[1\\ 2\\ 0]^T\\)<\/span>, <span class=\"mjx-i\">\\(x_2=[3\\ 0\\ 1]^T\\)<\/span>, <span class=\"mjx-i\">\\(x_3=[2\\ 1\\ 2]^T\\)<\/span>. Find <span class=\"mjx-i\">\\(s_{11}\\)<\/span>, <span class=\"mjx-i\">\\(s_{12}\\)<\/span>, <span class=\"mjx-i\">\\(s_{13}\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong><\/p>\n<ul>\n<li>Tọa độ 1: <span class=\"mjx-i\">\\((1,3,2)\\)<\/span>, trung bình <span class=\"mjx-i\">\\(2\\)<\/span>, độ lệch <span class=\"mjx-i\">\\((-1,1,0)\\)<\/span>.<\/li>\n<li>Tọa độ 2: <span class=\"mjx-i\">\\((2,0,1)\\)<\/span>, trung bình <span class=\"mjx-i\">\\(1\\)<\/span>, độ lệch <span class=\"mjx-i\">\\((1,-1,0)\\)<\/span>.<\/li>\n<li>Tọa độ 3: <span class=\"mjx-i\">\\((0,1,2)\\)<\/span>, trung bình <span class=\"mjx-i\">\\(1\\)<\/span>, độ lệch <span class=\"mjx-i\">\\((-1,0,1)\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(s_{11}=\\tfrac{1+1+0}{3}=\\tfrac23\\)<\/span>; <span class=\"mjx-i\">\\(s_{12}=\\tfrac{(-1)(1)+(1)(-1)+0}{3}=-\\tfrac23\\)<\/span>; <span class=\"mjx-i\">\\(s_{13}=\\tfrac{(-1)(-1)+0+0}{3}=\\tfrac13\\)<\/span>.<\/li>\n<\/ul>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Chia cho <span class=\"mjx-i\">\\(N-1=2\\)<\/span> (đáp án nhiễu thường có cả hai kết quả, ví dụ <span class=\"mjx-i\">\\(\\tfrac23\\)<\/span> và <span class=\"mjx-i\">\\(1\\)<\/span>).<\/li>\n<li>Lấy nhầm <strong>vector<\/strong> thứ <span class=\"mjx-i\">\\(i\\)<\/span> thay vì <strong>tọa độ<\/strong> thứ <span class=\"mjx-i\">\\(i\\)<\/span>.<\/li>\n<li>Quên trừ trung bình.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh<\/strong><\/p>\n<ul>\n<li>Chỉ cần <strong>2 tọa độ<\/strong> (hoặc 1 với <span class=\"mjx-i\">\\(s_{ii}\\)<\/span>) trong số 9 số. Đừng tính cả ma trận.<\/li>\n<li><strong>Cách khác<\/strong> không cần trừ trung bình: <span class=\"mjx-i\">\\(s_{ij}=\\overline{x_ix_j}-\\bar x_i\\bar x_j\\)<\/span> (trung bình của tích trừ tích trung bình).<\/li>\n<li><span class=\"mjx-i\">\\(s_{ii}\\ge0\\)<\/span> luôn, nên loại ngay đáp án âm cho <span class=\"mjx-i\">\\(s_{11}\\)<\/span>, <span class=\"mjx-i\">\\(s_{22}\\)<\/span>.<\/li>\n<\/ul>\n<p><strong>Bấm máy (Statistics, <span class=\"mjx-i\">\\(y=a+bx\\)<\/span>)<\/strong><\/p>\n<ul>\n<li>Nhập tọa độ <span class=\"mjx-i\">\\(i\\)<\/span> vào cột X, tọa độ <span class=\"mjx-i\">\\(j\\)<\/span> vào cột Y (3 dòng).<\/li>\n<li><code>OPTN<\/code> → 2-Variable Results: lấy <span class=\"mjx-i\">\\(\\sigma_x^2\\)<\/span> cho <span class=\"mjx-i\">\\(s_{ii}\\)<\/span>; với <span class=\"mjx-i\">\\(s_{ij}\\)<\/span> dùng <span class=\"mjx-i\">\\(\\tfrac{\\sum xy}{3}-\\bar x\\bar y\\)<\/span>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">7 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-6-q48\"><strong>Câu 5.1<\/strong> <code>[SP26 Q5]<\/code> <code>[SP26 Q33]<\/code>\nGiven a dataset consisting of the following vectors <span class=\"mjx-i\">\\(\\mathbf{x}_1 = [1 \\quad 0 \\quad 2]^\\mathrm{T}\\)<\/span> , <span class=\"mjx-i\">\\(\\mathbf{x}_2 = [0 \\quad 2 \\quad -1]^\\mathrm{T}\\)<\/span> , <span class=\"mjx-i\">\\(\\mathbf{x}_3 = [2 \\quad -2 \\quad 2]^\\mathrm{T}\\)<\/span> .\nLet <span class=\"mjx-i\">\\(\\mathrm{S} = [\\mathrm{s}_{ij}]\\)<\/span> be the covariance matrix of this dataset. Find <span class=\"mjx-i\">\\(\\mathrm{s}_{11}\\)<\/span>.<\/p>\n<ul>\n<li>A. 8/3<\/li>\n<li>B. 1<\/li>\n<li>C. 2/3<\/li>\n<li>D. -4/3<\/li>\n<li>E. -2<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q49\"><strong>Câu 5.2<\/strong> <code>[Đề A Q32]<\/code>\nGiven a dataset consisting of the following vectors <span class=\"mjx-i\">\\(X_1 = [0\\ 2\\ 2]^{\\mathrm{T}},\\quad X_2 = [1\\ 0\\ 2]^{\\mathrm{T}},\\quad X_3 = [2\\ -2\\ -1]^{\\mathrm{T}}.\\)<\/span> Let <span class=\"mjx-i\">\\(S = [s_{ij}]\\)<\/span> be the covariance matrix of this dataset. Find <span class=\"mjx-i\">\\(s_{21}\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(2/3\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(-4/3\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(8/3\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(2\\)<\/span><\/li>\n<li>E. <span class=\"mjx-i\">\\(-1\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q50\"><strong>Câu 5.3<\/strong> <code>[SP25-RE Q29]<\/code>\nGiven a dataset consisting of the following vectors <span class=\"mjx-i\">\\(x_1 = [0\\ 2\\ 2]^T\\)<\/span> , <span class=\"mjx-i\">\\(x_2 = [1\\ 0\\ 2]^T\\)<\/span> , <span class=\"mjx-i\">\\(x_3 = [2\\ -2\\ -1]^T\\)<\/span> .\nLet <span class=\"mjx-i\">\\(S = [s_{ij}]\\)<\/span> be the covariance matrix of this dataset. Find <span class=\"mjx-i\">\\(s_{22}\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(-1\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(-4/3\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(8/3\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(2/3\\)<\/span><\/li>\n<li>E. <span class=\"mjx-i\">\\(2\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q51\"><strong>Câu 5.4<\/strong> <code>[SU24-RE Q28]<\/code> <code>[FA24-FE Q33]<\/code>\nGiven a dataset consisting of the following vectors <span class=\"mjx-i\">\\(x_1 = [1\\ 0\\ 2]^T\\)<\/span> , <span class=\"mjx-i\">\\(x_2 = [2\\ -2\\ 2]^T\\)<\/span> , <span class=\"mjx-i\">\\(x_3 = [0\\ 2\\ -1]^T\\)<\/span> .\nLet <span class=\"mjx-i\">\\(S = [s_{ij}]\\)<\/span> be the covariance matrix of this dataset. Find <span class=\"mjx-i\">\\(s_{13}\\)<\/span> .<\/p>\n<ul>\n<li>A. <span class=\"mjx-i\">\\(2/3\\)<\/span><\/li>\n<li>B. <span class=\"mjx-i\">\\(-4/3\\)<\/span><\/li>\n<li>C. <span class=\"mjx-i\">\\(8/3\\)<\/span><\/li>\n<li>D. <span class=\"mjx-i\">\\(2\\)<\/span><\/li>\n<li>E. <span class=\"mjx-i\">\\(1\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q52\"><strong>Câu 5.5<\/strong> <code>[SP26 Q9]<\/code>\nGiven a dataset consisting of the following vectors <span class=\"mjx-i\">\\(\\text{x}_1 = [0 \\ \\ 2 \\ \\ 2]^\\text{T}, \\quad \\text{x}_2 = [1 \\ \\ 0 \\ \\ 2]^\\text{T}, \\quad \\text{x}_3 = [2 \\ \\ -2 \\ \\ -1]^\\text{T}\\)<\/span> .\nLet <span class=\"mjx-i\">\\(\\text{S} = [\\text{s}_{ij}]\\)<\/span> be the covariance matrix of this dataset. Find <span class=\"mjx-i\">\\(\\text{s}_{13}\\)<\/span>.<\/p>\n<ul>\n<li>A. 2/3<\/li>\n<li>B. 2<\/li>\n<li>C. 8/3<\/li>\n<li>D. -4/3<\/li>\n<li>E. -1<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q53\"><strong>Câu 5.6<\/strong> <code>[SP26 Q20]<\/code>\nGiven a dataset consisting of the following vectors <span class=\"mjx-i\">\\(x_1 = [0 \\quad 2 \\quad 2]^T\\)<\/span> , <span class=\"mjx-i\">\\(x_2 = [1 \\quad 0 \\quad 2]^T\\)<\/span> , <span class=\"mjx-i\">\\(x_3 = [2 \\quad -2 \\quad -1]^T\\)<\/span> .\nLet <span class=\"mjx-i\">\\(S = [s_{ij}]\\)<\/span> be the covariance matrix of this dataset. Find <span class=\"mjx-i\">\\(s_{11}\\)<\/span> .<\/p>\n<ul>\n<li>A. 2/3<\/li>\n<li>B. 2<\/li>\n<li>C. -4/3<\/li>\n<li>D. -1<\/li>\n<li>E. 8/3<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q54\"><strong>Câu 5.7<\/strong> <code>[Đề C (ảnh, tự luận)]<\/code>\nGiven the data set consisting of the following two vectors\n<div class=\"mjx-d\">\\[x_1=[2,\\ -2]^T,\\qquad x_2=[0,\\ 2]^T.\\]<\/div>\nFind the covariance matrix of this data set.<\/p>\n<hr/>\n<\/div><\/details><h2 id=\"MAI391-6-h15\">Dạng 6: Phân phối Gauss<\/h2>\n<h3>Cách nhận biết<\/h3>\n<p><span class=\"mjx-i\">\\(\\mathcal{N}(\\mu,\\Sigma)\\)<\/span>, <em>\"normal distribution\"<\/em>, <em>\"bivariate Gaussian\"<\/em>; hỏi công thức mật độ, phân phối biên (\"distribution of <span class=\"mjx-i\">\\(Y\\)<\/span>\", \"mean of <span class=\"mjx-i\">\\(Y\\)<\/span>\"), có điều kiện (<span class=\"mjx-i\">\\(p(x\\mid y=2)\\)<\/span>), <span class=\"mjx-i\">\\(E\\)<\/span> của biến đổi tuyến tính, hỗn hợp, hoặc <span class=\"mjx-i\">\\(P(a&lt;Y&lt;b)\\)<\/span> với <span class=\"mjx-i\">\\(\\Phi\\)<\/span> cho sẵn.<\/p>\n<h3>Công thức<\/h3>\n<ul>\n<li><span class=\"mjx-i\">\\(\\Sigma=\\mathrm{diag}(\\sigma_1^2,\\sigma_2^2)\\)<\/span>: <span class=\"mjx-i\">\\(p(x,y)=\\dfrac{1}{2\\pi\\sigma_1\\sigma_2}e^{-\\frac{(x-\\mu_1)^2}{2\\sigma_1^2}-\\frac{(y-\\mu_2)^2}{2\\sigma_2^2}}\\)<\/span>.<\/li>\n<li>Biên: <span class=\"mjx-i\">\\(X\\sim\\mathcal{N}(\\mu_x,\\Sigma_{xx})\\)<\/span> (đọc trực tiếp).<\/li>\n<li>Có điều kiện: <span class=\"mjx-i\">\\(\\mu_{x|y}=\\mu_x+\\dfrac{\\Sigma_{xy}}{\\Sigma_{yy}}(y-\\mu_y)\\)<\/span>, <span class=\"mjx-i\">\\(\\ \\sigma^2_{x|y}=\\Sigma_{xx}-\\dfrac{\\Sigma_{xy}^2}{\\Sigma_{yy}}\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(Y=AX\\)<\/span>: <span class=\"mjx-i\">\\(E(Y)=A\\mu\\)<\/span>, <span class=\"mjx-i\">\\(V(Y)=A\\Sigma A^\\top\\)<\/span>. Hỗn hợp: <span class=\"mjx-i\">\\(E=\\sum\\pi_k\\mu_k\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(P(a&lt;Y&lt;b)=\\Phi\\big(\\tfrac{b-\\mu}{\\sigma}\\big)-\\Phi\\big(\\tfrac{a-\\mu}{\\sigma}\\big)\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma=\\sqrt{\\Sigma_{yy}}\\)<\/span>.<\/li>\n<\/ul>\n<div class=\"co co-ex\"><h3 class=\"h-ex\">Ví dụ mẫu<\/h3>\n<p><strong>Ví dụ 1 (mật độ).<\/strong> <span class=\"mjx-i\">\\(W=[X\\ Y]^T\\sim\\mathcal{N}(\\mu,\\Sigma)\\)<\/span> with <span class=\"mjx-i\">\\(\\mu=[2\\ -1]^T\\)<\/span>, <span class=\"mjx-i\">\\(\\Sigma=\\mathrm{diag}(4,1)\\)<\/span>. Find <span class=\"mjx-i\">\\(p(x,y)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\sigma_1=2\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma_2=1\\)<\/span>, <span class=\"mjx-i\">\\(\\sqrt{\\det\\Sigma}=2\\)<\/span>:\n<div class=\"mjx-d\">\\[p(x,y)=\\frac{1}{2\\pi\\cdot2}\\exp\\Big(-\\frac{(x-2)^2}{8}-\\frac{(y+1)^2}{2}\\Big).\\]<\/div><\/p>\n<p><strong>Ví dụ 2 (biên).<\/strong> <span class=\"mjx-i\">\\(p(x,y)=\\mathcal{N}\\Big(\\begin{bmatrix}1\\\\-2\\end{bmatrix},\\begin{bmatrix}3&amp;1\\\\1&amp;2\\end{bmatrix}\\Big)\\)<\/span>. Distribution of <span class=\"mjx-i\">\\(Y\\)<\/span>?<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(Y\\sim\\mathcal{N}(-2,\\ 2)\\)<\/span>: trung bình là phần tử thứ 2 của <span class=\"mjx-i\">\\(\\mu\\)<\/span>, phương sai là phần tử <span class=\"mjx-i\">\\((2,2)\\)<\/span> của <span class=\"mjx-i\">\\(\\Sigma\\)<\/span>.<\/p>\n<p><strong>Ví dụ 3 (có điều kiện).<\/strong> <span class=\"mjx-i\">\\(p(x,y)=\\mathcal{N}\\Big(\\begin{bmatrix}0\\\\1\\end{bmatrix},\\begin{bmatrix}2&amp;0{,}5\\\\0{,}5&amp;1\\end{bmatrix}\\Big)\\)<\/span>. Find <span class=\"mjx-i\">\\(p(x\\mid y=3)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\mu_{x|y}=0+\\tfrac{0{,}5}{1}(3-1)=1\\)<\/span>; <span class=\"mjx-i\">\\(\\sigma^2_{x|y}=2-\\tfrac{0{,}25}{1}=1{,}75\\)<\/span>. Vậy <span class=\"mjx-i\">\\(p(x\\mid y=3)=\\mathcal{N}(1,\\ 1{,}75)\\)<\/span>.<\/p>\n<p><strong>Ví dụ 4 (biến đổi tuyến tính).<\/strong> <span class=\"mjx-i\">\\(X\\sim\\mathcal{N}\\Big(\\begin{bmatrix}1\\\\0\\end{bmatrix},\\mathrm{diag}(1,2)\\Big)\\)<\/span>, <span class=\"mjx-i\">\\(Y=\\begin{bmatrix}2&amp;1\\\\0&amp;-1\\end{bmatrix}X\\)<\/span>. Find <span class=\"mjx-i\">\\(E(Y)\\)<\/span> and <span class=\"mjx-i\">\\(V(Y)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(E(Y)=A\\mu=(2,0)^\\top\\)<\/span>; <span class=\"mjx-i\">\\(V(Y)=A\\Sigma A^\\top=\\begin{bmatrix}6&amp;-2\\\\-2&amp;2\\end{bmatrix}\\)<\/span>.<\/p>\n<p><strong>Ví dụ 5 (hỗn hợp).<\/strong> <span class=\"mjx-i\">\\(p=0{,}3\\,\\mathcal{N}\\big((2,1),I\\big)+0{,}7\\,\\mathcal{N}\\big((0,-1),\\Sigma\\big)\\)<\/span>. Find <span class=\"mjx-i\">\\(E(X-2Y)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(E[(X,Y)]=0{,}3(2,1)+0{,}7(0,-1)=(0{,}6,\\ -0{,}4)\\)<\/span>, nên <span class=\"mjx-i\">\\(E(X-2Y)=0{,}6+0{,}8=1{,}4\\)<\/span>.<\/p>\n<p><strong>Ví dụ 6 (xác suất).<\/strong> <span class=\"mjx-i\">\\(Y\\sim\\mathcal{N}(1,4)\\)<\/span>, <span class=\"mjx-i\">\\(\\Phi(1)=0{,}841\\)<\/span>. Find <span class=\"mjx-i\">\\(P(1&lt;Y&lt;3)\\)<\/span>.<\/p>\n<p><strong>Giải:<\/strong> <span class=\"mjx-i\">\\(\\sigma=2\\)<\/span>; <span class=\"mjx-i\">\\(P=\\Phi\\big(\\tfrac{3-1}{2}\\big)-\\Phi(0)=0{,}841-0{,}5=0{,}341\\)<\/span>.<\/p>\n<\/div><div class=\"co co-err\"><h3 class=\"h-err\">Lỗi thường gặp<\/h3>\n<ul>\n<li>Coi số trong <span class=\"mjx-i\">\\(\\Sigma\\)<\/span> là độ lệch chuẩn (quên lấy căn khi chuẩn hóa).<\/li>\n<li>Mật độ chéo: viết <span class=\"mjx-i\">\\(\\tfrac{(x-\\mu)^2}{\\sigma^2}\\)<\/span> thay vì <span class=\"mjx-i\">\\(\\tfrac{(x-\\mu)^2}{2\\sigma^2}\\)<\/span>; nhầm vị trí <span class=\"mjx-i\">\\(\\mu\\)<\/span> của <span class=\"mjx-i\">\\(x\\)<\/span> và <span class=\"mjx-i\">\\(y\\)<\/span>.<\/li>\n<li>Có điều kiện: quên trừ <span class=\"mjx-i\">\\(\\mu_y\\)<\/span>, hoặc lấy <span class=\"mjx-i\">\\(\\Sigma_{xx}\\)<\/span> làm mẫu số.<\/li>\n<\/ul>\n<\/div><div class=\"co co-tip\"><h3 class=\"h-tip\">Mẹo nhanh · Thử đáp án · Cách khác · Bấm máy Casio fx-580VN X<\/h3>\n<p><strong>Mẹo nhanh (câu chọn mật độ)<\/strong><\/p>\n<ol>\n<li>Nhìn <strong><span class=\"mjx-i\">\\((x-\\mu_1)\\)<\/span> và <span class=\"mjx-i\">\\((y-\\mu_2)\\)<\/span><\/strong>: loại các đáp án lệch tâm (ví dụ <span class=\"mjx-i\">\\(\\mu=(1,0)\\)<\/span> thì phải có <span class=\"mjx-i\">\\((x-1)^2\\)<\/span> và <span class=\"mjx-i\">\\(y^2\\)<\/span>).<\/li>\n<li>Nhìn <strong>mẫu số trong mũ<\/strong>: dưới <span class=\"mjx-i\">\\((x-\\mu_1)^2\\)<\/span> phải là <span class=\"mjx-i\">\\(2\\Sigma_{11}\\)<\/span>, dưới <span class=\"mjx-i\">\\((y-\\mu_2)^2\\)<\/span> phải là <span class=\"mjx-i\">\\(2\\Sigma_{22}\\)<\/span>.\nHai bước này chỉ để lại một đáp án; hệ số trước <span class=\"mjx-i\">\\(e\\)<\/span> thường giống nhau ở mọi đáp án.<\/li>\n<\/ol>\n<p><strong>Mẹo nhanh (khác)<\/strong><\/p>\n<ul>\n<li>Câu \"mean of <span class=\"mjx-i\">\\(Y\\)<\/span>\": đọc thành phần thứ 2 của <span class=\"mjx-i\">\\(\\mu\\)<\/span>; đừng nhìn <span class=\"mjx-i\">\\(\\Sigma\\)<\/span>.<\/li>\n<li>Câu có điều kiện: tính trung bình trước (loại 2 đáp án), rồi phương sai.<\/li>\n<li>Hỗn hợp có trọng số <strong>không<\/strong> cộng bằng 1 (đề đôi khi như vậy): vẫn tính <span class=\"mjx-i\">\\(\\sum\\pi_k\\mu_k\\)<\/span> đúng như công thức.<\/li>\n<\/ul>\n<p><strong>Bấm máy<\/strong><\/p>\n<ul>\n<li><span class=\"mjx-i\">\\(\\Phi\\)<\/span> / xác suất chuẩn: <code>MENU<\/code> → Distribution → Normal CD → Lower <span class=\"mjx-i\">\\(=a\\)<\/span>, Upper <span class=\"mjx-i\">\\(=b\\)<\/span>, <span class=\"mjx-i\">\\(\\sigma\\)<\/span>, <span class=\"mjx-i\">\\(\\mu\\)<\/span>.<\/li>\n<li><span class=\"mjx-i\">\\(A\\Sigma A^\\top\\)<\/span>: Matrix mode <code>MatA×MatB×Trn(MatA)<\/code>.<\/li>\n<\/ul>\n<\/div><details class=\"bank\"><summary><span>Câu đề thật<\/span><span class=\"cnt\">11 câu<\/span><\/summary><div class=\"bank-body\">\n<p class=\"qh\" id=\"MAI391-6-q55\"><strong>Câu 6.1<\/strong> <code>[FA24-RE Q33]<\/code> <code>[SP26 Q19]<\/code> <code>[SP26 Q34]<\/code>\nLet <span class=\"mjx-i\">\\(W = [X\\ Y]^{\\mathrm{T}}\\)<\/span> be a 2-dimensional random variable with normal distribution <span class=\"mjx-i\">\\(W = N(\\mu,\\Sigma)\\)<\/span> , in which <span class=\"mjx-i\">\\(\\mu = [1\\ 0]^{\\mathrm{T}},\\quad \\Sigma = \\begin{bmatrix}1 &amp; 0\\\\0 &amp; 2\\end{bmatrix}.\\)<\/span> Find the formula for the probability density function <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of <span class=\"mjx-i\">\\(W\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(p(x,y)=\\dfrac{1}{2\\pi\\sqrt{2}}e^{-\\frac{(x-1)^2}{2}-\\frac{y^2}{4}}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(p(x,y)=\\dfrac{1}{2\\pi\\sqrt{2}}e^{-\\frac{(x-1)^2}{4}-\\frac{y^2}{2}}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(p(x,y)=\\dfrac{1}{2\\pi\\sqrt{2}}e^{-\\frac{x^2}{2}-\\frac{(y-1)^2}{2}}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(p(x,y)=\\dfrac{1}{2\\pi\\sqrt{2}}e^{-\\frac{x^2}{2}-\\frac{(y-1)^2}{4}}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q56\"><strong>Câu 6.2<\/strong> <code>[SP25-RE Q30]<\/code>\nLet <span class=\"mjx-i\">\\(W=[X\\ Y]^T\\)<\/span> be a 2-dimensional random variable with normal distribution <span class=\"mjx-i\">\\(W=N(\\mu,\\Sigma)\\)<\/span> , in which <span class=\"mjx-i\">\\(\\mu=[0\\ 1]^T,\\quad \\Sigma=\\begin{bmatrix}2 &amp; 0\\\\0 &amp; 1\\end{bmatrix}.\\)<\/span> Find the formula for the probability density function <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of <span class=\"mjx-i\">\\(W\\)<\/span> .<\/p>\n<ul>\n<li>A. (iii) <span class=\"mjx-i\">\\(p(x,y)=\\frac{1}{2\\pi\\sqrt{2}}e^{-\\frac{x^2}{4}-\\frac{(y-1)^2}{2}}\\)<\/span><\/li>\n<li>B. (ii) <span class=\"mjx-i\">\\(p(x,y)=\\frac{1}{2\\pi\\sqrt{2}}e^{-\\frac{(x-1)^2}{4}-\\frac{y^2}{2}}\\)<\/span><\/li>\n<li>C. (i) <span class=\"mjx-i\">\\(p(x,y)=\\frac{1}{2\\pi\\sqrt{2}}e^{-\\frac{(x-1)^2}{2}-\\frac{y^2}{4}}\\)<\/span><\/li>\n<li>D. (iv) <span class=\"mjx-i\">\\(p(x,y)=\\frac{1}{2\\pi\\sqrt{2}}e^{-\\frac{x^2}{2}-\\frac{(y-1)^2}{4}}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q57\"><strong>Câu 6.3<\/strong> <code>[SU24-RE Q29]<\/code>\nLet <span class=\"mjx-i\">\\(W = [X\\ Y]^T\\)<\/span> be a 2-dimensional random variable with normal distribution <span class=\"mjx-i\">\\(W = N(\\mu,\\Sigma)\\)<\/span> , in which <span class=\"mjx-i\">\\(\\mu = [1\\ 0]^T,\\ \\Sigma = \\begin{bmatrix}2 &amp; 0\\\\0 &amp; 1\\end{bmatrix}\\)<\/span> .\nFind the formula for the probability density function <span class=\"mjx-i\">\\(p(x,y)\\)<\/span> of <span class=\"mjx-i\">\\(W\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(p(x,y) = \\frac{1}{2\\pi\\sqrt{2}}e^{-\\frac{(x-1)^2}{2}-\\frac{y^2}{4}}\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(p(x,y) = \\frac{1}{2\\pi\\sqrt{2}}e^{-\\frac{(x-1)^2}{4}-\\frac{y^2}{2}}\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(p(x,y) = \\frac{1}{2\\pi\\sqrt{2}}e^{-\\frac{x^2}{4}-\\frac{(y-1)^2}{2}}\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(p(x,y) = \\frac{1}{2\\pi\\sqrt{2}}e^{-\\frac{x^2}{2}-\\frac{(y-1)^2}{4}}\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q58\"><strong>Câu 6.4<\/strong> <code>[Đề A Q33]<\/code>\nConsider the bivariate Gaussian distribution <span class=\"mjx-i\">\\(p(x,y)=\\mathcal{N}\\left(\\begin{bmatrix}-1\\\\4\\end{bmatrix},\\begin{bmatrix}3&amp;-1\\\\-1&amp;6\\end{bmatrix}\\right).\\)<\/span> The mean of <span class=\"mjx-i\">\\(Y\\)<\/span> is<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(-1\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(4\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(3\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(6\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q59\"><strong>Câu 6.5<\/strong> <code>[SP26 Q19]<\/code>\nConsider the bivariate Gaussian distribution <span class=\"mjx-i\">\\(p(x, y) = \\mathcal{N}\\left(\\begin{bmatrix} 1 \\\\ 3 \\end{bmatrix}, \\begin{bmatrix} 2 &amp; -1 \\\\ -1 &amp; 0.8 \\end{bmatrix}\\right).\\)<\/span> What is the distribution of <span class=\"mjx-i\">\\(Y\\)<\/span> ?<\/p>\n<ul>\n<li>A. Y has a Gaussian distribution with mean 3 and variance 0.64<\/li>\n<li>B. Y has a Gaussian distribution with mean 3 and variance 0.8<\/li>\n<li>C. Y has a Gaussian distribution with mean 1 and variance 2<\/li>\n<li>D. Y has a Gaussian distribution with mean 1 and variance 4<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q60\"><strong>Câu 6.6<\/strong> <code>[Đề B Q31]<\/code>\nConsider the bivariate Gaussian distribution <span class=\"mjx-i\">\\(p(x,y)=\\mathcal{N}\\left(\\begin{bmatrix}0\\\\3\\end{bmatrix},\\begin{bmatrix}0.5 &amp; 0.3\\\\0.3 &amp; 1\\end{bmatrix}\\right).\\)<\/span> Find <span class=\"mjx-i\">\\(p(x\\mid y=2)\\)<\/span> .<\/p>\n<ul>\n<li>(i) <span class=\"mjx-i\">\\(\\mathcal{N}(0.3, 0.7)\\)<\/span><\/li>\n<li>(ii) <span class=\"mjx-i\">\\(\\mathcal{N}(0.3, 0.41)\\)<\/span><\/li>\n<li>(iii) <span class=\"mjx-i\">\\(\\mathcal{N}(-0.3, 0.7)\\)<\/span><\/li>\n<li>(iv) <span class=\"mjx-i\">\\(\\mathcal{N}(-0.3, 0.41)\\)<\/span><\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q61\"><strong>Câu 6.7<\/strong> <code>[SP26 Q25]<\/code>\nConsider the bivariate Gaussian distribution <span class=\"mjx-i\">\\(p(x,y) = \\mathcal{N}\\left( \\begin{bmatrix} -1 \\\\ 2 \\end{bmatrix}, \\begin{bmatrix} 0.5 &amp; 0.3 \\\\ 0.3 &amp; 1 \\end{bmatrix} \\right).\\)<\/span> Find the probability <span class=\"mjx-i\">\\(P(2 &lt; Y &lt; 3)\\)<\/span> given that <span class=\"mjx-i\">\\(\\Phi(1) = 0.841\\)<\/span> .<\/p>\n<ul>\n<li>A. 0.2<\/li>\n<li>B. 0.341<\/li>\n<li>C. 0.5<\/li>\n<li>D. 0.841<\/li>\n<li>E. None of the other choices is correct<\/li>\n<\/ul>\n<p class=\"qh\" id=\"MAI391-6-q62\"><strong>Câu 6.8<\/strong> <code>[FA24-FE Q34]<\/code>\nConsider the bivariat
