<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ôn thi nói JPD123</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: left rail (desktop) / bottom bar (phone) + one working column. Indigo (藍) primary, vermilion (朱) accent, cool paper neutrals. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#eef1f6; --ink:#17233a; --muted:#64708a; --line:#dde3ec;
  --primary:#1f3c68; --primary-ink:#ffffff; --accent:#d4452b; --accent-soft:#fdeae6; --soft:#e8eef8;
  --ok:#1f8a5b; --ok-soft:#e3f4ec; --warn:#b7791f; --warn-soft:#fff4dc;
  --display:'Zen Kaku Gothic New','Be Vietnam Pro',system-ui,sans-serif; --body:'Be Vietnam Pro',system-ui,sans-serif; --jp:'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1522; --surface:#172033; --sunk:#121a2a; --ink:#e7ecf5; --muted:#97a3bb; --line:#26314a;
  --primary:#7fa6e6; --primary-ink:#0f1522; --accent:#ff7a5e; --accent-soft:#3a201c; --soft:#1d2a44;
  --ok:#5cc996; --ok-soft:#173326; --warn:#f0b65a; --warn-soft:#3a2d14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1522; --surface:#172033; --sunk:#121a2a; --ink:#e7ecf5; --muted:#97a3bb; --line:#26314a;
  --primary:#7fa6e6; --primary-ink:#0f1522; --accent:#ff7a5e; --accent-soft:#3a201c; --soft:#1d2a44;
  --ok:#5cc996; --ok-soft:#173326; --warn:#f0b65a; --warn-soft:#3a2d14; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.jp{font-family:var(--jp)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:30px;font-weight:900}h2{font-size:22px;font-weight:700}h3{font-size:17px;font-weight:700}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
img{max-width:100%}

.shell{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px}
.seal{width:40px;height:40px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font:900 20px var(--display)}
.brand b{display:block;font:800 16px var(--body)}.brand small{color:var(--muted);font-size:12px}
.navgrp{display:flex;flex-direction:column;gap:2px}
.navgrp>span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;font-weight:600;color:var(--muted)}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav.on{background:var(--soft);color:var(--primary)}
.nav svg{width:18px;height:18px;flex:none}
.nav .ct{margin-left:auto;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
.theme{margin-top:auto}
main{padding:28px clamp(16px,4vw,44px) 90px;max-width:1120px;width:100%}
.crumb{color:var(--muted);font-size:14px;margin-bottom:6px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.head p{margin:6px 0 0;color:var(--muted);max-width:62ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--primary);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
input[type=search]{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 12px;min-width:220px}

.stat{display:flex;flex-direction:column;gap:6px}
.stat .n{font:800 30px var(--body);font-variant-numeric:tabular-nums}.stat .n small{font-size:15px;color:var(--muted);font-weight:600}
.bar{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:9px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:center;background:var(--primary);color:var(--primary-ink);border-radius:18px;padding:28px;overflow:hidden;position:relative}
.hero h1{font-size:32px}.hero p{opacity:.85;margin:8px 0 18px;max-width:52ch}
.hero .btn{border-color:rgba(255,255,255,.35);background:transparent;color:inherit}.hero .btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.hero .kanji{font:900 120px/1 var(--display);opacity:.12;position:absolute;right:20px;bottom:-14px;letter-spacing:-.05em;pointer-events:none}
.format{display:grid;gap:10px}.format div{background:rgba(255,255,255,.1);border-radius:12px;padding:12px 14px}.format b{display:block}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--primary);transform:translateY(-1px)}
.tile .t{font-weight:700}.tile .q{font-family:var(--jp);font-size:14px;color:var(--muted)}
.tile.done{border-left:4px solid var(--ok)}
.thumb{aspect-ratio:16/10;width:100%;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--sunk)}
.no{font:800 14px var(--body);color:var(--accent);font-variant-numeric:tabular-nums}

.qbig{font-family:var(--jp);font-size:24px;font-weight:700;color:var(--ink);line-height:1.5}
.vn{color:var(--muted);font-size:14px}
.formula{background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:8px;padding:10px 14px;font-family:var(--jp);font-weight:500}
.note{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:14px}
.ans{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ans .lbl{font-size:13px;font-weight:700;color:var(--muted);padding-top:3px}
.hidden-ans{font-family:var(--jp);font-size:18px;cursor:pointer;border-radius:8px;transition:filter .2s}
.hidden-ans.blur{filter:blur(7px);user-select:none}
.pic{width:100%;border-radius:12px;border:1px solid var(--line);cursor:zoom-in;display:block;background:#fff}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.sticky{position:sticky;top:20px}
.qa:first-child{border-top:0}.qa{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.qa .idx{font:700 13px var(--body);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:4px;min-width:22px}
.qa .qq{font-family:var(--jp);font-weight:700}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon:hover{border-color:var(--primary);color:var(--primary)}
.icon svg{width:18px;height:18px}

.reading{font-family:var(--jp);font-size:24px;line-height:2.15;letter-spacing:.02em}
.kana{font-family:var(--jp);font-size:18px;line-height:1.9;background:var(--soft);border-radius:12px;padding:14px 16px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--accent)}.steps i.done{background:var(--primary)}
.timer{font:800 26px var(--body);font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:10px;background:var(--sunk)}.timer.low{color:#fff;background:var(--accent)}
.verdict{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.prose h3{margin:22px 0 10px;color:var(--primary)}.prose h3:first-child{margin-top:0}
.prose ul{padding-left:20px}.prose li{margin:4px 0}
.prose .m{background:var(--warn-soft);border-left:4px solid var(--warn);padding:10px 14px;border-radius:8px;font-weight:600}
.tw{overflow-x:auto;margin:10px 0 18px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top}
th{background:var(--sunk);font-weight:700;font-size:13px}
tr:last-child td{border-bottom:0}
textarea{width:100%;font:16px/1.6 var(--jp);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;resize:vertical;background:var(--surface);color:var(--ink)}
.mine{display:grid;gap:8px;padding:16px 0;border-top:1px solid var(--line)}.mine:first-child{border-top:0;padding-top:0}

.pr-top{padding:14px 18px;margin-bottom:12px}
.cap{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sel{font:600 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 12px;max-width:260px}
.stage{padding:0;overflow:hidden}
.stage-pic{background:var(--soft);padding:18px;display:flex;justify-content:center;border-bottom:1px solid var(--line)}
.stage-pic img{max-height:44vh;max-width:100%;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;background:#fff}
.stage-ctl{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 18px 26px}
.play{width:66px;height:66px;border-radius:50%;border:0;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(31,60,104,.3)}
.play svg{width:30px;height:30px}.play:hover{filter:brightness(1.1)}
.btn.outline{border:2px solid var(--primary);border-radius:99px;color:var(--primary)}
.guide{text-align:center;max-width:640px}.ansline{font-size:19px;margin-top:8px;color:var(--ink)}
.pr-nav{justify-content:space-between;margin-top:16px}.pr-nav .btn{border-radius:99px}
#zoom{position:fixed;inset:0;background:rgba(8,12,20,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;cursor:zoom-out}
#zoom img{max-width:100%;max-height:100%;border-radius:12px}
.bottom{display:none}
.empty{color:var(--muted);text-align:center;padding:30px}

@media (max-width:960px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.sticky{position:static}.hero{grid-template-columns:1fr}}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}.rail{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bottom button{flex:1 0 auto;min-width:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 4px;border-radius:10px;cursor:pointer}
  .bottom button.on{color:var(--primary);background:var(--soft)}.bottom svg{width:20px;height:20px}
  h1{font-size:24px}.hero h1{font-size:26px}.qbig{font-size:20px}.reading{font-size:20px}
  .ans{grid-template-columns:1fr;gap:4px}.g2{grid-template-columns:1fr}
}
@media (max-width:420px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style><script>(function(){try{var q=new URLSearchParams(location.search),r=document.documentElement;var t=q.get('theme');if(t)r.dataset.theme=t;if(q.get('embed')==='1')r.dataset.embed='1';}catch(e){}})();</script>
<style id="dun-master-theme">
/* Đồng bộ màu với tab Học Tiếng Nhật của DUN MASTER */
:root[data-theme="dark"]{--bg:#020617;--surface:#0f172a;--sunk:#0b1222;--ink:#f1f5f9;--muted:#94a3b8;--line:#1e293b;--primary:#34d399;--primary-ink:#022c22;--accent:#f97316;--accent-soft:#3b1d0a;--soft:#0f2a24;--ok:#34d399;--ok-soft:#06281d;--warn:#fbbf24;--warn-soft:#332507}
:root[data-theme="light"]{--bg:#f8fafc;--surface:#ffffff;--sunk:#f1f5f9;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#059669;--primary-ink:#ffffff;--accent:#f97316;--accent-soft:#ffedd5;--soft:#ecfdf5}
body{font-family:'Plus Jakarta Sans','Be Vietnam Pro',system-ui,sans-serif}
/* Khi nhúng trong app: app tự vẽ thanh điều hướng, ẩn thanh riêng của bản Speaking */
:root[data-embed] body{background:transparent}
:root[data-embed] .rail,:root[data-embed] .bottom{display:none!important}
:root[data-embed] .shell{display:block!important;min-height:0}
:root[data-embed] #app{padding:0!important;max-width:none!important;margin:0!important}
/* Tranh không phóng quá to khi nhúng (bấm vào tranh để xem lớn) */
:root[data-embed] img.pic,:root[data-embed] .stage-pic img{max-height:360px;width:auto;max-width:100%;margin:0 auto;object-fit:contain;cursor:zoom-in}
:root[data-embed] .stage-pic{padding:14px}
</style>

<script>
const D = {"reads": [{"title": "Bài đọc mẫu trong đề Demo (Đề A-0)", "D": "わたしは　今年の８月に　ベトナムへ　行きました。ハノイで　ともだちに　会いました。それから、いっしょに　ゆうめいな　きょうかいへ　行きました。とても　きれいでした。おいしい　食べ物も　たくさん　食べました。時間が　ありませんでしたから、ホーチミン市へ　行きませんでした。また　ホーチミン市へ　行きたいです。", "C": "わたしは　ことしのはちがつに　ベトナムへ　いきました。ハノイで　ともだちに　あいました。それから、いっしょに　ゆうめいな　きょうかいへ　いきました。とても　きれいでした。おいしい　たべものも　たくさん　たべました。じかんが　ありませんでしたから、ホーチミンしへ　いきませんでした。また　ホーチミンしへ　いきたいです。", "V": "Tháng 8 năm nay tôi đã đến Việt Nam. Ở Hà Nội tôi đã gặp bạn. Sau đó chúng tôi cùng đi đến một nhà thờ nổi tiếng. Nhà thờ rất đẹp. Tôi cũng đã ăn rất nhiều món ngon. Vì không có thời gian nên tôi đã không đi TP. Hồ Chí Minh. Tôi muốn lại đến TP. Hồ Chí Minh.", "N": "Chú ý: 今年 = ことし (không đọc こんねん); 8月 = はちがつ; いっしょに có âm ngắt っ; ゆうめい kéo dài ゆう."}, {"title": "Bài đọc 1 – Thành phố Hồ Chí Minh (HUONGNTQ12)", "D": "私は　ベトナムの　ホーチミンから　来ました。ホーチミンは　ベトナムの　南です。ホーチミンに　高い　ビルや　大きい　デパートが　たくさん　あります。人も　多いです。ホーチミンの　食べ物は　ちょっと　高いですが、おいしいです。一年じゅう、あついですから、みなさんは　つめたい　ジュースを　よく　飲みます。", "C": "わたしは　ベトナムの　ホーチミンから　きました。ホーチミンは　ベトナムの　みなみです。ホーチミンに　たかい　ビルや　おおきい　デパートが　たくさん　あります。ひとも　おおいです。ホーチミンの　たべものは　ちょっと　たかいですが、おいしいです。いちねんじゅう、あついですから、みなさんは　つめたい　ジュースを　よく　のみます。", "V": "Tôi đến từ TP. Hồ Chí Minh, Việt Nam. TP. HCM ở phía Nam Việt Nam. Ở HCM có nhiều toà nhà cao và trung tâm thương mại lớn. Người cũng đông. Đồ ăn ở HCM hơi đắt nhưng ngon. Vì quanh năm nóng nên mọi người hay uống nước ép lạnh.", "N": "Chú ý: 来ました = きました; 大きい = おおきい (âm dài); 一年じゅう = いちねんじゅう; ちょっと có っ."}, {"title": "Bài đọc 2 – Chuyến đi Nhật (HUONGNTQ12)", "D": "私は　今年の　４月に　日本へ　行きました。日本で　ともだちに　会いました。シュミットさんです。高校生の　ルームメイトです。それから、いっしょに　ゆうめいな　タワーへ　行きました。とても　きれいでした。おいしい　食べ物も　食べました。ほっかいどうへ　行きたいですが、時間が　ありませんでしたから、行きませんでした。また　日本へ　行きたいです。", "C": "わたしは　ことしの　しがつに　にほんへ　いきました。にほんで　ともだちに　あいました。シュミットさんです。こうこうせいの　ルームメイトです。それから、いっしょに　ゆうめいな　タワーへ　いきました。とても　きれいでした。おいしい　たべものも　たべました。ほっかいどうへ　いきたいですが、じかんが　ありませんでしたから、いきませんでした。また　にほんへ　いきたいです。", "V": "Tháng 4 năm nay tôi đã đến Nhật. Ở Nhật tôi đã gặp bạn – đó là anh Schmidt, bạn cùng phòng thời cấp 3. Sau đó chúng tôi cùng đi đến một toà tháp nổi tiếng. Rất đẹp. Tôi cũng đã ăn đồ ăn ngon. Tôi muốn đi Hokkaido nhưng vì không có thời gian nên đã không đi. Tôi muốn lại đến Nhật.", "N": "Chú ý: ４月 = しがつ (không đọc よんがつ); 高校生 = こうこうせい (2 âm dài); ルームメイト kéo dài ルー."}, {"title": "Bài đọc 3 – Tokyo tháng 7 (HUONGNTQ12)", "D": "きょねんの　７月に　東京へ　行きました。東京で　食べ物と　飲み物が　一番　すきですから、ゆうめいな　レストランで　食べました。ビールも　飲みました。それから、きっさてんで　友達に　会って、たくさん　話しました。それから、デパートで　買い物しました。すこし　高かったですが、すてきな　くつを　買いました。", "C": "きょねんの　しちがつに　とうきょうへ　いきました。とうきょうで　たべものと　のみものが　いちばん　すきですから、ゆうめいな　レストランで　たべました。ビールも　のみました。それから、きっさてんで　ともだちに　あって、たくさん　はなしました。それから、デパートで　かいものしました。すこし　たかかったですが、すてきな　くつを　かいました。", "V": "Tháng 7 năm ngoái tôi đã đến Tokyo. Vì ở Tokyo tôi thích nhất là đồ ăn và đồ uống nên tôi đã ăn ở một nhà hàng nổi tiếng. Tôi cũng uống bia. Sau đó tôi gặp bạn ở quán cà phê và nói chuyện rất nhiều. Sau đó tôi mua sắm ở trung tâm thương mại. Hơi đắt nhưng tôi đã mua được đôi giày đẹp.", "N": "Chú ý: ７月 = しちがつ; きっさてん có っ; 会って có っ; 高かった = たかかった (っ)."}, {"title": "Bài đọc 4 – Một ngày của anh Daniel (HUONGNTQ12)", "D": "ダニエルさんは　日本の　会社で　はたらいています。毎日　６時に　おきて、あさごはんを　食べて、それから　会社へ　行きます。会社は　９時から　６時までです。あさ　電車で　行きますが、いつも　バスで　うちへ　帰ります。よる、テレビを　見ます。おんがくも　聞きます。いつも　１１時に　ねます。", "C": "ダニエルさんは　にほんの　かいしゃで　はたらいています。まいにち　ろくじに　おきて、あさごはんを　たべて、それから　かいしゃへ　いきます。かいしゃは　くじから　６じまでです。あさ　でんしゃで　いきますが、いつも　バスで　うちへ　かえります。よる、テレビを　みます。おんがくも　ききます。いつも　じゅういちじに　ねます。", "V": "Anh Daniel đang làm việc ở một công ty Nhật. Mỗi ngày anh dậy lúc 6 giờ, ăn sáng, rồi đi đến công ty. Công ty làm từ 9 giờ đến 6 giờ. Buổi sáng anh đi bằng tàu điện, nhưng lúc nào cũng về nhà bằng xe buýt. Buổi tối anh xem TV, nghe nhạc. Anh luôn đi ngủ lúc 11 giờ.", "N": "Chú ý: ９時 = くじ (không đọc きゅうじ); 毎日 = まいにち; 電車 = でんしゃ; 帰ります = かえります."}, {"title": "Bài đọc 5 – Món ăn của anh Park (HUONGNTQ12)", "D": "パクさんが　この　料理を　つくりました。パクさんは　料理が　すきですから、毎週の　日曜日　うちで　つくりました。とくに、ぎゅう肉と　やさいの　スープが　一番　おいしいです。ハンバーグも　ケーキも　おいしいです。私は　いつも　パクさんの　料理を　食べたいです。そして、つくりかたも　べんきょうしたいです。", "C": "パクさんが　この　りょうりを　つくりました。パクさんは　りょうりが　すきですから、まいしゅうの　にちようび　うちで　つくりました。とくに、ぎゅうにくと　やさいの　スープが　いちばん　おいしいです。ハンバーグも　ケーキも　おいしいです。わたしは　いつも　パクさんの　りょうりを　たべたいです。そして、つくりかたも　べんきょうしたいです。", "V": "Anh Park đã nấu món này. Vì anh Park thích nấu ăn nên chủ nhật hằng tuần anh nấu ở nhà. Đặc biệt món súp bò và rau là ngon nhất. Hamburger và bánh kem cũng ngon. Tôi lúc nào cũng muốn ăn món anh Park nấu. Và tôi cũng muốn học cách nấu.", "N": "Chú ý: 料理 = りょうり (âm ghép りょ); 毎週 = まいしゅう; ぎゅう肉 = ぎゅうにく; べんきょう kéo dài きょう."}, {"title": "Bài đọc 6 – Một ngày của sinh viên (HUONGNTQ12)", "D": "私は　大学生です。毎日、あさ　５時に　おきます。コーヒーを　飲みます。それから、７時に　学校へ　行きます。お弁当を　もって　行きませんから、しょくどうで　クラスメイトと　食べます。午後も　日本語の　じゅぎょうが　あります。私は　アルバイトを　しませんから、よる　１１時に　うちへ　帰ります。", "C": "わたしは　だいがくせいです。まいにち、あさ　ごじに　おきます。コーヒーを　のみます。それから、しちじに　がっこうへ　いきます。おべんとうを　もって　いきませんから、しょくどうで　クラスメイトと　たべます。ごごも　にほんごの　じゅぎょうが　あります。わたしは　アルバイトを　しませんから、よる　じゅういちじに　うちへ　かえります。", "V": "Tôi là sinh viên đại học. Mỗi ngày tôi dậy lúc 5 giờ sáng. Tôi uống cà phê. Sau đó 7 giờ tôi đi đến trường. Vì tôi không mang cơm hộp nên tôi ăn ở căn tin với bạn cùng lớp. Buổi chiều cũng có giờ học tiếng Nhật. Vì tôi không làm thêm nên 11 giờ tối tôi về nhà.", "N": "Chú ý: ７時 = しちじ; 学校 = がっこう (っ); お弁当 = おべんとう; じゅぎょう (âm ghép ぎょ, kéo dài)."}, {"title": "Bài đọc 7 – Lời rủ đi trung tâm thương mại (HUONGNTQ12)", "D": "今週の　日曜日　いっしょに　デパートへ　行きませんか。そこで　買い物して、映画を　見に　行きましょう。デパートの　服やは　あまり　安くないですが、セールが　ありますよ。私は　ジーンズと　Ｔシャツを　買いたいです。よる　デパートの　近くで　ジャズの　コンサートが　あります。いっしょに　聞きましょう。", "C": "こんしゅうの　にちようび　いっしょに　デパートへ　いきませんか。そこで　かいものして、えいがを　みに　いきましょう。デパートの　ふくやは　あまり　やすくないですが、セールが　ありますよ。わたしは　ジーンズと　Ｔシャツを　かいたいです。よる　デパートの　ちかくで　ジャズの　コンサートが　あります。いっしょに　ききましょう。", "V": "Chủ nhật tuần này cùng đi trung tâm thương mại không? Ở đó mua sắm rồi đi xem phim nhé. Cửa hàng quần áo ở TTTM không rẻ lắm nhưng đang có giảm giá đấy. Tôi muốn mua quần jean và áo phông. Buổi tối gần TTTM có buổi hoà nhạc jazz. Cùng nghe nhé.", "N": "Chú ý: 今週 = こんしゅう; 映画 = えいが; Ｔシャツ = ティーシャツ; コンサート kéo dài サー."}, {"title": "Bài đọc 8 – Bạn Schmidt (HUONGNTQ12)", "D": "私は　クラスで　シュミットさんが　一番　すきです。シュミットさんは　ハンサムで、あたまが　いいですから、いつも　シュミットさんと　話したいです。きのう　シュミットさんの　誕生日でした。私は　プレゼントを　買って、あげました。料理の　本でした。それから　いっしょに　きっさてんへ　ジュースを　飲みに　行きました。楽しい　一日でした。", "C": "わたしは　クラスで　シュミットさんが　いちばん　すきです。シュミットさんは　ハンサムで、あたまが　いいですから、いつも　シュミットさんと　はなしたいです。きのう　シュミットさんの　たんじょうびでした。わたしは　プレゼントを　かって、あげました。りょうりの　ほんでした。それから　いっしょに　きっさてんへ　ジュースを　のみに　いきました。たのしい　いちにちでした。", "V": "Trong lớp tôi thích bạn Schmidt nhất. Vì Schmidt đẹp trai và thông minh nên lúc nào tôi cũng muốn nói chuyện với bạn ấy. Hôm qua là sinh nhật của Schmidt. Tôi đã mua quà tặng bạn ấy – đó là một cuốn sách nấu ăn. Sau đó chúng tôi cùng đến quán cà phê uống nước ép. Đó là một ngày vui.", "N": "Chú ý: 誕生日 = たんじょうび; 一日 = いちにち (không đọc ついたち); 買って có っ."}, {"title": "Bài đọc 9 – Chùa Todaiji (HUONGNTQ12)", "D": "こちらは　東大寺です。東大寺は　大きい　お寺です。そして、きれいです。東京に　あります。毎年、多くの　人が　見に　来ます。お寺の　ちかくに　おいしい　店が　たくさん　あります。とくに、抹茶の　アイスクリームの　店が　一番　ゆうめいです。つめたい　メロンの　ジュースも　ゆうめいです。いちど、食べてくださいね。", "C": "こちらは　とうだいじです。とうだいじは　おおきい　おてらです。そして、きれいです。とうきょうに　あります。まいとし、おおくの　ひとが　みに　きます。おてらの　ちかくに　おいしい　みせが　たくさん　あります。とくに、まっちゃの　アイスクリームの　みせが　いちばん　ゆうめいです。つめたい　メロンの　ジュースも　ゆうめいです。いちど、たべてくださいね。", "V": "Đây là chùa Todaiji. Todaiji là một ngôi chùa lớn, và đẹp. Chùa ở Tokyo (theo bài đọc). Mỗi năm có rất nhiều người đến tham quan. Gần chùa có nhiều quán ngon. Đặc biệt quán kem trà xanh là nổi tiếng nhất. Nước ép dưa lưới lạnh cũng nổi tiếng. Hãy ăn thử một lần nhé.", "N": "Chú ý: 東大寺 = とうだいじ; 毎年 = まいとし; 抹茶 = まっちゃ (っ); アイスクリーム kéo dài リー. (Thực tế Todaiji ở Nara, nhưng cứ đọc đúng như bài.)"}, {"title": "Bài đọc 10 – Bài kiểm tra (HUONGNTQ12)", "D": "きのう　大学の　門で　マリアム先生に　会いました。いっしょに　話して、クラスに　はいりました。言語の　テストが　ありましたから、テストの　前、かんじの　書きかたや　読みかたを　ふくしゅうしました。マリアム先生の　テストは　いつも　むずかしいですが、昨日は　あまり　むずかしくなかったです。九十点を　とりました。嬉しかったです。", "C": "きのう　だいがくの　もんで　マリアムせんせいに　あいました。いっしょに　はなして、クラスに　はいりました。げんごの　テストが　ありましたから、テストの　まえ、かんじの　かきかたや　よみかたを　ふくしゅうしました。マリアムせんせいの　テストは　いつも　むずかしいですが、きのうは　あまり　むずかしくなかったです。きゅうじゅってんを　とりました。うれしかったです。", "V": "Hôm qua tôi gặp cô Mariam ở cổng trường. Chúng tôi nói chuyện rồi cùng vào lớp. Vì có bài kiểm tra ngôn ngữ nên trước giờ kiểm tra tôi đã ôn cách viết và cách đọc chữ Hán. Bài kiểm tra của cô Mariam lúc nào cũng khó, nhưng hôm qua không khó lắm. Tôi được 90 điểm. Tôi đã rất vui.", "N": "Chú ý: 先生 = せんせい (kéo dài); 九十点 = きゅうじゅってん (っ); むずかしくなかった có っ; 嬉しかった = うれしかった."}, {"title": "Bài đọc 11 – 「私の国・町」Đất nước – thành phố của tôi (ChamNTH3)", "D": "私は　イタリアの　フィレンツェから　来ました。フィレンツェは　イタリアの　少し　北です。フィレンツェは　とても　にぎやかな　ところです。古い　教会や　美術館などが　あります。教会は　とても　きれいです。２月に　チョコレートの　祭りが　あります。いろいろな　チョコレートが　あります。とても　おいしいです。フィレンツェは　春、暖かいです。そして、雨が　少ないです。フィレンツェは　いい　ところです。皆さん、ぜひ　来てください。", "C": "わたしは　イタリアの　フィレンツェから　きました。フィレンツェは　イタリアの　すこし　きたです。フィレンツェは　とても　にぎやかな　ところです。ふるい　きょうかいや　びじゅつかんなどが　あります。きょうかいは　とても　きれいです。にがつに　チョコレートの　まつりが　あります。いろいろな　チョコレートが　あります。とても　おいしいです。フィレンツェは　はる、あたたかいです。そして、あめが　すくないです。フィレンツェは　いい　ところです。みなさん、ぜひ　きてください。", "V": "Tôi đến từ Florence, Ý. Florence nằm hơi lệch về phía Bắc nước Ý. Florence là nơi rất nhộn nhịp. Có những nhà thờ cổ, bảo tàng mỹ thuật… Nhà thờ rất đẹp. Tháng 2 có lễ hội sô-cô-la. Có rất nhiều loại sô-cô-la, rất ngon. Mùa xuân ở Florence ấm áp, và ít mưa. Florence là một nơi tuyệt vời. Mọi người nhất định hãy đến nhé.", "N": "Chú ý: 少し = すこし nhưng 少ない = すくない; 美術館 = びじゅつかん; 暖かい = あたたかい; フィレンツェ đọc liền \"fi-ren-tse\"."}, {"title": "Bài đọc 12 – Maria ở Tokyo (ChamNTH3)", "D": "私の　名前は　マリアです。日本の　東京で　日本語を　べんきょうします。東京は　日本の　東です。東京は　とても　にぎやかです。そして、人が　おおいです。ちよだ区に　私の　学校が　あります。まいにち、午前７時に　でんしゃで　学校へ　行きます。アパートから　学校まで　でんしゃで　２０分くらいです。ひる、ごはんを　食べます。午後　５時に　アパートへ　かえります。", "C": "わたしの　なまえは　マリアです。にほんの　とうきょうで　にほんごを　べんきょうします。とうきょうは　にほんの　ひがしです。とうきょうは　とても　にぎやかです。そして、ひとが　おおいです。ちよだくに　わたしの　がっこうが　あります。まいにち、ごぜんしちじに　でんしゃで　がっこうへ　いきます。アパートから　がっこうまで　でんしゃで　にじゅっぷんくらいです。ひる、ごはんを　たべます。ごご　ごじに　アパートへ　かえります。", "V": "Tên tôi là Maria. Tôi học tiếng Nhật ở Tokyo, Nhật Bản. Tokyo ở phía Đông Nhật Bản. Tokyo rất nhộn nhịp, và đông người. Trường tôi ở quận Chiyoda. Mỗi ngày 7 giờ sáng tôi đi tàu điện đến trường. Từ căn hộ đến trường đi tàu điện mất khoảng 20 phút. Buổi trưa tôi ăn cơm. 5 giờ chiều tôi về căn hộ.", "N": "Chú ý: 20分 = にじゅっぷん; 午前 = ごぜん; 東 = ひがし; アパート kéo dài パー."}, {"title": "Bài đọc 13 – Học sinh trường Aozora (ChamNTH3)", "D": "私は　あおぞら日本語学校の　学生です。ベトナムから　きました。１８才です。私の　しゅみは　りょこうと　りょうりです。すきな　食べ物は　ベトナムの　フォーです。すきな　飲み物は　コカ・コーラです。休みの　日、ルームメイトと　買い物に　行きます。こうえんで　ともだちと　バーベキューパーティーを　します。たのしいです。", "C": "わたしは　あおぞらにほんごがっこうの　がくせいです。ベトナムから　きました。じゅうはっさいです。わたしの　しゅみは　りょこうと　りょうりです。すきな　たべものは　ベトナムの　フォーです。すきな　のみものは　コカ・コーラです。やすみの　ひ、ルームメイトと　かいものに　いきます。こうえんで　ともだちと　バーベキューパーティーを　します。たのしいです。", "V": "Tôi là học sinh trường Nhật ngữ Aozora. Tôi đến từ Việt Nam, 18 tuổi. Sở thích của tôi là du lịch và nấu ăn. Món ăn yêu thích là phở Việt Nam. Đồ uống yêu thích là Coca-Cola. Ngày nghỉ tôi đi mua sắm với bạn cùng phòng. Tôi tổ chức tiệc nướng BBQ với bạn bè ở công viên. Rất vui.", "N": "Chú ý: 18才 = じゅうはっさい (っ); りょこう／りょうり phân biệt rõ; バーベキューパーティー có 3 âm dài."}, {"title": "Bài đọc 14 – Tokyo tháng 4 năm ngoái (ChamNTH3)", "D": "きょねんの　４月、東京へ　行きました。休日でしたから、人が　おおかったです。買い物しました。たのしかったです。東京に　ゆうめいな　ところが　たくさん　ありました。ディズニーランドも　ありました。食べ物の　なかで　ラーメンが　いちばん　おいしかったです。すしも　食べました。まっちゃラテを　飲みました。また、かぞくと　日本へ　行きたいです。", "C": "きょねんの　しがつ、とうきょうへ　いきました。きゅうじつでしたから、ひとが　おおかったです。かいものしました。たのしかったです。とうきょうに　ゆうめいな　ところが　たくさん　ありました。ディズニーランドも　ありました。たべものの　なかで　ラーメンが　いちばん　おいしかったです。すしも　たべました。まっちゃラテを　のみました。また、かぞくと　にほんへ　いきたいです。", "V": "Tháng 4 năm ngoái tôi đã đi Tokyo. Vì là ngày nghỉ lễ nên rất đông người. Tôi đã mua sắm, rất vui. Ở Tokyo có rất nhiều nơi nổi tiếng, có cả Disneyland. Trong các món ăn thì ramen là ngon nhất. Tôi cũng đã ăn sushi và uống matcha latte. Tôi muốn lại cùng gia đình đi Nhật.", "N": "Chú ý: 休日 = きゅうじつ; おおかった／たのしかった／おいしかった đều có っ; ラーメン kéo dài ラー."}, {"title": "Bài đọc 15 – 「楽しい1日」Một ngày vui (ChamNTH3)", "D": "日曜日、友達と　近くの　山に　登りました。天気が　よかったですから、とても　気持ちが　よかったです。山で　お弁当を　食べました。山からの　景色は　とても　きれいでした。それから、古い　お寺を　見に　行きました。とても　おもしろかったです。とても　楽しい　１日でした。また　行きたいです。", "C": "にちようび、ともだちと　ちかくの　やまに　のぼりました。てんきが　よかったですから、とても　きもちが　よかったです。やまで　おべんとうを　たべました。やまからの　けしきは　とても　きれいでした。それから、ふるい　おてらを　みに　いきました。とても　おもしろかったです。とても　たのしい　いちにちでした。また　いきたいです。", "V": "Chủ nhật tôi đã cùng bạn leo ngọn núi gần nhà. Vì trời đẹp nên cảm thấy rất dễ chịu. Chúng tôi ăn cơm hộp trên núi. Phong cảnh nhìn từ núi rất đẹp. Sau đó chúng tôi đi xem một ngôi chùa cổ. Rất thú vị. Đó là một ngày rất vui. Tôi muốn lại đi nữa.", "N": "Chú ý: 登りました = のぼりました; 気持ち = きもち; 景色 = けしき; よかった có っ."}, {"title": "Bài đọc 16 – 「一緒に！」Cùng nhau! (ChamNTH3)", "D": "皆さんは　日本の　食べ物で　何が　いちばん　好きですか。私は　お好み焼きが　いちばん　好きです。お好み焼きは　日本の　ピザです。お好み焼きの　中に　豚肉や　卵や　野菜が　あります。お好み焼きの　ソースは　少し　甘いです。とても　おいしいですよ。今度、一緒に　お好み焼きを　食べに　行きませんか。", "C": "みなさんは　にほんの　たべもので　なにが　いちばん　すきですか。わたしは　おこのみやきが　いちばん　すきです。おすみやきは　にほんの　ピザです。おすみやきの　なかに　ぶたにくや　たまごや　やさいが　あります。おすみやきの　ソースは　すこし　あまいです。とても　おいしいですよ。こんど、いっしょに　おすみやきを　たべに　いきませんか。", "V": "Mọi người thích món Nhật nào nhất? Tôi thích okonomiyaki nhất. Okonomiyaki là \"pizza Nhật\". Bên trong okonomiyaki có thịt lợn, trứng, rau… Nước sốt hơi ngọt. Rất ngon đấy. Lần tới cùng đi ăn okonomiyaki không?", "N": "Chú ý: お好み焼き = おこのみやき; 豚肉 = ぶたにく; 今度 = こんど; 一緒に = いっしょに (っ)."}, {"title": "Bài đọc 17 – 「パーティー」Bữa tiệc (ChamNTH3)", "D": "皆さん、来週の　日曜日、私の　家で　パーティーを　します。私は　国の　料理を　作ります。一緒に　作りませんか。それから、皆さんの　国の　料理の　作り方も　教えてください。一緒に　作って、食べましょう。おいしい　お酒も　飲みましょう。私の　アパートは　駅の　近くに　あります。コンビニの　隣の　新しい　アパートです。ぜひ、来てください。", "C": "みなさん、らいしゅうの　にちようび、わたしの　いえで　パーティーを　します。わたしは　くにの　りょうりを　つくります。いっしょに　つくりませんか。それから、みなさんの　くにの　りょうりの　つくりかたも　おしえてください。いっしょに　つくって、たべましょう。おいしい　おさけも　のみましょう。わたしの　アパートは　えきの　ちかくに　あります。コンビニの　となりの　あたらしい　アパートです。ぜひ、きてください。", "V": "Mọi người ơi, chủ nhật tuần sau tôi tổ chức tiệc ở nhà. Tôi sẽ nấu món ăn của nước tôi. Cùng nấu không? Và hãy dạy tôi cách nấu món ăn nước các bạn nữa nhé. Cùng nấu rồi cùng ăn nào. Cùng uống rượu ngon nhé. Căn hộ của tôi ở gần nhà ga – là căn hộ mới bên cạnh cửa hàng tiện lợi. Nhất định hãy đến nhé.", "N": "Chú ý: 来週 = らいしゅう; 作り方 = つくりかた; 教えて = おしえて; 隣 = となり; パーティー kéo dài 2 chỗ."}], "q34": [{"no": "4-①", "title": "Từ A đến B mất bao lâu?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Trả lời", "jp": "うちから　がっこうまで　バイクで　15ふん　くらいです。", "vn": "Từ nhà đến trường đi xe máy khoảng 15 phút."}], "q": "うちから　がっこうまで　どのくらいですか。", "qv": "Từ nhà đến trường mất bao lâu?", "m": "A から　B まで　（xe で）　〜じかん／〜ふん　くらいです。", "imgs": [{"src": "img/map_vn.jpg", "ans": [{"jp": "ハノイから　ダナンまで　ひこうきで　1じかん　くらいです。", "vn": "Hà Nội → Đà Nẵng đi máy bay khoảng 1 tiếng."}, {"jp": "ダナンから　ホーチミンまで　バスで　20じかん　くらいです。", "vn": "Đà Nẵng → HCM đi xe buýt khoảng 20 tiếng."}]}, {"src": "img/map_rome.jpg", "ans": [{"jp": "とうきょうから　ローマまで　ひこうきで　12じかん　くらいです。", "vn": "Tokyo → Rome đi máy bay khoảng 12 tiếng."}, {"jp": "とうきょうから　ソウルまで　2じかんはん　くらいです。", "vn": "Tokyo → Seoul khoảng 2 tiếng rưỡi."}]}], "n": "Đi bộ nói あるいて (không có で). 10分 = じゅっぷん ・ 15分 = じゅうごふん ・ 30分 = さんじゅっぷん ・ 1時間半 = いちじかんはん.", "thu": true, "np": true}, {"no": "4-②", "title": "Đi bằng xe … mất bao lâu?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Trả lời", "jp": "うちから　がっこうまで　バスで　30ぷん　くらいです。", "vn": "Đi xe buýt khoảng 30 phút."}], "q": "うちから　がっこうまで　バスで　どのくらいですか。", "qv": "Từ nhà đến trường đi xe buýt mất bao lâu?", "m": "A から　B まで　（xe）で　〜くらいです。", "imgs": [{"src": "img/map_kyoto.jpg", "ans": [{"jp": "とうきょうから　きょうとまで　しんかんせんで　2じかんはん　くらいです。", "vn": "Tokyo → Kyoto đi shinkansen khoảng 2 tiếng rưỡi."}]}, {"src": "img/map_rome.jpg", "ans": [{"jp": "とうきょうから　ソウルまで　ひこうきで　2じかんはん　です。", "vn": "Tokyo → Seoul đi máy bay 2 tiếng rưỡi."}, {"jp": "とうきょうから　ローマまで　ひこうきで　12じかん　です。", "vn": "Tokyo → Rome đi máy bay 12 tiếng."}]}], "n": "Câu hỏi có sẵn xe gì thì trả lời nhắc lại đúng xe đó: バスで, でんしゃで, ひこうきで, くるまで, バイクで.", "thu": true, "np": true}, {"no": "4-③", "title": "… là nơi / trường / nước như thế nào?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Trả lời", "jp": "FPTだいがくは　きれいな　だいがくです。", "vn": "ĐH FPT là trường đẹp."}, {"t": "A", "label": "Thêm", "jp": "カントーは　にぎやかな　ところです。", "vn": "Cần Thơ là nơi nhộn nhịp."}], "q": "FPTだいがくは　どんな　だいがくですか。", "qv": "Đại học FPT là trường như thế nào?", "m": "〜は　（tính từ）＋ danh từ　です。　(しずかな まち ・ おおきい まち)", "imgs": [{"src": "img/q_A.jpg", "ans": [{"jp": "ダラットは　しずかな　ところです。", "vn": "Đà Lạt là nơi yên tĩnh."}, {"jp": "とうきょうは　にぎやかな　まちです。", "vn": "Tokyo là thành phố nhộn nhịp."}]}], "n": "どんな → câu trả lời phải có danh từ (ところ, まち, だいがく…). Tính từ な giữ な: しずかな ところ.", "thu": true, "np": true}, {"no": "4-④", "title": "Thành phố của bạn là nơi thế nào?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Trả lời", "jp": "わたしの　まちは　しずかな　ところです。", "vn": "Thành phố tôi là nơi yên tĩnh."}, {"t": "A", "label": "Thêm điểm", "jp": "わたしの　まちは　にぎやかな　ところです。そして、ゆうめいな　おてらが　あります。", "vn": "Thành phố tôi nhộn nhịp. Và có ngôi chùa nổi tiếng."}], "q": "Aさんの　まちは　どんな　ところですか。", "qv": "Thành phố của bạn là nơi như thế nào?", "m": "わたしの　まちは　〜な／〜い　ところです。", "imgs": [{"src": "img/q_A.jpg", "ans": [{"jp": "ニャチャンは　うみが　きれいな　ところです。", "vn": "Nha Trang là nơi biển đẹp."}]}], "n": "Câu không tranh – chuẩn bị sẵn câu về quê của bạn (xem Phụ lục).", "thu": true, "np": true}, {"no": "4-⑤", "title": "… thế nào?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Trả lời", "jp": "わたしの　しごとは　いそがしいです。そして、たいへんです。", "vn": "Công việc của tôi bận. Và vất vả."}, {"t": "A", "label": "Thêm", "jp": "FPTだいがくは　おおきいです。そして、きれいです。", "vn": "ĐH FPT to. Và đẹp."}], "q": "Aさんの　しごとは　どうですか。", "qv": "Công việc của bạn thế nào?", "m": "〜は　（tính từ）です。", "imgs": [{"src": "img/q_A.jpg", "ans": [{"jp": "とうきょうは　にぎやかです。そして、ひとが　おおいです。", "vn": "Tokyo nhộn nhịp. Và đông người."}]}], "n": "どう → chỉ cần tính từ (にぎやかです). どんな → tính từ + danh từ (にぎやかな まちです).", "thu": true, "np": true}, {"no": "4-⑥", "title": "Thành phố bạn có nhộn nhịp không?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Có", "jp": "はい、にぎやかです。", "vn": "Vâng, nhộn nhịp."}, {"t": "A", "label": "Không", "jp": "いいえ、にぎやかじゃ　ありません。しずかです。", "vn": "Không, không nhộn nhịp. Yên tĩnh."}], "q": "Aさんの　まちは　にぎやかですか。", "qv": "Thành phố bạn có nhộn nhịp không?", "m": "はい、にぎやかです。　／　いいえ、にぎやかじゃ　ありません。", "imgs": [{"src": "img/q_A.jpg", "ans": [{"jp": "Q：きょうとは　にぎやかですか。→ いいえ、にぎやかじゃ　ありません。しずかです。", "vn": "Kyoto có nhộn nhịp không? – Không, yên tĩnh."}]}], "n": "Nhắc lại đúng tính từ trong câu hỏi. あまり đi với phủ định: あまり にぎやかじゃ ありません.", "thu": true, "np": true}, {"no": "4-⑦", "title": "Thành phố bạn có lớn không?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Có", "jp": "はい、とても　おおきいです。", "vn": "Vâng, rất lớn."}, {"t": "A", "label": "Không", "jp": "いいえ、おおきくないです。ちいさいです。", "vn": "Không lớn. Nhỏ."}], "q": "Aさんの　まちは　おおきいですか。", "qv": "Thành phố bạn có lớn không?", "m": "はい、おおきいです。　／　いいえ、おおきくないです。", "imgs": [{"src": "img/q_A.jpg", "ans": [{"jp": "Q：ニャチャンは　おおきいですか。→ いいえ、おおきくないです。", "vn": "Nha Trang có lớn không? – Không lớn."}]}], "n": "Tính từ い phủ định: bỏ い + くないです. Riêng いい → よくないです.", "thu": true, "np": true}, {"no": "4-⑧", "title": "Ở thành phố bạn có nhà thờ / chùa / núi không?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Có", "jp": "はい、わたしの　まちに　きょうかいが　あります。", "vn": "Có, ở thành phố tôi có nhà thờ."}, {"t": "A", "label": "Không", "jp": "いいえ、わたしの　まちに　やまは　ありません。", "vn": "Không, thành phố tôi không có núi."}, {"t": "A", "label": "Núi", "jp": "Q：Aさんの　まちに　やまが　ありますか。→ はい、やまが　あります。", "vn": "Thành phố bạn có núi không? – Có."}], "q": "Aさんの　まちに　きょうかいが　ありますか。", "qv": "Ở thành phố bạn có nhà thờ không?", "m": "はい、（まちに）〜が　あります。　／　いいえ、ありません。", "imgs": [{"src": "img/q_A.jpg", "ans": [{"jp": "Q：ダラットに　きょうかいが　ありますか。→ はい、きれいな　きょうかいが　あります。", "vn": "Có, có nhà thờ đẹp."}, {"jp": "Q：きょうとに　おてらが　ありますか。→ はい、ふるい　おてらが　あります。", "vn": "Có, có chùa cổ."}]}], "n": "Nơi chốn + に + あります. あります chỉ dùng cho đồ vật, công trình – không dùng cho người, con vật.", "thu": true, "np": true}, {"no": "4-⑨", "title": "Tháng … / mùa … thế nào?", "bai": "Bài 4 – Đất nước, thành phố của tôi", "items": [{"t": "A", "label": "Trả lời", "jp": "ハノイは　7がつ、とても　あついです。", "vn": "Hà Nội tháng 7 rất nóng."}, {"t": "A", "label": "Thêm", "jp ôi về nhà."}, "pics": [{"no": "Tranh 1 – Bài 6", "title": "Đã làm chưa", "bai": "Đề 8", "items": [{"t": "Q", "jp": "ハナさんは　もう　あさごはんを　たべましたか。"}, {"t": "A", "jp": "はい、もう　たべました。", "vn": "Rồi."}, {"t": "Q", "jp": "もう　しゅくだいを　しましたか。"}, {"t": "A", "jp": "いいえ、まだです。", "vn": "Chưa."}, {"t": "Q", "jp": "もう　コンサートの　チケットを　かいましたか。"}, {"t": "A", "jp": "はい、もう　かいました。", "vn": "Mua rồi."}, {"t": "Q", "jp": "もう　へやを　そうじしましたか。"}, {"t": "A", "jp": "いいえ、まだです。", "vn": "Chưa."}], "imgs": [{"src": "img/q_E.jpg", "ans": []}]}, {"no": "Tranh 2 – Bài 6", "title": "Lời rủ", "bai": "Đề 8", "items": [{"t": "Q", "jp": "① こんしゅうの　どようび、いっしょに　えいがを　みに　いきませんか。"}, {"t": "A", "jp": "いいですね。いきましょう。", "vn": "Hay đấy, đi thôi. (○)"}, {"t": "Q", "jp": "② こんばん、いっしょに　レストランで　しょくじしませんか。"}, {"t": "A", "jp": "いいですね。なんじに　あいましょうか。", "vn": "Hay đấy. Mấy giờ gặp nhau? (○)"}, {"t": "Q", "jp": "④ しゅうまつ、いっしょに　おんせんへ　いきませんか。"}, {"t": "A", "jp": "すみません、しゅうまつは　ちょっと…。しごとが　ありますから。", "vn": "Xin lỗi, cuối tuần thì hơi… Vì có việc. (✕)"}, {"t": "Q", "jp": "⑤ あした、いっしょに　テニスを　しませんか。"}, {"t": "A", "jp": "すみません、あしたは　ちょっと…。テストが　ありますから。", "vn": "Xin lỗi, mai có bài kiểm tra. (✕)"}], "imgs": [{"src": "img/q_G.jpg", "ans": []}]}, {"no": "Tranh 3 – Bài 7", "title": "Ăn, cắt bằng gì", "bai": "Đề 8", "items": [{"t": "Q", "jp": "にほんじんは　なんで　ごはんを　たべますか。"}, {"t": "A", "jp": "はしで　たべます。", "vn": "Ăn bằng đũa."}, {"t": "Q", "jp": "ベトナムじんは　フォークと　ナイフで　たべますか。"}, {"t": "A", "jp": "いいえ、はしで　たべます。", "vn": "Không, ăn bằng đũa."}, {"t": "Q", "jp": "アメリカじんは　なんで　たべますか。"}, {"t": "A", "jp": "フォークと　ナイフで　たべます。", "vn": "Ăn bằng dĩa và dao."}, {"t": "Q", "jp": "インドじんは　なんで　たべますか。"}, {"t": "A", "jp": "てで　たべます。", "vn": "Ăn bằng tay."}, {"t": "Q", "jp": "なんで　パンを　きりますか。"}, {"t": "A", "jp": "ナイフで　きります。", "vn": "Cắt bằng dao."}], "imgs": [{"src": "img/q_F.jpg", "ans": []}]}], "self": {"no": "Câu hỏi không tranh", "title": "giảng viên chọn 1 câu – trả lời theo thông tin thật, đáp án chỉ là mẫu", "bai": "Đề 8", "items": [{"t": "Q", "jp": "Aさんの　まちに　きょうかいが　ありますか。"}, {"t": "A", "jp": "jp": "Aコースと　Bコースと　どちらが　やすいですか。"}, {"t": "A", "jp": "Aコースの　ほうが　やすいです。", "vn": "Set A rẻ hơn."}, {"t": "Q", "jp": "Bコースは　いくらですか。"}, {"t": "A", "jp": "3,000えんです。", "vn": "3.000 yên."}, {"t": "Q", "jp": "Aコースに　なにが　ありますか。"}, {"t": "A", "jp": "ごはんと　みそしると　さかなが　あります。", "vn": "Có cơm, súp miso và cá."}, {"t": "Q", "jp": "Aさんは　どちらが　いいですか。"}, {"t": "A", "jp": "Bコースの　ほうが　いいです。てんぷらが　すきですから。", "vn": "Tôi thích set B hơn vì thích tempura."}], "imgs": [{"src": "img/q_course.jpg", "ans": []}]}, {"no": "Tranh 3 – Bài 7", "title": "Phòng khách đông người", "bai": "Đề 9", "items": [{"t": "Q", "jp": "マリアさんは　なにを　して　いますか。"}, {"t": "A", "jp": "ピアノを　ひいて　います。", "vn": "Đang chơi piano."}, {"t": "Q", "jp": "ナタポンさんは　なにを　して　いますか。"}, {"t": "A", "jp": "えを　かいて　います。", "vn": "Đang vẽ tranh."}, {"t": "Q", "jp": "アンナさんは　なにを　して　いますか。"}, {"t": "A", "jp": "でんわを　して　います。", "vn": "Đang gọi điện thoại."}, {"t": "Q", "jp": "きむらさんは　なにを　して　いますか。"}, {"t": "A", "jp": "ほんださんと　はなして　います。", "vn": "Đang nói chuyện với Honda."}, {"t": "Q", "jp": "ユミさんは　なにを　して　いますか。"}, {"t": "A", "jp": "おさらを　あらって　います。", "vn": "Đang rửa bát."}, {"t": "Q", "jp": "だれが　ギターを　ひいて　いますか。"}, {"t": "A", "jp": "カルロスさんが　ひいて　います。", "vn": "Carlos đang chơi."}, {"t": "Q", "jp": "だれが　うたを　うたって　いますか。"}, {"t": "A", "jp": "メアリーさんが　うたって　います。", "vn": "Mary đang hát."}, {"t": "Q", "jp": "たなかさんは　なにを　して　いますか。"}, {"t": "A", "jp": "しんぶんを　よんで　います。", "vn": "Đang đọc báo."}, {"t": "Q", "jp": "ねこは　どこに　いますか。"}, {"t": "A", "jp": "とけいの　したに　います。", "vn": "Ở dưới đồng hồ."}, {"t": "Q", "jp": "いぬは　どこに　いますか。"}, {"t": "A", "jp": "テーブルの　したに　います。", "vn": "Ở dưới bàn."}], "imgs": [{"src": "img/q_living.jpg", "ans": []}]}], "self": {"no": "Câu hỏi không tranh", "title": "giảng viên chọn 1 câu – trả lời theo thông tin thật, đáp án chỉ là mẫu", "bai": "Đề 9", "items": [{"t": "Q", "jp": "Aさんは　きのう、どうして　がっこうへ　いきませんでしたか。"}, {"t": "A", "jp": "びょうきでしたから、いきませんでした。", "vn": "Vì bị ốm nên không đi."}, {"t": "Q", "jp": "くだもので　なにが　いちばん　すきですか。"}, {"t": "A", "jp": "りんごが　いちばん　すきです。", "vn": "Tôi thích táo nhất."}, {"t": "Q", "jp": "せかいで　どこが　いちばん　ひろいですか。"}, {"t": "A", "jp": "ロシアが　いちばん　ひろいです。", "vn": "Nga rộng nhất."}]}}, {"title": "Đề 10", "read": {"D": "日曜日、友達と　近くの　山に　登りました。天気が　よかったですから、とても　気持ちが　よかったです。山で　お弁当を　食べました。山からの　景色は　とても　きれいでした。それから、古い　お寺を　見に　行きました。とても　おもしろかったです。とても　楽しい　１日でした。また　行きたいです。", "C": "にちようび、ともだちと　ちかくの　やまに　のぼりました。てんきが　よかったですから、とても　きもちが　よかったです。やまで　おべんとうを　たべました。やまからの　けしきは　とても　きれいでした。それから、ふるい　おてらを　みに　いきました。とても　おもしろかったです。とても　たのしい　いちにちでした。また　いきたいです。", "V": "Chủ nhật tôi đã cùng bạn leo ngọn núi gần nhà. Vì trời đẹp nên cảm thấy rất dễ chịu. Chúng tôi ăn cơm hộp trên núi. Phong cảnh nhìn từ núi rất đẹp. Sau đó chúng tôi đi xem một ngôi chùa cổ. Rất thú vị. Đó là một ngày rất vui. Tôi muốn lại đi nữa."}, "pics": [{"no": "Tranh 1 – Bài 5", "title": "Một tuần của Nam", "bai": "Đề 10", "items": [{"t": "Q", "jp": "どようび、なにを　しましたか。"}, {"t": "A", "jp": "やまに　のぼりました。", "vn": "Leo núi."}, {"t": "Q", "jp": "だれと　やまに　のぼりましたか。"}, {"t": "A", "jp": "ともだちと　のぼりました。", "vn": "Leo với bạn."}, {"t": "Q", "jp": "にちようび、どこかへ　いきましたか。"}, {"t": "A", "jp": "いいえ、どこへも　いきませんでした。うちで　テレビを　みました。", "vn": "Không đi đâu. Ở nhà xem TV."}, {"t": "Q", "jp": "きのう、どうして　がっこうへ　いきませんでしたか。"}, {"t": "A", "jp": "あめでしたから、いきませんでした。", "vn": "Vì trời mưa nên không đi."}, {"t": "Q", "jp": "あした、どこへ　なにを　しに　いきますか。"}, {"t": "A", "jp": "デパートへ　かいものに　いきます。", "vn": "Đi TTTM mua sắm."}, {"t": "Q", "jp": "だれと　デパートへ　いきますか。"}, {"t": "A", "jp": "かぞくと　いきます。", "vn": "Đi với gia đình."}, {"t": "Q", "jp": "にちようびは　どうでしたか。"}, {"t": "A", "jp": "あまり　たのしくなかったです。", "vn": "Không vui lắm."}], "imgs": [{"src": "img/p3_diary.jpg", "ans": []}]}, {"no": "Tranh 2 – Bài 6", "title": "Hai khách sạn", "bai": "Đề 10", "items": [{"t": "Q", "jp": "もみじと　さくらと　どちらが　やすいですか。"}, {"t": "A", "jp": "もみじの　ほうが　やすいです。", "vn": "Momiji rẻ hơn."}, {"t": "Q", "jp": "どちらが　えきから　ちかいですか。"}, {"t": "A", "jp": "さくらホテルの　ほうが　ちかいです。", "vn": "Khách sạn Sakura gần ga hơn."}, {"t": "Q", "jp": "さくらホテルは　1ぱく　いくらですか。"}, {"t": "A", "jp": "15,000えんです。", "vn": "15.000 yên một đêm."}, {"t": "Q", "jp": "もみじは　どんな　りょかんですか。"}, {"t": "A", "jp": "ふるくて　しずかな　りょかんです。", "vn": "Là nhà trọ cổ, yên tĩnh."}, {"t": "Q", "jp": "さくらホテルは　どんな　ホテルですか。"}, {"t": "A", "jp": "あたらしくて　おおきい　ホテルです。", "vn": "Là khách sạn mới và to."}], "imgs": [{"src": "img/q_hotel.jpg", "ans": []}]}, {"no": "Tranh 3 – Bài 6", "title": "Xe buýt hay tàu điện", "bai": "Đề 10", "items": [{"t": "Q", "jp": "さくらえきから　しぶやまで　バスで　どのくらいですか。"}, {"t": "A", "jp": "60ぷん　くらいです。", "vn": "Khoảng 60 phút."}, {"t": "Q", "jp": "でんしゃで　どのくらいですか。"}, {"t": "A", "jp": "25ふん　くらいです。", "vn": "Khoảng 25 phút."}, {"t": "Q", "jp": "バスと　でんしゃと　どちらが　はやいですか。"}, {"t": "A", "jp": "でんしゃの　ほうが　はやいです。", "vn": "Tàu điện nhanh hơn."}, {"t": "Q", "jp": "しぶやまで　なんで　いきますか。"}, {"t": "A", "jp": "でんしゃで　いきます。", "vn": "Đi bằng tàu điện."}], "imgs": [{"src": "img/q_trans.jpg", "ans": []}]}], "self": {"no": "Câu hỏi không tranh", "title": "giảng viên chọn 1 câu – trả lời theo thông tin thật, đáp án chỉ là mẫu", "bai": "Đề 10", "items": [{"t": "Q", "jp": "Aさんは　おかねが　たくさん　あります。なにを　したいですか。"}, {"t": "A", "jp": "りょこうしたいです。", "vn": "Tôi muốn đi du lịch."}, {"t": "Q", "jp": "こんばん、いっしょに　ごはんを　たべませんか。"}, {"t": "A", "jp": "はい、いいですね。たべましょう。", "vn": "Hay đấy, ăn thôi."}, {"t": "Q", "jp": "1ねんで　いつが　いちばん　さむいですか。"}, {"t": "A", "jp": "12がつが　いちばん　さむいです。", "vn": "Tháng 12 lạnh nhất."}]}}], "guide": "<h3>1. Đề thi nói JPD123 gồm những gì?</h3>\n<p>Dựa trên đề mẫu &quot;JPD123 SPEAKING DEMO&quot; (Đề A-0), bài thi nói có 2 phần:</p>\n<div class=\"tw\"><table><tr><th class=\"jp\">Phần</th><th class=\"jp\">Nội dung</th><th class=\"jp\">Bạn phải làm gì</th></tr><tr><td class=\"jp\">Part 1: Reading</td><td class=\"jp\">1 đoạn văn khoảng 6 câu (du lịch, thành phố, sinh hoạt…)</td><td class=\"jp\">Đọc to, rõ, đúng âm dài/âm ngắt. Giảng viên có thể hỏi lại 1–2 câu về nội dung.</td></tr><tr><td class=\"jp\">Part 2: Q&amp;A</td><td class=\"jp\">3 câu hỏi, rút ra từ danh sách 34 câu của Bài 4–7</td><td class=\"jp\">Nghe câu hỏi → trả lời thành câu đầy đủ. Có câu kèm tranh (trả lời theo tranh), có câu hỏi về bản thân (trả lời theo thực tế).</td></tr></table></div>\n<p>Ba câu hỏi trong đề mẫu: ① ハノイからホーチミンまでどのくらいですか。（có tranh） ② 今、何が欲しいですか。（không tranh） ③ 春と夏とどちらが好きですか。（không tranh）</p>\n<h3>2. Hai kiểu câu hỏi – cách xử lý khác nhau</h3>\n<ul><li><b>Có tranh</b>: nhìn tranh để lấy thông tin (địa điểm, phương tiện, thời gian, ai đang làm gì…). KHÔNG trả lời theo ý mình – tranh nói gì thì trả lời đó.</li>\n<li><b>Không tranh</b>: giảng viên hỏi về chính bạn (thành phố của bạn, hôm qua bạn làm gì, bạn muốn gì…). Trả lời theo thực tế – nhưng nên chuẩn bị sẵn câu trả lời (xem tab Của tôi) để không bị bí.</li>\n<li>Ghi chú trong slide của cô: &quot;nhại ĐT!&quot; = <b>nhại lại động từ</b> trong câu hỏi. Câu hỏi dùng động từ gì, thì trả lời dùng đúng động từ đó (đổi か thành 。).</li>\n</ul><h3>3. Công thức trả lời &quot;ăn điểm&quot;</h3>\n<div class=\"m\">Trả lời ĐỦ CÂU = (はい／いいえ) + lặp lại cấu trúc câu hỏi + thông tin mới</div>\n<ul><li>Hỏi: きのう、どこかへ行きましたか。 → Đừng chỉ nói「はい。」 → Nói: はい、ともだちとデパートへ行きました。</li>\n<li>Hỏi: Aさんのまちはどんなところですか。 → Đừng chỉ nói「しずかです。」 → Nói: わたしのまちはしずかなところです。</li>\n<li>Muốn điểm cao hơn: thêm 1 câu bổ sung bằng そして／〜が、〜／〜から. Ví dụ: わたしのまちはしずかなところです。そして、みどりがおおいです。</li>\n<li>Nghe không rõ: nói もういちど おねがいします。（Xin hãy nói lại một lần nữa）– không bị trừ điểm như im lặng.</li>\n</ul><h3>4. 10 lỗi hay bị trừ điểm</h3>\n<div class=\"tw\"><table><tr><th class=\"jp\">#</th><th class=\"jp\">Lỗi</th><th class=\"jp\">Sai ✗</th><th class=\"jp\">Đúng ✓</th></tr><tr><td class=\"jp\">1</td><td class=\"jp\">Hỏi quá khứ, trả lời hiện tại</td><td class=\"jp\">きのう、えいがを見ます。</td><td class=\"jp\">きのう、えいがを見ました。</td></tr><tr><td class=\"jp\">2</td><td class=\"jp\">Quên phủ định quá khứ</td><td class=\"jp\">どこへも行きません。（hỏi về hôm qua）</td><td class=\"jp\">どこへも行きませんでした。</td></tr><tr><td class=\"jp\">3</td><td class=\"jp\">Sai trợ từ địa điểm hành động / tồn tại</td><td class=\"jp\">こうえんにサッカーをします。</td><td class=\"jp\">こうえんでサッカーをします。／こうえんにいけがあります。</td></tr><tr><td class=\"jp\">4</td><td class=\"jp\">Dùng あります cho người, con vật</td><td class=\"jp\">いぬはにわにあります。</td><td class=\"jp\">いぬはにわにいます。</td></tr><tr><td class=\"jp\">5</td><td class=\"jp\">Tính từ な khi bổ nghĩa danh từ quên な</td><td class=\"jp\">しずかところです。</td><td class=\"jp\">しずかなところです。</td></tr><tr><td class=\"jp\">6</td><td class=\"jp\">Phủ định tính từ い sai</td><td class=\"jp\">おおきいじゃありません。</td><td class=\"jp\">おおきくないです。</td></tr><tr><td class=\"jp\">7</td><td class=\"jp\">いい phủ định sai</td><td class=\"jp\">いくないです。</td><td class=\"jp\">よくないです。</td></tr><tr><td class=\"jp\">8</td><td class=\"jp\">Trả lời どちら quên のほうが</td><td class=\"jp\">サッカーがおもしろいです。</td><td class=\"jp\">サッカーのほうがおもしろいです。</td></tr><tr><td class=\"jp\">9</td><td class=\"jp\">Nghi vấn từ + か mà không trả lời はい／いいえ</td><td class=\"jp\">（どこかへ行きましたか）デパートへ行きました。</td><td class=\"jp\">はい、デパートへ行きました。</td></tr><tr><td class=\"jp\">10</td><td class=\"jp\">Rủ rê bằng ませんか nhưng từ chối cụt</td><td class=\"jp\">いいえ。</td><td class=\"jp\">すみません、ちょっと…。ようじがありますから。</td></tr></table></div>\n<h3>5. Lịch ôn đề xuất (7 ngày)</h3>\n<div class=\"tw\"><table><tr><th class=\"jp\">Ngày</th><th class=\"jp\">Việc cần làm</th></tr><tr><td class=\"jp\">1</td><td class=\"jp\">Đọc tab Cách thi + Từ vựng. Học thuộc bảng chia tính từ/động từ.</td></tr><tr><td class=\"jp\">2</td><td class=\"jp\">Tab Câu hỏi – Bài 4 (9 câu). Tự nói to từng câu, có tranh + không tranh.</td></tr><tr><td class=\"jp\">3</td><td class=\"jp\">Tab Câu hỏi – Bài 5 (8 câu).</td></tr><tr><td class=\"jp\">4</td><td class=\"jp\">Tab Câu hỏi – Bài 6 (8 câu).</td></tr><tr><td class=\"jp\">5</td><td class=\"jp\">Tab Câu hỏi – Bài 7 (9 câu) + tab Hỏi nhanh.</td></tr><tr><td class=\"jp\">6</td><td class=\"jp\">Tab Luyện đọc: mỗi bài đọc to 2 lần, bấm giờ. Điền tab Của tôi rồi học thuộc.</td></tr><tr><td class=\"jp\">7</td><td class=\"jp\">Làm 5 đề thi thử ở tab Thi thử: nhờ bạn hỏi, tự ghi âm, nghe lại và sửa.</td></tr></table></div>", "vocab": "<p>Từ vựng chọn theo những gì hay xuất hiện trong 34 câu hỏi (đối chiếu &quot;Tổng hợp ngữ pháp từ vựng JPD123&quot;).</p>\n<h3>1. Địa điểm – công trình</h3>\n<div class=\"tw\"><table><tr><th class=\"jp\">Tiếng Nhật</th><th class=\"jp\">Nghĩa</th><th class=\"jp\">Tiếng Nhật</th><th class=\"jp\">Nghĩa</th></tr><tr><td class=\"jp\">まち（町）</td><td class=\"jp\">thị trấn, thành phố</td><td class=\"jp\">くに（国）</td><td class=\"jp\">đất nước</td></tr><tr><td class=\"jp\">えき（駅）</td><td class=\"jp\">nhà ga</td><td class=\"jp\">こうえん（公園）</td><td class=\"jp\">công viên</td></tr><tr><td class=\"jp\">おてら（お寺）</td><td class=\"jp\">chùa</td><td class=\"jp\">きょうかい（教会）</td><td class=\"jp\">nhà thờ</td></tr><tr><td class=\"jp\">じんじゃ（神社）</td><td class=\"jp\">đền thờ</td><td class=\"jp\">おしろ（お城）</td><td class=\"jp\">lâu đài</td></tr><tr><td class=\"jp\">やま（山）</td><td class=\"jp\">núi</td><td class=\"jp\">かわ（川）</td><td class=\"jp\">sông</td></tr><tr><td class=\"jp\">うみ（海）</td><td class=\"jp\">biển</td><td class=\"jp\">おんせん（温泉）</td><td class=\"jp\">suối nước nóng</td></tr><tr><td class=\"jp\">デパート</td><td class=\"jp\">trung tâm thương mại</td><td class=\"jp\">スーパー</td><td class=\"jp\">siêu thị</td></tr><tr><td class=\"jp\">コンビニ</td><td class=\"jp\">cửa hàng tiện lợi</td><td class=\"jp\">ぎんこう（銀行）</td><td class=\"jp\">ngân hàng</td></tr><tr><td class=\"jp\">ゆうびんきょく（郵便局）</td><td class=\"jp\">bưu điện</td><td class=\"jp\">こうばん（交番）</td><td class=\"jp\">đồn cảnh sát</td></tr><tr><td class=\"jp\">としょかん（図書館）</td><td class=\"jp\">thư viện</td><td class=\"jp\">びじゅつかん（美術館）</td><td class=\"jp\">bảo tàng mỹ thuật</td></tr><tr><td class=\"jp\">えいがかん（映画館）</td><td class=\"jp\">rạp chiếu phim</td><td class=\"jp\">きっさてん（喫茶店）</td><td class=\"jp\">quán cà phê</td></tr><tr><td class=\"jp\">レストラン</td><td class=\"jp\">nhà hàng</td><td class=\"jp\">ほんや（本屋）</td><td class=\"jp\">hiệu sách</td></tr><tr><td class=\"jp\">ビル</td><td class=\"jp\">toà nhà</td><td class=\"jp\">にわ（庭）</td><td class=\"jp\">vườn</td></tr><tr><td class=\"jp\">へや（部屋）</td><td class=\"jp\">căn phòng</td><td class=\"jp\">だいどころ（台所）</td><td class=\"jp\">nhà bếp</td></tr></table></div>\n<h3>2. Phương tiện &amp; thời gian</h3>\n<div class=\"tw\"><table><tr><th class=\"jp\">Tiếng Nhật</th><th class=\"jp\">Nghĩa</th><th class=\"jp\">Tiếng Nhật</th><th class=\"jp\">Nghĩa</th></tr><tr><td class=\"jp\">ひこうき（飛行機）で</td><td class=\"jp\">bằng máy bay</td><td class=\"jp\">しんかんせん（新幹線）で</td><td class=\"jp\">bằng tàu siêu tốc</td></tr><tr><td class=\"jp\">でんしゃ（電車）で</td><td class=\"jp\">bằng tàu điện</td><td class=\"jp\">バスで</td><td class=\"jp\">bằng xe buýt</td></tr><tr><td class=\"jp\">くるま（車）で</td><td class=\"jp\">bằng ô tô</td><td class=\"jp\">バイクで</td><td class=\"jp\">bằng xe máy</td></tr><tr><td class=\"jp\">じてんしゃ（自転車）で</td><td class=\"jp\">bằng xe đạp</td><td class=\"jp\">あるいて（歩いて）</td><td class=\"jp\">đi bộ (không có で)</td></tr><tr><td class=\"jp\">〜じかん（時間）</td><td class=\"jp\">〜 tiếng</td><td class=\"jp\">〜ふん／ぷん（分）</td><td class=\"jp\">〜 phút</td></tr><tr><td class=\"jp\">〜じかんはん（時間半）</td><td class=\"jp\">〜 tiếng rưỡi</td><td class=\"jp\">〜くらい</td><td class=\"jp\">khoảng 〜</td></tr><tr><td class=\"jp\">きのう（昨日）</td><td class=\"jp\">hôm qua</td><td class=\"jp\">おととい</td><td class=\"jp\">hôm kia</td></tr><tr><td class=\"jp\">あした（明日）</td><td class=\"jp\">ngày mai</td><td class=\"jp\">あさって</td><td class=\"jp\">ngày kia</td></tr><tr><td class=\"jp\">せんしゅう（先週）</td><td class=\"jp\">tuần trước</td><td class=\"jp\">らいしゅう（来週）</td><td class=\"jp\">tuần sau</td></tr><tr><td class=\"jp\">こんしゅう（今週）</td><td class=\"jp\">tuần này</td><td class=\"jp\">しゅうまつ（週末）</td><td class=\"jp\">cuối tuần</td></tr><tr><td class=\"jp\">こんばん（今晩）</td><td class=\"jp\">tối nay</td><td class=\"jp\">けさ（今朝）</td><td class=\"jp\">sáng nay</td></tr><tr><td class=\"jp\">せんげつ（先月）</td><td class=\"jp\">tháng trước</td><td class=\"jp\">きょねん（去年）</td><td class=\"jp\">năm ngoái</td></tr></table></div>\n<div class=\"tw\"><table><tr><th class=\"jp\">Số</th><th class=\"jp\">時間 (tiếng)</th><th class=\"jp\">分 (phút)</th><th class=\"jp\">月 (tháng)</th><th class=\"jp\">日 (ngày)</th></tr><tr><td class=\"jp\">1</td><td class=\"jp\">いちじかん</td><td class=\"jp\">いっぷん</td><td class=\"jp\">いちがつ</td><td class=\"jp\">ついたち</td></tr><tr><td class=\"jp\">2</td><td class=\"jp\">にじかん</td><td class=\"jp\">にふん</td><td class=\"jp\">にがつ</td><td class=\"jp\">ふつか</td></tr><tr><td class=\"jp\">3</td><td class=\"jp\">さんじかん</td><td class=\"jp\">さんぷん</td><td class=\"jp\">さんがつ</td><td class=\"jp\">みっか</td></tr><tr><td class=\"jp\">4</td><td class=\"jp\">よじかん</td><td class=\"jp\">よんぷん</td><td class=\"jp\">しがつ</td><td class=\"jp\">よっか</td></tr><tr><td class=\"jp\">5</td><td class=\"jp\">ごじかん</td><td class=\"jp\">ごふん</td><td class=\"jp\">ごがつ</td><td class=\"jp\">いつか</td></tr><tr><td class=\"jp\">6</td><td class=\"jp\">ろくじかん</td><td class=\"jp\">ろっぷん</td><td class=\"jp\">ろくがつ</td><td class=\"jp\">むいか</td></tr><tr><td class=\"jp\">7</td><td class=\"jp\">しちじかん</td><td class=\"jp\">ななふん</td><td class=\"jp\">しちがつ</td><td class=\"jp\">なのか</td></tr><tr><td class=\"jp\">8</td><td class=\"jp\">はちじかん</td><td class=\"jp\">はっぷん</td><td class=\"jp\">はちがつ</td><td class=\"jp\">ようか</td></tr><tr><td class=\"jp\">9</td><td class=\"jp\">くじかん</td><td class=\"jp\">きゅうふん</td><td class=\"jp\">くがつ</td><td class=\"jp\">ここのか</td></tr><tr><td class=\"jp\">10</td><td class=\"jp\">じゅうじかん</td><td class=\"jp\">じゅっぷん</td><td class=\"jp\">じゅうがつ</td><td class=\"jp\">とおか</td></tr><tr><td class=\"jp\">20</td><td class=\"jp\">にじゅうじかん</td><td class=\"jp\">にじゅっぷん</td><td class=\"jp\">—</td><td class=\"jp\">はつか</td></tr></table></div>\n<h3>3. Tính từ hay dùng</h3>\n<div class=\"tw\"><table><tr><th class=\"jp\">Tính từ い</th><th class=\"jp\">Nghĩa</th><th class=\"jp\">Tính từ な</th><th class=\"jp\">Nghĩa</th></tr><tr><td class=\"jp\">おおきい／ちいさい</td><td class=\"jp\">to / nhỏ</td><td class=\"jp\">にぎやか</td><td class=\"jp\">nhộn nhịp</td></tr><tr><td class=\"jp\">あたらしい／ふるい</td><td class=\"jp\">mới / cũ</td><td class=\"jp\">しずか</td><td class=\"jp\">yên tĩnh</td></tr><tr><td class=\"jp\">たかい／ひくい</td><td class=\"jp\">cao / thấp</td><td class=\"jp\">きれい</td><td class=\"jp\">đẹp, sạch</td></tr><tr><td class=\"jp\">たかい／やすい</td><td class=\"jp\">đắt / rẻ</td><td class=\"jp\">ゆうめい</td><td class=\"jp\">nổi tiếng</td></tr><tr><td class=\"jp\">おおい／すくない</td><td class=\"jp\">nhiều / ít</td><td class=\"jp\">ひま</td><td class=\"jp\">rảnh</td></tr><tr><td class=\"jp\">あつい／さむい</td><td class=\"jp\">nóng / lạnh (thời tiết)</td><td class=\"jp\">すき／きらい</td><td class=\"jp\">thích / ghét</td></tr><tr><td class=\"jp\">あたたかい／すずしい</td><td class=\"jp\">ấm / mát</td><td class=\"jp\">じょうず／へた</td><td class=\"jp\">giỏi / kém</td></tr><tr><td class=\"jp\">おいしい／まずい</td><td class=\"jp\">ngon / dở</td><td class=\"jp\">たいへん</td><td class=\"jp\">vất vả</td></tr><tr><td class=\"jp\">おもしろい／つまらない</td><td class=\"jp\">thú vị / chán</td><td class=\"jp\">かんたん</td><td class=\"jp\">đơn giản</td></tr><tr><td class=\"jp\">いそがしい</td><td class=\"jp\">bận</td><td class=\"jp\">げんき</td><td class=\"jp\">khoẻ</td></tr><tr><td class=\"jp\">むずかしい／やさしい</td><td class=\"jp\">khó / dễ</td><td class=\"jp\">べんり</td><td class=\"jp\">tiện lợi</td></tr><tr><td class=\"jp\">たのしい</td><td class=\"jp\">vui</td><td class=\"jp\">すてき</td><td class=\"jp\">tuyệt vời</td></tr><tr><td class=\"jp\">いい（よい）</td><td class=\"jp\">tốt</td><td class=\"jp\"></td><td class=\"jp\"></td></tr></table></div>\n<div class=\"tw\"><table><tr><th class=\"jp\"></th><th class=\"jp\">Hiện tại khẳng định</th><th class=\"jp\">Hiện tại phủ định</th><th class=\"jp\">Quá khứ khẳng định</th><th class=\"jp\">Quá khứ phủ định</th></tr><tr><td class=\"jp\">Aい</td><td class=\"jp\">おおきいです</td><td class=\"jp\">おおきくないです</td><td class=\"jp\">おおきかったです</td><td class=\"jp\">おおきくなかったです</td></tr><tr><td class=\"jp\">いい</td><td class=\"jp\">いいです</td><td class=\"jp\">よくないです</td><td class=\"jp\">よかったです</td><td class=\"jp\">よくなかったです</td></tr><tr><td class=\"jp\">Aな</td><td class=\"jp\">しずかです</td><td class=\"jp\">しずかじゃありません</td><td class=\"jp\">しずかでした</td><td class=\"jp\">しずかじゃありませんでした</td></tr><tr><td class=\"jp\">N</td><td class=\"jp\">あめです</td><td class=\"jp\">あめじゃありません</td><td class=\"jp\">あめでした</td><td class=\"jp\">あめじゃありませんでした</td></tr></table></div>\n<h3>4. Động từ hay dùng + thể て</h3>\n<div class=\"tw\"><table><tr><th class=\"jp\">V ます</th><th class=\"jp\">Nghĩa</th><th class=\"jp\">V て</th><th class=\"jp\">V ます</th><th class=\"jp\">Nghĩa</th><th class=\"jp\">V て</th></tr><tr><td class=\"jp\">いきます</td><td class=\"jp\">đi</td><td class=\"jp\">いって ★</td><td class=\"jp\">かいます</td><td class=\"jp\">mua</td><td class=\"jp\">かって</td></tr><tr><td class=\"jp\">きます</td><td class=\"jp\">đến</td><td class=\"jp\">きて</td><td class=\"jp\">あいます</td><td class=\"jp\">gặp</td><td class=\"jp\">あって</td></tr><tr><td class=\"jp\">かえります</td><td class=\"jp\">về</td><td class=\"jp\">かえって</td><td class=\"jp\">のみます</td><td class=\"jp\">uống</td><td class=\"jp\">のんで</td></tr><tr><td class=\"jp\">たべます</td><td class=\"jp\">ăn</td><td class=\"jp\">たべて</td><td class=\"jp\">よみます</td><td class=\"jp\">đọc</td><td class=\"jp\">よんで</td></tr><tr><td class=\"jp\">みます</td><td class=\"jp\">xem</td><td class=\"jp\">みて</td><td class=\"jp\">ききます</td><td class=\"jp\">nghe</td><td class=\"jp\">きいて</td></tr><tr><td class=\"jp\">します</td><td class=\"jp\">làm</td><td class=\"jp\">して</td><td class=\"jp\">かきます</td><td class=\"jp\">viết</td><td class=\"jp\">かいて</td></tr><tr><td class=\"jp\">べんきょうします</td><td class=\"jp\">học</td><td class=\"jp\">べんきょうして</td><td class=\"jp\">はなします</td><td class=\"jp\">nói chuyện</td><td class=\"jp\">はなして</td></tr><tr><td class=\"jp\">かいものします</td><td class=\"jp\">mua sắm</td><td class=\"jp\">かいものして</td><td class=\"jp\">すいます</td><td class=\"jp\">hút (thuốc)</td><td class=\"jp\">すって</td></tr><tr><td class=\"jp\">しょくじします</td><td class=\"jp\">dùng bữa</td><td class=\"jp\">しょくじして</td><td class=\"jp\">とります</td><td class=\"jp\">chụp (ảnh)</td><td class=\"jp\">とって</td> function migratePictureProgress(progress, previousOrder, currentOrder) {
  const migrated = {};
  for (const [key, value] of Object.entries(progress || {})) {
    if (!value || !/^\d+$/.test(key)) continue;
    const id = previousOrder[Number(key)];
    const next = id ? currentOrder.indexOf(id) : -1;
    if (next >= 0) migrated[next] = value;
  }
  return migrated;
}

/* ---------- exam ---------- */
let E=null,tmr=null;
const fmt=ms=>{const t=Math.max(0,Math.ceil(ms/1000));return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
function clockHTML(){return `<span class="timer ${E&&E.end-Date.now()<60000?'low':''}" id="tm" aria-live="off" title="Thời gian còn lại">${fmt(E.end-Date.now())}</span>`}
function startClock(){clearInterval(tmr);tmr=setInterval(()=>{if(!E||route!=='exam'){clearInterval(tmr);return}
  const left=E.end-Date.now(),t=$('#tm');if(t){t.textContent=fmt(left);t.classList.toggle('low',left<60000)}
  if(left<=0&&E.step<=E.pics.length){E.timeout=true;E.step=E.pics.length+1;clearInterval(tmr);examView()}},250)}
const sh=a=>a.sort(()=>Math.random()-.5);
function selfQs(n){return sh(D.q34.filter(c=>c.q&&c.np).map(c=>[{t:'Q',jp:c.q},c.items[0]||{}])).slice(0,n)}
function selfQs(n){return sh(D.q34.filter(c=>c.q&&c.np).map(c=>[{t:'Q',jp:c.q},c.items[0]||{}])).slice(0,n)}
function buildQs(pics,selfPool){
  const withPic=pics.map(p=>({...p,qs:sh(qPairs(p.items)).slice(0,1)}));      // 3 câu có tranh, mỗi tranh 1 câu
  const noPic=selfPool.slice(0,1).map(q=>({no:'',title:'Câu hỏi về bạn',self:true,qs:[q]})); // 1 câu không tranh
  return withPic.concat(noPic)}
function startExam(j){
  clearInterval(tmr);
  if(j<0){const reads=D.exams.map(e=>e.read).concat(D.reads);const pick=b=>{const a=POOL.filter(p=>p.no.includes(b));return a[Math.floor(Math.random()*a.length)]};
    E={idx:-1,title:'Đề ngẫu nhiên',read:reads[Math.floor(Math.random()*reads.length)],pics:buildQs([pick('Bài 4'),pick(Math.random()<.5?'Bài 5':'Bài 6'),pick('Bài 7')],selfQs(1))}}
  else{const e=D.exams[j];E={idx:j,title:e.title,read:e.read,pics:buildQs(e.pics,sh(qPairs(e.self.items)))}}
  E.step=0;E.qi=0;E.ok=0;E.total=E.pics.length;E.miss=[];E.end=Date.now()+6*60*1000;E.timeout=false;startClock();examView()}
function exSteps(){return `<div class="steps" style="margin-bottom:16px">${[0,...E.pics.map((_,k)=>k+1)].map(k=>`<i class="${k<E.step?'done':k===E.step?'on':''}"></i>`).join('')}</div>`}
function examView(){stopSpeech();
  if(E.step===0){
    app.innerHTML=head(`<a href="#exam" onclick="E=null;go('exam');return false">Thi thử</a> / ${esc(E.title)}`,'Part 1 · Reading','Đọc to đoạn văn. Đọc xong bấm Sang Part 2. Cả đề có 6 phút.',clockHTML())+exSteps()+
     `<div class="card"><div class="reading">${esc(E.read.D)}</div><div class="row" style="margin-top:16px"><button class="btn" onclick="$('#kc').hidden=!$('#kc').hidden">${ic('eye')}Cách đọc</button><button class="btn" onclick='speak(${JSON.stringify(E.read.C)})'>${ic('sound')}Nghe mẫu</button><button class="btn" onclick="$('#kv').hidden=!$('#kv').hidden">Nghĩa</button><span style="flex:1"></span><button class="btn acc" onclick="E.step=1;E.qi=0;examView()">Sang Part 2 ${ic('right')}</button></div>
     <div id="kc" class="kana" hidden style="margin-top:14px">${esc(E.read.C)}</div><p id="kv" class="vn" hidden>${esc(E.read.V||'')}</p></div>`;
    return}
  if(E.step>E.pics.length){clearInterval(tmr);if(E.timeout&&!E.missDone){E.missDone=1}const used=fmt(6*60*1000-Math.max(0,E.end-Date.now()));const pct=Math.round(E.ok/E.total*100);if(E.idx>=0){S.exams[E.idx]=Math.max(S.exams[E.idx]||0,pct);persist();shell()}
    app.innerHTML=head('Thi thử',E.timeout?`Hết giờ · ${esc(E.title)}`:`Xong ${esc(E.title)}`,E.timeout?'Hết 6 phút. Các câu chưa trả lời được tính là chưa đúng.':`Thời gian làm bài: ${used} / 6:00`)+`<div class="card"><div class="stat"><span class="vn">Câu trả lời được</span><span class="n">${E.ok}<small> / ${E.total}</small></span><span class="bar"><i style="width:${pct}%"></i></span></div>
     ${E.miss.length?`<h3 style="margin:22px 0 6px">Câu cần ôn lại</h3>${E.miss.map(m=>`<div class="qa"><span class="idx">·</span><div><div class="qq">${esc(m[0].jp)}</div><div class="vn jp">→ ${esc(m[1].jp||'')}</div></div>${sayBtn(m[0].jp)}</div>`).join('')}`:''}
     <div class="row" style="margin-top:18px"><button class="btn acc" onclick="startExam(-1)">${ic('dice')}Bốc đề khác</button><button class="btn" onclick="E=null;go('exam')">Về danh sách đề</button></div></div>`;return}
  const p=E.pics[E.step-1],[q,a]=p.qs[E.qi];
  app.innerHTML=head(`<a href="#exam" onclick="E=null;go('exam');return false">Thi thử</a> / ${esc(E.title)}`,`Part 2 · Câu ${E.step} / ${E.pics.length}`,p.self?'Không có tranh – trả lời theo thông tin thật của bạn.':esc(p.title),(p.self?'<span class="chip warn">Không tranh</span>':`<span class="chip">Có tranh · ${esc(baiOf(p.no||''))}</span>`)+clockHTML())+exSteps()+
   `<div class="${p.self?'':'split'}">${p.self?'':`<div><img class="pic" src="${p.imgs[0].src}" alt="" onclick="zoom('${p.imgs[0].src}')"></div>`}
   <div class="card"><div class="row"><button class="btn pri" onclick='speak(${JSON.stringify(q.jp)})'>${ic('sound')}Nghe câu hỏi</button><button class="btn" onclick="$('#eq').hidden=!$('#eq').hidden">${ic('eye')}Hiện chữ</button></div>
    <div id="eq" class="qbig" hidden style="margin-top:14px">${esc(q.jp)}</div>
    <button class="btn" style="margin-top:16px" onclick="$('#ea').hidden=false;$('#eq').hidden=false;this.remove()">Xem đáp án</button>
    <div id="ea" hidden style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line)"><div class="jp" style="font-size:19px">→ ${esc(a.jp||'')}</div><div class="vn">${esc(a.vn||'')}</div>
     <div class="verdict" style="margin-top:16px;justify-content:flex-start"><button class="btn" onclick="E.miss.push(E.pics[E.step-1].qs[E.qi]);nextQ()">${ic('x')}Chưa đúng</button><button class="btn acc" onclick="E.ok++;nextQ()">${ic('check')}Trả lời được</button></div></div></div></div>`;
  
}
function nextQ(){const p=E.pics[E.step-1];if(E.qi<p.qs.length-1)E.qi++;else{E.step++;E.qi=0}examView();scrollTo(0,0)}
VIEWS.exam=()=>{
  if(E){examView();return}
  app.innerHTML=head('Kiểm tra','Thi thử','Giống đề thật, 6 phút cho cả đề: Part 1 đọc to 1 đoạn văn, Part 2 trả lời 4 câu hỏi – 3 câu nhìn tranh (mỗi tranh 1 câu) và 1 câu hỏi về bạn (không tranh). Câu hỏi bốc ngẫu nhiên nên mỗi lần làm lại sẽ khác. Sau mỗi câu bạn tự chấm; điểm cao nhất được lưu lại.',`<button class="btn acc" onclick="startExam(-1)">${ic('dice')}Bốc đề ngẫu nhiên</button>`)+
   `<div class="grid g4">${D.exams.map((e,j)=>{const sc=S.exams[j];return `<button class="tile ${sc!==undefined?'done':''}" onclick="startExam(${j})"><img class="thumb" loading="lazy" src="${e.pics[0].imgs[0].src}" alt=""><div class="row" style="justify-content:space-between"><span class="t">${esc(e.title)}</span>${sc!==undefined?`<span class="chip ${sc>=80?'ok':'warn'}">${sc}%</span>`:''}</div><span class="vn">${e.pics.map(p=>esc(p.title)).join(' · ')}</span></button>`}).join('')}</div>
   <div class="card" style="margin-top:18px"><h3>Mẹo khi vào phòng thi</h3><ul style="margin:10px 0 0;padding-left:20px"><li>Trả lời đủ câu: lặp lại cấu trúc câu hỏi rồi thêm thông tin mới.</li><li>Hỏi quá khứ thì trả lời 〜ました／〜ませんでした.</li><li>Nghe không rõ, nói <span class="jp">もういちど おねがいします。</span></li></ul></div>`;
};

/* ---------- mine ---------- */
let npF='all';
VIEWS.mine=()=>{
  const list=D.q34.filter(c=>c.np&&(npF==='all'||baiOf(c.bai)===npF));
  app.innerHTML=head('Kiểm tra','Câu hỏi không tranh',`${D.q34.filter(c=>c.np).length} câu giảng viên hỏi về chính bạn – trong đề thi là câu thứ 4 (không có tranh). Nghe câu hỏi, xem đáp án mẫu, rồi viết câu trả lời thật của bạn vào ô để học thuộc. Câu bạn viết được lưu trong trình duyệt này.`)+
   `<div class="seg" style="margin-bottom:16px">${[['all','Tất cả'],...BAI.map(b=>[b,b])].map(([k,l])=>`<button class="${npF===k?'on':''}" onclick="npF='${k}';VIEWS.mine()">${l}</button>`).join('')}</div>
   <div class="card">${list.map(c=>{const k=c.no.split(' ')[0],a=c.items[0]||{};return `<div class="mine">
    <div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div><div class="row"><span class="no">${esc(k)}</span>${/bổ sung/.test(c.no)?'<span class="chip warn">bổ sung</span>':''}${c.thu?'<span class="chip">★ cô Thu</span>':''}</div>
     <div class="qbig" style="font-size:20px">${esc(c.q)}</div><div class="vn">${esc(c.qv||'')}</div></div>${sayBtn(c.q,'Nghe câu hỏi')}</div>
    ${c.m?`<div class="formula">${esc(c.m)}</div>`:''}
    <div class="hidden-ans blur" onclick="unblur(this)" style="font-size:16px"><div>Mẫu: ${esc(a.jp||'')}</div><div class="vn">${esc(a.vn||'')}</div></div>
    <div class="row" style="flex-wrap:nowrap;align-items:flex-start"><label for="np${esc(k)}" hidden>Câu trả lời ${esc(k)}</label><textarea id="np${esc(k)}" oninput="S.mine['${esc(k)}']=this.value;persist()" placeholder="Câu trả lời của bạn…">${esc(S.mine[k]||'')}</textarea><button class="icon" aria-label="Nghe câu của tôi" onclick="speak(document.getElementById('np${esc(k)}').value||'')">${ic('sound')}</button></div></div>`}).join('')}</div>`;
};

let start='home';try{const h=location.hash.slice(1);if(VIEWS[h])start=h}catch(e){}
go(start);
</script></body></html>
